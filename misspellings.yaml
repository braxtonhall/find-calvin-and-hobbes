# Misspellings: words a reader writes wrong so often, or so reasonably, that the search should take
# them as the word itself. `suzie` would otherwise find Susie only as a guess at a spelling, weaker
# than the word and lost inside quotation marks; listed here, it is indexed and searched as `susie`,
# an exact match either way.
#
# Each word as the archive spells it, with a list of the ways it is misspelled: lowercase, one word
# each, and every misspelling listed once. A word cannot itself be another's misspelling.
#
# Optional. Without this file, the search still forgives a near miss, just not as the word itself.

# Names.
susie: [suzie]
rosalyn: [roslyn, rosalin]
tyrannosaurus: [tyranosaurus]

# British spellings of the words the archive writes American.
color: [colour]
colors: [colours]
