<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- `resizes-content` has Chrome shrink the layout viewport for the software keyboard, which
		is the half of the keyboard problem a browser can solve for us. iOS Safari ignores it, so
		`placement.ts` measures the visual viewport rather than relying on this. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
		<title>Find Calvin and Hobbes</title>
		<link rel="icon" type="image/png" href="https://static.wikitide.net/calvinandhobbeswiki/f/f3/CalvinAndHobbes.png" />
		<meta name="theme-color" content="#f6b213" />
		<meta
			name="description"
			content="Search the complete Calvin and Hobbes archive. Browse every comic strip from 1985 to 1995."
		/>
		<meta property="og:title" content="Find Calvin and Hobbes" />
		<meta
			property="og:description"
			content="Search the complete Calvin and Hobbes archive. Browse every comic strip from 1985 to 1995."
		/>
		<meta
			property="og:image"
			content="https://upload.wikimedia.org/wikipedia/commons/9/96/Calvin_and_Hobbes_title.png"
		/>
		<% if (siteUrl) { %>
		<meta property="og:url" content="<%= siteUrl %>/" />
		<% } %>
		<meta name="twitter:card" content="summary" />
	</head>
	<body>
		<a href="#main" class="skip-link">Skip to content</a>

		<div id="loading" class="hidden">
			<div class="spinner"></div>
		</div>

		<button class="mobile-grid-toggle" id="mobile-grid-toggle" aria-label="Toggle calendar grid">
			<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
				<rect x="1" y="1" width="8" height="8" rx="2" fill="currentColor" />
				<rect x="11" y="1" width="8" height="8" rx="2" fill="currentColor" />
				<rect x="1" y="11" width="8" height="8" rx="2" fill="currentColor" />
				<rect x="11" y="11" width="8" height="8" rx="2" fill="currentColor" />
			</svg>
		</button>
		<div class="mobile-overlay" id="mobile-overlay"></div>

		<aside id="sidebar">
			<div id="grid-container">
				<div class="grid-header-row" aria-hidden="true">
					<div class="grid-header">M</div>
					<div class="grid-header">T</div>
					<div class="grid-header">W</div>
					<div class="grid-header">T</div>
					<div class="grid-header">F</div>
					<div class="grid-header">S</div>
					<div class="grid-header">S</div>
				</div>
				<div class="grid-layout" id="grid-layout"></div>
			</div>
			<nav id="year-rail" aria-label="Jump to year"></nav>
		</aside>

		<main id="main">
			<div id="view-landing" class="view active"></div>
			<div id="view-results" class="view"></div>
			<div id="view-detail" class="view"></div>
			<div id="view-collection" class="view"></div>
			<div id="view-credits" class="view"></div>
		</main>

		<noscript>
			<div style="padding: 40px; text-align: center; font-family: sans-serif">
				<h1>JavaScript Required</h1>
				<p>This page requires JavaScript to search the Calvin and Hobbes archive.</p>
			</div>
		</noscript>
	</body>
</html>
