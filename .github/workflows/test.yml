name: test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: install node 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: install packages
        run: yarn install

      - name: test
        run: yarn test

      - name: build
        run: yarn build
