name: publish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: install node 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: install packages
        run: yarn install

      - name: test
        run: yarn test

      - name: check site url
        run: |
          if [ -z "${{ vars.SITE_URL }}" ]; then
            echo "::error::SITE_URL is not set. Add it under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      - name: build
        run: yarn build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
