name: publish

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: install node 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: install packages
        run: yarn install

      - name: test
        run: yarn test

      - name: check site url
        run: |
          if [ -z "${{ vars.SITE_URL }}" ]; then
            echo "::error::SITE_URL is not set. Add it under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      - name: build
        run: yarn build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v5
