# Compound words: `goodnight` and `good night` are one phrase to a reader and two unrelated words to
# the search, which is how `say goodnight to hobbes` misses a strip that writes it open. A compound
# listed here is indexed and searched as its parts, so either spelling finds both.
#
# Optional. Without this file the search still splits a closed word wherever the archive itself
# writes it open at least as often (`goodnight` -> `good night` above), and nothing else.

# Real words that rule would split wrongly, kept whole. A character's name matters most: splitting
# `wormwood` into `worm` + `wood` would scatter every strip that mentions him.
keepWhole:
  - washer # was her
  - theirs # the irs
  - programmed # pro grammed
  - wormwood
  - herewith
  - outback
  # The open bigram is a clause — "the sun set behind the hill" — not another spelling of the noun.
  - sunset
  - aaaaaa
  - yowwow
  - zzzzzzzz

# Compounds split by hand, as `whole: its parts`: mostly ones the archive writes closed, which the
# rule leaves whole. Grouped by the spelling the archive prefers, which is recorded but does not
# change how either spelling is matched:
#
#   closed    written closed more often than open (`snowball`)
#   balanced  written each way as often
#   open      written open more often
#
# `yarn candidates` lists the archive's likely compounds that are in neither list, to add here or
# to `keepWhole`.
