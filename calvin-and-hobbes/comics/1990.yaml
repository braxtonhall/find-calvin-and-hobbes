  "19900326":
    transcript: I'M FREE! I'M FREE! At last! Home sweet ho... Oh no. Hoo hoo! That was a GOOD one! Look how far we landed! A house with a tiger is never home.
    description: Calvin runs off the school bus, yelling that he's free.  He opens the front door.  He stands horrified as he sees what's coming.  Climbing out of the trench they just created, Hobbes cheerily tells Calvin that was a good one.  He tells Calvin to look how far they landed.  Calvin, buried in the dirt, says that a house with a tiger is never a home.
    characters: [calvin, hobbes]
  "19900327":
    transcript: Look at you! How could anyone get so dirty at school? I got this dirty just trying to walk in the front door! Ol' catapult butt was lying in wait for me. Well, it doesn't matter. You'd better get in the tub now anyway. A BATH?! But it's the middle of the afternoon! Yes, but I have to get in the shower before your Dad gets home, so HE can take one. Why all the baths? Is there some epidemic going around? I told you this morning we're going out tonight. Rosalyn will be here at 6:00.
    description: Mom asks Calvin how he could get so dirty at school.  Calvin tells her it wasn't from school that he got dirty.  He says Hobbes was waiting for him.  Mom tells him to take a bath.  Calvin protests because it's the middle of the afternoon.  As Mom pushes Calvin toward the bathroom, she says she has to take a shower so Dad can take one when he gets home.  Calvin wonders if there's some epidemic going around.  Mom reminds Calvin that she told him that morning that she and Dad were going out that night.  Rosalyn will be watching him tonight.  Calvin is horrified.
    characters: [calvin, hobbes, mom, stuffedhobbes]
  "19900328":
    transcript: Look, I know you don't like Rosalyn, but she's the only babysitter I could get. And you remember our talk after what happened LAST time, don't you? I want you on your best behavior tonight.You do exactly what she tells you. I don't want to come home and hear any horror stories, OK? For goodness sake, Calvin! Take a breath before you pass out on the floor!
    description: Calvin yells in anguish throughout the entire strip.  Mom tries to explain to Calvin that she knows he doesn't like Rosalyn, but she's the only person they could get.  Mom reminds Calvin she wants him on his best behavior.  She tells him to do whatever Rosalyn says to, because she doesn't want to hear any horror stories when they return.  Mom tells Calvin to take a breath before he passes out on the floor.
    characters: [calvin, mom]
  "19900329":
    transcript: What are we going to DO, Hobbes? Rosalyn will be here in just a few hours! Do you think she'll remember how you locked her outside last time? If she does, we're dead! She'll probably stick my head on a stake in the front yard as a warning to OTHER kids she baby-sits! I'm almost sure that would violate some zoning ordinance. Well, no matter what, we're in big trouble unless we think of something FAST! I suppose we could try being GOOD. I must've gotten water in my ear. WHAT did you say? Nothing. Forget it.
    description: In the tub, Calvin asks Hobbes what they're going to do since Rosalyn is coming.  Hobbes asks if Rosalyn will remember how they locked her outside last time.  Calvin says she'll probably put his head on a stake in the front yard as a warning.  Hobbes is sure that would violate some zoning ordinance.  Calvin tells Hobbes that they're in trouble unless they think of something fast.  Hobbes suggests they could try being good.  Calvin tells Hobbes he must have gotten some water in his ear.  He asks Hobbes what he said.  Hobbes tells Calvin to forget it.
    characters: [calvin, hobbes]
  "19900330":
    transcript: Hi Rosalyn, come on in. Thanks for coming again. No trouble. Hi Rosalyn! You don't need to worry THIS time. Calvin will be on his best behavior tonight. Even so, I'd like an advance. An advance? But... But... Dear, may I speak with you for a moment? But we GAVE her an advance on tonight when she LEFT last time! I don't care. Just pay what it takes to get us out of here!
    description: Mom invites Rosalyn in.  Dad says Calvin will be on his best behavior, but Rosalyn asks for an advance.  Dad isn't sure about that.  Mom asks to speak with Dad.  Dad tells her Rosalyn asked for an advance on tonight when she left last time.  Mom tells him she doesn't care.  She tells Dad to pay what it takes to get them out of there.
    characters: [mom, dad, rosalyn]
  "19900331":
    transcript: OK, we're going. ... and Calvin? Yes? GCKKHHK! I think I'll sit in the middle of the floor and look at the wall tonight. Good. I'll tell you when it's bedtime.
    description: As Dad leaves, he catches Calvin's attention.  Dad drags a finger across his throat, then closes the door.  Calvin sits on the floor and says he's going to look at the wall tonight.  Rosalyn says she'll tell him when it's bedtime.
    characters: [calvin, dad, rosalyn]
  "19900401":
    transcript: Hmph! Life's disappointments are harder to take when you don't know any swear words. Boy I'm in a rotten mood. The world had just better look out! Hey you, you're in my way! Move it! What's the matter? Did you go deaf?! Get out of my way! Scram! C'mon, hurry up! You think I've got all day?! Now are you going to step aside, or what?! I'm coming through! Mmph! Ggghh! What are you doing?! I said move aside!! Doggone it, when I say move, I expect you to jump! Move! Move! Move! Move! Move! Move! Hey! Put me down! Where are you taking me?! I demand an - explana...hey, is that a mud hole?! You'd better not! You hear me?! See why I'm in such a bad mood??
    description: Calvin is in a bad mood.  Hobbes is lying on the floor in Calvin's path.  Calvin tells him to move.  He asks if Hobbes thinks he has all day.  Hobbes slowly stands up.  Calvin says he's coming through.  He tries pushing Hobbes out of the way.  Calvin says when he says move, he expects Hobbes to jump.  He pushes Hobbes, trying to get him to move.  Hobbes picks Calvin up.  He takes him away.  Calvin demands an explanation, then sees the mud hole.  Calvin is covered in mud.  He yells "See why I'm in such a bad mood".
    characters: [calvin, hobbes]
    source: miraheze
  "19900402":
    transcript: This is awful! If we step out of line ONCE tonight, Rosalyn will kill us, and then Mom and Dad will kill us again when they get home. I guess that's that. What?! Admit defeat? NEVER! Things may look grim for us, but NOTHING is grim for... ...STUPENDOUS MAN! Champion of Liberty! Foe of tyranny! I'm going to get in bed now and avoid the rush.
    description: Calvin tells Hobbes that if they get out of line once, Rosalyn will kill them.  Then, when Mom and Dad return, they'll get killed again.  Hobbes says that's that.  Calvin refuses to admit defeat.  He runs into the closet saying things look grim for them, but not for .....Stupendous Man!  Champion of liberty, foe of tyranny.  Hobbes tells Calvin he's going to get into bed now and avoid the rush.
    characters: [calvin, hobbes, stupendous]
  "19900403":
    transcript: A bolt of fiery crimson streaks across the sky! It's STUPENDOUS MAN! The fiendish baby sitter girl has a local household in her iron grip of terror! The man of mega-might zooms to the rescue! I'm in luck! Baby sitter girl is momentarily distracted! Hi Charlie, it's Rosalyn. Yeah, I'm over at the little monster's house again. Hmm? No, actually he's been pretty good tonight. Yeah, I can't believe it.
    description: Stupendous Man streaks across the sky.  The man of mega-might zooms to the rescue.  Baby sitter girl is momentarily distracted.  Rosalyn is on the phone with her boyfriend, Charlie.  She says she's at the little monster's house again, but that he's been pretty good tonight.  Stupendous Man is creeping up behind her.
    characters: [calvin, rosalyn, stupendous]
  "19900404":
    transcript: Anyway Charlie, I'm sorry we couldn't go out tonight, but this little creep's parents are so desperate to get away from him once in a while that they... YAHH! FREEDOM AND JUSTICE SHALL ALWAYS PREVAIL OVER TYRANNY, BABY SITTER GIRL! Get off me, Calvin, you pest! Ow! Let go! Quit it! STUPENDOUS MAN has the strength of a million mortal men! Give up! Listen Charlie, I'm going to have to call you back. You wouldn't believe what this cretin is wearing. With muscles of magnitude, STUPENDOUS MAN fights with heroic resolve!
    description: Rosalyn is telling Charlie that Calvin's parents are so desperate to get out once in a while.  Stupendous Man leaps up yelling that freedom and justice shall always prevail over tyranny.  He knocks Rosalyn off the chair.  Stupendous Man has the strength of a million mortal men.  He tells Rosalyn to give up.  Rosalyn grabs the phone and tells Charlie she'll have to call him back.  She says he wouldn't believe what the cretin is wearing.  Stupendous Man has a leglock on Rosalyn and says he fights with heroic resolve.
    characters: [calvin, rosalyn, stupendous]
  "19900405":
    transcript: OK Calvin, you want to play rough, huh? Great moons of Neptune! She must have super powers too! You've got TWO seconds to get your caped butt in bed, or I'll put it there for good! Oh no! The evil Amazon is using some psycho-beam to weaken my stupendous will! I'm counting! ONNNNE... *Gasp* I... I... must resist! TWO! In a vermillion flash, STUPENDOUS MAN is in the air!
    description: Rosalyn rolls her sleeves up and asks if Calvin wants to play rough.  Stupendous Man thinks she must have super powers, too.  Rosalyn tells him he has two seconds to get his caped butt in bed, or she'll put it there for good.  Stupendous Man says the evil Amazon is using a psycho-beam to weaken his stupendous will.  Rosalyn starts counting.  Stupendous Man tries to resist.  When Rosalyn says "two", Stupendous Man is off.
    characters: [calvin, rosalyn, stupendous]
  "19900406":
    transcript: With stupendous speed, STUPENDOUS MAN is out the door! All right, Calvin! Where'd you go?! I know you're out here! Your parents told you to BEHAVE tonight, remember?! They're not going to be happy when they hear about THIS! See, if we had bought a dog instead, like I wanted, we could go out like this all the time. Honey, we came here to relax. Let's talk about something else.
    description: Stupendous Man is out the door.  Rosalyn yells out that his parents told him to behave.  She says they're not going to be happy when they hear about this.  Mom and Dad are in the restaurant.  Dad says that if they had bought a dog like he wanted, they could go out like this all the time.  Mom says they came to relax and should talk about something else.
    characters: [calvin, mom, dad, rosalyn, stupendous]
  "19900407":
    transcript: There is no way I'm getting paid enough for this kind of aggravation. How could a kid with such little legs go so fast?! Secure in his secret fortress, STUPENDOUS MAN plans his strategy! Baby sitter girl is no match for STUPENDOUS MAN's stupendous intellect! Calvin, you're in big trouble if you don't come out! You made it back alive! Of course! I made a stupendous dash as soon as Rosalyn went around the house! She STILL doesn't know where I am!
    description: Rosalyn is outside with a flashlight looking for Calvin.  Stupendous Man, in his treehouse, plans his strategy.  Calvin goes back inside to his bedroom.  He tells Hobbes that he made a stupendous dash when Rosalyn went around the house.  He says she still doesn't know where he is.
    characters: [calvin, hobbes, rosalyn, stupendous]
  "19900408":
    transcript: Ace pilot spaceman Spiff cruises low over the planet at high speed! I wonder what this "E" on the fuel gauge means. Our hero sets off across the desolate terrain in search of help! In the distance, methane clouds rain sodium hydroxide, a caustic alkali! Oh no! The downpour was too heavy for the ground to absorb! A steaming river of corrosive liquid rushes toward our hero! The brave spaceman Spiff scrambles to higher ground, but the flood continues to rise! Our hero is trapped! It's only a matter of time until the roaming, noxious wash cleans the meat from Spiff's bones! How could things ever get worse?! Aughh! An alien comes to push him in! For heaven's sake, Cavlin! Just get in!
    description: Spaceman Spiff lands on Planet Gorzarg-5.  He sets off across the desolate terrain in search of help.  In the distance, methane clouds rain sodium hydroxide, a caustic alkali.  The downpour was too heavy for the ground to absorb.  A steaming river of corrosive liquid rushes toward our hero.  Spiff scrambles to higher ground, but the flood continues to rise. Our hero is trapped.  How could things get worse?  Calvin is leaning across the bathtub as Mom tells him to just get in.
    characters: [calvin, mom, spiff]
    source: miraheze
  "19900409":
    transcript: There goes Rosalyn around the house again. She still doesn't know you sneaked back inside. Now I'll change back into my secret identity alter ego! Uh oh. She saw the light on in this room. She's coming in! Quick! Get in the covers! Pretend we've just been reading in bed! But she knows you attacked her and ran outside half an hour ago! That was STUPENDOUS MAN! Not mild-mannered Calvin! I'VE been in bed with my PJs since 8:00. You think she's going to believe THAT? My covers are here. My pajamas are HERE. It's as plain as can be!
    description: Hobbes notices Rosalyn going around the house again.  She still doesn't know Calvin is inside.  Calvin changes from Stupendous Man back into Calvin.  Rosalyn has seen the bedroom light and comes inside.  Calvin tells Hobbes to get in the covers and pretend they've been reading in bed.  Hobbes reminds Calvin that Rosalyn knows he attacked her and ran outside.  Calvin says that was Stupendous Man.  He's been in bed in his PJ's since 8:00.  Hobbes asks if he thinks she's going to believe that.  Calvin tells him his covers are here and his pajamas are here.  It's as plain as can be.
    characters: [calvin, hobbes, stupendous]
  "19900410":
    transcript: All right! I found you! Found?? Why, what do you mean? I've been in bed reading all evening with Hobbes. Don't give me that! You just now sneaked inside, took off your silly costume, and jumped in bed! I know what you did! Well you're gonna get it NOW, bucko! Oh yea? What are you going to do to me, huh? You can't send me to bed when I'm already IN bed! Sorry to spoil your fun, you eel! OK. Downstairs! MARCH! Hey, you can't take me OUT of bed! I need my SLEEP! Hey! Hey!
    description: Rosalyn comes into the room.  Calvin tells her he's been there all the time.  Rosalyn tells him he snuck outside, took off his costume, and jumped in bed.  She says he's going to get it now.  Calvin thumbs his hands at Rosalyn asking what she can do since he's already in bed.  She grabs Calvin and tells him to get downstairs.  Calvin protests, saying he needs his sleep.
    characters: [calvin, hobbes, rosalyn, stuffedhobbes]
  "19900411":
    transcript: While your Dad is taking Rosalyn home, perhaps YOU'D like to explain what happened tonight. Gosh Mom, what's to tell? At 8:00, I put on my pajamas, brushed my teeth and went straight to bed. Nothing happened. And this? Uh... LIES! All lies! Rosalyn made me do that just so I'd get in trouble! She hates kids! None of that is true! I went straight to bed! Nice try, Pinocchio. Well, who'd have thought Rosalyn would make me write a full confession?!
    description: Mom asks Calvin if he'd like to explain what happened tonight.  He tells her he put on his pajamas at 8:00, brushed his teeth, and went straight to bed.  Mom asks about the note Rosalyn left.  Calvin says she made him write it up to get him in trouble.  He says Rosalyn hates kids.  In bed, Hobbes tells Calvin "Nice try, Pinocchio".   Calvin asks who would've thought Rosalyn would make him write a full confession.
    characters: [calvin, hobbes, mom, stuffedhobbes]
  "19900412":
    transcript: No TV for a week! What injustice! They think they've won, but they haven't! I'LL show 'em! I REFUSE to learn a lesson! I'm indomitable! They can't change me! I'll sit in front of the TV all week even if I can't turn it on!
    description: Calvin complains that he can't watch TV for a week.  He says they think they've won, but he'll show them.  He refuses to learn a lesson.  They can't change him.  He sits on the floor in front of the TV and says he's going to sit there all week, even though he can't turn it on.
    characters: [calvin, hobbes]
  "19900413":
    transcript: Dad, will you explain the theory of relativity to me? I don't understand why time goes slower at great speed. It's because you keep changing time zones. See, if you fly to California, you gain three hours on a five-hour flight, right? So if you go at the speed of light, you gain MORE time, because it doesn't take as long to get there. Of course, the theory of relativity works only if you're going west. Gee, that's not what Mom said at ALL! She must be totally off her rocker. Well, we men are better at abstract reasoning. Go tell her that.
    description: Calvin asks Dad to explain the theory of relativity to him.  He can't understand how time goes slower at great speed.  Dad says it's because you keep changing time zones.  It's like when you fly to California and gain two hours on a five-hour flight.  Dad says at the speed of light, you gain more time because it doesn't take as long to get there.  Dad says the theory of relativity only works if you're heading west.  Calvin tells him that isn't what Mom said at all.  She must be off her rocker.  Dad says men are better at abstract reasoning.  He tells Calvin to tell Mom that.
    characters: [calvin, dad]
  "19900414":
    transcript: Mom, can we go out to the highway? Do what? See, I'll put on my roller skates and tie a rope from the car bumper to my waist. Then when I give you the high five, you patch out while I ride behind at 55 mph! What do you say? Can we go? I sure wish YOU could drive.
    description: Calvin asks Mom if they can go out to the highway.  Calvin wants to put on his roller skates, tie a rope around himself to the car bumper, and skate along behind at 55 mph.  Calvin asks again if they can go.  Up on a tree branch, Calvin tells Hobbes he wishes Hobbes could drive.
    characters: [calvin, hobbes, mom]
  "19900415":
    transcript: "Faster! Faster! The turbo is pooped. That's OK. Gravity just kicked in. Ever notice how decisions make chain reactions? How so? Well, each decision we make determines the range of choices we'll face next. Take this fork in the road for instance. Which way should we go? Arbitrarily, I choose left. Now, as a direct result of that decision, we're faced with another choice: should we jump this ledge or ride along the side of it? If we hadn't turned left at the fork, this new choice would never have come up. I note, with some dismay, you've chosen to jump the ledge. Right. And THAT decision will give us NEW choices. Like, should we bail out or die in the landing? Exactly. Our first decision created a chain reaction of decisions. Let's jump. See? If you don't make each decision carefully, you never know WHERE you'll end up. That's an important lesson we should learn sometime. I wish we could talk about these things without the visual aids."
    description: Going down the hill in their wagon, Calvin asks Hobbes if he's noticed decisions make chain reactions.  Calvin says each decision they make determines the range of choices they'll face next.  Coming to a fork in the road, Calvin chooses to go left.  As a result of that decision, they're faced with jumping the ledge or riding along the side of it.  If they hadn't turned left at the fork, this new choice would never have come up.  Hobbes notes with some dismay, Calvin has chosen to jump the ledge.  Hobbes asks if they should bail out or die in the landing.  Calvin says that shows their first decision created a chain reaction of decisions.  He decides they should jump.  Lying in the stream, Calvin says if you don't make each decision carefully, you never know where you'll end up.  Hobbes wishes they could talk about these things without the visual aids.
    characters: [calvin, hobbes]
  "19900416":
    transcript: Wow! Nobody is on the swings! I can't believe it! Ha ha! I almost NEVER get a swing at recess! This is great! No one is telling me to hurry up! Higher! Higher! Whee! ... either this is my lucky day, or I missed the end-of-recess bell again.
    description: Calvin runs over to the swings.  He gets on while saying he almost never gets a swing at recess.  No one is telling him to hurry up, as he keeps swinging.  Calvin decides this is either his lucky day, or he missed the end-of-recess bell again.
    characters: [calvin]
  "19900417":
    transcript: Hey Calvin, didn't you sign up to play baseball at recess? No, why? You must be the only boy who didn't. All the others are playing in the back fields. You mean I'm the only boy on a playground full of GIRLS?! It sure looks like it. Want to ride on the teeter-totter with me? Oh no! I'm in COOTIE CENTRAL! I haven't had my shots! Relax. Stupidity produces antibodies. Air filter! Air filter!
    description: Susie comes over and asks if Calvin signed up to play baseball at recess.  She says he must be the only one who didn't.  The others are playing in the back fields.  Calvin is the only boy on a playground full of girls.  Susie says it looks that way.  She asks if Calvin wants to teeter-totter with her.  Calvin, shocked, says he's in Cootie Central and hasn't had his shots.  Susie tells him stupidity produces antibodies.  Calvin pulls his shirt over his mouth asking for an air filter.
    characters: [calvin, susie]
  "19900418":
    transcript: Why didn't you sign up to play baseball like the rest of the boys? Didn't you like sports? I dunno. I'd just rather run around. I hate all the rules and organization and teams and ranks in sports. Somebody's always yelling at you, telling you where to be, what to do, and when to do it. I figure when I want THAT, I'll join the army and at least get paid.
    description: Calvin is on the teeter-totter with Susie.  She asks why he didn't sign up to play baseball.  Calvin says he'd just rather run around.  He says he hates the rules and organization and teams and ranks in sports.  He says someone is always telling you where to be, what to do, and when to do it.  He figures when he wants that, he'll join the Army and at least get paid.
    characters: [calvin, susie]
  "19900419":
    transcript: Hey, lookit the sissy who didn't sign up for recess baseball. I'm not a sissy! Oh yeah? You'd rather play dolls on the playground with girls. I wasn't playing with dolls! Sure you weren't! Let me see your Barbie doll, you sissy wimp! I'm not a wimp! In fact, I was going to the office to sign up for baseball right now! Then again, if I'm not a wimp, why am I taking the path of least resistance?
    description: Moe hassles Calvin about being a sissy for not signing up for baseball.  Moe says Calvin would rather play with dolls on the playground.  Calvin says he wasn't playing with dolls.  Moe wants to see Calvin's Barbie doll.  Calvin says he's not a wimp and was on his way to the office to sign up for baseball right now.  Standing outside the office door, Calvin wonders why, if he's not a wimp, he's taking the path of least resistance.
    characters: [calvin, moe]
  "19900420":
    transcript: I signed up to play baseball every recess and I don't even like baseball that much. I mean, it's fun playing baseball with just YOU, because we both get to pitch, bat, run and catch all at once. We get to DO everything. Mostly we just argue over the rules we make up! That's the part I like! But this will be with TEAMS and assigned positions and an umpire! It's BORING playing it the REAL way! Do you have know HOW to play the real way? See, that's another problem! Suppose they make me a halfback. Can I tackle the shortstop or not?
    description: Calvin tells Hobbes he signed up to play baseball at recess, even though he doesn't like it that much.  Calvin likes playing with Hobbes, because they get to do everything.  Hobbes admits he likes the part when they argue over the rules.  Calvin figures it will be boring playing the game the way it's supposed to be played.  Hobbes asks if Calvin even knows the right way to play.  Calvin asks what happens if they make him a halfback.  He wonders if he can tackle the shortstop or not.
    characters: [calvin, hobbes]
  "19900421":
    transcript: I hear you signed up to play softball at recess. Yeah, but I didn't even want to. I just did it to stop getting teased. Well, sports are good for you. They teach teamwork and cooperation. You learn how to win graciously and accept defeat. It builds character. Every time I've built character, I've regretted it! I don't WANT to learn teamwork! I don't WANT to learn about winning and losing! Heck, I don't even want to COMPETE! What's wrong with just having fun by yourself, huh?! When you grow up, it's not allowed. All the more reason I should do it NOW!
    description: Dad tells Calvin he heard Calvin signed up to play ball.  Calvin admits he only did it to stop getting teased.  Dad tells Calvin team sports are good for teaching teamwork and cooperation, winning graciously and accepting defeat.  He says it builds character.  Calvin says he's regretted every time he's built character.  He says he doesn't want to learn teamwork or how to learn about winning or losing.  He doesn't even want to compete.  He asks what's wrong with having fun by yourself.  Dad tells him when you grow up, it's not allowed.  Calvin says that's all the more reason he should do it now.
    characters: [calvin, dad]
  "19900422":
    transcript: Are you going to read Calvin a story? Only if it's not that awful "Hamster Huey and the Gooey Kablooie". Oh, but you look so CUTE doing the "Happy Hamster Hop"! I don't WANT to look cute!! What story would you like tonight, Calvin? I want a story about Hobbes and me. OK... Hmm.. Let's see ... Once there was a boy named Calvin who lived with a tiger named Hobbes. This is great! Today they got up at the crack of dawn and made a huge ruckus running up the stairs, galump, galump, galump, and sliding DOWN again, bump, bump bump, bump! Yeah, then the big bad Dad yelled that if we didn't knock it off, he'd mail us to PLUTO third class! Who's telling the story, you or me? You DID say that! Don't try to deny it! So finally, Calvin got the hint and he went to rot his innards with chocolate cereal, and to rot his brain watching cartoons. Hey! No editorials! At last Calvin and Hobbes went outside, and it was nice and quiet in the house again. At least for a little while. Well, good night! Good night?! That's not the end! You didn't even get us to lunchtime! That's right... It's not the end of the story. This story doesn't HAVE an end. You and Hobbes will write more of it tomorrow and every day after. But now it's time to sleep, so good night. Oh! OK, good night. This IS a good story about us if it doesn't end! That's the kind of story I like best! Good night, ol' buddy! Me too! See you tomorrow!
    description: Dad asks what story Calvin wants tonight.  He wants a story about Hobbes and him.  Dad starts making up a story about them getting up at the crack of dawn, making a huge ruckus, running up and sliding down the stairs.  Calvin adds about the Big Bad Dad yelling at them and saying he'd mail them to Pluto third class if they didn't knock it off.  Dad continues that Calvin went to rot out his innards with chocolate cereal and rot his brain watching cartoons.  Calvin doesn't want editorials.  Dad continues that Calvin and Hobbes went outside, and it was nice and quiet in the house for a while.  He tells Calvin good night.  Calvin complains that's not the end.  Dad gives Calvin a kiss and says he's right.  That isn't the end of the story.  The story doesn't have an end.  He and Hobbes will write more of it tomorrow and every day after.  But for now, it's time to sleep.  Calvin says that was a good story.  Calvin and Hobbes wish each other a good night.
    characters: [calvin, hobbes, mom, dad, stuffedhobbes]
  "19900423":
    transcript: C'mon, let's go outside and try some catches before dinner, OK? A little practice will make you more confident tomorrow at recess. I hate these father-son things. Go out a little bit, and I'll hit you a grounder. Why did I sign up for this? I should just move. Ready? Now, be sure to run up to the ball. Don't just let it roll to you. Are you OK? Sometimes the ball bounces up like that, and you've got to be ready. Thags for the tib, Dad. Fide my node and put id in ice so they can sew id bag od!
    description: Dad offers to help Calvin practice baseball before dinner.  Calvin goes out to get ready to field a ground ball.  He complains that he should just move.  Dad gets ready to hit the ball and tells Calvin not to wait on the ball.  He needs to run up to the ball.  Dad leans over Calvin, lying on the ground.  Dad says the ball sometimes bounces up like that, and he has to be ready for that.  Calvin, speaking through a clogged nose, tells Dad thanks for the tip.  He tells Dad to find his nose and put it on ice so they can sew it back on.
    characters: [calvin, dad]
  "19900424":
    transcript: Goodness, what happened?! You were only out there a minute! A grounder bounced up and hit Calvin on the nose. I'B BLEEDIG! BY ODE DAD ID TRYIG TO GILL ME! Hold your head back, honey. Here's some more tissues. I'b nod playig badeball eddy more! Nebber again! I hade it! Sit still so the bleeding can stop, OK? I guess we can forget having a millionaire baseball player support us in our old age. Dear! All my charagder id drippig out my node!
    description: Mom asks why they're coming back inside.  Dad tells her a ground ball bounced up and hit Calvin in the nose.  Calvin, still talking through a clogged nose, says his own Dad tried to kill him.  His nose is bleeding.  Mom tells him to hold his head back and use some tissues.  Calvin says he's not playing baseball again.  Dad says they can forget about having a millionaire baseball player supporting them in their old age.  Calvin holds the tissues to his nose saying all his character is dripping out his nose.
    characters: [calvin, mom, dad]
  "19900425":
    transcript: How's the nose? It finally stopped bleeding. I guess that means I have to go to school tomorrow. My whole life is a disaster. I get injured just trying to learn the skills it takes to play a game I don't even want to play! Your nose is probably all clogged up now, huh? *snrkk* yeah, why? If you snore, I'm tilting the bed so you role out of the window. It's always nice to have a sympathetic friend to talk to.
    description: Calvin tells Hobbes his nose stopped bleeding, so he'll have to go to school tomorrow.  Calvin says his life's a disaster.  He says he gets hurt learning the skills to play a game he doesn't want to.  Hobbes asks if Calvin's nose is clogged, and Calvin says yes.  Hobbes says if Calvin snores, he's going to tilt the bed so Calvin rolls out the window.  Calvin is glad he has a sympathetic friend to talk to.
    characters: [calvin, hobbes]
  "19900426":
    transcript: I see you're bringing a glove today. Did you sign up for recess baseball? Yeah, don't remind me. You're lucky that GIRLS don't have to put up with this nonsense. If a GIRL doesn't want to splay sports, that's fine! But if a GUY doesn't spend his afternoons chasing some stuped ball, he's called a wimp! You girls have it easy! On the other hand, BOYS aren't expected to spend their lives 20 pounds underweight. And if you don't play sports, you don't get to make beer commercials!
    description: Susie notices Calvin has a baseball glove.  She asks if he signed up for recess baseball.  Calvin tells her she's lucky girls don't have to put up with that nonsense.  He says if a girl doesn't want to play sports, that's fine.  If a guy doesn't want to chase some stupid ball, he's called a wimp.  He says girls have it easy.  Susie replies boys aren't expected to live their lives twenty pounds underweight.
    characters: [calvin, susie]
  "19900427":
    transcript: Mr Lockjaw? I'm Calvin. I'm supposed to be on team five now. Oh yes, you're the one who signed up late. Hmm... OK, you go play left field. Left field. OK, I know that. Let's see, if I'm HERE, then left field would be... That way. Play DEEP left field. I guess this is pretty dep.
    description: Calvin reports to the coach.  The coach sends him to deep left field.  Calvin isn't sure where that is, so the coach points it out to him.  Calvin goes so far he's in tall grass.  He figures that is pretty deep.
    characters: [calvin, lockjaw]
  "19900428":
    transcript: I think baseball is the most boring game in the world. I've been standing out here in deep left field all this time, and not a single ball has come out here! Actually, I suppose that's just as well. I don't know what base to throw to anyway. In fact, I'm not even sure I can throw that far. Hey, what's everyone doing? Are people switching teams, or what? The guys at bat are now out HERE! Well, I'm sure someone would tell me if I was supposed to be doing anything different.
    description: In the tall grass, Calvin complains that baseball is the most boring game in the world.  He's been standing out there all this time, and not a single ball has come out to him.  Then, he figures that's alright, because he doesn't know which base to throw it to.  Calvin notices the teams exchanging positions.  The guys at bat are now out in the field.  Calvin is sure someone would tell him if he was supposed to be doing something different.
    characters: [calvin]
  "19900429":
    transcript: I'm freeeeeeeeeeeeeeeeee Ho ho! They tried to make me learn, but I was too tough for 'em! I'm home! Why hello, Calvin! Do come in, won't you? Hey! Hey! May I read all your comic books? I may? Thank you, Calvin!May I draw mustaches on all the superheroes? I may? Oh joy! I'll get him for this if it takes my whole life.
    description: Calvin returns home and remembers how Hobbes pounces on him.  He gets an idea to make a broomstick Calvin to fool Hobbes.  He sets the stick Calvin on the porch and calls "I'm home".  Hobbes opens the door, grabs the fake Calvin, then asks if he can read Calvin's comic books.  Calvin ties to open the door, but it's locked.  He hears Hobbes ask to draw mustaches on all the superheroes.  Calvin sits on the front porch saying he'll get him for this if it takes his whole life.
    characters: [calvin, hobbes]
    source: miraheze
  "19900430":
    transcript: Our hero, the fearless Spaceman Spiff, is marooned on the most distant planet in the galaxy! There's no hope of rescue from this bleak and isolated world! Oh, what a desolate place to be trapped! Spiff tries desparately to repair his disabled spacecraft! CRACK High fly to left field! Who's out there?! Our hero pauses. There's some commotion on the horizon. ALIENS! Spiff grabs his blaster!
    description: Spaceman Spiff is marooned on the most distant planet in the galaxy.  There's no hope of rescue from this bleak world.  Spiff tries to repair his disabled spacecraft.  CRACK!  There's a fly ball to left field.  Calvin says there is a commotion on the horizon.  Aliens!  Calvin says Spiff grabs his blaster.
    characters: [calvin, spiff]
  "19900501":
    transcript: Where's the left fielder?! Somebody catch it! Left field?! Hey, that's ME! Wow! A high fly right to me! I got it! I got it! I caught it!! HE CAUGHT IT! IT'S AN OUT! WAP! I'm just a natural athlete, I guess. Hey, who's HE? Isn't he on the other team?
    description: Shouts go out to the left fielder.  Calvin realizes that's him.  He runs up under the fly ball and makes the catch.  It's an out!  Calvin proudly brings the ball in saying he's a natural athlete.  One of the kids asks who he is.  Another one thinks Calvin is on the other team.
    characters: [calvin]
  "19900502":
    transcript: Hey, look who made the out! It's CALVIN! Heck, it was nothing, guys. When you're in top physical condition like me, you can... You moron! What were you doing in the outflied?! It's a new inning! We're up to BAT! Huh? You caught the ball for the wrong team! You got our own guy out! What a dweeb! What a jerk! What an idiot! Oops, I dropped the catch. It doesn't count now, right? Get him off our team, Mr Lockjaw! Can I hit him with the bat? Please? Please??
    description: The batter notices Calvin was the one who caught it.  Calvin walks up saying you can do that stuff when you're in top physical condition like he is.  They explain to Calvin that it's a new inning, and his team is at bat.  The batter complains Calvin got one of his own team out.  He calls him a dweeb, a jerk, an idiot.  Calvin tries to drop the ball then.  His teammates want to coach to get him off the team.  The batter wants to hit Calvin with the bat.
    characters: [calvin]
  "19900503":
    transcript: Hey stupid, if you're going to get OUR guys out, why don't you join the other team?! What were you doing in the outfield? Don't you even know how to play?! C'mon guys, it's just a GAME! This is supposed to be fun! Games are only fun when you WIN, bonehead! You're gonna make us LOSE! If you screw up again, you're dead meat, Calvin! Who taught you how to play anyway? Your grandmother? Wait till I tell the other teams about THIS! Mr Lockjaw, I don't want to play any more. There's too much team spirit. OK, quitter! Goodbye.
    description: Calvin's teammates continue to berate him.  They say he should be on the other team if he's going to get them out.  They say he doesn't know how to play.  Calvin protests that it's a game and is supposed to be fun.  One of the team says it's only fun if you win.  They say he's dead meat if he screws up again.  They ask if Calvin's grandmother taught him to play.  Calvin walks up to the coach and says he doesn't want to play anymore.  There's too much team spirit.  The coach says "OK, quitter!  Goodbye".
    characters: [calvin, lockjaw]
  "19900504":
    transcript: I don't understand it, Hobbes. The kids teased me when I DIDN'T play baseball. Then they yelled at me when I DID play. Then the teacher called me a "quitter" when I STOPPED playing. Unless you're a star, you can't please ANYone. In that case, why not just please yourself? Because Mom won't let me move to Madagascar.
    description: Up in the tree branch, Calvin tells Hobbes he doesn't understand.  When he didn't play, the other kids teased him.  When he did play, the other kids teased him.  Then the coach called him a quitter when he stopped playing.  Calvin says unless you're a star, you can't please anyone.  Hobbes asks why he doesn't just please himself.  Calvin replies that Mom won't let him move to Madagascar.
    characters: [calvin, hobbes]
  "19900505":
    transcript: It's Saturday! What do you want to do? Anything but play an organized sport. Want to play Calvinball? YEAH! No sport is less organized than Calvinball! New rule! New rule! If you don't touch a 30-yard base wicket with the flag, you have to hop on one foot!
    description: Hobbes says it's Saturday and wants to know what Calvin wants to do.  Calvin says anything but an organized sport.  Hobbes asks if he wants to play Calvinball.  Hobbes says no sport is less organized than Calvinball.  Calvin calls a new rule.  If you don't touch the 30 yard base wicket with the flag, you have to hop on one foot.
    characters: [calvin, hobbes]
  "19900506":
    transcript: Toad stroganoff... Ewww.. Augh! Ha! Don't blame me. I'm the one who said we should call for a pizza.
    description: Calvin looks at his food and pokes it.  It grabs a knife, and they fight.  Calvin knocks the knife away.  The food garbs a spoon, scoops itself and hits Calvin with it.  SPLAT!  Calvin runs away.  Mom puts her hand on her head in frustration, while Calvin says not to blame him.  He was the one who said they should call for a pizza.
    characters: [calvin, mom]
    source: miraheze
  "19900507":
    transcript: Today for "Show and Tell", I have a souvenir from the afterlife! Yes, you heard right! Equally amazing is my own story of yesterday afternoon, when I actually died of boredom! I was doing my homework, when I suddenly collapsed! I felt myself rising, and could see my crumpled body on the floor. I drifted up in a shaft of light and entered the next world! Eventually, my heart started again and I came back to life... but not before bringing THIS back! A yo-yo? It was pretty boring THERE, too. Let's have a look at that homework.
    description: Calvin is in front of the class for "show and tell".  He has a souvenir from the afterlife.  He says it's as amazing as his story of yesterday afternoon, when he actually died of boredom.  He says he was doing his homework when he collapsed.  He felt himself rising and saw his crumpled body on the floor.  He drifted up in a shaft of light and entered the next world.  Eventually, his heart started again, and he came back to life.  But he didn't come back before bringing his souvenir.   He pulls out a yo-yo.  He tells Miss Wormwood it was pretty boring there, also.  She wants to look at his homework.
    characters: [calvin, wormwood]
  "19900508":
    transcript: And so, having eaten her fill, the mother bird returns to her nest... ...where she regurgitates the worms to feed her hungry brood.
    description: Calvin is watching a nature show on TV.  The show talks about the mother bird, having eaten her fill, returning to the nest to regurgitate the worms to feed her hungry brood.  Calvin is startled.  At the dinner table, he looks at the plate of food Mom gives him with distrust.
    characters: [calvin, mom]
  "19900509":
    transcript: ...sighhhhhh... CALVIN, PAY ATTENTION! AUGH There's no head rest on this chair! I should sue for whiplash!
    description: Calvin is sitting at his desk.  His head droops forward as he fights sleep.  The teacher yells for him to pay attention.  He lifts his head up.  He says there's no head rest on his chair.  He should sue for whiplash.
    characters: [calvin, wormwood]
  "19900510":
    transcript: Hey Mom, did you feel anything funny when you got dressed today? Funny? What do you mean? Well, tickly maybe... or scratchy? Anything like a bite or a sting? WHY? And what have you got behind your back?! Um... here, you may want these. Well, heh heh, gotta run! Women! Always changing their clothes! After I get that kid, you're next.
    description: Calvin asks Mom if she felt anything funny when she got dressed that morning.  She asks what he means.  He explains something tickly or scratchy.  Something like a bite or sting.  She asks what he has behind his back.  Calvin hands her a flyswatter and bug spray, saying she might want those.  He runs off.  Dad sees Mom changing her clothes and comments on women always doing that.  Mom says that after she gets that kid, he's next.
    characters: [calvin, mom, dad]
  "19900511":
    transcript: This time I'm really going to learn how to ride that bicycle! Balancing on two wheels is just as easy as balancing on two fee... I'd say that crossed the line from ironic coincidence to evil omen.
    description: Calvin says this time, he's really going to learn how to ride his bicycle.  He says balancing on two wheels is just as easy as balancing on two feet.  Just as he says that, he trips.  He tumbles forward, his shoe flying off.  As he gets up, he says that crossed the line from ironic coincidence to evil omen.
