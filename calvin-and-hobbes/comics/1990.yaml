  "19901231":
    transcript: By the power invested in me by the mighty and awful snow demons, I command you to come to life! LIVE! LIVE! LIVVVE! RRGHH!
    description: Calvin stands next to a snowman lying on the ground. Calvin says that by the power invested in him by the mighty and awful snow demons, he commands the snowman to come to life. He tells the snowman to live! The snowman rises up. Calvin runs off, with the snowman in hot pursuit.
    characters: [calvin]
