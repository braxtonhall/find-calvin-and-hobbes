  "19900831":
    transcript: Let's stroll down the sidewalk REAL CASUALLY and see if Susie put the hundred bucks out by the tree yet. Great! Lovely day for a stroll, eh Hobbes? I certainly enjoy my afternoon constitutional! Yes, it's quite invigorating! Look! Look! There's the envelope! She did it! We're rich! Oh boy! Let's sneak up and get it! C'mon you louse. C'monnn... I don't see Susie. Do you?
    description: Calvin suggests walking real casually down the sidewalk to see if Susie put the hundred dollars by the tree.  They march along with Calvin saying he enjoys his afternoon constitutional.  Hobbes says it's quite invigorating.  They see the envelope.  Calvin figures they're rich.  Hobbes says they should sneak up and get it.  Susie is hiding behind the tree.
