  "19900826":
    transcript: I got a goal! OH, the score is oogy to boogy. I leady HAD oogy! You just ran into the invisible sector! You have to cover your eyes now, because everything is invisible to yoU! Invisible sector?? I didn't know we had an invisible sector! Where is it? You can't see it. It's invisible. How do I know I went in it then? You can't see anything, right? OK, so how do I get out? Somebody bonks you with the calvinball. I get another point! HEY! OW! WHY YOU... That was a rotten rule! I decree no more invisible sectors! ... in fact, I'll show YOU! YOU just ran into a vortex spot! You have to spin around until you fall down! Sorry, this vortex spot is in the boomerang zone, so the vortex turns to whoever calls it! YOU spin! THAT'S NOT FAIR! You know the calvinball rules. Yeah, yeah, anything we make up. Well, you'll pay for this. This game lends itself to certain abuses. Guess how you get out of the boomerang zone!
    description: Hobbes tells Calvin he just ran into the invisible sector.  He has to cover his eyes.  Calvin, playing Calvinball, didn't know they had an invisible sector.  He asks where it is.  Hobbes tells him he can't see it.  It's invisible.  He asks how to know he went into it.  Hobbes says he can't see anything, right?  He hits Calvin on the head with the Calvinball.  He gets a point.  Calvin chases him.  He says Hobbes just ran into a vortex spot.  He has to spin around until he falls down.  Hobbes informs Calvin that spot is in the boomerang zone, so the vortex returns to who called it.  Calvin has to spin.  He claims that's not fair.  Hobbes tells him he knows the rules.  Calvin admits that anything they make up are the rules.  Calvin spins himself dizzy while saying this game lends itself to certain abuses.  Hobbes has the Calvinball.  He asks Calvin to guess how he gets out of the boomerang zone.
