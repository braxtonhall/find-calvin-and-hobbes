  "19900512":
    transcript: I don't want to do my homework. I want to have FUN. TOO MUCH STRESS IS UNHEALTHY, YOU KNOW! I don't see why I had to come in.
    description: Sitting at his table doing homework, Calvin says he doesn't want to do it.  He wants to have fun.  He runs off, and is sitting in his wagon with Hobbes when Mom comes out and stands over them.  Back at his table, Calvin complains that too much stress is unhealthy.  Hobbes, slumped beside him, says he doesn't see why he had to come in.
    characters: [calvin, hobbes, mom]
  "19900513":
    transcript: Wak wak wak wak wak wak Good day? Getting better.
    description: Calvin dreams he is flying when his alarm clock goes off.  Mom has Calvin get out of bed.  He stands in the rain waiting for the school bus.  He's bored at school while a duck quacks outside.  He doesn't like his lunch.  Moe extorts money from him.  He gets an "F" on a paper.  He walks home in the rain.  Hobbes pounces on him and hugs him.  Mom, picking up his wet clothes, asks if Calvin had a good day.  Calvin, carrying Hobbes, says it's getting better.
    characters: [calvin, hobbes, mom, moe]
  "19900514":
    transcript: I've come up with a new system for doing homework. I call it "effective time management", or "ETM" for short. I've drawn up a schedule for each school subject, and I use this kitchen timer to monitor my pace. Thanks to ETM, I'm much more efficient, and my work goes faster! RINGG There! My math minute is set up! Set the clock for my spelling assignment, OK? Um, your schedule calls for smaller time increments than this clock can measure.
    description: Calvin tells Hobbes he's come up with a new system for doing homework.  He calls it "Effective Time Management", or "ETM" for short.  He's drawn up a schedule of each school subject.  He uses a kitchen timer to monitor his pace.  Calvin says that thanks to ETM, he's much more efficient.  The timer rings.  Calvin says his math minute is up.  He tells Hobbes to set the timer for his spelling assignment.  Hobbes says his schedule calls for smaller time increments than the timer can measure.
