  "19900822":
    transcript: OK, here's our plan. I'll be the strike force commander. You'll be the special agend in charge of munitions. We'll fill up a water balloon and sneak up on Susie through the back yard! I get to be the official cartographer and map our hiding places and escape routes! Yeah! And I'LL be the code expert and make an unbreakable code! Oh boy! Let's get some paper! I hope Susie doesn't go anyplace for a while. OK, here's the United States...
    description: As they climb down from their tree fort, Calvin says he'll be the strike force commander, while Hobbes is the special agent in charge of munitions.  Calvin suggests filling a water balloon and sneaking up on Susie through the back yard.  Hobbes wants to be official cartographer, mapping their hiding places and escape routes.  Calvin decides to be the code expert and make an unbreakable code.  Hobbes runs to get paper.  As they both work on their tasks, Calvin says he hopes Susie doesn't go anyplace for a while.
    characters: [calvin, hobbes]
  "19900823":
    transcript: There! I finished our secret code! Let's see. I assigned a totally random number, so that code will be hard to crack. For letter "A", you write 3,004,572,688. "B" is 28,731,569 1/2. That's a good code all right. Now we just commit this to memory. Did you finish your map of our neighbourhood? Not yet. How many bricks does the front walk have?
    description: Calvin has finished the secret code.  He has assigned each letter a totally random number.  For instance, for the letter "A", you write 3,004,572,688.  Hobbes admits that's a good code.  Calvin says they only have to commit it to memory.  He asks if Hobbes has finished the map of their neighborhood.  Hobbes isn't quite done yet.  He asks how many bricks there are on the front walk.
    characters: [calvin, hobbes]
  "19900824":
    transcript: We've got our map, our code, and our water balloon! Let's go soak Susie! Our map says first we run to the big tree out back. Now to the bush out front! Now to the ditch out back! Now to the tree out front! In case you're wondering - this is to lose anyone who might be tailing us. I'm writing a message in code. How do you spell "nincompoop"?
    description: They have their map, the code, and a water balloon.  They're ready to soak Susie.  Hobbes says they should run to the big tree out back, then to the bush out front, then the ditch out back, then the tree out front.  He explains to a winded Calvin that's to lose anyone who might be tailing them.  Calvin is going to write Hobbes a note in code.  He asks how to spell "nincompoop".
    characters: [calvin, hobbes]
  "19900825":
    transcript: We made it to Susie's yard! But where's Susie? I don't see her! ARGHH! We go to all this trouble to launch an attack on her, and what does she do? She MOVES! All our great plans are for naught! A whole morning ruined! Maybe she just went in for lunch, see, she left some of her toys out, so she's probably planning to come back. That gives me a FABULOUS idea! Uh oh.
    description: They made it to Susie's yard, but she's not there.  Calvin is distraught that all their plans have gone for naught.  Hobbes suggests she might have only gone in for lunch.  Her toys are still left out, so she's probably planning to come back.  Calvin's eyes bulge, and he wrings his hands.  He says that gives him a fabulous idea.
