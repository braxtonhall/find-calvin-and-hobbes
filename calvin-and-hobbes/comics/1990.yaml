  "19900829":
    transcript: Mom, I can't find my doll. Have you seen it anywh... DING DONG Hmm, there's nobody here. What's this note? "Susie, if you want to see your doll again, leave $100 in this envelope by the tree out in front. Do not call the police. You cannot trace us. You cannot find us. Sincerely, Calvin."
    description: Susie goes back inside telling her Mom that she can't find her doll.  The doorbell rings.  No one is there, but there is a note on the ground.  Susie reads the note.  It reads "Susie, if you want to see your doll again, leave $100 in this envelope by the tree out front".  It warns her not to call the police.  It says she can't trace or find them.  It's signed "Sincerely, Calvin".
