  "19900518":
    transcript: Hey Hobbes, what's a "paper tiger"? It's like a paper boy. You know, a tiger with a newspaper route. Oh. This book makes no sense at all.
    description: Calvin is reading a book and asks Hobbes what a "Paper Tiger" is.  Hobbes explains that it's a tiger with a newspaper route.  Calvin continues to read, but says this book makes no sense at all.
