  "19900312":
    transcript: Do you... I mean, does HOBBES want any tuna fish this week? No, Hobbes stopped eating canned tuna. You know they kill dolphins to get it. OK, I'll put it back. So what does Hobbes like now instead? Fresh swordfish steaks. He likes them grilled outside. Mm-hmm. How about peanut butter?
    description: At the grocery store, Mom asks if Calvin, er, she means Hobbes, wants any tuna fish.  Calvin tells her that Hobbes stopped eating tuna fish, because they kill dolphins to get it.  Mom asks what Hobbes likes now.  Calvin tells her fresh swordfish steaks, grilled outside.  Mom asks about peanut butter.
    characters: [calvin, mom]
  "19900313":
    transcript: Here's some clean clothes. Will you put them away, please? Hey, my underwear isn't pressed! Neither are my socks! You didn't finish ironing. Buddy, if you want your underwear ironed, you can do it yourself! What kind of mother ARE you?! She should take more pride in her work.
    description: Mom hands Calvin some clean clothes.  She asks him to put them away.  Calvin says the underwear and socks aren't pressed.  He says she didn't finish ironing.  Mom tells him if he wants his underwear ironed, he can do it himself.  Calvin angrily asks what kind of mother she is.  Calvin says she should take more pride in her work, as he jams the clothes into an overflowing drawer.
