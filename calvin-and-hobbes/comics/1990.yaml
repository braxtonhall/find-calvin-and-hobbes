  "19900903":
    transcript: COME BACK HERE WITH HOBBES! PUT HIM DOWN! HOBBES, BITE HER! BITE HER! Ha ha! Nyahh! Nyahh! SLAM GET AWAY FROM OUR DOOR WITH THAT DRILL!
    description: Calvin chases Susie, who's carrying Hobbes.  Calvin tells Hobbes to bite her.  Susie reaches her home and closes the door.  From an upstairs window, Susie yells down for him to get away from their door with that drill.
    characters: [calvin, hobbes, susie, stuffedhobbes]
  "19900904":
    transcript: Oooh, that rotten Susie! I hate her! I hate her! She'd better set Hobbes free! So I kidnapped her stupid doll! She didn't need to RETALIATE! Can't she take a JOKE?! Girls have NO sense of humor! That's their whole problem! All this was funny until she did the same thing to me.
    description: Calvin is fuming about Susie.  Calvin said he kidnapped her doll, but that's no reason to retaliate.  He says girls have no sense of humor.  He storms off saying this was all funny until she did the same thing to him.
    characters: [calvin]
  "19900905":
    transcript: All right, Susie, I brought your dumb doll back! Now let Hobbes out, OK? Fair's fair! I dunno, Calvin. I'm thinking I might rather have your tiger. You can keep Binky Betsy. Aahh! I don't want a DOLL! This is yours! Take it! Oh, you'll grow to like her, Calvin. She has the cutest accessories you can buy! No! No! I want Hobbes! Take this! But I think Hobbes likes it better here with ME. HE DOES NOT!
    description: Calvin brings Susie's doll back to her house.  Susie opens the door and tells Calvin she thinks she might rather have his tiger than her doll.  She tells Calvin he can keep Binky Betsy.  Calvin doesn't want a doll.  Susie says he'll grow to like her.  She has the cutest accessories you can buy.  Calvin says he wants Hobbes.  Susie tells him she thinks Hobbes likes it better there with her.  Calvin yells that he does not.
    characters: [calvin, susie, binkybetsy]
  "19900906":
    transcript: Look, Susie, I'll give you your doll AND I'll give you a quarter, OK? It's all I have. Will you let Hobbes out NOW?? All right, here. And next time, leave my stuff alone. Got it? Right! Sure! Jerk. What kind of tiger ARE you?! You didn't even maul her! What were you DOING there?! Wouldn't YOU like to know!
    description: Calvin offers to give Susie her doll and a quarter to return Hobbes.  Susie agrees and tells Calvin to leave her stuff alone next time.  They exchange and think each other are jerks.  Later, Calvin asks Hobbes what kind of tiger he is.  He didn't try to maul her.  He asks what he was doing in Susie's house.  Hobbes says wouldn't Calvin like to know.
    characters: [calvin, hobbes, susie, stuffedhobbes, binkybetsy]
  "19900907":
    transcript: I've got to say, Hobbes, it doesn't give our club a lot of credit when the First Tiger is a willing captive of the enemy. THBPTB We stole HER doll, and I'm the one who had to pay ransom! It's a disgrace! You get 15 demerits for besmirching the club's reputation, plus five demerits for conduct unbecoming an officer, and a censure in the book club for not devouring Susie when you had the chance. Hmm, anything else? I almost told her our code when she rubbed my tummy. GOOD GRAVY, WHOSE SIDE ARE YOU ON?!
    description: In their tree fort, Calvin says it doesn't give their club a lot of credit when the First Tiger is a willing captive of the enemy.  Hobbes sticks out his tongue.  Calvin says they stole her doll, and he had to pay ransom.  He says it's a disgrace.  Calvin doles out demerits for besmirching the club's reputation and conduct unbecoming an officer.  He also gives a censure for not devouring Susie when he had the chance.  When Calvin asks if there's anything else, Hobbes tells him he almost gave her their code when she rubbed his tummy.  Calvin asks whose side he's on.
    characters: [calvin, hobbes]
  "19900908":
    transcript: Well, this is certainly a sorry chapter in G.R.O.S.S. history! First tiger Hobbes, a traitor to the cuase! It might interest you to know that after I won Susie's confidence, I did some spying. Spying? You were a spy? I read an open page of Susie's diary. Wow! Deep in enemy territory, you intercepted a secret message? What did it say? It said, "Calvin is a pig-faced smelly fat-head!" Then our club is a success! Brilliant work, Hobbes! Promotions for everyone! Welcome back!
    description: Calvin declares this a sad chapter in G.R.O.S.S. history.  Hobbes says he did some spying after gaining Susie's confidence.  He says he read an open page of Susie's diary.  Excited that Hobbes intercepted a secret message deep in enemy territory, he asks what it said.  Hobbes tells him "Calvin is a pig-faced smelly fat-head".  Calvin says their club is a success.  He welcomes Hobbes back and offers promotions for everyone.
    characters: [calvin, hobbes]
  "19900909":
    transcript: Uh oh. Here comes Susie. Try not to breathe in. Here, Calvin. What's this? It's an invtiation. Mr. Bun is hosting a milk and cookie party in ten minutes, and you and Hobbes are invited. WE DECLINE! We wouldn't attend if you PAID us! We've got better things to do than sit around with GIRLS and dumb toy animals! Fine! DON'T come! Who cares? What a jerk. ...I went to all this trouble, too. Don't be disappointed, Mr. Bun. We can have a nice party all by ourselves. Phooey. Ha! We showed HER! All girls should be shipped to Pluto - that's what I say. I wonder what kind of cookies they were. YOU CAME! We don't ATTEND parties. We just CRASH 'em!
    description: Susie gives Calvin an invitation to a milk and cookie party.  Calvin declines.  He wouldn't attend if she paid him.  Susie doesn't care and walks off.  She calls Calvin a jerk and says she went to all the trouble to set up the table and chairs.  She says to Mr. Bun they can have a nice party by themselves.  Calvin happily tells Hobbes they showed her.  Hobbes wonders what kind of cookies they were.  Calvin and Hobbes go to the party.  Susie is happy.  Calvin says they don't attend parties, they crash them.
