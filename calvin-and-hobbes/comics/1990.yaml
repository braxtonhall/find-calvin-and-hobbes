    source: s-anand+seligman+miraheze
  "19900910":
    transcript: Help me with this homework, OK? What's 6+3? 6+3, eh? Well, this one is a bit tricky. First, we'll call the answer "Y", as in "Y do we care?" Now, Y may be a square number, so we'll draw a sqare and make this side 6 and that side 3. Then we'll measure the diagonal. I don't remember the teacher explaining it like this. She probably doesn't know higher math. When you deal with high numbers, you need higher math. But this diagonal is just a little under two. OK, here, I'll draw a bigger square.
    description: Calvin asks Hobbes for help with homework.  He asks what 6 + 3 is.  Hobbes calls the answer "Y", as in why do I care.  He says "Y" might be a square number, so he draws a square.  He makes one side 6, the other 3.  Then, he measures the diagonal.  Calvin doesn't remember the teacher explaining it like that.  Hobbes suggests she might not know higher math.  Calvin says the diagonal is just a little under 2.  Hobbes offers to draw the square bigger.
    characters: [calvin, hobbes]
  "19900911":
    transcript: Hey, no comic books until you finish your homework. I DID finish. That didn't take very long. Did you do a good job? I did a GREAT job. When you're as far ahead of the class as I am, it doesn't take much time. We'll see about that when I get back from my parent-teacher conference with Miss Wormwood. You're going to talk to my teacher? I'm sure it will be an informative meeting. Gosh, I forgot to tell you! Miss Wormwood said I was so good, you didn't need to bother coming, really! She said you don't have to go!
    description: Mom tells Calvin he can't read comic books until he's finished his homework.  Calvin says he is finished.  Mom asks if he did a good job, since it didn't take very long.  Calvin tells her that when you're as far ahead of the class as he is, it doesn't take long.  Mom says she'll see about that when she gets back from her parent-teacher conference with Miss Wormwood.  Shocked, Calvin says she doesn't need to bother going.  He says Miss Wormwood said he was so good, she didn't have to go.
    characters: [calvin, mom]
  "19900912":
    transcript: Oh man! Mom went to a parent-teacher conference! I'm as good as dead. Miss Wormwood will tell Mom all sorts of horror stories about me! Horror stories? Well, it's a question of perspective. Still, I think I should be allowed to have a lawyer present at the meeting. What are you going to say when your Mom gets back? Nothing. Nothing at all? Buddy, if you think I'm even going to BE here, you're crazy!
    description: Calvin is horrified that Mom is going to the parent-teacher conference.  He figures he's as good as dead, and that Miss Wormwood will tell Mom all sorts of horror stories about him.  Hobbes asks about the horror stories.  Calvin says it's all a question of perspective, but he thinks he should be allowed to have a lawyer present at the meeting.  Hobbes asks what he's going to say when Mom gets back.  Calvin says nothing.  He pulls out a suitcase and tells Hobbes he's crazy if he thinks Calvin is even going to be there when she returns.
    characters: [calvin, hobbes]
  "19900913":
    transcript: I'm home. How was your meeting with Calvin's teacher? Well, when we got to the classroom, we saw that all the kids had drawn self-portraits in the art class, and had left the pictures on their desks so the parents would recognize their child's seat. That's a cute idea. Did you find Calvin's picture? There was one drawing of a green kid with fangs, six eyes, and a finger up his nose. Uh oh. The meeting went downhill from there.
    description: Dad asks Mom how the meeting went with Calvin's teacher.  Mom saw that all the kids had drawn self-portraits in art class.  The pictures were left on their desks so parents would recognize their child's seat.  Dad asks if Mom found Calvin's picture.  She says she saw one picture with a green kid with fangs, six eyes, and a finger up his nose.  She says the meeting went downhill from there.
    characters: [mom, dad]
  "19900914":
    transcript: Calvin, I... YIKE!! You're home! I didn't even finish pack... that is, um... LIES! Everything Miss Wormwood said about me was a lie! She just doesn't like me! She hates little boys! It's not MY fault! I'M not to blame! She told you about the noodles, right? It wasn't me! Nobody saw me! I was framed! I wouldn't do anything like that! I'm innocent, I tell you! What noodles? Oh... Uh... Ha ha! Did I say noodles? You must have heard wrong. I didn't say noodles.
    description: Mom opens Calvin's bedroom door.  He is startled and says he didn't finish packing.  He says everything Miss Wormwood said about him is a lie.  He says she hates little boys.  Calvin asks if she told her about the noodles.  He says it wasn't him.  No one saw him.  He was framed.  Mom asks what noodles.  Calvin says she must have heard wrong, he didn't say noodles.
    characters: [calvin, mom]
  "19900915":
    transcript: OK, Calvin, let's check over your math homework. Let's not, and say we did. Your teacher says you need to spend more time on it. Have a seat. More time?! I already spent ten whole minutes on it! Ten minutes shot! Wasted! Down the drain! You've written here 8+4=7. Now, you know that's not right. So I was off a little bit. Sue me. You can't ADD things and come out with LESS than what you started with! I can do that! It's a free country! I've got my rights!
    description: Dad wants to check over Calvin's math homework.  Calvin doesn't want to.  Dad says his teacher said he needed to spend more time on it.  Calvin complains he's already spent ten whole minutes on it.  Dad sees an answer Calvin wrote, 8 + 4 = 7.  Dad says Calvin knows that's not right.  Calvin says he was off a bit, sue him.  Dad says you can't add things and come out with less than you started with.  Calvin protests that he can do that, it's a free country and he has his rights.
    characters: [calvin, dad]
  "19900916":
    transcript: Well! Peanut butter! ... or so it SEEMS. Did you see that? Hmm? What? My sandwich wiggled! There's something ALIVE in it! Oh stop it, Calvin. I'm not kidding! Mom must be trying to kill me! I bet there's a slug in my peanut butter! Eww! Hmm... I don't FEEL any slugs in here. What could it be? I'd better smell it. AUGH! AUGH! IT'S GOT MY NOSE!! THE PEANUT BUTTER ITSELF IS ALIVE! IT'S OOZING UP MY FACE! IT'S GOING TO SUCK OUT MY EYEBALLS! HELP! RRGH! MMF! BLRGHGH! I got it off! Quick! Drown it in chocolate milk! Boy, what a close call THAT was! Won't MOM be disappointed to see her little plot FAILED! Look at you! I've never SEEN anything so revolting! What's wrong with you?! I'm eating somewhere else. Girls are so weird.
    description: Calvin tells Susie his sandwich wiggled.  He says there's a slug in his peanut butter.  The sandwich attacks him. The peanut butter itself is alive.  He has his sandwich on his face.  He says it's going to suck out his eyeballs.  Susie looks away, sickened.  Calvin pulls the sandwich off and drowns it in chocolate milk.  With his face covered in peanut butter and chocolate milk, he tells Susie Mom will be disappointed her little plot failed.  Susie says she's never seen anything so revolting and asks what's wrong with him.  She walks away, saying she's eating somewhere else.  Calvin says girls are so weird.
    characters: [calvin, susie]
    source: s-anand+seligman+miraheze
  "19900917":
    transcript: Let's start at the beginning. When you ADD something, you INCREASE what you have. You COMBINE. I don't want to learn this! It's completely irrelevant to my life! This isn't irrelevant. Everyone needs to know this. I don't! I can get along fine without math! Oh yeah? What do you want to be when you grow up? Every job requires SOME math. That's not true! I'll be a... a... a caveman! Yeah! That's not really a job.
    description: Dad tries to explain that when you add something, you increase what you have.  Calvin says he doesn't want to learn this.  It's irrelevant to his life.  Dad says everyone needs to know this.  Calvin insists he doesn't.  He can get along without math.  Dad asks what he wants to be when he grows up.  Every job requires some math.  Calvin says he's going to be a caveman.  Dad counters that isn't really a job.
    characters: [calvin, dad]
  "19900918":
    transcript: Here, maybe this will make more sense. I have eight pennies. I ask you for four more. I say forget it. You're the one with a steady paycheck. Just give me four pennies. Good. How much money do I have now? Investments and all? No, just here on the table. Eight cents. No, eight plus four is twelve. See? Count them up. But those four are MINE!
    description: Dad tries to show Calvin.  He has eight pennies and asks for four more.  Calvin tells him he's the one with the steady paycheck.  Dad tells him to give him four pennies and asks how much he has now.  Calvin asks about investments and all.  Dad only cares about the money on the table.  Calvin replies eight cents.  Dad tells him eight plus four is twelve.  Calvin protests those four pennies are his.
    characters: [calvin, dad]
  "19900919":
    transcript: How's the math lesson going? Pretty good. I think Calvin sees the idea now. I took pennies and showed how adding and subtracting them changed how much money he had. It's not so abstract that way. Good. Maybe he'll do better in class now. I think he will. He was having fun with it by the end. Now give me ANOTHER five cents and let's see what I have! Wait a minute.
    description: Mom asks how the math lesson is going.  Dad thinks pretty well.  Dad explains that he took pennies and showed how adding or subtracting them changed how much money he had.  Mom hopes Calvin will do better in class now.  Dad thinks he will.  He says Calvin was having fun with it by the end.  Calvin tells Hobbes to give him another five cents and they'll see what he has.
    characters: [calvin, hobbes, mom, dad]
  "19900920":
    transcript: Boy, I feel sharp! I know this math stuff COLD! I'm ready for anything! I hope the teacher calls on me! I hope I get to demonstrate a problem at the board! I'll impress everyone! Here, Susie. Take one sheet and pass the rest across. What's this? A math quiz. HOT DOG!
    description: Smiling at his desk, Calvin feels he knows math cold.  He hopes the teacher calls on him.  He hopes he gets to do a problem at the board.  He'll impress everyone.  Miss Wormwood hands Susie some papers and asks her to take one and pass the rest down.  She asks what it is.  Miss Wormwood says it's a math quiz.  Enthused, Calvin says "Hot dog".
    characters: [calvin, susie, wormwood]
  "19900921":
    transcript: Don't try to copy my answers this time, Calvin, or I'll tell. Ha! Who needs YOUR answers? I'll bet I get a better score than you do. YOU?! That'll be the day! I'll bet you 25 cents I get a higher grade. You're on. You might as well give me the quarter now and save yourself the humiliation later! Maybe you'd like to increase the wager, Mr Bigmouth. Yeah! Let's double it and make it 35 cents!
    description: Susie warns Calvin not to try to copy her answers.  Calvin replies that he'll probably get a better score than she will.  Calvin bets her 25 cents.  Calvin suggests she give him the quarter now to avoid the humiliation later.  Susie suggests they raise the wager.  Calvin offers to double the bet, to 35 cents.
    characters: [calvin, susie]
  "19900922":
    transcript: Man, this is going to be great! Not only am I going to ace this quiz, but I'm going to win a quarter from Susie when I get a better score than she does! OK! The first problem is 6+5. Oh, easy! The answer is... um.... ummmmmmm... UMMMMMMMM His spacecraft quietly humming, the incredible Spaceman Spiff approaches the sixth plant of the Mysterio system!
    description: Calvin is excited that not only will he ace the quiz, he'll win a quarter from Susie when he gets a better score.  He reads the first problem, 6 + 5 =.  He thinks about it.  Spaceman Spiff approaches the sixth planet of the Mysterio system.
    characters: [calvin, spiff]
  "19900923":
    transcript: OK, I opened the door to your room. Now what's the big surprise? Uh... nothing. Try my closet.
    description: Walking along, Calvin notices leaves rustling in the tree above.  Hobbes jumps down and pounces on him. They fight, and Hobbes runs off.  Calvin walks home.  When he opens the door, Hobbes attacks again.  Calvin crawls into the house.  Mom opens the door to his room and asks what the big surprise is.  Calvin, hiding behind her legs, says to try his closet.
    characters: [calvin, hobbes, mom]
    source: s-anand+seligman+miraheze
  "19900924":
    transcript: A small red spacecraft breaks through the cloud cover of Mysterio system planet 6! At the controls, it's none other than our fearless hero, Spaceman Spiff! Piloting over the lifeless world, he reflects on his unusual mission... QUIZ 1. 6+5= ... to somehoe crash planets 6 and 5 together!
    description: Spiff commands the red spacecraft breaking through the clouds of Planet 6.  He reflects on his unusual mission, to somehow crash Planets 6 and 5 together.
    characters: [calvin, spiff]
  "19900925":
    transcript: In a scientific mission to discover what happens when two planets collide, Spaceman Spiff drops anchor! The anchor catches on a hillside! Spiff downshifts and guns the motor! Imperceptibly at first, the planet slowly moves, towed along by our hero, until... ...breaking orbit, planet 6 picks up speed, hurling towards planet 5!
    description: Spaceman Spiff drops an anchor onto the Planet 6 surface.  Spiff downshifts and guns the motor.  The planet slowly moves, towed by our hero.  It breaks orbit and speeds toward Planet 5.
    characters: [calvin, spiff]
  "19900926":
    transcript: Pulled by Spaceman Spiff, planet 6 is about to collide with planet 5! With no time to lose, our hero cuts loose the anchor and flies to safety! The planets crash, grinding and shattering with awful force! Planet 5, being smaller, is crunched to dust! Only 6 remains! 6+5=6. Time! Pass your papers forward. TIME?! I just finished the first problem!
    description: Planet 6 is about to collide with Planet 5.  Our hero cuts loose the anchor and flies to safety.  The planets grind and shatter with awful force.  Planet 5, being smaller, is crunched to dust.  Only Planet 6 remains.  Calvin answers the problem....6 + 5 = 6.  The teacher calls time.  Calvin is horrified.  He's only answered the first problem.
    characters: [calvin, wormwood, spiff]
  "19900927":
    transcript: How can our time be up?! I just did the first problem on this quiz! Where did the time go?? Guess! Guess! Pick random numbers! Maybe a few will be right by sheer luck! 15! 104! 3! 27! Hand it in, Calvin. Your time's up. SIGHHHH. Don't forget we have a bet on who gets the higher grade. The bet's off! I don't gamble! No bets!
    description: Calvin wonders how time can be up.  He hurriedly writes random numbers on the paper.  He hopes for some to be right by sheer luck.  Calvin hands in the paper.  Susie reminds him they have a bet on who has the higher grade.  Calvin says the bet's off, he doesn't gamble.
    characters: [calvin, susie, wormwood]
  "19900928":
    transcript: I got a perfect score on my quiz. You got a perfect score? What did YOU get? If you missed any, you owe me 25 cents. I ran out of time! I'd have had a perfect score too if I'd had a few more minutes! What did you get? It's biological! Girls mature faster than boys! You just got a better grade because you're a girl! It's not fair! Pay up. Maybe it's opposite day! Maybe all these X's mean that my answers are correct! Maybe your "A" is really an "F"! That must be it! I win the bet!
    description: Susie got a perfect score on the quiz.  Susie asks Calvin if he missed any.  Calvin complains he would have gotten a perfect paper if he had a few more minutes.  Calvin says it's biological.  Girls mature faster than boys.  He says she got a better grade because she's a girl.  Susie tells Calvin to pay up.  Calvin offers that maybe it's opposite day.  Maybe all his X's mean those are correct.  Maybe Susie's "A" is really an "F".  Calvin says he wins the bet.
    characters: [calvin, susie]
  "19900929":
    transcript: How did you do on your math quiz? I flunked it... but only because I ran out of time. The worst part, though, was that Susie Derkins won our bet on who'd get the better score. I had to pay her 25 cents. But get this! I cheated her! I only gave her three dimes! Ha! I think you're better study harded. Oh, now don't YOU start on me.
    description: Hobbes asks Calvin how he did on his math quiz.  Calvin tells him he flunked it, but only because he ran out of time.  He says the worst part was that Susie won their bet on who'd get the better score.  He had to pay her 25 cents.  Calvin laughs that he cheated her, though.  He only gave her three dimes.  Hobbes says Calvin better study harder.  Calvin tells Hobbes not to start on him.
    characters: [calvin, hobbes]
  "19900930":
    transcript: Call it. Heads. You said "Tails", right? I said HEADS. What a play! I'll bet it takes you four downs just to get back on the field! I think football is a sport the way ducks think hunting is a sport.
    description: Hobbes kicks the football to Calvin.  Calvin runs with the ball.  Hobbes crouches and waits.  Calvin gets closer, and Hobbes leaps toward Calvin.  They crash and roll together for a distance.  Looking back, Hobbes says he bets it takes four downs just to get back on the field.  Calvin thinks football is a sport the way ducks think hunting is a sport.
    characters: [calvin, hobbes]
    source: s-anand+seligman+miraheze
  "19901001":
    transcript: Look, Hobbes, I cut a piece of cardboard to make a TV screen. See, I just hold it up like I'm on TV. Wow, your own show! Too bad I can't really force my way into millions of people's homes each day. But on the other hand, no one ine THIS home can turn me off!
    description: Calvin has cut a piece of cardboard to make a TV screen.  He holds it up, and it's just like he's on TV.  Calvin laments he can't force his way into millions of people's homes each day.  He adds that on the other hand, no one in that home can turn him off.
    characters: [calvin, hobbes]
  "19901002":
    transcript: So what's it like being on TV? It's great! Now that I'm on television, I'm different from everybody else! I'm famous! Important! Since everyone knows me, everything I do now is newsworthy. I'm a cultural icon. I think your antenna needs adjusting. Watch, I'll use my prestige to endorse a product!
    description: Hobbes asks what it's like to be on TV.  Calvin says it's great.  Now that Calvin is on TV, he's different from everybody else.  He's special.  He says since everyone knows him, everything he does is newsworthy.  He's a cultural icon.  Hobbes thinks his antenna needs adjusting.  Calvin shows Hobbes that he's going to use his prestige to endorse a product.
    characters: [calvin, hobbes]
  "19901003":
    transcript: Hi, I'm Calvin, eminent television personality, here to tell you about new improved "Chocolate frosted sugar bombs"! I love 'em! They're crunchy on the outside, chewy on the inside, and they don't have a single natural ingredient or essential vitamin to get in the way of that rich fudgy taste! Mm-mm! Yes, kids, you'll like 'em so much, you won't be able to sit still! Remember! It's the cereal I get paid to recommend because I'm famous! What do you think? Are you filled with the desire to emulate me and eat the cereal I endorse? If not, I can repeat this every 20 minutes. Don't you threaten ME.
    description: Calvin, eminent television personality, is doing a commercial for "Chocolate Frosted Sugar Bombs".  They're crunchy on the outside, chewy on the inside.  There isn't a single natural ingredient or essential vitamin to get in the way of the rich, fudgy taste.  Calvin says it's the cereal he gets paid to recommend because he's famous.  Calvin asks Hobbes what he thinks.  He asks if Hobbes is filled with the desire to emulate him and eat the cereal he endorses.  Calvin says if not, he can repeat this every 20 minutes.  Hobbes tells him not to threaten him.
    characters: [calvin, hobbes]
  "19901004":
    transcript: Hi Mom! I've got my own TV show! That's nice. He's Ca-a-alvin! Amazing, great Ca-a-alvin! Oh, he's the one that you'd like to meet! He's the one who just can't be beat! He's ca-a-alvin! La data da daaaaa! Thank you! Thank you! Boy, what an audience! Thank you! Please! Ha ha! No, really, sit down! Thank you! Thank you! I'm changing the channel, OK? Sorry, I'm on all the networks.
    description: Calvin goes up to Mom telling her he has his own TV show.  He sings his jingle about amazing Calvin, the one you'd like to meet, the one who can't be beat.  Calvin thanks the audience.  Mom wants to change the channel.  Calvin tells her he's on all the networks.
    characters: [calvin, mom]
  "19901005":
    transcript: Where's your TV screen? My fall lineup got cancelled. Dad said one TV in the house was bad enough, and he preferred the one with the volume control. Maybe you should go cable. I've got an idea for a sit-com called "Father knows zilch".
    description: Hobbes asks where Calvin's TV screen is.  Calvin tells him his fall lineup got cancelled.  Dad said one TV in the house was enough, and he preferred the one with the volume control.  Hobbes suggests that Calvin go cable.  Calvin has an idea for a sitcom called "Father Knows Zilch".
    characters: [calvin, hobbes]
  "19901006":
    transcript: What a rip-off! They say if you connect these dots you get a picture. But look! I did it and it's just a big mess! I think you're supposed to connect them in the order that they're numbered. Oh. Everything's gotta have rules, rules, rules!
    description: Calvin has completed a connect-the-dots picture, but it doesn't look like anything.  Hobbes says you're supposed to connect them in the order they're numbered.  Calvin replies that everything has to have rules, rules, rules.
    characters: [calvin, hobbes]
  "19901007":
    transcript: Out in the farthest reaches of the galaxy..speeds that spendid specimen of spirit and spunk, the spectacular Spaceman Spiff! The fearless Spaceman Spiff sets off to expolre a new planet! The fearless Spaceman Spiff sets off to explore a new planet! The planet appears to be uninhabited. The only sign of life is a strange lichen growning on the rocks. Noticing the geometric patterns the lichen forms, Spiff bends down for a closer look. It's not lichen! It's tiny trees on tiny farmland! Peering ahead, our hero sees a sprawling city, with skyscrapers an inch high! The planet is inhabited after all! Spiff reflects that human scale is by no means the standard for life forms. As if to drive the point home, a blimp sized monster appears over the hillside! Hey, lookit Shorty here! He's playing with his fellow bugs! Haw Haw! It's a Doofus Ignoramus! Our hero slowly reaches for his stun blaster!
    description: Spaceman Spiff explores a new planet.  The only sign of life is a strange lichen growing on the rocks.  Spiff bends down for a better look.  It's not lichen.  It's tiny trees on tiny farmland.  Looking ahead, Spiff sees a city, with skyscrapers an inch high.  The planet is inhabited.  Our hero reflects that human scale is by no means the standard for life forms.  To drive the point home, a blimp-sized monster appears over the hillside.  Calvin has been playing with ants.  Moe is making fun of Calvin by yelling to one of his friends.  Calvin, slowly reaching for a rock, says Spaceman Spiff reaches for his stun blaster.
    characters: [calvin, moe, spiff]
    source: miraheze
  "19901008":
    transcript: 33... 27... 18... HIKE! AUGHH! It's clear I'll never have a career in sports until I learn to suppress my survival instinct. Touchdown!
    description: Calvin and Hobbes are playing football.  Hobbes snaps the ball and runs toward Calvin.  Calvin takes off running.  Hobbes scores.  Calvin says he'll never have a career in sports until he learns to suppress his survival instinct.
    characters: [calvin, hobbes]
  "19901009":
    transcript: What this game needs are negotiated settlements.
    description: Calvin is running with the football.  He stops suddenly, and he turns around and runs the way he came.  Hobbes tackles him.  Calvin, lying on the ground, says what this game needs are negotiated settlements.
    characters: [calvin, hobbes]
  "19901010":
    transcript: How come YOU'RE the one who goes to work, and not Mom? Well, your Mom USED to go to work, but once you came along, someone had to stay home. Your Mom's job had a lot of stress and aggravation, see, ... and she wanted to quit? No, she'd gotten used to it, so we figured she should be the one to... HEY!
    description: Dad is getting dressed for work, and Calvin asks why he is the one who goes to work and not Mom.  Dad explains that Mom used to work, but when Calvin was born someone had to stay home.  He says Mom's job had a lot of stress and aggravation.  Calvin asks if she wanted to quit.  Dad said no, she had gotten used to it, so they figured she should be the one to stay at home with Calvin.
    characters: [calvin, dad]
  "19901011":
    transcript: Get off the swing or I'll punch your lights out. What a sissy! Haw! Years from now, when I'm successful and happy, ... and he's in prison... I home I'm not too mature to gloat.
    description: Moe tells Calvin to get off the swing or he'll punch his lights out.  Calvin does, and Moe calls him a sissy.  Calvin fumes.  He says years from now, when he's successful and happy, and Moe's in prison, he hopes he's not too mature to gloat.
    characters: [calvin, moe]
  "19901012":
    transcript: Give me a nice smile. That's good. Now don't make a face, OK? Ready? One... two... thre... click. Click. *click*
    description: Calvin is sitting on a stool with a smile on his face.  Dad is getting ready to take a picture.  Dad counts to three and says click.  Calvin is still smiling.  He says click again.  Calvin still smiles.  Dad actually snaps the picture, but Calvin is making a face.
    characters: [calvin, dad]
  "19901013":
    transcript: Oh, great altar of passive entertainment... bestow upon my thy discordant images at such speed as to render linear thought impossible!
    description: Calvin bows in front of the TV.  He prays to the great altar of passive entertainment.  He asks it to bestow upon him its discordant images at such speed as to render linear thought impossible.  He turns the TV on and sits watching.
    characters: [calvin]
  "19901014":
    transcript: Heck, I could make a better picture than that. C'mon Hobbes, I've decided to be a wildlife painter! We'll go outside and you can pose for me. Oh boy! I get to be in a painting! This looks like a good natural environment. Sit on that big rock. Van Gogh would've sold more than one painting if he'd put tigers in them. Ok, you're lord of the wilderness! From your perch your survey your territory with the quiet confidence and steely eye of a jungle cat! Like this? No, that's not quite it. This? Too formal. Let's try one where the fierce tiger rests in the shade after a kill. How's this? No, no. How? This isn't working at all. How about this? Yes! That's it! Hold that! Boy, I had no idea this would be so hard. Can you imagine posing a dumb moose? Notice I'm more of a yellow ochre than a straight orange.
    description: Calvin wants Hobbes to pose for a wildlife painting.  Calvin puts Hobbes on a rock.  Calvin tells him to survey his territory with the quiet confidence of a jungle cat.  Hobbes puts a paw up to look into the distance.  Calvin doesn't think that's quite it.  Hobbes puts a paw to his chin.  Too formal.  Calvin wants to try one where the fierce tiger rests in the shade after a kill.  Hobbes lies draped over the rock.  No good.  He tries lying on his back across the rock.  Calvin gets frustrated. Hobbes strikes a fierce pose, and Calvin says that's it.  Calvin had no idea this would be so hard.  He wonders about trying to pose a dumb moose.  Hobbes reminds Calvin he's more of a yellow ochre than a straight orange.
    characters: [calvin, hobbes]
    source: miraheze
  "19901015":
    transcript: Here it is 8:00 and we have to go to bed already. Somebody's always running my life. I never get to do what I want to do. What would you do if you could stay up? I dunno... something FUN! Whatever Mom and Dad get to do!
    description: Calvin says it's 8:00, and they have to go to bed already.  Calvin complains someone is always running his life.  He never gets to do what he wants.  Hobbes asks what he would do if he could stay up.  He says something fun, like whatever Mom and Dad get to do.  Mom and Dad are asleep in their living room chairs, snoring.
    characters: [calvin, hobbes, mom, dad]
  "19901016":
    transcript: That cloud of stars is our galaxy, the milky way. Our solar system is on the edge of it. We hurl through an incomprehensible darkness. In cosmic terms, we are subatomic particles in a grain on an infinite beach. I wonder what's on TV now.
    description: Calvin points to the sky at night and tells Hobbes that cloud of stars is our galaxy, the Milky Way.  He says our solar system is on the edge of it.  He says they hurl through an incomprehensible darkness.  He says in cosmic terms, they are subatomic particles in a grain of sand on an infinite beach.  They look at the stars.  Then Calvin looks at his watch and wonders what's on TV right now.
    characters: [calvin, hobbes]
  "19901017":
    transcript: Everyone takes me for granted! Nobody pays any attention to my needs! Is it too much to ask for an occassional token gesture of appreciation?! OK, how about a big hug? Could I have 20 dollars? See?! I don't matter to anyone! Nobody cares about me!
    description: Calvin complains that everyone takes him for granted.  He asks if it's too much to ask for an occasional token gesture of appreciation.  Mom offers a big hug.  Calvin wants 20 dollars.  After Mom leaves, Calvin continues complaining that he doesn't matter to anyone.  Nobody cares about him.
    characters: [calvin, mom]
  "19901018":
    transcript: Hobbes, do you think our morality is defined by our actions, or by what's in our hearts? I think our actions SHOW what's in our hearts. I RESENT THAT!
    description: Calvin asks Hobbes if he thinks their morality is defined by their actions, or by their hearts.  Hobbes thinks their actions show what's in their hearts.  Calvin stops and says he resents that.
    characters: [calvin, hobbes]
  "19901019":
    transcript: They say winning isn't everything, and I've decided to take their word for it.
    description: Calvin is running with the football, and he stops.  He flips the ball into the air for Hobbes to grab.  Calvin says they say winning isn't everything, and he's decided to take their word for it.
    characters: [calvin, hobbes]
  "19901020":
    transcript: I STAND FIRM IN MY BELIEF OF WHAT'S RIGHT! I REFUSE TO COMPROMISE MY PRINCIPLES! I don't NEED to compromise my principles, because they don't have the slightest bearing on what happens to me anyway.
    description: Calvin says he stands firm in his belief of what's right.  He refuses to compromise his principles.  Mom comes over to him.  Calvin, in the bathtub, says he doesn't need to compromise his principles.  They don't have the slightest bearing on what happens to him anyway.
    characters: [calvin, mom]
  "19901021":
    transcript: How's your math homework going? AUGH! FINE! ...sighhhh... RGHH! GRR YIPE! RGHH RRGH YIPE! YIPE! SNAP AIEE! EEK! EEK! SNAP SNAP CRUNCH URRPP YAA! AUGH! Your book ate your homework, hmm? That's a new one. I'm lucky to be alive! I had to break its spine!
    description: Calvin's homework is on the table.  The book attacks the pencil.  It bites the pencil, then turns to attack the paper.  It bites and eats the paper.  It then turns to Calvin.  Miss Wormwood says his book eating his homework is a new one. Calvin says he's lucky to be alive.  He had to break the book's spine.
    characters: [calvin, wormwood]
    source: s-anand+seligman+miraheze
  "19901022":
    transcript: Vroom vrooom rrr! Vroom vroooom AUGHH! I wouldn't mind this so much if he didn't keep a log. Would you say you were "very surprised" or "COMPLETELY surprised"?
    description: Calvin is playing with his toy trucks.  Hobbes pounces on him.  Calvin, lying battered on the floor with Hobbes next to him says he wouldn't mind this so much if Hobbes didn't keep a log.  Hobbes, writing in his book, asks if Calvin was "very surprised" or "completely surprised".
    characters: [calvin, hobbes]
  "19901023":
    transcript: Look Mom, I made a mask. Are you getting ready for Haloween? Huh? No, this is for every day. You know how Hobbes always sneaks up from behind and pounces on me? No... Well, he does. But if you wear a mask like this on the back of your head, tigers can't tell which way you're facing, and they can't sneak up. I think your train of thought is a runaway. I read they wear these in India. Here, I made a mask for you too.
    description: Calvin shows Mom a mask he made.  She asks if it's for Halloween.  Calvin tells her it's for every day.  Since Hobbes sneaks up and attacks him from behind, Calvin can wear the mask on the back of his head.  Hobbes won't know which way he's facing, so he can't sneak up.  Mom says his train of thought is a runaway.
    characters: [calvin, mom]
  "19901024":
    transcript: Here, Dad. I made you a mask like mine. You wear it on the back of your head to prevent tiger attacks. Um... Tigers always try to get you from behin, but with this mask on, they can't tell which way you're facing, so they don't pounce. I read it in a book. Well, I appreciate your concern, but I think I'll take my chances and not look like a lunatic. OK, if you'd rather look like raw hamburger, be my guest. Honey, are we out of aspirin again?
    description: Calvin gives Dad a mask so he can avoid tiger attacks.  Calvin says he read in a book that tigers can't tell which way you're facing with the mask on.  Dad decides he'll take a chance and not look like a lunatic.  Calvin says if he'd rather look like raw hamburger, be his guest.  Dad asks Mom if they're out of aspirin again.
    characters: [calvin, dad]
  "19901025":
    transcript: Well, if it isn't ol' rocket-butt! I guess you won't be pouncing on ME any more! See, I'm wearing a mask on the back of my head! Now you can't tell which way I'm facing, so you can't sneak up from behind! I've finally thwarted your murderous recreation! Maybe this will teach you that PEOPLE are smarter than ANIMALS! You can't outwit a human! No fair! You didn't even sneak up!
    description: Calvin tells Hobbes he won't be pouncing on him anymore.  He shows Hobbes his mask.  He tells Hobbes he's finally thwarted Hobbes' murderous recreation.  Calvin boasts that this will show Hobbes that people are smarter than animals.  Hobbes gets Calvin in his mouth.  Calvin complains that wasn't fair.  Hobbes didn't even sneak up.
    characters: [calvin, hobbes]
  "19901026":
    transcript: In the middle ages, lords and vassals lived in a futile system. That's "feudal" system. Just when I thought this junk was beginning to make sense.
    description: Calvin is writing a report.  He writes "In the Middle Ages, lords and vassals lived in a futile system".  Hobbes looks at the paper and tells Calvin that's supposed to be "feudal" system.  Dejectedly, Calvin says just when he thought this junk was beginning to make sense.
    characters: [calvin, hobbes]
  "19901027":
    transcript: I'm a genius. I can't believe how smart I am. I've got more brains than I know what to do with. So I've noticed. Woo hoo hoo
    description: Walking in the woods, Calvin tells Hobbes he can't believe how smart he is.  Calvin says he has more brains than he knows what to do with.  Hobbes says he's noticed, and walks along whistling.  Calvin catches on and starts chasing Hobbes.
    characters: [calvin, hobbes]
  "19901028":
    transcript: First down and one yard to go. Only one yard? Yeah, the neighbours won't let us play in THEIR yard. HIKE! Go out long! FUMBLE! Oops, whose team was I when I recovered the ball? It doesn't matter. The game's called on account of sudden death.
    description: Hobbes passes the football to Calvin.  Calvin runs after it, and Hobbes runs past him.  Calvin makes the catch, only to turn and have Hobbes tackle him.  Hobbes picks up the fumble.  He asks whose team he was on when he recovered the ball.  Calvin tells him it doesn't matter.  The game's called on account of sudden death.
    characters: [calvin, hobbes]
    source: s-anand+seligman+miraheze
  "19901029":
    transcript: Gimme that ball or I'll punch your face in. Smart move, sissy boy. In my opinion, we don't devote nearly enough scientific research to finding a cure for jerks.
    description: Moe tells Calvin to give him the ball, or he'll punch Calvin's face in.  When Calvin does, Moe tells him that was a smart move, sissy boy.  Calvin walks off and says we don't devote nearly enough scientific research to find a cure for jerks.
    characters: [calvin, moe]
  "19901030":
    transcript: Open wide... open wide... that's good... Now this might cause some slight discomfort... hold real still.... Rrgghh! Mmf! Rrg! Stop thrashing! I've almost got it... almost... mmf! THERE! Boy, it's a good think you had this removed! Just look at all these bad spots! Lunch shouldn't have to be like this.
    description: Calvin looks into his lunch sack and tells it to open wide.  He tells it this might cause some discomfort, as he prepares to reach inside.  Calvin struggles with the bag, telling it to stop thrashing, he almost has it.  He pulls out an apple.  He says it's a good thing the bag had this removed.  Calvin notes the bad spots.  Susie has her head down next to her lunch thinking lunch shouldn't have to be like this.
    characters: [calvin, susie]
  "19901031":
    transcript: Take a look at this. Wouldn't you say this is a great drawing? I mean, can you BELIEVE my teacher didn't like it? She said it wasn't "serious"! By golly, if this isn't serious art, then nothing is! Who set Miss Wormwood up as an arbiter of aesthetics anyway? This is a beautiful work of power and depth! It's a stegosaurus in a rocket ship, right? See? YOU understood it!
    description: Calvin shows Hobbes a picture and asks if he wouldn't say this was a great drawing.  He says his teacher didn't like it.  She said it wasn't "serious".  Calvin wonders who made Miss Wormwood the arbiter of aesthetics.  He claims the picture is a beautiful work of power and depth.  Hobbes asks if it's a stegosaurus in a rocket ship.  Calvin says see, Hobbes understands it.
    characters: [calvin, hobbes]
  "19901101":
    transcript: On the one hand, it's a good sign for us artists that, in this age of visual bombardment from all media, a simple drawing can provoke and shock viewers. It confirms that images still have power. On the other hand, my teacher's reactionary grading shows that our society is culturally illiterate and that, many people can't tell good art from a hole in the ground. This drawing I did obviously challenges the know-nothing complacency of those who prefer safe, predigested, bucolic genre scenes. My "C-" firmly establishes me on the cutting edge of the avante-garde. Don't you have to wear silly clothes then?
    description: Calvin says on one hand, it's good to know images still have power in this age of visual bombardment from all media.  But on the other hand, the teacher's grading shows our society is culturally illiterate and many people can't tell good art from a hole in the ground.  Calvin's drawing obviously challenges the know-nothing complacency of those who prefer safe, predigested, bucolic genre scenes.  Calvin figures his "C-" firmly establishes him on the cutting edge of the avant-garde.  Hobbes asks if he then has to wear silly clothes.
    characters: [calvin, hobbes]
  "19901102":
    transcript: The hard part for us avante-garde post-modern artists is deciding whether or not to embrace commercialism. Do we allow our work to be hyped and exploited by a market that's simply hungry for the next new thing? Do we participate in a system that turns high art into low art so it's better suited for mass consumption? Of course, when an artist goes commercial, he makes a mockery of his status as an outsider and free thinker. He buys into the crass and shallow values art should transcend. He trades the integrity of his art for riches and fame. Oh, what the heck. I'll do it. That wasn't so hard.
    description: Calvin tells Hobbes the hard part for avant-garde artists is deciding whether or not to embrace commercialism.  Should their work be hyped and exploited by a market hungry for the next new thing?  Do they turn high art into low art so it's better suited for mass consumption?  Calvin knows an artist doing that makes a mockery of his status as a free thinker.  He trades the integrity of his art for riches and fame.  Calvin says he'll do it.
    characters: [calvin, hobbes]
  "19901103":
    transcript: Today I drew another picture in my "Dinosaurs in Rocket Ships" series, and Miss Wormwood threatened to give me a bad mark in her grade book if I didn't stop! The arts are under attack! Freedom of expression is being squelched! The authoritie are trying to silence any view contrary to their own! What does your teacher object to about drawing dinosaurs? Mostly my drawing them during math.
    description: Calvin drew another picture in his "dinosaurs in rocket ship" series, and Miss Wormwood threatened to give him a bad grade if he didn't stop.  Calvin protests the arts are under attack.  Freedom of expression is being squelched.  The authorities are trying to silence any view contrary to their own.  Hobbes asks what his teacher objects to about dinosaurs.  Calvin admits it's mostly his drawing them during math.
    characters: [calvin, hobbes]
  "19901104":
    transcript: Eeesh. What goes down must come up. BLECHH! AGKH HEY! NO! DON'T SPLOOSH HACK COUGH SPLUTTER MMF BLORP! UGH ICKK PTOOY YAA! I'LL GET YOU!! Heh heh... Hello, local navy recruitment office? Yes, this is an emergency...
    description: Calvin's dinner grabs his drink and splashes him with it.  While Calvin coughs, the dinner jumps up from its plate and hits Calvin in the face.  He chases and grabs the dinner.  Mom sees him on the table, food in hand, with cups and bowls scattered on the table.  Mom clenches her teeth in anger.  Calvin places an emergency call to the local Navy recruitment office.
    characters: [calvin, mom]
    source: s-anand+seligman+miraheze
  "19901105":
    transcript: Another gorgeous, brisk fall day. What a waste to be going to school on a morning like this. What would you do if you could stay home this morning? Sleep right through it.
    description: Standing at the bus stop, Calvin comments on it being another gorgeous fall day.  He says it's a waste to go to school on a morning like this.  Hobbes asks what Calvin would do if he could stay home that morning.  Calvin tells him he'd sleep right through it.
    characters: [calvin, hobbes]
  "19901106":
    transcript: WHOA WHOAA WHOOOP BONK AHHHH! OOH! It COULD'VE happened by accident!
    description: Calvin sits at his desk reading a book.  Suddenly, Calvin falls backward off the chair.  He tumbles down, knocking the chair and desk over.  Sitting among the wreckage, he says it could've happened by accident.
    characters: [calvin]
  "19901107":
    transcript: Don't sit next to me, Calvin. I don't want to hear any disgusting comments about lunch. Relax. I won't talk about lunch at all. Instead, do you want to hear a riddle I made up? A riddle? OK. What's the difference between a garden slug and a two-inch-long living booger? EWW!! I can't think of a difference either.
    description: Susie tells Calvin not to sit by her at lunch.  She doesn't want to hear any disgusting comments about lunch.  Calvin says he won't talk about lunch at all.  He tells Susie a riddle.  What's the difference between a garden slug and a two-inch-long living booger.  Susie runs off, while Calvin says he can't think of a difference either.
    characters: [calvin, susie]
  "19901108":
    transcript: Get off the swing, Twinky. Forget it, Moe. Wait your turn. PUNCH! It's hard to be religious when certain people are never incinerated by bolts of lightning.
    description: Moe tells Calvin to get off the swing.  Calvin tells him to wait his turn.  Moe punches Calvin.  Calvin, lying on the ground, says it's hard to be religious when certain people are never incinerated by bolts of lightning.
    characters: [calvin, moe]
  "19901109":
    transcript: I'M HOME! There's no point in saving your lunch bags if you can't keep them cleaner than THIS! That's what YOU think.
    description: Calvin puts leaves in his lunch bag, then draws a face on it.  He puts his shoes and coat around the bag and sets the bag on the porch.  He yells that he's home, and Hobbes pounces on the lunch bag.  After he comes inside, Mom looks at the bag and says there's no point in saving his lunch bag if he can't keep it any cleaner than that.  Calvin says that's what she thinks.
    characters: [calvin, hobbes, mom]
  "19901110":
    transcript: "... tranquil Mt. Calvin... Suddenly, with a shaking rumble, he blows sky high! He's a live volcano! Geysers of molten lava spray into the heavens! I TOLD you that chili sauce was hot! GLUG GLUG GLUG Yechh, he spewed it all across the table!"
    description: Tranquil Mt. Calvin blows sky high.  He's a live volcano.  Molten lava sprays into the heavens.  Calvin is frantically drinking water at the dinner table.  Dad tells him he warned him the chili sauce was hot.  Mom says he spewed it all across the table.
    characters: [calvin, mom, dad]
  "19901111":
    transcript: That's our son! *sighhh* These pictures will remind us of more than we want to remember.
    description: Calvin is yawning, making odd faces, frowning, making pucker faces, sticking his tongue out, sticking his finger in his nose, lifting the ends of his mouth, and pulling his face.  Dad and Mom are looking at pictures.  Dad says that's their son. Mom says these pictures will remind them of more than they want to remember.
    characters: [calvin, mom, dad]
    source: s-anand+seligman+miraheze
  "19901112":
    transcript: Hello, is your Dad there? No, he isn't. OK, will you write down my number and have him call me? Hold on. I need a pen. POW! AGHH! I've been shot! I hate taking messages.
    description: Calvin answers the phone.  The caller asks if Dad is there, and Calvin says no.  The caller asks for Calvin to write down his number and have Dad call.  Calvin tells the caller to hang on.  Calvin blows up a balloon, pops it, and yells he's been shot.  As he walks off, he says he hates taking messages.
    characters: [calvin]
  "19901113":
    transcript: Mom, do we have a shoe box I could have? It's for a school project. I think so. Let's see. Here's one. What are you going to do with it? I'm supposed to make a diorama. We're studying the different ecosystems and I'm going to make a desert scene. That sounds interesting. I'll need some glue and paper and stuff too. I'm going to build a cactus and a roadrunner. When is this due? It was due today, but I told the teacher I wasn't quite finished.
    description: Calvin asks Mom if they have a shoe box for a school project.  Mom gets him one.  Calvin is going to make a diorama.  They're studying different ecosystems, and Calvin's making a desert scene.  Calvin adds that he'll some glue and paper.  He's going to build a cactus and a roadrunner.  Mom asks when it's due.  Calvin tells her today, but Calvin told the teacher he wasn't quite finished.
    characters: [calvin, mom]
  "19901114":
    transcript: Wow, Mom sure turned into the conniption queen when she found out I hadn't neve started my diorama project when it was already due today. So this is one day late! What's the big deal?! It's not as if LIVES hang in the balance, right? The fate of the universe doesn't depend on turning in a shoe box desert scene on time! That's keeping things in perspective. Even if lives DID hang in the balance, it would depend on whose they were.
    description: Calvin complains to Hobbes that Mom had a conniption when she found out he hadn't started his diorama that was due today.  Calvin asks what the big deal is being one day late.  Lives don't hang in the balance.  The fate of the universe doesn't depend on his handing his desert scene on time.  Hobbes thinks that's keeping things in perspective.  Calvin adds that even if lives were in the balance, it would depend on whose they were.
    characters: [calvin, hobbes]
  "19901115":
    transcript: This is hopeless! How am I supposed to create a desert scene in this shoe box when I don't even know what a desert looks like? I'VE never been to a desert. Mom and Dad never take me anywhere fun on vacations! If they'd taken me to a desert sometime, I'd KNOW this stuff! Why don't you get out a book? And go to all that TROUBLE?! Yeah, sure! Look, I'm a busy guy! I've got other things to do with my life besides THIS, you know! Right. Why waste time learning, when ignorance is instantaneous? My TV show starts in 20 minutes. Are you going to help me or ont?
    description: Calvin figures he can't build a desert diorama if he doesn't know what a desert looks like.  He complains that Mom and Dad have never taken him to a desert for him to know this stuff.  Hobbes asks why he doesn't get out a book.  Calvin asks if he should go through all that trouble.  He says he's a busy guy.  He's got other things to do with his life besides this.  Hobbes says why waste time learning, when ignorance is instantaneous.  Calvin says his TV show starts in 20 minutes.  He asks if Hobbes is going to help him or not.
    characters: [calvin, hobbes]
  "19901116":
    transcript: Mom, where do we keep the papier-mache? We don't have any. Oh great! Just GREAT! How am I supposed to make a roadrunner without papier-mache?! Maybe you should have thought of that before 7:00 at night. You'll have to make one some other way. BUT HOW?! This is YOUR school project, Calvin. YOU do the work. If I get a bad grade, it'll be YOUR fault for not doing the work for me!
    description: Calvin asks Mom for some papier-mache.  Mom says they don't have any.  Calvin wonders how he's supposed to make a roadrunner without papier-mache.  Mom says he should have thought of that before 7:00 at night.  Calvin asks how he'll make one.  Mom tells him it's his project, he should do the work.  Calvin tells her that if he gets a bad grade, it will be her fault for not doing the work for him.
    characters: [calvin, mom]
  "19901117":
    transcript: How's the diorama coming along? I'm almost finished. That didn't take too long. That's because I'm a genius. I don't see the roadrunner. Weren't you going to put one in? See the cotton balls I glued down? Yeah? The roadrunner just ran out of the scene, leveing those clouds of dust!
    description: Calvin tells Hobbes he's almost finished with the diorama.  Hobbes says that didn't take too long.  Calvin replies that's because he's a genius.  Hobbes doesn't see the roadrunner.  He asks if Calvin wasn't going to put one in.  Calvin points out the cotton balls he glued down.  He says the roadrunner just ran out of the scene, leaving those clouds of dust.
    characters: [calvin, hobbes]
  "19901118":
    transcript: Hmm... For THIS patient, I'm going to need more tongue depressors.All right, what's wrong with you? ... like I care. My foot hurts, Doctor. Your FOOT hurts? What kind of a stupid problem is THAT?! You're the doctor! You're supposed to find out what's wrong with it. It's psychosomatic. You need a lobotomy. I'll get a doctor. A LOBOTOMY?! That's not what a REAL doctor would say! Yeah? Who's wearing the stethescope, you or me? Here's a mallet. Do you want anesthesia? Wh... that's to test REFLEXES! Y-you don't know ANYTHING! How about a SHOT then? Like a shot in the mouth? That does it! I know more about medicine than you! I'll be the doctor now! Ow! Ow! Quit kicking! See, that's why your dumb foot hurts! Stop it! Say it! Sai I'm the doctor! OK, you're the doctor! But I'm not going to be any patient of YOURS! I'm leaving! Fine! Good riddance! You ruin everything! The surgeon general should issue a warning about playing with girls. I'D be Susie's patient!
    description: The doctor asks what's wrong.  The woman says her foot hurts.  The doctor thinks that's a stupid problem. He suggests a lobotomy.  The woman says no real doctor would say that. He asks who's wearing the stethoscope.  He offers the reflex mallet for anesthesia.  The woman says he doesn't know anything.  The doctor offers a shot in the mouth.  The woman says she knows more about medicine than him.  She'll be the doctor now.  She kicks him.  Calvin says Susie is the doctor, but he's not going to be a patient of hers.  Susie tells him good riddance.  Calvin tells Hobbes the Surgeon General should issue a warning about playing with girls.  Hobbes, with a smile, says he'd be Susie's patient.
    characters: [calvin, hobbes, susie]
    source: s-anand+seligman+miraheze
  "19901119":
    transcript: You've never had an obligation, an assignment, or a deadline in all your life! You have no responsibilities at all! It must be nice! Wipe that insolent smirk off your face! The real fun of living wisely is that you get to be smug about it.
    description: Hobbes is lying on the floor.  Calvin tells him that he's never had an obligation, an assignment, or a deadline in his life.  He says it must be nice not to have any responsibilities.  Hobbes looks up with a toothy smile.  Calvin tells him to wipe that insolent smirk off his face.  Hobbes lies back down and thinks the real fun of living wisely is that you get to be smug about it.
    characters: [calvin, hobbes]
  "19901120":
    transcript: I hate doing this stuff! It's too much work. Why should I bother? "Until you can stalk and overrun, you can't devour anyone." I can see why tiger aphorisms don't catch on.
    description: Calvin complains about having to do homework.  He says it's too much work and wonders why he should bother.  Hobbes tells him "Until you stalk and overrun, you can't devour anyone".  Calvin can see why tiger aphorisms don't catch on.
    characters: [calvin, hobbes]
  "19901121":
    transcript: '"Live for the moment" is MY motto. You never know how long you''ve got! You could step into the road tomorrow and WHAM - you get hit by a cement truck! Then you''d be sorry you put off your pleasures! That''s why I say "Live for the moment". What''s YOUR motto? "Look down the road."'
    description: Calvin says "Live for the moment" is his motto.  You never know how long you've got.  Calvin says you could step into the road and get hit by a cement truck.  You'd be sorry you put off your pleasures.  Calvin asks Hobbes what his motto is.  Hobbes tells him "Look down the road".
    characters: [calvin, hobbes]
  "19901122":
    transcript: I've decided I don't want to be famous. No? Nah. ANY idiot can be famous. I figure I'M more the LEGENDARY type! Uh huh. Well, I didn't mean right this second!
    description: In the bathtub, Calvin tells Hobbes he's decided he doesn't want to be famous.  He says any idiot can be famous.  He figures he's more the legendary type.  Hobbes dubiously agrees as Calvin makes soap suds bunny ears for himself.  Calvin adds that he didn't mean right this second.
    characters: [calvin, hobbes]
  "19901123":
    transcript: Can we burn these leaves? No, that pollutes. But how can we appease the mighty snow demons if we don't sacrifice any leaves?! We'll have a warm winter. I don't know whether your grasp of theology or meteorology is the more appalling. I guess I'll go light some candles around the toboggan and beg for mercy.
    description: Dad has rakes leaves into a pile.  Calvin asks if they can burn them.  Dad says that pollutes.  Calvin wonders how they'll appease the mighty snow demons if they don't sacrifice any leaves.  They'll have a warm winter.  Dad doesn't know whether Calvin's grasp of theology or meteorology is more appalling.  Calvin walks off saying he'll light some candles around the toboggan and beg for mercy.
    characters: [calvin, dad]
  "19901124":
    transcript: Do you think tigers go to the same heaven that people go to? I mean, in heaven, everyone is supposed to be HAPPY, right? But people wouldn't be happy if they were always in danger of being eaten by tigers! On the other hand, heaven wouldn't be very nice WITHOUT tigers, either. I wouldn't be happy if there weren't any tigers. I'd miss them. Maybe tigers just don't eat people in heaven. But then WE wouldn't be happy.
    description: Calvin asks Hobbes if he thinks tigers go to the same heaven people go to.  Calvin says in heaven, people are supposed to be happy.  But people couldn't be happy if they were always in danger of being eaten by tigers.  Calvin doesn't think heaven would be nice without tigers, either.  He wouldn't be happy without tigers.  He'd miss them.  Calvin wonders if maybe tigers just don't eat people in heaven.  Hobbes says but then they wouldn't be happy.
    characters: [calvin, hobbes]
  "19901125":
    transcript: Why do animals always walk in circles before they lie down? Sorry. Privileged information. Z Psst! Hey kid! MONSTERS! What do you want? There's a big, shiny toy for you under the bed. Come get it! Oh sure! You just want me to come down there so you can grab me with some oozing appendage, slowly paralyze me with some vile secretion, and devour me alive! Nice try! Forget it! Stupid monsters. All fangs and no brains. Psst! Tiger! We'll give you some salmon if you push the kid over the bed! Is the salmon fresh? Hold on, I'll check... Yeah, it's fresh. HOBBES, DON'T LISTEN TO THEM!!
    description: Hobbes walks in circles on the bed.  Calvin asks why animals always walk in circles before they lie down.  Hobbes says it's privileged information.  There are monsters under Calvin's bed.  They tell Calvin there's a shiny toy for him under the bed.  Come get it.  Calvin says they just want him to come down so they can grab him with an oozing appendage, slowly paralyze him with some vile secretion, and devour him alive.  He says forget it.  As he turns to lie in bed, he tells Hobbes they are stupid monsters.  All fangs and no brains.  The monsters whisper to Hobbes that they'll give him some salmon if he pushes the kid over the bed.  Hobbes asks if the salmon is fresh.  They say it is.  Calvin, horrified, yells for Hobbes not to listen to them.
    characters: [calvin, hobbes]
    source: s-anand+seligman+miraheze
  "19901126":
    transcript: Hey Dad, I'll guess any number you're thinking of! Go ahead, and pick a number! Mm... OK, I've got it. Is it 92,376,051? By golly, it is! Wait a minute! You're just trying to get RID of me, aren't you?! No, you're psychic. Go show Mom.
