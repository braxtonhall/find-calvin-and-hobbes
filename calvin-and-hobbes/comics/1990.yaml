    description: Dad is reading in his chair when Calvin walks up to him.  Calvin waves his arms and says "KA ZAM!"  Dad turns into a giant, alien bug.  Calvin walks away while Dad asks what that was about.
    characters: [calvin, dad]
  "19900517":
    transcript: Okay, Calvin, let's get the groceries! Oh boy, another thrilling family outing. EWW! What IS this?! It looks like COMPOST! Mom doesn't appreciate me.
    description: Mom is filling the shopping cart with groceries.  She carries the three bags of food.  She has pots and pans all over the kitchen preparing dinner.  She serves a plate to Calvin, who says it looks like compost.  Later, sitting at the table alone with his food, Calvin says Mom doesn't appreciate him.
