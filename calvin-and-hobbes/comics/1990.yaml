  "19900901":
    transcript: You stand guard and watch for Susie while I count the money and make sure it's all there! Hey, there's no money in here at all! There's just a note! It says, "Now we're even!" Now we're even?? What's THAT supposed to mean?! Hobbes? HOBBES!
    description: Calvin sets Hobbes down and tells him to watch for Susie while he counts the money to make sure it's all there.  Calvin opens the envelope to find no money.  There is a note.  Calvin reads "now we're even".  He wonders what that means.  Susie has grabbed Hobbes and run off.  Calvin notices Hobbes missing.
