strips:
  "19900101":
    transcript: ""
    description: Calvin makes a snowball and rolls it down the hill.  He watches it go down, then cheers.  At the bottom of the hill, under a huge snowball, Susie yells back up the hill at Calvin.
    characters: [calvin, susie]
  "19900102":
    transcript: Before going down a steep hill like this, one should always give his sled a safety check. Right. Seat belts? None. Signals? None. Brakes? None. Steering? None. Wheeeee
    description: Calvin looks down the hill.  He and Hobbes are at the top of the hill with their sled.  Calvin says that before going down a steep hill, one should always give his sled a safety check.  Seat belts and signals?  Hobbes says none.  Brakes and steering?  Hobbes says none.  Down the hill they go, yelling "Wheeeeee" as they slide down.
    characters: [calvin, hobbes]
  "19900103":
    transcript: How cold is it outside? I don't know. Why don't you check? It's pretty darn cold. I'd say. Let me show you an interesting gadget that's hanging outside the window.
    description: Calvin asks Mom how cold it is outside.  Mom suggests he go check.  Calvin opens the front door and stands there.  Snow starts piling up around him and on his head.  He tells Mom he'd say it's pretty darn cold.  Mom is ready to wring his neck and says she wants to show him an interesting gadget that's hanging outside the window.
    characters: [calvin, mom]
  "19900104":
    transcript: ""
    description: Calvin throws a snowball at Susie that goes over her head.  She makes fun of Calvin.  He storms off with an angry expression.  Susie looks started.  She runs off with Calvin in close pursuit.  He has a shovel full of snow in his hand.
    characters: [calvin, susie]
  "19900105":
    transcript: This is the part of winter I like best ... when you come inside, freezing cold and soaked ... and you put on fresh dry clothes, and run up to the warm kitchen, where Mom's got a steaming mug of hot chocolate waiting for you! Mom? Mom? HEY MOM! "Calvin, I'm next door. Don't have anything to eat, or you'll spoil your appetite. Mom." It's going to be a long, cold, dark winter.
    description: Calvin and Hobbes come in from the snow.  Calvin says this is the part of winter he likes.  You come inside cold and soaked, you put on dry clothes and go into the kitchen, where Mom has a steaming mug of hot chocolate waiting for you.  He calls for Mom, but there's no answer.  Hobbes reads a note that says Mom is next door.  She writes for him not to eat anything or he'll spoil his appetite.  Calvin says this is going to be a long, cold, dark winter.
    characters: [calvin, hobbes]
  "19900106":
    transcript: While I'M doing this brain surgery, YOU can make a donor and do a heart transplant! Forget it, Calvin. I'm not playing with you any more.
    description: Calvin has built a snowman that lies on the ground.  Calvin has a saw in his hand, taking the top of the snowman off.  Calvin tells Susie that while he's doing the brain surgery, she can build a donor and do a heart transplant.  Susie walks off saying forget it.  She's not going to play with him any more.
    characters: [calvin, susie]
  "19900107":
    transcript: Hee hee hee hee But for my own example, I'd never believe one little kid could have so much brains! I'm a genius, Hobbes. There's simply no other word for it. Who else would think to arm a toboggan! It's just genius! See Susie Derkins down there? She's building a snow man and doesn't even know we're up here! We'll zip down and pelt her silly with snowballs! You steer and I'll throw! See, the snowballs will gain even more force from our own velocity! Genis, huh! Ha ha! We'll be a mile away before she can even pick her head out of the snow! There she is! Steer closer so I can get her! Lean! Lean! Augh! Steer! You're too close! Mayday!! Another genius thwarted by an incapable assistant. Hey Calvin, look up.
    description: Calvin declares himself a genius.  He has loaded snowballs onto his toboggan.  He sees Susie building a snowman down the hill.  He plans to zip down and pelt her silly with the snowballs.  He tells Hobbes to steer, while he throws. Susie hears them coming. Calvin is telling Hobbes to steer closer. Then, they're too close. Calvin calls "Mayday".  PIFF!  They run into Susie's snowman.  Calvin, lying in the snow, says another genius is thwarted by an incapable assistant.  Susie has the head of her snowman in her hands above her head.  She tells Calvin to look up.
    characters: [calvin, hobbes, susie]
  "19900108":
    transcript: Look, Hobbes, my newest invention! Isn't that your transmogrifier? It WAS. But I made some modifications. See, the box is on its side now. It's a duplicator! Ah. It combines the technologies of the transmogrifier and a photocopier, so instead of merely making a reproduction on paper, THIS machine actually creates a real duplicate! So our financial worries are over? And counterfeiting is just ONE of its many uses around the home!
    description: Calvin asks Hobbes to look at his newest invention.  It's a box, sitting open on its side.  Hobbes asks if that isn't Calvin's transmogrifier.  Calvin says that it was, but he made some modifications.  It's now a duplicator.  It combines the technologies of the transmogrifier and a photocopier.  Instead of a reproduction on paper, you get a real duplicate.  Hobbes asks if their financial worries are now over.  Calvin tells him counterfeiting is just one of its many uses around the home.
    characters: [calvin, hobbes]
  "19900109":
    transcript: Have you tested your duplicator machine yet? I was just about to. You can help. Oh boy! What will we duplicate first? Me. You?? Yeah! Mom wants me to clean my room, so I'll duplicate myself and let the duplicate do the work! Smart, huh? I can picture the look on your parents' faces when they find out they've suddenly had twins. Twins, heck! This summer I can make a whole baseball team!
    description: Hobbes asks if Calvin has tested his duplicator yet.  Calvin is ready to.  Hobbes asks what they should duplicate first.  Calvin volunteers himself.  He says Mom wants him to clean his room, so he can duplicate himself and let the duplicate do the work.  Hobbes says he can picture the looks on his parents' faces when they find out they've suddenly had twins.  Calvin thinks he can make a whole baseball team this summer.
    characters: [calvin, hobbes]
  "19900110":
    transcript: OK Hobbes, press the button and duplicate me. Are you sure this is a good idea? Brother! You doubting Thomases get in the way of more scientific advances with your stupid ethical questions. This is a BRILLIANT idea. Will ya? I'd hate to be accused of inhibiting scientific progress... here you go. Scientific progress goes "boink"? It worked! It worked! I'm a genius! No you're not, you liar! I invented this!
    description: Calvin tells Hobbes to push the button to duplicate him.  Hobbes isn't so sure he should.  Calvin criticizes Hobbes as a doubting Thomas getting in the way of scientific advancement with their stupid ethical questions.  Hobbes says he'd hate to be accused of inhibiting scientific progress, so he pushes the button.  BOINK!  Hobbes asks if scientific progress goes boink.  Inside the box, Calvin says that it worked and he's a genius.  Another voice calls Calvin a liar and says he invented it.
    characters: [calvin, hobbes]
  "19900111":
    transcript: The duplicator worked! Hobbes, meet my duplicate! Hey, nice room. Oog, I'm not sure I'm ready for this. OK, Dupe! Hobbes and I are going out to play. You clean my room and when you're done, I've got some homework you can do, too. WHAT?! Forget it, bub! Find some OTHER sucker to do your dirty work! Last one outside is a rotten egg! HEY! COME BACK HERE! He's a dupicate of you, all right. What do you mean? THIS guy is a total jerk!
    description: Calvin introduces his duplicate.  Hobbes isn't sure he's ready for this.  Calvin tells his duplicate that he and Hobbes are going out to play.  The duplicate will clean Calvin's room and do his homework.  The duplicate doesn't like that.  He runs off, telling Calvin to find another sucker to do his dirty work.  Hobbes comments on how he is a duplicate of Calvin, all right.  Calvin asks what he means.  He says the duplicate is a total jerk.
    characters: [calvin, hobbes]
  "19900112":
    transcript: Where are YOU going? Did you clean your room like I asked you to? I'm going outside. Calvin can clean his OWN room. I don't want any nonsense, Calvin. Go upstairs. Calvin? I'm not Calvin. I'm his duplicate. Calvin's in his room. What did I just say? No nonsense, Calvin. Go clean your room. Boy, you ARE a crabby lady! Who are you? Calvin's cruel governess? That does it!
    description: The duplicate walks by Mom dressed to go outside.  Mom asks if he cleaned his room like she asked him to.  The duplicate tells her that he's going outside and that Calvin can clean his own room.  Mom doesn't want any nonsense and tells him to go upstairs.  As he walks away, he says he's Calvin's duplicate.  Calvin is upstairs.  Mom gets angry and tells him to go to his room.  The duplicate says she's a crabby lady.  He asks if she's Calvin's cruel governess.
    characters: [calvin, mom]
  "19900113":
    transcript: C'mon, Hobbes. We'd better go find my duplicate before he gets me in trouble. I'm telling you, lady, you've got the wrong guy! I'm a duplicate of Calvin! Calvin is in his room! We'll see abou tthat. Give me your coat. See, Calvin? There's no one here. Now that's enough games. Clean your room, OK? Calvin? I don't see him, Hobbes. Maye he's outside, huh? We'd better hurry. I think I hear your Mom coming down the stairs.
    description: Calvin and Hobbes leave the bedroom to look for the duplicate.  Mom is putting a coat on the duplicate, who keeps telling Mom that he's not Calvin.  He says Calvin is in his bedroom.  Mom opens the bedroom door and shows there is no one there.  She tells him no more games and to clean his room.  Calvin is getting his coat on to check outside for the duplicate.  Hobbes says they better hurry.  He hears Mom coming down the stairs.
    characters: [calvin, hobbes, mom]
  "19900114":
    transcript: ""
    description: Calvin asks Dad to play outside in the snow with him.  Dad is doing paperwork, so he can't play.  Dad keeps working, but it's hard to concentrate.  He looks out the window, then at his papers.  He gets up and joins Calvin outside.  They build a snowman together.  That night, Dad is again working on his papers, but Mom holds Calvin up so he can give Dad a goodnight kiss on the head.
    characters: [calvin, mom, dad]
    review: "settled: release date confirmed via Los Angeles Times"
  "19900115":
    transcript: Calvin! What are you doing outside? Didn't I just send you to clean your room two minutes ago?! No. I did too! Now get back upstairs. I'm losing my patience for this game! She must've found my duplicate! C'mon Hobbes, we'd better hurry before he gets us in more trouble! Number three, hi! I'm number two! Charmed.
    description: Mom sees Calvin outside.  She asks if she didn't just send him to clean his room.  Calvin replies no.  Mom brings him inside and says she did tell him to clean the room.  She says she's losing patience for this game.  Calvin tells Hobbes she must have seen his duplicate.  They go to find the duplicate before he can cause any more trouble.  In the bedroom, another duplicate walks out of the duplicator.  Number two introduces himself to number three.
    characters: [calvin, hobbes, mom]
  "19900116":
    transcript: Mom said she sent me upstairs a minute ago! That must've been my duplicate! What a mess this is turning out to be! You said it! HE gets in trouble, but I'M the one who gets blamed! We'd better straighten him... AAUGH! Your duplicator is a big success. Oh no! Are you kidding? It burned out after the fifth one of us!
    description: Calvin and Hobbes run up the stairs.  Calvin says Mom must have sent his duplicate upstairs.  Hobbes says this is turning into a mess.  Calvin complains that the duplicate gets in trouble, but he gets the blame.  They're horrified as they open the bedroom door.  Hobbes says Calvin's duplicator is a big success as he looks at five duplicate Calvins.  One of them says the duplicator burned out after the fifth one.
    characters: [calvin, hobbes]
  "19900117":
    transcript: Oh no! My duplicates made duplicates! Hi, we're numbers two through six! Hobbes, what am I going to do?! Better tell your Mom to put out the extra table settings. Look, you guys have to stay in here and be real quiet! If my Mom finds out about this, she'll have a fit!
    description: Calvin is horrified to see his duplicate made duplicates.  Calvin wonders what he should do.  Hobbes suggests telling Mom to put out extra table settings.  Calvin tells the duplicates they have to stay in the room and keep quiet.  None of the duplicates want to do that.  Calvin says that since he's the original, they have to do what he says.  The duplicates suggest putting it to a vote.
    characters: [calvin, hobbes]
  "19900118":
    transcript: I don't know about the rest of you, but I'm going to get some cookies! I wonder what's on TV now? You guys, come back! Mom will see you! So what? So long as we split up and she only sees one of us at a time, she'll just think we're you! Ha ha ha. What a bunch of devious little stinkers! Where'd they learn to misbehave like that? I think we should scoot into a hotel.
    description: One of the duplicates is going to get some cookies.  One of them is going outside.  Another one wonders what's on TV.  Calvin tells them Mom will see them.  One of the duplicates says that as long as they split up, every time Mom sees one of them, she'll think they're Calvin.  The duplicates laugh and walk off.  Calvin calls them a bunch of devious little stinkers.  He wonders where they learned to misbehave that way.  Hobbes thinks they should check into a hotel until this is over.
    characters: [calvin, hobbes]
    source: seligman
  "19900119":
    transcript: Calvin, you know you're not allowed to eat cookies before dinner! Put those away! Did you clean your room yet? I'm not Calvin. I'm a duplicate. I don't want to hear about it. Now move! Ood, some days that kid of mine ... WHAT ARE YOU DOING IN HERE?! Why? Are you taking a survey?
    description: Mom tells Calvin not to eat cookies before dinner.  She asks if he cleaned his room yet.  The reply is that he's not Calvin, he's a duplicate.  Mom storms off saying "some days that kid of mine".  She sees Calvin in the living room watching TV.  She asks what he's doing in there.  The reply is "are you taking a survey".
    characters: [calvin, mom]
  "19900120":
    transcript: I'M HOME! Hi. Hi, Calvin. Hi. I SAID hi. Hi. Knock it off, Calvin. Dear, have a talk with him. He's been driving me crazy.
    description: Dad gets home, and Calvin says hi.  Dad replies, and another Calvin comes by to say hi.  Dad says that he already told him hi.  Another Calvin says hi, and Dad tells him to knock it off.  Mom tells Dad that he should have a talk with Calvin.  He's been driving her crazy.
    characters: [calvin, mom, dad]
  "19900121":
    transcript: Whose brilliant idea was it to take a hike out in this bitter cold?! I hate these forced marches! When are we going home? This is just a little walk, Calvin. The exercise is good for you. But I'm freezing! It must be 20 below! My toes are numb! Numb toes build character. Yeah? Well, what about frostbite?! What about hypothermia?! What about death?! I suppose those build character too! I can't believe I'm out here! This is the worst day of my entire life! I hate this! Aren't we going home yet? It seems like we've been walking for hours! Calvin, will you please stop griping? Griping? I'm not griping! I'm observing what a miserable experience this is! As long as I'm trudging hundreds of miles for no apparent reason, I might as well do it in silence. Just because I'm out in the elements like a complete idiot, watching my fingers turn to ice and fall off! We're home! We're home!
    description: Mom, Dad, and Calvin are walking outside.  Calvin complains that his toes are numb.  Dad tells him numb toes build character.  Calvin asks if frostbite, hypothermia, and death build character too.  He says this is the worst day of his life. He says it seems like they've been walking for hours.  Mom asks him to quit griping.  Calvin says he's not griping.  He's just observing what a miserable experience this walk is.  He complains that as long as he's trudging hundreds of miles for no apparent reason, he might as well do it in silence.  He continues ranting about being in the elements like a complete idiot, watching his digits turn to ice and fall off.  They finally get home.  Calvin grabs his toboggan and runs to play.
    characters: [calvin, hobbes, mom, dad]
    source: seligman
  "19900122":
    transcript: OK duplicates, listen up. As long as you're all here and I don't know how to get rid of you, we might as well cooperate. Specifically, with five duplicates, we can divide up the school week so there's one duplicate for each day. If the rest of us lay low, we can take turns going to school, and no one will be the wiser! Great! Now that still leaves us with the question of who gets the bed tonight. We'll fight you for it.
    description: Calvin tells the duplicates that since he doesn't know how to get rid of them, they might as well cooperate.  He says they can divide up the school week, since there are enough duplicates.  There's one for each day.  Calvin says if the rest of them lay low, they can take turns going to school, and no one will be the wiser.  Calvin ends with the question of who will get the bed.  The duplicates offer to fight him for it.
    characters: [calvin]
  "19900123":
    transcript: Hi Calvin. I'm not Calvin. I'm duplicate number two. What are you talking about? We drew straws, and today's my day to go to school. We're all taking turns so we each only go once a week. Calvin, you are so weird I'm not even going to talk to you. I'm not Calvin. I wish I lived some-place where I went to a normal bus stop. Are you in Calvin's class? Will you help me find his locker?
    description: Susie says hi to Calvin.  The reply is that he's duplicate number two.  Susie asks what he's talking about.  He explains that they drew straws, and it's his day to go to school.  They're taking turns.  Susie says Calvin's so weird, she isn't going to talk to him.  He says he's not Calvin.  Susie wishes she lived someplace where she went to a normal bus stop.  He asks if she'll help him find Calvin's locker.
    characters: [calvin, susie]
  "19900124":
    transcript: Calvin, would you please demonstrate the hoemwork problem you were assigned yesterday? I wasn't here yesterday. Yes, you were, Calvin. Didn't you do your problem? I'm not Calvin. I'm duplicate number five. Duplicate number TWO was here yesterday, not ME. We're all taking turns. Number two wil be back next week, and you can ask him to do the problem THEN. Look, I don't see what's so hard about this!
    description: Miss Wormwood asks Calvin to demonstrate the homework problem that was assigned.  Calvin says he wasn't there yesterday.  Miss Wormwood says he was present.  The explanation is that he is duplicate number five.  Duplicate number two was at school yesterday.  They are taking turns.  Number two will be back next week, so she can ask him to do the problem then.  In the principal's office, Calvin says he doesn't see what's so hard about this.
    characters: [calvin, wormwood, spittle]
  "19900125":
    transcript: Guys? It's OK to come out! It's me, number four. I'm home. How was school today? Ahh, I got sent to the Principal's office, just like numbers two and five did. Geez, you guys! Even I don't get sent to the principal every DAY! You're making me look bad! Look, Calvin, if you don't like our performance, you can go to school YOURSELF! Whoa, let's not jump to conclusions! I'm just saying there's room for improvement. Hey four, were you able to swipe any chalk? Yeah! The principal never frisked me!
    description: Number four comes in the bedroom.  He tells the others it's okay to come out.  They ask how school went.  He tells them he was sent to the principal's office, just like numbers two and five did.  Calvin says not even he got sent to the principal's office every day.  He says they're making him look bad.  One of the duplicates says that if Calvin doesn't like their performance, he can go to school himself.  Calvin says they shouldn't jump to conclusions.  All he's saying is there is room for improvement.
    characters: [calvin]
  "19900126":
    transcript: Hobbes, we've got to get rid of these duplicates! All they do is get me in trouble! Everyone thinks I'M doing all these rotten things, when really it's a duplicate! I'm being framed by my own doubles! RUN! HIDE! OUTTA MY WAY! It appears you've just perpetrated another crime. The worst part is that I don't even have the fun of doing the stuff I'm getting blamed for.
    description: Calvin tells Hobbes they need to get rid of the duplicates.  All they do is get him in trouble.  Calvin says everyone thinks he's doing all these rotten things, when it's really a duplicate.  He's being framed by his own doubles.  A bunch of duplicates run past Calvin, saying "run" and "hide".  Hobbes says it appears Calvin has perpetrated another crime.  Calvin complains that the worst part is that he doesn't even have the fun of doing the stuff he's getting blamed for.
    characters: [calvin, hobbes]
  "19900127":
    transcript: All right, what did you guys do NOW? You'd better hide, Calvin! Your Mom's on the warpath! CALVIN? She's coming! Quick, get under the duplicator box! There you are! What have you got to say for yourself? I want an explanation for this behavior! Tell her you need a bigger allowance! Yeah! Five TIMES bigger! Um, can I get back to you on this, Mom? NO.
    description: Calvin asks the duplicates what they've done now.  They tell him to hide, because Mom is on the warpath.  All the duplicates hide under the duplicator box when Mom comes in.  Calvin smiles and tries to look innocent while Mom asks him to explain his behavior.  From under the box, Calvin hears whispered a request to have a bigger allowance.  Five times bigger.  Calvin asks if he can get back to her on that issue.
    characters: [calvin, mom]
  "19900128":
    transcript: I think this is my favorite time of year! The new snow makes everything look so pretty. Whoaaaa! Wumph! I think this is my favorite time of year! The new snow muffles approaching footsteps! Hoo Hoo! Man, I can't wait for spring.
    description: Calvin stands looking at the snow, saying everything looks so pretty.  He says it's his favorite time of the year. A shadow falls over Calvin.  He looks up to see Hobbes.  WUMPH!  They tumble in the snow and roll down the hill. Covered with snow, Hobbes says this is his favorite time of the year.  The new snow muffles approaching footsteps.  Also covered with snow, Calvin says he can't wait for spring.
    characters: [calvin, hobbes]
    source: miraheze
  "19900129":
    transcript: Boy, Mom sure did read ME the riot act, didn't she? I have an idea. Psst. Calvin! Is the cost clear? Did your Mom go away yet? Can we come out now? Oh no! Your Mom's coming back! There she is! Stay in the box, guys! Keep quiet! Yikes! Shh! Hobbes, you're a genius! I don't hear her. Do you? Hey, what's going on out there?
    description: Calvin is depressed that Mom read him the riot act.  Hobbes whispers a suggestion to Calvin, who smiles.  From under the box, voices ask if Mom has left, if the coast is clear, and whether they can come out.  Hobbes says Mom is coming back again.  Calvin tells the duplicates to be quiet.  Calvin calls Hobbes a genius, as Calvin changes the wording on the box from duplicator to transmogrifier.
    characters: [calvin, hobbes]
  "19900130":
    transcript: So long, duplicates! What do you mean? We're not going anywh... ZAP! What did you transmogrify them into? Worms! Worms?! Well, I didn't want them to be unhappy... Cool! Look at us! Ha ha! Let's go gross someone out!
    description: Calvin says so long to the duplicates.  From under the box, they start to say they're not going anywhere.  Calvin turns on the transmogrifier.  ZAP!  Hobbes asks what he changed them into.  Calvin tells him worms.  He says he didn't want them to be unhappy.
    characters: [calvin, hobbes]
  "19900131":
    transcript: Well Mom, you don't need to worry about me getting into trouble any more. Oh really? Yup. See, I made these duplicates of myself, and THEY were the ones who were bad, not me. Uh huh... But NOW look! I transmogrified them! OH CALVIN! DON'T CARRY WORMS THROUGH THE HOUSE! OUT! OUT! Well there! You got me in trouble one last time. I hope you're happy! You sure you don't want to put us on your Dad's dinner plate before we go?
    description: Calvin tells Mom he won't be getting into trouble anymore.  Calvin again explains that he made duplicates of himself, and it was the duplicates who were bad.  Calvin shows her that he transmogrified them.  He holds his hands open, showing the worms.  Mom yells for him not to carry worms through the house.  She sends him outside.  Calvin digs a hole to put the worms in.  He tells them they got him in trouble one last time.  He hopes they're happy.  The worms ask if he doesn't want to put them on Dad's dinner plate tonight before they go.
    characters: [calvin, mom]
  "19900201":
    transcript: Well, Hobbes, I guess we learned a valuable lesson from this duplicating mess. And what is? And that is, um... It's that, well... OK, so we didn't learn any big lesson. Sue me. Live and don't learn, that's us.
    description: Calvin tells Hobbes that they learned a valuable lesson from this duplicating mess.  Hobbes asks what that lesson is.  Calvin thinks about it, but can't come up with anything.  As they walk off, Calvin says "So we didn't learn any big lesson.  Sue me".  Hobbes replies "Live and don't learn.  That's us".
    characters: [calvin, hobbes]
  "19900202":
    transcript: WHAP! DID YOU THROW THAT?!? Throw what? Let me see your mittens! There, look! Flecks of bark, pieces of gravel, spots of mud, and granules of ice! That was YOUR snowball, all right! That's the problem with having a signature style.
    description: WHAP!  Susie gets smacked in the back of the head with a snowball.  She asks Calvin if he threw it.  Calvin pleads ignorance.  Susie looks at Calvin's mittens and sees bits of gravel, bark, mud, and ice.  She says it was his snowball.  Calvin, lying in a pile of snow, says that's the problem with having a signature style.
    characters: [calvin, susie]
  "19900203":
    transcript: HA! YOU MISSED BY A MILE! NYA NYAHH! THBPTBH! Yes? You're darn lucky I didn't get a snow blower for Christmas!
    description: Calvin aims and throws a snowball.  He's angered when his target says he missed by a mile.  Calvin storms over.  Hobbes is there, and Calvin tells him he's lucky Calvin didn't get that snow blower for Christmas.
    characters: [calvin, hobbes]
  "19900204":
    transcript: Let's hurry down this hill and go home. What's the rush? There's a TV show on sledding I want to watch. In my opinion television validates existence. Take this sled ride, for instance. The experience is fleeting and elusive. By tomorrow, we'll have forgotten it, and it may as well have not even happened. But if we were on TV now, countless viewers would share in the event and confirm it! This ride would become a part of mass consciousness! And, on TV, the impact of an event is determined by the image, not its substance.
    description: Sledding down the hill, Calvin says television validates existence.  The sled ride is fleeting and elusive.  By tomorrow, they will have forgotten it, and it may as well have not happened.  If they were on TV, countless viewers would share in the event and confirm it.  This sled ride would become part of mass consciousness.  On TV, the impact of an event is determined by the image, not its substance.  With strong visuals, their sled ride could make them cultural icons.  Instead of being boring ol' Calvin and Hobbes, they could be "Calvin and Hobbes - as seen on TV".   They fly off the edge of the hill.  Hobbes says at this moment, he likes his anonymity.  Calvin thinks they should go for the high-brow public TV audience.
    characters: [calvin, hobbes]
    source: miraheze
  "19900205":
    transcript: "QUIZ: Jack and Joe leave their homes at the same time and drive towards each other. Jack drives at 60 mph, while Joe drives at 30 mph. They pass each other in 10 minutes. How far apart were Jack and Joe when they started? It was another baffling case. But then, you don't hire a private eye for the easy ones ..."
    description: Calvin reads his quiz question.  Joe and Jack leave their homes at the same time, driving toward each other.  One drives 60 mph, the other 30 mph.  They pass in ten minutes.  How far apart were they when they started?  Calvin looks at the paper.  Calvin is in his office, hat on, feet propped up, cigarette in mouth.  He says "It was another baffling case.  But then, you don't hire a private eye for the easy ones".  Tracer Bullet is here.
    characters: [calvin, tracer]
  "19900206":
    transcript: I'd planned to take the day off and spend time with a couple of buddies. My buddies travel light and they're fun to have around. One travels in a holster, and the other in a hip flask. My name is Bullet. Tracer Bullet. What people call me is something else again. I'm a private eye. It says so on my door. The last thing I wanted this morning was a case to solve, but the dame who brought it was persuasive. Most dames are, somehow. Get to work, Calvin. I told her it would cost fifty greenbacks a day, plus expenses.
    description: It's Tracer Bullet, Private Eye.  It says so on the door.  He planned to take the day off with his buddies.  They travel light and are fun to have around.  One travels in a holster, the other in a hip flask.  The last thing he wanted was a case to solve, but the dame who brought it was persuasive.  Miss Wormwood tells Calvin to get to work.  Calvin is sitting at his desk, with his feet up, thinking it would cost her fifty greenbacks a day, plus expenses.
    characters: [calvin, wormwood, tracer]
  "19900207":
    transcript: I stepped out into the rainy streets and reviewed the facts. There weren't many. Two saps, Jack and Joe, drive towards each other at 60 and 30 mph. After 10 minutes, they pass. I'm supposed to find out how far apart they started. Questions pour down like the rain. Who ARE these mugs? What were they trying to accomplish? Why was Jack in such a hurry? And what difference does it make where they started from? I had a hunch that, before this was over, I'd be sorry I asked.
    description: Tracer steps out to the street to review the facts.  Two saps, Joe and Jack, drive toward each other and pass.  Questions pour down like rain.  Who are these mugs?  What are they trying to accomplish?  Why was Jack in such a hurry?  Why does it matter where they started?  He had a hunch that before this was over, he'd be sorry he asked.
    characters: [calvin, tracer]
  "19900208":
    transcript: First I figured I'd try the Derkins dame. Susie and I never hit it off, although occasionally we hit each other. Susie had a face that suggested somebody upstairs had a weird sense of humor, but I wasn't going to her place for laughs. I needed information. The way I looked at it, Derkins acted awfully smug for a dame who had a head for numbers and not much else. Maybe she's got something on Jack and Joe. The question is, will she sing? No, I won't tell you what the answer is. Do your OWN work!
    description: Tracer figures he'll try the Derkins dame.  Susie and he had never hit it off, occasionally they hit each other.  Tracer says Susie has a face that suggests someone upstairs has a weird sense of humor.  But he needed information.  He figures she looks pretty smug for a dame with a head for numbers, but not much else.  The question is, will she sing?  Susie tells Calvin she will not tell him the answer and to do his own work.
    characters: [calvin, susie, tracer]
  "19900209":
    transcript: The Derkins dame wasn't talking. Someone had gotten to her first and shut her up good. I knew Susie, and closing her mouth would've taken some work. I needed a clue and a drink. One of them I knew where to find. You've made enough trips to the water fountain. Finish your quiz. Suddenly a gorilla pulled me in an alley, squeezed my spine into an accordion, and played a polka on me with brass knuckles. Youse ain't going nowhere, flatfoot.
    description: Bullet says the Derkins dame wasn't talking.  Someone had gotten to her and shut her up good.  He knows Susie.  Closing her mouth would have taken some work.  He needed a clue and a drink.  He knew where to find one of them.  Miss Wormwood grabs Calvin and says he's had enough trips to the water fountain.  Tracer says a gorilla pulled him into an alley, squeezed his spine into an accordion, and played a polka on him with brass knuckles.
    characters: [calvin, wormwood, tracer]
  "19900210":
    transcript: 'The inside of my head was exploding with fireworks. Fortunately, my last thought turned out the lights when it left. When I came to, the pieces all fit together. Jack and Joe''s lives were defined by integers. Obviously, they were part of a "numbers" racket! Back in the office, I pulled the files on all the numbers BIG enough to keep Susie quiet and want me out of the picture. The answer hit me like a .44 slug. It had to be the number they called "Mr. Billion". Answer: 1,000,000,000. Case closed! Time''s up. Bring your papers forward. What did you get, Calvin? I think the answer''s 15.'
    description: Tracer's head was exploding with fireworks.  When he came to, the pieces fit together.  Jack and Joe's life were defined by integers.  They were in a "numbers" racket.  Back in the office, Tracer pulled the files on numbers big enough to keep Susie quiet and to want him out of the picture.  Calvin answers 1,000,000,000 on his quiz.  Case closed!
    characters: [calvin, susie, wormwood, tracer]
  "19900211":
    transcript: "I love fresh snow. It helps me avoid Calvin. Winter has wrapped the land in a soft, white blanket, and the earth sleeps quietly. Calvin, out of frame: Whoaa. Oomph. AA! Look out below! Lean! Lean! Augh! Mayday! Bail out! SMASH! You call that steering? We almost got killed! My fault? Yeah, step over here and say that you stripey dope! That's right, I'm talking to you! Hey! Ow! Quit biting!! Oof! Take that! Ow! I think when I grow up, I'll live in the tropics. Quit it! Quit it! Let go! Whee! Let's get the sled out of the tree and do that again! You know what we need for our sled? A siren!"
    description: Susie stands in the snow saying winter has wrapped the land in a soft, white blanket, and the earth sleeps quietly.  Suddenly, she hears yelling coming down the hill.  It's Calvin, yelling at Hobbes to lean, yelling "look out below", "mayday", and "bail out".  Calvin's sled crashes.  He yells at Hobbes for almost getting them killed.  They start fighting.  Susie walks away, saying that when she grows up, she'll live in the tropics.  Hobbes tells Calvin to get the sled out of the tree so they can do it again.  Calvin wants to get a siren for the sled.
    characters: [calvin, hobbes, susie]
    source: miraheze
  "19900212":
    transcript: I missed the bus, Mom. Oh no. Hurry! If we jump in the car, you can zoom up, pass the bus on a straghtaway, drop me off at a later stop, and I can ride the bus from there! C'mon! What are you waiting for? Rev up the car! Mom's so lazy.
    description: Calvin comes back inside, telling Mom he missed the bus.  He tells her if she hurries, they can jump in the car, zoom up and pass the bus, drop him at a later stop, and he can ride the bus from there.  Mom is sitting at the kitchen table, drinking coffee.  Calvin runs up to her asking what she's waiting for.  He tells her to rev up the car.  Calvin, walking down the sidewalk, says Mom's so lazy.
    characters: [calvin, mom]
  "19900213":
    transcript: Readyyy... Aimmm....
    description: Calvin makes a big snowball.  He makes another and sets it on top of the first.  He makes a snowman standing against a tree.  He puts a blindfold on it and a stick in its mouth.  Calvin gets a snowball in his hand and says ready, aim...
    characters: [calvin]
  "19900214":
    transcript: Bedtime, kiddo. Aw, Mom! Can't I watch the next program? No, you need your sleep. C'mon. Can I watch another 15 minutes? Please?? OK, just 10 minutes! Then I'll go straight to bed! Five minutes! Just five minutes, OK? Turn off the TV. Look, I'll just watch a few more commercials, OK? See, here's my favorite gum commercial! I guess that got pretty pathetic.
    description: Mom tells Calvin it's bedtime.  Calvin asks to watch the next TV program.  Mom tells him he needs his sleep.  Calvin begs for another fifteen minutes of TV watching.  Then he tries asking for ten, and finally five minutes.  Mom tells him to turn off the TV.  Calvin says he'll just watch a few more commercials.  He points out his favorite gum commercial just coming on.  In bed, Calvin guesses that got pretty pathetic.
    characters: [calvin, mom]
  "19900215":
    transcript: Oh NO! I just remembered that today is "Show and Tell" day! I need something to show and tell about! Why can't you think of these things more than two minutes before the bus comes? What can I take? I've gotta take something! I've ...ah... ACHOOO Never mind, Mom! Do we have any plastic bags? I don't want to know. I don't want to know. I don't...
    description: Eating breakfast, Calvin remembers that it's "show and tell" day.  Mom asks why he can't think of these things more than two minutes before the bus arrives.  Calvin runs off saying he has to take something.  As he runs, he sneezes into his hands.  He tells Mom never mind, and he asks if they have any plastic bags.  Mom, sitting reading the newspaper, repeats over and over "I don't want to know".
    characters: [calvin, mom]
  "19900216":
    transcript: See? SEE? Starboard is RIGHT! PORT is left! OK, so I was wrong for once in my life! Shut up.
    description: Calvin and Hobbes are covered with snow, their sled stuck into the ground.  They stomp along, still covered with snow.  They're both frowning as they take their coats off and brush off the snow.  They both stomp along, still frowning.  Hobbes points to the page in the dictionary.  He says he told Calvin that starboard is right, and port is left.  Calvin concedes that he was wrong for once in his life and tells Hobbes to shut up.
    characters: [calvin, hobbes]
  "19900217":
    transcript: AARGHH! I MISSED! It's these fuzzy mittens! The snow STICKS to 'em and you can't throw straight! Darn it! Darn it! Darn it! I HATE these fuzzy mittens! If only Mom had gotten me padded gloves instead of these no-good, awful, rotten fuzzy mittens! WHAP! Well I'll be! My fuzzy mittens HAVE pads!
    description: Calvin throws a snowball, but misses.  He laments his fuzzy mittens.  He complains the snow sticks to them, preventing him from throwing straight.  As he packs another snowball, he says he hates his fuzzy mittens.  If Mom had gotten him padded gloves instead of those mittens....WHAP!  He's hit by a snowball.  Hobbes walks over to the snow-covered Calvin, looks at his paws, and says that his fuzzy mittens have pads.
    characters: [calvin, hobbes]
  "19900218":
    transcript: The incredible Spaceman Spiff, interplanetary explorer extraordinaire, descends toward an alien planet surface! Another day, another mind-boggling adventure! The fearless Spaceman Spiff cruises low over planet Quorg, a desolate world of deep gorges and canyons! Searching for life, our hero explores the peculiar rock formations! ...The very peculiar rock formations! ...A little too peculiar, perhaps! Suddenly our hero realizes that this landscape was not created by geological forces! Spiff hits the thrusters! While Spiff was searching for alien life, it seems alien life was searching for Spiff! No doubt it wanted the earthling for dinner! Calvin, where are you?! It's time for dnner! Ugh! Spiff blasts into hyperspace!
    description: Spaceman Spiff cruises over Planet Quorg.  Our hero explores the peculiar rock formations, looking for life. The rock formations are too peculiar.  Spiff suddenly realizes this landscape was not created by geological forces.  Spiff hits the thrusters.  The formations are footprints.  While Spiff was searching for alien life, it was searching for him.  Spiff is sure it wanted the earthling for dinner.  Calvin sees footprints in the snow, while he hears his name being called to dinner.  Calvin runs the opposite way.
    characters: [calvin, spiff]
    source: miraheze
  "19900219":
    transcript: WUMP!
    description: Susie happily builds a snowman.  Calvin and Hobbes come rocketing down the hill on their sled.  WUMP!  The snowman goes down the hill on the sled.  Susie, Calvin, and Hobbes are stacked up where the snowman used to be.
    characters: [calvin, hobbes, susie, stuffedhobbes]
  "19900220":
    transcript: ANY dumb kid can build a snowman, but it takes a genius like me to create ART. This snow sculpture transcends corporeal likeness to epxress deeper truths about the human condition! This sculpture is about grief and suffering! One look at the tortured countenance of this figure confirms that the artist has drunk deeply from the cup of life! This work shall endure and inspire future generations!
    description: Calvin is building a snowman.  He tells Hobbes that any dumb kid can build a snowman, but it takes a genius like him to create art.  He says his snow sculpture transcends corporeal likeness to express deeper truths about the human condition.  His sculpture is about grief and suffering.  He says one look at the tortured countenance of the figure confirms the artist has drunk deeply from the cup of life.  He says his work will endure and will inspire future generations.  As they stand there, the sun starts to melt the snowman.
    characters: [calvin, hobbes]
  "19900221":
    transcript: Still making snow art? Yep! Yesterday your sculpture melted. This time I'm taking advantage of my medium's impermanence... This sculpture is about transcience. As this figure melts, it invites the viewer to contemplate the evanescence of life. This piece speaks to the horror of our own mortality! Hey stupid! It's too warm to build a snowman! What a dope! Ha ha ha ha! A philistine on the sidewalk. Genius is never understood in its own time.
    description: Hobbes asks if Calvin is making more snow art, since his snowman melted the day before.  Calvin tells him that this time, he's taking advantage of the medium's impermanence.  This sculpture is about transience.  As the snowman melts, it invites the viewer to contemplate the evanescence of life.  It speaks to the horror of our own mortality.  Someone yells that it's too warm to build a snowman, and they laugh at Calvin.  Hobbes says there is a philistine on the sidewalk.  Calvin says genius is never understood in its own time.
    characters: [calvin, hobbes]
  "19900222":
    transcript: How's your snow art progressing? I've moved into abstraction! Ah. This piece is about the inadequacy of traditional imagery and symbols to convey meaning in today's world. By abandoning representationalism, I'm free to express myself with pure form. Specific interpretation gives way to a more visceral response. I notice your oeuvre is monochromatic. Well c'mon, it's just snow.
    description: Hobbes asks how Calvin's snow art is coming.  Calvin says he's moved into abstraction.  His piece is about the inadequacy of traditional imagery and symbols to convey meaning in today's world.  By abandoning representationalism, he's free to express himself with pure form.  Specific interpretation gives way to a more visceral response.  Hobbes notices Calvin's oeuvre is monochromatic.  Calvin replies that it's just snow.
    characters: [calvin, hobbes]
  "19900223":
    transcript: Dad, if you threw a snowball at someone, but deliberately missed, would that be 'bad'? Well, I suppose that would be provoking, so yes, it would be a little bad. As bad as if you'd hit the person? No, not THAT bad, but worse than if you hadn't thrown it at all. Suppose you just GRAZED the person. How bad would that be? Say maybe you knocked off his hat and his glasses or something. That would mean instant death.
    description: Calvin asks Dad if he threw a snowball at someone and deliberately missed, would it be "bad".  Dad says that since it would be a little provoking, it would be a little bad.  Not as bad as if you hit the person, but more than if you hadn't thrown it at all.  Calvin then asks how bad it would be if you just grazed the person, or knocked off his hat and glasses.  Dad says that would mean instant death.
    characters: [calvin, dad]
  "19900224":
    transcript: Boys, this pudding was great! Can I take a bowl upstairs to Hobbes? No, I think you've had enough. I didn't say for ME. I said for HOBBES! Well, I don't think "Hobbes" needs any either. WHY NOT?! Um... Because tigers need to stay lean and mean. That's what she said. I'm lean! I'm mean! Tell her chocolate pudding makes my coat lustrous.
    description: Calvin is eating and tells Mom that the pudding was great.  He wants to take a bowl upstairs to Hobbes.  Mom says he's had enough.  Calvin clarifies that he was going to give it to Hobbes.  Mom says Hobbes doesn't need any pudding.  Mom says tigers need to stay lean and mean.  Calvin explains to Hobbes that's what Mom said.  Hobbes checks his torso and says he's lean and mean.  He tells Calvin to tell Mom the chocolate pudding makes his coat lustrous.
    characters: [calvin, hobbes, mom]
  "19900225":
    transcript: SSSSSS SSSSSS If there's more to life than this, I don't know what it is.
    description: Calvin and Hobbes sit by the fireplace.  Suddenly, it gets too warm.  They dash away from the fire.  They lie down and feel the sizzle as they cool off.  Back to the fire they go.  Calvin says if there's more to life than this, he doesn't know what it is.
    characters: [calvin, hobbes]
    source: miraheze
  "19900226":
    transcript: Why should I go to school?! Why can't I stay at home? Why do I have to learn? Why can't I stay the way I am? What's the point of this? Why do things have to be this way? Why can't things be different? Life is full of mysteries, isn't it? See you this afternoon. At 7:00am, Mom's not very philosophical.
    description: Calvin wants to know why he has to go to school.  He asks why he has to learn, why can't he stay the way he is.  He wonders why things have to be this way, why can't they be different.  As Mom pushes him out the door, she says life is full of mysteries.  Calvin realizes that at 7:00 AM, Mom isn't very philosophical.
    characters: [calvin, mom]
  "19900227":
    transcript: All set? Yep! OK, get read! NOW! SMASH Too bad the back of the camera opened when we landed. That would've been a great picture.
    description: On the toboggan, Calvin asks if Hobbes is set.  Hobbes is carrying a camera.  Down the hill they go.  Calvin tells Hobbes to get ready.  They smash into a rock and fly into the air.  Calvin yells "Now", and Hobbes snaps the picture.  Coming back up the hill covered with snow, Calvin tells Hobbes it's too bad the camera opened when they landed.  That would have been a great picture.
    characters: [calvin, hobbes]
  "19900228":
    transcript: Ha! I've got a great word and it's on a "double word score" box! "ZQFMGB" isn't a word! It doesn't even have a vowel! It is SO a word! It's worm found in new guinea! Everyone knows that! I'm looking it up. You do, and I'll look up that 12-letter word YOU played with all the Xs and Js! What's your score for ZQFMGB? 957.
    description: Calvin and Hobbes are playing Scrabble.  Calvin claims a double-word score.  Hobbes complains that "ZQFMGB" isn't a word.  Calvin tells him it's a worm found in New Guinea.  Hobbes says he's going to look it up.  Calvin says if he does, he's going to look up the 12-letter word Hobbes played with all the X's and J's.  Hobbes asks Calvin what his score for the word is.  Calvin replies "957".
    characters: [calvin, hobbes]
  "19900301":
    transcript: Hey, no TV until your homework is done. It's getting done. Not with you sitting HERE, it isn't. Hobbes is reading my book for me. After I'm done watching TV, he'll tell ME what the book was about, and I'll tell HIM what the TV shows were about! See, we're doing twice as much in the same amount of time! Mom says YOU should watch TV and I should read the dumb book. Ugh, I only like nature documentaries.
    description: Calvin is watching TV, and Mom tells him he can't watch anymore TV until his homework is finished.  Calvin says it's getting done.  Hobbes is reading his book for him.  Calvin explains that he'll watch TV, Hobbes will tell him what the book was about, then Calvin will tell Hobbes what the TV show was about.  They're doing twice as much in the same amount of time.  Calvin walks back into the bedroom.  He tells Hobbes that Mom said Hobbes should watch the TV and Calvin should read the book.  Hobbes says he only likes nature documentaries.
    characters: [calvin, hobbes, mom]
  "19900302":
    transcript: Hey Twinky, gimme a quarter. WHAT?! Why should I give you my money?! It's for the "Let Calvin Live Through The Recess Fund." Sounds like a worthy cause. His motto is "Give before it hurts."
    description: Moe tells Calvin to give him a quarter.  Calvin asks why he should give him his money.  Moe replies it's for the "Let Calvin Live Through Recess Fund".  Calvin digs into his pocket and says that sounds like a worthy cause.  After Moe leaves, Calvin says Moe's motto is "Give Before It Hurts".
    characters: [calvin, moe]
  "19900303":
    transcript: MOMMM! I NEED A DRINK OF WATER! Mphhh... Calvin, it's after midnight. Get a drink yourself. I can't. There are monsters under my bed! I'm scared. OK... Ok... Ok... AAUGH
    description: Calvin wakes up at night and yells for Mom to bring him a glass of water.  Mom says it's after midnight and that he should get the drink himself.  Calvin replies there are monsters under his bed and that he's scared.  Mom says okay.  Mom turns on the light to bring the water, and Calvin sees Mom with her hair all messed up and eyes partially closed.  He is horrified and yells "AAUGH".
    characters: [calvin, mom]
  "19900304":
    transcript: 140 million years ago, the incredible 'ultrasaurs' wander over the earth! Some weigh over 70 tons, and even the vicious allosaurs are no match for these giants! But wait! A distant rumbling sends the ultrasaurs into a panicked stampede! Is it a volcano? Is it an earthquake? No! It's... it's a Calvinosaurus! Named after the renowned archeologist who discovered it, the huge calvinosaur can eat an ultrasaur in a single bit! Phooey! I never find ANYthing. It looks like you've hit the sewer pipe.
    description: Millions of years ago, the "ultrasaurs" wander the earth.  Some weigh over 70 tons.  Even the vicious allosaurs are no match for these giants.  A distant rumbling sends the ultrasaurs into a stampede.  It's a Calvinosaurus.  Named after the renowned paleontologist who discovered it, the Calvinosaur can eat an ultrasaur in a single bite.  Calvin, digging a hole, says he never finds anything.  Hobbes thinks it looks like he hit the sewer pipe.
    characters: [calvin, hobbes]
    source: s-anand+seligman+miraheze
  "19900305":
    transcript: OK Hobbes, toss up this deck of cards, and I'll plug the ace of spades! Oh boy, a shooting trick! Go! BLAM bAM POW ZING BLOOIE BANG Here it is! Wow! Six clean holes through the ace! Pretty good, huh? Want to know how I did it? I used a hole puncher ahead of time! Hmm, on second thought, I'll fold. Hey, what's with this deck?!
    description: Calvin hands Hobbes a deck of cards.  He says to throw them into the air, and he'll plug the ace of spades.  Hobbes is thrilled to see a shooting trick.  Up the cards go.  BLAM!  BAM!  POW!  ZING!  BLOOIE!  BANG!  Hobbes grabs the ace of spades and finds six holes in it.  Calvin tells Hobbes how he did it.  He used a hole puncher ahead of time.  Dad, Mom, and a friend are playing cards.  Dad decides he'll fold.  The friend, holding the ace of spades with six holes in it, asks what's with this deck.
    characters: [calvin, hobbes, dad]
  "19900306":
    transcript: This morning I had a wonderful dream. By holding my arms out stiff and pushing down hard, I found I could suspend myself a few feet above the ground. I flapped harder, and soon I was soaring effortlessly over the trees and telephone poles! I could FLY! I folded my arms back and zoomed lower over the neighborhood. Everyone was amazed, and they ran along under me as I shot by. Then I rocketed up so fast that my eyes watered from the wind. I laughed and laughed, making huge loops across the sky! ... That's when Mom woke me up and said I was going to miss the bus if I didn't get my bottom out of the bot. 20 minutes later, here I am, standing in the cold rain, waiting to go to school, and I just remembered I forgot my lunch. Tuesdays don't start much worse than this.
    description: Calvin and Hobbes are standing in the rain, waiting for the bus.  Calvin launches into a long speech about a dream he had.  He could flap his arms and was able to fly.  He zoomed over the neighborhood.  His eyes watered from the wind.  He laughed and laughed as he made loops in the sky.  Then, Mom woke him up and said he'd miss the bus if he didn't get up.  Twenty minutes later, he's standing in the cold rain, waiting to go to school, and he just remembered he forgot his lunch.  He tells Hobbes Tuesday's don't start much worse than this.
    characters: [calvin, hobbes]
  "19900307":
    transcript: I did it! I did it! Somehow I imagined the experience would be more rewarding.
    description: Calvin puts a pillow on the floor.  He puts his head on it, then pulls his body up.  He's standing on his head.  Calvin stays there a bit, then says somehow he imagined this experience would be more rewarding.
    characters: [calvin]
  "19900308":
    transcript: Hewwo! Is Hobbesie-wobbsie sweepy? Ooh, he's just a bog snoogie-woogie, isn't he? Yes he IS! Hewwo, snoogie woogie! GLOMP! HEY HEY! Ow! LEGGO, YOU BLOODTHIRSTY CARNIVORE! OW! OW! OW! I can see why little tabby cats are so much more popular.
    description: Hobbes is sleeping when Calvin approaches him using baby-talk.  He asks if Hobbes is sleepy.  Calvin says "hewwo" and calls Hobbes a snoogie-woogie.  Hobbes awakens with a start and clomps down on Calvin's head with his mouth.  Calvin yells for his bloodthirsty carnivore to let go of him.  They fight.   Calvin walks off saying he can see why little tabby cats are so much more popular.
    characters: [calvin, hobbes]
  "19900309":
    transcript: Once upon a time, there was a ... Hold it. You know what I'D like to see? I'd like to see the three bears eat the three little pigs, and then the bears join up with the big bad wolf and eat Goldilocks and Little Red Riding Hood. Tell me a story like THAT, OK? And how should Hansel and Gretel meet THEIR untimely demise? The witch eats them and then the wolf eats the witch.
    description: Dad starts reading a bedtime story to Calvin, but Calvin stops him.  Calvin tells Dad that he'd like to see the three bears eat the three little pigs, the bears joining up with the big bad wolf and then eat Goldilocks and Little Red Riding Hood.  He tells Dad to tell him a story like that.  Dad asks how Hansel and Gretel should meet their untimely demise.  Calvin suggests the witch eats them, then the wolf eats the witch.
    characters: [calvin, dad]
  "19900310":
    transcript: Hey Dad, can I take the gas can for the lawn mower out in the back yard? Wah on earth for? It's 8;00 at night! I want to pour gasoline in big letters on the lawn... ...and set fire to it so airplanes can read it as they fly over! NO, you can't do that! Don't be ridiculous! I don't even want to know what he intended to write.
    description: Calvin asks Dad if he can take the gas can for the lawn mower to the back yard.  Dad says it's 8:00 at night.  He asks Calvin what he wants to do that.  Calvin tells him he wants to pour the gasoline in big letters on the lawn, then set fire to it so airplanes can read it as they fly over.  Dad tells him no, he can't do that.  He tells him not to be ridiculous.  Dad puts the side of his head on his hand and says he doesn't even want to know what he intended to write.
    characters: [calvin, dad]
  "19900311":
    transcript: Here comes somebody! This meeting of the top secret club G.R.O.S.S. (Get Rid Of Slimy girlS) will come to order. Today this august assembly will decide whether to demote President Hobbes on charges of heresy! HERESY?! Let the record show that the defendent made an UNdisparaging comment about the possible membership of Susie Derkins, an admitted girl and enemy of this club. Let the record ALSO show that Supreme Dictator-for-Life Calvin is a nincompoop. OK, just for that, you're also charged with insubordination! This court finds you guilty on both counts and strips you of your title! Ha! As court stenographer, I refuse to enter the verdict! In fact, I'm PROMOTING myself to "El Tigre Numero Uno"! Oh yeah?! Well then, I promote MYself to "Most highest grandest exalted, um, supreme, uh..." There! I wrote "Hobbes equals great" in the official club notebook! Now it's a law! IT IS NOT! GIMME THAT! Ha ha ha! I'M writing "Hobbes equals ugly fur ball"! What do you think of THAT? Oh ho! I take the supreme dictator hat! Now I'M the supreme dictator! You give that back! I declare you null and void! Truce? Truce. What a great club. Too bad we don't have more members. Maybe we should allow Susie to join.
    description: A meeting of G.R.O.S.S. comes to order.  Hobbes is accused of heresy.  Calvin explains Hobbes made an undisparaging comment about the possible membership of Susie Derkins, an admitted girl and enemy of the club.  Hobbes wants the record to show Calvin is a nincompoop.  Calvin charges him with insubordination.  Hobbes, as court stenographer, refuses to enter the verdict.  He promotes himself to "El Tigre Numero Uno".  Calvin promotes himself.  Hobbes writes "Hobbes equals great" in the club notebook.  That makes it law.  Calvin takes the notebook.  Hobbes takes Calvin's Supreme Dictator hat.  They fight, then declare a truce.  Calvin says this is a great club, but it's too bad they don't have more members.  Hobbes says maybe they should allow Susie to join.
    characters: [calvin, hobbes]
    source: s-anand+seligman
