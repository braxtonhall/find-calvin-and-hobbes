  "19900316":
    transcript: How's your math coming? I don't DO math any more. I decided I'm more of a "visual" person. Good. Visualize being the only 45-year-old in first grade. Visualizing a few sums now, eh? Actually, I'm visualizing YOU in traction. Help me do these, OK?
    description: Calvin is lying on his bed reading a comic book.  Dad asks how his math is coming.  Calvin informs him that he doesn't do math anymore.  He's more of a "visual" person.  Dad tells him to visualize being the only 45-year-old in first grade.  Calvin is doing his homework and Hobbes comes over to ask if he's visualizing sums now.  Grumpily, Calvin tells him he's visualizing Hobbes in traction.
    characters: [calvin, hobbes, dad]
  "19900317":
    transcript: Hey Hobbes, I'll give you 20 questions to guess what I have in my hands, OK? OK. Is it loathsome? Yes! Is it some big centipede with poison pinchers? Centipedes have poison pinchers? I think so. Man, it's a good thing you guessed it so fast! With you, it's never too difficult.
    description: Calvin tells Hobbes he'll give him 20 questions to guess what's in his hand.  Hobbes asks if it's loathsome.  Calvin says yes.  Hobbes asks if it's a big centipede with poison pinchers.  Calvin asks if they really have poison pinchers.  Hobbes thinks so.  Calvin jumps into Hobbes' arms and says it's a good thing he guessed so fast.  Hobbes replies that with Calvin, it's never too difficult.
