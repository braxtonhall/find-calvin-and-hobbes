  "19901209":
    transcript: Thank you, Claire. That was very good. ... all right, who'd like to go next? Anyone at all besides Calvin? HEY! For show-and-tell, I brought these amazing fossilized bone fragments that I painstakingly unearthed from sedimentary deposits in my front yard! Though they look like ordinary driveway gravel to the untotured eyes of the ignorant layman, I immediately recognized these as pieces of jawbone from a new species of carnosaur! In this dramatic illustration, I've re-created the complete Calvinosaurus as it would have appeared in the late Jurassic! It's coloration here is somewhat conjectural. I'll be publishing my full findings shortly! Undoubtedly, I'll be the recipient of many lucrative paleontology prizes, and in a matter of weeks, prestige, fame and fortune will be mine! When this happens, you can be darn sure that those of you who were mean to me in school will suffer appropriately! I'll employ my resources to make your puny lives miserable! I'll crush your pitiful dreams and ambitions like bugs in the dust! ... but there IS an alternative! I'm now accepting a limited number of applications to be my pal. The cost is just $20 per person, and you can revel in the association for a lifetyme! Any takers? Oh yeah? Just you wait!
