  "19900828":
    transcript: Hey, where's Binky Betsy? I know I left her right here when I went inside. Did somebody TAKE her? Everything else is still here. Where did my doll go?! IF YOU WANT TO SEE YOUR DOLL AGAIN I always like cut-and-paste. How much should we ask for? A hundred dollars?
