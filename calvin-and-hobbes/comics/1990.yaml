  "19900520":
    transcript: Another planet. another sweeping panorama of indescribable grandeur! The incredible spaceman spiff zooms to the surface of annoole-4! Touching down, our hero sets off to searow for sentient life! Alas, spaceman spiff only discovers a hideous blob so monumentally stupid that it just stares straight ahead, completely unaware of anything around it! Compassionately, our hero decides to put the blob out of it's misery. Spiff stes his blastter on "liquify." Susie Eww! Miss Wormwood! Calvin's shooting spit balls! perplexed by the blobs restience, Spiff adds more juice and prepares to fire again!
    description: Spaceman Spiff zooms to the surface of Ahnooie-4.  He sets off to search for sentient life.  Spiff only discovers a hideous blob so stupid it just stares completely straight ahead, unaware of anything around it.  Our hero decides to put the blob out of its misery.  Susie yells to Miss Wormwood that Calvin's shooting spit balls.  Perplexed by the blob's resilience, Spiff adds more juice and prepares to fire again.  A giant creature comes up behind him.
    characters: [calvin, susie, wormwood, spiff]
    source: miraheze
  "19900521":
    transcript: On a distant planet Zark, we find the empty red spacecraft of our hero, the bod SPACEMAN SPIFF! Uh oh! Up ahead, the rocks are charred with death ray blasts! A violent struggle took place here! And only the tracks of a large, sinister alien leave the scene! What has happened to the earthling explorer? Calvin, this is humiliating!! I don't want to go! Put me down!
    description: On Planet Zark, Spaceman Spiff's spacecraft sits empty.  The rocks are charred with death ray blasts.  A struggle has taken place.  Only the tracks of a sinister alien leave the scene.  What has happened to Spiff?  Mom is pushing Calvin into the school bus.  She tells him this is humiliating.  Calvin doesn't want to go.
    characters: [calvin, mom]
  "19900522":
    transcript: Spaceman Spiff is being held prisoner by hideous aliens! What do they want with him? Spiff is soon to find out! Our hero is called before the alien potentate! ... where it becomes clear that Spiff is about to be sacrificed... ... to appease the evil god they call "nollij"! Up to the blackboard. Hurry up.
    description: Calvin sits at his desk with teeth gritted.  He says Spiff is being held prisoner by hideous aliens.  He wonders what they want with him.  Spiff is called before the alien potentate.  It becomes clear Spiff is going to be sacrificed....to appease the evil god they call "Nollij".  Miss Wormwood tells Calvin to go to the blackboard.
    characters: [calvin, wormwood, spiff]
  "19900523":
    transcript: Staring death in the face, our hero thinks fast. Inching closer to the sacrificial pit, Spiff slowly and smoothly reaches for the tiny atom blaster concealed in his belt! YAA! All right, you bloodsucking mutant chromosomal disasters! Nobody move! I'm outta here! Calvin, give me that rubber band right this minute! I SAID NOBODY MOVE!
    description: Calvin, looking at the math problem on the board, says our hero thinks fast.  He slowly reaches for the tiny atom blaster concealed in his belt.  He turns and tells the bloodsucking, mutant chromosomal disasters that he's out of there.  Miss Wormwood tells Calvin to give her the rubber band right this minute.
    characters: [calvin, wormwood, spiff]
  "19900524":
    transcript: "Spiff escapes! The dank and smelly corridors of the alien fortress are deserted! All the aliens had gathered for the spectacle of our hero's demise! The fearless space explorer makes it to the planet surface, but the alien queen is in pursuit! Calvin, get back here! Spiff jumps into the cockpit, pressurises the launch thrusters, and... blasts off! Our hero is safe! Tomorrow: Or IS he??"
    description: Spiff escapes.  The smelly corridors of the fortress are deserted.  All the aliens had gathered for the spectacle of our hero's demise.  The space explorer makes it to the planet surface, but the alien queen is in pursuit.  Miss Wormwood yells for Calvin to come back to the room.  Spiff jumps into his spacecraft and blasts off.  He's safe!
    characters: [calvin, wormwood, spiff]
  "19900525":
    transcript: Calvin! What are you doing home?! It's not even noon! Uh, they let us out early today. There was, um, a gas leak. WHAT?! Does anyone know you left?! I'm calling the school. Don't waste your time! Everyone was evacuated! There's nobody there! Hello? Elementary school office, please. Our hero hadn't counted on running into a zark enforcer ship! Spiff's evasive maneuvers come to naught! This could be the end!
    description: Mom is surprised to see Calvin at home.  It's not even noon yet.  Calvin tells her they were let out early due to a gas leak.  Mom wonders if the school knows he left.  She says she's going to call the school.  Calvin tells her no one is there.  Everyone was evacuated.  Mom calls anyway.  Spiff hadn't counted on running into a Zark enforcer ship.  Spiff's evasive maneuvers come to naught.
    characters: [calvin, mom, spiff]
  "19900526":
    transcript: Boy, I sure got in big trouble TODAY! Mom hit the roof when she found out I just left school. What happened? She drove me back and we had to talk to my teacher AND the principal! They talked about study habits, and now I've got extra homework! Ooh. And Dad is going to check it every night to make sure it's done right! Can you believe it?! So try to do an extra good job now, OK? You're lucky tigers are so smart.
    description: Calvin tells Hobbes that he got in trouble when Mom found out he had just left school.  She drove him back, and they had a talk with his teacher and the principal.  They discussed his study habits, and now he has extra homework.  Dad's going to check it every night to make sure it's right.  He hands the book to Hobbes and tells him to do an extra good job.  Hobbes tells him he's lucky tigers are so smart.
    characters: [calvin, hobbes]
  "19900527":
    transcript: Olly-wolly polliwoggy ump-bump fizz! Hey! Ha ha! I stole your flag! But I hit you with the Calvin ball! You have to put the flag back and sing the "I'm very sorry" song! I don't have to sing the song! I was in the "no song" zone! No you weren't. I touched the "opposite pole", so the "no song zone" is now a "song zone". I didn't see you touch the opposite pole! You have to declare it! I declared it oppositely by NOT declaring it. Start singing. "Here's the 'very sorry songg'. Won't you help and sing alongg?" Bum bum bum. I blew it! I knew it! I'm very very sorry that I took your precious flaaggg! He's sorry! So sorry! Just don't do it any more, you scurvy scalawaaggg! I'm free! I get free passage to wicket five! No, that's what we did last time, remember? Oh yeah. Hmm. OK, the NEW rule is we have to jump everywhere until someone finds the bonus box! That's good! The only permanent rule in Calvinball is that you can't play it the same way twice! The score is still Q to 12!
    description: Calvin and Hobbes are playing Calvinball.  Calvin sneaks out from behind a tree and steals Hobbes' flag.  Hobbes hits him with the Calvin ball.  He has to sing the "I'm very sorry" song.  Calvin protests he was in the "no song" zone.  Hobbes corrects him, as he had touched the "opposite pole", so now the "no song zone" is a "song zone".  Calvin complains that Hobbes didn't declare it.  Hobbes says he declared it oppositely by not declaring it.  Calvin starts singing, and Hobbes joins in.  When they're finished, Calvin says he gets free passage to wicket five.  Hobbes tells him they did that last time.  Calvin makes up a new rule to jump until someone finds the bonus box.  As they jump away, Calvin says the only permanent rule in Calvinball is that you can't play it the same way twice.  Hobbes says the score is "Q to 12".
    characters: [calvin, hobbes]
  "19900528":
    transcript: UFOs! Are they real?? Have they landed in our towns and neighborhoods? Do the chilling photographs by an amateur photographer really show a sinister alien spaceship and the grim results of a close encounter, or are the pictures an elaborate hoax? Listen to an expoert on space aliens speculate on their hideous biology and their horrifying weaponry! All this and more... ...on Calvin's show and tell ... NEXT! Calvin, will you come here please?
    description: Calvin stands in front of the class and asks if UFO's are real.  He holds up pictures while asking if the amateur photographer got pictures of a sinister alien spaceship and the grim results of a close encounter.  Or are they an elaborate hoax?  He implores the class to listen to the space alien expert speculate on their hideous biology and their horrifying weaponry.  All this and more on Calvin's show and tell coming up next.  Miss Wormwood asks Calvin to come over to her.
    characters: [calvin, wormwood]
  "19900529":
    transcript: "Twitching tufted tail, a toasty tawny tummy: a tired tiger. ... an alliterative haiku by Calvin. Thank you, thank you. Sheesh."
    description: 'Hobbes is lying on the floor, sleeping.  Calvin comes up and says "Twitching tufted tail, a toasty, tawny tummy: a tired tiger".  He takes a bow for him alliterative haiku.  Hobbes thinks "sheesh".'
    characters: [calvin, hobbes]
  "19900530":
    transcript: You know how people look at modern art and always say, "My 6-year old kid could do that!"? Well, that gave me this great idea! I've decided to become a forger and get rich passing off fake paintings to museums! A lot of paintings sell for tens of millions of dollars now, so I make a pretty good hourly rate. You should probably scratch out the copyright date on the cartoon stationery. Ooh yeah, glad you caught that!
    description: Calvin asks Hobbes if he's heard people say modern art is something "my six-year-old kid could do that".  Calvin has decided to be a forger and get rich passing off fake paintings to museums.  Since a lot of paintings sell for tens of millions of dollars, he'll make a pretty good hourly rate.  Hobbes tells him he should probably scratch out the copyright date on the cartoon stationery.  Calvin is glad Hobbes caught that.
    characters: [calvin, hobbes]
  "19900531":
    transcript: '"Once upon a time there was..." Hold it. This story doesn''t have any shoot-ups in it, does it? You mean guns? No. Any violence at all? Um... not really. Any references to satanism? Any profanity? Any car chases? Any lewd parts? Of course not! What makes you think I''ll like this?'
    description: Dad starts reading a bedtime story.  Calvin asks if the story has any shoot-ups in it.  Dad says no.  Calvin asks if it has any violence at all.  Dad says of course not.  Calvin asks Dad why he thinks Calvin will like the story.
    characters: [calvin, dad]
  "19900601":
    transcript: Hey Mom, want to see something great? With one sip from this ordinary can of soda, I can burp for almost ten seconds straight! Calvin, I don't... But that's not all! At the same time, I'll also recite a gross limerick I learned at school! ...Ready? Maybe if you recited the Gettysburg addres... Forget it. My talents are wasted on her kind.
    description: Calvin asks Mom if she wants to see something neat.  With his can of soda, he can burp for almost ten seconds straight.  Mom doesn't think so.  Calvin adds that at the same time, he'll recite a gross limerick he heard at school.  Later, Hobbes wonders if it would have mattered if he recited the Gettysburg Address.  Calvin says his talents are wasted on her kind.
    characters: [calvin, hobbes, mom]
  "19900602":
    transcript: Well, look who's up! Good morning sleepyhead! You've missed the best part of the day! I've been up since 6:30 getting many things accomplished! At least when I have a day off, I can tell the difference. I just KNOW some nurse switched the bassinets.
    description: Calvin walks toward Dad rubbing his eyes and yawning.  Dad tells him he's missed the best part of the day.  Dad says he's been up since 6:30, and he's gotten many things accomplished.  Calvin walks off saying when he has a day off, he can tell the difference.  Dad says he just knows some nurse switched the bassinets.
    characters: [calvin, dad]
  "19900603":
    transcript: Historical marker. "Calvin's house". In January, some 40 snowmen met a gruesome fate on this spot. Every day I look for a moving van here. Knock knock. Great moons of neptune! A fool mortal female! Calvin? I'M not Calvin! I'm Stupendous Man! Friend of freedom! Opponent of oppressions! Uh huh. What are you doing? I was just about to use my stupendous powers to liberate some cookies being held hostage on the top shelf of the pantry! Now if you'll excuse me, duty calls! SLAM! A blot of crimson streaks across the sky! The man of mega-might is off to save the day! Did they have an egg you could borrow? No one was home, Mom.
    description: Susie knocks on Calvin's door.  Stupendous Man answers.  Susie asks what he is doing.  Calvin tells her he was just about to use his stupendous powers to liberate some cookies being held hostage on the top shelf of the pantry.  He says duty calls, so he slams the door on Susie.  A bolt of crimson streaks across the sky.  He's off to save the day.  Susie returns home.  Her mom asks if they had an egg she could borrow.  Susie says no one was home.
    characters: [calvin, susie, stupendous]
    source: s-anand+seligman+miraheze
  "19900604":
    transcript: CLICK. Pander to me!
    description: Calvin runs in and turns on the television.  He sits on the floor and tells the TV to "pander to me".
    characters: [calvin]
  "19900605":
    transcript: Playing a record? I'll show you something interesting. Compare a point on the label with a point on the record's outer edge. They both make a complete circule in the same amount of time, right? Yeah... but the point on the record's edge has to make a bigger circule in the same time, so it goes faster. See, two points on one disk move at two speeds, even though they both make the same revolutions per minute!
    description: Dad sees Calvin playing a record, so he decides to tell Calvin something interesting.  He shows the point on the label and a point on the outer edge of the record.  They make a circle at the same time.  Dad says the point on the outside of the record has to travel faster because it makes a bigger circle.  Two points on the same disk, moving at different speeds, even though they make the same revolutions per minute.  Calvin lies awake in his bed at night, eyes wide open, trying to understand it.
    characters: [calvin, dad]
  "19900606":
    transcript: On your mark... get set... GO! I'M going so slow, I'm moving BACKWARD! I'm winning! That's cheating!
    description: Calvin starts a race between him and Hobbes.  They slowly move.  Calvin moves ahead.  Hobbes tells him that he's going so slow, he's going backward.  He says he's winning.  Calvin tells him he's cheating.
    characters: [calvin, hobbes]
  "19900607":
    transcript: Hello? Hi Dad! Calvin, is this important? Oops. Wait. Foget I called you "Dad", OK? This isn't Calvin. Calvin, I've got work to do. I'll see you when I get home. OK? Goodbye. Wait! Do you have any crimes to report? Phooey. This secret identity stuff is hard to get used to.
    description: Calvin calls Dad at work.  Dad asks if it's important.  Calvin tells him to forget he called him "Dad".  He says it's not Calvin.  Dad tells him he has work to do and that he'll see him when he gets home.  Calvin asks if he has any crimes to report.  Standing in his Stupendous Man costume, Calvin says this secret identity stuff is hard to get used to.
    characters: [calvin, dad, stupendous]
  "19900608":
    transcript: Want to see something cool? I've got a baby tooth that's just hanging by a thread... and I can turn it all the way around with my tongue... or make it swing from side to side! See? See? They're all just jealous.
    description: Calvin shows Hobbes he has a baby tooth that's hanging on by a thread.  Hobbes cringes.  Calvin tells Mom that he can turn it all the way around with his tongue.  Mom covers her mouth with her hands.  Calvin shows Dad he can move the tooth from side to side.  Dad covers his eyes and sticks his tongue out.  Calvin looks in a mirror and says they're all just jealous.
    characters: [calvin, hobbes, mom, dad]
  "19900609":
    transcript: LOOK! I don't see anything. You missed it. Well, I'm done. What did he see? An opportunity.
    description: At the dinner table, Calvin says "Look" and points to the side.  When Mom looks over, Calvin dumps his dinner onto Mom's plate.  Mom says she didn't see anything.  Calvin tells her she missed it, and he's done eating.  Dad looks over and asks what Calvin saw.  Mom looks at her heaping plate and says "an opportunity".
    characters: [calvin, mom, dad]
  "19900610":
    transcript: My life should be a lot better than it is. I'm happy but it's not like I'm ecstatic. Life is like topography, Hobbes. There are summits of happiness and success...flat stretches of boring routine and valleys of frustration and failure. But I'm dedicating myself to experiencing only peaks! I want my life to be one never ending ascension! Each minute of every day should bring me greater joy than the previous minute! I should always be saying " My life is better than I ever imagined it would be, and I'ts only going to improve." I'm just going to jump from peak to peak! I'm...whoops. At least with flat places, you don't have so far to go down. Only losers go down! For me, it's only going to be up and up!
    description: Calvin readies his sled for a trip down the hill.  He tells Hobbes life is like topography.  There are summits of happiness and success, flat stretches of boring routine, and valleys of frustration and failure.  He's dedicating himself to only experiencing peaks.  He wants his life to be one never ending ascension.  Each minute should bring greater joy than the previous minute.  As they sail off the hill, Calvin is saying he's going to jump from peak to peak.  Tumbling down, Hobbes says with flat places, you don't have so far to go down.  Calvin says only losers go down.  He's only going up and up.
    characters: [calvin, hobbes]
    source: miraheze
  "19900611":
    transcript: I don't feel so good. You don't look so good. Let me feel your forehead. Summer vacation started! I can't be sick! Your head's hot. I'll get the thermometer. NO! I REFUSE! FORGET IT! I HATE THERMOMETERS! I still don't believe her that these things take two hours to register. Now be nice and quiet and I'll check on you this afternoon.
    description: Calvin tells Mom he doesn't feel so good.  Mom agrees that he doesn't look good.  She feels his forehead.  Calvin says summer vacation started, and he can't be sick.  Mom tells him she's going to get the thermometer.  Calvin yells out that he refuses and that he hates thermometers.  Mom puts one in his mouth.  Calvin doesn't believe her when she says it takes two hours to register.  Mom tells him to be nice and quiet, and she'll check on him in the afternoon.
    characters: [calvin, mom]
  "19900612":
    transcript: Ooh, I itch! This is worse than bug bites! Whatever it is, it's driving me crazy! COOL!
    description: Calvin is scratching himself.  He says it's worse than bug bites.  As he keeps scratching, he says whatever it is drives him crazy.  He pulls off his shirt and sees spots.  Calvin thinks that's cool.
    characters: [calvin]
  "19900613":
    transcript: Yep, that's chicken pox all right. CHICKEN pox?! Mom, what IS this guy? A veterinarian? The virus should run its course in about a week. He's mad! MAD, I say! I'll be the REAL doctor is tied up and gagged in the other exam room! He's extremely contagious, so keep him away from other kids. Sue him, Mom! Drive his malpractice insurance up! Calvin has to be INSIDE for a WEEK?? That's a nasty twitch you've developed. Hey Doc, for 10 bucks I'll make sure you see those kids in the waiting room again real soon!
    description: The doctor tells Mom that Calvin has chicken pox.  Calvin asks if he's a veterinarian.  The doctor says it will run its course in about a week.  Calvin complains that the doctor is mad.  He accuses him of having the real doctor tied up and gagged in the other exam room.  The doctor says Calvin is extremely contagious, so he needs to be kept from other kids.  Calvin wants Mom to sue him and drive up his malpractice insurance.  Horrified, Mom repeats that Calvin has to be inside for a week.  The doctor notices a nasty twitch Mom has developed.  Calvin offers, for ten dollars, to make sure the doctor sees all the kids in the waiting room again real soon.
    characters: [calvin, mom, doctor]
  "19900614":
    transcript: Hello? Hi Susie! It's me, Calvin! I was wondering if you'd like to come over and play. Why sure! Boy, I don't think you've EVER invited me to... Calvin, what are you doing? Nothing, Mom. Go away. You're contagious! You can't have anyone over to play! Shh! Shh! You'll spoil the whole thing! I was going to trick Susie into catching... hey! Let go! Ow! *CLICK* Any chance of getting transferred, Dad?
    description: Calvin calls Susie on the phone.  He asks her if she'd like to come over and play.  Susie says he's never invited her before.  In the background, Mom asks Calvin what he's doing.  He tells her to go away.  Mom says he's contagious and can't have anyone over to play.  Calvin says she's spoiling the whole thing.  He was trying to trick Susie into catching his bug.  The phone hangs up.  Susie calls to her Dad to see if there's any chance of him transferring.
    characters: [calvin, mom, susie]
  "19900615":
    transcript: You're absolutely positive tigers can't catch chicken pox? Right. You're absolutely POSITIVE tigers can't catch chicken pox? Go to bed, Calvin.
    description: Hobbes asks if Calvin is absolutely positive tigers can't catch chicken pox.  Calvin says yes.  Hobbes isn't so sure, so he shows his claws to Calvin.  Calvin wakes Mom up to ask if she's absolutely positive tigers can't catch chicken pox.
    characters: [calvin, hobbes, mom]
  "19900616":
    transcript: See, the chicken pox are going away. That's good. Well, just remember that this week doesn't count. Doesn't count? Right. Summer vacation days don't count if you're sick. I get to start school a week later now. So I get my full allotment of vacation. OK, what's the NEXT amendment say? I know it's in here someplace.
    description: Calvin shows Mom his chicken pox are going away.  He tells Mom to remember that this week doesn't count.  Mom asks what he means.  He says summer vacation days don't count if you're sick.  So he gets to go to school a week later to get his full allotment of vacation.  Calvin and Hobbes are looking at a book.  Calvin asks what the next amendments says.  He knows it's in there someplace.
    characters: [calvin, hobbes, mom]
  "19900617":
    transcript: Oh no! Everything has suddenly turned neo-cubist! It all started when Calvin engaged his Dad in a minor debate! Soon Calvin could see both sides of the issue! Then poor Calvin began to see both sides of EVERYthing! The traditional single viewpoint has been abandoned! Perspective has been fractured! The multiple views provide too much information! It's impossible to move! Calvin quickly tries to eliminate all but one perspective! It works! The world falls into recognizable order! You're still wrong, Dad.
    description: Everything has turned neo-cubist.  It started when Calvin engaged his Dad in a debate.  Soon Calvin could see both sides of the issue.  Then Calvin began to see both sides of everything.  The traditional single viewpoint has been abandoned.  Perspective has been fractured.  The multiple views provide too much information.  Calvin tries to eliminate all but one perspective.  It works!  The world falls into a recognizable order.  He walks up to Dad and tells him he's still wrong.
    characters: [calvin, dad]
    source: s-anand+seligman+miraheze
  "19900618":
    transcript: Can I be excused? There's a TV show I want to see. We're still eating dinner, Calvin. I'M through. This stuff was awful. I want to go watch television. It's impolite to leave the table in the middle of a meal. So what am I supposed to do? Just sit here and watch you guys chew?! I'll miss my show! Your TV show isn't as important as spending some time together as a family. We'll compromise. I'll go watch a sitcom family. In a minute you're going to discover the difference between those and real life.
    description: At the dinner table, Calvin asks to be excused to watch a TV program.  Mom says they're still eating.  Calvin says he's finished.  He says the stuff was awful, and he wants to watch television.  Mom explains that it's impolite to leave the table in the middle of a meal.  Calvin asks if he's just supposed to sit there and watch them chew.  Mom tells him his television show isn't as important as spending some time together as a family.  Calvin offers a compromise of watching a sitcom family.  Angrily, Dad says that in a minute, Calvin's going to discover the difference between those and real life.
    characters: [calvin, mom, dad]
  "19900619":
    transcript: My TV show is starting. I'm missing my show! I'm sure your instinct for survival will kick in shortly. What's the big deal about dinner?! Why can't I go watch TV? Lots of people watch TV while they eat! Calvin, dinner is the one time during the day that we set aside to be together and talk. There's more to being a family than just living in the same house. We need to interact once in a while. We could all argue over what channel to watch. You know what I mean.
    description: Calvin says his TV show is starting.  Dad is sure Calvin's instinct for survival will kick in soon.  Calvin wants to know what the big deal is about dinner.  He says lots of people watch TV while they eat.  Dad tells him that dinner is the one meal a day they set aside to be together and talk.  He says there's more to being a family than just being in the same house.  They need to interact once in a while.  Calvin says they could argue about what channel to watch.
    characters: [calvin, mom, dad]
  "19900620":
    transcript: I've missed half of my TV show now. I hope you're happy. You shouldn't be planning your life around the TV anyway. Hmph. Look, I don't think it's too much to ask that we sit together for 40 minutes without distractions and interruptions. RINNGG! I'll get it! I'm expecting a call. Go ahead, Dad. I believe you were saying something funny. I have all these great genes, but they're recessive. THAT'S the problem here.
    description: Grumpily, Calvin says he's missed half his show.  He hopes Mom and Dad are happy.  Dad says he shouldn't be planning his life around the TV anyway.  Dad says he doesn't think it's too much to ask that they sit together 40 minutes without distractions and interruptions.  The phone rings, and Mom goes to get it.  She says she's expecting a call.  Calvin tells Dad to go ahead.  He thinks Dad was saying something funny.  Dad says he has all these great genes, but they're all recessive.  That's the problem here.
    characters: [calvin, mom, dad]
  "19900621":
    transcript: C'mon Hobbes, we have to go outside. We HAVE to? Yeah, Dad won't let me watch TV. He says it's summer, it's light late, and I should go run around instead of sitting in front of the tube. Can you believe it?! What a dictator. How cruel it is to be forced to play. I'LL show him. I refuse to have fun.
    description: Calvin tells Hobbes they have to play outside.  He says Dad won't let him watch TV.  Dad says since it's summer, he should play outside and run around, instead of sitting in front of a tube.  Calvin calls Dad a dictator.  Hobbes says it's cruel to be forced to play.  As Calvin climbs on his swing, he says he'll show him.  He refuses to have fun.
    characters: [calvin, hobbes]
  "19900622":
    transcript: OK, next we'll race to that tree over there. THIS race will determine the championship of the universe. Oh... wait. How long have we been out here? I dunno. An hour maybe. Really? Geez. Where does time go?! Hang on, I'll be right back. I'M NOT HAVING FUN!
    description: Calvin and Hobbes are going to race to a tree.  Hobbes says this one will determine the championship of the universe.  Calvin asks how long they've been outside.  Hobbes tells him an hour.  Calvin races off saying where does the time go.  He goes over to the window and tells Dad he's not having any fun.
    characters: [calvin, hobbes, dad]
  "19900623":
    transcript: It's getting dark, Calvin. Time to come in and go to bed! But Hobbes and I were catching fireflies. Can't we stay out a little longer? Ha! First you didn't want to go out, and now you don't want to come in! See, by not watching TV, you had more fun, and now you'll have memories of something real you DID, instead of something fake you just WATCHED. Nothing spoils fun like finding out it builds character.
    description: Dad says it's getting dark, and he calls Calvin inside.  Calvin was catching fire flies, and he wants to stay out longer.  Dad says first Calvin didn't want to go out, now he doesn't want to come in.  Dad tells him that by not watching TV, he had more fun and will have memories of something real he did instead of something fake that he watched.  In bed, Calvin says nothing spoils fun like finding out it builds character.
    characters: [calvin, hobbes, dad, stuffedhobbes]
  "19900624":
    transcript: Oh Calvin, would you please empty this in the garage trash can? Boy, some vacation THIS summer is!
    description: Calvin and Hobbes are tumbling, drawing pictures, chasing a frog, in their treehouse, playing baseball, reading comic books, swinging, playing treasure hunt, and playing in the sandbox.  Mom asks Calvin to empty a bag into the garage trash can.  Calvin complains some vacation this summer is.
    characters: [calvin, hobbes, mom, stuffedhobbes]
    source: s-anand+seligman+miraheze
  "19900625":
    transcript: Hop in, Hobbes! We're going to get rich! Oh no, I'm not getting into that box. I don't want to be transmogrified or duplicated or whatever. What? When the TOP is open, it's a time machine, remember? Even worse. Oh, don't be such a baby. The way you act, you'd think the dinosaur actually GOT us last time. Why, it wasn't even a carnivore. I don't care. You and that box are plain bad news.
    description: Calvin is in a box and tells Hobbes to hop in, they're going to get rich.  Hobbes wants no part of it.  He doesn't want to be transmogrified, duplicated, or whatever.  Calvin reminds him that when the top is open, it's a time machine.  Hobbes says that's even worse.  Calvin chides him for being such a baby.  He says the way Hobbes acts, the dinosaur actually got them last time.  He says it wasn't even a carnivore.  Hobbes doesn't care.  He says Calvin and that box are plain bad news.
    characters: [calvin, hobbes]
  "19900626":
    transcript: Too bad you're not going back to the jurassic with me. An opportunity like this doesn't come along every day, you know. The less often, the better, is what I say. We're just going on a photo safari! When we come back with REAL dinosaur photos, we'll get rich! You can drop the "we" stuff. I'm not going. OK, well, I guess I'll have to eat all these great snacks myself then. Snacks? What kind of snacks? Are they GOOD snacks? How many snacks did you bring?? Never mind! You said you're not going.
    description: Calvin says it's too bad Hobbes isn't going back to the Jurassic period with him.  Calvin says they're going on a photo safari.  Hobbes says he can drop the "we" stuff.  Calvin says he'll have to eat all these great snacks himself.  Hobbes asks what kind of snacks and how many.
    characters: [calvin, hobbes]
  "19900627":
    transcript: I guess if we get to have snacks, it would be OK to time travel. If they're GOOD snacks, I mean. Great! Put on your vortex goggles. The dial is set for 140 million years ago. So OFF WE GO-O-O! I have a question. Why don't we get younger as we go back in time, and disappear as we pass the day we were born? I'd explain it, but there's a lot of math. I thought you got a "D" in math.
    description: Hobbes figures if they're good snacks, it's okay to time travel.  Calvin sets the dial for 140 million years ago, and off they go.  Hobbes asks why they don't get younger as they travel back through time and disappear as they pass the day they're born.  Calvin says he'd explain it, but there's a lot of math.  Hobbes says he thought Calvin got a "D" in math.
    characters: [calvin, hobbes]
  "19900628":
    transcript: Is it time for snacks yet? Hobbes, we're travelling at light speed through an interdimensional continuum lapse! Wait till we land! OK, I'll just inventory the snacks and record them for the journal. You COULD help me drive, you know! If we miss our exit, we could fly right into the big bang! What would happen then? There'd be no universe, and probably now time! I think we should eat the snacks NOW. Sit still, will you? You'll make me swerve.
    description: Hobbes asks if it's time for snacks.  Calvin explains they're traveling at light speed through an interdimensional continuum lapse.  He says to wait until they land.  Hobbes offers to inventory the snacks.  Calvin says he could help him drive.  He's worried that if they miss their exit, they could fly into the big bang.  He says there would be no universe, and probably no time.  Hobbes thinks they should eat the snacks now.
    characters: [calvin, hobbes]
  "19900629":
    transcript: There's a diplodocus! We're in the jurassic! We made it! Ugh. I can't believe you wanted to come back here. Last time we didn't bring a camera. All we need is a few good dinosaur photos and we'll be rich when we get home. If we get in National Geographic, maybe I'll get to meet some of those tigress babes they showed in the April issue! Yow wow! Those were females? Really, I don't know how you can even tell the difference.
    description: They see a diplodocus.  They're in the Jurassic.  Hobbes can't believe Calvin wanted to come back.  Calvin said last time, they forgot the camera.  He figures they only need a few dinosaur photos, and they'll get rich when they get home.  Hobbes thinks if they get in National Geographic, he can meet some of those tigress babes they showed in the April issue.  Calvin asks if they were females.  He doesn't know how Hobbes can tell the difference.
    characters: [calvin, hobbes]
  "19900630":
    transcript: Hey! There's a chance to get some pictures of some stegosaurs! See, these photos will answer hundreds of questions about dinosaur anatomy and behavior! Paleontologists will pay through their nose to see these! Take a picture of this one. He's smiling. Just a minute. Just a minute.
    description: They have a chance for pictures of stegosaurs.  Calvin says these pictures will answer hundreds of questions about dinosaur anatomy and behavior.  Paleontologists will pay through the nose for these pictures.  Hobbes points behind him to take the picture of the dinosaur that's smiling.  It's a allosaurus!  Calvin is busy looking the other way for his photo.
    characters: [calvin, hobbes]
  "19900701":
    transcript: I'd sure like to shake the hand of the genius who invented these. Ok, here's the game. We toss the water balloon back and forth, but each time we catch it, we take a step back. The idea is to see how far apart we can get before one of us gets soaked. Gotcha. Ok, toss it to me. There, I caught it! Now we take a step back and I'll toss it to you. Ha ha! Catch this, sucker! Ha ha ha! What a chump! What a natf! Ha ha ha! Hey! What's the matter? Can't you take a joke?! It was a joke! I mean, it was an accident! I didn't do it on purpose! Hey! No! Not the rain barrel! It's no fun to play games with a poor sport.
    description: Calvin suggests a game of tossing a water balloon back and forth.  Each time they catch it, they take a step back.  Calvin throws the balloon to Hobbes.  Calvin catches the return toss.  He steps back and hits Hobbes with the balloon. He starts laughing at Hobbes, who stands there drenched. Hobbes picks Calvin up.  He asks if Hobbes can't take a joke.  He says he didn't do it on purpose.  Hobbes dunks Calvin in the rain barrel.  As he climbs out, Calvin says it's no fun to play games with a poor sport.
    characters: [calvin, hobbes]
    source: miraheze
  "19900702":
    transcript: What's THIS ugly brute called? AN ALLOSAUR! I'm right here. You don't need to shout. RUN! When we get back to the time machine, throw him the snacks we packed! Maybe that will diver him while we take off! You can throw YOUR snacks. I might still want mine. You're going to be a snack yourself! Get in! Get in!
    description: Hobbes asks what that ugly brute is called.  Calvin is horrified when he sees it's an allosaur.  Hobbes tells him he doesn't need to yell.  He's standing right there.  Calvin tells Hobbes to run.  As they run, Calvin tells Hobbes that when they get to the time machine, throw the snacks they packed.  It might divert him while they take off.  Hobbes says Calvin can throw his snacks, but Hobbes might still want his.  Calvin yells that he's going to be a snack himself.  He yells to get in.
    characters: [calvin, hobbes]
  "19900703":
    transcript: Quick! Thow him the food! My sandwich had mustard. Is this one yours? Put on your vortex goggles! We're taking off! Eww, this banana is mushy. He can have THIS. We did it! We're off! Here. Boy, that was a close call. Bit it will be worth it when we get these pictures developed. Since I rescued your sandwich, can I eat it?
    description: Calvin tells Hobbes to throw some food.  Hobbes doesn't want to throw his sandwich.  Hobbes finds a mushy banana that he throws to the dinosaur.  Calvin says it was a close call, but it will be worth it when they develop their pictures.  Hobbes asks if he can eat Calvin's sandwich, since he rescued it.
    characters: [calvin, hobbes]
  "19900704":
    transcript: Hey Mom, guess where Hobbes and I have been! I SAW where you were. You were playing in a cardboard box out back. Nope! That's just what it LOOKED like. We time travelled to the jurassic, but we returned at the split second we left! That's why it didn't look like we were gone! We saw lots of dinosaurs! Well, you've had a productive morning then. Yeah. Will you take this film to be developed? I'll pay you back
    description: Calvin runs up to Mom and asks if she knows where he and Hobbes have been.  She says she saw him playing in a cardboard box out back.  Calvin says that's what it looked like, but they really time-traveled to the Jurassic period and returned at the split second they left.  That's why it didn't look like they left.  He says they saw lots of dinosaurs.  He asks if Mom will take some film to be developed.  He'll pay her back when Time magazine coughs up for his story.
    characters: [calvin, mom]
  "19900705":
    transcript: Hobbes, look! We got our pictures back from our jurassic trip! Oh boy! Let's see! Wow, these came out good! Look at that apatosaur! There's me! There's me! Yes! Yes! We're RICH! Ha ha! Now we can get our own apartment! This dinosaur blinked. I'll buy a car too, but since I can't drive for another decade, we'll have to get a chauffeur. If we pay him, he has to let us sit up front and beep the horn, right?
    description: Calvin has the pictures from the Jurassic trip.  The pictures came out great.  Calvin says they can get their own apartment now.  Calvin says he'll also buy a car, but since he can't drive for another decade, he'll get a chauffeur.  Hobbes says that if they pay him, he'll have to let them sit up front and beep the horn.
    characters: [calvin, hobbes]
  "19900706":
    transcript: Well Dad, it's too bad you weren't any nicer to me all these years. Beg pardon? Yep, I can't say I'm particularly including to share my future millions with you. Here, look. Dinosaurs? Hobbes and I went to the jurassic today and came back with these dramatic photographs! We're going to be rich. I didn't realize dinosaurs looked so small and plastic. HEY, WHAT ARE YOU INSINUATING?!
    description: Calvin tells Dad it's too bad he wasn't nicer to him all these years.  He explains that he's not inclined to share his future millions with Dad.  He shows him the pictures he took.  Dad comments that he didn't realize dinosaurs looked so small and plastic.  Calvin wants to know what Dad is insinuating.
    characters: [calvin, dad]
  "19900707":
    transcript: Dad doesn't believe we went to the jurassic and took photographs of real dinosaurs. He says it looks like we just put my toy models in the yard and took pictures of THEM! He says our get-rich-quick scheme won't work. Huh! He said if we REALLY wanted to get some money, he'd pay us a dollar to pull weeds out of the front walk. Just a dollar? Of course I told him we didn't want the money THAT bad.
    description: Calvin tells Hobbes that Dad doesn't believe they went to the Jurassic period and took photographs of real dinosaurs.  Calvin continues that Dad thinks they took toy dinosaurs and took pictures of those.  Dad told Calvin that if he really wanted to make money, Dad would pay a dollar for Calvin to pull weeds out of the front walk.  Calvin told him he didn't want the money that bad.
    characters: [calvin, hobbes]
  "19900708":
    transcript: Please, pass me a wing, Calvin. No! You can't have any! It's mine! All mine! The late cretaceous...when the world meant business. A gigantic quetzncoatlus, a pterosaur the size of an airplane swoops over the horrible tyrannosaurus! The tyrannosaur lunges and brings down the flying pest! Uh oh! The commotion attracts other tyrannosaurs, greedy for an undeserved piece! Driven away by the fierce roaring and gnashing of the intruders, the tyrannosaur nurses a deep grudge. Revenge will soon be his!
    description: A quetzalcoatlus swoops over the tyrannosaurus.  The tyrannosaur lunges and brings down the flying pest. The commotion draws other tyrannosaurs, greedy for an undeserved piece.  Mom asks Calvin for a piece of chicken at the picnic table.  Calvin whisks the plate away, saying it's all his.  Driven away by the roaring and gnashing of the intruders, the tyrannosaur nurses a deep grudge.  Revenge will soon be his.
    characters: [calvin, mom, dad]
    source: miraheze
  "19900709":
    transcript: Hey Mom, if we were cannibals, what parts of people would we eat? What? You know, where would the steaks be? Would legs be like drumsticks? Would kids be like veal? Ughh! Go be disgusting somewhere else! Out! Some people just don't have inquisitive minds.
    description: Calvin asks Mom what parts of people they would eat if they were cannibals.  Calvin wants to know where the steaks would be, if legs would be like drumsticks, and if kids would be like veal.  Mom scoots him away telling him to be disgusting somewhere else.  Calvin grumbles that some people just don't have inquisitive minds.
    characters: [calvin, mom]
  "19900710":
    transcript: Ever notice how the older people get, the slower they do things? I wonder why that is. I would think that the less life you had left, the faster you'd want to do everything, so you could pack more into the remaining years. You can bet when I'm a geezer like Dad, I'll be going like a maniac. Oh great.
    description: Riding down the hill in the sled, Calvin asks Hobbes if he's ever noticed that the older people get, the slower they do things.  Calvin wonders why that is.  He figures that the less life you have left, you'd want to do everything faster so you could pack more in the remaining years.  He tells Hobbes that when he's a geezer like Dad, he'll be going like a maniac.
    characters: [calvin, hobbes]
  "19900711":
    transcript: Better hurry. Your Mom's yelling something.
    description: Calvin is standing backward on the top of a ladder, his back to his wading pool.  Hobbes is standing next to the pool yelling up at Calvin.  He tells Calvin he better hurry, Mom's yelling something.
    characters: [calvin, hobbes]
  "19900712":
    transcript: Easy... easy now... that's it... Steady, boy... easy... nice bike... AUGH! PHPPBT!
    description: Calvin warily approaches his bike.  He says "easy now".  He gets closer and says "steady boy....nice bike".  Suddenly, the bike rears up and startles Calvin.  Calvin peeks at the bike from behind a tree.
    characters: [calvin]
  "19900713":
    transcript: Wow, what happened to YOU?? That darn bicycle tried to killme! You fell off? It took me 40 minutes to subdue it to the point where I could climb on, and then it bucked me right over the handlebars! You fell off. THEN it tried to run me over! It's out to kill me! I'm lucky to be alive! Well, balancing takes a little practice. Do you have a rifle? Will you shoot it?
    description: Calvin comes into the house all scarred and dirty.  Dad asks what happened to him.  Calvin tells him the bicycle tried to kill him.  Dad asks if he fell off.  Calvin says it took 40 minutes to subdue it to the point he could climb on, then it bucked him over the handlebars.  Dad asks if he fell off.  Calvin tells him it then tried to run him over.  He says he's lucky to be alive.  Dad tells him balancing takes a little practice.  Calvin asks Dad if he has a rifle and if he'll shoot the bike.
    characters: [calvin, dad]
  "19900714":
    transcript: Maybe we should get your inner ear checked.
    description: Calvin peeks out the door.  After he's outside, the bike peeks around the corner at him.  The bike chases him down the street.  Looking at Calvin lying on the ground, Dad says maybe they should get his inner ear checked.
    characters: [calvin, dad]
  "19900715":
    transcript: Another one of THESE days. Uh oh! In another of life's mysterious quirks, Calvin finds himself an inch tall on the writing desk! His only hope is to tear off a sheet from a nearby pad of paper! At his tiny size, folding the sheet is difficult, but soon Calvin's patience is rewarded. He pushes off and catches a small thermal rising up the front of the desk! A gust from an open window sends Calvin soaring across the house! There's Dad! Lean! Lean! Yes! Calvin is able to steer! THIS should get Dad's attention! I don't need parents. All I need is a recording that says, "Go play outside!"
    description: Calvin finds himself an inch tall on the writing desk.  He tears off a sheet from a nearby pad of paper.  At his size, folding the sheet is difficult, but Calvin's patience is rewarded.  He makes a paper airplane, pushes off and catches a small thermal rising up the front of the desk.  A gust from an open window sends Calvin across the house.  Calvin leans to steer.  He runs the paper plane into Dad.  Sitting under a tree outside, Calvin tells Hobbes he doesn't need parents.  All he needs is a recording that says "go play outside".
    characters: [calvin, hobbes, dad]
    source: s-anand+seligman+miraheze
  "19900716":
    transcript: Hi Calvin! What are you doing down there? SHH! SHH! Get down! Be quiet! Have you seen my bicycle? No... Thank goodness. If my bike doesn't get me first, I'm going to cit all its spokes in two. You never saw me today, got it? Our class voted Calvin the "Most likely to be seen on the news some day."
    description: Susie sees Calvin behind the tree.  Calvin tells her to be quiet and asks if she's seen his bicycle.  Calvin whispers to Susie that if his bike doesn't get him first, he's going to cut its spokes.  He says she never saw him today.  After Calvin leaves, Susie says her class voted Calvin "Most likely to be seen on the news some day".
    characters: [calvin, susie]
  "19900717":
    transcript: Want some oil? See? Nice oil? Wouldn't you like some? Easy... Easy... Rrrr YAA! I got you now! You're going to the scrap heap, you rabid pile of rusty AAH OW WHOA DOWN! I NEVER got MY face caught in the chain when I learned to ride a bike. Really, how did this happen? I TOLD you! Ow!
    description: Calvin walks up to his bike asking if it would like some oil.  Calvin jumps at the bike, saying it's going to the scrap heap.  The two struggle.  Mom is cleaning Calvin, who's all scarred and dirty.  Dad says he never got his face caught in the chain when he was learning to ride a bike.  Mom asks Calvin what really happened.  Calvin insists he already told her.
    characters: [calvin, mom, dad]
  "19900718":
    transcript: That stupid bicycle! I hate it! I'm never going to ride one as long as I live. CREEAAKK W-what's that? AUGHH! MY BICYCLE HAS BEEN LYING IN WAIT! IT'S COMING TO GET ME! HELP! HELP! S-see? It's trying to k-kill me! It was just a dream, honey. ...but why on earth did you bring your bike upstairs to your closet?
    description: In bed, Calvin says he hates his stupid bike.  He's never going to ride one as long as he lives.  He hears a creak.  His bicycle comes out of his bedroom closet.  Calvin shouts that the bike has been lying in wait and is coming to get him.  He yells for help.  Mom comes to his room and holds Calvin close.  Calvin tells her that he told her it's trying to kill him.  She says it was just a dream, but she asks why he brought his bike upstairs to his closet.
    characters: [calvin, mom]
  "19900719":
    transcript: Calvin, will you take this to the garbage can in the garage please? The GARAGE?? Are you mad? I WILL be, if you don't hop to it. But that's where my killer bicycle is! I can't go out there! It'll jump me! I don't want any nonsense. Just do what I asked, OK? Rrrr. I wonder how far from this house my savings would get me.
    description: Mom asks Calvin to take a garbage bag to the garage.  He asks if she's mad.  He says that's where his killer bicycle is.  He says it will jump him.  Mom doesn't want any nonsense and sends him to take the garbage.  In the garage, the bicycle is growling at Calvin.  Calvin, back pressed against the wall, wonders how far from home his savings will get him.
    characters: [calvin, mom]
  "19900720":
    transcript: Psst! Hobbes! What are you doing up there? Hiding from my killer bicycle. It can't climb trees, so I guess I'll stay here for the rest of my life. You should just wedge a big stick through the spokes of the front wheel. That way when the stick hits the fork, the wheel will jam and the bike will flip over. Hey, that's a GREAT idea! Hobbes, you're a lifesaver! We could mosey over to the kitchen if you're wondering how you can possibly thank me enough.
    description: Calvin whispers down to Hobbes from a tree branch.  Calvin tells him he's hiding from his killer bicycle.  He says it can't climb trees, so he'll have to stay there the rest of his life.  Hobbes tells him to wedge a big stick through the spokes of the front wheel.  He explains when the stick hits the fork, the wheel will jam and the bike will flip over.  Calvin comes down calling Hobbes a lifesaver.  Hobbes suggests they could mosey over to the kitchen if Calvin wonders how he could possibly thank him enough.
    characters: [calvin, hobbes]
  "19900721":
    transcript: I did it, Hobbes! I put a stick in the spokes of my killer bicycle! When it tried to chase me, it flipped over! I wrestled it to exhaustion, and then I let the air out of its tires! Ha! I guess that nasy ol' thing won't be coming after me any more! We're too smart for it! Man triumphs over machine! Training wheels! What a good idea! I pumped up his tires too. They were both flat.
    description: Calvin runs up to Hobbes telling him he put the stick in the bicycle's spokes.  Calvin says when it tried to chase him, it flipped over.  Calvin says he then wrestled it to exhaustion and let the air out of its tires.  He says that nasty ol' thing won't be coming after him anymore.  He says they're too smart for it.  Mom notices Dad putting training wheels on Calvin's bicycle.  Dad says he pumped up the tires.  They were both flat.
    characters: [calvin, hobbes, mom, dad]
  "19900722":
    transcript: ATCHOO! Booger balls are illegal! Whap! First base! Fifth! Ninth! Puff puff ELEVENTH! puff TWENTY-FIFTH! Calvin's going for home! Too late! You're out! I think we need to change the rules. Oh, you want to play the sissy way now, I bet.
    description: Calvin and Hobbes are playing baseball.  Calvin hits it and runs the bases.  Hobbes casually retrieves the ball as Calvin passes eleventh base.  Hobbes walks with the ball.  Calvin's going for home after touching twenty-fifth base.  Hobbes tags Calvin out.  Calvin, exhausted, thinks they need to change the rules.
    characters: [calvin, hobbes]
    source: s-anand+seligman+miraheze
  "19900723":
    transcript: A toast to us! To us! Best friends forever! Right! CRUNCH CRUNCH CRUNCH CRUNCH
    description: At the table, Calvin and Hobbes call for a toast to them.  Best friends forever.  They both start munching their slices of toast.
    characters: [calvin, hobbes]
  "19900724":
    transcript: Hi Dad. I suppose you're wondering how you're doing in the polls. Not really. I think you'll find THIS chart quite revealing. This line represents the "Average Dad approval rating" of 70%. This overlay shows YOUR approval rating at just under 10%! Household six-year-olds were polled on their favourite bedtimes. Watch on these successive overlays how your rating would improve with each hour later! See, by midnight, you're right up to normal! These findings suggest a logical course of action. How long do you spend making these charts?
    description: Calvin walks up to Dad and says he supposes Dad wants to know how he's doing in the polls.  Dad doesn't.  Calvin shows him a chart indicating the "Average Dad Approval Rating" being 70%.  He shows Dad's rating at just under 10%.  Calvin continues showing charts that indicate Dad's rating would improve with every hour added to bedtime.  By midnight, Dad would be up to normal.  Calvin concludes by saying these findings suggest a logical course of action.  Dad wonders how much time Calvin spends making those charts.
    characters: [calvin, dad]
  "19900725":
    transcript: My tiger, it seems, is running 'round nude. This fur coat must have made him perspire. It lies on the floor - should this be construed as a permanent change of attire? Perhaps he considers its colors passe, or maybe it fit him too snug. Will he want it back? Should I put it away? Or use it right here as a rug? Z. I wonder when school starts.
    description: Hobbes is lying on the floor.  Calvin comes up and says a poem.  It talks about his tiger running around nude.  His fur coat lies on the floor.  Is this a permanent change, or were the colors passe?  Will he want it back, or should he use it for a rug?  Calvin walks away, and Hobbes wonders when school starts.
    characters: [calvin, hobbes]
  "19900726":
    transcript: People don't understand me. They don't realize I'm a card-carrying genius. You have a card? Oh absolutely. See, it says "Calvin, certified genius." Wow, you have a certificate? Well, not really, but no one every checks those things. I just say it's at the frame shop. Pretty smart. I'm a genius. How did you emboss this card? With a screwdriver?
    description: Calvin laments people don't understand him.  He says he's a card-carrying genius.  He shows Hobbes his card, which reads "Calvin, certified genius".  Hobbes is impressed that he has a certificate.  Calvin admits that he doesn't, but says people don't check those things.  He just says it's at the frame shop.  Hobbes admits that's pretty smart.  Calvin reminds him he's a genius.  Hobbes looks at the card and wonders if Calvin embossed the card with a screwdriver.
    characters: [calvin, hobbes]
  "19900727":
    transcript: AAHH! How am I supposed to learn surgery if I can't dissect anything?
    description: Calvin opens the vacuum cleaner and removes the dirt bag.  He cuts it open, and dirt pours out on the floor.  Mom yells at him.  Sitting on the porch step, Calvin wonders how he's supposed to learn surgery if he can't dissect anything.
    characters: [calvin, mom]
  "19900728":
    transcript: You know what cracks me up? Ants RUN everywhere! It's like they all think they have to be somehwere on time! See, they never walk or poke along. They go everywhere at top speed! Isn't that silly? C'mon around back. I'll show you something else!
    description: Calvin tells Hobbes that ants run everywhere.  It's like they think they have to be somewhere on time.  Calvin shows the ants never walking, but always going top speed.  He says that's silly.  Calvin tells Hobbes to come around back, he wants to show him something else.  Off they run.
    characters: [calvin, hobbes]
  "19900729":
    transcript: Another day, another dollar... ...another irreplaceable chunk out of a finite and rapidly passing lifetime. What a beautiful summer day... and I've got to spend it in an office. Brother. It seems like I'm always rushing off and never taking the time to enjoy days like this. I'd sure like to have a quiet day around the house. No traffic, no schedule, no phone calls... boy, that would be great. I could spend some time with Calvin, read a book, go on a bike ride... Maybe I should take the day off. The world wouldn't end if I didn't go into the office today. Days like this don't come often and life is short. Hi Dad. Bye Dad. AUGHH. YOU GET BACK HERE AND PICK EVERY ONE OF THESE DEAD BUGS OUT OF MY SHAMPOO!! I MEAN NOW!
    description: Dad gets the morning paper and notes that he always rushes off and never takes time to enjoy days like this. He has his coffee and says he'd like to have a quiet day around the house.  He could read a book, go on a bike ride, spend time with Calvin.  He thinks about taking the day off.  Calvin runs by.  Mom runs by, head covered with shampoo.  She yells for Calvin to get back there and pick up every dead bug he put in her shampoo.  Dad watches all this.  Later, he is sitting at his desk whistling.
    characters: [calvin, mom, dad]
    source: s-anand+seligman+miraheze
  "19900730":
    transcript: With a distant rumbling, great thunder clouds pile high into the sky! Suddenly there's a blinding flash of light! It's Calvin the lightning bolt! In a fraction of a second, the house below will be in a million pieces! I know it's raining out, but play a board game or something.
    description: Great thunder clouds pile high into the sky.  There's a blinding flash of light.  It's Calvin the lightning bolt.  The bolt heads toward the house.  In a fraction of a second, the house will be in a million pieces.  Mom picks Calvin up.  He drops his saw as Mom tells him that she knows it's raining, but that he should play a board game or something.
    characters: [calvin, mom]
  "19900731":
    transcript: Every day it's the same old thing. ... but not today! Everybody's a slave to routine.
    description: Calvin hops out of bed saying every day is the same old thing.  He takes his pajama top off and says "but not today".  He walks out the door naked as Mom chases him down.  In his room, he puts on his clothes saying everybody's a slave to routine.
    characters: [calvin, mom]
  "19900801":
    transcript: Can I get some contact lenses? Your eyes are fine! You don't need contacts. Yes I do! They have some that change the color of your eyes! Your eyes are very pretty the way they are. But if I had contacts, I coul dmake one eye blood red and the other yellow striped, like a bug. I dunno, it seems like once people grow up, they have no idea what's cool.
    description: Calvin asks Mom if he can get contact lenses.  Mom tells him his eyes are fine, and that he doesn't need them.  Calvin tells her they have some that change the color of your eyes.  Mom says his eyes are pretty the way they are.  Calvin tells her with contacts, he could make one eye red and the other yellow striped like a bug.  Sitting on a log with Hobbes, Calvin says it seems once people grow up, they have no idea what's cool.
    characters: [calvin, hobbes, mom]
  "19900802":
    transcript: Geez, I gotta have a REASON for everything?!
    description: Mom and Dad sleepily open Calvin's bedroom door.  He is sitting in bed with a pair of drums and a horn.  He asks them if he has to have a reason for everything.
