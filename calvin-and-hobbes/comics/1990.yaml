  "19900817":
    transcript: Calvin, I asked you to clean up your room. I DID! Well, you didn't do a very good job, then. It looks as messy as it did before. You should take pride in what you do, and always do the best job possible. I don't need to do a better kob. I need better P.R. on the job I DO.
