  "19901230":
    transcript: I asked Dad if he wanted to see some new year's resolutions I wrote. He said he'd be glad to, and he was pleased to see I was taking an interest in self-improvement. I told him the resolutions weren't for ME, they were for HIM. That's why we're outside now. I WONDERED what the rush was. I'm getting disillusioned with these new years. They don't seem very new at all! Each new year is just like the old year! Here another year has gone by and everything's still the same! There's still pollution and war and stupidity and greed! Things haven't changed! I say what kind of future IS this?! I thought things were supposed to improve! I thought the future was supposed to be better! The problem with the future is that it keeps turning into the present.
