  "19900314":
    transcript: I asked Mom if I was a gifted child... She said they certainly wouldn't have PAID for me. You can relate this little story when reporters ask how I went bad.
    description: Calvin and Hobbes are sitting under a tree.  Calvin says he asked Mom if he was a gifted child.  Mom had replied she certainly wouldn't have paid for him.  He tells Hobbes he can relate this little story when reporters ask how he went bad.
    characters: [calvin, hobbes]
  "19900315":
    transcript: Mom! Hobbes is reading my comic books! Tell him to stop! I told him to go buy his own, and he SNaRLED at me! Make him give 'em back! Maybe you should be glad he's more literate than most stuffed animals. But they're MY comic books, not HIS! Well, you should learn to share. I don't think Hobbes will hurt them. Are you kidding?! He drew a mustache and glasses on every picture of nuke-man last issue! In PeN! Why don't you go play outside, Calvin?
    description: Calvin tells Mom that Hobbes is reading his comic books.  He wants her to stop Hobbes.  He says he told Hobbes to get his own comic books, but Hobbes snarled at him.  Mom says he should be glad Hobbes is more literate than most stuffed animals.  Calvin complains that they're his comics.  Mom tells him he should learn to share.  She doesn't think Hobbes will hurt them.  Calvin throws up his hands in frustration.  He tells Mom that Hobbes drew glasses and a mustache on every picture of Nuke-Man last issue...in pen.  Mom tells Calvin to go play outside.
