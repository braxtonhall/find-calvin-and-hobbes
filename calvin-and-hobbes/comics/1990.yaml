  "19900820":
    transcript: This meeting of top-secret club GROSS (Get Rid Of Slimy Girls) will come to order, supreme ruler and dictator-for-life Calvin presiding! Hear hear! President and first tiger Hobbes will now provide us with an attendance report. All present and accounted for, sir! Excellent! Now club secretary general Hobbes will review the minutes. It's 10:32. Thank you. At this time we'll have a field report from top scout Calvin! You can tell this is a great club because we have so many officers.
    description: Calvin calls a meeting of G.R.O.S.S. to order.  President and First Tiger Hobbes gives an attendance report.  Club Secretary General Hobbes gives the minutes.  Calvin then calls for a field report from Top Scout Calvin.  Hobbes says you can tell this is a great club because they have so many officers.
    characters: [calvin, hobbes]
  "19900821":
    transcript: Herewith, a field report filed from head scout Calvin! What news, scout? The enemy has been sighted on the sidewalk two doors down, Mr President. The enemy? Susie Derkins, an acknowledged GIRL! I recommend we establish a strike force? Its objective? To bug her! Sounds risky. Men, any volunteers?
    description: Top Scout Calvin reports the enemy has been sighted on the sidewalk two doors down.  It's Susie Derkins, an acknowledged girl.  Calvin recommends they establish a strike force to bug Susie.  Hobbes calls for volunteers.
