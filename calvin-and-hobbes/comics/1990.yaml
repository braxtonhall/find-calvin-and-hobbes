    description: Calvin asks Dad if he'd pay him a dollar to eat a bug.  Dad says he'd have to eat a whole bucket of bugs before he'd pay him a dollar.  Dad adds that Calvin could pick up sticks in the back yard for a dollar, if he'd prefer.  Calvin, while picking up sticks, laments that his real skills are undervalued.
