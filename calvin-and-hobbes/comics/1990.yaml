  "19900805":
    transcript: To make instant fun... ...just add water! Heh heh heh FWOOSH. Hee hee. Looking for someone?  Uh, who? ME? Ha ha ha ha ha! Um, no-o. I mean, yes... but someone ELSE. Heh heh. Not you. Here's a hypothetical question you should ask yourself. If you knew today was your last day on earth, what would you do different? ... ESPECIALLY if, bu doing something DIFFERENT, today might NOT be your last day on earth. I don't think that question was very hypothetical at all.
