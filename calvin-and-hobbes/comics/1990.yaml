  "19900902":
    transcript: Buttons... check. Dials... check. Switches... check. Little colored lights... check. Calvin, the airline pilot, is tenth in life for takeoff. His patience is at an end! Ignoring the control tower's protests, Calvin guns the engines and passes the other planes, cutting across less crowded runways! Rounding a corner, he opens the throttle! Stewardesses explaining the aircraft's safety features are hurled to the rear of the plane by the sudden acceleration! All the other planes watch with envy as Calvin takes off ahead of schedule! But what is this?! Another plane has already recieved clearance to land! It's headed for the same runway! It looks like a mid-air collission over a crowded super highway at rush hour! Oh, what a price to pay for his hurry! I'm back! Thanks for waiting so patiently. I could wait even longer if you'd buy me a THIRD plane.
    description: Calvin, the airline pilot, awaits takeoff.  Ignoring the control tower, Calvin guns the engines and passes the other planes.  He opens the throttle.  Stewardesses are hurled to the rear of the plane.  Calvin takes off ahead of schedule.  He notices another plane had received clearance to land.  It's headed for the same runway.  It looks like a mid-air collision over a crowded super highway at rush hour.  Mom returns to the car, telling Calvin thanks for waiting so patiently.  Calvin, playing with his toy airplanes, says he could wait even longer if she'd buy him a third plane.
