  "19900319":
    transcript: Where do we keep the extension cords? In the pantry, on the bottom shelf. Where do we keep the blades for Dad's electric saw? In the... Why do you want to know? Huh? Oh, I'm just making an inventory list so we'll always know where to find things. I get the feeling there was no right answer to that question.
    description: Calvin asks Mom where they keep the extension cords.  Mom tells him in the pantry, bottom shelf.  Calvin then asks where they keep the blades for Dad's electric saw.  Mom asks why he wants to know.  Calvin tells her he's making an inventory list so he'll always know where to find things.  He walks off saying he gets the feeling there was no right answer to that question.
    characters: [calvin, mom]
  "19900320":
    transcript: Calvin, come out from wherever you're hiding and take your bath! Do you hear me, Calvin?! I mean NOW! OH NO! LOOK AT YOU! AUGH! GET OFF THE RUG! Like it's MY fault she hasn't gotten the chimney swept.
    description: Mom is looking for Calvin.  She checks under his bed and yells for him to come out from where he's hiding and to take a bath.  She yells that she means NOW!  She sees Calvin and is horrified.  He yells for him to get off the rug.  Calvin, sitting in the bathtub, is black from head to toe.  Calvin tells Hobbes it's not his fault Mom hasn't gotten the chimney swept.
    characters: [calvin, hobbes, mom]
  "19900321":
    transcript: Mom! Mom! I just saw the first robin of spring! Call the newspaper quick! Ha ha! A front page write-up! A commemorative plaque! A civic ceremony! All for me! Hooray! Hooray! Oh boy! Should I put the prize money in a trust fund or blow it all at once? Ha ha! I can't believe I did it! Calvin... It's a hard, bitter, cruel world to have to grow up in, Hobbes. Cheer up! Did I tell you I saw a robin yesterday?
    description: Calvin runs around happily, saying he saw the first robin of spring.  He figures he'll get a front-page write up in the paper, a commemorative plaque, and a civic ceremony.  He wonders if he should put the money in a trust fund or spend it all at once.  Mom gets his attention.  Calvin is sitting under a tree with Hobbes.  Calvin tells him it's a hard, bitter, cruel world to have to grow up in.  Hobbes tells him to cheer up.  He asks if he told Calvin that he saw a robin yesterday.
    characters: [calvin, hobbes, mom]
  "19900322":
    transcript: I sure like chocolate frosted sugar bombs! Look how brown the milk gets! Ugh. Want to see something weird? Look at the nutritional information on the back panel. Wow. 100% of the daily recommended allowance of caffeine! Hey look! You can send away for a chocolate frosted sugar bombs "Buzzy the Hummingbird" doll!
    description: Calvin tells Hobbes how much he likes his Chocolate Frosted Sugar Bombs.  He shows Hobbes how brown the milk gets.  Calvin points out something on the nutritional label.  Hobbes notices the cereal provides 100% of the daily recommended allowance of caffeine.  Calvin notices an offer to send for a "Buzzy the Hummingbird" doll on the side panel of the box.
    characters: [calvin, hobbes]
  "19900323":
    transcript: Eenie, meenie, miney, moe! Catch a tiger by the toe! If he hollers, um... Uh... Heh heh... Who writes these dumb things anyway?
    description: Hobbes is lying on the floor, and Calvin starts playing with his toes saying "eenie, meenie, miney, moe, catch a tiger by the toe".  Hobbes opens an eye.  Calvin continues saying "if he hollers.." as Hobbes starts to rise with an angry look on his face.  Calvin walks off all scuffed up saying who writes these dumb things anyway.
    characters: [calvin, hobbes]
  "19900324":
    transcript: County library? Yes, do you have any books on homemade bombs? That's what I said. I need a book that lists supplies and gives step-by-step instructions for building, rigging and detonating them. Well what about your other branches? Don't THEY have any books like that? Boy, and people wonder why kids don't read.
    description: Calvin calls the county library looking for information on homemade bombs.  Calvin needs a book that lists the needed supplies, and gives instructions for building, rigging, and detonating them.  Calvin asks if any of their other branches have books like that.  Dejectedly, Calvin hangs up saying people wonder why kids don't read.
    characters: [calvin]
  "19900325":
    transcript: Isn't this a nice way to spend the evening? We should do this more often. I still think one of you broke the rabbit ears on purpose. It's getting late, Calvin. You'd better head up to bed. But I'm not tired! Can't I read a little more? I don't think so. You see, we don't want you to get too smart. You don't? Ha ha! Of course not! If you were smarter, you might realize...your "parents" are really bug-eyed aliens from Neptune! Augh! Let me go! Let me go! Got the batter ready? Yep! Let's dunk the kid! M-mm! There's nothing like a fresh batch of earth boy waffles! Waffles? Help! Help! Eep! poof! I wasn't asleep! I'm not tired! Look, his face was pushed into your leg so hard, it left corduroy lines! Z
    description: Mom tells Calvin he'd better go to bed.  Calvin wants to read a little more.  Mom says they don't want him to get too smart.  Calvin is puzzled.  Dad explains that if Calvin were smarter, he might realize...his parents are really bug-eyed aliens from Neptune!  They rip their masks off, and Calvin runs away.  They grab him, get batter ready, and dunk him.  They say there's nothing like a fresh batch of earth boy waffles.  Calvin wakes up.  He says he wasn't asleep and isn't tired.  As Mom and Dad carry Calvin to bed, Mom notices Calvin's face was pushed into Dad's leg so hard, it left corduroy lines.
