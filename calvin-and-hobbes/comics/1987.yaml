"19870911":
  transcript: Hi, Mom. Hobbes and I went time traveling and visited the Jurassic period today. That's nice. What's it like? Pretty scary. A dinosaur almost ate us. Actually, we were trying to go into the future, but we made a mistake. I see, well, I'm glad you made it back. Your mom isn't fazed by much is she? It depends, she didn't take the frogs in the toilet so well, remember?
