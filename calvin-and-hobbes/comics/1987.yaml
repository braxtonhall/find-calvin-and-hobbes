"19870620":
  transcript: I'm home! Dad! Hobbes and I flew by your office window today on a rug! We saw you working. We waved and hollered, but you didn't even look up. We couldn't believe it. You missed the whole thing! I thought we were cutting down his sugar intake.
  description: Dad arrives home, and Calvin tells him he and Hobbes saw him at work.  He tells him they flew by his office window on a rug.  Calvin continues to tell Dad that they tried to get his attention, but that he didn't look up.  Dad tells Mom he thought they were cutting down on Calvin's sugar intake.
  characters: [calvin, mom, dad]
"19870621":
  transcript: Oh boy oh boy oh boy oh boy oh boy oh boy oh boy oh boy. Wait! Wait! I've got to savor this moment! The brilliance of it all! I'm a genius! A sheer genius! Susie's playing on the sidewalk! Now's my chance to use the snowball I've been saving in the freezer! She'll never expect a snowball in June! Boy, will she be mad! Ha ha ha! This is going to be great! Here it comes! Oh boy! Oh boy! Hey Susie!! Piff. I missed! Darn it! Darn it! Darn it! Of all the miserable luck! Aaarrghh! There must've been a cross breeze! I can't believe it! I save that snowball for three whole months! I ... scoop scoop. I ... I ... uh ... pow! The irony o fthis is just sickening.
  description: Calvin gleefully pulls out a snowball from the freezer.  Susie is playing on the sidewalk.  Calvin knows she'll never expect a snowball in June.  He sneaks up on her and throws.  PIFF!  He misses her.  He starts ranting about how he had bad luck.  He figures there was a cross-wind.  While Calvin is complaining, Susie repacks the snowball and looks at Calvin. POW!  Calvin lies on the sidewalk with his face covered in snow as Susie walks off smiling.  Calvin says the irony of this is just sickening.
  characters: [calvin, susie]
"19870622":
  transcript: 1988 isn't too far away Dad. If your thinking of running for "Dad" again, you'd better get your campaign in gear. Frankly, the pools look grim. I don't think you've got much of a shot at keeping the office. I take comfort in the fact that not many people want it. Flippant remarks have a way of haunting candidates, you know.
  description: Calvin tells Dad 1988 isn't too far off.  He tells him he better get his campaign in gear if he's running for "Dad" next year.  Calvin says the polls don't look too good, and that he doesn't have much of a chance to keep the office.  Dad tells him he takes comfort in the fact not many people would want the job.  Calvin reminds him that flippant remarks have a way of haunting candidates.
  characters: [calvin, dad]
"19870623":
  transcript: The chameleon sits motionless. Amazingly, the lizard changes color to blend in with his surroundings. Moments later, he is virtually invisible. I see you hiding back there! Now come clean up this mess you made in the kitchen!
  description: The chameleon sits motionless.  The lizard changes color to blend into his surroundings.  He is soon virtually invisible.  Calvin peeks over the back of the sofa as Mom yells at him from the other room.  She sees him hiding there and tells him to come clean the mess he left in the kitchen.
  characters: [calvin, mom]
"19870624":
  transcript: Hold still. There's a monster horsefly on your head. Pow! Can you believe it? I missed! So excuse me for trying to help! you wanna scratch a stinging welt all day? Fine! Go away! No, wait there's a mosquito on you.
  description: Calvin tells Hobbes there is a monstrous horsefly on his head.  He smacks him with the fly swatter.  As the fly goes away, Calvin asks if Hobbes can believe he missed it.  Calvin is up on a tree branch telling Hobbes he can scratch a welt next time.  Hobbes waves a fly swatter at Calvin and tells him there's a mosquito on him.
  characters: [calvin, hobbes]
"19870625":
  transcript: I wanna horsey ride! I'm busy Calvin. You know, Dad, it won't be long before I'm all grown up. One day you'll wake up and wonder how all the years slipped by. You'll look back and say, "Where has the time gone? Calvin's so big. It's hard to remember when he was small enough that I could give him horsey rides." ... but those days will be lost forever. I think I've worked through my potential guilt now. No, no! Jump the fence!
  description: Calvin asks Dad for a horsey ride.  Dad tells him he's busy.  Calvin reminds him that one day, he'll be grown up and Dad will wonder where all the years went.  He keeps telling him that he'll think back on the days when Calvin was small enough to give horsey rides to and lament those days being lost forever.  Dad gives Calvin the horsey ride.  He tells Calvin that he's worked through his guilt, but Calvin wants him to jump over the fence they're approaching.
  characters: [calvin, dad]
"19870626":
  transcript: I read that girls are made up of "sugar and spice and everything nice" ... whereas boys are made of "snips and snails and puppy dogs' tails." Hmph. So what are tigers made of? "Dragonflies and katykids, but mostly chewed-up little kids." Oh, that's clever.
  description: Hobbes tells Calvin that he's heard girls are made of sugar, spice, and everything nice, while boys are made of snips, snails, and puppy dog tails.  Calvin asks what tigers are made of.  Hobbes tells him dragonflies, katydids, but mostly chewed-up little kids.  Calvin doesn't think that's very funny.
  characters: [calvin, hobbes]
"19870627":
  transcript: Do you have any money? Nope. Hmm ... how can we get some? Who do we know that we could sue?
  description: Calvin asks Hobbes if he has any money.  Hobbes says no.  Calvin asks how they can get some.  They think for a little bit, then Calvin asks who Hobbes knows that they can sue.
  characters: [calvin, hobbes]
"19870628":
  transcript: What's wrong with you, fish? Why won't you eat this big, fat, juicy worm? Besides the obvious, I mean. Boy I hate fishing, this is so boring! Look, I can see a whole bunch of fish down there, but they're not biting! Lousy fish! By golly, I'm not going to sit here all day waiting for them to get hungry! Here, help me carry this rock. We'll dump it in the water and blast the fish out. Then we can just pick them up. Heave! Kabloosh! Ok, it was a bad idea! But I got wet too, right? No, no your idea was fine! We just didn't throw in a big enough object.
  description: Calvin is sitting on the pier fishing.  He's complaining that it's too boring.  He sees fish in the water, but they're not biting.  He's not going to sit there all day waiting for them to get hungry.  He and Hobbes grab a huge rock.  He figures he and Hobbes can throw the rock into the water and blast the fish out.  Then, they can just pick the fish up.  They heave the rock into the pond.  WHOOSH!  A huge water splash drenches Calvin and Hobbes on the pier.  Calvin tells Hobbes that it was a bad idea, but that he got wet too.  Hobbes grabs Calvin to toss him into the water.  Hobbes says the idea was good, but they didn't throw a big enough object into the water.
  characters: [calvin, hobbes]
"19870629":
  transcript: '... so could I, Mom? Please? Pleeeaase? I still don''t think giving her "Bambi eyes" is going to get you a flame thrower. Maybe I should sniffle a little too, huh?'
  description: Calvin puts his hands together and asks if he could....please.  He tries saying please with doe eyes.  He's standing in front of a mirror.  Hobbes tells him that giving Mom "Bambi eyes" isn't going to get her to give him a flamethrower. Calvin thinks sniffling a bit might help, also.
  characters: [calvin, hobbes]
"19870630":
  transcript: What a perfect day! If something doesn't happen here soon, I'm gonna wack out.
  description: Calvin and Hobbes are lying under a tree.  Hobbes says it's a perfect day.  They lie there looking around. After a bit, Calvin tells Hobbes that if something doesn't happen soon, he's going to wack out.
  characters: [calvin, hobbes]
"19870701":
  transcript: Look a firefly! Your rear hasn't lit, if that's what you're wondering. I can't even tell what muscle to flex.
  description: Calvin points out a firefly to Hobbes.  Calvin clenches his teeth and bends forward.  He looks at his rear end. Hobbes tells him his rear wasn't lit, if that's what he was wondering.  Calvin says he can't even tell what muscle to flex.
  characters: [calvin, hobbes]
"19870702":
  transcript: Hey Hobbes, want to see an antelope? An antelope?! C'mon! See she's coming down the ladder to her boyfriends car! You're not laughing. It's not funny.
  description: Calvin asks Hobbes if he wants to see an antelope.  They race over to where Calvin is playing.  He tells Hobbes she's coming down the ladder to her boyfriend's car.  Calvin tells Hobbes that he's not laughing.  With arms crossed, Hobbes tells Calvin it's not funny.
  characters: [calvin, hobbes]
"19870703":
  transcript: Tomorrow is independence day. The Declaration of Independence says everyone is created equal and is entitled to life, liberty and the pursuit of happiness. Oh. So when does Paul Revere ride through town and give us our presents.
  description: Hobbes tells Calvin that tomorrow is Independence Day.  He explains that everyone is created equal and is entitled to life, liberty and the pursuit of happiness.  Calvin wants to know when Paul Revere rides through town giving them their presents.
  characters: [calvin, hobbes]
"19870704":
  transcript: Bang! Kapwinngg! Up up and awaaayy!
  description: Dad is sitting in his chair reading the paper.  He hears a bang from the other room.  Calvin races in, climbs up on the arm of the chair, and makes the bullet bounce off him.  He races off saying "up, up and awaaayy".
  characters: [calvin, dad]
"19870705":
  transcript: The dreaded scum beings fire! Spaceman Spiff is hit! It never fails. I just washed and waxed this thing. Our hero, the intrepid Spaceman Spiff, struggles with the controls of his damaged spacecraft! The freem propulsion blasters are useless! Spiff crashes onto the surface of an alien planet! Unscathed, the fearless space explorer emerges from the smoldering wreckage! He is marooned on a hostile world! Scorched by twin suns, the planet is nothing but barren rock and methane! There's no hope of finding food or water. Spiff collapses! Oh, no. a hideous alien spots him! In his weakened state, Spiff is no match for the monster! This could be the end!! Lunchtime! I brought you a sandwich and some lemonade. Bring the dishes back when you're done, ok? ... oh well. Thanks Mom.
  description: Spaceman Spiff fights the controls of his spacecraft.  He crashes on an alien planet.  He's marooned on a hostile planet.  He sees there is no hope for food and water.  A hideous alien approaches.  In his weakened state, Spiff is no match for the monster.  The monster hands Spiff a sandwich and some lemonade.  Mom tells him to bring the dishes in when he's done.
  characters: [calvin, mom, spiff]
"19870706":
  transcript: Z. Z. Z. Tag! The game's over tuna brain.
  description: Calvin and Hobbes are lying in bed.  Calvin is sleeping.  Hobbes looks over and touches Calvin on the head, saying "Tag".  Calvin tells Hobbes the game is over and calls him tuna brain.
  characters: [calvin, hobbes]
"19870707":
  transcript: Somebody told me rotten eggs smell bad. They smell terrible. Put 'em back Calvin.
  description: Calvin tells Mom that someone told him rotten eggs smell bad.  Mom confirms they smell terrible.  Calvin walks away.  Without moving, Mom adds that Calvin should put them back.
  characters: [calvin, mom]
"19870708":
  transcript: I want 8 cookies to go, please. This is not a drive-thru! Put that back in the garage!
  description: Calvin carries his tricycle to the front door and puts it on the floor.  He rides into the kitchen.  He stops at the counter where Mom is standing and asks for eight cookies to go, please.  Mom yells that this isn't a drive-through and to put his tricycle back in the garage.
  characters: [calvin, mom]
"19870709":
  transcript: Quick, Mom! Aliens just landed in the back yard! They demand to talk to you! You go on out! I'll guard the cookies in the kitchen! Quick! Hurry! She's not buying this. Calvin, just how dumb do you think I am?
  description: Calvin runs into the house telling Mom aliens landed in the back yard and want to talk with her.  He offers to guard the cookies while she goes out.  He tells her to hurry.  Mom asks Calvin how dumb he thinks she is.
  characters: [calvin, mom]
"19870710":
  transcript: What do you think is the secret to happiness? Is it money, power or fame? I'd choose money. If you have enough money, you can buy power and fame, that way you'd have it all and be really happy! Happiness is being famous for your financial ability to indulge in every kind of excess. I suppose that's one way to define it. The part I think I'd like best is crushing people who get in my way.
  description: Calvin asks Hobbes what he thinks is the key to happiness.  He suggests money, power, or fame.  Calvin says he's choose money.  With that, he could buy power and fame and have it all.  Happiness is being famous for your financial ability to indulge in every kind of excess.  Hobbes supposes that's one way to define it.  Calvin goes on to say the part he'd like best is crushing people who get in his way.
  characters: [calvin, hobbes]
"19870711":
  transcript: Look! Somebody poured new cement! Is anyone looking? We could write our initials in it, or make a hand print, or something! Yeah! Or something! I think we'd better find a hose quick! I didn't think it would set up so fast.
  description: Calvin shows Hobbes a patch of newly poured cement.  Hobbes asks if anyone is watching.  He mentions they could write their initials in the cement, make a hand print, or something.  Calvin likes the "or something" part.  They walk off looking for a water hose.  Hobbes didn't think it would set up so fast.  They both have cement hanging from their rear ends.
  characters: [calvin, hobbes]
"19870712":
  transcript: Psst. Hey kid, c'mere under the bed. I've got a brand new toy for you. Uh oh. I think I saw a tentacle under the bed! Monsters! Turn on the lights! That makes monsters shrivel up. Good idea. Click! Aarrghhh! Aieeee. Aahhhhhh!! Gackk! Ha ha. We got 'em! Just the ones under the bed, we'd better open up the drawers and closet too and get some light in those places! By golly, no monsters going to get us tonight! Wither and die, bloodsucking freaks of nature!! Why is your light on? What in the world are you doing?!? Monsters, Dad. They could be anywhere. You're trashing your room at 1:00 in the morning, looking for monsters?! If you don't get in bed this instant, you'll have  lot more to worry about than stupid monsters!! What we need is some way to shrivel him up.
  description: Hobbes thinks he saw a tentacle under the bed.  Monsters.  Calvin turns on the light to shrivel up the monsters. Calvin suggests opening the doors to the closet and drawers to get the monsters there.  As they pull open the dresser drawers, Calvin says no monsters are going to get them tonight.  He tells them to wither and die, bloodsucking freaks of nature.  Dad opens the bedroom door and asks what's going on.  Calvin tells him monsters could be anywhere.  Dad yells for Calvin to get back in bed or he'll have something other than monsters to worry about.  After he leaves, Calvin suggests that what they need is a way to make Dad shrivel up.
  characters: [calvin, hobbes, dad]
"19870713":
  transcript: Hey Calvin, whatcha doin'? Quiet down or you'll give away my position. Hobbes and I are having a water fight. A water fight! Can I play? You? Ha! War is a manly art! I suppose anything so idiotic would have to be. Can I play in your game or not? I don't know, it seems you'd rather be making smart remarks.
  description: Susie asks Calvin what he's doing.  Calvin shushes her quiet.  He and Hobbes are having a water fight.  Susie asks if she can play.  Calvin scoffs at her saying war is a manly art.  She supposes anything that idiotic must have to be.  She asks if she can play or not.  Calvin thinks she might prefer making smart remarks.
  characters: [calvin, susie]
"19870714":
  transcript: C'mon, can't I join your water fight? I have my own water pistol and everything! It'll just take me a minute to get it. Ok, you can play, but Hobbes is on my team. You have to fight both of us. Great! I can beat you and your stuffed tiger any day. I'll go put on my swimsuit. Susie's going to play with us, ok? Oh boy. Girls flip for guys in jams.
  description: Susie again asks Calvin if she can join their water fight.  She has her own water pistol at home.  Calvin says it's alright, but she'll have to fight against both Calvin and Hobbes.  Susie happily runs off saying she can beat him and his stuffed tiger any day.  Calvin tells Hobbes that Susie is going to join them.  Hobbes is wearing a pair of trunks and thinks girls flip for guys in Jams.
  characters: [calvin, hobbes, susie]
"19870715":
  transcript: I got my water pistol! I'm all set! Good. Now Hobbes and I will be one team, and you ... Look at your toy tiger! He's wearing jams!! That's so cute! Let me squeeze him! Oh for pete's sake, knock it iff! You go around the house and count to fifty, and then we begin, all right? You and your dumb jams. This is war, remember?! You're just jealous. ... ooh, what a babe!
  description: Susie comes over with her water gun.  She sees Hobbes and thinks he's cute wearing his Jams.  She gives him a squeeze.  Calvin tells her to quit it and to go around the house to count till 50.  Then, they'll start.  Calvin scolds Hobbes for his Jams.  He reminds him they're at war.  Hobbes, with a big smile on his face, tells Calvin he's just jealous.  Hobbes says Susie is a babe.
  characters: [calvin, hobbes, susie, stuffedhobbes]
"19870716":
  transcript: "Listen up, yogurt brain. Here's our strategy: I'll  go around the house this way, and you go around the other way. I'll draw Susie's fire, and you can let her have it from behind with your water balloon! Got it? Ok, let's go! Thanks for the water balloon, Hobbes, you're a great double agent!"
  description: Calvin lays out the strategy to Hobbes.  They'll split up with one of them going around the house in each direction.  Calvin will draw Susie's fire, then Hobbes will sneak up from behind and hit her with a water balloon.  Susie sneaks around the house, finding Hobbes sitting there with a water balloon.  She thanks him for the water balloon and for being a great double agent.
  characters: [calvin, hobbes, susie, stuffedhobbes]
"19870717":
  transcript: Ha ha! Ambush!! Have a drink Susie! Whoa! Whoop! You've got Hobbes' water balloon! Where did? How? Uh oh. Bloosh! I promise you you'll hang for this, traitor! I'm easily wiled by a woman in a swimsuit.
  description: Calvin charges Susie, squirting her with his water pistol.  He stops when he notices she has Hobbes' water balloon.  BLOOSH!  Calvin gets smacked with the balloon.  A dripping Calvin promises Hobbes he'll hang for this and calls him a traitor.  Hobbes defends himself by declaring he's easily wiled by a woman in a swimsuit.
  characters: [calvin, hobbes, susie]
"19870718":
  transcript: My best friend betrays me! Susie drenched me with my own teammate's water balloon! Some buddy you are, you Benedict Arnold! Hmph, I'd do it again in a minute. Susie likes my jams. Don't even talk to me! You and I are through! Ha! Promises, promises! Um ... I take it the game is over. Get this traitor off me. He cheats when he fights, too.
  description: Calvin continues to complain to Hobbes, who is standing with arms crossed and a stern look on his face. Calvin says his best friend betrayed him, and he got soaked with his teammate's own water balloon.  Calvin calls him a Benedict Arnold.  Hobbes says he'd do it again.  Susie likes his Jams.  Calvin tells him not to talk to him.  Hobbes sticks his tongue out at Calvin and says "Promises, promises".  Susie walks over to Calvin, who is lying on the ground with Hobbes lying on top of him.  Calvin tells Susie to get the traitor off of him, and that he cheats when he fights, too.
  characters: [calvin, hobbes, susie]
"19870719":
  transcript: Can you believe this? Some idiot tossed garbage here in this beautiful spot. I'll bet future civilizations find out more about us than we'd like them to know. Look, another can thrown on the ground! Boy, this makes me mad! By golly, if people aren't burying toxic wastes or testing nuclear weapons, they're throwing trash everywhere! You'd think planets like this were a dime a dozen! Now I've got to carry this gross thing. You know, there are times when it's a source of personal pride to not be human. I'm with you.
  description: Calvin sees a can on the ground.  He complains that if people aren't burying toxic wastes or testing nuclear weapons, they're throwing trash everywhere.  Hobbes declares that there are times when it's a source of personal pride not to be human.  They walk along, then Calvin takes his clothes off.  They continue to walk as Calvin says "I'm with you".
  characters: [calvin, hobbes]
  note: Does not match GoComics date. Confirmed release date via Los Angeles Times
"19870720":
  transcript: Aren't these long summer days great? No responsibilities at all! We have the whole day to ourselves. Don't you wish it could be like this all year, forever? No school. No job, no anything? Yeah. Just gloat about it, why don't you!!
  description: Calvin is telling Hobbes the long summer days are great.  There are no responsibilities, and they have the whole day to themselves.  He asks Hobbes if he wishes it could be like that all year, no school, no job, no anything.  Hobbes looks at Calvin with a smile on his face.  As Hobbes skips merrily away, Calvin yells to him "Just gloat about it, why don't you".
  characters: [calvin, hobbes]
"19870721":
  transcript: Hey Dad, what are clouds made of? Hmm ... I used to know that. I think they're mostly water. So how come they float? Well, it's sort of evaporated water, maybe there are some other gases, too. I'm not sure. So why are they white when the rest of the sky is blue? Heck, beats me. I guess we ought to look this stuff up. I take it there's no qualifying exam to be a Dad.
  description: Calvin asks Dad what clouds are made of.  He tells Calvin mostly water.  Calvin then wonders why clouds float.  Dad says they're mostly evaporated water.  Calvin asks why clouds are white, instead of blue.  Dad says he doesn't know, and that they should look it up.  Calvin says he takes it there are no qualifying exams to be a Dad.
  characters: [calvin, dad]
"19870722":
  transcript: One of the best things about summer is going to sleep with the fan on. The gentle breeze blowing, droning hum, everything seems safe and serene when the fan is on. It's cool and lulling and perfect for sleep. It almost lets one forget he has a heavy fur coat for a bunkmate. If you don't like it, there's plenty of room on the floor, buster.
  description: Calvin and Hobbes are in bed.  Calvin says sleeping with the fan on is one of the best things about summer. The gentle breeze blowing, the droning hum, everything's safe and serene when the fan is on.  He says it's cool and lulling and perfect for sleep.  He then leans over to Hobbes and says that it's almost enough to forget he has a heavy fur coat for a bunkmate.  Hobbes tells him that if he doesn't like it, there's plenty of room on the floor.
  characters: [calvin, hobbes]
"19870723":
  transcript: Hey Mom, what's this I hear about the greenhouse effect? They say the pollutants we dump in the air are trapping in the sun's heat and it's going to melt the polar ice caps! Sure, you'll be gone when it happens, but I won't! nice planet you're leaving me! This from the kid who wants to be chauffeured any place more than a block away. Hey, nobody told me about the ice caps, all right?
  description: Calvin asks Mom about the greenhouse effect.  He explains that he's heard about the pollution trapping the sun's heat and melting the polar ice caps.  He tells her that she'll be gone when it happens, but he won't.  Mom says this is from the kid who wants to be chauffeured any place more than one block away.  Calvin proclaims no one had told him about the ice caps before.
  characters: [calvin, mom]
"19870724":
  transcript: More bad news on your polls, Dad. We're looking at an all-time low in popularity here. Well, Calvin. That's certainly food for thought. Now here's something you can think about. The average cost of raising a kid to age 18 is $100,000. That's a lot of money. So the question you should be asking yourself is, "Is that hundred grand a gift, or a loan?" Gotcha, Dad. I was just on my way to bed.
  description: Calvin tells Dad that his polls are at an all-time low.  Dad tells him that's food for thought.  He then says Calvin should think about the fact that it costs $100,000 to raise a kid till 18.  That's a lot of money.  Dad asks Calvin to think about whether that money should be considered a gift or a loan.  Calvin scurries off and says he gets the message.
  characters: [calvin, dad]
"19870725":
  transcript: Ring ring. Hello? May I speak with your father please? Hec, you don't need my permission! Be my guest! What a weirdo. Ring ring.
  description: Calvin picks up the ringing phone.  The caller asks to speak with Dad.  Calvin tells the caller to be his guest. They don't need his permission.  Calvin walks away saying the caller is a weirdo.  The phone rings again.
  characters: [calvin]
"19870726":
  transcript: That's it, you climb up and then help me up! Tigers are natural-born tree climbers. Of course we usually have grappling hooks, ropes and utility belts. Hey, here's a great tree for climbing! Let me get on your shoulders so I can reach the first branch, ok? Geez, how many bricks do you have in your pockets?! Whoa! Hold steady, you weakling. I've almost got it! Move up, move up! Hurry and grab it before my spine telescopes. Got it! Hey, don't let go! Hold me up! Forget it! You can support your own weight, bowling ball butt.  Mmph! Mmph! I can't get up! Give me a boost! Hey! What are you doing?! Don't take off my shoes! Are you nuts? Hey, stop! Aack! Oh no! don't tickle! Pbth! Eek! Hee hee ha ha! Stop it! I can't hold on! Hee hee hoo hoo! Aaugh! Nice landing. I'm probably paralyzed. All except your mouth obviously. I'm not sorry at all. Give me back my shoes. No.
  description: Calvin asks Hobbes to put him on his shoulders so he can climb into a tree.  Hobbes asks how many bricks he has in his pockets.  Calvin tells him to hold steady.  Hobbes tells him to hurry up before his spine telescopes.  Calvin is hanging from a branch.  He asks Hobbes to help hold him up.  Hobbes takes off Calvin's shoes and starts tickling him.  Calvin falls from the tree.  He lands on Hobbes.  Hobbes tells him he's paralyzed.  Calvin replies that he's not sorry at all and to give his shoes back.
  characters: [calvin, hobbes]
  note: Does not match GoComics date. Confirmed release date via Los Angeles Times
"19870727":
  transcript: I can't believe how dull my life is. It's so boring here. Nothing ever changes around here. Nothing ever happens. It seems as if (hang on) everybody but me gets to have an exciting life. Actually, I'd like less excitement in my life. Why? Are you doing fun things when I'm not around?? Huh? Are you?!
  description: As they ride down the hill in the wagon, Calvin can't believe how dull his life is.  Nothing ever changes.  As they fly into the air after the wagon crashes into the stream, Calvin says everybody but him gets to have an exciting life.  Hobbes shakes water out of his ear and says he'd like a little less excitement in his.  Calvin accuses Hobbes of doing fun things when he's not around.
  characters: [calvin, hobbes]
"19870728":
  transcript: What's wrong, Calvin? Why are you still in bed? I don't feel good. Your forehead seems warm. We'd better take your temperature. I can't be sick now! It's still summer vacation! There's no school to stay home from! This is my time! Somebody owes me big for this!!
  description: Mom asks Calvin why he's still in bed.  Calvin replies that he doesn't feel good.  Mom says his forehead seems warm and decides to take his temperature.  Calvin says he can't be sick.  It's summer vacation and there is no school to stay home from.  This is his time.  He yells that somebody owes him big for this.
  characters: [calvin, mom]
"19870729":
  transcript: Hi there, Calvin. I understand you're not feeling well. Me? I'm fine! I just sit around torture chambers in my underwear for kicks. Let's see your degree, you quack! I'm not going to hurt you. I'm just going to examine you to see what's wrong. I'll tell you what's wrong! I've got Dr. Frankenstein for a pediatrician, that's what's wrong! Nurse, call the anesthesiologist in here, will you please? My Dad's a lawyer, I'll have you know! Don't come near me!
  description: The doctor is seeing Calvin.  He tells Calvin he understands he's not feeling well.  Calvin retorts that he's fine. He sits around torture chambers in his underwear for kicks.  He asks to see the doctor's degree and calls him a quack.  The doctor says he isn't going to hurt Calvin.  He just wants to examine him.  Calvin says that what's wrong is that he has Dr. Frankenstein for a pediatrician.  The doctor whispers to the nurse to call the anesthesiologist.  Calvin tells him his Dad is a lawyer and not to come near him.
  characters: [calvin, doctor]
"19870730":
  transcript: Deep in a dank dungeon on the dismal planet Zog, the fearless Spaceman Spiff is held prisoner by the sinister Zog king. A guard leads Spiff to the interrogation room. Our hero is stoic and defiant! At last I meet the famed Spaceman Spiff! I trust you are ... heh ... heh ... enjoying your visit? You're wasting your time, maggot from mars! I'll never give in! Never, you hear me?! Never! Kid, don't make me recant the Hippocratic oath, ok?
  description: Spaceman Spiff is in a dungeon on the planet Zog.  A guard leads Spiff to the interrogation room.  The inquisitor says he finally gets to meet the famed Spaceman Spiff.  He trusts Spiff is enjoying his visit.  Spiff calls him a maggot from Mars and says he'll never give in.  Calvin is hiding behind the scale with the doctor on his knees telling Calvin not to make him recant his Hippocratic oath.
  characters: [calvin, doctor, spiff]
"19870731":
  transcript: Well, you certainly were a terror in the doctor's office. I fended him off with his own tongue depressor. That's why I didn't get a shot. You didn't need a shot. Your behavior was inexcusable. All that counts is that he couldn't get near enough to stick me. He thinks I'm a little pink pin cushion in underpants. Someday I hope you have a kid that puts you through what I've gone through. Yeah, Grandma says that's what she used to tell you.
  description: As they drive home, Mom tells Calvin he was a terror at the doctor's office.  Calvin says he didn't get a shot because he fended the doctor off with a tongue depressor.  Mom says he didn't need a shot and that his behavior was inexcusable.  Calvin is just glad that the doctor couldn't get close enough to stick him.  He says the doctor thinks he's a pink pin cushion in underpants.  Mom tells Calvin she hopes he has a kid one day who puts him through the same things he's putting her through.  Calvin replies that Grandma says that's what she used to tell Mom.
  characters: [calvin, mom]
"19870801":
  transcript: Here is a proud city. Full of happy prosperous citizens. They go on about their business, unaware that the moon mysteriously moved a few miles closer to the earth. Unaware, that is, until the tide comes in. Sploosh! Gisshhh!
  description: Calvin is playing on the beach.  He builds a proud city, full of prosperous citizens.  Calvin says they're unaware the moon has moved a few miles closer to the earth.  They're unaware until the tide comes in.  A big wave comes in and crashes into the sand city.
  characters: [calvin]
"19870802":
  transcript: The fire's not lighting, huh? Can I make a suggestion? Give up on that sissy lighter fluid. Can't we cook the hamburgers yet? The coals aren't hot enough. But I'm hungry I want to eat now! Well, you'll just have to wait. You know, Calvin sometimes the anticipation of something is more fun than the thing itself once you get it. Here we are, it's a beautiful evening. It's nice to just sit here and look at the trees while we wait for the coals to get hot, don't you think? Dinner will be over soon, and afterward we'll be distracted with other things to do. But now we have a few minutes to ourselves to enjoy the evening. These summer days go by so quickly. It's good that every now and then we have to wait for something. So should I go to McDonald's then, or what? Yeah, I know you think you are going to be six all of your life.
  description: Calvin wants to cook the hamburgers on the grill, but the coals aren't hot enough yet.  Calvin tells Dad he wants to eat now.  Dad explains sometimes the anticipation of getting something is sometimes better than when you get it.  Dad looks out at the woods and says it's nice to sit looking while the coals get hot.  He says dinner will be over soon and they'll be distracted by other things.  They have a few moments by themselves to enjoy the evening.  He says it's good they have to wait for something every now and then.  Calvin looks out, then asks whether he should go to McDonald's or what.
  characters: [calvin, dad]
"19870803":
  transcript: ""
  description: Calvin is dressed like an Indian, armed with bow and arrow.  Hobbes has an arrow hit right next to him.  He walks over to Calvin, who shrugs his shoulders innocently.  Hobbes sticks Calvin up high on the side of the house with the arrow.
  characters: [calvin, hobbes]
"19870804":
  transcript: What a perfect day! Isn't it great to be on summer vacation? To be able to enjoy all this with no school and no responsibilities? ... ahhhhhhh ... I can't believe there's nothing on TV but repeats.
  description: Calvin tells Hobbes it's a perfect day.  He's on summer vacation and can enjoy the day with no school or responsibilities.  He and Hobbes sniff the air.  Then, Calvin complains there is nothing on TV but repeats.
  characters: [calvin, hobbes]
"19870805":
  transcript: I think a bee landed on my back! Can you see it? I don't want to move. That's not a bee. It isn't? Whew. No, that's a hornet if I ever saw one! Ow!
  description: Calvin stops and says he thinks a bee landed on his back.  Calvin asks Hobbes to look, since he doesn't want to move.  Hobbes tells him it's not a bee.  Calvin wipes his brow as Hobbes says that's a hornet if he ever saw one.  Just then, it stings Calvin and he jumps into the air in pain.  He then chases Hobbes.
  characters: [calvin, hobbes]
"19870806":
  transcript: If you could have three wishes granted, what would they be? Just three wishes, huh? Hmm. That would be a tough decision. I guess I'd have to think about it a while. Oops! Hang on. Ok. I know what my first wish would be.
  description: As Calvin and Hobbes go down the hill in the wagon, Calvin asks Hobbes what three wishes he would make. Hobbes says that would be a tough decision.  He figures he'd have to think about it a little while.  The wagon flies off the hill, Calvin and Hobbes flying into the air.  Hobbes says he knows what his first wish would be.
  characters: [calvin, hobbes]
"19870807":
  transcript: One of nature's uglier creatures, the bat is a misunderstood marvel of evolution. Producing a series of loud, high-pitched squeaks, the bat can judge an insect's distance and elevation by the time delay of the squeak's echo! Changes in the echo's pitch reveal the doomed bug's direction! No movement escapes the incredible senses of the bat! Glump! Ta-daa! Eyes closed! Calvin, sit up and eat with a fork like a civilized human being.
  description: The bat is a marvel of evolution.  Producing high-pitched squeaks, the bat can judge an insect's distance and elevation by the delay in the sound's echo.  No movement escapes the senses of the bat.  Calvin flips some food into his mouth from the restaurant table.  His eyes are closed.  Dad scolds Calvin to sit up and eat with a fork like a civilized being.
  characters: [calvin, dad]
"19870808":
  transcript: Yawn. Waauughh! For the last time, get out of bed! We're going to be late. I'm trying. I'm trying.
  description: Calvin yawns and hops out of bed.  The covers reach out and grab him.  They pull him back into bed.  Mom comes in and tells him to get out of bed.  They're going to be late.  Calvin says he's trying.
  characters: [calvin, mom]
"19870809":
  transcript: That run doesn't count! You didn't touch third base! That's 'cause third base crawled to the outfield! Wap! Ha ha! Easy out! Hey! Where are you going?! You have to stay on the base line, you cheater! Yeah? Prove it! This isn't fair! You can't run anywhere! Just watch me! If  we had a first baseman, you'd've been out a long time ago! But we don't, do we? Gotcha! You're out! Ok, I'm up to bat again! What fun! Two man baseball is a real sport! A real sport for idiots. Next time I'm going to tag you out with the bat instead of the ball.
  description: Hobbes hits the ball, and Calvin chases him to tag him out.  Hobbes runs off the basepath.  He keeps running through the woods.  Calvin chases him saying he can't run anywhere he wants.  Calvin continues to chase Hobbes and yells that he'd have been out if they had a first baseman.  Hobbes replies that they don't and sticks his tongue out at Calvin.  Finally, Calvin catches Hobbes and tackles him in a big cloud of dust.  Hobbes gets up and says he's still up to bat.  He says two-man baseball is a real sport.  Calvin says it's a real sport for idiots.  He says the next time he'll tag Hobbes out with a bat instead of the ball.
  characters: [calvin, hobbes]
"19870810":
  transcript: Hobbes, did you hear? Mom and Dad are taking us camping! We get to live in a tent and go fishing and canoeing! Won't that be fun? We'll be roughing it! Living off the land! No TV or radio or ... uh-oh. What's wrong? This sounds suspiciously like one of Dad's plots to build my character.
  description: Calvin cheerily tells Hobbes that Mom and Dad are taking them camping.  He says they'll live in a tent, go fishing and canoeing.  He thinks that will be fun.  He goes on to say there'll be no TV, no radio.  They'll be living off the land. Then he stops and decides this sounds suspiciously like one of Dad's plots to build his character.
  characters: [calvin, hobbes]
"19870811":
  transcript: Gosh, this is going to be a fun vacation! Camping out! Wow! I can't wait to get there! A whole week hiking and canoeing and swimming and fishing! A whole week without a single newspaper or a decent cup of real coffee. Doesn't Mom like camping? Mom was up a little too late packing.
  description: Calvin is sitting in the back seat of the car.  He says it's going to be a fun vacation.  He can't wait to get there. There will be a whole week of fishing, swimming, hiking, and canoeing.  Mom sits angrily in the front seat saying there will be a week without a single newspaper or a decent cup of coffee.  Calvin asks if Mom likes camping.  Dad says Mom was up a little too late last night packing.
  characters: [calvin, hobbes, mom, dad]
"19870812":
  transcript: See that island ahead? That's where we're camping! Oh boy! Ahh, this is the life! Fresh air, clean water, lots of exercise, and ... boom! Dear, you're back-paddling. We're turning around and finding a hotel!
  description: As the family rows their canoe, Dad points out the island they'll be camping at.  Dad happily tells about the fresh air, clean water and plenty of exercise.  BOOM!  Rain comes pouring down.  Dad tells Mom that she's backpedaling. Mom says they're turning around and finding a hotel.
  characters: [calvin, hobbes, mom, dad, stuffedhobbes]
"19870813":
  transcript: When's this rain going to let up? I don't know, Calvin. Hey, cheer up gang! I packed storm gear. "Always be prepared." You know. These ponchos are super. They're thermal-sealed lightweight nylon, laminated with flexible urethane for complete water protection! Yeah, Dad, it's great that we won't get wetter than we already are. Zinc oxide, thongs, tanning lotion ... wrong duffel bag. Let's see, which one of these was it?
  description: Calvin asks when the rain is going to let up.  Mom doesn't know.  Dad says to cheer up, he's brought storm gear.  He talks about how great the ponchos are, what they're made of, and how they'll be protected from the rain.  Calvin thinks it's great they won't get any wetter than they already are.  Dad is still looking for the storm gear.  He finds the duffel bag with sun tanning lotion.
  characters: [calvin, mom, dad]
"19870814":
  transcript: I'm glad Dad finally got the tents up. Now I can get out of these soggy clothes. Too bad you can't put on dry clothes. You'd feel a lot better. Hey, wait! No! Don't do that here! Ackpth!
  description: Calvin is glad Dad got the tents set up.  He is getting out of his wet clothes.  He tells Hobbes it's too bad he can't put on dry clothes.  Hobbes arches his back while Calvin yells for him not to do that in the tent.  Hobbes shakes the water from his coat, resoaking Calvin.
  characters: [calvin, hobbes]
"19870815":
  transcript: Some trooper you are! What's a little rain? This is what being in the wilderness is all about! Ha ha! At least it's not snowing, right? Right? I mean, say it was snowing so hard we couldn't make a fire. Boy, I love cold canned ravioli.
  description: Dad is standing in the rain when Calvin comes out.  Dad says he's a trooper.  He asks what's a little rain.  Dad says at least it's not snowing.  Calvin dejectedly looks at the ground while Dad says "Right?".  Dad continues on to say he meant snowing so they couldn't light a fire.  Calvin says he loves cold, canned ravioli.
  characters: [calvin, mom, dad]
"19870816":
  transcript: Tum de ta ta dee dee do. Boy, this sure beats sitting in an office all day! Is it still raining? Of course, it's still raining. It's been raining for days. Why should it stop now?! We're going to need a vacation after this vacation. I'll say! We can't even keep a fire going. I can't believe dad went out to catch fish. In this weather? He's a fanatic! Either that or we're al out of packaged food. We'll probably starve to death on this god-forsaken rock. After all that spam, starving doesn't sound so bad. If we live to get home, I'm never going to set foot outside again as long as I live. What a lucky kid Calvin is! I never got to do this stuff when I was his age. Hey Calvin! Want to learn how to gut a fish?
  description: Hobbes asks if it's still raining.  Calvin tells him it's been raining for days.  Hobbes says they'll need a vacation after this vacation.  Calvin can't believe Dad went out fishing.  Hobbes says he's a fanatic.  Calvin thinks it may be because they're out of packaged food.  He worries they'll starve to death on this god-forsaken rock.  Hobbes says that after all that Spam, starving doesn't sound so bad.  Calvin tells him that if he ever gets home, he'll never go outside again.  Dad is just pulling the boat onto the shore saying Calvin is lucky because Dad never got to do this stuff when he was a kid.  Then he yells to Calvin to see if he wants to learn how to gut a fish.
  characters: [calvin, hobbes, dad]
"19870817":
  transcript: How's the water? Freezing. I'm coming out. Hand me my towel. Ok? Wring wring. This is the dumbest vacation I've ever been on.
  description: Calvin is swimming in the lake as rain continues to fall.  Hobbes is on shore in a raincoat.  He asks Calvin how the water is.  Calvin tells his it's freezing.  He has Hobbes hand him a towel.  He wrings it out, then starts to dry himself as the rain continues to fall.  As they walk back in the rain, Calvin says this is the dumbest vacation he's ever been on.
  characters: [calvin, hobbes]
"19870818":
  transcript: It has been very buggy week, has it? You're really reaching, Dad.
  description: Calvin and Dad are fishing in the boat as the rain continues to fall.  Dad says it hasn't been very buggy this week.  Calvin tells him he's really reaching.
  characters: [calvin, dad]
"19870819":
  transcript: We're packing up! Yep. I've had enough what a rotten week! Wap! Do you know what any of Dad's words meant? No, but I wrote some of them down so we can look 'em up when we get home.
  description: Dad is packing up the gear to leave.  He says it's been a rotten week, and he's had enough.  The rain stops, and the sun shines through the clouds.  Dad slaps himself in the forehead.  Calvin asks Hobbes if he knows what the words Dad said meant.  Hobbes doesn't, but he wrote them down so they can look them up when they get home.
  characters: [calvin, hobbes, dad]
"19870820":
  transcript: Well, gang, I'm sorry the weather wasn't any better this week. I know it wasn't always a lot of fun, but we lived through it, and we got ot spend some time together and that's what's really important. Anyway, I hope you're all not too disappointed. Calvin, tell your dad any judge would take this trip as grounds for divorce. Dad, Mom says ...  All right! All right!
  description: Driving home, Dad says he's sorry the weather wasn't better that week.  He knows it wasn't fun, but they lived through it, they got to spend time together, and that's really what counts.  He says he hopes they're not too disappointed.  Mom says any judge would take this trip as grounds for a divorce.
  characters: [calvin, mom, dad]
"19870821":
  transcript: Dad, can you get my ball out of the gutter again? This is the third time this afternoon! I though I told you to play out back! Relax, Dad. It's just a ball in the gutter, it's not as if I've been embezzling money or killing people. Right? Aren't you glad I'm not stealing and murdering? I always have to help dad establish the proper context.
  description: Calvin asks Dad to get the ball down from the gutter again.  Dad says this is the third time today.  He had told Calvin to play out back.  Calvin tells Dad to relax.  It's only a ball in the gutter.  He hasn't been embezzling money or killing people.  Calvin always has to help Dad establish the proper context.
  characters: [calvin, dad]
"19870822":
  transcript: 'C''mon Hobbes. Let down the rope ladder. What''s the rest of the password? I think five verses extolling tigers is plenty. You know it''s me! Let me up! No. ooh, why you lousy rotten, stinking ... If you call me names, you have to start over at the beginning. Verse six: "Tigers are nimble and light on their toes, my respect for tigers continually grows." You''re not doing the dance.'
  description: Calvin yells up to Hobbes in the tree fort to let down the rope ladder.  Hobbes insists Calvin give the rest of the password.  Calvin thinks five verses extolling tigers is enough.  Hobbes won't do it.  Calvin starts calling him names, and Hobbes tells him he'll have to start over with the password if he continues.  So Calvin goes through verse six.  Hobbes tells him he's not doing the dance.
  characters: [calvin, hobbes]
"19870823":
  transcript: Ah-choo! Whew. No brains. Ah ah ah ah choo!! The force of the nasal explosion sends Calvin reeling through the stratosphere! With less and less air to resist his momentum, he breaks the pull of earth's gravity and hurls past the moon! As he passes out of the galaxy, Calvin reflects on the wisdom of covering one's mouth when sneezing to deflect the propulsion. Alas, it is knowledge gained too late for poor Calvin, the human satellite! But wait! Another sneeze is brewing! Calvin turns himself around! The second sneeze rockets him back to earth! He's saved! It's a miracle! Ah choo! God bless you. Oh, he does, Mom, he does.
  description: Calvin sneezes and flies into the stratosphere.  He breaks the pull of earth's gravity and hurls out past the moon.  As he passes out of the galaxy, he realizes the importance of covering one's mouth to defect the propulsion.  That knowledge comes too late for Calvin, the human satellite.  Wait, he feels another sneeze coming so he turns himself around. The second sneeze rockets him back to earth.  He's safe.  Mom tells Calvin "God bless you".  Calvin replies "He does".
  characters: [calvin, mom]
"19870824":
  transcript: The end of summer is always hard on me. Trying to cram all the goofing off I've been meaning to do.
  description: Calvin and Hobbes are lying under a tree.  Calvin says the end of summer is always hard on him, cramming in all the goofing off he's been meaning to do.
  characters: [calvin, hobbes]
"19870825":
  transcript: How come you're still home? Why aren't you at work? I took the day off. Say, Dad, can I have a look at the classified section? As soon as I'm through with it. Gosh Dad, I'd sure like to borrow that section right this minute. Why don't you read the editorials? "New dad wanted. Frequent traveler preferred. Liberal views on discipline a must, ask for Calvin during normal work hours."
  description: Calvin asks Dad why he's still home.  Dad tells him he took the day off.  Calvin looks horrified.  He asks to see the classified section of the newspaper.  Dad tells him he can have it when he's done.  Calvin wants to see it right away and asks Dad if he'd rather read the editorials.  Dad starts reading an ad.  New Dad wanted, frequent traveler preferred.  Liberal views on discipline a must.  Contact Calvin during normal work hours.
  characters: [calvin, dad]
"19870826":
  transcript: I don't wanna take a bath! I hate taking baths! Aaaahhhh! No no no! They can make me do it, but they can't make me do it with dignity.
  description: Calvin yells that he doesn't want to take a bath.  He hates taking baths.  He runs yelling down the hall.  As Mom carries him up the stairs, he yells "no" over and over.  He's finally in the tub.  He says they can make him do it, but they can't make him do it with dignity.
  characters: [calvin, mom]
"19870827":
  transcript: Rats. I can't tell my gum from my silly putty.
  description: Calvin reaches into his pocket and pulls out something sticky.  It gets all over his hands.  He says he can't tell his gum from his Silly Putty.
  characters: [calvin]
"19870828":
  transcript: Wap wap wap. Wipity wappity wipity wappity. Bipita bipita bipita bipita bipita.
  description: Calvin is jumping rope.  He goes faster and faster.  Hobbes comes up behind him with a stick in his hands.  He puts the stick in the way of Calvin's jump rope and he gets all tangled up.
  characters: [calvin, hobbes]
"19870829":
  transcript: I'm never gonna get married are you? Hmm ... I suppose if the right person came along, I might. Somebody with green eyes and a nice laugh, who I could call "pooty pie". Pooty pie?? Or "Bitsy Pookums." I think that would affect my stomach a lot more than my heart. "Bitsy Pookums." I'd say "Yes Snoogy Woogy." She'd reply ...
  description: Calvin tells Hobbes he's never going to get married.  Hobbes thinks he would, if the right person came along. Hobbes is looking for someone with green eyes, a nice laugh, and that he can call "pooty pie".  Either that or "bitsy pookums". Calvin thinks that would affect his stomach more than his heart.
  characters: [calvin, hobbes]
"19870830":
  transcript: Stir stir. Strettcchhh. Stab stab. Pat pat pat. Mush mush. SNIFF. HWOOF! Lick. ACKPTGH. BLECHH. Glug glug glug. Smack. BR-R-R-R-R. HAAAKK HOCCHH. Choke... gasp... There... (pant)... see? I... I... TRIED it. (cough) It... almost (wheeze) killed... me. Clap clap clap clap. Encore. BraVO. I'm going to run away to Alaska.
  description: Calvin has his dinner on the plate.  He stabs it with his fork, makes funny faces at it, sniffs it, tastes it, acts like it's gagging him, takes a drink, shakes his head trying to get the taste out of his mouth.  He finally says he tried it, and it almost killed him.  Mom and Dad applaud, saying "Bravo" and "Encore".  Calvin thinks he should run away to Alaska.
  characters: [calvin, mom, dad]
"19870831":
  transcript: Want to go time traveling with me? See, I built a time machine. This looks like your transmogrifier. To the inattentive and brainless layman, yes, but you crawl under the transmogrifier, whereas with the time machine, you climb in the top. Ahh.
  description: Calvin wants to know if Hobbes wants to go time traveling with him.  He has built a time machine.  It's a box with "time machine" written on the side.  Hobbes says it looks like his transmogrifier.  Calvin says it does "to the inattentive, brainless layman".  He points out that you crawl in the bottom of the transmogrifier, whereas you crawl in the top of the time machine.
  characters: [calvin, hobbes]
"19870901":
  transcript: Are we going to travel into the past or into the future? Well, I suppose if we went into the past, I could ace any upcoming history exams in school. That might be useful. But if we went into the future we could swipe something and pretend to invent it when we got back. We could be rich. The future it is, then! Right. Once I'm rich, I can hire somebody to take all my dumb tests!
  description: Hobbes asks whether they're going to the past or the future.  Calvin weighs the choices.  If he goes to the past, he can ace some history tests at school.  If they go to the future, they can swipe something to bring back.  They'll claim they invented it and be rich.  Off to the future they go.  Calvin figures he can hire someone to take his tests when he's rich.
  characters: [calvin, hobbes]
"19870902":
  transcript: OK, Hobbes, our time machine is all set, put on your goggles and we'll be off to the future! Why do we have to wear goggles? Geez, do you think traveling years into the future is like driving down the street?! We've got to contend with vortexes and light speeds! Anything could go wrong! Of course we need to wear goggles! Gosh, I think my goggles are in the bedroom. If I'm not back in a couple of minutes, you can go without me. Sit down, sissy. I already got your goggles.
  description: Calvin tells Hobbes to put on his goggles, and they'll be ready to go.  Hobbes wants to know why he needs goggles.  Calvin explains time travel is not like driving down the street.  There are vortexes and light speeds to contend with. Anything could go wrong.  Of course they need goggles.  Hobbes tries to get out by saying his goggles are in the bedroom.  He tells Calvin to leave without him if he isn't back in a couple minutes.  Calvin tells him to sit down.  He has Hobbes' goggles.
  characters: [calvin, hobbes]
"19870903":
  transcript: All ready? I'll just push the button and off we go into the future! Up, up and awaayyy! We're approaching light speed Hobbes! Hang on! I have to go to the bathroom. Now?! In hyperspace?! Are you crazy?!
  description: Calvin pushes the button and off they go.  Up, up and away.  They approach light speed.  Hobbes has to go to the bathroom.  Now?  Calvin can't believe it.  He tells Hobbes they're in hyperspace.  Is Hobbes crazy?
  characters: [calvin, hobbes]
"19870904":
  transcript: What year in the future are we going to land? It's hard to pinpoint exactly, but I'd say sometime around the turn of the century. I hope ol' earth is still around then. I've grown fond of it. If not, we'll return to the present and see if Dad will give me my college tuition early in cash.
  description: Hobbes wonders what year in the future they'll land.  Calvin thinks it will be around the turn of the century. Hobbes hopes the earth is still around then, he's gotten attached to it.  Calvin says if it isn't, he's going back to the present to see if Dad will give him his college tuition early in cash.
  characters: [calvin, hobbes]
"19870905":
  transcript: Hang on! We're coming in! screeechhh! Wow! So this is the future! I kinda pictured more buildings. Maybe we landed in an aboretum.
  description: They're coming in for a landing.  They look around.  So this is the future.  It looks like they're on a tropical beach.  Hobbes pictured more buildings.  Calvin guesses they may have landed in an arboretum.
  characters: [calvin, hobbes]
"19870906":
  transcript: You know, some people never get to walk in a beautiful woods like this. While others of us face the prospect of never doing anything else. Oh, hush we'll find our way home. You don't remember any of this? Nope, we're sure lost this time. If I had known we weren't going to find our way home, I'd have brought my coloring books. We could be out here for months. We'd better forge for shelter this will be fun! We can be modern Robinson Crusoes, living off the land by our wits! We can be rugged explorers! Yeah! We'll be free from all the constraints of civilization! Oh boy! Hey, isn't that our back yard? Why, so it is. I don't care how long you'll be gone, I'm only making you one sandwich. How about rifles then? Do we have any rifles?
  description: Calvin and Hobbes are lost in the woods.  If Hobbes had known they'd get lost, he'd have brought a coloring book.  Calvin thinks they should forage for shelter.  They'll be modern Robinson Crusoes.  Hobbes says they can be rugged explorers.  Calvin notes they'll be free from the constraints of civilization.  Hobbes looks over and notices their back yard. Mom tells Calvin she doesn't care how long he'll be gone, she's only packing one sandwich.  Calvin asks if they have any rifles.
  characters: [calvin, hobbes, mom]
"19870907":
  transcript: Let's have a look around I'm sure we'll run into a robot or something. Look at this. Gosh, I wonder what futuristic device this is! Some sort of transportation pod, I'd guess. I wonder how you get in? I don't see a door or license number anywhere. This is very peculiar. Have you ever seen a tree this color?
  description: Calvin climbs out of his time machine.  They're going to look around.  They'll probably run into a robot or something.  Hobbes picks up something egg-shaped.  Calvin thinks it's some type of transportation pod.  Hobbes can't figure out how to get in it.  Calvin notices there are no numbers or doors on it.  As Calvin ponders the peculiar item, Hobbes asks if Calvin has ever seen a tree this color.  He's looking at what appears to be a giant leg.
  characters: [calvin, hobbes]
"19870908":
  transcript: I must say, the future is quite a bit different than I expected. This breeze is so hot and muggy. I figured they'd be able to control the weather by now. The air stinks, too. I guess there's still pollution. Ever feel as if you're being monitored? ... or that you're about to do a double-take?
  description: Calvin admits the future looks a bit different from what he expected.  Hobbes says the breeze is hot and muggy.  He thought they'd have figured out a way to control weather by now.  Calvin says the air stinks, too.  Calvin asks if Hobbes has ever felt like he's being monitored.  Hobbes adds "or that you're about to do a double-take".  Behind them is the face of a dinosaur looking at them.
  characters: [calvin, hobbes]
"19870909":
  transcript: Aaugh back to the time machine! Run! We must've gone back in time instead of forward! What tipped you off? The dinosaur?! Don't get smart, fuzzbrain. Just get in and face the other direction so we can go into the future this time! You mean we went into the past because we were facing the wrong way!! You think I've got some triple-a map?! Maybe you'd like to steer this time!
