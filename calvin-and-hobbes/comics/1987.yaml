"19870910":
  transcript: We made it! It's a good thing the time machine didn't stall, or we'd have been eaten by dinosaurs! We're coming back toward the present now. Do you want to stop at home or keep going into the future like we planned? I've had enough time traveling, let's go home. Let's go just a little into the future and see what I'm like as a teen-ager! Let's not, all right?
