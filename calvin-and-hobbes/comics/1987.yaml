"19870220":
  transcript: I've been in the water about 20 minutes look at my fingers. They're all wrinkled! So are my toes! Pretty neat huh? "Big pink raisin discovered in tub - boy's whereabouts unknown!" Aaugh!
  description: Calvin is in the bathtub talking to Hobbes.  He points out his fingers and toes, which are all wrinkled.  Calvin thinks it's neat.  Hobbes imagines a news heading "Big pink raisin discovered in tub, boy's whereabouts unknown".  Calvin shrieks and starts climbing out of the tub.
  characters: [calvin, hobbes]
"19870221":
  transcript: For the next 60 seconds I will conduct a test of my emergency broadcast equipment. Aaaaaaaaghhhhhhhh! Had this been a real emergency, the scream you just heard would have been followed by lots more just like it. This concludes my ... oh someday when the house caves in, she'll thank me. Mark my words.
  description: Calvin comes up behind Mom and tells her for the next 60 seconds, he will conduct a test of his emergency broadcast equipment.  He then yells at the top of his lungs.  Mom jumps up from her chair.  Calvin concludes his test.  He says if this had been a real emergency, he would have screamed lots more times.  As he sits on his bed with a scowl on his face, Calvin tells Hobbes that when the house caves in, she'll thank him.
  characters: [calvin, hobbes, mom]
"19870222":
  transcript: Aaaaahhh! Eeee! Hee hee hee hee! Woo! Ack! I've got you! Aaheeeee! Tickle tickle! Ah! Ah! Hee hee hee woo hoo! I'm gonna getcha! I'm coming after you! Eek! Hee hee. Here I come! Gotcha! Gootchie gootchie! Akpth! Ha ha ha. Eeep! Ha ha hee hee ooh! Ooh! Ha ha ha. Tickle, tickle! Whoa! Whoa! We'd better stop. Calm down, calm down. Ha ha hoo hoo hee hee ha. Hee hee whoof! Ha ha! (pant pant) hee hee hee wheeeeeeee ... her plan backfired, Dad. I'm all wound up, and Mom needs to be put to bed.
  description: Mom and Calvin are playing.  She tickles him, chases him through the house, then tickles him some more. Calvin is laughing and giggling.  Finally, Mom suggests they stop and calm down.  Mom curls up and falls asleep.  Calvin tells Dad her plan backfired.  He's all wound up, and Mom needs to be put to bed.
  characters: [calvin, mom, dad]
"19870223":
  transcript: Oh, Mom, I need Crisco for school today! Shortening? Honestly Calvin, I wish you'd remember these things the night before. Now hurry up and get ready. Right. Here's the Crisco back. Thanks. You put it in your hair?? Get back here! You're not going to school like that! Aw c'mon, Mom! It's class picture day!
  description: Calvin is eating breakfast and tells Mom he needs Crisco for school.  Mom hands him the Crisco and tells him he should remember these things the night before.  Calvin puts a bunch in his hair.  Mom can't believe he did that.  She tells him he's not going to school like that.  Calvin pleads with her.  It's class picture day.
  characters: [calvin, mom]
"19870224":
  transcript: What with your hair? I told Mom I'm getting my school picture taken today, and she made me comb out the Crisco I put in my hair. Now I look like a moron. That's true. You do. Well don't just stand there! Think of something! What can I do? There, much better! What'd you do is it cool? Is it new wave? Gee, I wish I had a mirror.
  description: Calvin is standing at the bus stop with his hair slicked down.  Hobbes asks what the deal is with his hair.  Calvin says Mom made him take the Crisco out of his hair.  Now he says he looks like a moron.  Hobbes agrees.  Calvin tells him to do something and not just stand there.  Hobbes makes points out of the sides of Calvin's hair.  Calvin wants to know if it's new wave and asks if it's cool.
  characters: [calvin, hobbes]
"19870225":
  transcript: The bus is going to be here any minute. You're sure you fixed my hair so it looks ok? It looks great. Try not to muss it up. You're not kidding me, are you? This really looks good? Trust me. You look like ... like ... "Astro boy." All right! I can't wait to get my picture taken now!
  description: Calvin asks Hobbes if he's sure he's fixed his hair so it looks okay.  Hobbes says it looks great.  Calvin doesn't believe him.  Hobbes tells him to trust him and that he looks like "Astro Boy".  Calvin is happy with that and now can't wait to get his picture taken.
  characters: [calvin, hobbes]
"19870226":
  transcript: Calvin! What did you do to your hair?? Don't you know we have our pictures taken today? Of course, silly. That's why I did it. It's Crisco. Does your mom know you look like that? Sort of. Hobbes fixed me up a little bit at the bus stop. Wow. I wish I had some Crisco. Wait till Mom sends my picture to Grandma!
  description: Susie is shocked at Calvin's hair.  She reminds him it's class picture day.  He tells her that's why he did it.  Susie wonders if his Mom knows he looks like that.  Calvin tells her "sort of".  He says Hobbes fixed him up at the bus stop. Susie puts her head in her hands and wishes she had some Crisco.  Calvin can't wait till Mom sends his picture to Grandma.
  characters: [calvin, susie]
"19870227":
  transcript: Ok, kid, sit up straight on the stool and look right at me. That's it. Are you ready to take my picture? Should I take off my shirt now? Kid what are ... ? don't take off your shirt!! See? I painted a face on my stomach. Kid, put your shirt back on. But look! When I breath out the face changes! See? Ok, take one quick!
  description: The photographer sits Calvin on the stool and tells him to look at him.  Calvin starts taking his shirt off.  The photographer tells him not to take his shirt off, but Calvin tells him he has a face painted on his stomach.  The photographer tells him to put his shirt back on.  Calvin points out that when he breathes out, the picture changes.  He tells the photographer to take a picture quick.
  characters: [calvin]
"19870228":
  transcript: Look, Hobbes, I got my school pictures back. Look at you! Ha ha ha! Look at your hair! Hee hee! These are great! Aren't they though? Hee hee hee! What an expression! Hoo hoo hoo! Ha ha! Yeah, see how I got my one eye to roll back? Ha ha ha! Your mother's going to go into conniptions of course. Oh c'mon. Years from now think of the memories these will bring.
  description: Calvin has his school pictures and shows them to Hobbes.  Hobbes starts laughing at Calvin and his hair.  He says the pictures are great.  Calvin agrees.  Hobbes rolls onto his back laughing and points out one picture with a funny expression.  Calvin says he got one of his eyes to roll back on that one.  As Hobbes wipes tears of laughter from his eyes, he points out that Mom is going to go into conniptions.  Calvin says think of the memories the pictures will bring years from now.
  characters: [calvin, hobbes]
"19870301":
  transcript: Glik glik glik. Oh no! what have I done?!? The human body is 80% water. Little did Calvin realize how critical it is to maintain that! Now it's too late! By drinking that extra glass of water, Calvin has upset that precious balance! He is now 90% water! Everything solid in Calvin's body begins to dissolve! He is becoming liquid!! His only hope is somehow to get to an icebox and freeze himself solid until he can get proper medical attention! Unfortunately, as a liquid, Calvin can only run downhill! Can he make it? Can he make it?? I don't think I'm going to make it. There's a gas station up ahead. Just hold on. Didn't I tell you not to drink so much before we left?!
  description: Calvin has upset his body's water balance.  Everything solid in his body begins to dissolve.  He is becoming liquid.  If he could get to an icebox, he could freeze himself until he can get medical attention.  But he can only run downhill. Can he make it?  Calvin, sitting in the back seat of the car, doesn't think he can make it.  Mom tells him there's a gas station ahead and to hold on.  Dad reminds Calvin he told him not to drink so much before they left.
  characters: [calvin, mom, dad]
"19870302":
  transcript: Calvin, how do you explain this test score? It's terrible! I didn't study for it. What do you mean you didn't study for it? Why not? I forgot. You forgot? How could you possibly forget?? What? Huh? Where am I? Who am I? Don't give me this amnesia stuff!
  description: Dad is questioning Calvin as to why his test score was so terrible.  Calvin says he didn't study for it.  Dad asks for clarification as to why he didn't study for it.  Calvin tells him he forgot.  Dad wonders how he could have forgotten to study. Calvin holds his hands out, eyes wide, and asks where and who he is.  Dad tells him not to give him that amnesia stuff.
  characters: [calvin, dad]
"19870303":
  transcript: Gee, it was awfully nice of you strangers to have me over for dinner. Calvin, knock  it off. You mean me? Is my name Calvin? You're not fooling anyone, young man. You do not have amnesia. This all seems vaguely familiar ... and yet ... and yet ... you're asking for an early bedtime, kid. Well, he seems to remember he likes dessert anyway. This is "dessert" you say? Hmm ... perhaps my memory would return if I had some more. That's it, bed!
  description: Calvin is at the dinner table, and he thanks the strangers for having him over for dinner.  Dad tells him to knock it off.  He says Calvin does not have amnesia.  Calvin tries to concentrate as he says this all seems vaguely familiar.  Dad says he's asking for an early bedtime.  Mom says Calvin seems to remember he likes dessert, as Calvin digs in.  He says his memory might return if he had some more dessert.  Dad tells him to go to bed.
  characters: [calvin, mom, dad]
"19870304":
  transcript: I've had enough of this silly amnesia game. Since you won't stop it, you're going to bed. You can let me know if you want to be serious. Wink. Aauughh! Mister, there's a tiger in this room!!
  description: Dad carries Calvin up the stairs saying he's had enough of this silly amnesia game.  Since Calvin won't stop it, it's off to bed.  Dad tells him to let him know if he wants to be serious.  Calvin winks at Hobbes as Dad leaves.  When Dad closes the door, Calvin yells out that there's a tiger in the room.
  characters: [calvin, hobbes, dad, stuffedhobbes]
"19870305":
  transcript: Calvin, all we want is for you to study and do your best in school, education is very important. That's why this amnesia game has to stop. No more "forgetting" to do your homework. Ok? Ok, mister. Ok? ... uh Dad. Right, Dad. You got it.
  description: Dad sits on the bed and tells Calvin that they just want him to study and do well in school.  He tells Calvin education is very important.  He tells him that's why the amnesia game has to stop.  Calvin needs to stop "forgetting" to do his homework.  Dad asks "OK?", Calvin replies "OK, mister".  Dad leans forward and yells "OK?", Calvin replies "uh, Dad. Right, Dad.  You got it".
  characters: [calvin, dad]
"19870306":
  transcript: I'm glad to see you're doing your homework. How is your math class going now? Um ... I'm doing great. How great? Real great. Have you been passing all your quizzes? I didn't say phenomenal.
  description: Dad looks in on Calvin doing his homework.  Dad says he's glad Calvin is doing his homework and asks how his math class is coming along.  Calvin tells him great.  Dad wants to know how great.  Calvin says real great.  Dad asks if he's been passing all his quizzes.  Calvin replies he didn't say phenomenal.
  characters: [calvin, dad]
"19870307":
  transcript: RING RING RING RING RI ... It's never for me and I hate taking messages.
  description: Calvin walks by the ringing telephone.  It continues to ring as he walks over to the wall.  He pulls the phone cord out of the plug, which stops the phone from ringing.  Calvin says it's never for him, and he hates taking messages.
  characters: [calvin]
"19870308":
  transcript: I'M HOME! AAUUGH! YAAAA! I thought that after seven boring hours at school, I though you might appreciate one moment of pure, abject terror. Let me up to get my bat and I'll thank you.
  description: Hobbes peeks out the window, sneaks behind a potted plant, hides under the chair, and finally races toward the door.  Calvin comes in the door and is immediately pounced upon by Hobbes.  As Hobbes sits on Calvin's back, he tells Calvin that after seven boring hours of school, he figured Calvin would appreciate one moment of pure, abject terror.  Calvin wants Hobbes to let him get his bat to show his thanks.
  characters: [calvin, hobbes]
"19870309":
  transcript: Hobbes, look! There's a little raccoon on the ground. Is it alive? I think so, but he's hurt. See, he's hardly breathing. Better not touch him if he's hurt. Yeah. You wait here and guard him. I'll run and get Mom. I sure hope she can help. Of course she can! You don't get to be Mom if you can't fix everything just right.
  description: Calvin finds a little raccoon on the ground.  It's hurt and is barely breathing.  Hobbes suggests not touching him.  Calvin decides to go tell Mom.  Hobbes hopes she can help.  Calvin tells him you don't get to be a Mom if you can't fix everything just right.
  characters: [calvin, hobbes]
"19870310":
  transcript: There's Hobbes guarding him, Mom. The little raccoon's right over there! Ooh, Calvin, I don't know if we can save him. He looks pretty bad. Go get a shoe box and a clean dish towel. Right! I don't think this poor little guy is going to make it, Hobbes (sigh) I hate it when these things happen. ... you can tell I'm upset when I start talking to you.
  description: Calvin and Mom come back to the raccoon.  Mom isn't sure they can save him.  She sends Calvin for a shoe box and a clean dish towel.  Calvin runs off, and Mom sits next to Hobbes.  She says she doesn't think the raccoon will make it.  She hates when things like this happen.  She then realizes she's talking to Hobbes and says you can tell she's upset when she starts talking to him.
  characters: [calvin, hobbes, mom, stuffedhobbes]
"19870311":
  transcript: Well, I got him in the shoe box. I guess all we can do is keep him warm and safe. We'll keep him in the garage, and put out some water and food. I read in a book that raccoons will eat just about anything. Chances are, I'll be happy to donate most of my dinner. Calvin, you don't even know what we're having.
  description: Mom puts the raccoon in the box.  She tells Calvin all they can do is keep him warm and safe.  She tells him they'll put him in the garage and out some food and water.  Calvin mentions he read that raccoons will eat almost anything.  He says chances are he'll be happy to donate most of his dinner.  Mom tells him he doesn't even know what they're having.
  characters: [calvin, hobbes, mom, stuffedhobbes]
"19870312":
  transcript: Has he eaten anything? No. don't die little raccoon. It wouldn't be very grateful of you to break my heart.
  description: Calvin and Hobbes are looking at the raccoon.  Hobbes asks if he's eaten anything, and Calvin replies no. They continue to look at the raccoon.  Calvin tells the raccoon not to die.  He says it wouldn't be grateful of the raccoon to break his heart.
  characters: [calvin, hobbes]
"19870313":
  transcript: I can't sleep. Me either. I keep thinking about the raccoon. I hope he lives. Me too. I think animals are always so cute.
  description: Hobbes can't sleep.  Calvin can't either, from worrying about the raccoon.  Hobbes hopes the raccoon lives. Calvin does, too.  Hobbes says that he thinks animals are always so cute.
  characters: [calvin, hobbes]
"19870314":
  transcript: Dad, did you check on the little raccoon this morning? Yes, Calvin. I'm afraid he died. Waahhhh!! I'm sorry too, kiddo. But he didn't have much of a chance. Wahhhaahh! At least he died warm and safe Calvin. We did all could, but now he's gone. Sniff. I know I'm crying because out there he's gone, but he's not gone inside me.
  description: Calvin asks Dad if he checked on the raccoon.  Dad says he did, and the raccoon died.  Calvin starts crying. Dad consoles him by saying the raccoon didn't have much of a chance.  Dad says that at least the raccoon died warm and safe.  They had done all they could.  Calvin sniffles and says that even though the raccoon is gone from outside, he's not gone from inside.
  characters: [calvin, dad]
"19870315":
  transcript: Here's a photo I took of you. The picture is kind of fuzzy. You're kind of fuzzy! Ok, make a face! Howth thith? Great! Hold it! Let's see! Let's see! It's developing! I can start to see it! There I am! Look! Look! Ha! Ha! It's great! What a photograph! Hee hee hoo hoo ha ha! Ha ha hee hee ho ho ho! Let's take some more! That's it. Bug your eyes you! Hee hee! Hurry up! All these pictures are of Hobbes?! Aren't they a scream? Can I have ten bucks for another roll of film?
  description: Calvin has an instant camera and takes a picture of Hobbes.  He has Hobbes make faces and odd poses as he takes the pictures.  They laugh as they see the developed pictures.  Calvin takes the pictures to Dad, who wonders why all the pictures are of Hobbes.  Calvin says they're a scream.  He'd like ten bucks for another roll of film.
  characters: [calvin, hobbes, dad, stuffedhobbes]
"19870316":
  transcript: This is where Dad buried the little raccoon. I didn't even know he existed a few days ago and now he's gone forever. It's like I found him for no reason. I had to say good-bye as soon as I said hello. Still ... in a sad, awful, terrible way, I'm happy I met him. Sniff. What a stupid world.
  description: Calvin shows Hobbes where Dad buried the raccoon.  Calvin says he didn't even know the raccoon existed a few days ago, now he's gone forever.  He says it's like he met the raccoon for no reason.  As soon as he said hello, he had to say good-bye.  As Calvin sniffles, he says that in a sad, awful, terrible way, he is glad he met the raccoon.  As they walk over the hill, Calvin says "What a stupid world".
  characters: [calvin, hobbes]
"19870317":
  transcript: You know Hobbes, I can't figure out this death stuff. Why did that little raccoon have to die? He didn't do anything wrong. He was just little! What's the point of putting him here and taking him back so soon?!? It's either mean or its arbitrary, and either way I've got the heebie-jeebies. Why is it always night when we talk about these things?
  description: Lying in bed, Calvin tells Hobbes he can't figure out that dying stuff.  He wonders why the raccoon had to die, it hadn't done anything wrong.  It was so little, what was the point of putting him here and taking him so soon?  Both of them crawl under the bed.  He says it's either mean or arbitrary, and either way he's got the heebie-jeebies.  Hobbes wonders why they always discuss those type of things at night.
  characters: [calvin, hobbes]
"19870318":
  transcript: Mom says death is as natural as birth, and it's all part of the life cycle. She says we don't really understand it, but there are many things we don't understand and we just have to do the best we can with the knowledge we have. I guess that makes sense. But don't you go anywhere. Don't worry.
  description: Walking in the woods, Calvin tells Hobbes that Mom said death is as natural as life and is part of the life cycle. He says Mom told him people don't really understand it, but there are many things people don't understand.  They just have to do the best they can with the knowledge they have.  As they start to walk away, Calvin says he guesses that makes sense.  He then hugs Hobbes and says "but don't YOU go anywhere".  Hobbes tells him not to worry.
  characters: [calvin, hobbes]
"19870319":
  transcript: Hey! What happened to the trees here? Who cleared out the woods? There used to be lots of animals in these woods! Now it's a mud pit! This sign says, "Future site of Shady Acres condominiums." Animals can't afford condos! "Shady Acres"? The only shade I see is from that bulldozer.
  description: As they continue their walk in the woods, Calvin asks what happened to the trees.  They've been cleared out. Calvin says there used to be lots of animals in the woods, now there is just a mud pit.  Hobbes reads a sign saying that area will become the Shady Acres condominiums.  As Hobbes looks around, the only shade he sees is from a bulldozer.
  characters: [calvin, hobbes]
"19870320":
  transcript: Where are all the animals supposed to live now that they cut down these woods to put in houses?? By golly, how would people like it if animals bulldozed a suburb and put in new trees?!? No good, they didn't leave the keys.
  description: Calvin wants to know where the animals are going to live since they've cut down the woods.  Calvin wonders what people would think if animals bulldozed a suburb and put in trees.  Calvin and Hobbes both look up.  Hobbes checks the bulldozer, but the keys weren't left in it.
  characters: [calvin, hobbes]
"19870321":
  transcript: It took hundreds of years for these woods to grow, and they leveled it in a week. It's gone. After they build new houses here, they'll have to widen the roads and put up gas stations, and pretty soon this whole area will just be a big strip. Eventually there won't be a nice spot left anywhere. I wonder if you can refuse to inherit the world. I think if you're born, it's too late.
  description: Calvin notes the woods took a hundred years to grow, but was cut down in a week.  He states that after the houses are built, roads will be widened, and gas stations will be built.  The whole area will be just a big strip.  Eventually, there won't be a nice spot anywhere.  Calvin wonders if you can refuse to inherit a world.  Hobbes thinks once you're born, it's too late.
  characters: [calvin, hobbes]
"19870322":
  transcript: Kablooie! Ooooh, you've twicked me for the wast time, wabbit! Ha ha ha! Boy, I wish I had some dynamite! Boy, I love weekends! What better way to spend one's freedom than eathing chocolate cereal and watching cartoons! Mm ... I beg to differ on the cereal part. Calvin, you've been sitting in front of the stupid TV all morning! It's a beautiful day! You should be outside! It's going to be a grim day when the world is run by a generation that doesn't know anything but what it's seen on TV! Hey! How can you sit inside all day? Go on! Out! Out! Kids are supposed to run around in the fresh air! Have some fun! Get some exercise! Slam! Well, I guess that's that. Come on. Hi, Susie, are you watching TV? Can we come in? sure, hurry up! It's a commercial.
  description: Calvin and Hobbes are sitting on the sofa watching television.  Calvin thinks there is nothing better for spending weekends.  Dad tells him he's been watching television all day and needs to get out and do something.  He says kids are supposed to run around in the fresh air, have fun, and get some exercise.  Dad closes the door on them.  They walk over to Susie's house.  Calvin asks if she's watching TV and wonders if they can come in.  Susie says they can, but to hurry.  There's a commercial on.
  characters: [calvin, hobbes, dad, susie, stuffedhobbes]
"19870323":
  transcript: Hobbes, want to see my transmogrifier? I didn't know you had a transmogrifier. I just got it. You step into this chamber, set the appropriate dials, and it turns you into whatever you'd like to be. It's amazing what they do with corrugated cardboard these days. Isn't it?
  description: Calvin asks Hobbes if he wants to see his transmogrifier.  Calvin says he just got it, which is a cardboard box sitting upside down.  He explains you just step in, set the dials, then turn into whatever you want.  Hobbes is amazed at what they can do with corrugated cardboard these days.
  characters: [calvin, hobbes]
"19870324":
  transcript: This transmogrifier will turn you into anything at all. All you do is set this indicator, and the machine automatically restructures your chemical configuration. You can be an eel, a baboon, a giant bug, or a dinosaur. What if you want to be something else? I left some room, just write it on the side.
  description: Calvin shows Hobbes that you can set the transmogrifier dial to whatever you want.  He explains that the machine restructures your chemical configuration.  You can be an eel, a baboon, a giant bug, or a dinosaur.  The arrow on the side of the box can point to those choices.  Hobbes wonders what happens if you want to be something else.  Calvin explains he left some room, so you can just write it on the side.
  characters: [calvin, hobbes]
"19870325":
  transcript: Well, what do you say? Would you like to be transmogrified? I don't think so. Being a tiger is my area of expertise. Don't be scared. The process is instantaneous and completely painless. Just think! With the push of a button, you could be a 500-story gastropod - a slug the size of the Chrysler building. Gosh, how can I refuse? Well, if you don't like that, be something else! I don't care!
  description: Calvin asks Hobbes if he wants to be transmogrified.  Hobbes thinks being a tiger is his area of expertise. Calvin tells him not to worry, the change is painless and instantaneous.  Calvin tells Hobbes to just think, he could be a 500-story tall gastropod, a slug the size of the Chrysler building.  Hobbes rolls his eyes and sticks out his tongue.  He wonders how he can refuse.  Calvin tells him that if he doesn't want to be that, to pick something else.  Calvin doesn't care.
  characters: [calvin, hobbes]
"19870326":
  transcript: Look, if you can't make up your mind, I'll go first and turn myself into something. I'll show you. But what's the point of turning yourself into something else? No one's done it! Think of the knowledge to be gained. What horrors we visit upon ourselves in the name of science. Ok, I'm in. set the dial on "lungfish" ... no make it "musk ox" ... no ...
  description: Calvin is impatient with Hobbes.  He says he'll go into the transmogrifier first.  Hobbes wants to know what the point is to changing yourself into something else.  Calvin tells him to think of the knowledge gained.  Hobbes comments on what horrors we visit upon ourselves in the name of science.  From inside the box, Calvin tells Hobbes to set it to "lungfish", then changes his mind to "musk ox", no wait...
  characters: [calvin, hobbes]
"19870327":
  transcript: What are you going to transmogrify into? How about a tiger? That's a good idea. The world can always use another tiger. Just turn the arrow and push the button then. All right, here you go. Zap! Did it work? Boy, I'm hot. How do you stand having all this fur?
  description: Hobbes asks what Calvin is going to transmogrify into.  Calvin thinks maybe a tiger.  Hobbes thinks that's a great idea, because the world can always use another tiger.  Hobbes sets the control and ZAP!  Hobbes asks if it worked. Calvin says that he's hot and wonders how Hobbes can stand to have all that fur.
  characters: [calvin, hobbes]
"19870328":
  transcript: So you're a tiger now? Yep, let me out. Words fail me. I'm disappointed too, but keep in mind transmogrification is a new technology.
  description: Hobbes asks Calvin if he's a tiger now.  He replies yes.  Hobbes lifts the box.  He looks down on a Calvin-sized version of himself, complete with furry cheeks.  Hobbes states that words fail him.  Calvin says he's disappointed, too. He reminds Hobbes that transmogrification is a new technology.
  characters: [calvin, hobbes]
"19870329":
  transcript: Thanks for the lunch Mom! I'm going outside. Refueled, the 727 taxis onto the runway. Control tower to Calvin, you are cleared for take off. Roger. Full throttle! Fwoooshh! Take off! Landing gear up! Chugunk! We have reached our crossing altitude of 30,000 feet. A small tasteless snack will be served shortly. This is your captain speaking, I'm afraid our arrival will be slightly delayed. We're stacked up over Washington, and we'll be in a holding pattern for another 40 minutes. Tower to Calvin, you are now cleared for landing. Roger. Landing gear down! Reverse thrust! I saw you outside running in circles for almost an hour! Are you trying to make yourself sick?!? Oog, from now on I'm playing "bus".
  description: Calvin pretends he's an airplane.  He runs down the sidewalk and takes off.  He reaches cruising altitude and serves a small, tasteless snack.  His return is delayed over Washington by all the other aircraft, so he'll have to circle for about forty minutes.  He's cleared for landing and comes down.  Calvin comes reeling into the house.  Mom says that she saw him running around in circles for almost an hour and wonders if he's trying to make himself sick.  Calvin mumbles something about playing "bus" next time.
  characters: [calvin, mom]
"19870330":
  transcript: So Calvin, what's it like to be a tiger now? Kinda fuzzy, but not that different. So! What do you want to talk about? Do we eat soon?
  description: Hobbes asks Calvin what it's like to be a tiger.  Calvin replies that it's kinda fuzzy, but not much different.  They look at each other and Hobbes asks what Calvin wants to talk about.  Calvin asks if they eat soon.
  characters: [calvin, hobbes]
"19870331":
  transcript: Hi, Mom! Will you make Hobbes and me a big tuna sandwich? I thought you hated tuna fish. Not anymore. I'm a tiger now. I thought Hobbes was your tiger. Now I'm one too. I transmogrified. Oh, I see. My, she's taking this well, but the strain will surely crack her soon.
  description: Calvin comes into the kitchen and asks Mom if she'll make him and Hobbes a tuna fish sandwich.  Mom says she thought Calvin didn't like tuna fish.  Calvin tells her that he does now, because he's a tiger.  Mom asks if Hobbes is a tiger. Calvin says yes, and he is since he transmogrified.  Mom understands.  Calvin, the tiger, thinks she's bearing up well under the strain but that she'll crack soon.
  characters: [calvin, mom]
"19870401":
  transcript: I'm home! Hi Dad. Notice anything different about me? Uh ... new haircut? Geez, did you go blind?? I'm a tiger! Oh, I thought you meant besides that. Calvin, your Dad's very tired and ... Hope you want tuna for dinner dear.
  description: Dad comes home, and Calvin asks if he notices anything different about him.  Dad guesses a new haircut. Calvin asks if he went blind.  Calvin says he's a tiger.  Dad says he thought Calvin meant BESIDES him being a tiger.  He then tells Calvin he's tired, as Mom yells from the kitchen that she hopes Dad wants tuna for dinner.
  characters: [calvin, mom, dad]
"19870402":
  transcript: Well Hobbes, it's been fun, but I don't think I was meant to be a tiger. Just set the dial to "Calvin" and I'll transmogrify back to a boy. Here you go. Zap! Oops! Try again lunkhead.
  description: Calvin decides he wasn't meant to be a tiger, so he is going to change back.  He has Hobbes set the switch to turn him back to "Calvin" and ZAP!  As Hobbes says "OOPS!", Calvin comes out from the box looking like a frog.  He tells Hobbes to "try again, lunkhead".
  characters: [calvin, hobbes]
"19870403":
  transcript: Here I am, back being Calvin. Your machine works amazingly well. It's my own design. What will you do with it now? Good question. ... although I suppose we could turn Susie into a bowl of chowder if we could just get her into the machine. Leave me out of your life's plans. You little weirdo.
  description: Calvin comes out from his box looking himself. Hobbes compliments him on how well his machine works. They're trying to decide what to do with it next.  As Susie walks by, Calvin says he could turn her into a bowl of chowder if he could just get her into the machine.  Susie will have no part of it, though.  She tells Calvin to leave her out of his life's plans.
  characters: [calvin, hobbes, susie]
"19870404":
  transcript: Calvin eats one bite too many! He begins to swell! Inflating like a raft. He grows bigger and bigger! Oh, no! how much larger can he get? Ooooh, I think I'm going to explode. No wonder! I've never seen anyone eat so much in one sitting! I hope you learned your lesson.
  description: Calvin eats one too many bites of food at the dinner table and begins to swell.  He gets bigger and bigger.  He wonders how much larger he can get.  He thinks he's going to explode.  Mom tells him she's never seen anyone eat so much at one sitting.  She hopes he's learned his lesson.
  characters: [calvin, mom]
"19870405":
  transcript: Look, Jane. See Spot. See Spot run. Run, Spot run. Jane sees Spot run. Way to go, Jane! Boy I hate homework. Yahh! Whoop! Hey! Yow! Whoa! Stop! Aaaughh!! Gaackk! Help! Help! Whap!! Bonk! Bonk! What on earth are you doing? Where's your homework? I couldn't concentrate.
  description: Calvin is sitting at his desk complaining about his homework.  Suddenly, his chair takes off running around the room.  It stops and ejects Calvin onto his bed, where his blanket grabs him.  It whips him off into the hallway, where Calvin bounces down the stairs.  He dizzily walks along.  Mom asks what he's doing and where his homework is.  Calvin loopily replies he couldn't concentrate.
  characters: [calvin, mom]
"19870406":
  transcript: Rrinnggg! Recess is over! Rrripp! Oh no! why is it you always rip your pants on the day everyone has to demonstrate a math problem at the chalkboard?
  description: Calvin is on the school swing.  The bell rings, and recess is over.  As he hops off the swing, his pants get caught.  The back of his pants is all torn up.  Calvin wonders why you always rip your pants on the day everyone has to demonstrate a math problem at the chalkboard.
  characters: [calvin]
"19870407":
  transcript: I can't believe I ripped my pants! Recess is over. I'm supposed to be back in class! I can't go in like this! What am I going to do?? ... of all the days to wear the underpants with little rocket ships.
  description: Calvin looks at the back of his pants.  He can't believe he ripped them.  He knows he's supposed to be back in class.  He wonders what he'll do.  Then he remembers.  He walks off saying "of all the days to wear the underpants with the little rocket ships".
  characters: [calvin]
"19870408":
  transcript: Look at the size of this rip! Maybe I can pull my shirt down over it. No, that doesn't work. Maybe I can tuck my shirt in the hole. ... nope ... maybe I can stick the ripped part under my belt. No, that doesn't work either. Maybe I can scoot around on my rear the rest of the day.
  description: Calvin tries to pull his shirt down over the rip.  Then he tries to tuck the shirt into the hole.  No, maybe he can pull the ripped part under his belt.  That doesn't work either.  He sits down and wonders if he can scoot around on his rear the rest of the day.
  characters: [calvin]
"19870409":
  transcript: Please don't let the teacher call on me! Don't make me go to the board in my ripped pants! Anyone but me! Just let her call on someone else! Please don't embarrass me in front of the whole class! Calvin, would you do the next problem at the board? So much for my ever joining the clergy.
  description: Calvin sits at his school desk, begging not to have to go in front of the class.  He clasps his hands together praying that Miss Wormwood call on someone else.  He begs for her not to embarrass him.  Miss Wormwood calls on Calvin to go to the board.  Calvin says so much for his ever joining the clergy.
  characters: [calvin, wormwood]
"19870410":
  transcript: Calvin, will you do the next problem at the board please? No. why not? Frankly, I'd rather not say. Oh, you wouldn't. It's a personal matter. You're going to have to do better than that. Do the words "complete pandemonium" strike terror in your heart?
  description: Miss Wormwood asks Calvin if he'll show the next problem on the board.  He says no and stays in his seat. Miss Wormwood asks him why not, and Calvin replies he'd rather not say.  He says it's a personal matter.  She says he'll have to do better than that.  Calvin asks if the words "complete pandemonium" strike terror into her heart.
  characters: [calvin, wormwood]
"19870411":
  transcript: So your teacher didn't know you'd ripped your pants, and she made you do a problem at the chalkboard? That sums it up. How awful! What did you do?? I didn't have a choice. I mooned the whole class. That's why you're home early? Three teachers and the principal couldn't restore order.
  description: Hobbes is talking to Calvin.  He asks for clarification that Miss Wormwood didn't know he had ripped his pants, so she called on him to go to the board.  Calvin says that's right, and Hobbes asks what he did.  Calvin says he didn't have a choice, so he mooned the whole class.  Hobbes asks if that's why he's home early.  Calvin says that three teachers and the principal couldn't restore order.
  characters: [calvin, hobbes]
"19870412":
  transcript: During emergency landing, replace dinner tray and bring seat to upright position. Extinguish all smoking materials. Including spacecraft, if possible. Out of fuel, the courageous Spaceman Spiff is forced to land on the distant planet Zok! The valiant explorer surveys the Zokkian landscape, who knows what dangers lie hidden in the cratered terrain? Undaunted, Spiff sets out to find help! Miles later, it is evident the planet is completely uninhabited! Our hero is marooned on a lifeless planet! Alone on an alien world. Alone ... all alone ... Darn it, why doesn't anyone ever tell me when the lunch bell rings?
  description: Spaceman Spiff is forced to land on planet Zok.  He surveys the landscape and goes for help.  It's obvious the planet is uninhabited.  Spiff is marooned on a lifeless planet.  Calvin looks around his classroom and sees all the empty desks. As he runs out, he wonders why no one tells him when the lunch bell rings.
  characters: [calvin, spiff]
"19870413":
  transcript: Susie, where's Miss Wormwood? Who's that lady at her desk? Miss Wormwoods sick. That's our substitute teacher. A substitute? Let's see your teaching certificate, lady!
  description: Calvin asks Susie who's sitting at Miss Wormwood's desk.  Susie tells him that Miss Wormwood is sick, and they have a substitute teacher.  Calvin yells that he wants to see her teaching certificate.
  characters: [calvin, susie]
"19870414":
  transcript: Good morning, class. I'll be your substitute teacher today. Miss Wormwood left me instructions as to what we need to go over, so we shouldn't have any problems. Oh, wait, here's a note she added. Just a second. Ok, which one of you is Calvin? Not me!
  description: The substitute teacher introduces herself to the class.  She mentions that Miss Wormwood left instructions about what they had to go over so there wouldn't be problems.  She notices a note that Miss Wormwood left.  She asks which student is Calvin.  He yells out "Not me".
  characters: [calvin]
"19870415":
  transcript: We had a substitute teacher in school today. Did you like her? she was ok, I guess. You guess? It's hard to say. She went home at noon.
  description: Calvin tells Hobbes he had a substitute teacher at school.  Hobbes asks if he liked her, and Calvin says he guesses so.  Hobbes wonders why he "guesses".  Calvin says it's hard to tell, since she went home at noon.
  characters: [calvin, hobbes]
"19870416":
  transcript: Mr. Jones lives 50 miles away from you. You both leave home at 5:00 and drive toward each other. Mr. Jones travels at 35 mph, and you drive at 40 mph. At what time will you pass Mr. Jones on the road? Given the traffic around here at 5:00 who knows? I always catch these trick questions.
  description: Calvin is reading a word problem.  It asks about Mr. Jones living 50 miles away, both of you leaving home at 5:00 and driving toward each other.  It lists the speeds Mr. Jones and you are traveling.  It asks at what time will you and Mr. Jones pass each other on the road.  Calvin replies that given the traffic around there at 5:00, who knows?  He says he always catches those trick questions.
  characters: [calvin]
"19870417":
  transcript: I've got a scheme to get us some money. Oh boy. See? I sneaked all these kernels of corn off my dinner plate tonight. How is that going to get us money? Easy. I just stick them under my pillow. With any luck, the tooth fairy won't know they're fakes until it's too late!
  description: Calvin is talking to Hobbes in bed.  He tells Hobbes he has a scheme to get them some money.  Calvin shows Hobbes some corn kernels he stole off his dinner plate.  Hobbes wonders how that will get them some money.  Calvin explains that he's going to stick them under his pillow.  He figures the tooth fairy won't know they're fakes until it's too late.
  characters: [calvin, hobbes]
"19870418":
  transcript: Dad, how do people make babies? Most people just go to Sears, buy the kit, and follow the assembly instructions. I came from Sears?? No, you were a blue light special at Kmart, almost as good, and a lot cheaper. Aauughhh! Dear, what are you telling Calvin now?!
  description: Calvin asks Dad how people make babies.  Dad tells him most people go to Sears, buy the kit, and follow the assembly instructions.  Calvin is shocked that he came from Sears.  Dad consoles him by telling him he actually came as a blue light special from Kmart.  Almost as good and a lot cheaper.  Calvin yells.  Mom calls in from the other room, wondering what Dad is telling Calvin now.
  characters: [calvin, mom, dad]
"19870419":
  transcript: How come you don't put on any pajamas? Fact is, I never take them off! Did you ash your face and brush your teeth? Yep! We both did! Ok then, good night. Good night. Move over, will ya? I'm already over! You should be over there! Quit pushing fuzz-for-brains! You're on my side! Call me names will you?! Yeah! Whumpp! Yaaaaa! Oh no! Ok! Ok! You win! Phoo ... I wish you had brushed your teeth! Yecch ... I wish you had washed your face!
  description: Mom puts Calvin to bed and asks if he washed his face and brushed his teeth.  Calvin replies that both he and Hobbes did.  After Mom leaves, Calvin and Hobbes start fighting about which side of the bed each one should be on.  Calvin calls Hobbes "fuzz-for-brains".  Calvin hits Hobbes with a pillow.  Hobbes jumps up and pounces on Calvin, who ends up in Hobbes' mouth.  Calvin says Hobbes wins.  Calvin makes a face and says he wishes Hobbes had brushed his teeth.  Hobbes makes a face and says he wishes Calvin had washed his face.
  characters: [calvin, hobbes, mom, stuffedhobbes]
"19870420":
  transcript: I've got to give a 5-minute oral report in school on Thursday. We're supposed to research our subject, write it up, and present it to the class with a visual aid. That's a big assignment. I'll say. I hate my teacher. She knows we'll all do it on the last evening, but she gave us three days to worry about it.
  description: Calvin tells Hobbes he needs to give a five minute oral report in school on Thursday.  Calvin explains they're supposed to research the subject, write it up, and present it to the class with a visual aid.  Hobbes says that's a big assignment. Calvin says he hates his teacher.  He says she knows they'll all do it the last night, but she gave them three days to worry about it.
  characters: [calvin, hobbes]
"19870421":
  transcript: What's the subject of your report? The brain. What do you know about brains? Well, I saw this movie where they kept this guy's brain alive in a tank of water. Then a power surge mutated the brain, and it crawled out and terrorized the populace. That's informative. Unfortunately for my report, Mom caught me, and I didn't get to see how it ended.
  description: Hobbes asks the subject of Calvin's report.  Calvin replies "the brain".  Hobbes asks what Calvin knows about brains.  Calvin tells him he saw a movie where a guy's brain was kept alive in a tank of water.  A power surge mutated the brain, and it crawled out and terrorized the populace.  Hobbes says that's informative.  Calvin laments that unfortunately for his report, Mom caught him and he didn't get to see how it ended.
  characters: [calvin, hobbes]
"19870422":
  transcript: I've got to give my report on "The Brain" at school today. See my visual aid? I cooked some noodles and put them in a paper bag. Doesn't that look like brains? Well, I guess I'm all set. Did you write your report yet? Nah. I borrowed Mom's pocket dictionary. I'll do it on the bus.
  description: Calvin tells Hobbes he has to give his report on "the brain" at school.  He shows Hobbes his visual aid.  He cooked some noodles and put them in a paper bag.  As Calvin walks out the door, Hobbes asks if he has written his report yet.  Calvin tells him that he borrowed Mom's pocket dictionary and will write it on the bus.
  characters: [calvin, hobbes]
"19870423":
  transcript: My five-minute report on "The Brain." Of course it's difficult to explain the complexities of the brain in just five minutes, but to begin, the brain is part of the central nervous system. I'll pause for a few moments, so you can all finish writing that down. Calvin!
  description: Calvin is in front of his class starting his report.  He explains it will be difficult to explain the complexities of the brain in five minutes, but he starts with saying it's a part of the central nervous system.  He looks at his wrist watch, then says he'll wait a few moments so they can finish writing that down.  The teacher yells his name.
  characters: [calvin, wormwood]
"19870424":
  transcript: Pow! Jab! Kick! Pow! Pow! Rattatattattatta rattatattatta eeeeeeeeeee boom! Please, please, pretty please? No. you should've save some of your own Halloween candy.
  description: Hobbes is eating something out of a bag.  Calvin is pretending to kick and punch Hobbes.  Calvin pretends to shoot at Hobbes.  He pretends to explode a bomb next to Hobbes.  Finally, he lies on the floor begging Hobbes.  Hobbes tells him he should have saved some of his own Halloween candy.
  characters: [calvin, hobbes]
"19870425":
  transcript: Hey, can we change the channel now? I want to watch something else. My show's not over yet. Aw c'mon! you see this program all the time! Can't we watch my show for once? No, I was here first. Pipe down, this is a good part. I hate national geographic animal specials.
  description: Hobbes is sitting on the floor watching TV.  Calvin comes in and wants to change the channel.  Hobbes tells him his show isn't over yet.  Calvin replies that he always watches that program.  He wonders if they can't watch Calvin's show instead.  Hobbes tells him no, and to quiet down.  Calvin storms off grousing about how he hates National Geographic animal specials.
  characters: [calvin, hobbes]
"19870426":
  transcript: Good night, Calvin. ... all right where are you?! Calvin, I thought I said to get ready for bed! Now hurry up! I can't! I'm trapped in slow motion! Well you'd better get in normal speed ... now! Ahh! Time snap!
  description: Mom yells for Calvin to get ready for bed.  Calvin slowly heads for bed.  He says he's trapped in slow motion. Mom tells him he better get into normal speed...NOW!  Suddenly, Calvin has a time snap, and off to bed he runs.
  characters: [calvin, hobbes, mom, stuffedhobbes]
"19870427":
  transcript: Point A is twice as far from point C as point B is from A. if the distance from point B to point C is 5 inches, how far is point A from point C? The living dead don't need to solve word problems.
  description: Calvin sits staring at a word problem.  He contorts his face and rises from his chair.  As he stalks off with his arms raised out and face grimacing, Calvin says the living dead don't need to solve word problems.
  characters: [calvin]
"19870428":
  transcript: Calvin the zombie searches for food. Horribly, the undead feed upon the living! ... although, in a pinch, a pbj will do, I fyou eat it messily enough.
  description: Calvin the zombie searches for food.  He says the undead feed upon the living.  He stops to make himself a peanut butter and jelly sandwich.  He then continues to stalk around with his sandwich smeared around his face, saying that in a pinch a PBJ will do if you eat it messily enough.
  characters: [calvin]
"19870429":
  transcript: When in Rome ...
  description: Calvin stalks past Hobbes with his arms out and face contorted.  Hobbes looks at him strangely.  Hobbes makes a face and hold his arms out.  Calvin continues on.  Hobbes follows him thinking "When in Rome...".
  characters: [calvin, hobbes]
"19870430":
  transcript: Gkpthh! Heh heh ... thpkk! Hee hee. Hee hee ha ha ha ho ho hee hee hoo hoo ha ha ho heh heh ... of course. Real zombies never get the giggles by looking at each other.
  description: Calvin and Hobbes look at each other with their twisted faces and arms raised.  They start giggling at each other, then break out into laughter.  Calvin clarifies that real zombies never get the giggles by looking at each other.
  characters: [calvin, hobbes]
"19870501":
  transcript: Oh no! Too much bubble bath! Uh oh! Pop! How on earth do you do this?!? These things seem to happen.
  description: Calvin is in the bath tub.  He has too much bubble bath.  It encases him in a bubble, and he floats to the ceiling. When he hits it, the bubble pops and down he goes.  Mom comes into the bathroom and sees all the water on the floor.  She asks how he did it.  Calvin says those things just seem to happen.
  characters: [calvin, mom]
"19870502":
  transcript: Aauughhhhh
  description: Calvin is coming down the hill on his skateboard.  Hobbes is looking at a plank set up against a rock that Calvin is using for a ramp.  As Calvin reaches the plank, Hobbes jumps up on the far end.  Calvin goes sailing off into the air.
  characters: [calvin, hobbes]
"19870503":
  transcript: Gosh it's perfect kite flying weather! But why let the stupid kite have all the fun? You've got your tail on? Yep, just let out some string and start running. That's it! Faster! Faster! I'm flying! I'm fl-ooof! Ow! Ack! Ooh! Are you ok? Boy, you were almost up there. I know! (ow) We just need a little more wind. Ok, here's another breeze! Let 'er rip! Oomph! Yow! Maybe you're too heavy. Gee, I hadn't thought of that. Hmm ... how can I get lighter? Mrs. Carroll says a naked kid tied to a stuffed animal is running through her yard. You handle it, I got the little nudist out of her bird bath remember?
  description: Calvin ties himself up and Hobbes takes off running.  Calvin is trying to fly like a kite.  He crashes to the ground.  Calvin thinks they need a bit more wind.  Again he tries.  Again he crashes.  Hobbes suggests Calvin might be too heavy.  Calvin wonders what he can do to make himself lighter.  Mom answers a phone call from Mrs. Carroll.  There is a naked kid tied to a stuffed tiger is running through her yard.
  characters: [calvin, hobbes, mom, dad]
"19870504":
  transcript: We're supposed to have this whole stupid book read by tomorrow. Flip-ip-ip-ip-ip-ip! There! It's good to get that out of the way! Reading goes faster if you don't sweat comprehension. Where's the Frisbee?
  description: Calvin sits at his desk at home with a school book.  Hobbes is looking at him.  Calvin complains that he has to read the whole book by tomorrow.  Calvin flips through all the pages of the book and declares it's good to get that out of the way.  He hops down to look for his frisbee and go play.  Hobbes says that reading goes faster if you don't sweat comprehension.
  characters: [calvin, hobbes]
"19870505":
  transcript: Ahoy! Toss the rope ladder down! What's the password? Tigers are mean! Tigers are fierce! Tigers have teeth and claws that pierce! Tigers are great! They can't be beat! If I was a tiger that would be neat! He can climb the tree without the ladder, so he got to make up the password. Go on, what's the third verse?
  description: Hobbes is in the tree fort when Calvin yells up to have Hobbes toss down the rope ladder.  Hobbes asks Calvin for the password.  Calvin proclaims tigers are mean and fierce, with claws that pierce.  Tigers are great and can't be beat.  As Hobbes asks Calvin to keep going with the third verse, Calvin explains that since Hobbes can climb up the tree without the ladder, he got to make up the password.
  characters: [calvin, hobbes]
"19870506":
  transcript: Mom, when are you going shopping next? I don't know why? We seem to be out of gun powder. Sheesh, I didn't even do it yet.
  description: Mom is sitting at the table when Calvin asks when she'll next go to shopping.  Mom isn't sure and asks why he's asking.  Calvin comes out with a football helmet on and pillows wrapped in front of and behind him.  He tells Mom that they seem to be out of gunpowder.  Calvin is then sitting on his bed, without his helmet and pillows, complaining that he didn't even do it yet.
  characters: [calvin, mom]
"19870507":
  transcript: Now! Are you sure there's a career to be made as a "human discus"? Well, we gotta get a bigger field.
  description: Hobbes has Calvin by the hands and is swing him around and around.  Calvin tells him to let go.  Calvin ends up smashed into a tree.  Hobbes asks if he's sure there is a career to be made as a "human discus".  Calvin thinks they have to get a bigger field.
  characters: [calvin, hobbes]
"19870508":
  transcript: I tripped a kid yesterday, and he fell in the mud it was hilarious. Aaugh! Ploop! I dunno. That kind of humor is so broad. You didn't do it right. C'mere and give me a hand.
  description: Calvin and Hobbes are walking in the woods.  Calvin tells Hobbes that he tripped a kid yesterday and he fell in the mud.  Calvin says it was hilarious.  Hobbes then trips Calvin into a mud puddle.  Hobbes isn't sure.  He thinks that kind of humor is so broad.  Calvin asks for Hobbes' hand, saying he didn't do it right.
  characters: [calvin, hobbes]
"19870509":
  transcript: What's this? It looks gross. It's a vegetarian meal. It's good for you. Vegetarian?? Yecchh! I'm not a vegetarian! I'm a dessertarian.
  description: Mom gives Calvin his dinner plate, and Calvin thinks it looks gross.  Mom says it's a vegetarian meal and is good for him.  He makes a face and pushes the plate away.  He says he's not a vegetarian.  He says he's a dessertarian.
  characters: [calvin, mom]
"19870510":
  transcript: Ever notice how different the air smells after a good rain? It smells like ... like ... dead worms! Wow! Look at the size of that puddle! Wahoooo! Ha ha ha ha ha! Sploosh splash sploosh splash! Hee hee hee hee! Ha ha ha ha! Rats, my underwear's all soaked. Now it's gonna itch and ride up my rear all afternoon. Well it was worth it! That's why I never wear the stuff.
  description: Calvin and Hobbes come to a big puddle.  They jump in and splash around.  They laugh and splash some more.  As they walk off, Calvin notes that his underwear is soaked.  It's going to itch and ride up his rear all afternoon.  He says it was worth it.  Hobbes says that's why he never wears the stuff.
  characters: [calvin, hobbes]
"19870511":
  transcript: I can't get this stupid hair to comb right. See how it sticks out in back? Maybe you need a haircut. Yeah, but barbers never cut it the way I want. Boy, what a great idea! Thanks! This is easy! You really think your Mom will pay me eight bucks?
