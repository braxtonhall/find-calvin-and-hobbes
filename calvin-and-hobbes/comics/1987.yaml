"19870101":
  transcript: Calvin, I hope you took your boots off before you walked across the floor. Of course I did! You don't need to tell me all the time!
  description: Calvin comes into the house tracking mud behind him.  Mom yells that she hopes he took his boots off before he walked across the floor.  Calvin takes his boots off, leaving them on the floor.  He yells back to Mom that of course he did. She doesn't have to tell him all the time.
  characters: [calvin, mom]
"19870102":
  transcript: Given any more thought to that backyard ski lift proposal of mine? Oh, yes. Lots.
  description: Calvin pulls his toboggan up the hill.  He wipes his head from the effort.  Later, when he returns home, he asks Dad if he's given any more thought to Calvin's suggestion of a backyard ski lift.
  characters: [calvin, dad]
"19870103":
  transcript: Hobbes is always a little loopy when he comes out of the dryer.
  description: Hobbes comes wobbling along, eyes wide open, body swirling.  Calvin says Hobbes is always a little loopy when he comes out of the dryer.
  characters: [calvin, hobbes]
"19870104":
  transcript: What a day! And no one to share it with! Woo hoo hoo. It's cold out there today! Brrrr! Brisk! Just the way I like it! Wow! Sniff. Ha! Weather like this lets you know you're alive! C'mon out gang! It's a perfect day! You'll get used to the wind if you keep moving! Hey, C'mon! are you guys just going to stay inside all day?!? Shut the dumb door!! Ok, ok! I was on my way back outside anyway! ... sheesh ... there's one in every house. Just how long did you know Dad before you married him?
  description: Dad comes in the house, happy about the chilly weather.  He says this weather lets you know you're alive.  He calls for Mom and Calvin to come outside.  He says it's a perfect day.  Calvin and Mom, sitting near the fireplace, yell to Dad to "Close the dumb door".  Dad goes back outside, while Calvin asks Mom just how long she knew him before they married.
  characters: [calvin, mom, dad]
"19870105":
  transcript: Watcha doin'? I'm writing my autobiography. But you're just six years old. I've only got one sheet of paper.
  description: Hobbes comes up to Calvin, who's sitting at his desk writing.  Hobbes asks what he's doing.  Calvin replies he's writing his autobiography.  When Hobbes points out that he's only six years old, Calvin points out that he only has one sheet of paper.
  characters: [calvin, hobbes]
"19870106":
  transcript: Hi, Hobbes. are you reading that book I gave you? Yes. It's very good. You like it? Sure, I think it's ... wait a minute. Would you mind writing it in two pages for me by tomorrow morning?
  description: Hobbes is lying in bed reading a book.  Calvin asks if it's the book he gave him.  Hobbes replies yes, and starts to explain why.  Calvin stops him.  He brings paper and a pencil over and asks Hobbes if he'd mind writing it in two pages for Calvin by tomorrow morning.
  characters: [calvin, hobbes]
"19870107":
  transcript: Mom, was I adopted? No, why do you ask? Are you planning to put me to work in a cannery for fourteen hours a day when I turn seven? Of course not! You're not just fattening me up to eat me, are you? Good heavens, Calvin! Who put all these ridiculous ideas in your head?!? That's right. "Ridiculous ideas" she called them. Oh, sure, you think your mom's going to tell you?
  alternate: Mom, was I genetically engineered or cloned? No, why do you ask? Are you planning to put me to work in a cannery for fourteen hours a day when I turn seven? Of course not! You're not just fattening me up to eat me, are you? Good heavens, Calvin! Who put all these ridiculous ideas in your head?!? That's right. "Ridiculous ideas" she called them. Oh, sure, you think your mom's going to tell you?
  description: Calvin asks Mom if he was adopted, and Mom says no.  Calvin then asks if she's planning on Calvin working in a cannery 14 hours a day when he's seven, and Mom says no.  He then asks if she's fattening him up so he can be eaten. Mom wants to know who put all those ridiculous ideas into his head.  Calvin tells Hobbes that Mom called them "ridiculous ideas".  Hobbes asks if Calvin thinks she'd really tell him.
  characters: [calvin, hobbes, mom]
"19870108":
  transcript: Whifffff whiff whiff whiff whiff whiff. For all that preparation you sure are a lousy shot.
  description: Susie is walking along in the snow.  A snowball flies overhead.  Suddenly, several snowballs come toward her, but none hit.  Calvin is standing in the distance next to a wheelbarrow with some snowballs in it.  Susie yells that for all the preparation, Calvin is sure a lousy shot.
  characters: [calvin, susie]
"19870109":
  transcript: Go ahead down. You'll miss all those trees. You can do it. You'll stop before you go over that ledge at the bottom. You won't go into that pond. Besides, the ice is probably real thick anyway. Go ahead down. My brain is trying to kill me.
  description: Calvin sits on the top of the snowy hill on his sled.  He's thinking that it's okay to go down the hill, he'll miss the trees.  He'll stop before he goes over the ledge at the bottom.  He won't go into the ice-covered pond.  Besides, the ice is probably really thick.  Calvin says his brain is trying to kill him.
  characters: [calvin]
"19870110":
  transcript: Galosh. Galosh. Galosh.
  description: Calvin is getting his coat and boots on to go outside.  As Calvin walks along, he hears "Galosh, galosh, galosh".
  characters: [calvin]
"19870111":
  transcript: Boy, is this hill big! We'll have a good long ride down! Provided we improve our steering. Hobbes, do you think human nature is good or evil? Watch out for those trees. I mean, do you think people are basically good, with a few bad tendencies, or basically bad, with a few good tendencies? There's a rock up ahead! Look out! Or, as a third possibility. Do you think people are just crazy, and who knows why they do anything? Not so close to the ledge! Well? What do you think? Are people good, bad or crazy? Aughh! I can't look! Wump! You know, it's very rude of you to keep changing the subject after every sentence. I choose crazy.
  description: As they come down the hill on the sled, Calvin asks Hobbes whether he thinks human nature is good or evil. Hobbes wants Calvin to watch out for the trees.  Calvin clarifies about being basically good, with bad tendencies or basically bad, with good tendencies.  Hobbes wants his to watch out for the rock.  Calvin offers a third choice, that people are basically crazy.  Hobbes thinks they're too close to the edge.  Calvin wants to know what Hobbes thinks.  Hobbes can't watch as they crash into a tree.  Calvin thinks it's rude for Hobbes to change the subject after each sentence.  Hobbes chooses crazy.
  characters: [calvin, hobbes]
"19870112":
  transcript: I called Susie a boogerbrain after school, and she went home crying. Goodness, why'd you do that? I dunno, I was just teasing. It sounds like you hurt her feelings. I didn't mean for her to take the insult personally!
  description: Calvin and Hobbes are walking through the snow.  Calvin tells Hobbes he called Susie a booger-brain at school and she went home crying.  Hobbes asks why he did that.  Calvin says he was just teasing her.  Hobbes tells Calvin that it sounds like he hurt her feelings.  Calvin says he didn't mean for Susie to take the insult personally.
  characters: [calvin, hobbes]
"19870113":
  transcript: Sniff. That stupid Calvin. What does he call me names for no reason? It's just mean. I wish I had a hundred friends. Then I wouldn't care. I'd say, "Who needs you, Calvin? I've got a hundred other friends!" Then my hundred friends and I would go do something fun, and leave Calvin all alone! Ha! ... and as long as I'm dreaming, I'd like a pony.
  description: Susie wipes a tear from her eye.  She wonders why Calvin is so mean.  She wishes she had a hundred friends, then she wouldn't care what Calvin said.  She goes on to say she and her hundred friends would go do something fun and leave Calvin all alone.  But then, Susie sits down.  She says that as long as she's dreaming, she also wants a pony.
  characters: [susie]
"19870114":
  transcript: I feel bad that I called Susie names and hurt her feelings. I'm sorry I did it. Maybe you should apologize to her. I keep hoping there's a less obvious solution.
  description: Calvin tells Hobbes he feels bad about calling Susie names and hurting her feelings.  He says he's sorry he did it.  Hobbes suggests Calvin apologize to her.  Calvin keeps hoping there's a less obvious solution.
  characters: [calvin, hobbes]
"19870115":
  transcript: Sticks and stones may break my bones. But words will never hurt me. Yeah, right.
  description: Susie walks through the snow saying "Sticks and stones may break my bones, but words will never hurt me". She walks along smiling, then drops her head down and says "Yeah, right".
  characters: [susie]
"19870116":
  transcript: Um ... hi, Susie ... I ... uh ... well ... Get lost Calvin. You're mean. Don't walk away! I'm trying to apologize, you dumb noodleloaf! Slap!
  description: Calvin walks up to Susie and haltingly starts to apologize.  Susie tells him to get lost and that he's mean.  She walks away.  Calvin yells after her that she shouldn't walk away, he's trying to apologize.  Then, he calls her a dumb noodleloaf.  He smacks himself on the forehead.
  characters: [calvin, susie]
"19870117":
  transcript: Susie, I'm sorry I called you names. I didn't mean to hurt your feelings. Well, you did hurt my feelings. But I accept your apology. Thank you. Oh boy, thank goodness I got that over with! ... on second thought, let's see you grovel a little bit!
  description: Calvin runs after Susie.  He tells her he's sorry he called her names and didn't mean to hurt your feelings.  Susie says her feelings were hurt, but that she accepts his apology.  Calvin happily runs off saying that goodness that's over with. Susie yells after him that on second thought, he should grovel a little bit.
  characters: [calvin, susie]
"19870118":
  transcript: "Should I or shouldn't I? Too late! I did. Wap! Did you throw a snowball at me?! Me? A snowball? Did someone throw a snowball at you? Oh, don't play innocent with me, you liar! I know you threw that! Call me a liar. Will you? Well, it takes one to know one, Mr. Tapioca head! Ooh! An insult! I've been maligned! I'll never speak to you again! Hmph. Promises, promises! Oh yeah? Twbbthbpthh! Yeah! Thbthbbptb! Thbppbpth! Thbbth! This is you: aggle aggle aggle! Oh yeah? This is you: gakka wakka wakka! Calvin, time to come in! leave it to mom to interrupt our repartee. ... just when I had you wriggling in the crushing grip of reason too ..."
  description: Hobbes hits Calvin with a snowball.  Calvin accuses Hobbes, who proclaims his innocence.  Calvin calls him a liar.  Hobbes replies Calvin is Mr. Tapioca Head.  Calvin has been maligned.  He promises not to speak to Hobbes again. They stick their tongues out at each other.  Calvin mocks Hobbes walking. Hobbes returns the insult by mocking Calvin.  They continue making fun of each other and making noises.  Mom yells for them to come inside.  Calvin laments Mom's interruption of their repartee.  Hobbes is sure he had Calvin wriggling in the crushing grip of reason.
  characters: [calvin, hobbes, mom]
"19870119":
  transcript: Hey, Hobbes, you got a letter. A letter? For me? Wow. I never get letters! What fun! A letter for me! I wonder who sent it? I wonder what it says? What could this possibly be? Open it and find out, you lunatic! Don't get huffy. I want to savor this.
  description: Calvin comes in with a couple envelopes and says one is for Hobbes.  Hobbes is so happy, since he never gets letters.  He looks at the envelope wondering who could have sent it and what could it be.  Calvin yells for him to open it and calls him a lunatic.  Hobbes tells him not to get huffy and that he wants to savor this.
  characters: [calvin, hobbes]
"19870120":
  transcript: Well? Well? What'd you get? It looks like an invitation. An invitation? Who'd invite you anywhere? A lot of people, that's who, buster. There's obviously been some mistake, nobody invites a tiger anywhere. You can't get the insurance. Well somebody is inviting me somewhere. I got an invitation. Who? What's it say?? Read it already!! Probably some big state dinner. I hope I can find my cummerbund.
  description: Hobbes looks at what he got in the mail.  He says it's an invitation.  Calvin wants to know who would invite him anywhere.  Calvin says no one invites a tiger because you can't get the insurance.  Hobbes says someone is inviting him. Calvin shouts for Hobbes to tell him who invited him and to read the invitation.  Hobbes figures it's probably some big state dinner.  He hopes he can find his cummerbund.
  characters: [calvin, hobbes]
"19870121":
  transcript: So what does the invitation say, you dumb hairball? Call me names, will you? I'll read it when I'm good and ready. Aargghh! Oooohh! Mpf! Ggh! Rrgghghmfmff! Ok, now I'm ready ... ahem ... "Dear Hobbes." Faster!
  description: Calvin continues to badger Hobbes about his invitation.  He asks what it says and calls Hobbes a dumb hairball.  Hobbes tells him he'll read it when he's good and ready.  Calvin burns with impatience.  Hobbes starts reading his invitation....slowly.  Calvin yells at Hobbes to read faster.
  characters: [calvin, hobbes]
"19870122":
  transcript: Well, well! It's an invitation to Susie Derkins' birthday party. How nice. Susie invited you? What about me? Does it say me too? No, it doesn't say anything about you. She must have mailed my invitation separately, she probably wanted to insure it so she'll know it didn't get lost. Sometimes those take longer. I'll have to sign for it and all. I'm sure she's taking no chances with mine. Oh wait. On the back it says, "You can bring that stupid kid you hang around with, if you must."
  description: Hobbes reads that it's an invitation to Susie Derkins' birthday party.  Calvin asks if it talks about him, and Hobbes says no.  Calvin thinks his invitation must have been sent separately.  Susie probably insured it so it wouldn't get lost. Those invitations take longer to arrive.  Calvin figures he'll have to sign for his invitation when it comes.  Hobbes notices something on the back of the invitation.  Susie wrote that Hobbes can bring "that stupid kid you hang around, if you must".
  characters: [calvin, hobbes]
"19870123":
  transcript: We get to go to a birthday party! That stupid Susie. Balloons, cake, presents ... oh boy! She won't be getting a very big present from me, that's for sure. I bet we'll play games too! It will be fun! Hmph. Maybe we'll play "Spin the Bottle"! Oh get real!
  description: Hobbes celebrates being able to go to the birthday party.  Calvin calls Susie stupid.  Hobbes talks about the balloons, cake and presents.  Calvin says Susie won't be getting a big present from him.  Hobbes figures they'll play games, too.  With a smile on his face, Hobbes suggests they might play "spin the bottle".  Calvin yells for him to "get real".
  characters: [calvin, hobbes]
"19870124":
  transcript: I'll make a list of possible gifts for Susie's birthday. What should we give her? how about a mouth full of broken teeth? That's what I'd like to give her. oh, don't be so cranky. I think we should get her a can of tuna fish. Tuna fish? Why would she want that? Well, maybe she wouldn't, and we could offer to take it back ... and borrow some bread, a little mayo ... right Hobbes.
  description: Hobbes is making out a list of gifts they could give Susie.  Calvin suggests a mouth full of broken teeth. Hobbes thinks a can of tuna fish would be better.  Calvin wonders why she'd want that.  Hobbes figures maybe she wouldn't want it, they could offer to take it back, get some mayo and bread...
  characters: [calvin, hobbes]
"19870125":
  transcript: Ha ha! Your clever little strategy has tragically backfired! Look at this jump! Watch and weep, fuzz face! That's your move, right? I get to go now, right? It's too late for you to change your mind, right? Not so fast ... my hand's still on it. Jump, jump, jump! I win! You win?!? Aaugghh! You won last time! I hate it when you win! Aarrggh! Mff! Gnnk! I hate this game! I hate the whole world!! Aghhh! What a stupid game! You must have cheated! You must have used some sneaky, underhanded mind-meld to make me lose! I hate you! I didn't want to play this idiotic game in the first place! I know you'd cheat! I knew you'd win! Oh! Ooh! Aarg! Hack pant pant. Look, it's just a game. I know. You should see me when I loose in real life!
  description: Calvin and Hobbes are playing checkers.  Hobbes makes some jumps and wins the game.  Calvin pitches a fit. He says he hates it when Hobbes wins, he hates the game, he hates the world.  Calvin goes on to accuse Hobbes of cheating, and says he didn't want to play in the first place.  Around and around he goes, yelling the whole time, until he flops down to the ground panting.  Hobbes reminds him it's just a game.  Calvin says he knows and that Hobbes should see him when he loses in real life.
  characters: [calvin, hobbes]
"19870126":
  transcript: Susie's house is the next one up. This is our last chance to not show up and have a new bike horn.
  description: Calvin and Hobbes are walking to Susie's party.  Calvin has a gift in his hands.  As they approach her home, Calvin says this is their last chance to not show up and have a new bike horn.
  characters: [calvin, hobbes]
"19870127":
  transcript: Hi, Susie. Happy birthday! Hello, Calvin. Thanks for coming. Oh, look at your stuffed tiger! He's wearing a tie! He's just adorable! Ok, you were right. Girls flip for ties. You can stop winking at me. C'mon in.
  description: Susie opens the door, and Calvin hands her the gift.  She thanks them for coming and they step inside.  She notices Hobbes is wearing a tie.  She picks him up and hugs him.  Grudgingly, Calvin tells Hobbes that he was right about girls flipping for ties and that he can stop winking at him.
  characters: [calvin, hobbes, susie, stuffedhobbes]
"19870128":
  transcript: Ok, everyone. The idea of a scavenger hunt is to bring us back as many of these items as you can in half an hour. Let's go! Quick Hobbes, what's the first item? An old license plate. Great! I saw one on the way over! C'mon! good thing I always carry a Swiss army knife. Nobody's coming, right? Is this game legal?
  description: Susie has a scavenger hunt at her party.  Off go Calvin and Hobbes for the first item, an old license plate. Calvin remembers seeing one on their way over to Susie's.  He pulls out his Swiss army knife and starts to remove the plate from a car.  Hobbes wonders if this game is legal.
  characters: [calvin, hobbes, susie]
"19870129":
  transcript: Here's a paper plate for the birthday cake, Calvin. Thank you. I hope it's good. I hate it when the birthday kid chooses something gross like coconut. You don't have to worry. It's chocolate. Oh, good. Did you see it? Hey! Who cut a piece of my cake already?! I didn't even get to blow out the candles!! It's nice and moist, too.
  description: Susie hands Calvin a paper plate for his piece of birthday cake.  Calvin whispers to Hobbes that he hopes the cake is something good and not gross like coconut.  Hobbes tells him not to worry, the cake is chocolate.  Calvin asks if he saw the cake.  Susie yells that someone cut a piece out already, and that she didn't even get to blow out the candles.  Hobbes whispers that it's nice and moist, too.
  characters: [calvin, hobbes, susie, stuffedhobbes]
"19870130":
  transcript: Glad you both could come. Thank you for the nice present. Good-bye. Mom may not want this piece of cake and ice cream we're bringing her.
  description: Susie thanks Calvin and Hobbes for coming to her party and for her gift.  Calvin and Hobbes are walking home, and Calvin stops.  He digs into his pocket while something puddles up on the ground.  He says Mom may not want the piece of cake and ice cream they're bringing her.
  characters: [calvin, hobbes, susie, stuffedhobbes]
"19870131":
  transcript: Hey! It snowed last night! Oh, boy! Look at it all! They'll have to close the schools! Snow everywhere! It must be waist deep! Unfortunately, that's a relative measure.
  description: Calvin looks out the window and sees that it snowed.  He's sure they'll have to close all the schools.  He says the snow must be waist deep.  As he stands waiting for the school bus, we see that it is waist high...his waist.  Calvin says "Unfortunately, that's a relative measure".
  characters: [calvin]
"19870201":
  transcript: Either he's playing classical music at 78 RPM, or I'm still dreaming. First thing tomorrow morning, I'm calling the orphanage.
  description: Calvin, wearing sunglasses, and Hobbes are dancing to the music.  They're swinging to the beat.  Mom sits up in bed and says that he's playing classical music at 78 rpm, or she's dreaming.  Dad says first thing in the morning, he's calling the orphanage.
  characters: [calvin, hobbes, mom, dad]
"19870202":
  transcript: What's the teacher handing out? Our report cards. Our report cards? You know, our grades. Grades? We're being graded? Of course, dummy. What did you think? Don't we even get a few practice semesters?
  description: Calvin asks Susie what the teacher is handing out.  Susie tells him it's their report cards.  Calvin asks if they're being graded.  Susie replies yes.  Calvin asks if they don't get a few practice semesters.
  characters: [calvin, susie]
"19870203":
  transcript: I brought my report card home dad. Well! Let's see it! Remember how you once told me it didn't matter what grades I got ... just as long as I tried my hardest, right? Well you could certainly be trying harder than this! So you admit you were lying?
  description: Calvin tells Dad he has his report card.  Dad asks to see it.  Calvin reminds Dad that he once said it didn't matter what grade you got, as long as you were trying your hardest.  Dad looks at the card and yells Calvin could be trying harder than this.  Calvin then asks if Dad admits to lying before.
  characters: [calvin, dad]
"19870204":
  transcript: Dad says my report card shows that not enough time is being spent on my homework. So from dinner till  bed is now designated as "homework time." I don't think that's fair! If it doesn't take that long to do, why should I have to stay in my room all that time? Yeah, can I help it I'm so fast?
  description: Calvin complains that Dad says the report card shows not enough time is spent on homework.  From now on, the time from dinner to bedtime is homework time.  Calvin says that's unfair.  He thinks if he finishes it faster than that, he shouldn't have to stay in his room.  Hobbes is sitting at the desk writing Calvin's homework.  Hobbes asks if he can help it if he's so fast.
  characters: [calvin, hobbes]
"19870205":
  transcript: Can I have some clay? Help yourself. This stuff's impossible to work with. Thanks. I've got a pretty good bowl or something going here. It started out as a phantom jet, but it sort of squashed, so now I think it's a bowl. Mmm that's very good. Yeah, I'm real pleased with it.
  description: Hobbes asks Calvin if he can have some clay.  Calvin says to help himself, and that the stuff is impossible to work with.  Calvin says he has a pretty good bowl or something going.  He says it started out as a Phantom jet, but got squashed.  So now, he thinks it's a bowl.  As he says he's proud of it, Hobbes works his clay into a tiger reaching out.  Hobbes says Calvin's bowl is very good.
  characters: [calvin, hobbes]
"19870206":
  transcript: Uh oh. There's a dinosaur in the kitchen. Well if you see Calvin anywhere, tell him it's almost time for dinner. I'd invite you, but no dinosaurs are allowed at the dinner table. Ha. Dinosaurs eat anywhere they want.
  description: Calvin comes growling into the kitchen.  Mom says there's a dinosaur in the kitchen.  She asks the dinosaur to tell Calvin it's almost time for dinner.  She mentions she would invite the dinosaur to eat, but that dinosaurs aren't allowed at the dinner table.  Calvin growls out of the kitchen into the dining room.  He thinks dinosaurs eat anywhere they want.
  characters: [calvin, mom]
"19870207":
  transcript: Let's go Calvin. Time for your bath. I'm not taking baths anymore. I hate them. Oh? And how are you going to stay clean? Easy.
  description: Mom is by the bathtub, and she yells for Calvin to come take his bath.  Calvin replies he's not taking baths anymore.  Mom asks how he's going to stay clean.  Calvin picks up the vacuum cleaner and says "Easy".
  characters: [calvin, mom]
"19870208":
  transcript: Why can't I ever find my stupid scarf? Hobbes and I are going outside Mom. This is going to be the biggest snowman ever built! People will come from miles to see our gigantic snoman! This won't go any more. It's too big to push. Ok, leave it here. I'm exhausted! Well we can't stop now! We need nine more of these! Nine more?! Sure! This is just one of his toes!
  description: Calvin and Hobbes are pushing a big snowball.  Calvin says this will be the biggest snowman ever.  He says people will come from miles to see their snowman.  Hobbes can't push the snowball anymore, so Calvin tells him to leave it there.  Hobbes says he's exhausted.  Calvin tells him he can't stop now, they need nine more.  The snowball they've been pushing has been only one of the snowman's toes.  As Hobbes walks off, we see Calvin has been stuffed into the snowball and has his head poking out the top of the snowball.
  characters: [calvin, hobbes, dad]
"19870209":
  transcript: Where's Dad? He's in the living room, making a fire. A fire! Oh boy! Oh, in the fireplace.
  description: Calvin asks Mom where Dad is.  She tells him he's in the living room, making a fire.  Calvin runs into the living room with a big smile on his face.  He stops as he sees Dad and says "Oh. In the fireplace".
  characters: [calvin, mom, dad]
"19870210":
  transcript: Wanna call that a single, or give this up?
  description: Hobbes carefully makes a snowball and throws it.  Calvin swings his bat and hits the snowball.  PIFF!  Calvin asks Hobbes if he wants to call that a single or give this up.
  characters: [calvin, hobbes]
"19870211":
  transcript: What did Calvin want with those Christmas lights? He didn't say. In that case, we'd better check.
  description: Calvin picks up a bunch of Christmas lights and goes outside.  Dad asks Mom what Calvin wanted the lights for.  Mom replies that Calvin didn't say.  Dad figures in that case, they better check.  We see the lights have been placed on the roof of the house spelling out the message "UFOs! Land here".
  characters: [calvin, mom, dad]
"19870212":
  transcript: Where do we keep all our chainsaws Mom? We don't have any chainsaws, Calvin. We don't? Not any? Nope. How am I ever going to learn how to juggle?
  description: Calvin asks Mom where they keep all their chainsaws.  Mom tells him they don't have any chainsaws.  Calvin asks if they don't have any, and Mom says no.  Calvin walks off wondering how he's ever going to learn to juggle.
  characters: [calvin, mom]
"19870213":
  transcript: The giant amoebae slides along the kitchen floor. Extending a cytoplasmic pseudopod, the protozoan engulfs a package of oatmeal cookies. Nice try. Put them back.
  description: A giant amoeba slides across the kitchen floor.  Extending a cytoplasmic pseudopod, the protozoan engulfs a package of oatmeal cookies.  Mom looks over as the cookies are being eaten.  She pulls the blanket off Calvin, telling him "Nice try. Put them back".
  characters: [calvin, mom]
"19870214":
  transcript: The majestic eagle circles slowly in the clouds. With eyes so sharp he can spot movement a mile below. He sights his prey and dives! Reaching speeds of more than 100 mph, his unwary prize will never know what hit it! Wake up Dad! It's Saturday! Zz ... wha?
  description: A majestic eagle circles in the clouds.  He spots his prey and dives.  The unwary prize won't know what hit it. Calvin is diving on top of Dad, who's lying asleep in the bed.  Calvin tells Dad to wake up, it's Saturday.
  characters: [calvin, dad]
"19870215":
  transcript: Here is success Mr. Jones. He lives an a 5 acre home in a wealthy suburb. Here is the new Mercedes in the driveway. It's anyone's guess as to how much longer Mr. Jones can meet his monthly finance charges. Here comes Mr. Jones out of his attractive suburban home. He hops in his red sports car. Off he goes to work. 80 ... 90 ... 100 miles an hour! ... along the edge of the Grand Canyon!! Suddenly his steering wheel locks and he brakes fail! He careens over the edge! Oh no! Down he goes! His only hope is to climb out the sun roof and jump! Maybe, just maybe, he can grab a branch and save himself! He unwinds the sun roof! Can he make it? No! The car explodes in mid-air propelling millions of tiny shards into the stratosphere! Kablooie! The neighbors hear the boom echoing across the canyon. They pile into a mini-van to investigate! What will happen to them?
  description: Calvin is playing with a toy car on his sofa.  Mr. Jones hops into his sports car.  He drives to work, faster and faster, along the edge of the Grand Canyon.  His steering locks and his brakes fail.  Over the edge he plummets.  Mr. Jones tries to climb out his sun roof to grab a branch in an attempt to save himself.  The car explodes in mid-air, sending millions of tiny shards into the stratosphere.  The car lies on the floor as Calvin looks at it.  Calvin puts the toy back on the sofa and starts the saga of the neighbors, who've heard the booms across the canyon.  They get in their mini-van to investigate.  Calvin wonders what will happen to them.
  characters: [calvin]
"19870216":
  transcript: Dad, did you do a mating dance when you first saw mom? A mating dance? Yeah, I saw some birds do it on TV. They went, "awk awk braau-auukkk!" yes, that's more or less how I reacted. To what, wise guy? ... think carefully.
  description: Calvin asks Dad if he did a mating dance when he met Mom.  Calvin explains he saw some birds do it on TV. Calvin shows how the birds looked, flapping his arms and making squawking noises.  Dad says that's more or less how he reacted.  Mom leans over the back of the chair Dad's sitting on and asks what he was reacting that way to.
  characters: [calvin, mom, dad]
"19870217":
  transcript: Out you go, Hobbes. into the dryer. Rrrrrr Ding! Goodness, you're a fright. Tell your mom to put some conditioner in the wash next time.
  description: Mom puts Hobbes in the clothes dryer.  Calvin waits while the dryer runs.  Finally, the bell rings and Calvin opens the dryer.  Hobbes is all frizzy.  Calvin tells him he's a fright.  Hobbes asks for Calvin to tell his Mom to put some conditioner in the wash next time.
  characters: [calvin, hobbes, mom, stuffedhobbes]
"19870218":
  transcript: I cleaned my room, Mom. And I even did it without you telling me to. Well, that was very thoughtful. Of course, this isn't going to be a habit or anything.
  description: Calvin comes down the stairs and tells Mom he cleaned his room.  He tells her he did it without her having to tell him.  She compliments him on being thoughtful.  Calvin walks away smiling, then turns around and yells that this isn't going to be a habit or anything.
  characters: [calvin, mom]
"19870219":
  transcript: How come it doesn't take you as long as Mom to vacuum the house? Maybe I'm more efficient. Maybe you don't do as good a job. Why don't you go find something to do Mr. Critic? Ok, can I take this dust ball in for show and tell tomorrow? Calvin, this dust ball is going to be our little secret, all right? Aaacck! Look at this thing! Dear, I thought you did this room!
  description: Dad is vacuuming, and Calvin asks him why it doesn't take him as long to clean as it does Mom.  Dad supposes he's more efficient.  Calvin suggests he doesn't do as good a job.  Dad asks Mr. Critic to find something to do. Calvin picks up a big dust ball and asks if he can take it to "show and tell" tomorrow.  Dad kneels next to Calvin and says this dust ball is going to be their little secret.  Mom yells from the other room.  She says she thought Dad had already done the room.
