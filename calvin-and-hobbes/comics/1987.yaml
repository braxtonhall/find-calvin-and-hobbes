"19870513":
  transcript: You made a mistake didn't you? No, I can cover it up. Cover what up? What did you do wrong? Nothing, I can't help it if your head has a funny bumps that make the scissors go screwy. Your head's gonna have "funny bumps" in a minute if you don't tell me what you did!! Oops. Hold still. Why'd you say "oops"?! what'd you do now?! Nothing. Let's try parting your hair from ear to ear.
