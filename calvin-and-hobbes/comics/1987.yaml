"19870607":
  transcript: Croquet is a gentleman's game. That's hard to believe. I've played before and I can tell you the temptation to misuse these things is awful. Hey, don't put the wickets so far apart. This is the way they're supposed to be. No it isn't, you big cheater. You're doing this because you can hit the ball harder than I can. Cheater?? Who took the lucky red ball when I wasn't looking? I got to pick first because you did last time! That's a lie! You always take the lucky red ball first! Call me a liar. Will you? Well, you're just a poop head! So there! Thbpbpthpt! Potty mouth! Potty mouth! Calvin is a potty mouth! You're asking for a toothless mouth buster! Yeah? Says you and what army? You couldn't knock the teeth out of a mosquito! Ha! Mosquito's don't even have teeth. That shows how dumb you are! Compared to you, I'm Einstein! Leggo my leg! Ow! Go stick your nose in a rubber hose, you walking flea condo! I'd say it takes one to know one bozo! Why don't you go play in the food processor! It's getting dark, Calvin. C'mon inside! Aw Mom, we're right in the middle of a croquet game!
