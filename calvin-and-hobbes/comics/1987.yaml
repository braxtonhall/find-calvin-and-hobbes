  transcript: This haircut had better look good fuzz brain. You'll love it. It's kind of "new wave". New wave? Like how? Well, sort of "punk" actually. Like a mohawk? In some places it's sort of like a mohawk. I want a mirror. You know what's the rage this year? ... hats.
