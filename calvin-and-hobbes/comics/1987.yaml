  transcript: Look Hobbes I got a magic carpet! What's so magic about it? Magic carpets fly! You can ride them! Isn't this the rug from the hallway? Up, rug! Up! Up! Hey, look! It works! Ok, rug, warp factor five! Is this legal? Do you have your registration and proof of insurance?
