"19871014":
  transcript: Let's see what you drew for art class, Susie. Well, a tidy little domestic scene. A house in a yard with flowers. How typically female. Girls think small and are preoccupied with pretty details. But boys think big! Boys think about action and accomplishment! No wonder it's men who change the world! Yeah? What did you draw? A squadron of B-1's nuking New York.
  description: Calvin asks to see what Susie drew for art class.  Calvin sees a tidy, domestic scene.  A house in a yard with flowers.  How typically female.  Calvin accuses girls of thinking small and being preoccupied with petty details.  Boys, on the other hand, think about action and accomplishment.  Calvin says it's no wonder it's men who change the world.  Susie asks what he drew.  Calvin proudly shows a squadron of B-1s nuking New York.
  characters: [calvin, susie]
"19871015":
  transcript: Mom, can Hobbes and I rent a VCR and a tape tonight? I don't think so, Calvin. It's a school night. What if we got an educational tape? Like what? Cannibal stewardess vixens unchained. Now she won't even let us go into the store. I think we'd learn a lot by watching that.
  description: Calvin asks if he and Hobbes can rent a VCR and a tape. Mom doesn't think so, it's a school night.  Calvin asks if he could if the tape was educational.  When Mom asks what tape that would be, Calvin replies "Cannibal Stewardess Vixens Unchained".  Up in his bed, Calvin complains that now Mom won't even let them into the store.  Hobbes thinks they would learn a lot by watching that movie.
  characters: [calvin, hobbes, mom]
"19871016":
  transcript: Nobody had better be sneaking up on me!! Whump! It's hard to change direction in mid-air. Buddy. I'm going to change a lot more than your direction.
  description: Calvin is playing with a toy truck.  He yells that no one better be sneaking up on him.  Then, WHUMP! Hobbes lands on Calvin.  Hobbes tells Calvin it's hard to change direction in mid-air.  Calvin threatens that he's going to change a lot more than his direction.
  characters: [calvin, hobbes]
"19871017":
  transcript: Snip. Snap. Crack. Sometimes it's good to hush up a while and let autumn stick in a few words.
  description: Calvin and Hobbes are walking along in the woods.  The twigs snap and crack under their feet.  A breeze blows up and churns some leaves.  They shuffle and crunch their way through the leaves.  Calvin says it's sometimes good to hush up a while and let autumn stick in a few words.
  characters: [calvin, hobbes]
"19871018":
  transcript: A dazed Spaceman Spiff crawls from the smoking wreckage of his ship! Our hero now regrets not buying a towing rider on his insurance policy. The courageous Spaceman Spiff has been captured by the hideous Zorgs of Planet X-13! Led through the dank corridors of the dungeon, Spiff looks in vain for an opportunity to escape! Our hero is brought before the Zorg despot! So this is the famed space explorer Spiff! I've waited a long time for this moment earthling scum! You have knowledge we need. Cooperate and we'll kill you rather painlessly. Let's dispense with the pleasantries, you twisted space crustacean. What is it you want from me? A summary of Lewis and Clarks expedition to the Pacific! Ha! Wild Zontars couldn't drag that information out of me! Do your worst! You didn't read the assignment, did you, Calvin?
  description: Spaceman Spiff has been captured by the hideous Zorgs of planet X-13.  He looks for an avenue of escape as he's led through the dungeon.  He's brought before the Zorg despot.  The leader has been waiting for this moment.  He tells Spiff he has information they want.  If Spiff cooperates, they'll kill him painlessly.  Calvin asks the twisted space crustacean what he wants.  The reply is "a summary of Lewis and Clark's expedition to the Pacific".  Calvin tells Miss Wormwood that wild Zontars couldn't drag that information out of him.  Miss Wormwood asks if he didn't read his assignment.
  characters: [calvin, wormwood, spiff]
"19871019":
  transcript: Hey, Calvin, c'mere. Shove. Ha ha ha! What a weenie! Ha ha ha! People who get nostalgic about childhood were obviously never children.
  description: Calvin is playing with a ball on the playground.  Moe comes over and pushes Calvin to the ground.  Moe walks off laughing.  Calvin says that people who are nostalgic about childhood were obviously never children.
  characters: [calvin, moe]
"19871020":
  transcript: You look down in the dumps. I am. Moe keeps knocking me down at school for no reason. He's mean just for kicks. I sure am glad you're an animal. Animals sometimes make a lot more sense than people do. ... and we're cuter too. Right, Hobbes, good point.
  description: Hobbes tells Calvin he looks down in the dumps.  Calvin explains that Moe keeps knocking him down for no reason.  Calvin tells Hobbes he's glad he's an animal.  Animals sometimes make more sense than people do.  Hobbes adds that they're cuter, too.
  characters: [calvin, hobbes]
"19871021":
  transcript: Look, Hobbes, I need you to come to school with me and show Moe a little fang ok? You don't need to kill him or anything. Just give him something to think about on the way to surgery. He usually comes after me at recess, so we'll get him then. Hey, you don't have rabies, do you? Certainly not. Rats. Well, I suppose he'd at least have to get a tetanus shot.
  description: Calvin asks Hobbes to come to school with him and show Moe a little fang.  Calvin doesn't want Hobbes to kill him, just give him something to think about on the way to surgery.  Calvin decides they should do it at recess.  He asks Hobbes if he has rabies.  Hobbes indignantly says no.  Calvin is disappointed, but he figures Moe would have to at least get a tetanus shot.
  characters: [calvin, hobbes]
"19871022":
  transcript: 'Hey, Calvin. Why''d you bring your stuffed tiger to school? It''s not a show and tell day. I know. Hobbes is going to give Moe a little "treat" today: a ride in an ambulance helicopter. Yeah? How''s he going to do that? If you have an aversion to descriptions of carnage, you probably don''t want to know. Talking with you is sort of the conversational equivalent of an out of the body experience. Don''t get to close now. I want Hobbes to stay fresh for this afternoon.'
  description: 'Susie asks Calvin why he brought his stuffed tiger to school.  Calvin tells her Hobbes is going to give Moe a "treat" today: a ride in an ambulance helicopter.  Susie asks how that will happen.  Calvin says she probably doesn''t want to know if she has an aversion to descriptions of carnage.  Susie tells him that talking with him is the conversational equivalent of an out-of-body experience.'
  characters: [calvin, hobbes, susie, stuffedhobbes]
"19871023":
  transcript: Look Calvin's got a teddy bear that's real sweet Calvin. It's a tiger you brainless invertebrate. Hey, maybe I'd like to play with your teddy! Good idea, moe. Hobbes plays kinda rough, but he's lots of fun. C'mere and take him. Why? Is the teacher watching? This is a trick, right? I'm not touching your stupid teddy, see? C'mon, I dare you! What's the matter? Are you chicken? Ha ha! Boy! You sure scared him off! You were great! Come back and call me a bear again! Yeah, you, bub!
  description: Moe comes up to Calvin in the playground and notices the "teddy bear".  Calvin corrects him about it being a tiger and calls Moe a brainless invertebrate.  Moe says maybe he'd like to play with the "teddy".  Calvin says that's a good idea.  He tells him Hobbes plays rough, but he's lots of fun.  He invites Moe to take Hobbes.  Moe, suspecting something, looks around for a teacher.  He asks if this is a trick.  He says he's not touching his "teddy".  Calvin dares him.  He calls Moe a chicken. Moe leaves.  Calvin tells Hobbes that he scared him away.  He hugs Hobbes.  Hobbes angrily yells to Moe to come call him a "bear" again.
  characters: [calvin, hobbes, moe, stuffedhobbes]
"19871024":
  transcript: I called your teacher about Moe's bullying and she said she'd put a stop to it. I'm afraid you wasted your time Mom. Moe took one look at Hobbes and just about lost his lunch! I don't think Moe will be bothering me for a while. It's not every kid who has a tiger for a best friend. ... and what lucky mom's those kids have. C'mon Hobbes, if you'll lend me a buck, I'll buy you a comic book.
  description: As Calvin enters his house, Mom tells him she called his teacher to put a stop to Moe's bullying.  Calvin tells her she wasted her time.  He tells her that when Moe saw Hobbes, he almost lost his lunch.  Calvin figures Moe will leave him alone now.  It's not every kid who has a tiger for a best friend.  Mom says "and what lucky moms those other kids have". Calvin tells Hobbes that if he'll loan Calvin a buck, he'll buy him a comic book.
  characters: [calvin, hobbes, mom, stuffedhobbes]
"19871025":
  transcript: I wish it was Saturday instead of Sunday. Any day you have to take a bath and to go to bed early isn't a day off in my book. Autumn Sundays are the worst. You can ever really enjoy Sunday's because in the back of your mind you know you have to go to school the next day. And when the leaves change color it just reminds you even more that summers over and school's just begun. Gee, I like this season best of all! The trees are like natures own fireworks display! I love the brisk air, the early evenings, the ... uh ... the ... yes, well ... hmm. Kapow! Fwoosh! Zingg! You didn't mention fresh applesauce, fuzzhead. Do you like applesauce.
  description: Calvin and Hobbes are walking in the woods.  Calvin is complaining that you can't enjoy autumn Sundays because you have to go to school the next day.  The leaves changing color remind him that summer is over and school has begun.  Hobbes likes this season best of all.  He says the leaves are like nature's fireworks.  As he continues saying how he likes the brisk air and the early evenings, he notices Calvin is fuming.  He stops talking, and they walk along silently.  Finally, Hobbes looks at the trees and describes the fireworks sounds.  Calvin angrily reaches for some apples on the ground and tells Hobbes he didn't mention fresh applesauce.  Does he like it?
  characters: [calvin, hobbes]
"19871026":
  transcript: Processed lunch meat is pretty scary. What are those little specks anyway? Lizard parts? Who knows? And this "skin." I heard it used to be made of intestine, but I think nowadays it's plastic. Of course, they dye and wax fruit so it looks better. It's like eating a candle. And Mom wonders why I'm so hungry after school. Yep, we'd probably be dead now if it wasn't for Twinkies.
  description: In the school cafeteria, Calvin tells Susie processed lunch meat is scary.  He asks what the little specks are, lizard parts?  Who knows?  He peels the "skin" off the meat and tells Susie he heard it used to be intestine, but he thinks it nowadays is plastic.  He tells her they dye and wax fruit so it looks better.  It's like eating a candle.  Calvin eats a Twinkie and says if it wasn't for those, he'd probably be dead now.  Susie puts her head down and says her mom wonders why she's so hungry after school.
  characters: [calvin, susie]
"19871027":
  transcript: Hey, Dad, your latest poll just came in. let's see what it says. Be still, my heart. Well, I'll be! Your popularity is improving! You went up 30 points! Really? Heck, no wonder! I'm reading the graph upside down. What a klutz I am! ... hope you are all packed, Dad. Don't you have some homework to do?
  description: Calvin has just receive Dad's poll results. Calvin says his popularity is up 30 points.  Dad is shocked.  Oh, Calvin was reading the graph upside down.  He hopes Dad is all packed.
  characters: [calvin, dad]
"19871028":
  transcript: I like to mess with his dreams. Zz ... cookies? For me? Why sure, back up the truck.
  description: Calvin sees Hobbes sleeping on the floor.  He brings over some cookies and waves them under Hobbes' nose. Hobbes starts mumbling in his sleep about having a truck full of cookies backed up for him.  Calvin says he likes to mess with Hobbes' dreams.
  characters: [calvin, hobbes]
"19871029":
  transcript: Buurrp! Good heavens, Calvin! What do we say after that? Must be a barge coming through! What do you say?! That sure tasted better going down than coming up! Three strikes and you're history, kiddo. Excuse me.
  description: Calvin launches a huge belch at the dinner table.  Mom asks what he says after that.  Calvin replies "Must be a barge coming through".  Mom asks again what he says.  Calvin replies "That sure tasted better going down than coming up". Mom warns him about three strikes and being out.  Calvin quietly says "Excuse me".
  characters: [calvin, mom]
"19871030":
  transcript: With ultra-sonic hearing, Stupendous Man notices a cry of distress from a distant alleyway! He leaps to the edge of the building and prepares to swoop to the rescue! Stupendous Man had not quite realized just how high up he was, however. At this altitude the winds were a little tricky, and ... Are you going, or do you need a push? Don't rush me, all right?!
  description: Stupendous Man hears a cry of distress.  He leaps to the edge of the building he's on and prepares to swoop down to the rescue.  Stupendous Man didn't realize how high the building was, or that the winds at that altitude were tricky. Calvin sits at the top of the slide.  Susie is behind him asking if he's going or needs a push.  Calvin yells for her not to push him.
  characters: [calvin, susie, stupendous]
"19871031":
  transcript: Lurch your way to the car, kid. You need a haircut.
  description: Calvin bulges an eye and hunches his shoulder.  He's changing into a hairy beast, making snarling noises.  He gets larger, with fangs and huge paws.  Mom tells Calvin to lurch his way to the car, he needs a haircut.
  characters: [calvin, mom]
"19871101":
  transcript: Your dad's working, so try not to bother him, ok? Dad, I have a question. Yes? Do people ever spontaneously combust? Uh ... not that I know of, no. That's a relief. Thanks, Dad. You're welcome. Pow! Did I fool you? If you're having trouble thinking of ways to make yourself useful. I'll give you some suggestions.
  description: Calvin asks Dad if people ever spontaneously combust.  Dad doesn't think so.  Calvin is relieved and walks off.  Dad rolls his eyes.  He keeps working, then POW!  Papers fly off his desk as he jumps out of his chair.  He angrily looks around.  Calvin has a popped balloon in his hands.  He asks Dad if he fooled him.  Dad angrily suggests he has some ideas of how Calvin could make himself useful.
  characters: [calvin, mom, dad]
"19871102":
  transcript: Think it's getting any colder out? Not really. I don't think it's gonna change. Me either. Nuts. Well, let's go in.
  description: Calvin and Hobbes are out in the rain.  Calvin asks Hobbes if he thinks it's getting colder.  Hobbes says not really.  They sit a while longer.  Calvin doesn't think it's going to change.  Hobbes agrees.  The rain continues to pour down. Calvin says they should go in.  They were sitting on the sled and toboggan at the top of the hill.
  characters: [calvin, hobbes]
"19871103":
  transcript: Whatcha doing? Counterfeiting money. It's really hard. Look at all the little lines on this bill. Think anyone will fall for your forgery? Sure. Everyone will. Ol' George has the gout I see. I said this was hard.
  description: Calvin is counterfeiting money.  He says it's really hard because of all the little lines on the bill.  Hobbes asks if he thinks anyone will fall for the forgery.  Calvin thinks everyone will.  Hobbes looks over Calvin's shoulder.  He says ol' George has the gout, he sees.  Calvin angrily yells that he said it was hard.
  characters: [calvin, hobbes]
"19871104":
  transcript: The giant whale swims toward the surface! It's massive tail pumping furiously, he gains terrifying momentum! The 35-ton behemoth breaches! He crashes into the surf with deafening impact! Calvin, you'd better not be splashing the floor, you hear me?!
  description: The giant whale swims toward the surface.  Pumping his tail, he gains momentum.  The giant breaches and crashes back into the surf.  Mom yells into the bathroom to Calvin, who's leaping from the full bathtub.  She warns him he better not be splashing the floor.
  characters: [calvin, mom]
"19871105":
  transcript: I won't eat any cereal that doesn't turn the milk purple.
  description: Calvin stirs his cereal.  He looks a the bowl.  He stirs it some more.  He tells Hobbes he won't eat any cereal that doesn't turn the milk purple.
  characters: [calvin, hobbes]
"19871106":
  transcript: The deadly tornado makes it's way across the community. The circling updraft clocks at over 200 mph! The twister searches for a trailer park! Finding one, it touches down! Debris is thrown for miles in the ensuing explosion of rushing air! When are you going to clean up this room?! It looks like a ... tornado hit it, I know.
  description: The deadly tornado crosses the community.  The updraft is 200 mph.  It searches for a trailer park.  It finds one and touches down.  Debris is blown for miles in the explosion of rushing air.  Mom sticks her head into Calvin's bedroom, where there are things lying all over.  She asks when he's going to clean his room.  It looks like a .... Calvin says "tornado hit it, I know".
  characters: [calvin, mom]
"19871107":
  transcript: Oh boy, it's Saturday!! What's going on? Why aren't there any cartoons on TV? It's just a test pattern. The TV guide says they don't start until 6:30. Heck, that's 45 minutes form now! Well, c'mon. I'll race you up and down the stairs! Why can't he ever get up like this on school days? Go break his little legs, will you honey?
  description: Calvin and Hobbes are bouncing around on the bed.  Calvin is cheering that it's Saturday.  He turns on the TV for cartoons, only to find a test pattern.  Hobbes looks at the TV Guide, which says cartoons don't start until 6:30.  Calvin says that's 45 minutes away, so he decides to race Hobbes up and down the stairs.  Mom and Dad are awake in bed.  Mom wonders why he can't get up like that on school days.  Dad suggests she go break his little legs.
  characters: [calvin, hobbes, mom, dad]
"19871108":
  transcript: Kiss Hobbes good night too, Mom. If you don't get a good night kiss, you get Kafka dreams. Sleep tight. Don't let the bedbugs bite. What's that supposed to mean? Do we have vermin in this house?? The mattress is moving! Mom! It must be a bedbug! Gaah! Legs!! It must be huge! How disgusting! Ugghh! I'll run for some bug spray! Don't let him out! I need more weight! Put your foot locker up here! What's going on up there?! It sounds like he's moving furniture! I got some raid! Lift up the mattress! Let him have it! Gosh, all that spray didn't kill him! What are we going to do?! I hear your dad coming! Maybe he can kill it! About time, Dad! He crawled back into the bed! Get a fly swatter! I'll (cough) tell you who's going to get swatted! (choke) what have you done to this room?!!
  description: Mom tells Calvin to sleep tight and not let the bedbugs bite.  After she leaves, Calvin wonders if that means they have vermin in the house.  Hobbes says the mattress is moving.  It must be a bedbug.  Calvin sees giant bug legs.  He runs for some bug spray and tells Hobbes to keep the monster bug trapped in the bed.  Hobbes is on top of the folded over mattress.  He tells Calvin to get his foot locker for more weight.  Mom and Dad are wondering what's going on upstairs.  Mom suggests it sounds like Calvin's moving furniture.  Calvin starts using the bug spray.  The spray doesn't kill it.  Hobbes hears Dad coming and suggests Dad can kill the bug.  As Dad enters the messed room with bug spray wafting everywhere, Calvin tells him it went under the bed.  He tells Dad to get a fly swatter.  Dad replies that he'll tell Calvin who's going to be swatted.
  characters: [calvin, hobbes, mom, dad, stuffedhobbes]
"19871109":
  transcript: Bad news on your campaign to stay dad, Dad. Oh? Yep. The latest poll of six-year-olds in this household shows that they don't care about issues this year. It's character that counts. So why the bad news? Who's the bimbo with you in this old picture? That bimbo is your mother! Who's a bimbo?! Pretty funky hairdo, Mom!
  description: Calvin has bad news about Dad's poll results.  The latest poll shows six-year-old kids in the house don't care about issues, they care about character.  Dad wonders why that is bad news.  Calvin pulls out a photograph and asks Dad who the bimbo is with him in his prom picture.  Dad yells that the "bimbo" is Mom.  Mom yells in from the other room wondering who is a bimbo.  Calvin tells her "pretty funky hairdo, Mom".
  characters: [calvin, mom, dad]
"19871110":
  transcript: It's the sad truth, Dad. Nobody cares about your positions on fatherhood. We just want to know about your character. If you're going to be dad here, we have to know you've never done or said anything that would reflect poorly on your judgement. I have your college yearbook here. Let's flip through it, shall we? Is this you with the keg and the "party naked" t-shirt. Give me that!
  description: Calvin tells Dad it's true.  Nobody cares about his positions on fatherhood.  They just want to know about his character.  They have to know he's never said or done anything that would reflect poorly on his judgment.  Calvin has Dad's college yearbook.  He flips through it.  Calvin shows Dad a picture.  He asks if that is Dad with the keg and the "Party Naked" T-shirt.  Dad grabs the yearbook away from Calvin, saying "Give me that".
  characters: [calvin, dad]
"19871111":
  transcript: Grandpa says the comics were a lot better years ago when newspapers printed them bigger. He says comics now are just a bunch of Xeroxed talking heads because there's no space to tell a decent story or to show any action. He thinks people should write to their newspapers and complain. Your grandpa takes the funnies pretty seriously. Yeah, mom's looking into nursing homes.
  description: Calvin is telling Hobbes that Grandpa says comics were a lot funnier years ago when they used to print them bigger.  He says comics now are just Xeroxed talking heads because there's no space to tell a decent story or show action.  He says people should write to their newspapers and complain.  Hobbes says Grandpa takes his funnies pretty seriously. Calvin says Mom is looking into nursing homes.
  characters: [calvin, hobbes]
"19871112":
  transcript: Did you read this? This TV star made over twenty million dollars last year! What would you do with twenty million bucks? Beats me. I think its ridiculous that anyone makes that kind of money. Ok. Say you only made fifteen million. Let's say eighteen.
  description: Calvin tells Hobbes that a TV star made over twenty million dollars last year.  He asks Hobbes what he'd do with that much money.  Hobbes says he doesn't know.  He thinks it's ridiculous anyone makes that kind of money.  Calvin says let's say you only made fifteen million.  Hobbes goes for eighteen.
  characters: [calvin, hobbes]
"19871113":
  transcript: Hi, Mom. Bum ba da bum bum. What's cooking. Ha ha ha ha. What's with you? I thought my life would be seem more interesting with a musical score and laugh track.
  description: Calvin walks up to Mom who's washing dishes.  He makes a drum sound, asks Mom what's cooking, then starts laughing.  Mom asks him what's with him.  Calvin tells her he thinks his life would seem more interesting with a musical score and a laugh track.
  characters: [calvin, mom]
"19871114":
  transcript: I made up a joke. A man's going for a walk, so he gets his dog and says "heel." ... and the dog looks up and says "it takes one to know one, buster!" ha ha ha. What's the matter with you? Don't you get it? Ahhh, what do tigers know about sophisticated humor, anyway? How did the dog learn to talk?
  description: Calvin tells Hobbes a joke he made up.  A man is going for a walk.  He gets his dog, and the guy says "Heel". The dog looks up and says "It takes one to know one, Buster".  Calvin laughs, Hobbes doesn't.  Calvin asks if Hobbes gets it. Calvin wonders what tigers know about sophisticated humor, anyway.  Hobbes wants to know how the dog learned to talk.
  characters: [calvin, hobbes]
"19871115":
  transcript: Go way back. I'm really gonna belt this. Keep going. Keep going. I said way back! Keep going! That dummy, he can't kick it this far. What're you doing? I'm ten yards from the goal line! Aren't you going to try and catch me?!? I could crawl on my hands and knees to make a touchdown before you'd ever get me from back there! What's the matter with you?? Oops. Do you want to keep trying for the last two yards, or just give me the ball now. I call a ten year time out to grow up some more.
  description: Hobbes kicks the football to Calvin.  He stands there while Calvin races past him toward a touchdown.  Calvin stops and yells to Hobbes.  He is ten yards from the goal line.  He wonders if Hobbes is going to try to catch him.  He taunts that he could crawl on his hands and knees to make a touchdown, and Hobbes couldn't catch him from where he's standing.  Suddenly, Calvin looks horrified.  He turns to run for a touchdown.  Hobbes crashes into Calvin and tackles him. Hobbes asks if Calvin wants to keep trying for the last two yards, or if he just wants to give Hobbes the ball now.  Calvin, smashed into the ground, calls a ten year time out to grow some more.
  characters: [calvin, hobbes]
"19871116":
  transcript: Hi, Susie. What do you have for lunch today? Don't even talk to me. I don't want to hear how disgusting you think my lunch is. My lunch is fine. Relax, I wasn't going to say a word about your lunch. Pass me some salt, will you please? Here. Thanks, slugs are so chewy before you shrivel them up.
  description: Calvin asks Susie what she has for lunch.  Susie tells him not to even talk to her.  She doesn't want to hear how disgusting he thinks her lunch is.  Calvin tells her to relax.  He wasn't going to say anything about her lunch.  He asks her to pass the salt.  He opens his sandwich and sprinkles the salt on it.  He tells her slugs are so chewy before you shrivel them up.
  characters: [calvin, susie]
"19871117":
  transcript: I'm home. I read that tigers' spinal columns are like big coiled springs! I read that their brains are like big bows of tapioca.
  description: Hobbes is poised, ready to pounce.  Calvin comes in the door saying he's home.  Hobbes crashes into him. Hobbes says that he heard tigers' spinal columns are like big coiled springs.  Calvin says he heard their brains are like big bowls of tapioca.
  characters: [calvin, hobbes]
"19871118":
  transcript: Blecchh! How long are those two gonna keep kissing? This program only lasts for an hour! Geez, look at them slobbering over each other's faces! Why would anybody do that? Do they like it? Bed time. There's a connection here, I just know it.
  description: Mom and Calvin are watching a TV show.  Calvin complains that the two people are kissing for so long.  He makes a face as he talks about them slobbering over each others' faces.  He wonders why anyone would do that.  Do they like it?  Mom carries him up to bed.  Calvin says there is a connection there, he just knows it.
  characters: [calvin, mom]
"19871119":
  transcript: Quit hogging the bed. You're way over on my side. Tough beans fuzz face. Ever thinka bout the geysers and waterfalls? Hundreds of thousands of gallons of water! Flowing, spilling, rushing, gushing, splashing. He really fights mean.
  description: Hobbes tells Calvin to quit hogging the bed.  Calvin is way over on Hobbes' side.  Calvin says tough beans. Hobbes looks angry.  He tells Calvin to think about geysers, waterfalls, water flowing, splashing, rushing.  Calvin has to head off to the bathroom.  He complains that Hobbes really fights mean.
  characters: [calvin, hobbes]
"19871120":
  transcript: Spaceman Spiff flees the despicable scum beings of planet Q-13! In a surprise maneuver, our hero turns to face the adversary! His hand tightens around the death ray trigger! It doesn't respond. Spiff reaches for the mertilizer beam, but it doesn't work either! Neither do the phospho  bombs or the mordo blasters! Nothing is working!! 1812! Gettysburg! 16 fluid ounces! I before E! Thomas Edison! Perhaps someone who has been paying attention can help out Calvin!
  description: Spaceman Spiff flees the scum beings of planet Q-13.  He turns his spaceship around to face the adversary. He tightens his grip on his death ray trigger.  It doesn't work.  He tries his mertilizer beam.  It doesn't work.  Neither does his phospho bombs nor his mordo blasters.  Nothing is working.  At his desk, Calvin is saying "1812! Gettysburg! 16 fluid ounces! I before E! Thomas Edison!"  The teacher asks if someone who has been paying attention can help Calvin.
  characters: [calvin, wormwood, spiff]
"19871121":
  transcript: I keep forgetting that five of his six ends are pointy when he lies like that.
  description: Hobbes is lying on his back sleeping.  Calvin leaps into the air to pounce on Hobbes.  Hobbes wakes up, bears his fangs and claws as Calvin descends.  Calvin tries to pull back.  He walks off all torn up and says he keeps forgetting that five of Hobbes' six ends are pointy when he lies like that.
  characters: [calvin, hobbes]
"19871122":
  transcript: If you don't hurry up, you'll miss the school bus. That's the best news I've heard today. Let's see what should I wear today? Aaugh! Now, boys! Get 'im. Help help help. Hold his arms! Grab his feet! Ok, boys, just like we planned! Striped pants polka dot shirt! Plaid jacket! Everybody on! Hey! I'm not going out like this! Get off me! Lift his legs! Make him walk! Look at you! Have you gone colorblind?? I don't want to hear about it.
  description: Calvin opens his drawer wondering what to wear that day.  Suddenly, the clothes fly out of the drawer and attack him.  They hold his arms and grab his feet.  Striped shirt, plaid jacket, polka dot shirt.  Calvin says he won't go out with those clothes on.  The clothes lift his legs and make him walk.  As Calvin walks past, Mom asks if Calvin has gone color-blind. Calvin says he doesn't want to hear about it.
  characters: [calvin, hobbes, mom, stuffedhobbes]
"19871123":
  transcript: Since September, it's just gotten colder and colder. There's less daylight now, I've noticed too. Oh no! This can mean only one thing! The sun is going out! In a few more months earth will be a dark and lifeless ball of ice! Well, gee, now I don't feel so bad about not setting up an IRA last year.
  description: Calvin tells Hobbes that since September, it's gotten colder and colder.  He's also noticed there is less daylight. He says that can only mean one thing.  The sun is going out!  In a few more months, the earth will be a dark and lifeless ball of ice.  Hobbes doesn't feel so bad about not setting up an IRA last year.
  characters: [calvin, hobbes]
"19871124":
  transcript: Dad says the sun isn't going out. He says it's colder because the earth's orbit is taking us farther from the Sun. He says winter will be here soon. Isn't it sad how some peoples grip on their lives is so precarious that they'll embrace any preposterous delusion rather than face an occasional bleak truth.
  alternate: Dad says the sun isn't going out. He says it's colder because our hemisphere is tilted away from the Sun now. He says winter will be here soon. Isn't it sad how some peoples grip on their lives is so precarious that they'll embrace any preposterous delusion rather than face an occasional bleak truth.
  description: Calvin tells Hobbes that Dad said the sun wasn't going out.  He said it's colder because the earth's orbit is taking them further from the sun.  He says winter will be here soon.  Calvin laments that some people's grip on their lives is so precarious that they embrace any preposterous delusion rather than face an occasional bleak truth.
  characters: [calvin, hobbes]
"19871125":
  transcript: Are you going to live the last few months of your life differently, now that the Sun is going out and we're all doomed? No, I've always believed in living each day as if it was my last so I never have any regrets. Kind of inspiring huh? If you were someone else it might be. Pass me that issue of Captain Napalm will you?
  description: Hobbes asks if Calvin is going to live his last few months any differently since the sun is going out.  Calvin tells him he's always believed in living each day as if it were his last, so he has no regrets.  Calvin thinks that is inspiring.  Hobbes says it would be if he were someone else.  As Calvin sits reading comic books and eating cookies, he asks Hobbes to pass the issue of Captain Napalm.
  characters: [calvin, hobbes]
"19871126":
  transcript: My teacher said the same thing Dad did. The Sun isn't going out after all! It's just getting colder because winter's coming. Dad was right all along. Imagine ol' Dad knowing something like that!
  description: Calvin says his teacher told him the same as Dad did, the sun isn't going out.  It's just getting colder because winter's coming.  Dad was right all along.  Calvin tells Hobbes to imagine ol' Dad knowing something like that.
  characters: [calvin, hobbes]
"19871127":
  transcript: What's the story you're going to read me, Dad? It doesn't have any romance in it, does it? Uh ... Edit it out if it does. I hate romance. Does it have any boring description in it? Well ... Skip it if you see any. I like my stories fast and gripping. It doesn't have a moral, does it I hate being told how to live my life. Skip the moral, too. Ok? Does his majesty prefer color pictures or black and white?
  description: Dad is getting set to read Calvin a bedtime story.  Calvin asks if it has romance in it.  He tells Dad to edit any romance out.  He asks if there is any boring description.  He tells Dad to skip it if he sees any.  He likes his stories fast and gripping.  He asks about a moral.  He doesn't like to be told how to live his life.  He tells Dad to skip the moral, too.  Dad asks if his majesty prefers color pictures, or black and white.
  characters: [calvin, dad]
"19871128":
  transcript: The mighty destroyer patrols the seas! Suddenly the ship spins out of control! It's caught in a whirlpool! Within moments the giant vessel dips it's hull into the swirling vortex and is never seen again! Oh no! Here goes the rest of the navy! Are you letting the water out already?
  description: The mighty destroyer patrols the seas.  Suddenly, the ship spins out of control.  It's caught in a whirlpool.  The vessel dips its hull into the vortex and isn't seen again.  Calvin grabs another toy ship on the bathtub and says "Here goes the rest of the Navy".  Mom yells in asking if he's letting the water out already.
  characters: [calvin, mom]
"19871129":
  transcript: Calvin, it's time to wake up. Calvin, it's time to wake up. C'mon you'll be late for school. My dreams are getting way to literal.
  description: Mom shakes Calvin and tells him it's time to wake up.  Calvin gets dressed, eats his cereal, brushes his teeth, puts on his jacket and heads out the door.  He hears Mom tell him it's time to wake up.  It was all a dream.  She tells him he'll be late for school.  As Calvin sits up in bed, he says his dreams are getting way too literal.
  characters: [calvin, mom]
"19871130":
  transcript: I'm going to be the next Houdini! Tie me to this chair and I'll escape! Tie the knots tighter, don't make it so easy for me. Tie my feet, too. All right, let's see y ou get out of that. Ha! The great Calvini can escape from anything! Calvin, dinner time! Should I tell her you're tied up at the moment, ha ha? I'll be (mmf) out of here (rrg) in no time, gosh. I can't even move.
  description: Calvin is going to be the next Houdini.  He asks Hobbes to tie him to the chair.  Calvin tells him to tie the knots tighter and to tie his feet.  Hobbes asks to see him get out of that.  The great Calvini can escape from anything.  Mom calls Calvin for dinner.  Hobbes asks if he should tell Mom he's tied up at the moment.  Calvin grunts that he'll be out in no time.  He can't even move.
  characters: [calvin, hobbes, mom]
"19871201":
  transcript: Your dinner's getting cold, Calvin! I'll be down in a second. You want me to help untie you? No! don't touch those ropes! I want to escape! It's easy. I just rock a little to loosen the knots, no ropes can hold me! Whoop! Ow!! Good thing you're doing this here before you tried it under water.
  description: Mom yells that Calvin's dinner is getting cold.  He says he'll be there in a minute.  Hobbes asks if Calvin wants him to untie him.  No, Calvin wants to escape.  He's going to rock a little to loosen the ropes.  He says no ropes can hold him. He falls over in the chair.  Hobbes says it's a good thing he's doing that here before trying it under water.
  characters: [calvin, hobbes, mom]
"19871202":
  transcript: Mmf! Gggk! It's no use. You'd better untie me I can't escape. Let's see, this end goes in here, and around over there. You know knots are pretty tricky. Hurry up. If I pull on this it should ... ahh! That's tighter! Pull the other way! The other way! Calvin, this is the last chance for dinner! Get down here! Sit tight. Ha ha! I'll get your cub scout manual. I don't believe this.
  description: Calvin gives up.  He tells Hobbes to untie him since he can't escape.  Hobbes is trying to figure out the knots. Calvin tells him to hurry up.  Hobbes pulls the rope.  Calvin hollers that Hobbes tightened it.  Mom gives Calvin a last call for dinner.  Hobbes goes to look for Calvin's Cub Scout manual.
  characters: [calvin, hobbes, mom]
"19871203":
  transcript: I always wanted to be a cub scout and get merit badges and stuff, but I hate going to meetings. Ok ok. Just read about knots, all right? Hey, look, here's a motto! I didn't know you had a motto! Wow, what fun! Live for revenge is going to be my motto if you don't get me out of this. I'll quiz you. What do you for a second degree burn? Don't flip through the book, you idiot! Untie me! Hmph, if I was in your predicament, I'd treat me with a lot more respect. Do you say you're sorry? Mff! Rrggh! Ooh! You dirty rotten stinking.
  description: Hobbes is reading the manual.  He says he always wanted to be a Scout, but hated the meetings.  Calvin tells him to read the knots section.  Hobbes notices the motto.  Calvin tells him "Live for revenge" is going to be his motto if Hobbes doesn't get him out of there.  Hobbes gives Calvin a quiz on what to do for a second-degree burn.  Calvin yells for him not to flip through the book, but to untie him.  Hobbes is indignant.  He thinks someone in Calvin's predicament should treat him with more respect.
  characters: [calvin, hobbes]
"19871204":
  transcript: Hobbes, I'm not kidding. If you don't get me loose in ten seconds ... You got yourself into this, Mr Houdini, not me. But I'm supposed to be at dinner! Mom's gonna kill me! Escape artists have a risky trade. Hey, here's morse code! Ok, I'm sorry I called you names. I said I'm sorry, right? Now untie me. Here's how you say "banana" in morse. Dash dot dot dot, dot dash ... What is that kid doing?! It sounds like a chair thumping around the room. Well, his dinner is stone cold. I hope he's happy.
  description: Calvin threatens Hobbes some more.  Hobbes reminds "Mr. Houdini" he got himself into that mess.  Calvin says Mom will kill him for not being at dinner.  Hobbes sees the section on Morse code.  Calvin says he's sorry and asks Hobbes to untie him.  Hobbes tells Calvin how to say "banana" in Morse code.  Mom and Dad hear noises upstairs.  Dad says it sound like a chair thumping around the room.  Mom says his dinner is stone cold.  She hopes he's happy.
  characters: [calvin, hobbes, mom, dad]
"19871205":
  transcript: All right, young man! You've wasted the nice meal your mom fixed. Get out here. You tied yourself up?? What on earth were you doing?! Hobbes tied me up, Dad! It's his fault. Don't make up lies, Calvin. How did you get yourself like this?! Hobbes did it Dad! He was going to hold me for ransom! Honest! Ransom?? Who'd pay for you, you big fibber?! I'm certainly glad your dad saw through that filthy lie! Oh, hush. You always get me in trouble.
  description: Dad comes up the stairs, angry at Calvin for missing dinner.  Calvin is tied up on the chair.  Calvin tells Dad that Hobbes tied him up.  Dad tells him not to tell lies and asks how he tied himself up.  Calvin repeats that Hobbes did it and was going to hold him for ransom.  After Dad leaves, Calvin rubs his sore rear end.  Hobbes tells him he's glad Dad saw through his lie.  And who would pay ransom for Calvin, anyway?
  characters: [calvin, hobbes, dad, stuffedhobbes]
"19871206":
  transcript: First there was nothing ... then there was Calvin! Calvin, the mighty god, creates the universe with pure will! Form utter nothingness comes swirling form! Life begins where once was void! But Calvin is no kind and loving god! He's one of the old gods! He demands sacrifice. Yes, Calvin is a god of the underworld! And the puny inhabitants of earth displease him! The great Calvin ignores their please for mercy and the doomed writhe in agony! Have you seen how absorbed Calvin is with those tinkertoys? He's creating whole worlds over there! I'll be he grows up to be an architect.
  description: Calvin, the mighty god, creates the universe with pure will.  Life begins where there once was void.  Calvin is no loving god, he demands sacrifice.  Calvin is a god of the underworld.  The puny inhabitants of earth displease him.  Calvin ignores their pleas for mercy, and the doomed writhe in agony.  Dad happily tells Mom that Calvin is playing with his Tinkertoys and is creating whole worlds.  Mom bets Calvin will grow up to be an architect.
  characters: [calvin, mom, dad]
"19871207":
  transcript: What's for dinner, Mom? Tortellini. Oh, no, not tortellini! I hate tortellini!! Oh, gross! Yecch! Tortellini!! Nothing is more disgusting than tortellini!! Can't we have something else? No. tortellini ... tortellini ... t - o - r ...
  description: Calvin asks Mom what's for dinner.  She tells him tortellini.  Calvin acts like he's gagging.  He grabs his throat and says he hates tortellini.  He calls it gross.  He asks Mom if they can have something else for dinner.  She says no.  Calvin goes to the dictionary to look up what tortellini is.
  characters: [calvin, mom]
"19871208":
  transcript: Did you see we have a substitute teacher today? Oh, no! that can only mean our real teacher rocketed back to Saturn to report to her superiors! They're trying to subvert us little kids with subliminal messages in our text books, telling us to turn in our parents when the Saturnians attack! Earth will be rendered helpless! I think one of us has been eating too much paste in art class. I'm to smart for them though! I don't read my assignments!
  description: Susie tells Calvin they have a substitute teacher today.  Horrified, Calvin says that must mean their real teacher rocketed back to Saturn to report to her superiors.  Calvin warns that they are trying to subvert little kids with subliminal messages in the textbooks that tell them to turn in their parents when the Saturnians attack.  The earth will be rendered helpless.  Susie thinks one of them has been eating too much paste in art class.  Calvin proudly says he's too smart for them. He doesn't read his assignments.
  characters: [calvin, susie]
"19871209":
  transcript: Behold the terrible thunder lizard, Tyrannosaurus Rex! The fiercest dinosaur of all, he is twenty tons of bone crushing muscle and razor sharp teeth! Always the victor, he lets out a triumphant roar!
  description: Behold the Tyrannosaurus Rex.  The fiercest dinosaur is twenty tons of bone-crushing muscle and razor-sharp teeth.  He lets out a triumphant roar.  Calvin is kicked out of the library.
  characters: [calvin]
"19871210":
  transcript: I juth hade it whed thith happedth.
  description: Calvin gets ready for a big sneeze.  Just before it happens, it stops.  Calvin gets an odd look on his face.  He says "I juth hade it whed thith happedth".
  characters: [calvin]
"19871211":
  transcript: Calvin the criminal is about to face justice! Angry throngs turn out to watch his execution! As he is led up the gallows, he reflects upon his many heinous crimes. He is not repentant! The noose is put around his neck and tightened! This is the end! Gackk! Urrgh! Oh, nock it off. Some of us have to wear a tie every day.
  description: Calvin, the criminal, is about to face justice.  Angry throngs turn out to watch his execution.  He's led up the gallows, and he reflects on his heinous crimes.  He is unrepentent.  The noose is placed around his neck.  This is the end. Calvin acts like he's choking as Dad tightens his necktie.  Dad tells him to knock it off.  Some people have to wear a tie every day.
  characters: [calvin, dad]
"19871212":
  transcript: How was the kiddy matinee movie? Movie? Oh, yeah, the movie. Yeah, there was a movie, it was ok I guess. How was the matinee? We are buying a video player.
  description: Dad asks Calvin how the kiddie matinee was.  Calvin vaguely remembers the movie.  He thinks it was okay. Mom comes walking in with her hair messed up and eyes looking weary.  Dad asks Mom how the matinee was.  She grabs Dad by the collar, grits her teeth, and tells him they are going to buy a video player.
  characters: [calvin, mom, dad]
"19871213":
  transcript: YAWN. Putt putt putt putt putt putt. Z. Scritch scratch. ZZ mmm... Rub rub rub. ZZ ...rrrr... Shoof shoof shoof. ZZ ...ooo... mm... Itch itch itch itch. ZZ yow wow yow wow zz... Nkg k zz... HMMMMMM. ZZZ Z. THAT sigh ought to get me out of a few years' purgatory. Z
  description: Hobbes is curled up, sleeping contentedly.  Calvin comes up to him.  He scratches Hobbes' back, rubs his tummy, then scratches his back some more.  Hobbes lets out a contented sound and gets a big smile on his face.  Calvin figures that ought to get him out of a few years in purgatory.
  characters: [calvin, hobbes]
"19871214":
  transcript: Open your moth and close your eyes, and you'll get a big surprise. Ready? Here it ... hey! You're peeking! What's the matter? Don't you trust your own kid?! C'mon, close your eyes! Uh oh, hang on, he got away.
  description: Calvin goes up to Dad with his hands clasped.  He tells Dad to open his mouth, and close his eyes.  He's going to get a big surprise.  Dad opens his mouth, but peeks.  Calvin notices and accuses Dad of not trusting his own kid.  Calvin looks in his hands and tells Dad to hang on.  Whatever he had in his hand got away.
  characters: [calvin, dad]
"19871215":
  transcript: Anything yet? Not one snowflake.
  description: Calvin dances back and forth.  He asks Hobbes whether there is anything yet.  Hobbes looks out the window and tells him there isn't one snowflake.
  characters: [calvin, hobbes]
"19871216":
  transcript: Dear Santa. Attached is my Christmas list for this year. Last year I did not receive several items from my list. For your convenience, I have grouped those items together on page 12. Please check them carefully, and include them with the rest of my loot this year. That's the problem with this guy. He's gotten sloppy without any competition.
  description: Calvin is writing to Santa Claus.  He tells Santa he didn't get several things from his list last year.  For Santa's convenience, Calvin has grouped those items together on page 12.  Calvin asks Santa to please check them carefully and include them with the rest of this year's loot.  While Hobbes reads the note, Calvin tells him that Santa's gotten sloppy without competition.
  characters: [calvin, hobbes]
"19871217":
  transcript: "He sees when you're sleeping, he knows when you're awake. He knows if you've been bad or good, so be good for goodness sake! Click. Santa Claus: kindly old elf, or CIA spook?"
  description: Calvin listens to the radio as it plays "Santa Claus is Coming to Town".  Calvin turns the radio and offers the thought that Santa is either a kindly, old elf or a CIA spook.
  characters: [calvin]
"19871218":
  transcript: This Santa Claus stuff bothers me ... especially the judge and jury bit. Who appointed Santa? How do we know he is impartial? What criteria does he use for determining good and bad? And what about extenuating circumstances? Kids should have the benefit of legal counsel, don't you think? You're worried about the salamander incident, aren't you? Temporary insanity! That's all it was!
  description: Calvin tells Hobbes the Santa thing bothers him, especially the judge and jury bit.  Calvin wants assurances Santa is impartial.  He wonders what criteria Santa uses to determine good and bad.  He asks about extenuating circumstances.  He suggests kids should have legal counsel.  Hobbes asks if he's worried about the salamander incident.  Calvin quickly cries that was temporary insanity.
  characters: [calvin, hobbes]
"19871219":
  transcript: They say Santa knows if you've been good or bad, but what if someone had been sort of both? I mean, suppose some kid tried to be good ... at least, well most of the time. But bad things inexplicably kept happening? Suppose some kid just had terrible luck, and he got blamed for lots of things he did only sort of on purpose. Who exactly might we be talking about? This is a purely hypothetical case, Mr. Smartypants.
  description: Calvin questions what Santa does when you've been both good and bad.  He wonders what if a kid tried to do good, but bad things kept happening.  What if a kid just had terrible luck and got blamed for things he only sort of did on purpose.  Hobbes wants to know who they're talking about.  Calvin says this is just a hypothetical case.
  characters: [calvin, hobbes]
"19871220":
  transcript: Can we get this tree, Mom? Can we? I don't know Calvin. It's awfully expensive. Yeah, but just think how much loot would fit under it! Dad! Come bring in the Christmas tree Mom and I picked! It's a great one! This year I thought we'd just keep the tree in the garage. In the garage?! Sure. You can go out and look at it any time you like. And it saves all the trouble of decorating it. We're not going to decorate it?! Why bother? We just take it all down in two weeks, on Christmas day. If you get a present. If I get a present? You can take it out to the garage to open, and pretend the tree has lots of lights and ... Mommmmm! I know somebody who's going to get a lot of coal in his stocking buster. This season gets less jolly every year.
  description: Calvin excitedly tells Dad that he and Mom have picked a Christmas tree.  He tells Dad to help bring it in.  Dad tells him he thought they'd keep the tree in the garage this year.  Dad continues that you can go out and look at it, and that saves the trouble of decorating it.  Calvin can't believe they're not decorating the tree.  Dad says they take it down in two weeks, so it's not worth the bother.  He mentions that if Calvin gets a present......and Calvin is shocked to hear IF he gets A present.  Dad continues ....you can take it to the garage and pretend the tree has lots of lights.  Calvin runs off yelling for Mom. Mom points her finger into Dad's nose and tells him she knows somebody who's going to get a lump of coal in his stocking this year.  Dad comments on the season getting less jolly every year.
  characters: [calvin, mom, dad]
"19871221":
  transcript: This whole Santa Claus thing just doesn't make sense. Why all the secrecy? Why all the mystery? If the guy exists, why doesn't he ever show himself and prove it? And if he doesn't exist, what's the meaning of all this? I dunno ... isn't this a religious holiday? Yeah, but actually, I've got the same questions about God.
  description: Calvin tells Hobbes the Santa Claus thing makes no sense.  Calvin doesn't get the mystery, the secrecy.  If Santa exists, why doesn't he show himself and prove it.  If Santa doesn't exist, what's the meaning of all this.  Hobbes doesn't know, but asks if this isn't a religious holiday.  Calvin admits it is, but he says he has the same questions about God.
  characters: [calvin, hobbes]
"19871222":
  transcript: Gosh, Hobbes, what if I don't get any presents this year because I doubted the existence of Santa? Suppose he's putting my name on the bad list right now! That would be awful! Personally, I'd think that if you weren't on the bad list all along, this wouldn't push you over. Thanks for the comfort, eggnog brain. See? See why you're on the bad list? Insults!
  description: Calvin questions whether he'll get any presents since he doubted the existence of Santa Claus.  Calvin is concerned Santa might be putting his name on a "bad" list right now.  Hobbes offers that if Calvin wasn't on the "bad" list all along, doubting Santa's existence wouldn't push him over.  Calvin sarcastically thanks Hobbes for the comfort.  Hobbes pleads that this is why he's on the "bad" list...insults.
  characters: [calvin, hobbes]
"19871223":
  transcript: Well, I've decided I do believe in Santa Claus, no matter how preposterous he sounds. What convinced you? A simple risk analysis. I want presents. Lots of presents. Why risk not getting them over a matter of believe? Heck, I'll believe anything they want. How cynically enterprising of you. It's the spirit of Christmas.
  description: Calvin decides to believe in Santa Claus, no matter how preposterous he sounds.  Hobbes asks what convinced him.  Calvin replies that it was a simple risk analysis.  Calvin wants lots of presents.  Calvin thinks it he shouldn't risk getting them over a matter of belief.  He'll believe whatever they want.  Hobbes comments on how cynically enterprising that is of Calvin.  Calvin says "It's the spirit of Christmas".
  characters: [calvin, hobbes]
"19871224":
  transcript: Psst! Are you awake? Of course. I haven't heard Santa yet, have you? Do you think he's coming? It's only 11:00. We maybe later on the route. Thump? Gasp, did you hear that? It's him! It's Santa! Shh! He's saying something! Slippin' rippin' dang fang rotten zarg barg-a-ding dong! Quiet dear! Calvin will hear you!
  description: Calvin whispers to Hobbes in bed asking if he's awake.  Hobbes is.  Calvin hasn't heard Santa yet.  He wonders if he's coming.  Hobbes notes it's only 11:00.  They may be later in the route.  They hear a thump.  Hobbes says it's Santa.  He tells Calvin Santa is saying something.  Dad is jumping around holding his foot, cussing in his pain.  Mom tells him to be quiet or Calvin will hear him.
  characters: [calvin, hobbes, mom, dad]
"19871225":
  transcript: We got presents! Santa came! He came! He came! Oh, no it's not morning already? Well, technically yes ...
  description: Calvin and Hobbes tiptoe down the stairs.  They look into the living room.  They start cheering that they got presents, that Santa came.  Dad grumbles about it not being morning already.  Mom sleepily looks at the alarm clock and says that, technically, it was.
  characters: [calvin, hobbes, mom, dad]
"19871226":
  transcript: Bath time, Calvin! Come on, let's just get it over with this time all right? Where are you? Let's go! She'll never look here.
  description: Calvin hears Mom yell that it's bath time.  She yells for them to just get it over with.  She looks for Calvin. Calvin lies on the bottom of the bathtub, saying she'll never look there.
  characters: [calvin, mom]
"19871227":
  transcript: Here's a box of crayons. I need some illustrations for a story I'm writing. You can draw something besides tigers, can't you? Sure. Leopards, pumas, ocelots ... you name it. Here dad, read this story tonight. I wrote it and Hobbes illustrated it. Um, ok. The dad who lived to regret being mean to his kid. What are you pausing for? Keep reading. Barney's dad was really bad, so Barney hatched a plan. When his dad said "Eat your peas!" Barney shouted "No!" and ran. Barney tricked his mean ol' dad. And locked him in the cellar. His mom never found out where he'd gone. 'Cause Barney didn't tell her. There his dad spent his life. Eating mice and gruel. With every bite for fifty years he was sorry he'd been cruel. The end. You know how a lot of stories have morals to them? I get it, I get it!
  description: Calvin wants Dad to read a bedtime story he wrote.  The title is "The Dad Who Lived To Regret Being Mean To His Kid".  It's written in poem form.  Barney's Dad was bad, and Barney hatched a plan.  Dad said "Eat your peas". Barney said "No" and ran.  Barney tricked his Dad into the cellar.  He wasn't found by Barney's Mom, because Barney didn't tell her.  Dad had to spend his life eating mice and gruel.  With every bite for fifty years, he was sorry he'd been cruel.  Calvin suggests to Dad that many stories have morals.  Dad angrily tells Calvin he gets it.
  characters: [calvin, hobbes, dad, stuffedhobbes]
"19871228":
  transcript: What do you think is the meaning of true happiness? Is it money, cars and women? Or is it just money and cars? Well?
  description: Calvin asks Hobbes what he thinks is the true meaning of happiness.  Calvin asks if it's money, cars, and women.  Or is it just money and cars?  Hobbes walks away.
  characters: [calvin, hobbes]
"19871229":
  transcript: Look at this! You call this snow?! It's not even an inch high! What good is less than an inch of snow?! Well, it's pretty. Nobody ever closed a school on account of prettiness.
  description: Calvin looks at the small amount of snow on the ground.  He complains it isn't an inch of snow.  He asks what good less than an inch of snow is.  Hobbes says that it's pretty.  Calvin laments "Nobody ever closed a school on account of prettiness".
  characters: [calvin, hobbes]
"19871230":
  transcript: This will be the strongest snow fort ever made! Keep packing on snow. This will be indestructible. We'll pour water on it, so it freezes overnight. That way our fort will be here until July! Where's that kid?!
  description: Calvin is building a snow fortress.  He says it will be the strongest ever.  He tells Hobbes to keep packing in on.  The fort will be indestructible.  He suggests pouring water over it so it freezes overnight.  Their fort will be there until July. The next morning, Dad opens the garage door to back the car out and notices a wall of frozen snow running all across the yard, running right across the driveway.  He yells "Where's that kid?!".
  characters: [calvin, hobbes, dad]
"19871231":
  transcript: This snow fort can repel any attack! I hate this neighborhood.
  description: From behind his snow fort, Calvin declares the fort can repel any attack.  He ducks down, then stands up and leans on the fort.  No one is attacking.  He puts his hand on the side of his head and laments that he hates this neighborhood.
  characters: [calvin]
