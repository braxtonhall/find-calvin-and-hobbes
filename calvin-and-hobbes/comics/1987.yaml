"19870913":
  transcript: Wipe that grin off your face! Well, Hobbes. How do I look? I'm doing my best to bite my tongue. I cut out construction paper feathers and taped them on my arms so I can fly! Pretty neat huh? If paper feathers are all it takes to fly, don't you think we'd have heard about it before? It takes an uncommon mind to think of these things, Hobbes. I'd agree with that. Here's a gorge. This is a good spot. You're going to jump off this ledge? Heck no! I need momentum! I want you to toss me over. You understand I assume no responsibility for this? Heave! I'm flying. I'm flying! I'm uh oh. Don't sell the bike shop Orville. Shuh up and go get me some antiseptic.
