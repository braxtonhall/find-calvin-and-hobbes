"19870517":
  transcript: This is supposed to be great art. ... so why does it look like a bunch of decapitated naked people? A strange feeling comes over Calvin in the art museum. His parents, engrossed in culture, remain blissfully unaware of Calvin's terrible transformation! Yes, a tyrannosaurus is loose in the art museum! The curator shrieks and pandemonium ensues! A guard reaches for his pistol, but the dinosaur is upon him and he is messily devoured! The giant lizard's glory is captured forever on film by the anti-theft cameras! Patrons of the arts flee for their lives! Hundreds of priceless paintings are ripped to shreds in the awful rampage! Wealthy benefactors are trampled! The museum is in ruins! On to symphony hall!! Calvin? Calvin? Were in the next room now. C'mon. I think we'd better get him out o fhere. He had that grin again. I wanna see dinosaurs at the natural history museum again. We spent all afternoon there, Calvin.
  description: Calvin is at the museum.  He transforms into a dinosaur.  A tyrannosaurus is loose in the museum.  Panic ensues.  A guard reaches for his gun, but is messily devoured.  Patrons of the arts flee for their lives.  Priceless paintings are ripped to shreds, wealthy benefactors trampled, and the museum is in ruins.  Dad tells Calvin they're in the other room now and to join them.  Calvin has a sinister grin on his face.  Dad tells Mom they better get him out of there, he has that grin again.  Calvin wants to see the dinosaurs at the natural history museum.  Mom tells him they spent all afternoon there.
  characters: [calvin, mom, dad]
"19870518":
  transcript: Take your hat off at the dinner table, Calvin. Here comes the hurricane. You cut your hair!! No I didn't Hobbes did. Why on earth did you cut your own hair?! Look at you! I said Hobbes cut it! You think I'd do this?? Well I didn't!
  description: Mom tells Calvin to remove his hat.  He takes it off, and Mom shrieks that "You cut your hair!".  Calvin says that he didn't, but that Hobbes did.  Mom wants to know why he cut his own hair.  Calvin reiterates that Hobbes cut his hair. He asks if she thinks he'd do that to himself.  Mom gets an "of course I do" look on her face.  Calvin then yells "Well, I didn't!"
