"19870512":
  transcript: So exactly how would you like the back cut? Just trim the part that sticks out and taper it a little. Wouldn't you rather have it real short? No, just cut a little bit. Are you sure? Don't you think it should be real short? It looks like it should be real short. Are you trying to tell me something? No, I just think it should be real short. Especially, oh, right here.
