"19870515":
  transcript: Look what you did to my hair! It looks like it was cut with a weed-eater! Nothing a little tonic and combing can't fix. Get away from me, you menace! If Mom sees this, she'll blow her blood vessels! What am I going to do?? How's that? Sort of the "Lawrence of Arabia" look! Sort of the "Lobotomy Patient" look.
