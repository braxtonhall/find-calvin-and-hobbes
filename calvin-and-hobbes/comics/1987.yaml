"19870524":
  transcript: Whew! This must be the biggest hill in the state! Kind of frustrating isn't it? I wish Dad would get transferred to the Andes. Let's go down the hill and see if we can travel into the future. Go into the future? How? It's easy! All we have to do is get going real fast and we'll time-warp! Ha ha! Faster! Faster! Gosh, what do you suppose the future will be like? Who knows? Flying cars and cities built built on clouds, maybe! Just think of all the weird things we can tell people we saw! Oh boy! Hey, we're at the bottom of the hill. I didn't feel any time warp, did you? Nope. But look! It's two minutes later than when we started! We're in the future!! Hmm ... things haven't improved. I'm disappointed.
  description: Calvin is in his wagon at the top of the hill.  He tells Hobbes they should go down the hill and into the future. Hobbes asks how they'll do that.  Calvin says that it's easy.  All they have to do is go real fast and they'll time warp.  Down they go, faster and faster.  Hobbes wonders what the future will look like.  Calvin thinks flying cars and cities on clouds.  He tells Hobbes to think of the weird things they can tell people they saw.  They reach the bottom of the hill, but neither of them felt any time warp.  Calvin notices that it's two minutes later than when they started, so they did go into the future.  Hobbes looks around and says things haven't improved, and that he's disappointed.
  characters: [calvin, hobbes]
