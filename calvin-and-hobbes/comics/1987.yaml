  transcript: Hey, let's fly into the city and buzz Dad's office! Ha! Won't be be surprised when he sees us out his 20th floor window! What if he's mad that we took the hallway rug? What's to get mad about? We wiped our feet first. Yeah, but all this city mileage may hurt the resale value.
