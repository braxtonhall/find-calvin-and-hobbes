"19870619":
  transcript: Hey Dad! Look out the window! I can't believe he's just sitting in there. Why doesn't he look up? I guess he's pretty busy. Yeah, but we can't sit up here all day! Sheesh. Let's go. If he had noticed us, we could've given him a ride home. Hmph. I say let him take the smelly ol' bus if he can't even look out the window once in a while, serves him right.
