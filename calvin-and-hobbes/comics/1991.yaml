  "19950824":
    transcript: Ever notice how people always try to do two things at once? They talk on the phone while they drive, they watch TV while they eat, they listen to music while they work... People never focus on any one thing to enjoy it or do it well. You're breaking my concentration. WE focus on doing nothing at all!
