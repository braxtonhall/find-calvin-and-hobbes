  "19920718":
    transcript: "Whither goest thou, young rogue? Can there yet remain some villany thou hast not committed? Thou dost wrong me! Faith, I know not where I wander. Methings the most capricious zephyr hath more design than I. Bot lo: do not detain me. For I am resolv'd to quit this place forthwith. Ay, but hear you this, I'll soon know thy business, get thee gone, wastrel! By my troth, I am off. Holy schlaMOLY, isn't there a cop show on where they talk like real people? Shhh."
