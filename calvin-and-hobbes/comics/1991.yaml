  "19910408":
    transcript: I have an announcement. As of today, I will no longer respond to the name "Calvin". From now on, I wish to be addressed as "Calvin the Bold". Calvin the Bold? Right. That's my new name for the rest of my life. How about Calvin the deranged? Also, Calvin the Bold will being reffering to himself in the third person.
    description: Calvin tells Mom that as of today, he will no longer respond to the name "Calvin".  He wishes to be addressed as "Calvin the Bold".  He says that's the new name for the rest of his life.  She asks how about Calvin the Deranged. Calvin tells her that Calvin the Bold will begin referring to himself in the third person.
    characters: [calvin, mom]
  "19910409":
    transcript: Calvin, will you do the next problem, please? Calvin? Who?? YOU! CALVIN THE BOLD demands that he be addressed by his full title for any response. Back again, hmm, Calvin? Who?
    description: Miss Wormwood asks Calvin to do the next problem.  He just sits there.  She asks him again.  Calvin turns around, wondering who she's talking to.  Miss Wormwood yells that she wants him.  Calvin tells Miss Wormwood that Calvin the Bold demands he be addressed by his full title for any response.  In the principal's office, he asks Calvin if he's back again. Calvin looks around, wondering who he's talking to.
    characters: [calvin, wormwood, spittle]
  "19910410":
    transcript: Calvin the bold! Yes? Kneel. Huh?? What? Kneel? By the finite patience vested in me, I hereby dub thee "Mud". You may rise. My name is MUD?! Mr. Subtlety drives home another point.
    description: Dad sits on his chair and calls Calvin the Bold.  Calvin runs in.  Dad tells him to kneel.  Calvin does.  Dad says that by the finite patience vested in him, he hereby dubs Calvin "Mud".  He tells Calvin to rise.  Calvin realizes his name is mud.  He walks off, grumbling that Mr. Subtlety drives home another point.
    characters: [calvin, dad]
  "19910411":
    transcript: MOMMM What's the matter?? How do ugly things like octopuses and hairy bugs reproduce? Are they actually ATTRACTED to each other? IT'S 3AM! GO TO SLEEP! Come to think of it, I wonder how PEOPLE are attracted to each other. I'll be that's why they close their eyes when they smooch.
    description: In bed at night, Calvin yells for Mom.  When she comes to his room, he asks how ugly things like octopuses and hairy bugs reproduce.  He asks if they're attracted to each other.  She yells that it's 3 AM.  She tells him to go to sleep. Later, Calvin wonders how people are attracted to each other.  Hobbes bets that's why they close their eyes when they smooch.
    characters: [calvin, hobbes, mom]
  "19910412":
    transcript: Look at what this dumb toaster did to my toast! It didn't cook it enough the FIRST time, so I pushed it down AGAIN and now ONE side's BURNED and other OTHER's hardly singed! That toaster ruined my toast! And yet... somehow... life goes on. Beneath that larger perspective is a guy who doesn't want to spring for a new toaster.
    description: Calvin complains the toaster ruined his toast.  He says it didn't cook enough the first time, so he pushed it down again.  Now one side's burned, and the other is hardly singed.  Dad tells him that yet..somehow..life goes on.  Calvin looks at his toast.  He says beneath that larger perspective is a guy who doesn't want to spring for a new toaster.
    characters: [calvin, dad]
  "19910413":
    transcript: You know, before there was television, kids actually DID things on nice days like this. Times sure change, huh Dad? Ever notice how Dad brings up subjects he doesn't want to talk about?
    description: Calvin is watching television.  Dad says before there was television, kids actually did things on nice days. Calvin tells him times sure change.  Dad tosses Calvin out the door.  As he and Hobbes walk in the woods, Calvin asks if Hobbes has ever noticed Dad brings up subjects he doesn't want to talk about.
    characters: [calvin, hobbes, dad]
  "19910414":
    transcript: There's Venus. There's Mars. And there's Jupiter. And I'm STUCK here. On a clear night like this, you realize how incomprehensible the universe really is. I wonder what early man must have thought as he watched the skies. He'd see he was an infinitesimal part of creation, but he'd have no understanding of planets or stars or comets or anything. Imagine how big and mysterious the night would've seemed to him! I'll bet he felt very fragile and afraid, don't you think? ... Hobbes? Hobbes?? ... h-hello? Anyb-body?? AUGH! WUMP! I'll bet THAT's what he felt like! Saber-tooth tiger food! From now on I'm going to stay inside all night and watch TV.
    description: Looking at the evening sky, Calvin tells Hobbes it's clear nights like that when you realize how incomprehensibly vast the universe really is.  He wonders what early man must've thought as he watched the skies.  Calvin says he'd see he was an infinitesimal part of creation, but he'd have no understanding.  He asks Hobbes to imagine how big and mysterious the night would have seemed.  He bets he'd feel fragile and afraid.  He turns to see Hobbes is gone.  He looks around for anybody.  In the night, he sees eyes looking at him.  He is frightened.  WUMP!  Hobbes holds Calvin to the ground.  Hobbes says that's what he felt like.  Saber-tooth tiger food.  Calvin says from now on, he's staying inside at night and watching TV.
    characters: [calvin, hobbes]
    source: s-anand+seligman+miraheze
  "19910415":
    transcript: Pull me way back! More... more... more... Hold it!
    description: Calvin is on a swing.  He asks Hobbes to pull him back.  More...more...more...  Hobbes pulls the swing so far back Calvin slides off the seat and is holding on the swing ropes and dangling in the air.  He tells Hobbes to hold it.
    characters: [calvin, hobbes]
  "19910416":
    transcript: Let's say life is this square of the sidewalk. We're born at this crack and we die at that crack. Now we find ourselves somewhere inside the square, and in the process of walking out of it, suddenly we realize our time in here is fleeting. Is our quick experience here pointless? Does anything we say or do in here really matter? Have we done anything important? Have we been happy? Have we made the most of these precious footsteps??
    description: On a sidewalk, Calvin tells Hobbes to say life is the square of the sidewalk.  They're born at one crack, and they die at the other.  Now they find themselves somewhere inside the square, in the process of walking out of it.  Suddenly, they realize their time in the square is fleeting.  Is their experience pointless?  Does anything they do or say really matter?  Have they done anything important?  Have they made the most of their precious few footsteps?  That night, they are still standing on the sidewalk looking at the square.
    characters: [calvin, hobbes]
  "19910417":
    transcript: YOU'VE BEEN HITTING ROCKS IN THE HOUSE?! WHAT ON EARTH WOULD MAKE YOU DO SOMETHING LIKE THAT?! Poor genetic material? Bad guess.
    description: Mom is shocked to see Calvin hitting rocks in the house.  The lamp is broken, and Calvin is holding a bat. She angrily yells what on earth would make him do something like that.  Calvin suggests poor genetic material.  In bed, he decides that was a bad guess.
    characters: [calvin, mom]
  "19910418":
    transcript: Want to see a great idea in action? First you drink half of the milk in your thermos. That leaves enough room so you can wad the rest of your lunch in there. See, here goes my jelly sandwich and a banana. Let it soak for a minute, then shake it all up into sludge and choke it down! Your stomach won't know the difference, and it saves your teeth undue wear and tear! Nobody likes my great ideas in action.
    description: At lunch, Calvin asks Susie if she wants to see a great idea in action.  He drinks half the milk in his Thermos. He wads the rest of his lunch inside the Thermos.  He puts in his jelly sandwich and his banana.  He lets it soak for a minute, then he shakes it into sludge.  He says the stomach doesn't know the difference, and it saves his teeth undue wear and tear. Susie is grossed out and leaves.  Calvin says nobody likes his great ideas in action.
    characters: [calvin, susie]
  "19910419":
    transcript: I'd say I've had a pretty good life so far. In fact, looking back, I have only one regret. What's that? I regret I wasn't born with opposable toes.
    description: Calvin says he's had a pretty good life so far.  In looking back, he only has one regret.  Hobbes asks what that is.  Calvin tells him he regret he wasn't born with opposable toes.
    characters: [calvin, hobbes]
