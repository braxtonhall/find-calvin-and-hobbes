  "19920724":
    transcript: Is the coast clear? Give me a boost! What's the plan? We wait for Susie to walk underneath this tree and then we drop a water balloon on her! What if she doesn't walk by? Then we just sit in the tree all day. I love summer. The days are just PACKED!
    description: Calvin asks for Hobbes to boost him into a tree.  Calvin plans to wait for Susie to walk underneath the tree, then he'll drop a water balloon on her.  Hobbes asks what they'll do if she doesn't walk by.   Calvin says they'll just sit in the tree all day.  Hobbes loves summer.  Calvin says the days are just packed.
