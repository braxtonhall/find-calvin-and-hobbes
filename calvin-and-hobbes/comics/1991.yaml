    transcript: It's past noon! Why isn't Susie walking into our brilliant ambush?! Where is she?! You stay here and guard the water balloons. I'll go on a reconnaissance mission and find out what she's doing. Wait a minute. Why can't I go on the reconnaissance mission? Because if you get captured, you'll tell Susie anything for a tummy rub. I MIGHT not!
