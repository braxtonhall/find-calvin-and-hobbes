  "19950820":
    transcript: My Mom and my Dad are not what they seem. Their dull appearance is part of their scheme. I know of their plans. I know their techniques. My parents are outer space alien freaks! They landed on earth in spaceships humongous. Posing as grownups, they now walk among us. My parents deny this, but I know the truth. They're here to enslave me and spoil my youth. Early each morning, as the sun rises, Mom and Dad put on their earthling disguises. I knew right away their masks weren't legit. Their faces are lined - they sag and don't fit. The earth's gravity makes them sluggish and slow. They say not to run, wherever I go. They live by the clock. They're slaves to routines, They work the year 'round. They're almost machines. They deny that TV and fried food have much worth. They cannot be human. They're not of this earth. I cannot escape their alien gaze, and they're warping my mind with their alien ways. For, sinister plots, this one is a gem. They're bringing me up to turn me into them!
    description: In poem form, Calvin says Mom and Dad aren't what they seem.  They are outer space alien freaks.  They landed in spaceships humongous, now they walk among us.  He knows the truth, they're here to spoil his youth.  Each morning, as the sun rises, they put on their earthling disguises.  He knew their masks weren't legit, the faces are lined, they sag and don't fit.  They're slaves to routine, they're almost machines.  He can't escape their alien gaze, they warp his mind with their alien ways.  For sinister plots, this is a gem.  They're raising him up to turn him into them.
