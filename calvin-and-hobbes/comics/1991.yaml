  "19950221":
    transcript: I wonder why people are never content with what they have. Are you kidding? Your fingernails are a joke, you've got no fangs, you can't see at night, your pink hides are ridiculous, your reflexes are nil, and you don't even have tails! Of course people aren't content! Forget I ever said anything. Now if TIGERS weren't content, that would be something to wonder about.
