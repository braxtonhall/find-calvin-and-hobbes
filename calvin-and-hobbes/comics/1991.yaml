    source: s-anand+seligman+miraheze
  "19931025":
    transcript: Hold it, Moe! Before you wallop me, I'm afraid you'll have to sign this form. What's this? It's a statement acknowledging responsibility for your behavior. You agree that hitting me entitles me to unlimited compensation for medical treatment as well as reasonable damages for pain and suffering. You affirm that you're insured for these costs and... Nobody takes responsibility for his actions any more.
    description: As Moe readies a punch to Calvin, he says Moe has to sign a form.  Moe asks what it is, and Calvin tells him it's a statement acknowledging responsibility for his behavior.  Calvin says hitting him entitles him to compensation of medical treatment and damages for pain and suffering.  Calvin lies on the floor beaten up.  He says nobody takes responsibility for his actions anymore.
    characters: [calvin, moe]
  "19931026":
    transcript: Here, Dad. I'd like you to sign this form and have it notarized. "I, the undersigned Dad, attest that I have never parented before, and insofar as I have no experience in the job, ... ...I am liable for my mistakes, and I agree to pay for any counseling, in perpetuity, Calvin may require as a result of my parental ineptitude." I don't see how you're allowed to have a kid without signing one of those.
    description: Calvin hands a form to Dad to sign and notarize.  Dad reads the form.  It states he's never parented before and is liable for mistakes made on the job.  He will pay for any counseling Calvin may require due to parental ineptitude.  Calvin is sent to bed.  In bed, Calvin doesn't see how you're allowed to have a kid without signing one of those forms.
    characters: [calvin, dad]
  "19931027":
    transcript: Miss Wormwood, I'd like you to sign this contract. It's an agreement that you'll compensate me for any loss of job income I may suffer as an adult because of a poor first-grade eduction. If you get a poor first-grade education, it will be from YOUR lack of effort, not mine. Go back to your desk. By golly, SOMEBODY ought to may me if I don't learn anything.
    description: Calvin hands Miss Wormwood a contract.  It's an agreement to compensate Calvin for loss of job income because of his poor education.  Miss Wormwood says if he gets a poor education, it's due to a lack of effort on his part, not hers.  Calvin says somebody ought to pay him if he doesn't learn anything.
    characters: [calvin, wormwood]
  "19931028":
    transcript: Hi Susie! Would you sign this legal document? What is it? In essence, it annuls our knowledge of each other's existence and it prohibits any future social interaction. Specifically, it states that I'll never ask you out on a date, and it imposes severe penalties on any party that attempts to engage the other in conversa... It's almost insulting how fast she signed that.
    description: Calvin asks Susie to sign a document.  It annuls their knowledge of each other's existence and prohibits future social interaction.  It states Calvin will never ask her out on a date and imposes penalties for attempts to engage in conversation.  Calvin gets the form back and says it's almost insulting how fast she signed it.
    characters: [calvin, susie]
  "19931029":
    transcript: Here, Hobbes. I've drawn up a friendship contract for you to sign. A contract? Right. It codifies the terms of our friendship. You can renegotiate in 20 years. People are friends because they WANT to be, not because they HAVE to be! That's what this fixes. If your friends are contractual, you don't have any.
    description: Calvin has a contract for Hobbes.  It codifies terms of their friendship.  Hobbes can renegotiate in 20 years.  Hobbes says people are friends because they want to be, not because they have to be.  Calvin says that's what his contract fixes.  Hobbes hands the form back and says if your friends are contractual, you don't have any.
    characters: [calvin, hobbes]
  "19931030":
    transcript: Dad, why do my eyes shut when I sneeze? If your lids weren't closed, the force of the explosion would blow your eyeballs out and stretch the optic nerve, so your eyes would float around and you'd have to point them with your hands to see anything. Gross. How come you know so much? It's all in the book you get when you become a father.
    description: Calvin asks Dad why his eyes close when he sneezes.  Dad says if his eyelids weren't closed, the explosion would blow his eyeballs out.  His eyes would flop around and he'd have to point them with his hands to see anything.  Calvin asks why Dad knows so much.  Dad says it's all in the book you get when you become a father.
    characters: [calvin, dad]
  "19931031":
    transcript: Calvin, the mighty tyrannosaur, stands over his kill and roars triumphantly! The struggle to bring down his prey has given Calvin a monstrous appetite! With massive jaws twisting violently at the carcass, he rips apart gigantic chunks and swallows them whole! What a disgusting spectacle of savage gluttony! That's enough for tonight, Calvin. You're going to get sick if you eat all that. But Mom, I earned it!
    description: Calvin, the tyrannosaur, roars triumphantly.  Calvin's struggle has given him a monstrous appetite.  He rips gigantic chunks of the carcass and swallows them whole.  It's a disgusting spectacle of savage gluttony.  Mom tells Calvin to stop eating his Halloween candy.  Calvin is in a dinosaur costume.  She tells him he'll get sick if he eats all of it.  Calvin says he earned it.
    characters: [calvin, mom]
    source: s-anand+seligman+miraheze
  "19931101":
    transcript: You say, when you become a father, you get a book that explains everything in the world? Right. Can I see it? Nope, sorry. Why not? It tells what it's like to raise a kid. SO?! You're not allowed to know that until it's too late not to have one.
    description: Calvin asks if there is a book you get when you're a father that explains everything in the world.   Dad says yes but won't show it to Calvin when he asks.  Dad won't show it because it tells what it's like to raise a kid.  Calvin asks what's wrong with that.  Dad tells him he's not allowed to know that until it's too late not to have one.
    characters: [calvin, dad]
  "19931102":
    transcript: AAAAAA! A person should be safe from predators inside his own house! If I had reflexes like yours, I'd be glad for the opportunity to improve them.
    description: Hobbes waits around a corner.  Calvin approaches, then is pounces upon.  Calvin claims a person should be safe from predators inside his own house.  Hobbes says if he had reflexes like Calvin's, he'd be glad for the opportunity to improve them.
    characters: [calvin, hobbes]
  "19931103":
    transcript: HEY, LOOK AT ME! "Nude descending a staircase"! Nobody understands art.
    description: Calvin yells for Mom to watch him.  He comes down the steps, dripping water from his bath.  Calvin proclaims it "nude descending a staircase".  Back in the tub, Calvin says nobody understands art.
    characters: [calvin, hobbes, mom]
  "19931104":
    transcript: ...sighh... They say nobody lies on his deathbed wishing he'd spent more time at the office. Well, I'd better get to the office. That was obviously some sort of commentary.
    description: Dad is drinking coffee, reading the newspaper.  He says nobody lies on his deathbed wishing he'd spent more time at the office.  Calvin walks by and waves.  Dad says he'd better get to the office.  Calvin looks back and says that was obviously some sort of commentary.
    characters: [calvin, dad]
  "19931105":
    transcript: Doggone it, he's got all the covers again. Zz. Zz... hmm? Oh yes, I'm VERY fond of Calvin. ...pass the gravy, please. zzz. Brrr... Zz.
    description: In bed, Hobbes has the covers wrapped around himself.  Calvin wakes up and gets ready to reach over to pull off the covers.  Hobbes mumbles that he's very fond of Calvin and to pass the gravy.  He continues sleeping.  Calvin turns back over, shivers, but leaves the covers alone.
    characters: [calvin, hobbes]
  "19931106":
    transcript: Why should I take a bath? I'm just going to get dirty again. Why should I brush my teeth? I'm just going to eat again. Why should I comb my hair? It's just going to get messed up again. I'd rather be efficient than hygienic.
    description: Calvin asks why he should take a bath if he's just going to get dirty again.  He asks why he should brush his teeth if he's going to eat again.  He asks why he should comb his hair if it's going to get messed up again.  He decides he'd rather be efficient than hygienic.
    characters: [calvin]
  "19931107":
    transcript: If you could have anything in the world right now, what would it be? ...hmm... Anything at all! Whatever you want! A sandwich. A SANDWICH?!? WHAT KIND OF A STUPID WISH IS THAT?! Talk about a failure of imagination! I'D ask for a trillion billion dollars, my own space shuttle and a private continent. I got MY wish.
    description: Calvin asks Hobbes what he'd wish for if he could have anything in the world.  Hobbes says a sandwich.  Calvin asks what kind of stupid wish that is.  Calvin says he'd wish for a trillion dollars, a private continent, and his own space shuttle.  In the house, Hobbes is eating a sandwich.  He tells Calvin he got his wish.
    characters: [calvin, hobbes]
    source: s-anand+seligman+miraheze
  "19931108":
    transcript: Hi, it's me, your big accomplishment in life! I'm depressed.
    description: Calvin walks past Mom and says hello.  He calls himself her big accomplishment in life.  Later, Mom is slumped on the sofa.  She tells Dad that she's depressed.
    characters: [calvin, mom, dad]
  "19931109":
    transcript: Did you check the pockets of my pants before you washed them? Yes. Did you find anything... um... surprising? Like what? Let's just say we need some big gloves and a heavy stick... FAST. Do you mean you don't know where this thing IS?!
    description: Calvin asks Mom if she checked the pockets of his pants before she washed them.  He asks if she found anything surprising.  Mom asks what he means.  Calvin hides behind Mom's leg saying they need some big gloves and a heavy stick...fast.  Mom asks if Calvin doesn't even know where this thing is at.
    characters: [calvin, mom]
  "19931110":
    transcript: Oh no! Mom packed me a piece of PIE in my lunch! She hates me! I refuse to eat it! You don't like pie? Not this kind. What kind is it? Cow pie. MISS WORMWOOD! Want it? It's fresh.
    description: Calvin sees Mom packed a piece of pie in his lunch.  He refuses to eat it.  Susie asks if he doesn't like pie.  He tells her he doesn't like that kind.  When she asks what kind it is, Calvin tells her cow pie.  Susie calls for Miss Wormwood.  Calvin pinches his nose and asks if she wants it.  It's fresh.
    characters: [calvin, susie]
  "19931111":
    transcript: I wish I had a heavier coat. Theatrics notwithstanding, the thermostat stays where it is.
    description: Calvin comes into the living room bundled in his cap, scarf, and coat.  He sits on the chair.  He wishes he had a heavier coat.  Mom is reading a book.  She says that theatrics notwithstanding, the thermostat is staying where it is.
    characters: [calvin, mom]
  "19931112":
    transcript: "... and so, in 1654... HKGHHKKGHH. Mysterious planet Zartok-3 appears from... KHGHHKGGH. PAY ATTENTION! When you change the channel, I don't think the original program should be able to change it back."
    description: Miss Wormwood is lecturing the class.  The picture scrambles and mysterious planet Zartok-3 appears.  The picture scrambles again, and Miss Wormwood is right in front, pointing, and saying to pay attention.  Calvin says when you change the channel, he doesn't think the original channel should be able to change it back.
    characters: [calvin, wormwood]
  "19931113":
    transcript: Mom, what was I like as a baby? Stinky. Stinky?? Stinky. It's always shocking to see one's existence reduced to a blurb.
    description: Calvin asks what he was like as a baby.  Mom says "stinky".  Calvin walks away saying it's shocking to see one's existence reduced to a blurb.
    characters: [calvin, mom]
  "19931114":
    transcript: BBRRBBBRBB beep beep. GAAAPA! OOMP. You moved upwind, silly! Sheesh, human senses aren't worth beans. GET OFF ME, YOU PSYCHOTIC SAVAGE! Your nature program is on. Don't you want to watch it? NO!
    description: Calvin plays with a toy truck.  He stops, looks around, listens, then carries his toy further away.  He resumes playing.  Hobbes pounces on him.  Hobbes pins Calvin down telling him he moved upwind.  He says human senses aren't worth beans.  Calvin tells Hobbes to get off him.  Mom asks if Calvin wants to watch his nature program.  Calvin shouts no.
    characters: [calvin, hobbes, mom]
    source: s-anand+seligman+miraheze
  "19931115":
    transcript: I need some help with my homework, Hobbes. What's the assignment? I'm supposed to write a paper that presents both sides of an issue and then defends one of the arguments. What's your issue? That's the problem. I can't think of anything to argue. That's hard to believe. I'm always right and everybody else is always wrong! What's to argue about?!
    description: Calvin asks Hobbes for some help with his homework.  He's supposed to write a paper with two points of view, then defend one of them.  He can't think of anything to argue.  Hobbes says that's hard to believe.  Calvin says he's always right, and everybody else is wrong.  He wonders what there is to argue about.
    characters: [calvin, hobbes]
  "19931116":
    transcript: Help me think of an issue to debate for this dumb paper. Well, what issues do you care about? I don't care about issues! I've got better things to do than argue with every wrong-headed crackpot with an ignorant opinion! I'm a busy man! I say, either agree with me or take a hike! I'm right, period! End of discussion! Um... right. There, see? Everybody's happy.
    description: Calvin wants help with thinking of an issue for a debate paper.  Calvin doesn't care about issues.  He says he's got better things to do than argue with every wrong-headed crackpot with an ignorant opinion.  He says he's a busy man.  Calvin says either agree with him or take a hike.  He's right, period.  Hobbes rolls his eyes and says Calvin's right.  Calvin says everybody's happy.
    characters: [calvin, hobbes]
  "19931117":
    transcript: So what am I going to write about? Hmm... we'll need to put on our thinking caps. HEY! Thinking caps! THAT'S what we need! C'mon! This is a GREAT idea! Boy, where would I be without you? Conceivably, you might be working on your assignment.
    description: Hobbes suggests they put on thinking caps to come up with a writing topic.  As they run to get thinking caps, Calvin asks where he would be without Hobbes' suggestion.  Hobbes replies that conceivably, he might be working on his assignment.
    characters: [calvin, hobbes]
  "19931118":
    transcript: We'll use this colander for the thinking cap! Its metal surface can conduct electrical brain impulses and reflect brain waves! Next we'll need to attach those input and output strings and a grounding string. Why a grounding string? It's like a lightning rod for brainstorms... I want to keep my ideas grounded in reality. I think you're too late. We'll also need to build a transformer for the atomic cerebral enhance-o-tron.
    description: Calvin uses a colander as a thinking cap.  Its metal surface will conduct brain waves.  Hobbes attaches input and output strings, and a grounding string.  Hobbes asks why a grounding string.  Calvin replies he wants to keep his ideas grounded in reality.  Hobbes thinks he's too late.  Calvin says they also must build a transformer for the atomic cerebral enhance-o-tron.
    characters: [calvin, hobbes]
  "19931119":
    transcript: The thinking cap is all set! Let's turn it on! Click. Brzap. Did it work? I think so. I feel smarter already.
    description: Calvin's thinking cap is ready.  Hobbes turns it on.  He asks if it worked.  Calvin thinks so.  Calvin takes off the thinking cap, his hair standing on end, and says he feels smarter already.
    characters: [calvin, hobbes]
  "19931120":
    transcript: What happened to your head?? Evidently, an unanticipated physiological consequence of cerebral augmentation. My brain swelled. If your hats don't fit, will you give them to me? My powerful brain is unraveling the mysteries of the universe. It's amazing! All natural laws can be reduced to one simple, unifying equation! Really? What is it? Already my powerful brain is bored with such simple problems and is now working on why girls are so obnoxious.
    description: Calvin says a consequence of his cerebral augmentation is that his brain swelled.  Hobbes asks if he can have Calvin's hats.  Calvin says his brain is unraveling all the mysteries of the universe.  He says natural laws can be reduced to one simple, unifying equation.  Hobbes asks what that is.  Calvin says his powerful brain is bored with such simple problems.  He's now working on why girls are so obnoxious.
    characters: [calvin, hobbes]
  "19931121":
    transcript: Boy, it's cold out! It's a perfect day for us snowmen! What a great spot for a few feet of snow! Yes sir. A snowman like me could be real happy here! ... sighhhh... The decoy isn't working? Maybe ducks are easier to fool than snow.
    description: Calvin paints a lunch bag white, to look like a snowman's head.  He puts it on.  He dresses up with a hat and coat, puts a pipe in his mouth, then stands outside saying it's a perfect day for snowmen.  He says a snowman could be real happy there.  He stands, then looks up into the sky, then sighs.  Hobbes asks if the decoy is working.  Calvin says ducks are easier to fool than snow.
    characters: [calvin, hobbes]
    source: s-anand+seligman+miraheze
  "19931122":
    transcript: Now that the thinking cap has enlarged your brain, you can write your homework paper. I concur. CALVIN, DINNER TIME. Uh oh. Wait until your parents see your head! I am applying my powerful brain to the dilemma. I know! We'll wrap my head in this bedsheet! THAT will allay any suspicion! Your powerful brain must know something I don't.
    description: Since Calvin's brain has enlarged, Hobbes thinks he can write his paper now.  Mom calls Calvin for dinner.  Hobbes wonders what will happen when Calvin's parents see his head.  Calvin's powerful brain finds an answer.  He'll wrap his head in a bedsheet.  Hobbes thinks Calvin's powerful brain knows something he doesn't.
    characters: [calvin, hobbes]
  "19931123":
    transcript: Calvin, come down for dinner! I'm not calling you again! Hurry up with the turban! There. Sorry I'm late. I was unavoidably detained. Calvin, we don't eat at the table looking like that. Take off the sheet. Uh... heh heh... um... Thank you. I don't know why I worry. They never notice anything.
    description: Mom calls Calvin to dinner again.  Calvin has a turban on his head made from his sheet.  He tells Dad he was unavoidably detained.   Dad tells him to take the sheet off at the table.  Calvin does, and Dad thanks him.  Calvin, with his larger head, says they never notice anything.
    characters: [calvin, hobbes, dad]
  "19931124":
    transcript: I brought you some fish from dinner. Obviously I don't need to eat brain food now. Oh boy. OK, let's get down to business. I'll apply my powerful brain to the problem of my homework. ...hmmmmmm... How's it going? Good! I just remembered what the assignment was.
    description: Calvin brings some fish to Hobbes.  Calvin doesn't need brain food with his enlarged brain.  He applies his brain to the homework problem.  Hobbes asks how it's going.  Calvin says he just remembered what the assignment was.
    characters: [calvin, hobbes]
  "19931125":
    transcript: My powerful brain has come up with a topic for my paper. Great. I'll write about the debate over tyrannosaurs. Were they fearsome predators or disgusting scavengers? Which side will you defend? Oh, I believe they were fearsome predators, definitely. How come? They're SO much cooler that way.
    description: Calvin comes up with a topic for his paper.  He'll debate whether tyrannosaurs were predators or scavengers.  Hobbes asks which side he'll defend.  Calvin tells Hobbes he believes they were predators.  They're so much cooler that way.
    characters: [calvin, hobbes]
  "19931126":
    transcript: Let's see... to argue that tyrannosaurs were predators and not scavengers, we'll need to write a brief overview of carnosaur evolution. Then we'll delve into skeletal structure, skull design, arm strength, potential running speed, and environmental factors. ...but first, we'll draw some pictures of a T.Rex eating people in the natural history museum. I notice your head is shrinking back to normal size.
    description: Calvin says he'll start with carnosaur evolution.  He'll delve into skeletal structure, skull design, and environmental factors.  First, he'll draw pictures of a T-rex eating people at the museum.  Hobbes notices Calvin's head shrinking back to its normal size.
    characters: [calvin, hobbes]
  "19931127":
    transcript: Your forehead is back to normal. The brain enhancement must have worn off. But you haven't written your paper yet. Oh, that's the easy part. The HARD part was getting a topic and making these funny drawings. Now all I have to do is write everything I know about tyrannosaurs. It'll be a breeze. For once I'm GUARANTEED a good grade! CALVIN, TIME FOR BED.
    description: Hobbes says Calvin's head is back to normal, but Calvin hasn't written his paper yet.  Calvin says the hard part was getting a topic.  He says he'll write everything he knows about tyrannosaurs.  It's a breeze.  He says he's guaranteed a good grade.  Mom tells him it's time for bed.
    characters: [calvin, hobbes, mom]
  "19931128":
    transcript: Hello, Calvin. I am Doctor 5-40. Y-you're a robot?? Ha hah, affirmative. We wouldn't trust a delicate operation like this to clumsy HUMAN hands, now, would we? Um... I gues not... How's the anesthetic? Feel anything? ... no... Good. This will just take a moment. Hold this jar, would you? Ta de tum tum... a little gray matter here, a dab there... ah, that should do it. Wow, that was easy! How do you fell? Smart! This knowledge implant should provide all the wisdom you'll ever need. Great! No more school! Thanks, Doctor! Go home and have 12 years of fun. Sighhhh.
    description: A robot doctor looks at Calvin.  It slices his head open to look at the brain.  The doctor puts more brains into Calvin's skull.  The robot doctor asks how Calvin feels.  Calvin says "smart".  The doctor says the knowledge implant should provide all the wisdom you'll need.  Calvin walks out of the office needing no more school.  The robot doctor says to go home and have 12 years of fun.  Calvin sighs as he gets onto the school bus.
    characters: [calvin]
    source: s-anand+seligman+miraheze
  "19931129":
    transcript: TIME FOR BED?? That's what I said. But I haven't finished my paper for school yet! I need more time! How much more do you have to do? I just have to write it.
    description: Mom tells Calvin it's time for bed.  Calvin tells Mom he hasn't finished his school paper yet.  She asks how much more he has to do.  Calvin tells her he just has to write it.
    characters: [calvin, hobbes, mom, stuffedhobbes]
  "19931130":
    transcript: You mean it's bedtime and you haven't even started writing your paper for school?! What have you been DOING all evening?? Well first, Hobbes and I invented and constructed a thinking cap that augmented my brain so I could think up a good topic, and then we drew illustrations of... That doesn't sound like a very good time budget to me. I wasn't expecting to get audited so soon.
    description: Mom asks what Calvin has been doing all night.  Calvin tells Mom he built a thinking cap that augmented his brain to think of a topic.  Mom says that doesn't sound like a good time budget to her.  Calvin wasn't expecting to get audited so soon.
    characters: [calvin, mom]
  "19931201":
    transcript: Great! Just great! Mom lets us stay up for half an hour longer to finish this paper. How am I supposed to do a good job in so little time?! Your Mom says you wasted the whole evening. But now she's making me do a rushed, slipshod job! I'll have to compromise the qualitY! I won't get the "A" I deserve! Especially since you've used up 15 minutes complaining about it. It'll tell the teacher it's Mom's fault.
    description: Calvin gripes to Hobbes that Mom is only giving him an extra half hour to write the paper.  He asks how he's supposed to do a good job in such little time.  Hobbes reminds him that Mom said he wasted the whole evening.  Calvin complains Mom is making him to a rushed, sloppy job.  He won't get the "A" he deserves.  Hobbes tells him he's used up 15 minutes complaining about it.
    characters: [calvin, hobbes]
  "19931202":
    transcript: What a rotten evening that was. At least you finished your paper. Yeah, but it could've been a lot better. I finally get a chance to write about something I know backward and forward and I have to rush the whole thing. Well, with the time available, you did the best you could. ...sort of. I think geniuses should be given special considerations.
    description: Calvin crawls into bed.  Hobbes tells him at least he's finished with the paper.  Calvin says it could have been better.  He gets a chance to write about something he knows, and he has to rush the whole thing.  Hobbes says he did the best he could with the time he had.....sort of.  Calvin thinks geniuses should be given special considerations.
    characters: [calvin, hobbes]
  "19931203":
    transcript: 'My paper is entitled, "Tyrannosaurus Rex: Fearson Predator or Loathsome Scavenger?" Ahem... "I say tyrannosaurs were predators, because it would be so bogus if they just ate things that were already dead. The end." I''M A CONCISE WRITER, OK?!?'
    description: Calvin reads his paper in front of the class.  He reads that tyrannosaurs were predators, because it would be bogus if they ate things that were already dead.  He grins at the class.  He yells that he's a concise writer.
    characters: [calvin]
  "19931204":
    transcript: Miss Wormwood was going to give me a "D-" on my paper, but I talked to her after class and told her how I ran out of time and couldn't write all I knew about tyrannosaurs. She said I'd had plenty of time to do the assignment, but she admitted that maybe I'd picked too complex a subject. So she raised my grade to a "D" and told me I should try to pick realistic goals and plan my time better. I guess we learned a lesson, huh? I'll say. Smooth-talking the teacher really pays off!
    description: Calvin tells Hobbes he got a "D-" on his paper.  He talked to Miss Wormwood about having run out of time.  He tells Hobbes that Miss Wormwood admitted that maybe he'd picked too complex a subject.  She raised his grade to a "D" and said to pick realistic goals and plan his time better.  Hobbes asks if he learned a lesson.  Calvin says he did.  Smooth-talking the teacher really pays off.
    characters: [calvin, hobbes]
  "19931205":
    transcript: Look at that kid's snowman! What a pathetic cliche! Am I supposed to identify with this complacent moron and his shovel?? This snowman says nothing about the human condition! Is this all the kid has to say about contemporary suburban life?! The soulless banality of this snowman is a sad comment on today's art world. Now come look at MY snowman. I call it, "The Torment of Existence Weighted Against the Horror of Nonbeing". As he melts, this sculpture will become even more poignant. I admire your willingness to put artistic integrity before marketability.
    description: Calvin looks at a snowman.  It has a shovel in hand and is wearing a hat.  Calvin tells Hobbes it's a pathetic cliche.  He says the snowman says nothing about the human condition.  He says the banality of the snowman is a sad comment on today's art world.  He shows Hobbes the snowman he made.  It's a horrible snowman with bulging eyes, an open mouth with tongue hanging out.  Calvin says the snowman is "The torment of existence weighed against the horror of nonbeing".  Hobbes comments that he admires Calvin's willingness to put artistic integrity before marketability.  Hobbes walks away.  Calvin stands there, then starts building a normal snowman.
    characters: [calvin, hobbes]
    source: s-anand+seligman+miraheze
  "19931206":
    transcript: 14... 52... POW! WAAUGH! YOU'RE SUPPOSED TO WAIT UNTIL I HIKE THE BALL!! Oops. Sorry. Darn tigers. You can explain the rules to 'em, but you can't suppress their surprise pounce instinct.
    description: Calvin and Hobbes are playing football.  Calvin calls signals.  Hobbes pounces on Calvin.  Calvin protests that Hobbes is supposed to wait until he snaps the ball.  Calvin picks himself up from the ground saying you can explain the rules to a tiger, but you can't suppress their surprise pounce instinct.
    characters: [calvin, hobbes]
  "19931207":
    transcript: Yesterday Dad went to buy a hardcover novel. He said he wanted to read something long, rich and thought-provoking for a change, and he wanted a cloth binding so his book could be carried around and reread later. Then he said he was going to buy the book with cash, so nobody could trace the purchase to him and exploit his interest for commercial purposes. You Dad's going into the guture kicking and screaming, isn't he? What if he's turning me into some kind of subversive?
    description: Calvin says Dad went to buy a hardback novel.  He tells Hobbes Dad wanted something thought-provoking and that had a cloth binding.  Dad said he was guying the book with cash so nobody could trace the purchase and exploit his interests for commercial purposes.  Hobbes asks Calvin if Dad's going into the future kicking and screaming.  Calvin wonders what happens if Dad is turning into some kind of subversive.
    characters: [calvin, hobbes]
  "19931208":
    transcript: Mom, can I get a big tattoo? I want a winged serpent coiling around one arm, clutching a ship on my chest, with... ...um... I mean... ...well... ...sighhhh... Did you know Mom can communicate telepathically?
    description: Calvin asks Mom if he can get a tattoo of a serpent clutching a ship.  Mom looks at him with a frown.  Calvin sighs and walks away.  He asks Hobbes if he knew Mom can communicate telepathically.
    characters: [calvin, hobbes, mom]
  "19931209":
    transcript: I'm gonna pound you at recess, Twinky. You'd better be nice to me, Moe. Haw! Why? Because someday my tax dollars will be paying for your prison cell. POW! My whole problem is my lips move when I think.
    description: Moe threatens to pound Calvin at recess.  Calvin tells Moe to be nice to him, since his tax dollars will one day pay for Moe's prison cell.  Moe punches him.  Calvin says his problems is his lips move when he thinks.
    characters: [calvin, moe]
  "19931210":
    transcript: You know, everything I am... my unique spirit and personality... everything that makes me ME... ...is dependent on the proper functioning of this complex, fagile and miraculous chunk of meat that is my body. Interesting observation. Well, it just occurred to me. WAHOOOOOOO.
    description: Calvin and Hobbes sit in the wagon near the cliff.  Calvin tells Hobbes that everything that makes him unique is dependent on proper functioning of his complex body.  Hobbes says that's an interesting observation.  Hobbes jumps off the wagon as it hurtles down the cliff.
    characters: [calvin, hobbes]
  "19931211":
    transcript: They say the world is a stage. But obviously the play in unrehearsed and everybody is ad-libbing his lines. Maybe that's why it's hard to tell if we're in a tragedy or a farce. We need more special effects and dance numbers.
    description: Calvin tells Hobbes that all the world is a stage.  But he says the play is unrehearsed and everybody ad-libs.  Hobbes thinks that's why it's hard to tell whether we're in a tragedy or a farce.  Calvin suggests more special effects and dance numbers.
    characters: [calvin, hobbes]
  "19931212":
    transcript: That's two outs! I should've stayed at second base. You've still got a snowman at third. I love a good game of speed sled base snow ball!
    description: Hobbes throws a snowball to Calvin, who hits it with a bat.  He takes off on his sled, going down the hill.  Hobbes makes a snowball as Calvin goes around a tree and a bush.  Hobbes throws the snowball and knocks Calvin off the sled.  Hobbes says there are two outs.  Calvin says he should have stayed at second base.  Hobbes reminds him he has a snowman at third.  Calvin loves a good game of speed sled base snow ball.
    characters: [calvin, hobbes]
    source: s-anand+seligman+miraheze
  "19931213":
    transcript: Yep, Christmas is just around the corner. And what better way to celebrate a religious holiday than with a month of frenzied consumerism! I'm surprised other religions haven't picked up on that. Getting loads of loot is a very spiritual experience for me.
    description: Calvin says Christmas is around the corner.  He asks what better way to celebrate a religious holiday than with a month or frenzied consumerism.  Hobbes is surprised other religions haven't picked up on that.  Calvin says getting loads of loot is a spiritual experience for him.
    characters: [calvin, hobbes]
  "19931214":
    transcript: Dear Santa, Every year at this time I send you a list of what I want for Christmas. And every year you callously ignore it and bring me practical things I don't want at all. What's the deal?! Are you insane? Have you gone senile?? Can't you read?? Or are you just a vindictive, twisted elf, bent on destroying kids' dreams?!?! You might want to sleep on this one. I know, but it felt good to write it.
    description: Calvin writes Santa a letter.  He writes Santa ignores his list every year and brings practical things he doesn't want.  He asks if Santa is insane, gone senile, or can't read.  He asks if he's a vindictive elf destroying little kids' dreams.  Hobbes reads the letter and suggests sleeping on it.  Calvin knows, but he says he felt good writing it.
    characters: [calvin, hobbes]
  "19931215":
    transcript: Dear Santa, Last year I did not receive the 15,000 items I requested for Christmas. I can only conclude that your secretarial staff must be a bunch of underpaid and woefully unprepared temps, and my letter was misfiled. To avoid a similar disaster this year, just write me a check for five million dollars, and I'll buy the stuff myself. See, THIS year I won't be disappointed. I'd leave out the part about the temps.
    description: Calvin writes Santa a letter complaining he didn't receive the 15000 items he requested last year.  He concludes Santa's secretarial staff is a bunch of underpaid and unprepared temps, with his letter being misfiled.  He offers Santa the option of writing a check to him for five million dollars, so that he can buy the stuff himself.  Calvin tells Hobbes that he won't be disappointed this year.  Hobbes suggests leaving out the part about the temps.
    characters: [calvin, hobbes]
  "19931216":
    transcript: Dear Santa, Hello, I am Calvin's new baby brother, Melville. Enclosed is a list of what I want for Christmas. Please don't confuse MY list with Calvin's. There are TWO kids at this house now. Man, if Santa falls for this, I'll add a new brother every year! "Melville"?
    description: Calvin writes Santa a letter, saying he's Calvin's brother, Melville.  He encloses a list, telling Santa not to confuse his list with Calvin's.  He says there are two kids at the house now.  Calvin tells Hobbes that if Santa falls for this, he'll add a new brother every year.
    characters: [calvin, hobbes]
  "19931217":
    transcript: No snow. ...which means I can't paste anyone with a snowball... which means I'm good... which means I'll get lots of Christmas presents! Ha! Nothing in life is ever easy.
    description: Calvin stands outside with no snow.  He says he can't paste anyone with a snowball, which means he's good and will get lots of Christmas presents.  Then it starts snowing.  He says nothing is life is ever easy.
    characters: [calvin]
  "19931218":
    transcript: Look at all this snow! I'm being tested. We got this snow so I'd be tempted to smack Susie with a slushball and forfeit all my Christmas presents. To evaluate my chatacter, my immediate pleasure is being pitted against my future greed! Poor Susie. IT'S NOT A FOREGONE CONCLUSION!
    description: Hobbes notices all the snow.  Calvin tells Hobbes he's being tempted to smack Susie with a slushball and forfeiting all his presents.  His immediate pleasure is being pitted against his future greed.  Hobbes laments for poor Susie.  Calvin protests that it's not a foregone conclusion.
    characters: [calvin, hobbes]
  "19931219":
    transcript: 'My hands were all shaky, my face had gone pale. A letter from Santa just arrived in the mail! It was hand-written in old-fashioned ink pen. It was handsomely printed and dated twelve ten. "Dear Calvin," it said, "I''m writing because this year I''ve repealed my ''naught / nice'' laws. So now, I urge you: be vulgar and crude! I LIKE it when children are boorish and rude! Burp at the table! Gargle your peas! Never say ''Thank you'', ''You''re welcome'', or ''Please''. Talk back to your mother. Do as you''re told. Stick your tongue out at your Dad if he scolds! Drive everyone crazy, I really don''t care! Act like a jerk, anytime, anywhere! I''m changing the rules! The BAD girld and boys will be, from now on, the ones who get the toys! Good little kids make me sick, it''s no joke. Sincerely, signed Santa." ... and then I awoke. I hate being good (or trying to fake it). Six days until Christmas! I don''t think I''ll make it.'
    description: Calvin reads a letter he received from Santa.  It's written in verse, to the pattern of "Night before Christmas".  Santa writes that he's repealed his laws and suggests Calvin be vulgar and crude.  Santa writes for Calvin to burp and never say "thank you" or "you're welcome".  He suggests talking back to his parents and to act like a jerk, anytime, anywhere.  Santa writes bad boys and girls will be the ones to get the toys.  Calvin wakes up.  He frowns and lies in bed.  He hates being good six days until Christmas.  He doesn't think he'll make it.
    characters: [calvin, mom, dad]
    source: s-anand+seligman+miraheze
  "19931220":
    transcript: The day after Christmas is going to be epic.
    description: Calvin builds snowballs.  He keeps adding to his pile.  Hobbes comes over and looks up at the mountain of snowballs.  Calvin tells him the day after Christmas is going to be epic.
    characters: [calvin, hobbes]
  "19931221":
    transcript: Throwing these snowballs would give me immediate and certain pleasure. Refraining from throwing these snowballs in the hope of being rewarded at Christmas is delayed and Uncertain pleasure. As usual, goodness hardly puts up a fight.
    description: Calvin has a snowball and comments throwing it would give him certain pleasure.  Refraining from throwing the snowballs in hope of being rewarded at Christmas is delayed and uncertain pleasure.  Calvin looks at the mountain of snowballs.  He says that as usual, goodness hardly puts up a fight.
    characters: [calvin]
  "19931222":
    transcript: What if there is no Santa Claus? You know, a lot of this Santa stuff is hard to believe. The flying reindeer, going around the world in one night, the whole chimney bit... What if it's all some cruel hoax and I'm being good for NOTHING? You've ALWAYS been good for nothing! If he exists, Santa will forgive this one.
    description: Calvin wonders what if there isn't a Santa Claus.  He says this Santa stuff is hard to believe.  The flying reindeer, going around the world in a night, the chimney bit.  He asks Hobbes what if it's a hoax and he's being good for nothing.  Hobbes laughs that he's always been good for nothing.  Calvin makes a snowball and says that if he exists, Santa will forgive this one.
    characters: [calvin, hobbes]
  "19931223":
    transcript: I'm not bad. I'm just... um... ...exuberant! There's nothing wrong with being exuberant! Heads up! POW! Go on, explain the semantics to your Mom. Yikes, she got her wind back and she's gaining!
    description: Calvin has a snowball.  He says he's not bad.  He's exuberant!  He tells Hobbes there's nothing wrong with being exuberant.  He throws the snowball and hits someone.  He and Hobbes run.  Hobbes tells Calvin to explain the semantics to Mom.  Calvin notices Mom got her wind back and is gaining on them.
    characters: [calvin, hobbes]
  "19931224":
    transcript: Piff. SANTA'S GONNA SKIP YOUR HOUSE FOR THAT, CALVIN! I figure this doesn't really count against me, since she's so sanctimonious and I keep missing.
    description: A snowball barely misses Susie.  She yells that Santa's going to skip Calvin's house for that.  More snowballs fly toward Susie, but none hit her.  Calvin tells Hobbes that this doesn't count against him, since she's so sanctimonious and he keeps missing.
    characters: [calvin, hobbes, susie]
  "19931225":
    transcript: HA HA! ACQUITTAL ON ALL CHARGES! COMPLETE EXONERATION! HA HA HA! Merry Christmas to you too, dear. Phew, what's that smell? Has someone been eating tuna fish at this horrible hour?!
    description: Calvin sees his gifts under the Christmas tree.  He grabs one and shouts that he's gotten acquittal on all charges and complete exoneration.  He laughs.  Mom and Dad hug each other.  Mom tells Dad Merry Christmas.  Dad asks what that smell is.  He asks if someone has been eating tuna fish at that hour.
    characters: [calvin, hobbes, mom, dad, stuffedhobbes]
  "19931226":
    transcript: Are you making any resolutions for the new year? Nope! I want everything to stay the same as it was this year. Everything? Right. This year was lousy, but at least it's familiar. I hate change! It's too disruptive! When things are difference, you have to think about the change and deal with it! I like things to stay the same, so I can take everything for granted! Besides, things keep changing for the WORSE! The longer I live, the more complicated everything gets! I say let's stop here before life gets any harder! From now on, no more change! I'm bored. Let's do something different. SOME things don't change.
    description: Hobbes asks if Calvin is making New Year's resolutions.  Calvin wants everything to stay the same as it was this year.  Calvin says the year was lousy, but familiar.  Calvin hates change.  You have to think about change and deal with it.  He wants to take everything for granted.  Calvin says things always change for the worse.  Things get more complicated every year.  He wants to stop now.  No more change.  They stand there for a little while.  Calvin says he's bored and wants to do something different.  Hobbes says some things don't change, as they run to play.
    characters: [calvin, hobbes]
    source: s-anand+seligman+miraheze
  "19931227":
    transcript: Z. Y-YAWNN. There's no sedative like seeing a tiger lying in the sun.
    description: Calvin walks by a sleeping Hobbes.  Calvin suddenly yawns.  He says there's no sedative like seeing a tiger lying in the sun.
    characters: [calvin, hobbes]
  "19931228":
    transcript: Hey Dad, why don't you cut down all the trees in our hill and put in a ski lift? Because a ski lift would be ugly, noisy, and completely unnecessary. The problem with Dad is he doesn't know progress when he hears it.
    description: Calvin asks Dad why he doesn't cut down all the trees on their hill and put in a ski lift.  Dad tells Calvin a lift would be ugly, noisy, and unnecessary.  Calvin walks off, grumbling that Dad doesn't know progress when he hears it.
    characters: [calvin, dad]
  "19931229":
    transcript: AAUGHH. I meant to do that. Then it worked very well.
    description: Calvin has a huge snowball on a plank, held up by a log.  He jumps on the other end of the plank.  The snowball barely climbs up and falls on top of him.  He tells Hobbes he meant to do that.  Hobbes tells him it worked very well.
    characters: [calvin, hobbes]
  "19931230":
    transcript: I've lost my marbles. Everyone suspected as much. Well, I hope somebody finds them again. HEY!!
    description: Calvin looks under the chair.  He tells Hobbes he lost his marbles.  Hobbes says everyone suspected as much.  Calvin walks off saying he hopes somebody finds them.  That night, in bed, he realizes what Hobbes said.  He gets up and yells "Hey".  Hobbes peeks over his shoulder at Calvin.
    characters: [calvin, hobbes]
  "19931231":
    transcript: I need a new toboggan. What for? Mine is outdated. I'm sure the '94 models have all sorts of new features, colors and options. Toboggans don't come in model years. They don't?? I tell you, Hobbes, there's a fortune to be made!
    description: Calvin tells Dad he needs a new toboggan.  Dad asks why.  Calvin tells him he thinks the new models have new features, colors, and options.  Dad tells Calvin toboggans don't come in model years.  Later, Calvin runs with Hobbes, paint can in hand.  He tells Hobbes there's a fortune to be made.
    characters: [calvin, hobbes, dad]
  "19940101":
    transcript: What the...?? I'm not playing with a full deck! That's what some people say. Really? Then why didn't somebody go buy some new cards?! HEY!!
    description: Calvin looks through his playing cards and tells Hobbes he isn't playing with a full deck.  Hobbes agrees.  Calvin walks off, saying someone should buy new cards.  Later that night, in bed, Calvin realizes what Hobbes' comment indicated.
    characters: [calvin, hobbes]
  "19940102":
    transcript: Sighhhh...
    description: Calvin sleds down the hill.  At the bottom, he straps on a rocket pack and blasts back to the top of the hill.  Calvin pulls his sled back up the hill with a sigh.
    characters: [calvin]
  "19940103":
    transcript: I resent the quality of network programming! It's all fluff, violence, sensationalism and sleaze! I hunger for serious, tasteful entertainment that respects my intelligence! So turn off the stupid TV and read a book. All right, I lied. Sue me.
    description: Calvin sits watching television.  He says he resents the quality of network programming.  He says it's all violence and sleaze.  He hungers for tasteful entertainment that respects his intelligence.  Dad comes by and tells Calvin to turn off the TV and read a book.  Calvin continues to watch television.  He says he lied, sue him.
    characters: [calvin, dad]
  "19940104":
    transcript: Why does he have a hot water bottle on his head? He's committing suicide.
    description: Hobbes asks Calvin why his snowman has a hot water bottle on his head.  Calvin replies he's committing suicide.
    characters: [calvin, hobbes]
  "19940105":
    transcript: I'll take one card. OK. I fold. Are you cheating?!
    description: Calvin and Hobbes are playing cards.  Hobbes takes one.  His tail starts twitching.  Calvin folds.  Hobbes asks if Calvin is cheating.
    characters: [calvin, hobbes]
  "19940106":
    transcript: Incredibly, people NEVER expect to get hit with a snowball in the house. I'll see you in your room momentarily.
    description: Mom and Dad are sitting by the fire, with their backs to Calvin.  Calvin tells Hobbes people never expect to get hit with a snowball in their own house.  He readies two snowballs.  Hobbes tells Calvin he'll see him in his room momentarily.
    characters: [calvin, hobbes, mom, dad]
  "19940107":
    transcript: If anyone hits me with a snowball, I'll hit HIM with 250 snowballs! What if somebody hits YOU with 250 snowballs? ...sighhh...
    description: Calvin has a mountain of snowballs.  He tells Hobbes that if anyone hits him with a snowball, he'll hit that person with 250 snowballs.  Hobbes asks what happens if someone hits Calvin with 250 snowballs.  Calvin looks at his mountain of snowballs.  He sighs and keeps making more snowballs.
    characters: [calvin, hobbes]
  "19940108":
    transcript: This will by my strongest fort ever! With these massive walls, I'll be safe from any attack! HELLLP!!
    description: Calvin builds his strongest fort ever.  He makes tall walls, so he'll be safe from attack.  From inside the fort, he realizes he can't get out.  He yells for help.
    characters: [calvin]
  "19940109":
    transcript: We got some new snow last night! Let's look for animal tracks! Here are some bird tracks. Look, you can see wing impressions where they took off! And these are rabbit tracks. Looks like they were going pretty fast. No wonder! Look at THESE tracks! Something was chasing them all over the place! Hmm... big pads... could be a wolf. But there are no clan impressions. It's more like a bobcat, or a mountain lion, or... or... This explains the cold wet feet in my bed this morning. The snow was falling and I thought, "The birds and the rabbits around here need some exercise."
    description: Calvin and Hobbes look for animal tracks in the new snow.  Calvin notices bird and rabbit tracks.  He sees the animals were chased by something.  Calvin notices the big pads, so it might be a wolf.  There are no claw impressions, so maybe it's a mountain lion.  Or maybe Hobbes.  Calvin says that explains the cold wet feet in bed that morning.  Hobbes talks about how he felt the animals needed some exercise.
    characters: [calvin, hobbes]
    source: s-anand+seligman+miraheze
  "19940110":
    transcript: I don't think the schools assign enough homework.
    description: Dad comes home to see several snowmen in the yard.  They are yelling while one is eaten by a giant snow monster.  Dad doesn't think schools assign enough homework.
    characters: [dad]
  "19940111":
    transcript: Some kids at school got filthy rich today. Really? How? They grabbed him by the drinking fountain.
    description: Going down the hill on the sled, Calvin tells Hobbes some kids at school got filthy rich today.  Hobbes asks how.  Calvin says they grabbed him by the drinking fountain.
    characters: [calvin, hobbes]
  "19940112":
    transcript: Here, you'll probably want this pillow. What for? It's like an air bag. Hold it in front of your head like this as we go down. Don't you feel safer now? I certainly do.
    description: On the toboggan, Calvin hands Hobbes a pillow.  He tells Hobbes it's like an air bag.  He tells Hobbes to hold it in front of his head, then shows how he's doing it.  He asks Hobbes if he feels safer now.  Hobbes gets off the toboggan and says yes.
    characters: [calvin, hobbes]
  "19940113":
    transcript: Yes! POW. Wasn't that a great shot?? What control! What form! Did you notice the top spin? Did you notice how I packed the snow so that... A REAL friend would've been happy for me!
    description: Calvin hits Hobbes with a snowball.  He asks if Hobbes noticed what a great shot that was and if he noticed the top spin.  Hobbes gets out of the snow angrily.  Calvin's clothes are hanging from a tree branch out of reach.  Calvin stands in his underwear in the snow.  He says a real friend would have been happy for him.
    characters: [calvin, hobbes]
  "19940114":
    transcript: Some people complain all the time! They complain about the least little thing! If something bugs them, they never let go of it! They just go on and on, long after anyone else is interested! It's just complain, complain, complain! People who gripe all the time really drive me nuts! You'd think they'd change the subject after a while, but they never do! They just keep griping until you start to wonder, "What's wrong with this idiout?" But they go on complaining and repeating what they've already said! Maybe they're not very self-aware. Boy, that's ANOTHER thing that gets on my nerves!
    description: Calvin tells Hobbes that some people complain all the time.  He goes on to say they never let things go.  Those people drive Calvin nuts.  He says they don't change the subject, and you wonder what's wrong with them.  Hobbes rolls his eyes and says maybe they're not self-aware.  Calvin says that's another thing that gets on his nerves.
    characters: [calvin, hobbes]
  "19940115":
    transcript: We need more extension cords.
    description: Calvin sits on his sled with an electric fan behind him.  Hobbes holds the end of the electric cord.  He tells Calvin they need more extension cords.
    characters: [calvin, hobbes]
  "19940116":
    transcript: AAAAUGHH! Is the water too cold? Um... no, it's fine. Then stop that infernal screaming. Yes, Mom.
    description: Spaceman Spiff's craft plunges into the water.  He climbs out swimming and is attacked by fish.  Then a giant creature comes out of the water behind him.  The creature asks if the water is too cold.  Spiff says no.  Mom leaves the bathroom saying he should stop his infernal screaming.
    characters: [calvin, mom, spiff]
    source: s-anand+seligman+miraheze
  "19940117":
    transcript: OK, these are my footprints. Here I stop, hear something, and start to turn around. A few feet farther on, there's the impression of my body as I hit the ground. These are the powdered remains of the snowball that hit me. From the angle of particle dispersement, we can tell the snowball was thrown from over here, where we find... ...tiger tracks. Those could by ANYBODY's tiger tracks.
    description: Calvin shows Hobbes his footprints in the snow.  He shows an impression of his body when he hit the ground.  He sees powdered remains of a snowball that hit him.  He can tell the snowball was thrown from over by a tree, based on the angle of particle dispersement.  He sees tiger tracks.  Hobbes says those could be anybody's tiger tracks.
    characters: [calvin, hobbes]
  "19940118":
    transcript: POW! I must say, the stinging snow makes your cheeks look positively radiant. Some people sure can't take a compliment.
    description: Calvin throws a snowball and hits Susie.  As she marches over to him, he says the stinging snow makes her cheeks look radiant.  As he lies in the snow, Calvin says some people can't take a compliment.
    characters: [calvin, susie]
  "19940119":
    transcript: Shrimp.
    description: Calvin looks up as Dad walks by.  He looks up as Mom walks by.  He builds a tiny snowman.  He looks down at it and calls it "shrimp".
    characters: [calvin, mom, dad]
  "19940120":
    transcript: Circumstantial evidence, that's all you've got! You can't get a fair trial in this town.
    description: Susie sees a snowball pass overhead.  Several others come, some hitting her.  She walks over to Calvin, who is standing next to a wheelbarrow.  He tells her all she has is circumstantial evidence.  As he lies in the snow, he says you can't get a fair trial in this town.
    characters: [calvin, susie]
  "19940121":
    transcript: I couldn't stand being a girl. I can't stand you either way. When guys grow up, they get to play with cards, sports equipment, cameras, stereos, electric tools... you name it. But girls don't get any toys when they grow up. Women just buy clothes and shoes. How boring. How sad. I guess girls actually mature as they get older. I can't wait until I'm old enough to "putter around".
    description: Waiting for the school bus, Calvin tells Susie he couldn't stand being a girl.  He says when guys grow up, they play with cars, stereos, you name it.  Girls don't get toys when they grow up.  They just buy clothes and shoes.  He says that's sad.  Susie guesses girls actually mature as they grow older.
    characters: [calvin, susie]
  "19940122":
    transcript: On the other hand, the neighbors keep planting nice been trees next to us.
    description: Mom and Dad look at a snowman.  It's holding a shrunken snow head, with others in a snow pot next to it.  Mom comments that on the other hand, the neighbors keep planting big trees next to them.
    characters: [mom, dad]
  "19940123":
    transcript: How unoriginal! How hehune! Stupid kid. If you don't have anything to say, just keep quiet! Well, this is certainly shocking! Face it, kid, provoking a reaction isn't the same thing as saying something significant! Look, pal, there's no point expressing ideas if you can't make them understood! You're just babbling to yourself! And aren't we all bored with the irony byy now?You just THINK you're above it all, kid! I tell you Hobbes, it's tough being the sole guardian of high culture. Talent like ours carries such enormous responsibility.
    description: Calvin says a snowman looks unoriginal.  He walks on to see one with female features.  Calvin says provoking a reaction isn't the same thing as saying something important.  He critiques a snowman family he sees.  Calvin tells Hobbes it's hard being the sole guardian of high culture as he makes a snow scene.  Hobbes says talent like theirs carries enormous responsibilities.  They have made a snow UFO with two snow aliens.  A snowman lies decapitated as they add to the scene.
    characters: [calvin, hobbes]
    source: s-anand+seligman+miraheze
  "19940124":
    transcript: Our lives are filled with machines designed to reduce work and increase leisure. We have more leisure than any man has ever had. And what do we do with this leisure? Educate ourselves? Take up new interests? Explore? Invent? Create? Dad, I can't hear this commercial. If it were up to Dad, leisure would be as bad as work.
    description: Dad tells Calvin their lives are filled with machines designed to reduce their work.  Dad asks what they do with all their leisure.  He asks Calvin if they educate themselves, explore, invent or create.  Calvin tells Dad he can't hear a commercial on television.  Calvin is booted out of the house.  Calvin says if it were left up to Dad, leisure would be as bad as work.
    characters: [calvin, dad]
  "19940125":
    transcript: I KNOW I have hat hair, so you don't need to tell me. Actually, it's not that different.
    description: Calvin comes into the house.  He takes his boots, coat, and hat off.  His hair is all messed up.  As he comes up to Hobbes, Calvin says he knows he has hat hair, Hobbes doesn't need to tell him.  Hobbes says it's not that different.
    characters: [calvin, hobbes]
  "19940126":
    transcript: See? if you jump right, you don't need to waste time shoveling the entire walk.
    description: Calvin has shoveled some holes on the sidewalk.  Dad tries to step in the holes to get to the house.  Calvin tells him that if he jumps right, Calvin doesn't need to waste time shoveling the entire walk.
    characters: [calvin, dad]
  "19940127":
    transcript: "Test: 1. When did the pilgrims land at Plymouth Rock? 1620. As you can see, I've memorized this utterly useless fact long enough to pass a test question. I now intend to forget it forever. You've taught me nothing except how to cynically manipulate the system. Congratulations. They say the satisfaction of teaching makes up for the lousy pay."
    description: Calvin is taking a test.  He answers a question, then adds that although he memorized a fact to pass a test question, he will forget it forever.  He states they've taught him nothing except how to cynically manipulate the system.  Calvin says they say the satisfaction of teaching makes up for the lousy pay.
    characters: [calvin]
  "19940128":
    transcript: 2. Where is Plymouth Rock? I am not presently at liberty to divulge that information, as it might compromise our agents in the field. I understand my tests are popular reading in the teachers' lounge.
    description: Calvin looks at a test question.  He answers he's not at liberty to divulge the information as it might compromise agents in the field.  He says he understands his tests are popular reading in the teacher's lounge.
    characters: [calvin]
  "19940129":
    transcript: Gimme a quarter, Twinky. Your simian countenance unusually rich in species diversity. What? Here you go. That was worth 25 cents.
    description: Moe tells Calvin to give him a quarter.  Calvin tells Moe his simian countenance suggests a heritage rich in species diversity.  Moe wonders what that meant while Calvin gives him a quarter.  Calvin walks off stating that was worth 25 cents.
    characters: [calvin, moe]
  "19940130":
    transcript: UHNGGG It's the late Jurassic. Calvin, the awful allosaur, darts around a giant, unsuspecting diplodocus! Calvin crouches in his hiding place, muscles tensed for the surprise attack! He waits... he waits! AAAAAAA Sheeeeesh, what's wrong with taking a little break?!
