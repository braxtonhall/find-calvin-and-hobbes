  "19940223":
    transcript: Yes, Calvin? Why aren't you teaching us the gender of nouns? Is "desk" masculine? Is "chair" feminine? Foreign kids know, but WE don't! No wonder we can't compete in a global market! I demand sex education. ...I wonder if her doctor knows she mixes all those medications.
