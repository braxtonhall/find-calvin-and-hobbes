    characters: [calvin, hobbes]
  "19940316":
    transcript: Don't you think you'd enjoy this more if you did your math assignment first, so it wasn't hanging over your head? I'm a practical man, Hobbes. I don't waste time thinking about hypothetical situations. I heal with the world here and now. And the incontrovertible fact is that I'm outside in the snow! THAT's reality! THAT's what I think about! Tomorrow's a reality too. Hypothetically, it might be another snow day.
    description: As they play, Hobbes asks Calvin if he'd enjoy playing more if his homework was done.  Calvin says he doesn't waste his time thinking about hypothetical situations.  He says the fact is that he's outside.  That's reality and what he thinks about.  Hobbes says tomorrow is a reality, also.  Hypothetically, Calvin says, it might be another snow day.
    characters: [calvin, hobbes]
  "19940317":
    transcript: What a busy day! I'm pooped! Mom says the roads are pretty clear, so school will probably open again tomorrow. NOW I wish I'd done my math homework instead of playing outside all day. ...or I wish I'd done it before dinner... or after dinner... or instead of watching TV... or before bed. But now it's too late. A day can really slip by when you're deliberately avoiding what you're supposed to do.
    description: Hobbes yawns after a busy day.  Calvin says the roads are clear, so they'll probably have school tomorrow.  Now he wishes he had done his math homework instead of playing outside all day...or after dinner...or instead of watching TV.  Now it's too late.  He says a day can slip by when you're deliberately avoiding what you're supposed to do.
    characters: [calvin, hobbes]
  "19940318":
    transcript: Oh, I wish I'd done my math homework! Now the teacher's going to collect it and I'm as good as dead! Why did I do this to meyself?! I even had an extra day to get it done! Instead, I goofed off and now I'm going to pay for it! Boy, I've learned my lesson! This day has been nothing but dread, and I could've avoided it all! Here she comes! Goodbye, world! I'll collect your homework tomorrow, class. Susie, quick. Am I sitting in a beam of light? Looks more like a puddle of sweat. Why?
    description: Calvin sits at his desk, wishing he had done his homework.  He asks why he did this to himself.  He had an extra day, and he still goofed off.  He says he learned his lesson.  Miss Wormwood comes into the room.  The bell rings.  Class is over.  Miss Wormwood says she'll collect their homework tomorrow.  Calvin asks Susie if he's sitting in a beam of light.  She says it looks more like a puddle of sweat.
    characters: [calvin, susie, wormwood]
  "19940319":
    transcript: I couldn't believe it! The bell rang just as the teacher was about to collect the homework I didn't do! That's twice you've been saved at the last minute. But I've learned my lesson THIS time. From now on, it's work before pleasure! No exceptions! And it will be a PLEASURE to have that homework done! C'mon, let's work on a snowman. No exceptions.
    description: Calvin tells Hobbes the bell rang just as the homework was going to be collected.  Hobbes says that's twice he's been saved at the last minute.  Calvin says he's learned his lesson.  He says it's work before pleasure.  He runs off, saying it will be a pleasure to have that homework done.  He goes to work on a snowman.
    characters: [calvin, hobbes]
  "19940320":
    transcript: Any good mail today? Mm... not really. Here's a "You're not covering the cost of all these mailings" charity request. You've got a "You're not attractive enough" women's magazine with an article on swimsuits that minimize all your body flaws. Here are some "You're not stylish or ostentatious enough" catalogs... and coincidentally, an invitation to go deeper in debt from a credit card company. And here's our news magazine to identify the trend of the week we're missing... and I got a hobby magazine featuring new equipment I ought to have. Yikes. ...Why do I get the feeling that society is trying to make us discontented with everything we do and insecure about who we are? I suppose if people thought about real issues and needs instead of manufactured desires, the economy would collaps and we'd have total anarchy. So pitching this junk would make me some kind of terrorist, huh? Yep. It's our patriotic duty to buy distractions from a simple life. Hey Mom, I saw a bunch of products on TV that I didn't know existed, but I desperately need!
    description: Mom asks Dad if there was any good mail.  Dad says there's a charity request and a women's magazine with an article on swimsuits that minimize all body flaws.  There are catalogs and an invitation to go deeper in debt from a credit card company.  He sees a new magazine identifying trends they're missing and a hobby magazine showing equipment he must have.  He asks why he gets the feeling society is trying to make them discontented with everything they do and insecure about who they are.  Mom supposes if people thought about real issues instead of manufactured desires, the economy would collapse.  Dad asks if throwing the mail out would make him some kind of terrorist.  Mom says it's their patriotic duty to buy distractions from a simple life.  Calvin comes in saying he saw products on TV he didn't know existed, but he desperately needs.
    characters: [calvin, mom, dad]
    source: s-anand+seligman
    review: "verified: checked against a source outside the corpus by the maintainer"
  "19940321":
    transcript: I'm determined to set the world record for having one's finger continuously in one's nose. I can't believe there's even such a category. In that case, call me "champ"!
    description: Calvin tells Hobbes he is trying for a world's record for having one finger in his nose.  Hobbes can't believe there is such a category.  Calvin declares himself "champ".
    characters: [calvin, hobbes]
  "19940322":
    transcript: This piece of pie is awfully darn small! Life could be worse, Calvin. Life could be a lot BETTER, too! ...but worse is more likely.
    description: Calvin says his piece of pie is small.  Mom says life could be worse.  He replies that life could be better, too.  In bed, he grumbles that worse is more likely.
    characters: [calvin, mom]
  "19940323":
    transcript: I've decided to suffer from low self-esteem. Is that a fact. From now on, my goal is to feel good about myself. You're going to work harder at everything and build character? No, I'm going to whine until I get the special treatment I like. I wonder if anyone else is as scared about the future as I am. I've found that immediate gratification is the only thing that helps me.
    description: Calvin tells Dad he decided he suffers from low self-esteem.  His goal now is to feel good about himself.  Dad asks if he'll work harder and build some character.  Calvin says he's going to whine until he gets the special treatment he likes.  Dad wonders if anyone else is as scared for the future as he.  Calvin says immediate gratification is the only thing that helps him.
    characters: [calvin, dad]
  "19940324":
    transcript: Ewww! What's this, something scraped off the bottom of boots?? I'm not eating it! Calvin, I made this last week and you said it was your favorite meal of all time and you wished we could have it every day for the rest of your life! Well, now I hate it. Another day, another gray hair for Mom!
    description: Calvin asks what his dinner is, something scraped off the bottom of boots.  Mom says she made it last week and Calvin had said it was his favorite meal of all time.  He wished they could have it every day.  He says now he hates it.   Mom is frustrated.  Calvin says "another day, another gray hair for Mom".
    characters: [calvin, mom]
  "19940325":
    transcript: I'm ho-OOAAUGH! KAPOW! Man, was this cat a-pulted! Hee hee hee! You're a riot, Hobbes.
    description: Calvin comes home, and Hobbes pounces on him.  Hobbes says this was "cat a-pulted".  Calvin, lying on the floor, says Hobbes is a riot.
    characters: [calvin, hobbes]
  "19940326":
    transcript: These colors really aren't enough, so I have to mix some to get the specific hues I need. See, here I start with a layer of brown. Then I add olive green and scrub a little orange and yellow ochre into it. Finally, I top it with lime green, purple and tan. Wow, perfect barf! You'd think that would be a standard color in a big set like this.
    description: Calvin is coloring a picture.  He decides his colors aren't enough.  He needs to make specific hues.  He takes brown, olive green, a little orange and yellow ochre.  Then he tops it with lime green, purple, and tan.  Hobbes says it's perfect barf.  Calvin says you'd think that would be a standard color in a big set like he has.
    characters: [calvin, hobbes]
  "19940327":
    transcript: Stranded on a distant planet, the fearless Spaceman Spiff has been captured by a horrible Yukbarf! So the earthling villain won't cooperate, eh? We'll see about that! Take him to the dungeon! Yes, your most supreme odoriferousness! You don't scare ME, you talking blobs of oozing slop! I am impervious to pain! Hey, what kind of dungeon is this?! Aren't you going to torture me? Oh yes! Have a seat and let's see how you withstand a calm discussion of wholesome principles! AAAUGH. Yes. life is tough and suffering builds character. Nothing worth having ever comes easy. Virtue is its own reward and when I was your age...
    description: Spaceman Spiff is stranded on a planet, captured by a horrible yukbarf.  The alien says to take Spiff to the dungeon.  It looks like a living room.  Spiff asks what kind of dungeon this is.  He asks if they aren't going to torture him.  The alien says yes.  He asks Spiff to sit to discuss wholesome principles.  Dad tells Calvin life is tough, and suffering builds character.  He says virtue is its own reward, and nothing worth having ever comes easy.  Calvin yells.
    characters: [calvin, dad, spiff]
    source: s-anand+seligman+miraheze
  "19940328":
    transcript: I don't like your face. Then don't look at it. I'd rather change it. Haw! I don't care about being accepted. I'd settle for being ignored.
    description: Moe tells Calvin he doesn't like Calvin's face.  Calvin tells him not to look at it.  Moe would rather change it, and he socks Calvin.  Calvin, lying against a locker, says he doesn't care about being accepted.  He'd settle for being ignored.
    characters: [calvin, moe]
  "19940329":
    transcript: Greetings. I am Blor-Utar from Zimtok-5. I have come to subjugate the human race. Do not resist. Why humans? Because, in addition to their value as slave labor, they are also delicious and nutritious! Ha ha ha! But first, for your Earth customer of "Show and Tell", I will exhibit some of our terrifying weaponry. Snekk blog u-lar mekhh! Gahghh! Rk! All right, Calvin, that's quite enough. Miss Wormwood, shouldn't he be in some special school or something?
    description: An alien says he's come to subjugate the human race.  He says in addition to their value as slave labor, they're delicious and nutritious.  He says for the custom of "show and tell", he'll show some of his terrible weaponry.  Calvin is in front of the class.  Miss Wormwood tells Calvin that's enough.  One of the students asks if Calvin shouldn't be in some special school.
    characters: [calvin, wormwood]
  "19940330":
    transcript: When it snows, you can go sledding. When it's windy, you can fly kites. When it's hot, you can go swimming. But when it's raining... sigh... ... the only sport is driving Mom crazy.
    description: Calvin says when it snows, you can go sledding.  When it's windy, you can fly kites.  He looks out the window lamenting that when it's raining, the only sport is driving Mom crazy.  He grabs a pot and spoon.
    characters: [calvin]
  "19940331":
    transcript: I thought I had a great idea. But it never really took off. In fact, it didn't even get on the runway. I guess you could say it exploded in the hangar. I've had ideas like that.
    description: Calvin tells Hobbes he had a great idea, but it never took off.  It didn't get on the runway.  He says you could say it exploded in the hangar.
    characters: [calvin, hobbes]
  "19940401":
    transcript: ZZZZZZZZ How could you miss that? It was right TO you! You throw too hard!
    description: Calvin tries to catch a baseball.  It goes right through him.  He looks at the ball behind him and the hole in him.  Hobbes asks how he could miss the ball.  Calvin says Hobbes throws too hard.
    characters: [calvin, hobbes]
  "19940402":
    transcript: Ewww, look! This bug is eating another bug! Yukkk! Blecchh! Gross! Ick! Ick! Blbpbblpth! I can't believe I looked at that! Ew! Ew! Hacckkhh! Gaaacck! Great experiences are even better when they're shared.
    description: Calvin sees a bug eating another bug.  Hobbes says yuck.  They both act like they're creeped out.  Calvin says he can't believe they looked at that.  They are both grossed out.  Calvin says great experiences are even better when they're shared.
    characters: [calvin, hobbes]
  "19950101":
    transcript: The end of the mesozoic era... a herd of chasmosaurs is unusually jittery! They now know they have more to fear than tyrannosaurs! Now they face an even GREATER danger... TYRANNOSAURS in F-14s! This is SO cool! This is SO stupid!
    description: A herd of chasmosaurs is jittery.  They face an even greater danger.  Tyrannosaurs in F-14s.  Playing with his toys, Calvin thinks this is so cool.  Hobbes thinks it's so stupid.
    characters: [calvin, hobbes]
    source: s-anand+seligman+miraheze
  "19950102":
    transcript: How are you doing on your New Year's resolutions? I didn't make any. See, in order to improve oneself, one must have some idea of what's "good". That implies certain values. But as we all know, values are relative. Every system of belief is equally valid and we need to tolerate diversity. Virtue isn't "better" than vice. It's just different. I don't know if I can tolerate that much tolerance. I refuse to be victimized by notions of virtuous behavior.
    description: Hobbes asks Calvin how he's doing on his New Year's resolutions.  Calvin didn't make any.  He says to improve oneself, one must have an idea of what "good" is.  Calvin explains values are relative.  Virtue isn't "better" than vice, just different.  Hobbes isn't sure he can tolerate that much tolerance.  Calvin refuses to be victimized by notions of virtuous behavior.
    characters: [calvin, hobbes]
  "19950103":
    transcript: No! No! No! I need more sleep! I c-can't keep m-my eyes open! Bed?! Already?? But I'm wide awake!! My internal clock is on Tokyo time.
    description: Mom tries pulling Calvin out of bed while he yells that he needs more sleep.  In school, Calvin can't keep his eyes open.  As Mom takes him upstairs to bed, Calvin yells that he's wide awake.  In bed, Calvin says his internal clock is on Tokyo time.
    characters: [calvin, mom]
  "19950104":
    transcript: I sure am great! I'm one of the greatest people who ever lived! How lucky people are to know someone as great as me! I'm great in so many ways! In fact, I'm so great that my greatness is... You're not great! You're the most conceited blowhard I've ever met! When you're great, people often mistake candor fo bragging.
    description: Standing at the bus stop, Calvin tells Susie he's one of the greatest people who ever lived.  He goes on to say he's great in so many ways.  Susie yells that he's not great.  She says he's the most conceited blowhard she's ever met.  Calvin says when you're great, people often mistake candor for bragging.
    characters: [calvin, susie]
  "19950105":
    transcript: Here, I'll hang up your coat. Thanks. If you've been looking for Hobbes, he somehow got put in the closet. I just found him way back in there. Waiting for me in the CLOSET, eh? Too bad your little plan was THWARTED!! Why don't you hang up your coat yourself?!
    description: Mom takes Calvin's coat to hang it.  She returns and tells him that Hobbes got put in the closet.  Mom found him in there.  Calvin scolds Hobbes for waiting in the closet for him.  He says it's too bad Hobbes' plan was thwarted.  Grumpily, Hobbes tells Calvin he should hang is coat up himself.
    characters: [calvin, hobbes, mom, stuffedhobbes]
  "19950106":
    transcript: Oh yeah? Define, "well-adjusted".
    description: A big snow chicken has an axe it has stuck into a stump.  Next to the stump, a snowman lies with its head on the ground to one side.  Mom is standing next to Calvin.  Calvin asks Mom to define "well-adjusted".
    characters: [calvin, dad]
  "19950107":
    transcript: Why does man create? Is it man's purpose on Earth to express himself, to bring form to thought, and to discover meaning in experience? Or is it just something to do when he's bored?
    description: Standing next to a snowman, Calvin asks why man creates.  He asks if it's to express himself, to bring form to thought and discover meaning in experience.  He ponders.  Then Calvin asks if it's just something to do when he's bored.
    characters: [calvin]
  "19950108":
    transcript: I'm bored. Let's go in. But we've only been out here a few minutes. This is taking too long. What's the hurry? We've got all day! Yeah, but it's kind of cold, and the sun's too bright, and my gloves are getting wet. And when you think about it, building a snowman is a lot of work. I didn't come here to do something hard. Besides, what if the snowman doesn't come out very good? We'd be failures! Who wants to be a failure?! Or even if it's good, what's the point? It's just going to melt in a few weeks anyway! It's all futile! So instead of wasting my time, I'm going to go inside, pull down the shades and watch TV. That way, in complete physical comfort, I can vicariously experience the activity of actors pretending to do things! Are you sure it's not too much trouble to turn on the TV? That's why we have a remote control. Virtual reality is already here. I can't believe the only way to get inside is by WALKING.
    description: Calvin is bored making a snowman.  Hobbes says they've only been outside a few minutes.  Calvin says it's taking too long.  Hobbes says they have all day.  Calvin says the sun's too bright and his gloves are getting wet.  He says making a snowman is hard work.  He asks Hobbes what happens if the snowman isn't very good.  They'd be failures.  He says even if it's good, it will melt in a few weeks.  Instead of wasting his time, he's going inside to watch TV.  He'll be in complete physical comfort while experiencing the activity of actors pretending to do things.  Hobbes asks if it's too much trouble to turn on the TV.  Calvin replies that's why they have a remote control.  Hobbes says virtual reality is already here.  Calvin can't believe the only way to get inside is to walk.
    characters: [calvin, hobbes]
    source: s-anand+seligman+miraheze
  "19950109":
    transcript: 1. Explain Newton's First Law of Motion in your own words. Yakka foob mog. Grug pubbawup zink wattoom gazork. Chumble spuzz. I love loopholes.
    description: Calvin looks at his test asking him to explain Newton's First Law of Motion in his own words.  He brightens up and replies with made-up words like "foob", "mog", "zink", and "spuzz".  He sits back saying he loves loopholes.
    characters: [calvin]
  "19950110":
    transcript: I'm ready for anything! Are you ready for unconditional surrender? That above all else.
    description: In his snow fort, Calvin says he's ready for anything.  A barrage of snowballs blasts him.  Hobbes asks if he's ready for unconditional surrender.  Lying under a pile of snowballs, Calvin replies "that above all else".
    characters: [calvin, hobbes]
  "19950111":
    transcript: BRBBBBRBBBB. Their tummies shouldn't be so soft and fuzzy if you're not allowed to do that.
    description: Calvin peeks around a corner.  Hobbes is lying on the floor.  Calvin blows on Hobbes' belly, making a loud noise.  Hobbes is startled.  Calvin, all scratched up, walks away saying their tummies shouldn't be so soft and fuzzy if you're not allowed to do that.
    characters: [calvin, hobbes]
  "19950112":
    transcript: "... and so, with nothing left to life for, he obeys the chanted command from the distant crowd below."
    description: Calvin is leaning out the attic window with a little snowman.  He is looking at the ground below, where dozens of snowmen stand.  Calvin says that with nothing to live for, the snowman obeys the chanted command from the crowd below.
    characters: [calvin]
  "19950113":
    transcript: "Next, on Eyewitness action news: blood-spattered sidewalks and shroud-covered bodies! Could the next victim be YOU?? We'll get the story from the sobbing, hysterical relatives and we'll tell you why YOU should be paralyzed with helpless fear! That's Eyewitness action news! It's what YOU need to KNOW!"
    description: Dad is watching television.  The announcer talks about blood-spattered sidewalks and asks if you could be the next victim.  The television announcer continues by saying they'll get the story from sobbing relatives and tell why you should be paralyzed with helpless fear.  That's Eyewitness News.  It's what you need to know.  Dad turns off the television and reads the newspaper instead.
    characters: [dad]
  "19950114":
    transcript: When I grow up, I'm going to be a scientist. I'll dedicate my career to the proposition that man can reshape the Universe according to his own whims. I'll probably go into genetic engineering and create new life forms. You want to play God? Not exactly. God never bothered to patent his stuff.
    description: Sledding down the hill, Calvin tells Hobbes he will grow up to be a scientist.  He will dedicate his career to the proposition that man can reshape the universe.  He says he'll probably go into genetic engineering and create new life forms.  As they crash into a tree and fly through the air, Hobbes asks Calvin if he wants to play God.  Calvin replies "not exactly".  He says God never bothered to patent his stuff.
    characters: [calvin, hobbes]
  "19950115":
    transcript: Brrrr! I'm freezing! You need a nice fur coat like mine. I'm all toasty. I'll just put my feed on your back, OK? Ooh, you ARE warm! GAAA! Quit thrashing around! You're letting in cold air! Well keep your icy feet on your own side of the bed then! They WERE! Your big behind was on MY side! THAT's your side! THIS is the demilitarized zone and THIS is MY side! All THAT?! No way, you hog! In fact, the whole bed is my side! Animals should sleep on the floor! Oh, THAT does it! You and your hairless pink monkey suit can freeze solid! I'm leaving! HEY! Don't take the blanket! COME BACK HERE! I'LL GET YOU! GIMME THAT! ...now where'd he go?? AAAAAA GAAAA! SOMEBODY'S FEET ARE LIKE ICE!! Calvin had another nightmare. If it's two crowded, you guys are welcome to sleep downstairs.
    description: Calvin is freezing in bed.  Hobbes tells him he should have a fur coat like his.  Calvin puts his feet on Hobbes to warm up.  Hobbes jumps.  Calvin tells him to quit letting cold air in.  Hobbes tells Calvin to keep his cold feet on his side of the bed.  Calvin protests that Hobbes' behind was on his side.  Hobbes indicates the demilitarized zone between their sides.  Calvin claims the whole bed and says animals should sleep on the floor.  Hobbes takes the blanket and leaves.  The sounds of their fighting is heard by Mom.  Calvin is looking for Hobbes when a ghostly apparition rises before him.  Calvin yells in terror.  Hobbes has the bed to himself.  Dad is awakened by icy cold feet.  Calvin is in bed with him and Mom.  Mom tells Dad that Calvin had a nightmare.  Calvin says that if it's too crowded, they are welcome to sleep downstairs.
    characters: [calvin, hobbes, mom, dad]
    source: s-anand+seligman+miraheze
  "19950116":
    transcript: Some days you get up and you already know that things aren't going to go well. They're the type of days when you should just give in, put your pajamas back on, make some hot chocolate, and read comic books in bed with the covers up until the world looks more encouraging. Of course, they never let you do that. Is today one of those days? IT SURE IS!!
    description: Waiting for the bus, Calvin tells Hobbes you get up some days and know some things aren't going to go well.  Calvin says those are the days you should put your pajamas back on, make hot chocolate, and read comic books in bed until the world looks more encouraging.  Grumpily, Calvin says they never let you do that.  Hobbes asks if today is one of those days.  Calvin yells that it sure is.
    characters: [calvin, hobbes]
  "19950117":
    transcript: On gray days, when it's snowing or raining, I think you should be able to call up a judge and take an oath that you'll just read a good book all day, and he'd allow you to stay home. So you'd only go to school on sunny days? Well no, on sunny days he judge would let you play outside. He's quite a guy. He'd make you go to school if it was hot, hazy, and humid with a lot of bugs.
    description: Still waiting for the bus, Calvin says on gray days, you should be able to call a judge and take an oath that you'll read a good book, and he'd allow you to stay home.  Hobbes asks if he'd only go to school on sunny days.  Calvin says on those days, the judge would let you play outside.  Hobbes comments that the judge is quite a guy.  Calvin says he'd make you go to school if it was hot, hazy, and humid with a lot of bugs.
    characters: [calvin, hobbes]
  "19950118":
    transcript: Pssst! What's 7+6? Three hundred billion gazillion. Oh, thanks for the big help! That's a three, followed by 85 zeroes. Ah! I knew that.
    description: Calvin asks Susie what 7 + 6 is.  Susie tells him three hundred billion gazillion.  Sarcastically, Calvin thanks her for the big help.  Susie tells him that is a three, followed by 85 zeroes.  Calvin writes it down, saying he knew that.
    characters: [calvin, susie]
  "19950119":
    transcript: I'm thinking of starting my own talk radio show. I'll spout simplistic opinions for hours on end, ridicule anyone who disagrees with me, and generally foster divisiveness, cynicism, and a lower level of public dialog! It would seem you were born for the job. Imagine getting PAID to act like a six-year-old!
    description: Calvin says he's thinking of starting his own talk radio show.  He'd spout simplistic opinions for hours, ridicule anyone who disagrees, and foster divisiveness, cynicism, and a lower level of public dialog.  Hobbes says it seems Calvin was born for the job.  Calvin asks Hobbes to imagine being paid to act like a six-year-old.
    characters: [calvin, hobbes]
  "19950120":
    transcript: Heh heh heh heh heh heh heh heh heh Oh boy Oh boy Oh boy HA HA HA HA HA HA. Obviously I've tapped into some primeval well of the human psyche.
    description: Calvin makes a snowball and starts chuckling.  He continues to laugh as he finishes the snowball.  He stops.  He looks at the snowball and says that obviously he's tapped into some primeval well of the human psyche.
    characters: [calvin]
  "19950121":
    transcript: Snow sharks? That guy's a goner.
    description: Calvin builds a snowman, looking like he's swimming.   Behind the snowman, he builds small curved mounds.  Hobbes asks if they're snow sharks.  Calvin says the guy is a goner.
    characters: [calvin, hobbes]
  "19950122":
    transcript: Sighhh... I wish I could go to the moon. I wish you could too. Dear...
    description: Calvin, the astronaut, hops out of the space lander.  He hops in the lunar rover and drives around the surface of the moon.  From space, you can read "Calvin is great" in tire tracks on the surface of the moon.  Calvin looks at the moon with binoculars.  He tells Dad he wishes he could go to the moon.  Dad says he wishes Calvin could, too.  Mom, offscreen, chides him.
    characters: [calvin, mom, dad]
    source: s-anand+seligman+miraheze
  "19950123":
    transcript: Look at my new invention, Dad! I unraveled a hanger and poked it out the back of my pants to make a tailhook! Now, with a rope stretched across the doorway, I can blast into a room at top speed, and the hook will grab the rope and stop me before I crash out the window on the opposite wall! Well? Don't just sit there, man! Get out some patent applications! I wonder how many fortunes he's let slip through his fingers.
    description: Calvin shows Dad his new invention, a hanger poked out the back of his pants to make a tailhook.  He says with a rope stretched across the doorway, he can blast into a room, and the hook will grab the rope and prevent him from crashing out the window.  He tells Dad to get some patent applications.  Calvin walks away wondering how many fortunes Dad has let slip through his fingers.
    characters: [calvin, dad]
  "19950124":
    transcript: As an artist, I'll speak to future generations long after I'm gone! Smart thinking. I call this, "Nude descending a staircase."
    description: Calvin tells Hobbes that as an artist, he'll speak to future generations after he's gone.  Calvin shows his latest snow sculpture.  It's a snowman with a rear end crack at the top of an icy set of stairs.  Calvin calls it "nude descending a staircase".
    characters: [calvin, hobbes]
  "19950125":
    transcript: Everything is so darn hard! I wish I could just take a pill to be perfect and I wish I could just push a button to have anything I want. The American dream lives on. Why should I have to WORK for everything?! It's like saying I don't deserve it!
    description: Calvin is reading and complains everything is too hard.  He wishes he could take a pill to be perfect.  He wishes he could push a button to have whatever he wanted.  Hobbes says the American dream lives on.  Calvin asks why he should have to work for everything.  It's like saying he doesn't deserve it.
    characters: [calvin, hobbes]
  "19950126":
    transcript: Look, it's almost 11 o'clock! Wow, the last two hours really flew by! I hope the teacher didn't say anything important.
