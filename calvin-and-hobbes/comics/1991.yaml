  "19931010":
    transcript: AHHHHHHHH HUHHN...GH KAWUNCH! Hehh huhh hehh huhh
    description: Dad rakes the leaves into a pile and walks away.  The pile of leaves rises up, groaning, and chases Calvin.  It catches up to him and crashes down on him.  Calvin digs his way out, panting.  Dad sees the pile of leaves lying all scattered and raises his hands in protest.  Calvin raises his hands in protest that he didn't do it.
