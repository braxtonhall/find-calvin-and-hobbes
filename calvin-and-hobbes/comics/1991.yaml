  "19931004":
    transcript: I love my school books. Just think! Pretty soon we'll have read ALL of this! I like to read ahead and see what we're going to learn next. It's so exciting to know stuff. Having a book is like having a good friend with you. If you flip the pages of MY book, an animated T.Rex drives the batmobile and explodes! Sometimes I think books are the only friends worth having.
    description: Susie tells Calvin she loves her school books.  She likes to read ahead to see what comes next.  She says having a book is like having a good friend with you.  Calvin says if you flip the pages of his book, an animated T-rex drives the Batmobile and explodes.  Susie says sometimes books are the only friends worth having.
    characters: [calvin, susie]
  "19931005":
