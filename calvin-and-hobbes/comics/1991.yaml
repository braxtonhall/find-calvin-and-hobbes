  "19940302":
    transcript: I saw a sing on a restaurant door that said, "No shirt, no shoes, no service." But it didn't say anything about PANTS! If I went in wearing shoes and a shirt, but no pants, they'd have to serve me! They'd probably serve you with a court summons. C'mon, let's see if Mom will take us out for dinner!
    description: Calvin tells Hobbes he saw a sign that said "no shirt, no shoes, no service".  He goes on to say it didn't say anything about pants.  He thinks they'd have to serve him if he had shoes and a shirt, but no pants.  Hobbes thinks they'd serve him with a court summons.  Calvin pulls off his pants and asks Hobbes to join him to see if Mom will take them out for dinner.
