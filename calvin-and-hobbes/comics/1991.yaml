strips:
  "19910101":
    transcript: "*GASP* I (pant, pant) MADE it! *GASP* What's with you? I thought you were out building a snowman. I did (pant, pant), but I brought him to life (pant, pant) and now he's after me! I barely escaped! Uh huh. Lookout the window! He's probably lurching around the yard! Good heavens, you build a snowman right on the front step?! How are we going to get out the door?! AUGHH! He's looking in! he knows where I live!!"
    description: Calvin runs inside, gasping for air.  Calvin tells Mom he built the snowman, but then he brought it to life. Now, the snowman is after Calvin.  Calvin tells Mom to look out the window.  Mom looks and sees the snowman on the front step.  She asks how they'll get out the door.  Horrified, Calvin says he's looking in and now knows where he lives.
    characters: [calvin, mom]
  "19910102":
    transcript: You brought a snowman to LIFE?? I didn't think he'd be evil! What are we going to do? I dunno, but we've got to get rid of him somehow. Maybe we could lure him inside and he'd melt! It would take him HOURS, and if he didn't kill Mom, she'd have a fit about the water on the floor. Hmm... how did they finally kill "Frosty"? Beats me. Now I wish I'd watched that dumb show! Maybe they stabbed him with an icicle.
    description: Calvin and Hobbes hide behind a tree.  Calvin didn't know the snowman he brought to life would be evil. He knows they have to get rid of it.  Hobbes suggests luring him inside so he'd melt.  Calvin rejects that idea.  It would take hours, it might kill Mom, and if it didn't, Mom would have a fit about the water on the floor.  Hobbes asks how they finally killed "Frosty".  Calvin wishes he'd watched that show.  He suggests maybe they stabbed him with an icicle.
    characters: [calvin, hobbes]
  "19910103":
    transcript: Yikes! There he is! Pack snowballs! Maybe we can knock him out! Yaa! Yaaa! UNGHH! The snowballs just STUCK to him! Look, it's given him an idea! He's packing more snow onto himself! He's making himself bigger! Oh NO!
    description: Hiding behind a tree, Calvin and Hobbes attack the snowman with snowballs.  They stick to the snowman. That gives the snowman an idea.  He starts packing more snow onto himself, making himself bigger.
    characters: [calvin, hobbes]
  "19910104":
    transcript: He keeps packing more snow on himself! He's getting huge! This is really creepy. Now he's made a big snowball and he's putting rocks and sticks in it! I wonder what he's making. Ewww! He's giving himself two weird heads!! Any time the sun wanted to come out, it would be just fine with me. NOW he's added another ARM! He's turned himself into a deranged mutant killer monster snow goon!!
    description: The snowman packs more snow onto himself.  It makes a big snowball and puts rocks and sticks onto it. The snowman has given himself another head.  Hobbes says anytime the sun wants to come out is alright with him.  Calvin notices the snowman has added another arm.  It's turned itself into a deranged mutant killer monster snow goon.
    characters: [calvin, hobbes]
  "19910105":
    transcript: The snow goon is lumbering off toward the front yard! Let's cut around the house and build a fort! What do you suppose it's going to do? I don't know, but whatever it is, we're going to need protection! Calvin, that snowman out front is hideous. Why can't you make a NORMAL snowman? I tried, Dad. I tried.
    description: The snow goon goes to the front yard.  Calvin and Hobbes cut around the house to build a snow fort. Calvin doesn't know what the snow goon is going to do, but he knows they're going to need protection.  Dad tells Calvin the snowman out front is hideous.  He asks why Calvin can't build a normal one.  Calvin replies that he tried.
    characters: [calvin, hobbes, dad]
  "19910106":
    transcript: I'M HO-OME! A tiny snowman! Why are you down there without a coat? Me? No reason.
    description: Calvin builds a snowman on the porch.  He puts his coat and hat on the snowman.  He yells that he's home and hides next to the porch.  Hobbes opens the door, sees the snowman, then asks why Calvin is on the ground without his coat.  He says no reason.  Calvin puts his coat and hat back on, kicks the snowman off the porch, starts to open the door, and Hobbes pounces on him.
    characters: [calvin, hobbes]
    source: s-anand+seligman+miraheze
  "19910107":
    transcript: This will be the strongest snow fort ever built! Ughh ngghh rghh mnhg UNNHH. There! We're safe from that snow goon NOW! I wonder why we haven't seen him for a while.
    description: Calvin and Hobbes are building their snow fort.  The snow goon makes another snow goon.  Calvin, in their snow fort, says they're safe now.  Hobbes wonders why they haven't seen him for awhile.
    characters: [calvin, hobbes]
  "19910108":
    transcript: Hi Calvin. Nice snow fort. I'll say! The walls are two feet thick and we've got snowballs in here! Who are you fighting? There's a snow goon running loose! If I were you, I wouldn't stick around. This could get ugly. What's a snow goon? It's like a snow man, but a grotesque, evil, demented monster. Oh, is THAT what all those ugly things you made in the front yard are? What do you mean, "all those"?
    description: Susie comments on Calvin's snow fort.  Calvin tells her the walls are two feet thick and they have fifty snowballs.  Susie wonders who he's fighting.  Calvin tells her there's a snow goon running loose.  Susie asks what a snow goon is.  Calvin explains it's like a snowman, but it's an evil, grotesque, demented monster.  She asks if that's what all those ugly things in the yard are.  Calvin asks what she means by "all those".
    characters: [calvin, hobbes, susie]
  "19910109":
    transcript: Look, a NEW snow goon! That's not the one I made! The original snow goon must be making his OWN snow goons! OH NO! I'll bet he's making an army! In a few days, he could build a hundred snow goons! If each of THEM build ANOTHER hundred, and then THOSE all build a hundred MORE, why... that would be pretty cool, if they weren't out to kill me. I vote we make tracks for Florida.
    description: There's a new snow goon, but it's not one Calvin made.  He says the original snow goon must be making his own.  Calvin fears he's making a snow goon army.  He speculates how many there would be if the original made a hundred snow goons, then each of them makes their own goons.  Calvin thinks that would be cool, if they weren't out to kill him. Hobbes suggests making tracks for Florida.
    characters: [calvin, hobbes]
  "19910110":
    transcript: Calvin, it's late! Time to come in! I can't, Mom! I've got to kill snow goons! You can kill them tomorrow after school. C'mon inside. But by tomorrow, there will be more of them! Let's go, Calvin. Moms and reason are like oil and water.
    description: Mom yells for Calvin to come inside, it's late.  Calvin replies that he has to stay to kill snow goons.  Mom says he can kill them after school tomorrow.  Calvin warns there will be more of them then.  Mom tells Calvin to come in.  As he heads to the house, Calvin says that Moms and reason are like oil and water.
    characters: [calvin, hobbes, mom]
  "19910111":
    transcript: Can you see the snow goons out there? Yeah. They're still making more of each other. How many did you see? About 15. Man, how am I going to school tomorrow? I'll never even make it to the bus stop! I can't outrun 15 snow goons! I'm as good as dead! Sweet dreams. Yeah, right! Can I take an ax to school tomorrow for ... um... show and tell?
    description: In bed, Calvin asks Hobbes if he sees any snow goons outside.  He says they're still making more.  There are about fifteen now.  Calvin doesn't think he'll even make it to the bus stop tomorrow.  He is sure the snow goons will catch him. Mom kisses Calvin good night.  Calvin asks her if he can bring an ax to school tomorrow....for show and tell.
    characters: [calvin, hobbes, mom]
  "19910112":
    transcript: The snow goons aren't moving! They're asleep! Now's our chance to go bump 'em off! We can't go outside NOW! It's 10 o'clock at night! Oh yeah. Mom and Dad are still up. We'll have to wait at least an hour.
    description: At night, Calvin looks out his window to see the snow goons aren't moving.  They're asleep.  Calvin thinks this will be their best chance to bump them off.  Hobbes says they can't go out now, it's 10:00 at night.  Calvin says Mom and Dad will still be up.  They'll have to wait at least an hour.
    characters: [calvin, hobbes]
  "19910113":
    transcript: Hey Hobbes! ... Hobbes! It's bedtime. Ooh, I wouldn't have wanted to sleep through THAT. I wonder why we dream when we sleep. Do our brains get bored? I wonder why we don't just plain sleep. I think we dream so we don't have to be apart so long. If we're in each other's dreams, we can plan together all night. Hey, yeah! Well, I'll see you in a few minutes, ol' buddy! I'll be there! Z Z
    description: Calvin wonders why he dreams when he sleeps.  He asks Hobbes if their brains get bored.  He wonders why they don't just sleep.  Hobbes thinks they dream so they don't have to be apart so long.  If they are in each other's dreams, they can play all night.  Calvin thinks that sounds right.  Calvin says he'll see Hobbes in his dreams in a few minutes. Hobbes says he'll be there.  They roll over to sleep.  They're asleep with smiles on their faces.
    characters: [calvin, hobbes]
    source: s-anand+seligman+miraheze
  "19910114":
    transcript: Shh! Shh! Shh! Shh! Shh! Shh! HA HA HA! DIE SNOW GOON, DIE!
    description: Calvin and Hobbes quietly come down the stairs, saying "Shh" to each other.  They get dressed to go outside, saying "Shh" to each other.  They leave the house, saying "Shh" to each other.  Mom and Dad are startled awake by Calvin yelling for the snow goon to die.
    characters: [calvin, hobbes, mom, dad]
  "19910115":
    transcript: More water, Hobbes! We'll freeze the snow goons right where they snooze! Die! Die! Let out more hose! Ha ha! These monsters will be popsicles through July! There! We got 'em all! I'll spray a little extra water around, just to make sure everything's absolutely frozen. Psst, Calvin! Your parents' light is on! I think your Dad's coming! Uh oh! Maybe I should get HIM with the hose, too.
    description: Calvin is spraying water over the snow goons.  He says he'll freeze them where they snooze.  He walks through the yard spraying water all over.  He covers all the snow goons, then sprays some more water around to be sure everything's frozen.  Hobbes notices Mom and Dad's light is on.  He tells Calvin that he thinks Dad is coming.  Calvin wonders if he should spray Dad, also.
    characters: [calvin, hobbes]
  "19910116":
    transcript: That IS Calvin! He's outside with the garden hose! It's after midnight! What do we have to do, CHAIN him in bed?! CALVIN GET IN HERE! WHAT DO YOU THINK YOU'RE WAAUGHH! THE WHOLE YARD'S ICE! Run, Hobbes! Dad's a snow goon too!
    description: Mom and Dad get out of bed.  Mom sees Calvin outside with the garden hose.  Dad runs outside yelling for Calvin to come inside.  He slips on the ice created by Calvin's watering and slides across the yard.  Calvin runs off with Hobbes while being chased by Dad, who is covered with snow.  Calvin yells that Dad is a snow goon, too.
    characters: [calvin, hobbes, mom, dad]
  "19910117":
    transcript: Dad, don't kill me! I can explain this! Help! Help! Snow goons! I froze 'em! They were going to GET me, so I had to get them first! Ask Hobbes! Calvin, it is after midnight. Believe me, we will discuss this VERY thoroughly tomorrow. You get into bed this instant. Like I'm going to get any sleep NOW.
    description: Dad carries Calvin into the house.  Calvin says he can explain.  He tells Mom that he had to freeze the snow goons or they would have gotten him.  Dad tells Calvin it's after midnight.  He says they'll discuss it very thoroughly tomorrow. He sends Calvin to bed.  Wide-eyed, Calvin tells Hobbes he's not going to get any sleep now.
    characters: [calvin, hobbes, mom, dad, stuffedhobbes]
  "19910118":
    transcript: See?? See the snow goons? I didn't make them! I mean, I made ONE, sort of by accident, but the rest made themselves! They were building an army, see? See, that's why I had to freeze them last night! I had to get 'em while they were sleeping! It was my only chance, see? See, it all makes sense! See? See?? They never see.
    description: Calvin explains to Mom and Dad how the snow goons were building an army.  He asks if they see.  He explains he had to freeze them while they were sleeping.  He asks if they see.  He says it all makes sense.  He asks if they see. Mom and Dad just look at Calvin.  Sitting on his bed, Calvin tells Hobbes they never see.
    characters: [calvin, hobbes, mom, dad]
  "19910119":
    transcript: Well, Hobbes, I guess there's a moral to all this. What's that? Snow Goons are bad news. That lesson certainly ought to be inapplicable elsewhere in life. I like maxims that don't encourage behavior modification.
    description: As the snow goons melt, Calvin tells Hobbes there's a moral to all this.  He says "snow goons are bad news".  Hobbes says that lesson certainly ought to be inapplicable elsewhere in life.  Calvin tells him he likes maxims that don't encourage behavior modification.
    characters: [calvin, hobbes]
  "19910120":
    transcript: His stabilizers useless, his fuel about to explode, our hero careens out of control over a strange, unexplored planet! Yes, it's just another typical day for the incredible Spaceman Spiff! Zorched by Zarokes, Spaceman Spiff's crippled craft crashes on Platet Plootarg! Dazed but undaunted, our fearless hero sets off in search of a service station! Zounds! The zealous zarches have followed Spiff to the planet's surface to finish him off! With a sudden chill, our hero realizes the planet's soft granular ground makes him easy to track! Thinking quickly, Spiff runs backward, so his tracks show him going the opposite direction! By continuing past a hiding place and doubling back, our hero fools the hideous aliens! CALVIN! It's time to come in! We know he went this way. We'll find him.
    description: Spaceman Spiff crashes on Planet Plootarg.  He sets off in search of a service station.  He sees the Zarches have followed him to the planet's surface to finish him off.  The planet's soft, granular ground makes him easy to track.  He runs backwards, so his tracks show him going the opposite direction.  By continuing past a hiding place and doubling back, Spiff fools the aliens.  Calvin, up in a tree, looks down at Mom and Dad.  They're yelling that it's time to go in.  Dad says he knows Calvin went this way, and that they'll find him.
    characters: [calvin, mom, dad, spiff]
    source: s-anand+seligman+miraheze
  "19910121":
    transcript: You have to admit it's slowed down the traffic on our road.
    description: There is a snowman with a hole shot in him from a cannon behind.  There is a snowman with a shovel, looking at the ground where the head of another snowman lies.  Calvin has another snowman on a chair with a noose around its neck.  Looking out the kitchen window, Dad tells Mom that she has to admit it's slowed down the traffic on their road.
    characters: [calvin, mom, dad]
  "19910122":
    transcript: CALVIN!
    description: Calvin has shoveled the front steps of the house.  He has also shoveled a meandering path around the yard, going around trees, before heading toward the driveway.  Dad, standing on the steps wanting to get to the car in the driveway, yells at Calvin for not just shoveling the sidewalk over to the driveway.
    characters: [calvin, dad]
  "19910123":
    transcript: Any luck? I'm so disappointed. HEY JET PILOTS! DO A BARREL ROLL!
    description: Calvin is walking in the snow, clearing a path.  He jumps over to start another path.  He starts still another. Hobbes asks if he's had any luck.  Calvin says he's so disappointed.  In the snow, Calvin has made a message to jet pilots to do a barrel roll.
    characters: [calvin, hobbes]
  "19910124":
    transcript: WHAP!! Did you throw that?! Who, me? Who, ME? Who?! Me?? WHO... me?! Who, me???
    description: WHAP!  Susie gets hit in the back of the head with a snowball.  She angrily asks Calvin if he threw that. Calvin points to himself and asks "Who, me".  Calvin lies face down in the snow, seeing stars.  At home, he stands in front of a mirror practicing saying "Who, me" to sound more convincing next time.
    characters: [calvin, susie]
  "19910125":
    transcript: If we go fast enough and pull up just as we hit those rocks, we might, if we're lucky, clear the ravine and have the ride of our lives! On the other hand, if we miss, we'll probably spend our few remaining days hooked up to machines and intravenous fluids! It's either spectacular, unbelievable success, or crushing, hopeless defeat! There's no middle ground! OK, there IS a middle ground, but it's for sissy weasels.
    description: Calvin and Hobbes sit on the toboggan at the top of the hill.  Calvin speculates that if they go fast enough and pull up just as they hit the rocks, they might clear the ravine and have the ride of their lives.  He goes on to say if they miss, they'll spend their remaining days hooked up to machines and intravenous fluids.  He raises his fist and says it's either spectacular, unbelievable success, or crushing, hopeless defeat.  There is no middle ground.  Later, inside the house, Hobbes is lying in front of the fireplace reading a comic book.  Calvin walks up to him and admits there is a middle ground, but it's for sissy weasels.
    characters: [calvin, hobbes]
  "19910126":
    transcript: ""
    description: Calvin throws a snowball.  Hobbes walks over to Calvin while brushing off snow from his shoulder.  Calvin looks worried.  Hobbes grabs Calvin and packs snow around him.  Calvin is stuck, rolled up in the middle of a big snowball.
    characters: [calvin, hobbes]
  "19910127":
    transcript: Let's just sit here a moment... and savor the impending terror. Here we are, perched at the peak of Mount Maim! Why? Because I like to experience life to the fullest! I say you don't fully APPRECIATE life until you risk losing it! I like to stare death straight in the eye and make him blink! If your adrenalin isn't pumping, you're not really living! Right? Actually, I think real living is sitting by a fire, slurping marshmallows from the bottom of a mug of hot cocoa.
    description: Calvin and Hobbes are on the sled at the top of Mount Maim.  Calvin says he likes to experience life to the fullest.  He likes to stare death in the eye and make him blink.  He looks back at Hobbes and asks him if he thinks he's right. Hobbes tells him real living is sitting by a fire, slurping marshmallows from the bottom of a mug of hot cocoa.  They sit on the sled.  Next, we see them sitting by the fireplace, slurping from their mugs of cocoa.
    characters: [calvin, hobbes]
    source: s-anand+seligman+miraheze
  "19910128":
    transcript: C'mon, Calvin! Get up or you'll be late for school. Today my SPIRIT is going to school while my body stays in bed. Now my spirit is in bed.
    description: Calvin is still in bed when Mom tells him to get up or he'll be late for school.  Calvin sits up and informs Mom that his spirit is going to school while his body stays in bed.  Later, Calvin is tossed out the door.  Standing on the corner, Calvin grumpily says now his spirit is in bed.
    characters: [calvin, hobbes, mom]
  "19910129":
    transcript: Jump... jump... jump... jump... jump... jump... jump... jump... jump! I win! You've only won in the outward manifestation of this game. My SPIRIT is still unvanquished. That's 165 straight games you've lost. My spirit is kicking the spirit of your checkers clear across the room.
    description: Calvin and Hobbes are playing checkers.  Hobbes jumps several of Calvin's pieces and wins.  Calvin informs Hobbes he has only won the outward manifestation of the game.  His spirit is still unvanquished.  Hobbes tells him he's lost 165 straight games.  Calvin tells Hobbes his spirit is kicking the spirit of Hobbes' checkers clear across the room.
    characters: [calvin, hobbes]
  "19910130":
    transcript: Who would like to summarize what we just read? Calvin? How about you? Sorry! I'm here against my will. I refuse to cooperate. They can transport my BODY to school, but they can't chain my SPIRIT! My spirit roams free! Walls can't confine it! Laws can't restrain it! Authority has no power over it! Calvin, if you'd put half the energy of your protests into your schoolwork... You can try to leave a message, but my spirit screens its calls.
    description: Miss Wormwood asks if Calvin would like to summarize what they read in class.  Calvin declines, saying he's here against his will.  He refuses to cooperate.  He shakes his fist and says they can transport his body to school, but they can't chain his spirit.  Walls can't confine it, laws can't restrain it, authority has no power over it.  Miss Wormwood tells Calvin that if he put half the energy into his protests into his schoolwork... Calvin interrupts her by saying she can try to leave a message, but his spirit screens its calls.
    characters: [calvin, wormwood]
  "19910131":
    transcript: Time for bed, Calvin. You can put my body to bed, but my spirit's going to stay right here, so why bother? Why shouldn't I just stay up? Because the body is the home of the spirit, and if you're not in bed in two minutes, your spirit is going to be permanently nomadic. Home sweet home.
    description: Dad tells Calvin it's time for bed.  Calvin tells him he can put his body to bed, but his spirit's going to stay playing.  He asks Dad why he shouldn't just stay up.  Dad explains that the body is the home of the spirit, and if he's not in bed in two minutes, his spirit is going to be permanently nomadic.  Calvin, in bed, says "home sweet home".
    characters: [calvin, dad]
  "19910201":
    transcript: There ought to be a law against having school on days when there's enough snow to play in. Of course, I don't think there should be school in FALL either... and summer's out altready... and then there's spring... I guess I'd go to school a day in November and a day in March. By second grade, you'd be packing your lunch box with denture cleaners. And before I got to third grade, I could reture.
    description: Standing on the corner, waiting for the school bus, Calvin tells Hobbes there ought to be a law against having school on days there is enough snow to play in.  Calvin goes on to say he doesn't think there should be school in the fall, either.  Summer's out already, then there is spring.  Calvin guesses he'd go to school a day in November and a day in March. Hobbes says that by second grade, he'd be packing his lunch box with denture cleaners.  Calvin finishes the thought by saying before he got to third grade, he could retire.
    characters: [calvin, hobbes]
  "19910202":
    transcript: Here comes the giant ship! AHWOOOOOO! AHWOOOOO! But what's this?! He's going full speed through the dangerous strait! The oil tanker crashed, Mom. You poured INK in the bath water??
    description: In the bathtub, Calvin plays with a toy ship.  He says the ship is going full speed through the dangerous strait.  He gets out of the tub and runs out of the bathroom.  He comes back with something in his hand.  Later, Mom is horrified to see that Calvin has poured ink in the bath water.  Calvin tells her the oil tanker crashed.
    characters: [calvin, mom]
  "19910203":
    transcript: Calvin suddenly realizes the world has no hue, value, or chroma! Have the photoreceptors in Calvin's eyes stopped working properly, or has the fundamental nature of light changed?? Perhaps some strange nuclear or chemical reaction on the sun has caused electromagnetic radiation to defy separation into a spectrum! Maybe objects no longer reflect certain wavelengths! Whatever the cause, it's clear to Clavin that there's no point in discussing things with his Dad! The problem is, you see everything in terms of black and white. SOMETIMES THAT'S THE WAY THINGS ARE!!
    description: Calvin's world suddenly has no hue, value, or chroma.  He asks if the photoreceptors in his eyes have stopped working, or has the fundamental nature of light changed.  Perhaps something has caused electromagnetic radiation to defy separation into a spectrum.  As he walks, he wonders if objects no longer reflect certain wavelengths.  Whatever the case, it's clear to Calvin that there's no point in discussing things with Dad.  Dad tells Calvin that his problem is, Calvin sees everything in terms of black and white.  Calvin angrily replies sometimes that's the way things are.
    characters: [calvin, dad]
    source: s-anand+seligman+miraheze
  "19910204":
    transcript: Look what I made, Hobbes. What is it? What IS it? Why, it's a huge bird foot. I'm going to press it in the snow and make everyone think a two-ton chickadee walked by. I guess time weighs more heavily on some people's hands than others'. He's just jealous because I accomplish so much more than he does.
    description: Calvin shows Hobbes a bird foot he made.  He tells Hobbes he's going to press it in the snow and make everyone think a two ton chickadee walked by.  Hobbes suggests time weighs more heavily on some people's hands than others'.  As Calvin presses the bird foot into the snow, he says Hobbes is just jealous because he accomplishes so much more than Hobbes.
    characters: [calvin, hobbes]
  "19910205":
    transcript: Hey Dad, you know how you wanted me to shovel the driveway? Well I thought up a BETTER idea! I'll shovel and pack the snow into a big ramp! You can get in the car, rev up to near red line, throw out the clutch, leave a patch of multen rubber out the garage, and zoom up the ramp! Then we could line barrells and stuff down the driveway and see how many you could clear! Wouldn't that be great?? I don't see why some people even HAVE cars.
    description: Calvin tells Dad he has a better idea for shoveling the driveway.  He'll pack the snow into a big ramp.  Then Dad can rev up the car, throw out the clutch, and leave a patch of molten rubber in the garage, then zoom up the ramp.  Calvin will have barrels down the driveway to see how many Dad can clear.  He thinks that would be great.  Apparently, Dad doesn't.  Calvin walks through the snow, shovel over his shoulder, not knowing why some people even have cars.
    characters: [calvin, dad]
  "19910206":
    transcript: AUGHHH! A SNOW SNAKE'S GOT ME! Horrible inner teeth on its separately moving upper jaw bones are pulling me down its frigid gullet! Run for your life! At least I HAVE a life... unlike some weirdos I know. I suppose if I had two X chromosomes, I'D feel hostile too.
    description: Calvin is lying inside the mouth of a snow snake.  Susie is walking by.  Calvin tells her about the horrible inner teeth pulling him into the snake's frigid gullet.  He tells Susie to run for her life.  Susie walks away saying she, at least, has a life...unlike some weirdos she knows.  Later, Calvin stands next to the snow snake saying that if he had two x chromosomes, he'd feel hostile, too.
    characters: [calvin, susie]
  "19910207":
    transcript: Too strict. Homework, no! Calvin's Dad unfair. Freedom. Later bedtimes, fewer baths. Egad! Bad Dad! No one ELSE at the office talks about this kind of thing.
    description: Dad pulls the car into the driveway to see several snowmen standing in the yard near the driveway.  The snowmen are carrying signs saying "Later bedtimes, fewer baths", "Egad, bad Dad", "Calvin's Dad unfair", and "Too strict". Dad says no one else at the office talks about this kind of thing.
    characters: [dad]
    source: seligman
  "19910208":
    transcript: I like sledding DOWN hills. But I hate having to climb back up! It's too much work! It's boring! It's slow! I know! I'll sit on the sled and you PULL me up, OK? Run as fast as you can, and zigzag around trees and stuff! Even my FRIENDS don't do what I want.
    description: Calvin tells Hobbes he likes to sled down hills, but he hates having to climb back up.  He says it's too boring and slow.  Calvin suggests he sit on the sled and have Hobbes pull him up the hill.  Hobbes would run as fast as he could, zigzagging around trees.  Hobbes walks off, leaving Calvin to lament not even his friends do what he wants.
    characters: [calvin, hobbes]
  "19910209":
    transcript: Calvin's been outside building something since early this morning. I can't tell what it is. Can you? It doesn't look like anything from here.
    description: Calvin is making something in the snow.  It looks like a raised zigzag pattern.  Mom and Dad look out from the window at Calvin, saying he's been working on it since early that morning.  They can't tell what it is.  From the window, it doesn't look like anything.  From above, we see that Calvin has been making an image of a monster getting ready to bite down on the house.
    characters: [calvin, mom, dad]
  "19910210":
    transcript: While lying on my back to make an angel in the snow, I saw a greenish craft appear! A giant UFO! A strange, unearthly hum it made! It hovered overhead! And aliens were moving 'round in view ports glowing red! I tried to run for cover, but a hook that they had low'r'd Snagged me by my overcoat and hoisted me aboard! Even then, I tried to fight, though they numbered many, I poked them in their compound eyes and pulled on their antennae! It was no use! They dragged me to a platform, tied me up, and wired to my cranium a fiendish suction cup! They turned it on and current coursed across my cerebellum, coaxing from my brain tissue the things I wouldn't tell 'em! All the math I ever learned, the numbers and equations, were mechanically removed in this brain-draining operation! My escape was an adventure. (I won't tell you what I did.) Suffice to say I cannot add, so ask some other kid.
    description: In rhyme, Calvin is lying in the snow, making an angel.  He sees a UFO.  The aliens snag Calvin with a hook on his overcoat and hoist him aboard.  He tries to fight away, but it's no use.  The tie him up and wired his cranium to a suction cup.  Current courses across his cerebellum, coaxing things from his brain tissue he wouldn't tell them.  All the math he ever learned were removed in this operation.  Calvin tells Miss Wormwood his escape was an adventure, but suffice to say, he cannot add, so she should ask some other kid.
    characters: [calvin, wormwood]
    source: s-anand+seligman+miraheze
  "19910211":
    transcript: There's Susie! Heh heh! Watch me knock her fillings loose! YAAA! PIFF You know, I THOUGHT Earth's gravity felt exceptionally strong today. I guess that explains how you spilled your oatmeal down the heater this morning.
    description: Calvin prepares a snowball to throw at Susie.  He tells Hobbes to watch him knock her fillings loose.  Calvin throws the snowball.  PIFF!  It falls a couple feet away.  They look at the fallen snowball.  Calvin tells Hobbes he thought earth's gravity felt exceptionally strong today.  Hobbes figures that explains why Calvin spilled his oatmeal down the heater that morning.
    characters: [calvin, hobbes]
  "19910212":
    transcript: Obviously I can't throw snowballs at Susie when Earth's gravity has increased. THIS is a job for... ...for? Mom must've put my cape in the wrong drawer!
    description: Calvin and Hobbes are still looking at the snowball.  Calvin says he can't throw snowballs at Susie if the earth's gravity has increased.  Calvin says "This is a job for..." and runs off.  Hobbes stands puzzled.  Hobbes goes back inside the house to see Calvin rummaging through his dresser drawers.  He has his Stupendous Man cowl on.  As he tosses clothes aside, he says Mom must have put his cape in the wrong drawer.
    characters: [calvin, hobbes, stupendous]
  "19910213":
    transcript: So who is this a job for? STUPENDOUS MAN! Mmf! Ghh! Super heroes wear snow pants? When there's snow out, they do! This looks like a REAL job for Stupendous Man! Well of course the zipper's going to get stuck if everyone stands around watching me!
    description: Hobbes asks Calvin who this is a job for.  Calvin replies "Stupendous Man".  Calvin struggles with his pants.  Hobbes asks if super heroes wear snow pants.  Calvin angrily replies they do when there's snow out.  Calvin is on his back, trying to get his pants on.  Hobbes looks down on him and says this looks like a real job for Stupendous Man.  Calvin tells Hobbes of course the zipper's going to get stuck if everyone stands around watching him.
    characters: [calvin, hobbes, stupendous]
  "19910214":
    transcript: Earth's excessive gravity is no match for STUPENDOUS MAN's stupendous strength! With muscules of magnitude, the masked man of might rolls a gigantic snowball... and flies it high into the stratosphere... where he uses his stupendous vision to locate the diabolical arch-fiend ANNOYING GIRL!
    description: Earth's excessive gravity is no match for Stupendous Man's strength.  The masked man of might makes a gigantic snowball, flies high into the stratosphere, where he uses his stupendous vision to locate the diabolical arch-fiend, Annoying Girl.  Susie is walking down the sidewalk.
    characters: [calvin, susie, stupendous]
  "19910215":
    transcript: From high in the sky, STUPENDOUS MAN takes advantage of Earth's strong gravity! A direct hit! STUPENDOUS MAN triumphs! With ANNOYING GIRL vanquished, the whirlwind wonder zooms back to resume his secret identity! Did you save  the day? Justice reigned once more! Calvin, Susie's Mom just called. I want to talk to you.
    description: Stupendous Man drops the snowball, taking advantage of earth's strong gravity.  Susie lies on the sidewalk, covered with the snowball.  Stupendous Man, sitting on a tree branch above, triumphs.  He zooms back to resume his secret identity.  Entering the bedroom, Hobbes asks Calvin if he saved the day.  Calvin tells him justice reigns once more.  From downstairs, one of Calvin's parents yells up that Susie's Mom just called.  Calvin is going to be talked to.
    characters: [calvin, hobbes, mom, susie, stupendous]
  "19910216":
    transcript: Susie's Mom says you dropped a snowball the size of a bowling ball on Susie from a tree. It couldn't have been ME! I'm very mild mannered. She described exactly the hood and cape I made you. Why, it must've been STUPENDOUS MAN, defender of liberty and justice! I'm sure Susie deserved whatever she got. Listen to me. You could hurt someone that way, and if I ever hear of anything like this again, I'll take away your costume for good, got it? Hmm, this sounds like ANOTHER job for Stupendous Man! Actually, it doesn't sound like QUITE his type of job.
    description: Mom is talking to Calvin.  She says Susie's mom said Calvin dropped a snowball the size of a bowling ball on Susie from a tree.  Calvin says it couldn't have been him.  He's mild-mannered.  Mom crosses her arms and says Susie's mom described the hood and cape she made for Calvin.  Calvin says it must have been Stupendous Man, and that Susie probably deserved whatever she got.  Mom tells him he could hurt someone that way, and that if she ever hears of anything like this again, she'll take away his costume for good.  Hobbes says this sounds like another job for Stupendous Man.  Calvin says it actually doesn't sound like quite his type of job.
    characters: [calvin, hobbes, mom, stupendous]
  "19910217":
    transcript: Mom never lets me stay up to watch the TV shows I really want to see. Why not? She says they're too educational. I watched a nature program on TV last night. Afterward, I asked Dad if life was really nothing more than surviving long enough to reproduce before you became food for something else. Well, he looked at me a minute, and said he didn't know about the rest of it, but he thought that the importance of reproducing was greatly overrated. I've noticed in those programs how the young males often leave the herd at an early age. I think it's GOOD that everyone becomes food.
    description: Riding on their toboggan, Calvin tells Hobbes he watched a nature program on TV last night.  Then, he asked Dad if life was nothing more than trying to survive long enough to reproduce before you became food for something else.  Hobbes asks what Dad said.  Calvin replies Dad looked at him a minute, then said he didn't know about the rest of it, but thought the importance of reproducing was greatly overrated.  They slide along, then Calvin says he's noticed in those programs how young males often leave the herd at an early age.  Hobbes replies that he thinks it's good that everyone becomes food.
    characters: [calvin, hobbes]
    source: s-anand+seligman+miraheze
  "19910218":
    transcript: Dad, how do soldiers killing each other solve the world's problems? I think grown-ups just ACT like they know what they're doing.
    description: Calvin asks Dad how soldiers killing each other solves the world's problems.  Dad sits there looking.  He keeps sitting and looking.  Calvin walks off saying he thinks grown-ups just act like they know what they're doing.
    characters: [calvin, dad]
  "19910219":
    transcript: Hi honey! How was school? I got stuck in my snow pants. Uh oh. What happened? Well, the zipper got covered with ice, so I tried to force it. Then my mitten got caught and jammed the zipper. I tried to PULL my snow pants off, but I forgot to take my boots off first, so THOSE got stuck, and then the pants got all twisted, so I fell over, and finally the teacher had to call two custodians to get me out! So I want to be sure to wear them again tomorrow.
    description: Mom asks how Calvin's day went.  Calvin tells her he got stuck in his snow pants.  He says the zipper got covered with ice, he tried to force it, but his mitten got caught.  He then tried to take his snow pants off, but he hadn't taken his boots off first.  Then the pants got twisted, he fell over, and the teacher had to call two custodians to get him out.  He tells Mom he wants to wear them again tomorrow.
    characters: [calvin, mom]
  "19910220":
    transcript: Look, I've got some modelling clay! What are you making? This is a hoof. A hoof? Right! This will be a life-size equestrian statue of me! A new horseman of the apocalypse, hmm? I think I'm going to need more clay.
    description: Calvin has some modeling clay.  Hobbes asks what he's making.  Calvin replies it's a hoof.  He tells Hobbes it's going to be a life-size equestrian statue of him.  Hobbes asks if it will be a new horseman of the apocalypse.  Calvin is sure he's going to need more clay.
    characters: [calvin, hobbes]
  "19910221":
    transcript: My essay is entitled "After school at my house". ...ahem... "It's not that I MIND being chained in the basement, it's just that when the meat is thrown down, the rats have the advantage of numbers, and they..." What, Miss Wormwood? Another parent-teacher conference? I told her to expect you to deny everything.
    description: Calvin is in front of the class, preparing to read his essay "After School At My House".  He starts reading about not minding being chained in the basement, but when the meat is thrown down, the rats outnumber him.  Miss Wormwood stops him.  That evening, Calvin hands Mom a note to attend another parent-teacher conference.  Calvin tells Mom he told Miss Wormwood to expect Mom to deny everything.
    characters: [calvin, mom]
  "19910222":
    transcript: SSSS SNAP FSSSST POP! SNARRLL YOWP GRRRR FSSSSS PSSSTSS GRRRR That's why I'M way over HERE.
    description: Hobbes is sleeping in front of the fireplace.  Suddenly, the wood in the fireplace pops.  Hobbes is startled. He spins around, snarling and scratching.  Hobbes angrily looks back at the fireplace.  Calvin, sitting in an armchair reading a book, says that's why he's way over there.
    characters: [calvin, hobbes]
  "19910223":
    transcript: MOMM! MOM! What's the matter?? What's wrong? Hobbes wants a second good night kiss. IT'S TWO IN THE MORNING!! He says the first kiss didn't take. Hmph. I don't think THAT one took either. Oh go to sleep.
    description: In bed, Calvin yells for Mom.  He tells her Hobbes wants a second good night kiss.  Mom complains that it's two in the morning.  Calvin says the first kiss didn't take.  After she leaves, Hobbes grumpily thinks that kiss didn't take, either.  Calvin tells him to go to sleep.
    characters: [calvin, hobbes, mom, stuffedhobbes]
  "19910224":
    transcript: I've decided to be more of a "people" person, and make more friends. How come? I don't get enough presents. From now on, I'm devoting myself to the cultivation of interpersonal relationships. After all, no man is an island. We all need love and the support of others. We're social beings with social needs. So as of today, my goal is to be one with my fellow man, to develop and foster those deep connections that ... just a minute ... Hey Susie! Heads up!! Ha ha!! Augh help help I've changed my mind, Hobbes. People are scum. I think TRUE happiness can only be found in the wanton indulgence of animals.
    description: Calvin says that he's devoting himself to the cultivation of interpersonal relationships.  He tells Hobbes no man is an island.  They all need love and the support of others.  As of today, his goal is to be at one with his fellow man.  As he says he's going to develop and foster deep connections, he tells Hobbes to wait a minute.  He makes a snowball and hits Susie with it.  She chases him.  Later, Calvin is head-first in the snow.  He tells Hobbes he's changed his mind.  People are scum. Hobbes thinks true happiness can only be found in the wanton indulgence of animals.
    characters: [calvin, hobbes, susie]
    source: s-anand+seligman+miraheze
  "19910225":
    transcript: AUGH! Who did this? The Dame's scream hit an octave usually reserved for calling dogs, but it meant I had a case, and the sound of greenbacks slapping across my palm is music to my ears any day. After all, I'm not an opera critic. I'm a private eye.
    description: Mom sees a night stand dumped over with a broken lamp.  She yells "Who did this".  In his office, Tracer Bullet hears Mom's yell.  He knows he has a case.  He says the sound of greenbacks slapping across his palms is music to his ears.  He's not an opera critic, he's a private eye.
    characters: [calvin, mom, tracer]
  "19910226":
    transcript: I keep two magnum's in my desk. One's a gun, and I keep it loaded. The other's a bottle and it keeps ME loaded. I'm Tracer Bullet. I'm a professional snoop. It's a tough job, but then, I'm a tough guy. Some people don't like an audience when they work. Enough of them have told me so with blunt instruments that I'm a phrenologist's dream come true. Snooping pays the bills, though. Especially Bill, my bookie, and Bill, my probation officer. So when a tall brunette opened my door with a case for me, my heart did a few calisthenics and I took the job.
    description: Tracer Bullet keeps two magnums in his desk.  One is a gun he keeps loaded, the other a bottle that keeps him loaded.  He's a tough guy who people don't want around when they work.  They've told him so with blunt instruments. He's a phrenologist's dream come true.  Snooping pays the bills, though.  Especially Bill, his bookie, and Bill, his probation officer.  When the tall brunette opened the door with a case for him (Mom coming into his bedroom fuming), his heart did some calisthenics and took the job.
    characters: [calvin, mom, tracer]
  "19910227":
    transcript: The dame said she had a case. She sounded like a case herself, but I can't choose my clients. She was the pushy type, the kind who'd break your heart, or maybe your arms. I hurried over. Either she had a psychotic decorator, or her place had been ransacked by someone in a big hurry. WELL?! How do you explain this? The dame was hysterical. Dames usually are.
    description: Tracer says the dame had a case.  She was the pushy type.  She'd break your heart, or your arms.  Mom scoots Calvin to the broken lamp.  Tracer looks at the damage and figures she either has a psychotic decorator or someone ransacked the place in a big hurry.  Mom asks how Calvin can explain the damage.  Calvin thinks the dame was hysterical. They usually are.
    characters: [calvin, mom, tracer]
  "19910228":
    transcript: What have you got to say for yourself? Don't touch anything. I'm looking for clues. The click of a hammer being cocked behind my head focused my thoughts like only a loaded .38 can. The dame had set me up! She didn't want me to solve the case at all! She just wanted a patsy to pin the crime on! Well? I didn't like the way this story was shaping up, so I decided to write a new ending with my .45 automatic as co-author.
    description: Mom asks Calvin what he has to say for himself.  Calvin tells Mom he's looking for clues.  Tracer realizes it's all a set up.  The dame wanted a patsy to pin the crime on.  Calvin thinks he doesn't like the way this story is shaping up, so he's decided to write a new ending with his .45 automatic as coauthor.
    characters: [calvin, mom, tracer]
  "19910301":
    transcript: I introduced the dame to a friend who's very close to my heart. Just a little down and left, to be specific. My friend is an eloquent speaker. He made three profound arguments, while I excused myself from the room. I always leave when the talk gets philosophical. You're in REAL trouble NOW, young man!!
    description: Tracer introduces the dame to his friend, his gun.  His friend is an eloquent speaker.  Tracer fires three times, and he leaves the room.  Mom has three suction darts on the wall behind her.  She rolls up her sleeves.  She tells Calvin he's in real trouble now.  Calvin runs off.
    characters: [calvin, mom, tracer]
  "19910302":
    transcript: I'd just finished putting the puzzle pieces together when the dame's hired goon jumped out of nowhere and practiced for his chiropractic degree. When the discussion was done, an all-percussion symphony was playing in my head, and the accoustics were incredible. The orchestra went on a ten-city tour of my brain. And I had a season pass with front row seats. I had figured out who trashed the dame's living room, but since she wasn't my client any more, I felt no need to divulge that information. Besides, the culprit happened to be a buddy of mine. I closed the case. I guess we should've played outside, huh?
    description: Tracer says he just about had it figured out when the dame's hired goon jumped out.  Dad lectures Calvin while Calvin thinks a symphony was playing in his head, and the acoustics were terrible.  The orchestra went on a tour of his brain, and he had a season pass with front row tickets.  He had figured out who trashed the living room, but since the dame wasn't his client anymore, he didn't feel he needed to divulge the information.  The culprit happened to be a buddy of his, so he closed the case.  Hobbes guesses they should have played outside.
    characters: [calvin, hobbes, dad, tracer]
  "19910303":
    transcript: The distant planet Z-12. Distant, that is, to everyone but Spaceman Spiff! The fearless explorer Spaceman Spiff cruises over the desolate dunes of an uncharted planet! No vegetation covers the rolling terrain. Millions of years of harsh exposure without an atmosphere has swept the surface clean. What strange chemicals must compose this alien soil! Crossing a rift, the rocks abruptly change color! ZOUNDS! A huge mountain suddenly rises out of the plain! Our hero pulls up! Over the top, Spiff discovers that it is not a mountain at all! The whole landscape is... is bedding for a horrendous monster! Zg! Mf! Huh? All right, what time is it?! The creature appears hostile! With no time to lose, our hero readies a hydro bomb!
    description: Spaceman Spiff cruises over the desolate dunes of an uncharted planet.  There is no vegetation.  Millions of years of harsh exposure without an atmosphere has swept the surface clean.  Crossing a rift, the rocks abruptly change color. A huge mountain rises out of the plain.  Our hero pulls up.  Spiff discovers it's not a mountain at all.  The whole landscape is bedding for a horrendous monster.  Dad sleepily looks to see what time it is.  Calvin, next to Dad in bed, says the creature appears hostile.  Our hero readies a hydro bomb.  Calvin has a glass of water poised to douse Dad.
    characters: [calvin, dad, spiff]
    source: s-anand+seligman+miraheze
  "19910304":
    transcript: What's up today? Nothing so far. "So far"? Well, you never know. Something COULD happen today. And if anything DOES, by golly, I'm going to be ready for it! I need a suit like that.
    description: Calvin approaches Mom, who's sitting on the chair.  He's wearing his helmet and cape.  Mom asks what's up today.  Calvin replies "Nothing so far".  When Mom asks what he means by so far, Calvin tells her something could happen today.  As he walks away, he adds that if something does happen, he's going to be ready for it.  Mom says she needs a suit like that.
    characters: [calvin, mom]
  "19910305":
    transcript: I just saw a commercial for a luxury cruise. How come WE don't ever go on vacations like that? Vacations are all just a matter of comparison. Huh? We spend a week in cold, uncomfortable tents each year so living HERE the rest of the time seems like a luxury cruise. If your trips are unpleasant, your whole LIFE is a vacation. Please tell me I'm adopted.
    description: Calvin tells Dad he just saw a commercial about a luxury cruise.  He asks Dad why they don't take vacations like that.  Dad explains vacations are a matter of comparison.  He says that they spend weeks in uncomfortable tents so that living in their home seems like a luxury cruise.  If his trips are unpleasant, his whole life is a vacation.  Calvin goes to see Mom.  He clenches his fists together and begs Mom to tell him he's adopted.
    characters: [calvin, mom, dad]
  "19910306":
    transcript: You know, I don't think math is a science. I think it's a religion. A religion? Yeah. All these equations are like miracles. You take two numbers and when you add them, they magically become one NEW number! No one can say how it happens. Either you believe it or you don't. This whole book is full of things that have to be accepted on faith! It's a religion! And in public schools no less. Call a lawyer. As a math atheist, I should be excused from this.
    description: Calvin tells Hobbes he doesn't believe math is a science, but is a religion.  Calvin explains the equations are like miracles.  You take two numbers, add them together, and you make one new number.  No one can say how it happens. You either believe it or you don't.  Calvin points to his book and says it's full of things you have to accept on faith.  It's a religion.  Hobbes says since it's in the public school, no less, Calvin should call a lawyer.  Calvin says as a math atheist, he should be excused from this.
    characters: [calvin, hobbes]
  "19910307":
    transcript: An ordinary cheetah can go over 60 miles an hour. A human can hardly do a quarter of that. What a joke? You think cats are so great! Well humans don't HAVE to be so fast or so strong because WE'RE so much SMARTER! If cats are so great, how come they don't have cars, or rockets, or bombs, or nuclear... um... reactors, or... or... I mean... And we can see six times better at night than you can! Six TIMES! And boy, talk about agility! Hmph.
    description: Hobbes cheerfully tells Calvin a cheetah can run over 60 miles per hour.  He says a human can hardly do a quarter of that.  Calvin replies that humans don't need to be that fast because they're smarter.  Calvin goes on to ask Hobbes why cats don't have cars, or rockets, or bombs.  He stops.  Hobbes happily continues by saying cats see six times better than humans.  Calvin grumpily kicks a rock.
    characters: [calvin, hobbes]
  "19910308":
    transcript: AUGHH The thrill of the chase is so diminished when one's prey has little legs. OH, I'M REAL SORRY!
    description: Calvin is walking along when he suddenly looks back, horrified.  He runs as fast as he can.  Hobbes is in the air, ready to pounce on Calvin.  Afterward, Hobbes brushes dust off his fur complaining the thrill of the chase is so diminished when one's prey has little legs.  Calvin, lying upside down on the ground, says that he's real sorry.
    characters: [calvin, hobbes]
  "19910309":
    transcript: Ha! I landed on chance. I get to take a card! Oh no! It says, "Defraud the bank. Computer scam diverse assets into your account. Collect $5,000." I think I'll buy a few dozen hotels. Ooh, you just wait till I land on chance! Monopoly is more fun when you make your own chance cards.
    description: Calvin and Hobbes are playing Monopoly.  Hobbes lands on Chance.  Hobbes reads "Defraud the bank. Computer scam diverts assets to your account. Collect $5000".  Hobbes thinks he'll buy a few dozen hotels.  Calvin tells him to wait until he lands on Chance.  Calvin says Monopoly is more fun when you make your own Chance cards.
    characters: [calvin, hobbes]
  "19910310":
    transcript: Z
    description: Calvin walks past a dripping downspout and a running storm drain.  He walks by the stream.  He looks at the waterfall.  It's now raining.  A fire truck pulls up, and the fireman sprays Calvin with the water hose.  Calvin is rolling on giant water waves.  Calvin wakes up with a start.  He runs into the bathroom.
    characters: [calvin]
  "19910311":
    transcript: BOK BOK BOK BOK I kind of resent the manufacturer's implicit assumption that this would amuse me.
    description: Calvin has a paddle-ball toy.  He hits the ball a few times, then stops.  The ball hangs down on the rubber band.  He says he resents the manufacturer's implicit assumption that this would amuse him.
    characters: [calvin]
  "19910312":
    transcript: Hey Dad, Hobbes says that tigers are more perfectly evolved than humans! He says that if the playing field was level and we didn't have guns, people would be nothing but CAT FOOD! Tell him that's not... There! 10 cents. We bet a quarter, you chiseler.
    description: Calvin walks into the bathroom where Dad is, saying Hobbes told Calvin tigers were more perfectly evolved than humans.  As Calvin opens the door, he says Hobbes told him that if there were no guns, people would be cat food.  He asks Dad to tell Hobbes it isn't true.  Dad is standing with his pajama bottoms, no top, toothbrush in mouth, with toothpaste foaming out.  Calvin grudgingly pays Hobbes off for the bet they had made.
    characters: [calvin, hobbes, dad]
  "19910313":
    transcript: BU-URRPP! CLAP CLAP CLAP CLAP CLAP CLAP AUTHOR! AUTHOR! ENCORE! Philistines.
    description: At the dinner table, Calvin belches.  He applauds himself, saying "Author! Encore!".  Mom and Dad glare at Calvin.  Sitting on his bed, Calvin calls his parents Philistines.
    characters: [calvin, hobbes, mom, dad]
  "19910314":
    transcript: I'm not going to school today. Oh, you're not? Nope! I'm staying home and watching television all day! Apparently I was misinformed.
    description: Mom is sitting at the table, reading a paper.  Calvin comes in and tells her that he isn't going to school.  He informs her that he's staying at home and watching television all day.  Later, sitting at his school desk, Calvin says he was apparently misinformed.
    characters: [calvin, mom]
  "19910315":
    transcript: Today for show and tell I brought one of my own patent pending inventions! I have in my hand an invisible cretinizer! One shot renders the victim a babbling simp, a dolt, an utter moron! OH SURE, CALVIN! GIVE US A BREAK! As Ronald proves, it's quite effective even at long range. HEY!
    description: For show and tell, Calvin has one of his patent pending inventions.  It's an invisible cretinizer.  One shot renders the victim a babbling simp, a dolt, an utter moron.  From the back of the room, one of the kids yells for Calvin to give them a break.  Calvin continues by saying as Ronald proves, it's quite effective, even at long range.
    characters: [calvin]
  "19910316":
    transcript: Find any dinosaur bones yet? Nope. I wish we lived in the badlands of Montana. It's easier there because erosion often exposes the bones. HERE though, you just have to start digging and hope for the best. Hence the systematic approach, hmm? Right. I guess I'll have to move that sapling.
    description: Calvin is digging a hole, when Hobbes asks if he's found any dinosaur bones yet.  Calvin says nope.  He wishes they lived in the badlands of Montana.  He says it's easier there, because erosion often exposes the bones.  Calvin starts digging again, while saying here, you start digging and hope for the best.  From above, we see Calvin has dug several holes in the yard.  Hobbes asks if that's why he's using the systematic approach.  Calvin says yes.  He guesses he'll have to move a sapling.
    characters: [calvin, hobbes]
  "19910317":
    transcript: Nyup nchyp. I think a burp died trying to get out of my mouth. I'm thursty. THUMP. Monster eyes! HELP! HELP! IT'S AFTER ME! IT'S GOT ME! I CAN FEEL IT'S TERRIBLE FANGS! CRASH BONK Sleepwalking again! Let's go back to bed, honey. You had a nightmare. Oh, it was YOU! It sure is creepy having a friend whose eyes glow in the dark. It's so we can see people who might be sneakin out of bed to fix a snack without making arrangements to share.
    description: Calvin is thirsty.  He gets out of bed to go for a drink.  He hears a thump.  He sees eyes glowing in the dark. He runs down the stairs, yelling for help.  He yells that he feels its terrible fangs.  He crashes.  Mom and Dad wake up and check on Calvin.  They turn on the light.  Dad says he was sleepwalking again.  Mom tells him to go back to bed.  He had a nightmare.  Calvin looks to see he has Hobbes in his hands.  Back in bed, Calvin tells Hobbes it's creepy having a friend whose eyes glow in the dark.  Hobbes says it's so they can see people sneaking out of bed to fix a snack without making arrangements to share.
    characters: [calvin, hobbes, mom, dad, stuffedhobbes]
    source: s-anand+seligman+miraheze
  "19910318":
    transcript: Well, look at you! Don't you look nice and neat! Yes, I believe in the importance of good grooming. Speaking of which, I'd better get in the tub if I want to be in bed on time. JUST WHAT ARE YOU UP TO?
    description: Calvin walks by Mom.  Mom comments on how nice and neat he looks.  Calvin says he believes in the importance of good grooming.  He says he better get in the tub if he wants to be in bed on time.  Mom is stunned.  She yells after him "Just what are you up to".
    characters: [calvin, mom]
  "19910319":
    transcript: I heard Calvin splashing in the tub, but there's no water on the floor. His towel is hung to dry! The toothpaste cap is on! There's no mess anywhere! And you're already in bed?? Would you check over my homework tonight, so I can correct any mistakes in the morning before school? Thanks, Mom.
    description: Mom looks in the bathroom.  She heard Calvin splashing in the tub, but there's no water on the floor.  His towel is hung to dry.  The toothpaste cap is on.  There's no mess.  Mom sees Calvin is in bed.  He asks her to look over his homework tonight, so he can correct any mistakes in the morning before school.  He thanks her.  Later, she reads from a Child Psychology book.
    characters: [calvin, mom]
  "19910320":
    transcript: Good morning, Mom. You're up and dressed? I didn't even call yoU! I like to get up early so the morning isn't rushed. And with the extra time, I can review my assignments and be better prepared for class. I'm bracing myself for when the other shop drops. Don't get up. I'll fix my own breakfast. Do we have any prunes?
    description: Calvin wishes Mom a good morning.  She is shocked to see him up and dressed.  She hadn't called him. Calvin says he likes to get up early so the morning isn't rushed.  With the extra time, he can review his assignments and be better prepared for class.  Mom says she's bracing herself for when the other shoe drops.  Calvin tells her not to get up.  He'll fix his own breakfast.  He asks if they have any prunes.
    characters: [calvin, mom]
  "19910321":
    transcript: I made my bed and I put my breakfast dishes away! I'm off to school now! Have a good day. Thank you. I'll study hard. A good education is invaluable. This is working out great! I can't believe your Mom thinks that's you.
    description: Calvin says he's made his bed and put his breakfast dishes away.  He's off to school. Mom wishes him a good day.  Calvin tells her thanks.  He says he'll study hard.  A good education is invaluable.  Mom stands by the door, puzzled.  Under his bed, Calvin tells Hobbes this is working out great.  Hobbes can't believe Mom thinks that's Calvin.
