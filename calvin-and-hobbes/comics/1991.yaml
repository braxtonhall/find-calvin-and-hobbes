  "19930805":
    transcript: All right, here's the plan! We make up a fake code with fake instructions and see that it "accidentally" falls into Susie's hands! She decodes the message, which says we DON'T want her to go behind our house! Naturally, she'll go there, and we'll be waiting, ready to soak her with water balloons! Why don't we just hit her with water balloons right now, where she's sitting? You're a good officer, Hobbes. But let's face it, you don't have an executive mind. I still think my idea SORT of makes sense...
