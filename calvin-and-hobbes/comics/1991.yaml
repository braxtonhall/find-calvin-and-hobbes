  "19940203":
    transcript: Why are you following me around? Why are you following me around? And why are you repeating what I say? And why are you repeating what I say? If you're going to keep doing that, I just won't say anything. If you're going to keep doing that, I just won't say anything. The incredibly annoying human echo strikes again!
