  "19910322":
    transcript: I've got to say, Hobbes, I've really perfected my old duplicator THIS time! I'll grant it needed perfecting. It was so simple to add an ethicator! I don't know why I didn't think of it before! Now, instead of making a COMPLETE duplicate of me, I've made a duplicate of just my GOOD side! He does all the work and I get all the credit! He's a total sap! I know! I know the answer! You've gotten so many, let's let someone else try this one. OK, dear?
    description: Calvin tells Hobbes he's perfected his duplicator this time.  He says he added an ethicator.  Now, instead of a complete duplicate of him, he's made a duplicate of just his good side.  The good side duplicate does all the work, and Calvin gets all the credit.  At school, the good Calvin raises his hand that he knows the answer.  Miss Wormwood pats his head and says since he's gotten so many, he should let someone else try one.
    characters: [calvin, hobbes, wormwood]
  "19910323":
    transcript: Last time you made a duplicate of yourself, the DUPLICATE made duplicates, remember? It was a mess! True, but thanks to the ethicator, it can't happen THIS time! By only duplicating my GOOD side, I've ensured that THIS duplicate won't cause any trouble! He's a complete boy scout! There's nothing this twerp likes better than making everyone's life easier! He lives for it! The ethicator must've done some deep digging to unearth HIM! Talk about someone easy to exploit!
    description: Hobbes reminds Calvin the last time he made a duplicate of himself, the duplicates made duplicates.  It was a mess.  Calvin agrees, but he says with the ethicator, it can't happen this time.  By only duplicating his good side, he's ensured this duplicate won't cause any trouble.  He tells Hobbes there's nothing this duplicate likes better than making everyone's life easier.  He lives for it.  Hobbes thinks the ethicator must've done some deep digging to unearth him.
    characters: [calvin, hobbes]
  "19910324":
    transcript: AAAAAA I think these comic books he reads are much too grim. Must be! Just look at him twitch.
    description: There is a paw.  Calvin sits in the distance, reading a comic book.  There is the top of a tiger's back.  Calvin is closer, still reading.  There is a top view of a tiger's body.  Calvin is closer, still reading.  A tiger is crouching.  Calvin turns around to see Hobbes with fangs bared.  Calvin is horrified, and he yells.  He clutches Mom's shoulder, while she tells Dad the comic books he reads are too grim.  Dad says to look at Calvin twitch.  Hobbes is on the floor beneath them.
    characters: [calvin, hobbes, mom, dad, stuffedhobbes]
    source: s-anand+seligman+miraheze
  "19910325":
    transcript: When you're done putting my toys away, you can get to work on my math assignment. OK. Isn't this the life? We get to do whatever we want while goody-two-shoes here does all the work! He doesn't even complain! Virtue is its own reward. He doesn't complain, but his self-righteousness sure gets on my nerves.
    description: Calvin tells his duplicate that when he's done putting his toys away, he can get to work on Calvin's math assignment.  Calvin says they get to do whatever they want, while goody-two-shoes does all the work.  He doesn't even complain.  The duplicate says "Virtue is its own reward".  Reading his comic, Calvin says he doesn't complain, but his self-righteousness gets on his nerves.
    characters: [calvin, hobbes]
  "19910326":
    transcript: Hello, may I carry your books for you? Why? So you can throw them in a puddle or something? Forget it! I wouldn't do that! Yeah, you'd probably do something WORSE! You're not touching my books, Calvin! Strictly speaking, I'm not Calvin. I'm the physical manifestation of Calvin's GOOD side. If that was true, you'd be a lot smaller. Boy, have I heard THAT joke a lot. And if you think you can get my books by acting even weirder than usual, think again!
    description: The duplicate asks Susie if he can carry her books.  She asks if he's going to throw them into a puddle.  The duplicate says he wouldn't do that.  Susie says he'd probably do something worse.  She says he's not going to touch her books.  The duplicate informs her that strictly speaking, he's not Calvin.  He's the physical manifestation of Calvin's good side. Susie says if that was true, he'd be a lot smaller.  The duplicate says he's heard that joke a lot.
    characters: [calvin, susie]
  "19910327":
    transcript: Say, Calvin, that nice girl down the street seems to think you're a total jerk. Who, Susie? You weren't talking to Susie, were you? Yes. I offered to carry her books and she... YOU DID WHAT?! She clearly doesn't trust you at all. Oh, man! Nobody SAW you, did they?! They'll think it was ME! You want to make it look like I LIKE her?! She seemed upset, so this afternoon I took her some flowers I picked, but... AUGHH! AUGHH! AUGHH!
    description: The duplicate tells Calvin the nice girl down the street thinks Calvin is a total jerk.  The duplicate says he offered to carry her books.  Calvin can't believe it.  The duplicate says she doesn't trust Calvin at all.  Calvin grabs the duplicate and asks if anyone saw him.  Calvin says they'll think it was him.  Calvin asks if he wants to make it look like Calvin likes her.  The duplicate says she seemed so upset, he took her some flowers he picked.  Calvin is shocked.
    characters: [calvin]
  "19910328":
    transcript: I hear you're pretty smooth with the ladies! Woo woo woo! Oh, knock it off! It's that darn duplicate and you know it! Man, he's gone too far! I don't mind if he cleans my room and gets good grades, but by golly, I draw the line at being nice to Susie! Can't that duplicate tell she's a GIRL?! Oh, I think he's figured that out. I saw him cutting hearts out of red construction paper! WAUGH! ... And who could make My heart feel woozy? Only thou, my fair Sweet Susie.
    description: Hobbes tells Calvin he hears he's pretty smooth with the ladies.  Calvin tells him to knock it off.  He says it's the duplicate.  Calvin says he doesn't mind if the duplicate cleans his room and gets good grades.  He draws the line at being nice to Susie.  He asks Hobbes if the duplicate can't tell she's a girl.  Hobbes informs him the duplicate has figured that out.  He says he saw him cutting hearts out of construction paper.  The duplicate writes "...and who could make my heart feel woozy? Only thou, my fair sweet Susie".
    characters: [calvin, hobbes]
  "19910329":
    transcript: DON'T TELL ME MY DUPLICATE IS WRITING SUSIE MASH NOTES!! You little charmer, you! I'm the dictator-for-life of the Get Rid Of Slimy girlS club! My reputation! My honor! My principles! We've got to stop him! Oh no! He's not in my room! He must be on his way to Susie's house! You're probably going to get smoochies right now! Big wet ones, I bet! MORE sarcasm?! You come here again and I'll clobber you, Calvin.
    description: Calvin tells Hobbes not to tell him his duplicate is writing Susie mash notes.  Hobbes calls Calvin a little charmer.  Calvin runs off.  As dictator-for-life of the Get Rid Of Slimy girlS club, his reputation is at stake.  He looks in his room, but the duplicate isn't there.  He says he must be on his way to Susie's house.  Hobbes says he's probably getting smooches right now.  Standing at Susie's door, the duplicate Calvin has handed Susie the note.  Susie considers it sarcasm. She tells him if he comes to her house again, she'll clobber him.
    characters: [calvin, hobbes, susie]
  "19910330":
    transcript: You again?! Was I here before? Are you crazy?! You were here just two minutes ago! Uh-oh. I'm not STILL here, am I? YOU'RE STANDING RIGHT THERE! WELL ANYONE CAN SEE THAT! AM I HERE ANYWHERE ELSE?! Sheesh. SLAM. Who can fathom the feminine mind? I like 'em anyway.
    description: Calvin goes to Susie's house.  She says "You again".  Calvin asks if he was there before.  She asks if he's crazy.  He was there two minutes ago.  Calvin asks if he's still there.  She says he's standing right there.  Angrily, Calvin says anyone can see that.  He wants to know if he's anywhere else.  She slams the door.  Walking off, Calvin asks who can fathom the feminine mind.
    characters: [calvin, hobbes, susie]
  "19910331":
    transcript: Uh oh, here comes Calvin... The incurable weirdness poster child. Hi Calvin. What's with the mask and bucket? HMPH. This is a poem! Please do what you're told! And here is a bucket of water ice-cold! Please take this water, and dump it on me! Don't hesitate! Do it A.S.A.P.! Just wait till YOU touch the "pernicious poem place"!! Oooh, you'll be sorry THEN! Whee! I love playing CalvinBall! This is a bag flag zone!
    description: Susie is playing, when Calvin comes over with a bucket.  Calvin is wearing a mask.  Calvin starts a poem. He tells Susie please do what she's told.  There is a bucket, of water, ice cold.  He says to please dump in on him, not to hesitate, do it A.S.A.P.  Susie looks at him, while Calvin stands with eyes closed.  Susie grins evilly.  Calvin walks off with the bucket on his head, dripping water.  Calvin shakes his fist at Hobbes.  Calvin warns him to wait until he touches the "pernicious poem place".  They're playing Calvinball.
    characters: [calvin, hobbes, susie, bun]
    source: s-anand+seligman+miraheze
  "19910401":
    transcript: THERE you are! There YOU are! What's the big idea giving Susie a mushy valentine?! Are you nuts? She wouldn't even accept it! YOU'RE such a jerk, she always thinks you're up to something! Who are you calling a jerk, you namby-pamby goody-goody! YOU, you self-centered conniving brat! Wow, how existential can you get?
    description: Calvin finds his duplicate.  Calvin complains about the duplicate giving Susie a valentine.  The duplicate says she wouldn't even accept it.  He calls Calvin a jerk.  Calvin calls the duplicate a namby-pamby goody-goody.  The duplicate calls Calvin a self-centered, conniving brat.  They fight.  Hobbes asks how existential can you get.
    characters: [calvin, hobbes]
  "19910402":
    transcript: So it's a fight you want, is it?! Why, I'll tear you limb from... Yeah? Yeah? Oops! I had an evil thought! FFTT. Another casualty of applied metaphysics. My ethicator machine must've had a built-in moral compromise spectral release phantasmatron! I'm a genius!
    description: The duplicate says he's going to fight Calvin.  FFTT!  He disappears.  He had an evil thought.  Hobbes calls it another casualty of applied metaphysics.  Calvin says his ethicator machine must've had a built-in moral compromise spectral release phantasmatron.  He says he's a genius.
    characters: [calvin, hobbes]
  "19910403":
    transcript: You're the only person I know whose GOOD side is prone to badness. That's why he evaporated. He could only be perfectly good as an abstraction. In his human manifestation, he wanted to throttle me. He spectralized just in time! Fascinating. Yes. Of course, now you have to do your homework YOURSELF. Actually, now that my good side is no longer a physical being, I find him that much easier to ignore.
    description: Hobbes tells Calvin he's the only person he knows whose good side is prone to badness.  Calvin says that's why he evaporated.  He could only be perfectly good as an abstraction.  In his human manifestation, he wanted to throttle Calvin.  He spectralized just in time.  Hobbes calls it fascinating.  He reminds Calvin he'll have to do his homework himself. Calvin says since his good side is no longer a physical being, he finds him that much easier to ignore.
    characters: [calvin, hobbes]
  "19910404":
    transcript: Well, that's the end of chapter one. We'll stop here. No, read the whole book, OK? Calvin, there's a hundred more pages and it's late. We'll read another chapter tomorrow. No, no! Finish it tonight! Gee, you must really like this. I have to write a paper on it tomorrow.
    description: Dad is reading a story to Calvin.  Dad says he's reached the end of chapter one.  He says they'll stop there. Calvin tells him to read the whole book.  Dad says there's a hundred more pages, and it's late.  He says they'll read another chapter tomorrow.  Calvin asks him to finish it tonight.  Dad says he must really like the book.  Calvin tells him he has to write a paper on it tomorrow.
    characters: [calvin, dad]
  "19910405":
    transcript: You know what I've noticed, Hobbes? Thinkgs don't bug you if you don't think about them. So from now on, I simply won't think about anything I don't like, and I'll be happy all the time. Don't you think that's a pretty silly and irresponsible way to live? What a pretty afternoon.
    description: Calvin tells Hobbes he's noticed that things don't bug you if you don't think about them.  He says he's not going to think about anything he doesn't like, and he'll be happy all the time.  Hobbes asks if that isn't a silly and irresponsible way to live.  Calvin looks at the sky and says "What a pretty afternoon".
    characters: [calvin, hobbes]
  "19910406":
    transcript: What are you doing out in the rain? I'm engaging in a contest of wills! It's me against nature! It's me against nature! Which of us is going to give up first? Is NATURE going to give up and stop raining, or am I going to give up and go inside? So far, it's undecided, but I'm determined to win! OOOH, BIG NOISE! YOU DON'T SCARE ME! KEEP IT COMING! I'M NOT GOING IN! Poor guy just couldn't stand the suspense.
    description: Hobbes comes out in the rain with an umbrella to ask Calvin why he's out there.  Calvin stands with his arms crossed.  He says he's engaged in a contest of wills.  It's him against nature.  He raises his fists and asks which one is going to give up first.  Will nature give up and stop raining, or will he give up and go inside.  He says he's determined to win.  There is a big KABOOM!  Hobbes is startled.  Calvin yells to the skies that the big noise doesn't scare him.  He's not going in.  Hobbes does go in.  Calvin says the poor guy couldn't stand the suspense.
    characters: [calvin, hobbes]
  "19910407":
    transcript: Grghhg rghhhh grrrgh rgghh snorrtt ghackhgg Heh heh heh...sorry... a little sinus congestion. Sighhh
    description: Prehistoric beasts look up.  A tyrannosaurus roars.  Calvin makes a terrible face, snorts and growls.  His classmates all look at him.  He says he's sorry.  He had a little sinus congestion.  He puts his face in his hands and sighs.
