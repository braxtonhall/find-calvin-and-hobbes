  "19940220":
    transcript: YA-A! WHOK. UHN-GG. There were two ways to resolve our differences. I ruled out a thoughtful discussion. Foolish Amazon! I am only toying with you! YEAH?? Well, toy with THIS!! The hyper-phase distortion blaster? I could feel my spine shatter. It hurt... BUDDOW. ...a lot. Next ISH --- "Injuries to go" ...hehh hah hooh... hahh heh hmh Click. No you don't. There's too much violence on TV. Why don't you go read something?
    description: Two superheroes, one man and one woman, are fighting.  He hits her, while she blasts him with a distortion blaster.  Calvin stops reading his comic book and walks off in a daze.  He turns on television.  Mom turns it off and tells Calvin there is too much violence on TV.  She tells him to read something.
