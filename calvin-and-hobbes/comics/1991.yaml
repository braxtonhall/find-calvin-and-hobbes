  "19930920":
    transcript: Your new polls are in, Dad. Mm. A vast majority of household six-year-olds say you're not living up to their expectations of fatherhood. What were their expectations? That you'd be more like an automatic teller machine. Where do you pollsters find these respondents?
    description: Calvin tells Dad the polls are in.  A vast majority of six-year-olds say he's not living up to their expectations of fatherhood.  Dad asks what their expectations were.  Calvin replies that Dad should be more like an automatic teller machine.  Dad asks where the pollsters find these respondents.
