  "19950129":
    transcript: This sculpture will be called "The spirit of compromise". We'll each make a snowman and have them shanking hands. This will be very insprational! People will weep to see two snowmen overcoming their differences and cooperating! Soon we'll be rolling in public commissions! Make your snowman's arm longer. His hand won't reach my snowman's hand. Why should I make a new arm? Just make YOURS longer. Then it will look like my snowman had to reach farther than yours did. They should be equal. Then build your snowman closer over here! I'm not going to start all over! Just make your arm longer! I refuse. You can't tell me what to do! In that case, my snowman refuses to shake with your snowman! So what?? My snowman won't even TALK to yours! I'm turning his head the other way! Ha! While he's looking over there, MY snowman will kick YOUR snowman in his big white butt! Oh yeah, well, mine knocks your snowman's head off! Fine! My snowman feeds your snowman his own nose! Why you...!! Leggo OW OOF Stop it! I don't think this sculpture is very good. It's a compromise.
    description: Calvin is making a snow sculpture called "the spirit of compromise".  He'll have his snowman shake hands with Hobbes'.  Calvin says it will be very inspirational.  He says they'll soon be rolling in public commissions.  Hobbes tells Calvin to make his snowman's arm longer.  The snowman's arm won't reach Hobbes'.  Calvin asks why Hobbes doesn't make his snowman's arm longer.  Hobbes says it will make it look like his snowman had to reach farther.  They'd be unequal.  Calvin tells him to make his snowman closer.  Hobbes won't start over and tells Calvin to make his snowman's arm longer.  Calvin refuses.  Hobbes says his snowman refuses to shake hands with Calvin's.  Calvin's won't even talk to Hobbes'.  Hobbes thumbs his ears and says his snowman will kick Calvin's snowman in its big white butt.  Calvin threatens Hobbes' snowman.  They fight.  Both snowmen are destroyed.  Lying in the snow, Hobbes says he doesn't think the sculpture is very good.  Calvin says it's a compromise.
    characters: [calvin, hobbes]
