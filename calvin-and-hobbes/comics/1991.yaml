  "19920705":
    transcript: Psst! Hey kid! Wake uup! A monster! Heh heh! Splish splash splish splash splish splash. Stop that! I know what you're up to! What's he doing? Calvin He's trying to make me have to go to the bathroom. Drip drip drip! Fwoosh sploosh fwoosh sploosh. As soon as I get out of bed, he'll grab me and suck out my innards with some vile proboscis! Fwishh spilsh fwishh splish! That's terrible! Will they stop at nothing?! His plan is working, too! I'll never make it till morning! Splash splash splash splash splash! I have to go, but I can't get out of bed! What am I going to do?? The plants on this side of the house sure don't do very well.
    description: A monster under Calvin's bed is trying to make him go to the bathroom by making water sounds.  Calvin knows when he gets out of bed, the monster will suck out his innards.  Calvin tells Hobbes the plan is working.  He knows he can't make it till morning.  Calvin says he has to go, but he can't get out of bed.  He asks Hobbes what he's going to do.  The next day, Dad is talking to Mom outside the house.  He mentions to Mom that the plants on that side of the house don't do very well.  Above them is Calvin's bedroom window.
