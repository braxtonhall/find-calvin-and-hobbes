  "19930927":
    transcript: Psst, Susie! What's the answer to question two? "Eli Whitney and the cotton gin." But this is a math problem. It's a trick question. How come YOU wrote something different? I'm going to get this question wrong, so it won't look like you copied. Wow, thanks! Oh, I ow it to you.
