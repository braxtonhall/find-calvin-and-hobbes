  "19910422":
    transcript: Attention! All rise! This meeting of G.R.O.S.S. is now called to order by the great grandiose dictator-for-life, the ruler supreme, the fearless, the brave, the held-high-in-esteem, Calvin the Bold! Yes, stand up and hail his humbleness now! May his wisdom prevail! Three cheers for First Tiger and El Presidente, Hobbes, the delight of all cognoscenti! He's savvy! He has a prodigious IQ, and lots of panache, as all tigers do! In his fancy chapeau, he's a leader with taste! May his orders be heeded and his views embraced! You can tell this is a great club by the way we start our meetings!
    description: Calvin calls the meeting of G.R.O.S.S. to order with a poem.  He's dictator-for-life, ruler supreme, fearless, brave, and held high in esteem.  Calvin the Bold, stand up and hail.  His humbleness now, may his wisdom prevail.  Hobbes joins in, as first tiger and el presidente.  He's the delight of all cognoscenti.  He has a prodigious IQ, and lots of panache, as all tigers do.  He's a leader with taste, whose views must be embraced.  Calvin says you can tell this is a great club by the way they start their meetings.
    characters: [calvin, hobbes]
  "19910423":
    transcript: This meeting of the Get Rid Of Slimy girlS club is now in session! First Tiger Hobbes will present our financial report. Wait, we didn't sing the G.R.O.S.S. anthem. We sing that at the END of the meeting. I want to sing it NOW. We can't. We have to follow proper protocol! See? It says on the agenda that we sing the anthem LAST! Ohhohh GROHOSS BEST CLUB IN THE COSMOS... STOP THAT YOU ANARCHIST!
    description: Calvin calls for the G.R.O.S.S. financial report.  Hobbes says they didn't sing the anthem.  Calvin says they'll sing it at the end of the meeting.  Hobbes wants to sing it now.  Calvin tells him they can't.  They have to follow protocol. Hobbes starts singing the G.R.O.S.S. anthem.  Calvin calls Hobbes an anarchist.
    characters: [calvin, hobbes]
  "19910424":
    transcript: You get two demerits for singing the club anthem before it was on the agenda! Well YOU get FIVE demerits for not taking off your hat during its hallowed refrain! You can't give me demerits! I outrank you! Ha! You're just a figurehead! Your duties are ceremonial! I have all the REAL responsibilities! WHAT? I"m dictator-for-life! I have ten TIMES the importance of a lowly First Tiger! A HUNDRED times! A MILLION TIMES! If you're so important, how come you sing the soprano part of our anthem? THAT'S JUST TILL MY VOICE CHANGES!
    description: Calvin gives two demerits for singing the anthem before it was on the agenda.  Hobbes gives Calvin demerits for not taking his hat off during its hallowed refrain.  Calvin tells him he outranks Hobbes and can't be given demerits. Hobbes says Calvin's duties are ceremonial.  He has all the real responsibilities.  Calvin yells that he has ten times the importance of a lowly first tiger.  A million times.  Hobbes asks why, if he's so important, does Calvin sing the soprano part of the anthem.  Calvin angrily says that's only until his voice changes.
    characters: [calvin, hobbes]
  "19910425":
    transcript: By golly, I won't stand for this insubordination! You are hereby demoted to "Club Mascot"! Oh yeah? Well YOU can be "Club Chowder Head", because I QUIT! I'm forming my OWN club, and it's going to be a lot better than THIS one! Ha! Your sorry won't have a cool acronym for a name, I'll bet! It will too! MY club is called "C.A.D." C.A.D? What's THAT supposed to stand for? "Calvin's A Dope"! THAT'S NOT A NAME FOR A CLUB!
    description: Calvin demotes Hobbes to "Club Mascot".  Hobbes says Calvin can be the "Club Chowder Head", because he quits.  He says he'll form his own club.  Calvin bets his club won't have a cool acronym for a name.  Hobbes tells Calvin his club is called C.A.D.  Calvin asks what that stands for.  Hobbes tells him "Calvin's A Dope".
    characters: [calvin, hobbes]
  "19910426":
    transcript: If you're club's called "Calvin's A Dope", then I'm changing the name of THIS club to "Hobbes is a mangy flea-ridden furball"! An insult! I declare eternal war on your club! Go ahead! From now on we're bitter enemies! Wait till you see my cunning strategies! I'll have maps and secret codes! I'll have strategies! I'll have maps! I'll have codes! They'll all be better than yours! I'm going to write myself a message in code right now! It says, "Calvin smells like a baboon!" Ha! I broke your code already! And I do NOT!
    description: Calvin changes his club name to "Hobbes is a Mangy Flea-Ridden Furball".  Hobbes declares war on Calvin's club.  Hobbes says he'll have maps and secret codes.  Calvin says he'll have them too, and his will be better than Hobbes'.  Hobbes says he's going to write himself a message in code right now.  It will say "Calvin smells like a baboon". Calvin says he's broken the code already, and he does not.
    characters: [calvin, hobbes]
  "19910427":
    transcript: When you see how cool MY club is, you'll beg to be in it, but I won't let you! Who needs your stinky club?! I've got my own club! My club dedicates itself to the destruction of your club! Good! IT's a battle to the finish! This is total war! Oh yeah? We'll see about THAT! What? Only in your dreams, fuzzy face! Hey Calvin! Who are you yelling at up there? Yikes! Shh! It's Susie!
    description: Calvin and Hobbes are fighting in the treehouse.  Hobbes says his club dedicates itself to the destruction of Calvin's club.  Calvin says it's a battle to the finish.  They keep arguing with themselves while Susie walks up to the tree.  She yells up to Calvin, asking who he's yelling at.  Calvin tells Hobbes to be quiet, it's Susie.
    characters: [calvin, hobbes, susie]
  "19910428":
    transcript: I'm hooOaaGHhH! AAAAAAAAA If you ache, it's because you don't properly stretch before exercising. I didn't know I was going to BE exercising!!
    description: Hobbes stretches himself.  He arches his back.  He runs off.  Hobbes is poised on the stairs.  Calvin opens the door and yells that he's home.  Hobbes pounces on Calvin, and they fight.  Hobbes says if Calvin aches, it's because he didn't properly stretch before exercising.  Getting up from the ground, Calvin yells that he didn't know he was going to be exercising.
    characters: [calvin, hobbes]
    source: s-anand+seligman+miraheze
  "19910429":
    transcript: Hobbes, it's Susie! She's right under us! It's the chance of a lifetime! Real smooth, pass me the bag of rotten apples we've been saving! Quick! Quick! What about our war? I thought I was out of the club! All charges are dropped! you're back in! You're back in! Maybe I want a promotion first. IT'S YOURS! NAME IT! JUST GIVE ME THE MUSHY APPLES! Mushy apples? Who are you talking to? Susie, don't move, OK? Stay exactly where you are.
    description: Calvin tells Hobbes to pass the bag of rotten apples they've been saving.  Susie is right below them.  Hobbes asks about their war.  Calvin tells Hobbes all charges are dropped.  He's back in Calvin's club.  Hobbes wants a promotion first.  Hurriedly, Calvin tells him it's his.  He tells Hobbes to give him the mushy apples.  Susie asks what mushy apples.  She asks again who he's talking to.  Calvin tells her not to move.
    characters: [calvin, hobbes, susie]
  "19910430":
    transcript: YAA! YAA! GET RID OF SLIMY GIRLS! HA HA! Ooh, is she mad at you! Ha ha ha! Our club is a success! I think she's running off to tell on us. Who cares! It was worth it! What a perfect plan! Talk about something we'll look back on with pride in our declining years!
    description: Calvin throws apples at Susie while she runs off.  Calvin declares their club a success.  Hobbes thinks she's telling on them.  Calvin says it was worth it.  It was perfect.  He tells Hobbes it's something they'll look back on with pride in their declining years.
    characters: [calvin, hobbes, susie]
  "19910501":
    transcript: Susie Derkins says you were throwing mushy apples at her! We were getting rid of slimy girls! That's our club! Well STOP it! You know better than that! I think you'd better come inside. You can tell this is a great club because we always get in trouble for following our charter!
    description: Mom says Susie told her he was throwing mushy apples at her.  Calvin says they were getting rid of slimy girls.  That's their club.  Mom says he better stop it.  She tells him to come inside.  As Calvin climbs down the rope, he says you can tell this is a great club because they always get in trouble following their charter.
    characters: [calvin, hobbes, mom, stuffedhobbes]
  "19910502":
    transcript: You know everyone says you should stop and smell the roses? Well, this morning I did. BIG DEAL! They smelled like a bunch of dumb flowers! It was the most mundane experience I've ever had! Who's got time for this nonsense! I'm a busy guy! I've got things to do! The LAST think I need is to stand around with my nose in some silly plant! I'm glad you found time for this edifying conversation. Yeah well, I'm going to have to wrap it up. My TV show is about to start.
    description: Calvin asks Hobbes if he's heard people say you should stop and smell the roses.  He says he did.  He says they smelled like a bunch of dumb flowers.  It was the most mundane experience he's had.  He says he doesn't have time for that nonsense.  He's a busy guy.  He says the last thing he needs to do is stand around with his nose in some silly plant.  Hobbes rolls his eyes and says he's glad he somehow found the time for this edifying conversation.  Calvin looks at his watch and says he's going to have to wrap it up.  His TV show is about to start.
    characters: [calvin, hobbes]
  "19910503":
    transcript: OOOOOEEE EEBOOEE BOOEEBOO WAHHHOOOO That's my siren so you know I'm coming. Kids don't NEED sirens.
    description: Calvin runs along howling.  He keeps running, making different sounds.  He runs to Mom while still making noise.  He tells Mom that's his siren so she knows he's coming.  Mom replies kids don't need sirens.
    characters: [calvin, mom]
  "19910504":
    transcript: They say the secret of success is being at the right place at the right time. But since you never know when the right TIME is going to be, I figure the trick is to find the right PLACE, and just hang around! Being with you, it's just one epiphany after another. And if the right place is in front of the drug store, we could read comic books while we wait!
    description: Riding down the hill in their wagon, Calvin says they say the secret of success is being in the right place at the right time.  Since you never know when the right time is going to be, he figures the trick is to find the right place, then just hang around.  Hobbes comments that being with Calvin is just one epiphany after another.  Calvin says if the right place is in front of the drug store, they could read comic books while they wait.
    characters: [calvin, hobbes]
