  "19930820":
    transcript: Well Hobbes, the battle may have been lost, but the war goes on! This afternoon, we'll devise a bigger, better, and even more complicated scheme, and revenge will be ours! The spirit of G.R.O.S.S.ness cannot be extinguished! ...and for courage in the face of setbacks, I award us bottle caps of valor! Yayy! A good meeting always ends with us getting new medals! This is SUCH a great club!
