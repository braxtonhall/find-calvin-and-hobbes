  "19950213":
    transcript: Mmm... somebody's having a fire. I love the smell of a fire on a cold winter day. Isn't it strange how smells are so evocative, but we can't describe them. Oh, I dunno. That fire has a snorky, brambish smell. I should have known animals would have words for smells. It's a little brunky, but low humidity affects that.
