  "19930822":
    transcript: I wish we could stop summer right here and have the days stay the same way they are. That's the problem with life. It rolls along with speed you can't control. You can't go faster or slower. Fun experiences always go roaring by. ...while bad experiences never pass quickly enough. I wish we could choose how fast and slow events go. For example, I'd like to speed up childhood and get up to driving age. It's not the pace of life I mind. It's the sudden stop at the end.
    description: Going down the hill in the wagon, Calvin wishes he could stop summer and leave days like they are.  He says life rolls along with speed you can't control.  Fun experiences go roaring by, as they blaze past trees.  Calvin adds that bad experiences never pass quickly enough, as they fly off the cliff.  As they lie in the stream below, Calvin wants to speed up childhood and get to driving age.  Hobbes doesn't mind the pace of life.  It's the sudden stop at the end.
