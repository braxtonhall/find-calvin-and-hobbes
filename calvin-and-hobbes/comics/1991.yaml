  "19931006":
    transcript: I got a smiley face sticker on my quiz. Whoop-de-doo for you. What did YOU get? None of your darn business! You got a frowny face, didn't you? NO as a matter of fact, I didn't! I didn't even know they MADE barfing face stickers.
