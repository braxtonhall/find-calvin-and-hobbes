  "19931002":
    transcript: Look, Hobbes! If you dry your teeth, you can curl your upper lip and it will stick! See? Then you take a piece of tape... ...and use it to pull your nostrils up! Cool, huh? Wow! I'll be if you showed your Dad, he'd go to work like that! YEAH!
