  "19931011":
    transcript: Nowadays, ads don't just sell a product. They sell an attitude! Look at this one! Here's a cool guy saying nobody tells him what to do. He does whatever he wants and he buys this product as a reflection of that independence. So basically, this maverick is urging everyone to express his individuality through conformity in brand-name selection? Well, it sounded more defiant the way HE said it. Mm.
    description: Calvin is watching television.  He tells Hobbes ads don't see a product, they sell an attitude.  He points out there is a commercial that has a guy do whatever he wants.  He buys the product to reflect his independence.  Hobbes asks if this maverick is urging everyone to express his individuality through conformity in brand-name selection.  Calvin says it sounded more defiant the way the ad said it.
    characters: [calvin, hobbes]
  "19931012":
    transcript: Here's another ad with attitude. This guy didn't like his job, so he quit, and now he climbs rocks! See, he's his own man! He grabs life by the throat and lives on his own terms! If he quit his job, I wonder how he affords those expensive athletic shoes he's advertising. Maybe his Mom bought them for him. I hope she'll pay his medical bills when he falls off that rock.
    description: Calvin is watching another ad with attitude.  He points out a guy who quit his job and now climbs rocks.  He's his own man.  Hobbes wonders how he affords the expensive athletic shoes he's advertising since he quit his job.  Calvin wonders if the guy's mom bought them for him.  Hobbes hopes she'll pay his medical bills when he falls off the rock he's climbing.
