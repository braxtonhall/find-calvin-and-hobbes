  "19920720":
    transcript: The best thing about Captain Steroid comic books is that every issue is number one. Every issue?? Sure! That way they're ALL collector items! These will be worth billions of dollars some day! Of course, they're so cheaply printed you have to preserve them in plastic bags, but it's a small investment for such a huge guaranteed return. Gosh, and I keep buying bonds. Look at the great committee that drew THIS issue!
    description: Calvin is glad the Captain Steroid comic has every issue as issue number one.  He says that way, they're all collector items.  He says they're so cheaply printed you have to preserve them in plastic bags.  That's a small investment for such a huge guaranteed return.  Hobbes says he keeps buying bonds.  Calvin shows Hobbes the great committee that drew the issue he has in hand.
