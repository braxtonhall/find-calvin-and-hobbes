    transcript: I hate Sundays. The day off is ruined by knowing I've got to get ready for school tomorrow. Why don't we get your chores done now, so we can enjoy the rest of the day without worry? Hmm...I hate to delay fun, but maybe you're on to something. This will make the fun more fun. At last! we got everything bad out of the way! There you are. It's time for bed. See if I ever listen to you again! Never put the low priorities first.
