  "19930219":
    transcript: Look at this! This is the biggest snowball in the world! Ha ha! I can't wait to plaster somebody with it! How are you going to pick it up? Reality continues to ruin my life. Maybe you could put it someplace where someone will walk into it.
    description: Calvin makes what he says is the biggest snowball in the world.  He can't wait to hit someone with it.  Hobbes asks how he's going to pick it up.  Calvin is mortified.  He says reality continues to ruin his life.  Hobbes suggests he could put it someplace someone will walk into it.
    characters: [calvin, hobbes]
  "19930220":
    transcript: I'm not going to do this homework! C'mon, let's go outside! Nobody gives the evil eye like your Dad. Did you see how his veins throbbed?
    description: Calvin says he's not going to do his homework.  He and Hobbes head for outside.  There is a giant eye with legs sitting on the chair.  Taking their coat and scarf off, Hobbes says nobody gives the evil eye like Dad.
    characters: [calvin, hobbes, dad, stuffedhobbes]
  "19930221":
    transcript: Sighhhh...
    description: Calvin readies himself for a trip on the toboggan.  He looks down for miles on the landscape below.  Over he goes, coming down from mountainous heights.  Calvin looks back when he's stopped to see the tiny hill he came down.  He sighs.
    characters: [calvin]
    review: "unsettled: the Sunday stamp reads 12-8, 75 days before publication rather than the usual 47-48; release date needs confirming"
  "19930222":
    transcript: What's in the big bag? Nothing YOU need to know about. C'mon, tell me! Well, let's just say it's something that might come in handy today. Why? What happens today? We've got a history test, remember? So what did you bring? A bomb? Wouldn't you and the Principal BOTH like to know!
    description: Susie asks Calvin what's in the bag.  He won't tell.  He says it might come in handy today.  He reminds Susie they have a history test.  Susie asks if it's a bomb.  Calvin asks if she and the principal wouldn't like to know.
    characters: [calvin, susie]
  "19930223":
    transcript: Why won't you tell me what's in that bag? It's a severed head. It is NOT! Don't be disgusting! Fine. Don't believe me. You said it would come in handy during today's test. The head is an oracle. I'll put it on my desk and it will tell me answers. Forget I asked! I don't even care! SOOOOSIE IS A BOOGER BRAAINN! It speaks the truth!
    description: Susie asks what's in the bag.  Calvin says it's a severed head.  She asks why that would come in handy for the test.  Calvin explains the head is an oracle.  It will tell him the answers.  Susie walks off as Calvin moans "Susie is a booger brain".  Calvin says it speaks the truth.
    characters: [calvin, susie]
