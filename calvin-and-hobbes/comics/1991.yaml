  "19920714":
    transcript: Bugs fly in such crazy loops and zigzags. I wonder why they don't get dizzy and barf. Maybe they do! Eww, gross! Ha ha ha! But then why would they keep flying that way? Maybe bugs LIKE to barf! EWWWW! They WOULD!! Ha ha ha ha! Blaugh! I tell you, Hobbes, it's great to have a friend who appreciates an earnest discussion of ideas.
    description: Calvin tells Hobbes that bugs fly in such crazy loops, he wonders why they don't get dizzy and barf.  Hobbes suggests maybe they do.  Calvin thinks that's gross, but wonders why they'd keep flying that way.  Hobbes suggests maybe they like to barf, and he starts to laugh.  Calvin is grossed out, but he laughs.  As they walk off, Calvin says it's great to have a friend who appreciates an earnest discussion of ideas.
