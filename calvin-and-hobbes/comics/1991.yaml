  "19920725":
    transcript: Wow, look at the grass stains on my skin. I say, if your knees aren't green by the end of the day, you ought to seriously re-examine your life.
    description: Getting ready for his bath, Calvin shows Hobbes the grass stains on his skin.  He says if your knees aren't green by the end of the day, you ought to seriously re-examine your life.
