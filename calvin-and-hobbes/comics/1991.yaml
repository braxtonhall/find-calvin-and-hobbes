    transcript: Scientific names? Sure. Scientists come up with great, wild theories, but then they give them dull, unimaginative names. For example, scientists think space is full of mysterious, invisible mass, so what do they call it? "DARK matter"! Duhh! I tell you, there's a fortune to be made here! I like to say "quark"! Quark, quark, quark, quark! Instead of making an idiot of yourself, why don't you go find me some scientists?
