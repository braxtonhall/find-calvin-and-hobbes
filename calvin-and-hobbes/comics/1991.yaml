  "19950401":
    transcript: Susie, your Mom just called and she's walking over to pick you up. Finally! I'll talk you YOU in a few minutes upstairs. Bye Susie! Don't lock yourself in any more closets! We got rid of a slimy girl! What a great day of grossness! This goes in the log book! I'd say some promotions, awards, medals, and advanced degrees are in order! Should we get them before we get in trouble, or after?
    description: Mom tells Susie that her mom is home and she will come pick Susie up.  Susie is relieved.  Mom angrily says she'll talk to Calvin in a few minutes.  Calvin tells Susie not to lock herself in any more closets.  Calvin and Hobbes run upstairs.  Calvin says some promotions and medals are in order.  Hobbes asks if they should get them before they get in trouble or after.
