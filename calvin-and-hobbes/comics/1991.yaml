    description: Calvin shows Hobbes a snowman paleontologist.  Hobbes asks why the snowman looks sad.  Calvin tells Hobbes the snowman just realized snow doesn't fossilize.  It just melts.  Hobbes says Calvin's snowmen lead tragic lives.  Calvin says they're not too bright.
