  "19930125":
    transcript: I like to verb words. What? I take nouns and adjectives and use them as verbs. Remember when "access" was a thing? Now it's something you DO. It got verbed. Verbing weirds language. Maybe we can eventually make language a complete impediment to understanding.
    description: Calvin tells Hobbes he likes to verb words.  He takes nouns and adjectives and uses them as verbs.  He asks Hobbes if he remembers when "access" was a thing.  Now, it's something you do.  Calvin says verbing weirds language.  Hobbes hopes they can eventually make language a complete impediment to understanding.
    characters: [calvin, hobbes]
  "19930126":
    transcript: Wow, chocolate chip cookie batter! I love it before it's cooked! Can I have some? Please, please? Now, it's got raw eggs in it and you could get salmonella poisoning. One more nostalgic part of childhood goes THBPPTH.
    description: Calvin sees chocolate chip cookie batter.  He asks Mom if he can have some.  She says it's got raw eggs in it and he could get salmonella poisoning.  Calvin walks off lamenting one more nostalgic part of childhood going THBPPTH.
    characters: [calvin, mom]
  "19930127":
    transcript: Where are my glasses? I thought they were right here. Hmm... I put them down... I went to get my book... I told Calvin to shovel the walk... Where could they be??
    description: Dad can't find his glasses.  He tries to trace what he did.  He remembers telling Calvin to shovel the walk.  As he wonders where they might be, outside there are two snowmen.  One looks like Calvin holding a shovel.  The other looks like Dad, including glasses, with a rope in his hand.  It looks like it's threatening to whip the Calvin snowman.
    characters: [dad]
  "19930128":
    transcript: The secret to making great hot chocolate is to put the tiny marshmallows in FIRST. So they melt faster? No. So you can fit in 40 or 50 of them. This way, the hot chocolate just fills the cracks. I wondered why you eat it with a fork. Also, I don't use milk. I just heat the syrup.,
    description: Calvin says the secret to great hot chocolate is to put the tiny marshmallows in first.  Hobbes asks if that's so they melt faster.   Calvin says it's so you can fit 40 or 50 of them.  The hot chocolate just fills in the cracks.  Hobbes wondered why Calvin ate it with a fork.  Calvin also doesn't use milk.  He just heats the syrup.
    characters: [calvin, hobbes]
  "19930129":
    transcript: What are you doing? Don't wear your boots through the house! Considering where my SHOES have been, I thought she'd be happy.
    description: Mom tells Calvin not to walk through the house with his boots on.  He takes them off.  He walks on tracking something on the floor.  He says considering where his shoes have been, he thinks she would have been happy he had boots on.
    characters: [calvin, mom]
  "19930130":
    transcript: If you do a job badly enough, sometimes you don't get asked to do it again.
    description: Calvin has shoveled a path from the front steps around the house to the driveway.  On each side of the path, in front of the door, and behind the car, there is a pile of snow.  Calvin tells Hobbes that if you do the job badly enough, sometimes you don't get asked to do it again.
    characters: [calvin, hobbes]
  "19930131":
    transcript: Mm, this dinner you fixed is delicious, honey. What is it? It's dog food. And don't call me "honey." You can't feed me dog food! I'm the President of the United States! No, you're the president of deluded fruitcakes anonymous! Give me a break! You're just mad because you're the "first husband" and you have to vacuum the White House all day! I do not! In fact, I'm not your husband at all! What are you doing?! Stop being such a little weirdo! Me Wonga-Taa, king of jungle! Oh, nice underpants! You're really gross. Me off to jungle! Find tiger friend! Live with animals! I can run the country without you! Good riddance, you moron! It take one to know one! Boy, am I glad to see you. Playing with Susie is a big waste of time. You wouldn't believe the junk she can imagine. Nice underpants. What do you mean Calvin left his clothes with Susie??
    description: A man and woman are talking.  She says the dinner is delicious.  He says it's dog food, and don't call him honey.  She says she's president of the United States.  He says she's president of Deluded Fruitcakes Anonymous.  She says he's mad because he's "first husband" and has to vacuum the White House all day.  He says he's not her husband, he's Wonga-taa, kind of the jungle.  He takes off his clothes to reveal jungle shorts.  She says he's gross and tells him "nice underpants".  He says he's off to the jungle to live with his tiger friend.  She says good riddance.  Walking home in his underwear, Calvin tells Hobbes playing with Susie is a waste of time.  She can imagine such junk.  Hobbes tells him "nice underpants".  Mom is on the phone.  She's asking what the caller means about Calvin leaving his clothes with Susie.
    characters: [calvin, hobbes, mom, susie]
    source: miraheze
  "19930201":
    transcript: 1. Write a paragraph explaining the significance of Magellan's expedition. A gas mask, a smoke grenade, and a helicopter... that's all I ask.
    description: Calvin has an assignment to explain the significance of Magellan's expedition.  He prays for a gas mask, smoke grenade, and a helicopter.
    characters: [calvin]
  "19930202":
    transcript: Calvin, don't just throw your wet coat on the floor! Hang it up where it belongs!  I'm not looking for extra work around here. Oh, like I am.
    description: Mom yells at Calvin not to throw his wet coat on the floor.  She tells him to hang it up where it belongs.  She isn't looking for extra work.  As he drags his coat, he thinks "like I am".
    characters: [calvin, mom]
  "19930203":
    transcript: I'm gonna pound you at recess, Twinky. Oh yeah?  Well, you'll have to catch me first! When your strategy is to run like a squirrel, it's hard to come up with a good taunt.
    description: Moe threatens to pound Calvin at recess.  Calvin says Moe will have to catch him first.  Calvin's angry.  He says when your strategy is to run like a squirrel, it's hard to come up with a good taunt.
    characters: [calvin, moe]
  "19930204":
    transcript: "Today for Show and Tell, I've brought a tiny marvel of nature: a single snowflake. I think we might all learn a lesson from how this utterly unique and exquisite crystal... turns into an ordinary, boring molecule of water, just like every other one, when you bring it in the classroom. And now, while the analogy sinks in, I'll be leaving you drips and going outside. CALVIN!"
    description: Calvin brought a single snowflake for show and tell.  He says they can all learn a lesson from how the unique crystal turns into a boring molecule of water, just like every one of the class, when you bring it into the classroom.  He walks off saying that while the analogy sinks in, he'll be leaving.
    characters: [calvin, wormwood]
  "19930205":
    transcript: Look at this sandwich my Mom made! I'm not eating this wretched thing! Why, this squid isn't even fresh! Smell it! Look how rubbery it is! And the inky brine has soaked the bread! The pickles are pulp! Gross! Wanna trade! Nobody will trade with a kid whose Mom makes a bad sandwich.
    description: Calvin complains to Susie about the sandwich Mom made for him.  He says it's squid.  He tells Susie to smell it.  He says it's rubbery and the inky brine soaked the bread.  He asks Susie if she wants to trade.  Susie leaves.  Calvin says nobody will trade with a kid whose Mom makes a bad sandwich.
    characters: [calvin, susie]
  "19930206":
    transcript: You know what astronauts can do right in their spacesuits? Geez, how am I ever going to learn to be an astronaut?
    description: Mom bundles Calvin for the cold.  Calvin asks Mom if she knows what astronauts can do right in their spacesuits.  As Calvin walks into the bathroom, he asks how he's ever going to learn to be an astronaut.
    characters: [calvin, mom]
  "19930207":
    transcript: Eeww! What's this?! Ug, who can tell? Keep stirring!!What an awful job! This is the worst! Well somebody's got to do it. Heads up!! Oh no! It's bubbling up! Aiee! Chemical reaction!! Look out! Run! Run! It's gonna blow! Buurrrpp! Calvin, that's enough! I can't help it! My stomach microbes can't handle this awful food.
    description: Bugs are stirring something.  They says it's bubbling up.  They run, as the mixture is going to blow.  Calvin belches at the dinner table.  Dad tells him that's enough.  Calvin says he can't help it.  His stomach microbes can't handle the awful food.
    characters: [calvin, dad]
    source: miraheze
  "19930208":
    transcript: Oh lovely snowball, packed with care, smack a head that's unaware! Then with freezing ice to spare, melt and soak through underwear! Fly straight and true, hit hard and square! This, oh snowball, is my prayer. I only throw consecrated snowballs.
    description: In poem, Calvin talks about a snowball packed with care smacking a head that's unaware.  With freezing ice to spare, it melts and soaks through underwear.  He tells the snowball to fly true, hit square, he tells the snowball that's his prayer.  He says he only throws consecrated snowballs.
    characters: [calvin]
  "19930209":
    transcript: What are you doing? I'm throwing people off my trail with deceptive footprints. See everyone will think these tracks were made by a one-legged kid going THAT way, and they'll be completely wrong! Who exactly is on your trail? Look, it doesn't hurt to take precautions.
    description: Calvin hops backward in the snow.  He's making deceptive footprints.  He tells Hobbes people will think the tracks were made by a one-legged kid going the other way.  Hobbes asks who's on his trail.  Calvin says it doesn't hurt to take precautions.
    characters: [calvin, hobbes]
  "19930210":
    transcript: Nobody can make me go inside! I've got 200 snowballs that say I'm staying OUT! No one's gonna make ME come in the house! DOESN'T ANYBODY MISS ME?!?
    description: Calvin has 200 snowballs in his snow fort.  He says nobody's going to make him come in the house.  He waits, and waits.  He opens the door to the house, asking if anybody misses him.
    characters: [calvin]
  "19930211":
    transcript: 'I used to hate writing assignments, but now I enjoy them. I realized that the purpose of writing is to inflate weak ideas, obscure poor reasoning and inhibit clarity. With a little practice, writing can be an intimidating and impenetrable fog! Want to see my book report? "The Dynamics of Interbeing and Monological Imperatives in Dick and Jane: A Study in Psychic Transrelational Gender Modes." Academia, here I come!'
    description: 'Calvin now enjoys writing assignments.  He realizes the purpose is to inflate weak ideas, obscure poor reasoning, and inhibit clarity.  He asks Hobbes if he wants to see his book report.  "The Dynamics of Interbeing and Monological Imperatives in Dick and Jane:  A Study in Psychic Transrelational Gender Modes".'
    characters: [calvin, hobbes]
  "19930212":
    transcript: Here we are, high on Rigor Mortis Ridge, steeling ourselves for the terrifying descent into Grim Reaper Gorge! Why do we risk life and limb in a vertical free fall, when we could be safe at home by the fire? Because it is man's indominable nature to scare himself silly for no good reason! If you make it home to the fire, you can tell me how it was. See? This is why there were never any great animal explorers!
    description: On Rigor Mortis Ridge, Calvin and Hobbes sit on the toboggan.  Calvin asks why they risk life and limb when they could be safe by the fire at home.  He says it's man's nature to scare himself silly for no good reason.  Hobbes gets off the toboggan.  As Calvin goes down, Hobbes says if he makes it home to the fire, he can tell Hobbes how it was.  Calvin yells this is why there are no great animal explorers.
    characters: [calvin, hobbes]
  "19930213":
    transcript: SMACK! AH HA HA HA! That was hilarious! Ha ha ha! POW! A joke is never as funny the second time you hear it.
    description: Calvin hits someone with a snowball.  He laughs, saying that was hilarious.  He gets hit by a snowball.  He says a joke is never as funny the second time you hear it.
    characters: [calvin]
  "19930214":
    transcript: Today is Valentine's Day. SO WHAT?! WHO CARES?! NOW ME! Who's your valentine THIS year?? NOBODY! Is it SUSIE?? NO! I'll bet she IS! I'll be your heart beats faster at the sound of her name! Ahh, how you long to gaze deep into her shimmering eyes!! WHAT?! Your cheeks are flushed! Your chin quivers to imagine her soft, warm lips pressed against yours! Oh, to be locked for an eternity in a passionate embrace with sweet, sweet Susie! TAKE IT BACK! Can I be "Best Tiger"? TAKE IT BACK! Have you picked out a ring yet? TAKE IT BACK! Where's the honeymoon? Hey, Calvin! Huh?? You jerk! This is for sending me a Valentine card with a drawing of me as a worm-eaten corpse! Oh HO-O-O! You sent her a CARD?? Doctor Love, paging Doctor I.M.N. Love! I'd say were about due for another Saint Valentine's Day massacre.
    description: Hobbes asks if Susie is Calvin's valentine this year.  Calvin says no.  Hobbes bets Calvin's heart beats faster at the sound of her name.  He says Calvin longs to look into Susie's eyes.  Hobbes says Calvin's cheeks are flushed.  He says Calvin quivers to imagine Susie and him locked for eternity in a passionate embrace.  Calvin gets angry and fights with Hobbes.  Hobbes asks where the honeymoon is, if he can be "best tiger", and if Calvin has picked out a ring yet.  Susie comes up to them and hits Calvin with a snowball for sending her a valentine with a picture of her as a worm-eaten corpse.  Hobbes asks if Calvin sent her a card.  He pages Doctor Love, Doctor I.M.N. Love.
    characters: [calvin, hobbes, susie]
    source: s-anand+seligman+miraheze
  "19930215":
    transcript: I should be doing my homework now. But the way I look at it, playing in the snow is a lotm ore important. Out here I'm learning real skills that I can apply throughout the rest of my life. Such as? Procrastinating and rationalizing.
    description: Building a snowman, Calvin says he should be doing his homework.  He thinks playing is more important.  He's learning skills that he can apply throughout his life.  Hobbes asks what skills those are.  Calvin says procrastinating and rationalizing.
    characters: [calvin, hobbes]
  "19930216":
    transcript: Look at that! An angel. It must be a FALLEN angel! Generally they burn up in the atmosphere, but this one apparently vaporized on impact, leaving this angel-shaped crater in the snow! There are more over there. God must've been punting angels left and right. Strange that there would be so many in Susie's front yard. I'll bet they're all related to her.
    description: Calvin and Hobbes see a snow angel.  Calvin thinks it must be a fallen angel.  He says they usually burn up in the atmosphere.  Hobbes sees more snow angels.  Calvin thinks God must have been punting angels right and left.  Hobbes thinks it's strange so many would be in Susie's front yard.  Calvin figures they're all related to her.
    characters: [calvin, hobbes]
  "19930217":
    transcript: I'm making a monumental, heroic snow sculpture. It will be called "The Triumph of Perseverence." Very inspiring. What will it look like? This. You're through? I'm bored.
    description: Calvin's making a heroic snow sculpture.  He has one snowball made.  He will call it "The Triumph of Perseverance".  Hobbes asks what it will look like.  Calvin says like this.  Hobbes asks if he's through.  Calvin says he's bored.
    characters: [calvin, hobbes]
  "19930218":
    transcript: "Important message this way. Important message next sign. Important message: Look out! It's like shooting fish in a barrel."
    description: Susie sees a sign saying there is an important message with an arrow.  She runs over to see another sign, saying the next sign has the important message.  She gets to the sign which reads "Look out".   Above the sign, in the tree, Calvin drops a big snowball.  He says it's like shooting fish in a barrel.
