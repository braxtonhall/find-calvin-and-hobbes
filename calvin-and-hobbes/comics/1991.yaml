  "19950317":
    transcript: I like to set kites free.
    description: Calvin launches a kite.  He looks at it in the sky, then he lets loose of the string.  He walks back, saying he likes to set kites free.
    characters: [calvin]
  "19950318":
    transcript: Sometimes when I'm talking, my words can't keep up with my thoughts. I wonder why we can think faster than we can speak. Probably so we can think twice.
    description: Calvin tells Hobbes that sometimes when he's talking, his words can't keep up with his thoughts.  He wonders why they think faster than they can speak.  Hobbes guesses it's probably so they can think twice.
    characters: [calvin, hobbes]
  "19950319":
    transcript: Hey, there's some sort of remote control gizmo in this drawer. I wonder what it does. Click. WAAA! Mom?? Dad??? CALVIN! SIGHHH. Calvin, that's very annoying.
    description: Calvin finds a remote control gizmo in a drawer.  He wonders what it does and clicks it.  He drops down a tube to see Mom and Dad in a control room with a spacecraft.  Mom and Dad are dressed in superhero costumes.  Calvin stands in the living room looking at Mom and Dad.  He sighs.
    characters: [calvin, mom, dad]
    source: s-anand+seligman+miraheze
  "19950320":
    transcript: FREE! Ha ha! This walk goes to MY house. I know that.
    description: Hopping off the school bus, Calvin says he's free.  Susie follows Calvin.  He notices her behind him and says this walk goes to his house.  Susie replies that she knows.  Calvin runs, and Susie follows him.
    characters: [calvin, susie]
  "19950321":
    transcript: YOUR house is over there. Want me to draw you a map of how to get there? Obviously I'm not GOING to my house. It's a lot MORE obvious that you're not coming to MY house! I have to stay here until my Mom gets home. WHAT?! Says who?? My Mom and your Mom! You think I made this up? You think I want to be here?? Well, it's my Mom's rule that you can sit in our yard, but you can't come in the house. Your Mom didn't say that!
    description: Calvin tells Susie her house is the other way.  She isn't going to her house.  Calvin tells her she can't come to his house.  Susie says she has to stay with him until her mom gets home.  She says their moms agreed to it.  Susie isn't happy about it any more than Calvin is.  Calvin informs Susie that she can sit in the yard, but she can't come into the house.  Susie contends Calvin's mom didn't say that.
    characters: [calvin, susie]
  "19950322":
    transcript: Let me in! Your Mom said I could stay here! No! Go away! You can wait in a tree! I'm telling! HELLO? HELLO? CALVIN WON'T LET ME IN! AAUGH! shh! shhh! OK, OK! In fact, heh heh heh, why don't you go in ahead of me? I just remembered a big orange surprise waiting for you! Don't be scared! Yeah, I'm trembling. I'll just step way, way back here!
    description: Calvin and Susie are fighting about her waiting in Calvin's house.  Susie yells that Calvin won't let him in.  Suddenly, Calvin pushes her next to the door.  He just remembered a big orange surprise waiting for her.  Susie starts to open the door.  Calvin runs back away from her.
    characters: [calvin, susie]
  "19950323":
    transcript: Is this your "big orange surprise"? Doggone it, Hobbes! Didn't you pounce?! Here's your tiger. He was by the door. WHAT'S WITH THE TIE?! Hello, Susie. Come on in. My Mom didn't call and say I could go home yet, did she? YOU DRESSED UP FOR A GIRL??!
    description: Susie asks if this is his big orange surprise.  Calvin asks if Hobbes didn't pounce on her.  Susie hands Hobbes to Calvin, saying he was by the door.  Hobbes is wearing a tie.  Mom tells Susie to come in.  Susie asks if her mom called to say she could come home already.  Calvin chastises Hobbes for dressing up for a girl.
    characters: [calvin, hobbes, mom, susie, stuffedhobbes]
  "19950324":
    transcript: Would you care for a snack, Susie? Um, OK. Thank you. Well? What have you got to say for yourself? When one entertains female friends, one should try not to look quite as seedy as certain unnamed parties habitually do. Who's entertaining?! Who's a female friend? Who looks seedy?! A spotted tie is just the thing when you're wearing stripes! Tigers have a natual flair for causal chic! I can't believe this. Why didn't you kill her when she came in the door?! By the way, if you had made proper introductions, we might have smooched her hand. Here, let me adjust the narrow end of your tie about eight inches.
    description: Mom offers Susie a snack.  Calvin asks Hobbes what he has to say for himself.  Hobbes says that when entertaining female friends, one shouldn't look quite as seedy as certain unnamed parties habitually do.  Calvin wonders who's entertaining and who looks seedy.  Hobbes thinks a spotted tie is just the thing when you're wearing stripes.  Calvin asks why Hobbes didn't kill her when she came through the door.  Hobbes tells Calvin that if he had made proper introductions, he might have smooched her hand.  Calvin reaches toward Hobbes offering to adjust the narrow end of his tie about eight inches.
    characters: [calvin, hobbes, mom, susie, stuffedhobbes]
  "19950325":
    transcript: What happened to YOU? Hobbes and I had a frank exchange of ideas. What are you doing? Homework?? I wasn't sure I understood this chapter, so I reviewed my notes from the last chapter and now I'm rereading this. You do all that WORK?! Well, now I understand it. Huh! I used to think you were smart.
    description: Calvin walks past Susie all scratched.  Susie asks what happened.  Calvin says he and Hobbes had a frank exchange of ideas.  Calvin asks what she's doing.  Susie tells him she wasn't sure she understood a chapter of her school work, so she reviewed her notes from the last chapter and is rereading the book.  Calvin asks if she does all that work.  Calvin walks away saying he used to think she was smart.
    characters: [calvin, susie]
  "19950326":
    transcript: "ZZZ ZZZZZZ OOMF! Cat nap, noun: a quick, light doze in the manner of cats. I KNOW what it means!"
    description: Calvin is home from school.  Hobbes sees him from the window and prepares to pounce.  Calvin stops at the door.  Inside, Hobbes wonders what's happening.  Calvin sits on the steps.  Hobbes lies down.  Calvin continues to wait outside.  Hobbes falls asleep.  When Calvin hears Hobbes snoring, he opens the door.  He is pounced upon by Hobbes.  Hobbes gives Calvin a definition of "cat nap".
    characters: [calvin, hobbes]
    source: s-anand+seligman+miraheze
  "19950327":
    transcript: Where's Susie? She's in the living room doing her homework. NOW? She's not putting it off until bedtime? She says she needs to get it done so she can practice the piano when she goes home! Wow, it's like science fiction or something. "The Gender from Outer Space"!
    description: Calvin tells Hobbes that Susie is doing her homework.  Hobbes wonders why she doesn't put it off until bedtime.  Calvin informs him that she says she needs to get it done so she can practice the piano when she gets home.  Hobbes thinks this is like science fiction.  Calvin calls it "The Gender From Outer Space".
    characters: [calvin, hobbes]
  "19950328":
    transcript: This emergency meeting of the Get Rid Of Slimy girlS club will come to order. Dictator-for-life Calvin presiding! Oyez! Oyez! As we're all aware, the enemy has infiltrated our territory and is spreading disinformatio to the effect that homework ought to be done right after school! As my Mom may have covert girl sympathies, we must eradicate the hostile forces! Any questions? Yes, could we poke some air holes in here? Too risky. The box of secrecy must remain secure!
    description: Calvin calls an emergency meeting of G.R.O.S.S. under a box in his bedroom.  Calvin says they've been infiltrated by the enemy who is spreading disinformation that homework ought to be done right after school.  Calvin says though Mom has covert girl sympathies, they must eradicate the hostile forces.  He asks if there are questions.  Hobbes asks if they can put some air holes in the box.  Calvin says the box of secrecy must remain secure.
    characters: [calvin, hobbes]
  "19950329":
    transcript: 'OK, we both understand the secret plan? Got it. But what about a secret code? A secret code? This secret plan doesn''t need a secret code. Ahem. "Section IV, Article 12: Every secret plan needs a secret code. A. The more complicated the better. B. Everybody already knows pig latin. C. Phrases like ''code blue'' are cool." Our club charter never lies. That''s why this is such a great club.'
    description: Calvin asks if Hobbes understands the secret plan.  He does, but he asks about the secret code.  Calvin says the secret plan doesn't need one.  Hobbes shows their club charter, which indicates every secret plan needs a secret code.  Calvin says the club charter never lies.  Hobbes says that's why this is such a great club.
    characters: [calvin, hobbes]
  "19950330":
    transcript: Hey! I can't get out! I'm stuck! Help! Calvin? Susie, I'm trapped in the hall closet! Open the door! let me out! Help! Help! Hurry! Quick! I'm in the closet! Open the door and get me out of... SLAM HEY! YES!
    description: Susie hears Calvin's voice in the closet saying he can't get out.  She opens the door and goes in, only to find a tape recorder playing Calvin's message.  Calvin and Hobbes slam the closet door shut.
