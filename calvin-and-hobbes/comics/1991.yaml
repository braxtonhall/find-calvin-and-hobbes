  "19950918":
    transcript: Wake up! It's time to get ready for school. Just checking. I'm glad you're up and dressed. That should throw her off the trail for a while.
    description: Mom wakes Calvin for school.  He gets dressed.  Mom looks in to see Calvin is dressed.  Calvin crawls back in bed, saying that should throw them off the trail for awhile.
    characters: [calvin, mom]
  "19950919":
    transcript: For show and tell, I brought a little toy airplane. It's sort of ordinary, I suppose. But I like to have it around. It reminds me that as soon as I save a little more money, I'll buy a ticket and put so much distance between you chumps and me, it will boggle your minds. It's not an "attitude". It's a fact.
    description: For show and tell, Calvin has a toy airplane.  He says it's ordinary, but he likes to have it around.  He says it reminds him that as soon as he saves a little more money, he'll buy a ticket and put so much distance between his classmate chumps and him, it would boggle their minds.  In front of the principal, Calvin defends himself, saying it's not an "attitude", it's a fact.
    characters: [calvin, spittle]
  "19950920":
    transcript: '"Original flavor" ... wait, here''s "Less sodium", and here''s "Lite", and here''s "Less fat". What if I wanted less fat AND less salt? What distinguishes "Lite" from these others? Does the "Original flavor" package imply that the others taste different? Frankly, my life was plenty complicated BEFORE the potato chips.'
    description: Dad is shopping.  He sees "original flavor", "low sodium", "lite", "less fat".  He wonders what he does if he wants less fat and less salt.  He wonders what distinguishes "lite" from the others.  He wonders if the "original flavor" package implies the others taste differently.  He says his life was plenty complicated before potato chips.
    characters: [dad]
  "19950921":
    transcript: Look at all this peanut butter! There must be three sizes of five brands of four consistencies! Who demands this much choice?? I know! I'll quite my job and devote my life to choosing peanut butter! Is "chunky" chunky enough, or do I need "EXTRA chunky"? I'll compare ingredients! I'll compare brands! I'll compare sizes and prices! Maybe I'll drive around and see what OTHER stores have! So much selection and so little time! I think YOU should do the shopping. Did the manager have to talk to you again? Hey, where's the peanut butter?!
    description: Dad sees several choices of peanut butter.  He wonders who demands so much choice.  He says he'll quit his job and devote his live to choosing peanut butter.  He'll compare brands and ingredients.  He'll compare sizes and prices.  He'll drive around seeing what other stores have.  At home, Dad tells Mom that she should do the shopping.  She asks if the manager had to talk to him again.  Calvin wonders where the peanut butter is.
    characters: [calvin, mom, dad]
  "19950922":
    transcript: Ook ook ee! Ooh! Ook. In humor, timing is everything.
    description: Calvin walks behind Moe.  Calvin drags his knuckles, then scratches himself like an ape.  Moe turns around and sees him.  Pounded, Calvin says in humor, timing is everything.
    characters: [calvin, moe]
  "19950923":
    transcript: I like cereal to crackle and pop when I put milk on it. See? Very entertaining. I've never seen raisin bran do that. I put in an alka-seltzer.
    description: Calvin tells Hobbes he likes his cereal to crackle and pop when he puts milk on it.  He shows Hobbes.  Hobbes says he's never seen Raisin Bran do that.  Calvin put in an Alka-Seltzer.
    characters: [calvin, hobbes]
  "19950924":
    transcript: The center snaps the ball to the quarterback! No he doesn't! He doesn't? No! Secretly, he's the quarterback for the other team! He keeps the ball! A traitor! Calvin breaks for the goal! Wheeee! He's at the 30... the 20... the 10! Nobody can catch him! Nobody wants to! You're running toward your own goal! Huh?! When I learned you were a spy, I switched goals. This is your goal, and mine's hidden! Hidden?! You'll never find it in a million years! I don't need to find it! As a traitor to your team, crossing my goal counts as crossing your goal! Ah, you might think so... In fact, I know so! But the place I hid my goal is right on top of your goal, so the points will go to me! But the fact is, I'm really a double agent! I'm on your team after all, which means you'll lose points if I cross your goal! Ha ha! But I'm a traitor too, so I'm really on your team! I want you to cross my goal! The points will go to your team, which is really my team! That would be true... if I were a football player! You mean..? I'm actually a badminton player disguised as a double-agent football player! And I'm secretly a volleyball-croquet-polo player! Sooner or later, all our games turn into Calvinball. No cheating!
    description: Calvin and Hobbes are playing football.  Calvin doesn't snap the ball, because secretly he's the quarterback for the other team.  Hobbes calls him a traitor.  Calvin heads for the goal.  Hobbes says he's running toward his own goal.  When Hobbes learned Calvin was a spy, he switched goals, and his is hidden.  Calvin says as a traitor, crossing his goal counts as crossing Hobbes' goal.  Hobbes says his goal is hidden right on top of Calvin's, so the points will go to him.  Calvin says he's really a double-agent.  Hobbes will lose points if Calvin crosses his goal.  Hobbes retorts that he's also a traitor.  The points will go to Calvin's team, which is really his team.  Calvin admits that would be true, if he were a football player.  He's really a badminton player disguised as a double-agent football player.  Hobbes is secretly a volleyball-croquet-polo player.  Calvin says sooner or later, all their games turn into Calvinball.  Hobbes tells him no cheating.
    characters: [calvin, hobbes]
  "19950925":
    transcript: I need your help, Hobbes. What's the problem? The teacher said my book report was terrible and I need to do it over. Really?? Obviously, I need a cooler letterhead logo. I'll add more lance-toting tigers around the Calvin shield.
    description: Calvin needs Hobbes' help.  The teacher said his book report was terrible, and it has to be done over.  Calvin says he obviously needs a cooler letterhead logo.  Hobbes starts adding lance-toting tigers around the Calvin shield.
    characters: [calvin, hobbes]
  "19950926":
    transcript: I hear we're having a fire drill today. Right. Wow! How exciting! I can't wait! Do you know what to do? You bet! When do they pass out the gasoline?
    description: Calvin asks Susie if they're having a fire drill today.  She says they are.  She asks if he knows what to do.  Calvin tells her he does, then asks when they pass out the gasoline.
    characters: [calvin, susie]
  "19950927":
    transcript: And so, after a three minute downpour, he became ludicrously attired for the rest of the day.
    description: Calvin stands waiting for the school bus.  He has his raincoat and hat on, holding an umbrella.  It's raining.  Then it stops, and the sun come out.  Calvin says that after the three minute downpour, he became ludicrously attired for the rest of the day.
    characters: [calvin]
  "19950928":
    transcript: Not everyone can get a foll isometric workout by just yawning.
    description: Hobbes stretches out, arches his back, then hunches it.  Calvin says not everyone can get a full isometric workout just by yawning.
    characters: [calvin, hobbes]
  "19950929":
    transcript: I wish school would disappear forever, right now! To make a bad day worse, spend it wishing for the impossible.
    description: Waiting for the school bus, Calvin says he wishes school would disappear forever right now.  The bus pulls up.  Inside, he says to make a bad day worse, spend it wishing for the impossible.
    characters: [calvin]
  "19950930":
    transcript: Uh oh, I feel a sneeze coming on. Aaa! No tissue! No hanky! I... ah.. ah.. ah.. KACHOO! Of my limited options, this was probably the worst.
    description: Calvin feels a sneeze coming on.  He has no tissue, no hanky.  He sneezes and holds his shirt up to his nose.  He says of his limited options, this was probably the worst.
    characters: [calvin]
  "19951001":
    transcript: The intrepid Spaceman Spiff is stranded on a distant planet! ...Our hero ruefully acknowldeges that this happens fairly frequently. To survive, Spiff must...find...food! Spiff follows a scavenger mordon! Perhaps there's a fresh kill nearby! Ughhh! The stench! Our hero becomes a vegitarian on the spot! But the grasses are indigestible! The fruit is poisonous! There is nothing to eat at all! Weak and desparing, Spiff peers into a frozen geyser pit! What's down there? Ice cream sandwiches! Our hero is saved! That's not very healthy. I only need to survive until I can escape, our hero mutters grimly.
    description: Spaceman Spiff is stranded on a distant planet.  To survive, he must find food.  Spiff follows a scavenger Mordon.  There may be a fresh kill nearby.  Due to the stench, our hero becomes a vegetarian on the spot.  The grasses can't be eaten.  The fruit is poisonous.  Weak and despairing, Spiff looks into a frozen geyser pit.  Ice cream sandwiches!  Our hero is saved!  Susie tells him that isn't very healthy.  Calvin mumbles he only needs to survive until he can escape.
    characters: [calvin, susie, spiff]
    source: miraheze
  "19951002":
    transcript: Boy, I hate school assignments! Miss Wormwood is out to destroy my life! What do you have to do? Make a leaf collection! What a dumb waste of time! How many leaves do you need? 50! I gotta collect 50 leaves! And just when I thought of a loophole, the teacher said every leaf has to be a different kind. She's got your number.
    description: Calvin throws his books, saying he hates school assignments.  He says he has to make a leaf collection.  Hobbes asks how many leaves he needs.  Fifty, Calvin replies.  Hands in pockets, Calvin says that just when he thought of a loophole, Miss Wormwood said each leaf had to be a different kind.  Hobbes says she has his number.
    characters: [calvin, hobbes]
  "19951003":
    transcript: When do you need to present your leaf collection? In two weeks. That's not so bad. You just need three or four leaves a day. I'm not working on weekends. OK, five leaves a day. And my weekdays are booked until next Thursday at 6pm! So you need 50 leaves an hour. See? It's impossible!
    description: Hobbes asks when Calvin's leaf collection is due.  Calvin tells him two weeks.  Hobbes says that's only three or four leaves a day.  Calvin says he's not working weekends.  Hobbes says then it's five leaves a day.  Calvin says his weekdays are booked until next Thursday at 6 PM.  Hobbes says he'll need fifty leaves an hour.  Calvin says it's impossible.
    characters: [calvin, hobbes]
  "19951004":
    transcript: Here's a nice leaf! Do you want it for your collection? No. Why not? It's a beautiful afternoon! I'm not going to waste it doing ridiculous busywork for school! But this would be one less leaf you'd need to collect later. Yeah, but it's one MORE leaf than I need right now. Somehone, it's always right now until it's later. Whatever THAT means.
    description: Hobbes sees a leaf for Calvin's collection.  He doesn't want it.  It's a beautiful afternoon, and he won't waste it doing busywork for school.  Hobbes tells him it would be one less leaf to collect later.  Calvin replies it's one leaf more than he needs right now.  As Hobbes tosses the leaf, he says somehow, it's always right now until it's too late.
    characters: [calvin, hobbes]
  "19951005":
    transcript: Hi, Calvin. Have you started your leaf collection yet? I've been visualizing the conceptualisation process. That's the hard part. I'M almost done. Isn't it fun? It's like a treasure hunt! A treasure hunt?!? Are you crazy?? This is a stupid, boring, time-wasting forced assignment! This isn't fun! "When life gives you a lemon, make a lemonade." I say, when life gives you a lemon, wing it right back and add some lemons of your own!
    description: Susie asks if Calvin has started his leaf collection.  Calvin says he's been visualizing the conception process.  Susie is almost done.  She says it's almost like a treasure hunt.  Calvin yells to her that it's a stupid, boring, forced assignment.  It isn't fun.  Susie says that when life gives you a lemon, make lemonade.  Calvin says when life gives you a lemon, wing it right back and add some lemons of your own.
    characters: [calvin, susie]
  "19951006":
    transcript: Our leaf collections aren't due for a week yet! How could you possibly be almost done?! I make it a game. I pretend it's a contest to see how many leaves I can find each day. That way, it's not an assignment, it's fun! Did you know that's one of the ten warning signs of hopeless dweebism? I'll bet another sign is moving to the next grade each year.
    description: Calvin asks how Susie could almost be done if the collections aren't due for a week.  Susie makes it a game.  She sees how many leaves she can find each day.  Then it's not an assignment, it's fun.  Calvin asks if she knows that's one of the ten warning signs of hopeless dweebism.  Angrily, Susie walks off.  She says she bets another sign is moving to the next grade each year.
    characters: [calvin, susie]
  "19951007":
    transcript: The teacher reminded us that we only have a week left to finish our leaf collections, so we ought to be half done now. You haven't even started. Yeah, but I work better under pressure. Actually, you work ONLY under pressure. That way, the work time is more miserable, but there's less of it.
    description: Riding down the hill in the wagon, Calvin tells Hobbes that the teacher reminded the class there is only a week left for their leaf collections.  They should be half done now.  Hobbes reminds Calvin he hasn't started.  Calvin says he works better under pressure.  Hobbes clarifies that he only works under pressure.  Calvin says the work time is more miserable, but there's less of it.
    characters: [calvin, hobbes]
  "19951008":
    transcript: The world isn't so bad if you can just get out in it.
    description: Mom tosses Calvin out the door to catch the school bus.  Miss Wormwood is frustrated with his paper.  Moe steals the ball from him.  Calvin can't figure out the math problem in front of the class.  Calvin drags mud in on his shoes, and Mom yells at him.  Finally, Calvin goes outside to play.  He tells Hobbes the world isn't so bad if you can just get out in it.
    characters: [calvin, hobbes, mom, wormwood, moe]
  "19951009":
    transcript: Mom, I need to collect leaves for a school project. Could we go to the arboretum sometime? Sure. How about this weekend? Um, it would be better to do it a little sooner. When is this due? Well, my notebook's in the car and the park closes in 20 minutes. Calvin, I'm fixing dinner!
    description: Calvin asks Mom if they can go to the arboretum, since he has to collect leaves for the school project.  Mom says they can go that weekend.  Calvin thinks it would be better if they did it sooner.  Mom asks when it's due.  Calvin says the notebook is in the car and the park closes in twenty minutes.  Mom says she's making dinner.
    characters: [calvin, mom]
  "19951010":
    transcript: My leaf collection is doomed! I can't believe Mom wouldn't take me to the arboretum. No wonder I get bad grades! Well, you did spring the idea on her at the last second... That's when I thought of it! The problem is that Mom's not flexible. What a stupid waste of time this is! I wish there was some way out of this assignment.
    description: Calvin is grabbing leaves off the ground.  He can't believe Mom wouldn't take him to the park.  He says it's no wonder he gets bad grades.  Hobbes says he did spring it on Mom at the last second.  Calvin complains that's when he thought of it.  The problem is that Mom isn't flexible.  Calvin wishes there was some way out of the assignment.  Suddenly, a spacecraft appears above them.
    characters: [calvin, hobbes]
  "19951011":
    transcript: A UFO!! Take us to the Supreme Earthling Potentate. Um... well... Speaking. Ah! What luck. It was I who chose the landing site. Kudos for Navigator Nebular!
    description: Two aliens come out of their spacecraft and ask to see the supreme earthling potentate.  Calvin says they're speaking to him.  One of the aliens says he chose the landing site.  Kudos to navigator Nebular.
    characters: [calvin, hobbes, galaxoidnebular]
  "19951012":
    transcript: So, uh, what can I do for you? We are taking over your world. You are?? What for?? Earth is prime real estate. Location, location, location. I guess I'd never thought about that. Charm, atmosphere, quiet galaxy... Actually the atmosphere needs cleaning. A good fixer upper.
    description: The aliens are taking over the world.  Calvin asks why.  The aliens reply earth is prime real estate.  Calvin says he never thought of that.  One alien says there is charm, atmosphere, and a quiet galaxy.  Hobbes says the atmosphere needs cleaning.  The other alien says it's a good fixer upper.
    characters: [calvin, hobbes, galaxoidnebular]
  "19951013":
    transcript: As Supreme Earthling Potentate, I'm afraid I can't let you just come in and take over the planet. You make this difficult. Prepare for war. Let's not be hasty. I'll trade you Earth for 50 alien tree leaves. Pst! These primitive fools must use leaves as currncy! It's a deal! I need them by 8:00 tonight, and they have to be properly identified and labeled. Hurry, Nebular! At light speed, we can just make it! our leader will be most pleased.
    description: Calvin says he can't let them come in and take over the planet.  The aliens tell him to prepare for war.  Calvin offers to trade the earth for fifty alien tree leaves.  One alien whispers the primitive fools must use leaves for currency.  It's a deal.  Calvin says he needs them by 8:00 tonight, properly identified and labeled.  The aliens race off, saying their leader will be most pleased.
    characters: [calvin, galaxoidnebular]
  "19951014":
    transcript: You're trading the Earth for 50 alien tree leaves?! I'll have the coolest project in the class! And best of all, we don't need to waste any more time on this! The aliens are doing all the work! We can goof off the rest of the day! But then the aliens take over the Earth. Well it's not like the grownups have done such a bang-up job.
    description: Hobbes asks Calvin if he's trading earth for fifty alien tree leaves.  Calvin says he'll have the coolest project in class.  Plus, he doesn't have to waste any more time on gathering his own leaves.  They can goof off all day.  Hobbes says then the aliens take over the earth.  Calvin replies it isn't like the grownups have done such a bang-up job.
    characters: [calvin, hobbes]
  "19951015":
    transcript: I love fall. I like the cool days, the smell of leaves, the low sunlight...and the sky looks even more blue when the trees are yellow and red! I dunno...I think autumn is melancholy. Summer if over an ina week or two, everything will be hankered down for the long bleak winter. Nothing lasts, fall is just the last fling before things get worse. If good things lasted forever, would we appreciate how precious they are? I like to have everything so good. I can take it all for granted. I think the brisk air makes apple pie taste better too! Mm-mm!
    description: Hobbes loves the fall.  He likes the cool days, the smell of leaves, the colors.  Calvin says autumn is melancholy.  Summer is over in a week or two, and things will hunker down for a long winter.  Nothing lasts.  He says fall is a last fling before things get worse.  Hobbes asks if they' appreciate how precious things are if they lasted forever.  Calvin likes to have everything so good, so he can take it all for granted.
    characters: [calvin, hobbes]
    source: miraheze
  "19951016":
    transcript: Hey, no TV until your leaf collection is done. It's getting done as we speak. What's that supposed to mean? Let's see it. I can't show you until later tonight. Why not? You should probably sit down. man, she didn't even want to HEAR about it.
    description: Mom tells Calvin he can't watch TV until his leaf collection is done.  He says it's getting done as they speak.  Mom asks what he means.  She wants to see the collection.  Calvin says she should sit down.  Upstairs, Calvin grumpily walks in saying Mom didn't even want to hear about it.
    characters: [calvin, hobbes, mom]
  "19951017":
    transcript: It's almost bedtime and the aliens haven't come back with the leaves. It's a long trip. What if they don't show up? They SAID they would. Maybe they got lost. Space aliens don't get lost! They've got superior technology! Everybody knows that! It's a big universe. I'll turn on some more lights.
    description: As they play, Hobbes says it's almost bedtime, and the aliens haven't returned with the leaves.  Calvin says it's a long trip.  Hobbes asks what happens if they don't show up.  Calvin says they told him they would.  Hobbes wonders if they got lost.  Calvin tells him their superior technology prevents them getting lost.  Hobbes says it's a big universe.  Calvin offers to turn on more lights.
    characters: [calvin, hobbes]
  "19951018":
    transcript: The aliens still haven't shown up! What are we going to do?? I've got to turn in my leaf collection tomorrow! I'll bet those dumb aliens got back to their planet and procrastinated! I'll bet they have no respect for deadlines! I'll bet they put everything off and are doing a lousy job at the last second! How could anyone be so irresponsible? If they're not here in five minutes, I'm not handing over the Earth! They've got to learn a lesson!
    description: Calvin says the aliens haven't shown up.  He bets the aliens got back to their planet and procrastinated.  He bets they have no respect for deadlines.  He bets they put it off and are doing a lousy job at the last second.  Hobbes rolls his eyes and wonders how anyone could be so irresponsible.  Calvin says if they aren't there in five minutes, he's not handing over the earth.
    characters: [calvin, hobbes]
  "19951019":
    transcript: Look! I see headlights coming over the trees! The aliens are back! Man, it's about time! C'mon, let's go get my leaf collection! You're out collecting LEAVES at THIS hour in your PAJAMAS?!? Get back in bed!! I TOLD you! Space aliens gave me these! They just left!
    description: Hobbes sees headlights over the trees.  Calvin thinks it's the aliens.  He goes to collect his leaves.  Dad sees Calvin outside collecting leaves in his pajamas.  Dad has a flashlight.  He tells Calvin to get in bed.  Calvin says space aliens left the leaves for him.
    characters: [calvin, hobbes, dad, stuffedhobbes]
  "19951020":
    transcript: Boy, you look tired. I'll bet you were up late doing your leaf collection. Maybe, but I'VE got the best collection of all! MY leaves are from another planet! What?! See how bizarre they are? The labels are even written in an alien language! Look at their cool alphabet! It looks like you took 50 maple leaves and cut them into weird shapes. Aliens now own the Earth and I told them girls make good zoo exhibits.
    description: Susie asks Calvin if he was up late doing the leaf collection.  Calvin tells her his leaves are from another planet.  Susie looks at them and says he took fifty maple leaves and cut them into weird shapes.  Calvin informs Susie that aliens now own the earth and he told them girls make good zoo exhibits.
    characters: [calvin, susie]
  "19951021":
    transcript: The teacher didn't believe my leaves were from an alien planet. She said it was obvious I did the whole thing last night and I made a mockery of the assignment. Well, she'll be sorry when the aliens send her to the plutonium mines. She just won't admit it was a pointless project. Who cares about leaves?! What useless knowledge! I believe that's poison sumac you're holding. This?? What makes you say that?
    description: Calvin says the teacher didn't believe his leaves were from an alien planet.  She told Calvin it was obvious he did it last night and make a mockery of the assignment.  Calvin grabs some leaves and tells Hobbes the teacher won't admit it was a pointless project.  He asks who cares about leaves.  He calls it useless knowledge.  Hobbes tells Calvin he's holding poison sumac.  Calvin asks what makes Hobbes say that.
    characters: [calvin, hobbes]
  "19951022":
    transcript: My, what an ugly tree. Where the heck did my leaf pile go?! It went back home! Don't you have anything bigger than a rake??
    description: A pile of leaves sneaks along.  It climbs back into the tree.  Calvin walks by and comments on how ugly the tree is with a big pile of leaves sitting in it.  It falls down on him.  Calvin runs.  Dad asks where his leaf pile went.  Calvin informs him it went back home.  He asks if Dad doesn't have something larger than a rake.
    characters: [calvin, dad]
    source: miraheze
  "19951023":
    transcript: ""
    description: Dad rides his bicycle, then hits a rock and falls.  At home, battered, Dad takes a bath.  Afterward, he looks at a tricycle and wonders.
    characters: [dad]
  "19951024":
    transcript: He's at the 30... the 20... Calvin's going for the touchdown! WAAA thwangg. You're supposed to TACKLE me! I dunno... that seems so lowbrow.
    description: Calvin is running with the football.  He's going for a touchdown.  Hobbes pulls a rope he has tied to a string.  Calvin trips.  On the ground, Calvin tells Hobbes he's supposed to tackle him.  Hobbes says that seems so lowbrow.
    characters: [calvin, hobbes]
  "19951025":
    transcript: You know, school wouldn't be so bad if you didn't have to go every day. ... and if you didn't have to learn anything... and if you took away all the teachers and all the other kids. If it was completely different, school would be great. A lot of things are like that. Nobody asks me how things ought to be. I've got tons of ideas!
    description: Calvin tells Hobbes school wouldn't be so bad if you didn't have to go every day...and if you didn't have to learn anything...and if you took away the teachers and other kids.  School would then be great.  Hobbes tells him a lot of things are like that.  Calvin says nobody asks him how things ought to be.  He has tons of ideas.
    characters: [calvin, hobbes]
  "19951026":
    transcript: Yes, Calvin? Hey kids, on tomorrow's show and tell, I'll be bringing a big surprise! Will it shock you and amaze you... OR will it disgust and terrify you?? Find out tomorrow when I reveal my next SHOW AND TELL HORROR! Don't miss it! Returning to the LESSON.... That's called a teaser, by the way.
    description: Calvin raises his hand in class.  He tells the class that tomorrow, he'll bring a big surprise.  It will either shock and amaze them, or it will disgust and terrify.  He tells them not to miss it.  Miss Wormwood tries to return to the lesson.  Calvin tells the class that's called a teaser.
    characters: [calvin, wormwood]
  "19951027":
    transcript: In the future, everything will be effortless. Computers will take care of every task. We'll just point to what we want done and click. We'll never need to leave the climate-controlled comfort of our homes! No nuisance, no wasted time, no annoying human interaction... ...no life. Life is too inconvenient.
    description: Calvin thinks everything will be effortless in the future.  Computers will handle every task.  They'll never leave the climate-controlled comfort of their homes.  He says there will be no nuisance, no wasted time, no annoying human interaction.  Hobbes suggests that would be no life.  Calvin says life is too inconvenient.
    characters: [calvin, hobbes]
  "19951028":
    transcript: You're going to juggle eggs? It's a metaphor for life, Hobbes. Each egg represents one of life's concerns and the goal is to give each the appropriate amount of individual attention while simultaneously watching and guiding all the others. Life is about balance and staying quick and alert as everything threatens to spin out of control! And sometimes we make a big mess of things. But the important thing is persistence.
    description: Hobbes asks if Calvin is going to juggle eggs.  Calvin says it's a metaphor for life.  Each egg represents one of life's concerns.  The goal is to give the right amount of attention while watching and guiding the others.  Life is about balance and staying alert as things threaten to spin out of control.  There are broken eggs all over the living room.  Hobbes says sometimes, they make a big mess of things.  Calvin says the important thing is persistence.
    characters: [calvin, hobbes]
  "19951029":
    transcript: Yawwwn Ahhh
    description: Asleep in bed, Hobbes yawns and rolls over, taking Calvin's blanket.  Calvin tries to pull it back to no avail.  He then rolls Hobbes back over, only to find he is at the edge of the bed.  He pushes Hobbes back over again, and there goes the blanket with Hobbes.  Calvin goes to Mom and Dad's bedroom.  He crawls into bed next to Mom and rolls over.  There goes the blanket, leaving Dad without any cover.
    characters: [calvin, hobbes, mom, dad]
  "19951030":
    transcript: "*KHHKHKT* Boy genius to fanged terror, come in! Do you read me? Over! *KHKKHHKT* I'LL take the walkie-talkie. YOU take the test. Ixsay inusmay ourfay! Urryhay!"
    description: Miss Wormwood sits at her desk.  She hears "Boy genius to fanged terror".  Calvin is talking into a walkie-talkie in pig Latin.  He's asking for the answer to six minus four.  Miss Wormwood says she'll take the walkie-talkie, and Calvin can take the test.
    characters: [calvin, wormwood]
  "19951031":
    transcript: Trick or treat! Where's your costume? What are you supposed to be? I'm yet another resource-consuming kid in an overpopulated planet, raised to an alarming extent by Madison Avenue and Hollywood, poised with my cynical and alienated peers to take over the world when you're old and weak! Am I scary, or waht?
    description: Calvin is trick-or-treating.  He's asked where his costume is and what he's supposed to be.  Calvin replies he's another resource-consuming kid in an overpopulated planet, raised by Madison Avenue and Hollywood, poised to take his place to take over the world.  As he walks away, he asks if he's scary or what.
    characters: [calvin]
  "19951101":
    transcript: Bok whiff whaff fiff foof I can't help but wonder what kind of desperate straits would drive a man to invent this thing.
    description: Calvin plays with a paddle ball.  Or he tries.  He can't help but wonder what kind of desperate straits drive a man to invent that thing.
    characters: [calvin]
  "19951102":
    transcript: Look! Geese flying south for the winter. Twice a year they migrate thousands of miles across the continent in an exhausting, eternal struggle to fulfill nature's unyielding demands. I'll bet that gets old real fast. You don't see ME keeping a summer home.
    description: Geese are flying south for the winter.  Calvin explains twice a year they migrate thousands of miles to fulfill nature's unyielding demands.  Calvin and Hobbes watch the geese.  Calvin says he bets that gets old real fast.
    characters: [calvin, hobbes]
  "19951103":
    transcript: Why isn't my life like this situation comedy? Why don't I have a bunch of friends with nothing to do but drop by and instigate wacky adventures? Why aren't my conversations peppered with spontaneous witticisms? Why don't my friends demonstrate heartfelt concern for my well-being when I have problems? Why don't you know any gorgeous babes? I gotta get my life some writers.
    description: Calvin asks why his life isn't like a situation comedy.  He asks why he doesn't have friends who drop by and instigate wacky adventures.  He asks why his conversations aren't peppered with spontaneous witticisms.  Hobbes asks if he knows any gorgeous babes.  Calvin says he needs to get his life some writers.
    characters: [calvin, hobbes]
  "19951104":
    transcript: Know what's weird? Day by day nothing seems to change, but pretty soon, everything is different. You just go about your business and one day you realize you're not the same person you used to be. People change whether they decide to or not! Thank heaven for small favors. For example, I used to be more tolerant of oblique aspersions.
    description: Calvin tells Hobbes that day by day, nothing seems to happen.  Pretty soon, though, things are different.  One day you realize you're not the same person you used to be.  People change whether they decide to or not.  Hobbes says thank heaven for small favors.  Calvin suspiciously looks at Hobbes and says he used to be more tolerant of oblique aspersions.
    characters: [calvin, hobbes]
  "19951105":
    transcript: I'm home! ...sighhhhhhhh... My life could stand a lot more pizzazz. Tell me about it.
    description: Calvin turns a tree into a transport pod and descends underground.  He gets out of the pod, and a robot salutes him.  He climbs into a spaceship and flies to a space station.  He tells Mom he's home.  Calvin looks around his house.  He tells Mom his life could stand a lot more pizazz.  Mom is vacuuming.  She says he should tell her about it.
    characters: [calvin, mom]
    source: miraheze
  "19951106":
    transcript: I wonder how long it's been since I last looked at the clock. Maybe it's been an hour. Well, actually it's probably been only 40 minutes. I'll guess half an hour to be safe. 20 seconds?!? It's going to be a very bad day. Calvin, sit up.
    description: Calvin wonders how long it's been since he looked at the clock.  He thinks maybe an hour.  He decides to guess half an hour to be safe.  He looks.  Twenty seconds!  He thinks it's going to be a very bad day.
    characters: [calvin, wormwood]
  "19951107":
    transcript: I'M IN A VERY CRABBY MOOD, SO EVERYBODY JUST LEAVE ME ALONE! I HATE EVERYONE!! Nobody recognizes my hints to smother me with affection.
    description: Calvin yells that he's in a crabby mood and wants to be left alone.  He storms off, then looks around.  He says nobody recognizes his hints to smother him with affection.
    characters: [calvin]
  "19951108":
    transcript: As a genius, it's important that I write a lot of letters. After all, my correspondence will be the basic resource material for historians to reconstruct my life. My writing will provide countless fascinating insights for biographers. Such as how all your salutations begin, "Hey boogerbrain". It's been three weeks and I still haven't received my X-Ray glasses!
    description: As a genius, Calvin says it's important he write a lot of letters.  He tells Hobbes his correspondence will be resource material for historians to reconstruct his life.  He says his writings will provide fascinating insights for biographers.  Hobbes notices how all his salutations begin "Hey, boogerbrain".  Calvin complains that it's been three weeks, and he still hasn't received his x-ray glasses.
    characters: [calvin, hobbes]
  "19951109":
    transcript: Yikes! Not another extreme close-up on somebody's anguish and grief! Why do TV cameras zoom in so close to people's faces that you can't even see their entire heads?! Do they think we can't read the person's expression from more than two inches away?! What a violation of personal space! What a shameless intrusion! What a heartless assault on human dignity! Why are you standing against the wall? I'm watching TV.
    description: Dad watches television.  He sees another extreme close-up of someone's anguish.  He wonders why cameras zoom in so close you can't see their entire head.  He asks if they think he can't read the person's expression from more than two inches away.  He calls it a violation of personal space.  It's a heartless assault on human dignity.  Mom asks why he's standing against the wall.  Dad says he's watching television.
    characters: [mom, dad]
  "19951110":
    transcript: AUGHH! THIS STUPID TOASTER BURNED MY TOAST!! Look at this! My toast is charred to a black cinder! I can't eat this! It's ruined! RUINED!! So stick in another piece of bread and watch it this time. Are you suggesting that this appliance didn't aggravate me with malice aforethought?!
    description: Calvin's toast is burned.  He complains that he can't eat it, and that it's ruined.  Mom walks by and tells him to stick another piece of bread in and watch it this time.  Calvin asks if she's suggesting the appliance didn't aggravate him with malice aforethought.
    characters: [calvin, mom]
  "19951111":
    transcript: I keep having the same weird dream every night. If it's the same dream, it must MEAN something. I think it means the fall season flopped and my subconscious went into reruns.
    description: Calvin keeps having the same dream every night.  Hobbes says if it's the same dream, it must mean something.  Calvin thinks it means the fall season flopped and his subconscious went into reruns.
    characters: [calvin, hobbes]
  "19951112":
    transcript: '"Operation Kapow!" (Calvin: genius + mastermind; Hobbes: creative consultant + cartographer) Top secret!! Do not read this!! This means you! #1: Take sled to top of Mt. Vertigo #2: Get up speed (This should look steeper) Faster faster! #3: Navigate through woods (in case enemies are following) (Trees) Whew #4: Go to secret pine tree #5: Grab hidden bucket of snowballs! #6: Blast Susie! Ha ha! Kapow! I hate you Calvin ow ow ow ow! #7: Make getaway (go fast here) Uhh you win Wheee #8: Hit ramp Deep trench #9: Hide in impenetrable fortress. Plot next attack! Medal of success recipients (This fort will be really really big) (5000 extra snowballs) Destroy this map! Calvin and Hobbes = great!! Now if it would only snow! While we''re waiting, I''ll draw more spirals above Susie''s head.'
    description: There is a map, drawn to show a sled ride down Mt. Vertigo, through the woods, going to the pine tree.  The map shows picking up hidden snowballs and blasting Susie.  It shows a getaway, and ending with a jump into an impenetrable fortress.  Calvin looks around wishing it would snow.  Hobbes says while they wait, he'll draw more spirals above Susie's head.
    characters: [calvin, hobbes, susie]
    source: miraheze
  "19951113":
    transcript: Brrr, it's freezing out there! I don't want to leave my nice warm bed. On days like this, I wish Mom would come in, lay an extra blanket over me, pat my head, and as I sink into the pillow under the weight of the covers, she'd say... HEY, LET'S MOVE IT!! THIS IS THE THIRD TIME I'VE CALLED YOU! YOU'RE GOING TO MISS THE BUS! LET'S GO!! These mornings are going to kill me.
    description: Snuggled under blankets, Calvin says he doesn't want to leave his warm bed.  He wishes Mom would lay an extra blanket on him, pat his head, and he'd sink into the pillow.  Mom yells in this is the third time she's called Calvin.  She says Calvin will miss the bus.  Shivering, Calvin gets up and says these mornings are going to kill him.
    characters: [calvin, mom]
  "19951114":
    transcript: The pace of modern life is all wrong. It makes every day an ordeal. Everybody's exhausted, stressed out, and short-tempered! Look at me! Why am I waiting for a bus at this horrible hour?! It's unnatural and unhealthy! We should EASE into the day! You know, read the paper, have some hot cocoa, go for a leisurely walk and get our thoughts together... So now it's mid-afternoon. Right. Time to kick back for a little siesta and plan dinner.
    description: Calvin says the pace of modern life is all wrong.  He says every day is an ordeal.  He asks why he's waiting for the school bus at that hour.  He says it's unnatural and unhealthy.  He says people should ease into the day.  They should read the paper, have cocoa, go for a walk.  Hobbes says it would then be mid-afternoon.  Calvin continues that it would be time to kick back and plan dinner.
    characters: [calvin, hobbes]
  "19951115":
    transcript: I want the last piece of pie! Don't divide it up! Give it all to ME! Don't be selfish, Calvin. So the real message here is "be dishonest"?
    description: There is one piece of pie left.  Calvin tells Mom he wants the last piece.  He doesn't want her to divide it.  He wants it all.  Mom tells him not to be selfish.  Calvin asks if the real message is to be dishonest.  Mom gives him the piece of pie.
    characters: [calvin, mom]
  "19951116":
    transcript: Ugghh... manicotti! Gross! Shlooop. AIEE! MY INTESTINES JUST BURST THROUGH MY STOMACH WALL! AAAA!! I should get some more and see if I can get out of math class.
    description: Calvin is grossed out by the school lunch of manicotti.  He dumps it down the front of his shirt.  Susie comes over to sit by him, and Calvin lifts his shirt.  He makes a face and says his intestines just burst through his stomach wall.  Susie is horrified.  Calvin smiles and says he should get more to see if he can get out of math class.
    characters: [calvin, susie]
  "19951117":
    transcript: This is a photograph of me when I was two. It's strange. I KNOW that's me, but I don't feel any connection to this image. Everything is so different now. Isn't it weird that one's own past can seem unreal? This is like looking at a picture of somebody else. Say, a slobbering nudist with legs like link sausages. You know, now I can't STAND to wad a soggy blanket in my mouth.
    description: Calvin shows Hobbes a photo of when he was two.  Calvin knows it's him, but he doesn't feel a connection to the image.  He says it's like looking at a picture of someone else.  Hobbes thinks it looks like a slobbering nudist with legs like sausages.  Calvin says now he can't stand to wad a soggy blanket in his mouth.
    characters: [calvin, hobbes]
  "19951118":
    transcript: Here's a picture of me when I was three. Look at that smile! Ahh, the arrogance of youth! I thought I knew everything when I was three. And you expwethed aww that knowwedge wike thith. Now, a lifetime of experience has left me bitter and cynical.
    description: Calvin shows Hobbes a photo of when he was three.  He says he thought he knew everything then.  Calvin says a lifetime of experience has left him bitter and cynical.
    characters: [calvin, hobbes]
  "19951119":
    transcript: ""
    description: Calvin runs out of the house, late for the school bus.  He makes it, but realizes he left his lunch.  Mom sees the lunch and runs to give it to Calvin.  They miss each other.  Mom is at the bus stop, and Calvin is inside looking for lunch.  Mom and Calvin finally hook up, only to see the school bus taking off.  They yell at each other.  Mom angrily takes Calvin to school.  Mom goes into the house.  Calvin realizes something.  Mom sees the books Calvin left in the house when he had gone in looking for his lunch.
    characters: [calvin, mom, susie]
  "19951120":
    transcript: I'm gonna pound you at recess, Twinky. Why?? It's no contest! You've got the entire advantage! What could you possibly get out of pounding someone completely defenseless! It's fun. Oh, he's a sportsman.
    description: Moe threatens to pound Calvin at recess.  Calvin asks why.  He says it's no contest.  He asks what Moe gets from pounding someone completely defenseless.  Moe says it's fun.  Calvin says Moe is a sportsman.
    characters: [calvin, moe]
  "19951121":
    transcript: Hello? Hi Mom, it's Calvin. Is something wrong? You're supposed to be in school! It's recess. I'm fine. Then why are you calling me? Actually, I'm calling Hobbes. Would you put him on? I gotta get my own secretary.
    description: Calvin calls Mom at home.  She asks if something is wrong.  Calvin is fine and is at recess.  Mom asks why he's calling her.  He says he's actually calling Hobbes and asks Mom to put him on the phone.  Calvin trudges away, saying he has to get his own secretary.
    characters: [calvin, mom]
  "19951122":
    transcript: Ooh, it's cold today! It needs to be 30 degrees warmer out here! For that matter, it's also too quiet. We need some background music. And it's too slow! Things should happen more quickly! If only being outside were more like driving a car. Yeah, I could be sitting down now too.
    description: Hobbes and Calvin brace themselves against the cold.  Calvin says it needs to be warmer.  He adds it's too quiet and needs background music.  He says it's too slow.  Things should happen more quickly.  Hobbes rolls his eyes and says if only being outside were more like driving a car.  Calvin agrees, saying they could be sitting down now.
    characters: [calvin, hobbes]
  "19951123":
    transcript: Calvin, will you gather the trash, please? Why should I? What do I get in return?! We will feed, clothe, shelter, and educate you throughout your entire youth. I really hate having things put in perspective.
    description: Mom asks Calvin to gather the trash.  Calvin asks what he gets in return.  Mom explains they'll feed, clothe, shelter, and educate him throughout his entire youth.  Calvin carries the trash saying he hates having things put into perspective.
    characters: [calvin, mom]
  "19951124":
    transcript: How could anyone wear out shoes so fast? I lead a rugged life.
    description: Calvin stops at a corner in the house.  He takes off a shoe and flips it past the corner.  Hobbes pounces on it.  At the shoe store, Mom asks how anyone could wear out shoes so fast.  Calvin tells her he leads a rugged life.
    characters: [calvin, hobbes, mom]
  "19951125":
    transcript: I wish it would snow! I know when I'm being mocked.
    description: Calvin looks to the sky and wishes it would snow.  A single snowflake comes down and lands on his forehead.  Calvin knows when he's being mocked.
    characters: [calvin]
  "19951126":
    transcript: Doesn't it seem like everybody just shouts at each other nowadays? I think it's because conflict is drama, drama is entertaining, and entertainment is marketable. Finding consensus and common ground is dull! Nobody wants to watch a civilized discussion that acknowledges ambiguity and complexity. We want to see fireworks! We want the sense of solidarity and identity that comes from having our interestes narrowed and exploited by like-minded zealots! Talk show hosts, political candidates, news programs, special interest groups... They all become successful by reducing debates to the level of shouted rage. Nothing gets solved, but we're all entertained. Hmmm, you may be right. What a boring day this turned out to be!
    description: Calvin asks Hobbes if it seems like everybody shouts at each other.  He thinks it's because conflict is drama.  Drama is entertaining.  Finding consensus is dull.  People want fireworks.  They want the sense of solidarity that comes from having interests narrowed by like-minded zealots.  Talk show hosts, news programs, political candidates all become successful by reducing debates to the level of shouted rage.  Nothing gets solved, but everyone is entertained.  Hobbes says he may be right.  Calvin says this is turning out to be a boring day.
    characters: [calvin, hobbes]
    source: miraheze
  "19951127":
    transcript: People keep talking about opening more wilderness for development. We seem to understand the value of oil, timber, minerals and housing, but not the value of unspoiled beauty, wildlife, solitude, and spiritual renewal. We need to start putting prices on the priceless. Yeah, if your woods are worth a zillion jillion bagillion, think what Alaska is worth.
    description: Calvin says people talk about opening more wilderness for development.  It seems people understand the value of oil, timber, and minerals, but not the value of unspoiled beauty, wildlife, and solitude.  Hobbes suggests they put prices on the priceless.
    characters: [calvin, hobbes]
  "19951128":
    transcript: It's freezing in here!! Why can't we crank up the thermostat?! Consuming less fuel is better for the economy and it saves money. Oh. ...and being cold builds character. I KNEW IT!!
    description: Calvin yells for the thermostat to be raised.  Dad says consuming less fuel is better for the environment and saves money.  Calvin didn't know that.  Dad adds that being cold builds character.  Calvin knew it.
    characters: [calvin, dad]
  "19951129":
    transcript: These are interesting times. We don't trust the government, we don't trust the legal system, we don't trust the media, and we don't trust each other! We've undermined all authority, and with it, the basis for replacing it! "Interesting" is a mild way of putting it. It's like a six-year-old's dream come true!
    description: Calvin reads the newspaper and these are interesting times.  He says we don't trust government, the legal system, the media, or each other.  They've undermined all authority, and with it, the basis for replacing it.  Hobbes says "interesting" is a mild way of putting it.  Calvin calls it a six-year-old's dream come true.
    characters: [calvin, hobbes]
  "19951130":
    transcript: You're lisening to "Boomer 102" classic rock - where we promise not to expose you to anything you haven't heard a million times before! We'll get right back to more hits from those high school days when your world stopped... but first, here's our critic to review the latest movie based on a '60s or '70s TV show! What's THAT look supposed to mean?
    description: Calvin listens to the radio, which promises not to expose him to anything he hasn't heard a million time before.  It says they'll get back to hits from those high school days when their world stopped.  But first, their critic will review the latest movie based on a 60's or 70's TV show.  Calvin walks by Dad with a strange look on his face.  Dad asks what that look is supposed to mean.
    characters: [calvin, dad]
  "19951201":
    transcript: Ever notice how many conversations revolve around TV shows and movies? Our common references are events that never happened and people we'll never meet! We know more about celebrities and fictional characters than we know about our neighbors! That must be why new houses aren't built with big front porches any more. I can't believe Dad won't let me have a TV in my own room.
    description: Calvin asks if Hobbes has noticed conversations revolve around TV shows and movies.  Our common references are things that never happened and people they'll never meet.  They know more about fictional characters than they do their neighbors.  Hobbes thinks that's why new houses aren't built with big front porches anymore.
    characters: [calvin, hobbes]
  "19951202":
    transcript: I like the sound of sleet hitting the window panes at night. And I like when the sleet turns to heavy snow as it gets colder, so you know that tomorrow the world will be buried in ice and snow! It's one of the few pleasures reserved for those who don't drive.
    description: Looking out his bedroom window, Calvin says he loves the sound of sleet hitting the window panes at night.  When the sleet turns to heavy snow, he knows the world will be buried in ice and snow.  He says it's one of the few pleasures reserved for those who don't drive.
    characters: [calvin]
  "19951203":
    transcript: See any weirdness yet? How about this rock? It has a purple stripe. Hmm... I guess that's a little weird. We'll look for something weirder. What do you think of this stick? It's a strange stick, but it's not a weird stick. It's too bad there aren't any good bugs out now. Yes, bugs are usually weird. Hey, here's a bird feather. It's pretty, but it's not weird. A bald bird would be weird. I don't see one. Look! A ripped-up old kite! Some kid must have lost this last summer! Phooey. The string broke here. I was hoping we'd find the kid's skeleton up a tree at the other end. That would be weird. Well, let's go in. I'm cold. Me too. I guess some days weirdness is hard to find. My glasses are fogged and I can't blow my nose, but my heart rate is the envy of men half my age! Weirdness always starts at home. Even when you look for it, you're never prepared for it.
    description: Calvin and Hobbes are looking for weirdness.  Hobbes finds a rock with a purple stripe.  Calvin finds a stick.  It's strange, but not weird.  There are no bugs out, so nothing there.  Calvin finds a bird feather.  Hobbes says it's pretty, but not weird.  Calvin sees a ripped-up old kite stuck in a tree.  Calvin was hoping to find the kid's skeleton at the end of the string.  Hobbes thinks that would be weird.  They decide to go inside.  Hobbes says some days, weirdness is hard to find.  Just then, Dad rides by on his bicycle.  He's all bundled for the cold.  Dad says his glasses are fogged, and he can't blow his nose, but his heart rate is the envy of men half his age.  Calvin says weirdness always starts at home.  Hobbes says even when you look for it, you're not prepared for it.
    characters: [calvin, hobbes, dad]
  "19951204":
    transcript: I KNEW I should've thrown than snowball sooner!
    description: At his desk, Calvin looks around.  He opens his desk.  He is shocked.  He says he knew he should have thrown that snowball sooner.
    characters: [calvin]
  "19951205":
    transcript: Dear Santa, Hi, It's me, Calvin. I have been extremely good* this year. Obviously, you're hoping Santa won't read the long, fine print disclosure in the footnote. I got the idea from car ads.
    description: Calvin writes a letter to Santa.  He writes he's been extremely good this year and makes a footnote indication near the word "good".  Hobbes reads it and says obviously Calvin's hoping Santa won't read the long, fine print disclosure in the footnote.  Calvin says he got the idea from car ads.
    characters: [calvin, hobbes]
  "19951206":
    transcript: Dear Santa, This year, please bear in mind that I should be presumed innocent until proven guilty. Also, I would encourage you to interpret "reasonable doubt" as broadly as possible. That's probably a bad way to start.
    description: Calvin writes to Santa that he should be presumed innocent until proven guilty.  He encourages Santa to interpret "reasonable doubt" as broadly as possible.  Calvin wads the note up and says that's probably a bad way to start.
    characters: [calvin]
  "19951207":
    transcript: Do you think there's an evil Santa? An EVIL Santa?? Yeah, like Santa's deranged twin brother, or something! He'd make toys for all the BAD girls and boys! Evil Santa would give all the dangerous, annoying, and corrupting toys your parents won't allow! And if you're good? He punishes you with shirts and underwear.
    description: Calvin asks Hobbes if there's an evil Santa.  He'd make toys for the bad girls and boys.  Evil Santa would give the dangerous, annoying toys parents don't allow.  Hobbes asks what would happen if you were good.  Calvin says he would punish you with shirts and underwear.
    characters: [calvin, hobbes]
  "19951208":
    transcript: Dear Santa, Before I submit my life to your moral scrutiny, I demand to know who made YOU the master of my fate?! Who are YOU to question my behavior, huh??? What gives you the right?! Santa makes the toys, so he gets to decide who to give them to. Oh. Time to prepare my appelate case.
    description: Calvin writes to Santa demanding to know who made Santa the master of Calvin's fate.  He asks who Santa is to question his behavior.  Hobbes tells him Santa makes the toys, so he decides who to give them to.  Calvin pauses.  He decides it's time to prepare his appellate case.
    characters: [calvin, hobbes]
  "19951209":
    transcript: I see you, Calvin, and you'd better not throw that snowball! I'm mailing a letter to Santa right now! Is the envelope already sealed? Yes, but I could write a P.S. on the back. Do you have a pen? As a matter of fact, I do. I'll bet she's bluffing but this isn't the time of year to tempt fate.
    description: Susie sees Calvin and tells him not to throw a snowball.  She's mailing a letter to Santa.  Calvin asks if the letter is sealed.  It is, but Susie says she could add a P.S. on the back.  Calvin asks if she has a pen.  She says she does.  Calvin is sure she's bluffing, but he isn't going to tempt fate at that time of year.  He drops the snowball.
    characters: [calvin, susie]
  "19951210":
    transcript: Did you throw that snowball at me? What snowball? Ohhhhh, don't play innocent with me, buster! That snowball had your name written all over it! Oh yeah?? Yeah! It was sneaky, fiendish, vicious, treacherous, grim, and ruthless! Put all that together and it spells 'tiger'! No it doesn't! It spells "Calvin's new name is Mr. Stupid Soggyshorts!" Ooh, that does it! Calvin/ Oh! Hey! Stop that! Quit it! No fair! No biting! Hey Calvin, you should've seen your expression when I hit you with that snowball! Ha ha! Ah, heh heh
    description: Calvin is hit by a snowball.  He asks Hobbes if he threw the snowball.  Hobbes doesn't know what he's talking about.  Calvin accuses him of being sneaky, grim, and ruthless.  He says that spells "tiger".  Hobbes says it spells "Calvin's new name is Mr. Stupid Soggyshorts".  They start fighting.  Susie comes over and tells Calvin he should have seen his expression when she hit him with the snowball.  She laughs and walks away.  Calvin thinks.  He looks at Hobbes, who then pelts Calvin with snowballs for having accused him.
    characters: [calvin, hobbes, susie]
    source: miraheze
  "19951211":
    transcript: There's a tree! Hit the brakes! Trees ARE my brakes.
    description: Going down the hill on the sled, Hobbes yells there is a tree.  He tells Calvin to hit the brakes.  The sled hits the tree.  Buried in the snow, Calvin says trees are his brakes.
    characters: [calvin, hobbes]
  "19951212":
    transcript: I have 200 snowballs! I am utterly invincible! I can act with total impunity! I can do whatever I want! So just hang on while I decide what that is!
    description: Calvin has 200 snowballs.  He declares himself invincible.  He says he can do whatever he wants.  He stands there.  He says everyone should hang on until he decides what that is.
    characters: [calvin]
  "19951213":
    transcript: With 200 snowballs at my immediate disposal, I have no opposition! My will is law! I am omnipotent! How boring.
    description: Calvin declares with 200 snowballs at his disposal, he has no opposition.  His will is law.  He is omnipotent.  He stands there.  He says "how boring".
    characters: [calvin]
  "19951214":
    transcript: In the SHORT term, it would make me happy to go play outside. In the LONG term, it would make me happier to do well at school and become successful. But in the VERY long term, I know which will make better memories.
    description: In the house, Calvin says in the short term, it would make him happy to play outside.  In the long term, it would make him happier to do well in school and be successful.  As they ride down the hill on the sled, Calvin says in the very long term, he knows which will make better memories.
    characters: [calvin, hobbes]
  "19951215":
    transcript: First she says go out. Now she says come in.
    description: A snowman has bowled another snowman's head down a lane into snow pins.  Calvin tells Hobbes that first, Mom says go out.  Now she says come in.
    characters: [calvin, hobbes]
  "19951216":
    transcript: Ha! What a rotten snowman! That's the worst snowman I've ever seen! So go build a better one! Maybe I will! You're back? MY words speak louder than actions.
    description: Calvin calls Susie's snowman the worst one ever.  She tells him to go build a better one.  He says maybe he will and walks away.  He comes back and says his words speak louder than his actions.
    characters: [calvin, susie]
  "19951217":
    transcript: Let's try this path over here! I don't see a path. We'll make a path! Huh boy. Change is invigorating! If you don't accept new challenges, you become complacent and lazy! Your life atrophies! New experiences lead to new questions and new solutions! Change forces us to experiment and adapt! That's how we learn and grow! Whoops... Well, here's a fresh challenge. I'll admit it's opened up new horizons. The problem with new experiences is that they're so rarely the ones you choose. I feel smarter already.
    description: Going down the hill on the sled, Calvin wants to try a different path.  He tells Hobbes change is invigorating.  If you don't accept new challenges, you become lazy.  Change forces them to experiment and adapt.  That's how they learn and grow.  As they sail off the edge of the hill, Calvin says there's a fresh challenge.  Hobbes admits it's opened up new horizons.  Stuck in the snow, Hobbes says new experiences are rarely the ones they choose.
    characters: [calvin, hobbes]
    source: miraheze
  "19951218":
    transcript: The Christmas season is always a time for personal reflection. Too often, we don't examine our lives. This is a time to take stock and think about what's important. It's a time to rededicate oneself to frenzied acquisition... a time to spread the joy of material wealth... a time to glorify personal excess of every kind! Earthly rewards make consumerism a popular religion. ...a time to atone for one's frugality!
    description: Calvin says the Christmas season is time for personal reflection.  It's time to think about what's important.  He says it's time to rededicate oneself to acquisition, a time to spread the joy of material wealth, time to glorify excess of every kind.  Hobbes says earthly rewards make consumerism a popular religion.
    characters: [calvin, hobbes]
  "19951219":
    transcript: Oh boy, look at all the snow! It must be six inches deep! This will be perfect for sledding or... DING DONG DING DONG DING DONG All right! I'm coming! I'm coming! What the heck is wrong with this planet you sold us?!
    description: Calvin looks out the window to see snow.  He thinks it will be perfect sledding weather.  The doorbell rings.  It's the aliens Calvin sold the planet to for fifty alien tree leaves.  They asks what's wrong with the planet he sold.
    characters: [calvin, galaxoidnebular]
  "19951220":
    transcript: Galaxoid and nebular! This cold white glop covers us and freezes our innards! It's snow. You'd better get used to it, 'cause we get it every winter. You did not tell us that this planet's axis would tilt away from the sun. You didn't ask. We paid 50 leaves for this planet! You greatly overcharged us! Yeah well, "let the buyer beware." You are a most dishonorable potentate! We demand you bring this planet up to code!
    description: The aliens complain the cold white glop covers them and freezes their innards.  Calvin says it's snow.  They get it every winter.  The aliens complain Calvin didn't tell them about that.  He replies that they didn't ask.  They say they were overcharged.  Calvin tells them "let the buyer beware".  The aliens walk off complaining that he's a dishonorable potentate.  They demand he bring the planet up to code.
    characters: [calvin, galaxoidnebular]
  "19951221":
    transcript: Who's at the door, Calvin? AAHH! Um.. uh.. girl scouts! Do we want any cookies? Girl scouts? Cookies? It seems early, but sure, let me get my purse. Oh no! Scram, you guys! Not until you fix the climate! I'll see what I can do. Do not trifle with us, Earth leader! Where are the girl scouts? They suddenly had to go earn a merit badge. Quick, where's Hobbes?
    description: Mom asks who's at the door.  Calvin tells her it's the Girl Scouts.  He whisks the aliens outside.  He tells them he'll see what he can do about fixing the climate.  Mom asks where the Girl Scouts went.  Calvin says they had to earn a merit badge.
    characters: [calvin, mom, galaxoidnebular]
  "19951222":
    transcript: The aliens didn't know about winter? They claim I sold them a planet with a faulty axis. What should I do? Offer a refund. Give back their leaf collection. Arrggh! I threw it away when it got such a bad grade! Hmm... well, we should at least help them stay warm then. But what could they wear? They don't even have arms! ... they need huge socks or something. HEY! NO! Bad idea! Bad idea!
    description: Calvin tells Hobbes the aliens claim he sold a defective planet.  Hobbes suggests offering a refund.  Calvin threw away the leaf collection when it got a bad grade.  Hobbes thinks they should help them stay warm.  Calvin says they don't have arms.  They'd need huge socks.  Hobbes starts to take down their Christmas stockings from the fireplace.  Calvin thinks that's a bad idea.
    characters: [calvin, hobbes]
  "19951223":
    transcript: Ooh, this is toasty! Thank you, Earth leader! That's my Christmas stocking! They're going away with our stockings! Santa can't fill 'em with loot! I'm sure Santa knows we did a nice thing and he'll work it all out. Hey yeah, I did something GOOD! We're talking jackpot! We're talking multiple trips from the pole to haul it all! Your selflessness is the hope of the season.
    description: Hobbes puts the Christmas stockings on the aliens.  They thank the earth leader and leave.  Calvin complains Santa can't fill them with loot.  Hobbes is sure that Santa knows they did a good thing, and things will work out.  Calvin realizes he did do something good.  He's thinking jackpot now.  Hobbes says Calvin's selflessness is the hope of the season.
    characters: [calvin, hobbes, galaxoidnebular]
  "19951224":
    transcript: Ok boys, have we loaded everything? Ah, there's still the matter of this Calvin, sir. His list is 30 pages long, not including the supplement about incendiary weapons. The research dept. thought you should handle this one personally. Well, is he naughty or nice? Ah, a bit problematic, chief... here's his dossier. Ohhh yes, the "noodle incident" kid... That was a while ago, boss. He says he was framed, and we've had trouble verifying the particulars. Accounts seem to vary. What about all these slushballs thrown at the girl down the street? My my my! No dispute there. Surveillance documents some 400 incidents, but the kid claims extenuating circumstances. Hmm.. don't they all. A tiger vouches for the kid's character... says the kid tries to be sort of good if he's not tempted otherwise. What do his parents say? Here's the dad's comments. We're looking into the sarcasm factor. All right, I've made up my mind. Is the boy asleep yet? Ah, no, he's wide awake. Santa won't come until we're asleep, you know. I can't take the suspense!
    description: One of Santa's elves wants him to look at Calvin's list.  It includes a supplement on incendiary weapons.  Santa asks if Calvin's naughty or nice.  The elf hands Santa the dossier.  Santa notices "the noodle incident".  The elf says they have had trouble verifying the particulars of that case.  Santa notices all the slushballs Calvin has thrown at the girl down the street.  The elf says that surveillance documents 400 incidents, but the kid claims extenuating circumstances.  The elf says the tiger vouches for the kid's character.  Santa asks what the parents say.  The elf indicates they're looking into the sarcasm factor in the dad's comments.  Santa says he's made up his mind and asks if Calvin's asleep.  The elf says he is wide awake.  In bed, Hobbes tells Calvin Santa won't come until they're asleep.  Calvin can't take the suspense.
    characters: [calvin, hobbes]
  "19951225":
    transcript: You say my present from you is outside? It's over here. A pile of ready-made snowballs! I wanted to give you something practical. You're the best, Hobbes, ol' buddy! Thanks! Merry Christmas. I suppose it would be wrong to throw these at YOU... I made my own pile, just in case.
    description: Hobbes' present for Calvin is outside.  Hobbes gave him a pile of ready-made snowballs.  Calvin hugs Hobbes and says he's the best.  He supposes it would be wrong to throw the snowballs at Hobbes.  Hobbes tells him he made his own pile, just in case.
    characters: [calvin, hobbes]
  "19951226":
    transcript: What's this? A generic snowman. I used to make original snowmen, but it was time-consuming, hard work, so I said, heck, this is crazy! Now I crank out crude imitations of what's already popular! It takes no time or thought, and most people don't care about the difference anyway! So cynical, yet so practical. And what good is originality if you can't crack it out?
    description: Calvin makes a generic snowman.  He says he used to make original snowmen, but it was hard work.  Now he cranks out imitations of what's already popular.  It takes no time, and people don't care about the difference.  Hobbes says it's so cynical, yet so practical.  Calvin asks what's good about originality if you can't crank it out.
    characters: [calvin, hobbes]
  "19951227":
    transcript: The new issue of chewing tells how to stay in top chewing condition over winter! What's so hard about that? You can chew gum all year. We serious chewers need a lot more than strong jaw muscles, you know! To chew hour after hour, we need a total cross-training fitness regime! So the idea is to increase the amount of this hobby you can endure. Right. When you're good at it, it's really miserable.
    description: Calvin shows Hobbes the latest issue of "Chewing" magazine.  It tells how to stay in condition over the winter.  Hobbes asks what's so hard about that.  You can chew gum all year.  Calvin informs him that serious chewers need more than strong jaw muscles.  They need a total cross-training fitness regime.  Hobbes clarifies the idea is to increase the amount of the hobby you can endure.  Calvin agrees.  He says when you're good at it, it's really miserable.
    characters: [calvin, hobbes]
  "19951228":
    transcript: Sometimes at night I worry about things and then I can't fall asleep. In the dark, it's easier to imagine awful possibilities that you'd never be prepared for. And it's hard to feel couragious in loose-fitting, drowsy bear jammies. That's why tigers sleep in the buff!
    description: In bed, Calvin clutches his blanket.  He says sometimes at night, he worries about things and can't fall asleep.  In the dark, it's easier to imagine awful possibilities you'd never be prepared for.  He says it's hard to feel courageous in loose-fitting, drowsy bear jammies.  Hobbes says that's why tigers sleep in the buff.
    characters: [calvin, hobbes]
  "19951229":
    transcript: See my snowman? He's enjoying the snow cone! There's nothing he likes better! And the snowman with the ice cream scoop in his back? It's a sordid story.
    description: Calvin shows Hobbes a snowman, enjoying a snow cone.  Hobbes asks about the other snowman, lying on the ground, with an ice cream scoop stuck in his back with several scoops taken out.  Calvin says it's a sordid story.
    characters: [calvin, hobbes]
  "19951230":
    transcript: Are you making any resolutions for the new year? Yeah, I'm resolving to just wing it and see what happens. So you're staying the course? I stick to my strengths.
    description: Hobbes asks Calvin if he's going to make any New Year's resolutions.  Calvin says he's resolving to wing it and see what happens.  Hobbes says Calvin's staying the course.  Calvin says he sticks to his strengths.
    characters: [calvin, hobbes]
  "19951231":
    transcript: Wow, it really snowed last night! Isn't it wonderful? Everything familiar has disappeared! The world looks brand new! A new year... a fresh, clean start! It's like having a big white sheet of paper to draw on! A day full of possibilities! It's a magical world, Hobbes, ol'd buddy... ...let's go exploring!
    description: Wading through the snow, Calvin says it really snowed last night.  He asks Hobbes if it isn't beautiful.  Hobbes says everything familiar has disappeared.  The world looks brand-new.  Calvin says it's a new year, a fresh, clean start.  Hobbes thinks it's like having a big white sheet of paper to draw on.  Calvin says it's a day full of possibilities.  They hop on the toboggan.  Calvin tells Hobbes it's a magical world.  Down they go.  Calvin says "let's go exploring".
    characters: [calvin, hobbes]
specials:
  "198511281":
    title: November 28, 1985 Alternate Strip
    date: "19851128"
    format: ink
    transcript: Ol' Hobbes is getting a little dirty, don't you think? In fact, you both could use a bath. C'mon Calvin. Oh Boy! You're taking your back upstairs, Calvin. Lucky rat. Yeah? Try the "Cold Rinse" cycle.
    description: Mom thinks Hobbes is getting dirty. Mom suggests that Calvin and Hobbes both take a bath. Calvin excitedly starts undressing before Mom clarifies that his bath is upstairs. Calvin is jealous of Hobbes, who is in the washing machine but thinks Calvin would not enjoy it.
    characters: [calvin, hobbes, mom, stuffedhobbes]
