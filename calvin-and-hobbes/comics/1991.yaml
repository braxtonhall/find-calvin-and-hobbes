  "19940218":
    transcript: I wish this sled had a speedometer so we could know how fast we're going. I suppose we could measure the hill, time our descent, calculate our rate in feet per minute, and convert that into miles per hour. That sounds like math. Um, yes. Suddenly I stopped caring.
