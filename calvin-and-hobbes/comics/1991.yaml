  "19920721":
    transcript: Mom, Hobbes takes my comic books and reads them before I do! Make him stop! Um... He spoils all the good parts too! He yells out what's happening while he's reading. He goes, "Oh no, Captain Steroid is getting his kidneys punched with an I-Beam! Oh gross, now he's bleeding all over the..." Let me see this comic book. NOW DON'T YOU READ IT FIRST!!
