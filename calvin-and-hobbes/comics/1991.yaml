  "19950831":
    transcript: There aren't many heroes these days. Who is out there to inspire us with a personal example of virtue and self-sacrifice in the name of a higher good? Who can we look up to? Business leaders? Sports figures? Politicians? Celebrities? Heck, we're lucky if they don't end up in prison! Fortunately, if we can't get inspiration, we'll accept entertainment. As usual, the hero business is up to me.
