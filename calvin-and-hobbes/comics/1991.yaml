  "19920808":
    transcript: You know what I've discovered? What? A little rudeness and disrespect can elevate a meaningless interaction into a battle of wills and add drama to an otherwise dull day. Oh, that's good to know. If you weren't such a muttonhead, you might have thought of it yourself! See?? You proved my point!
    description: Calvin has discovered a little rudeness and disrespect can elevate a meaningless interaction into a battle of wills.  Hobbes rolls his eyes and says that's good to know.  Calvin says if he wasn't such a muttonhead, he might have thought of it himself.  Calvin, stuck into the ground, says Hobbes just proved his point.
