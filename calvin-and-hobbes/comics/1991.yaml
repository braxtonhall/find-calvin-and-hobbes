  "19940304":
    transcript: It offends the human ego that nature is indifferent to us. Nature doesn't care if people live or die. It refuses to be tamed. It does whatever it wants and acts like people don't matter. It won't confirm our right to be here. That drives people crazy. We can't stand being ignored. It's insulting and ... hey! YAWWNN. I think that's also why some people don't like cats.
    description: Calvin tells Hobbes it offends human ego that nature is indifferent to them.  Nature doesn't care if people live or die.  It acts like people don't care.  He tells Hobbes that drives people crazy.  They can't stand being ignored.  Hobbes yawns and walks away.  Calvin says that's also why some people don't like cats.
    characters: [calvin, hobbes]
  "19940305":
    transcript: I'm writing a novel. What's it about? It's about a guy who flicks through TV channels with his remote control. THEY SAY TO WRITE WHAT YOU KNOW!
    description: Calvin tells Hobbes he's writing a novel.  It's about a guy who flicks through TV channels with his remote control.  Hobbes walks off, and Calvin yells after him that they say to write what you know.
    characters: [calvin, hobbes]
  "19940306":
    transcript: 'Blecchhh "TO BE?? ...or... NOT to be? *sighhh* That is the question. Whether ''tis nobler in the mind to SUFFER the SLINGS and ARROWS of outrageous fortune... ...or to take ARMS against a sea of troubles... and by opposing, END them? THWUPP To die: to sleep; ...no more! And by a sleep to say we END the HEARTACHE and the THOUSAND natural shocks that flesh is heir to... *sniff* ''tis a consummation devoutly to be wished! To die, to SLEEP! To sleep, perchance to DREAM: Ay, THERE''S the rub! ...for in that sleep of death, what dreams may come when we have shuffled off this mortal coil must give us pause." Blink blink. FEEHEELINGGS wo wo wo. You finished that right up! Did you like it? Let''s not have this ever again.'
    description: Calvin looks at his green dinner.  It stands up, speaking Hamlet's soliloquy.  When he finishes, the dinner sits on the plate.  Calvin blinks.  The dinner stands up singing "Feelings".  Mom takes the plate away, saying Calvin ate that right up.  She asks if he liked it.  Calvin tells her not to have it ever again.
    characters: [calvin, mom]
    source: s-anand+seligman+miraheze
  "19940307":
    transcript: Take out your math homework and pass it forward, class. Boy, it's a good thing I did it. Huh?? My answers! They're running away! Come back! FWOOM My homework paper!
    description: The teacher asks for the class math papers.  Calvin pulls his out, glad he did it.  The numbers jump off the page.  He yells for the answers to come back.  The paper bursts into flames.
