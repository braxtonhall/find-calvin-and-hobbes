    characters: [calvin]
  "19921121":
    transcript: I'm growing my fingernails long. Then I'll file them into points, so I'll have claws just like you. Mine are retractable. No retractable claws, no opposable toes, no prehensile tail, no compound eyes, no fangs, no wings... SIGHHH...
    description: Calvin tells Hobbes he's growing his fingernails.  He'll file them, so he'll have claws like Hobbes.  Hobbes says his are retractable.  Calvin trudges off complaining about no retractable claws, no opposable toes, no prehensile tail, no fangs.  He sighs.
    characters: [calvin, hobbes]
  "19921122":
    transcript: Ever notice how time slows down during a catastrophe? Sighhh...and good times are always over so fast.
    description: Calvin's home and opens his door.  He sees Hobbes coming at him.  He turns to run.  Hobbes pounces on him.  He flies into the air.  He falls to the ground.  He asks Hobbes if he's noticed how time slows down during a catastrophe.  Hobbes sighs that good times are always over so fast.
    characters: [calvin, hobbes]
    source: miraheze
  "19921123":
    transcript: Can I learn to parachute out of an airplane? Why don't you just play "chicken" on the railroad tracks? It would be a cheaper way to toy with death, I'm sure. Mom's so practical.
    description: Calvin asks Mom if he can parachute out of a plane.  Mom wonders why he doesn't play "chicken" on the railroad tracks.  It would be a cheaper way to toy with death.  Calvin says Mom's so practical.
    characters: [calvin, mom]
  "19921124":
    transcript: This connect-the-dots book really makes me mad! Look at this. It's a duck. I know! Who wants to draw a duck?! I sure didn't! They MADE me! I've been maninpualted! My natural artistic talent has been used against my will to create some coprorate entity's crude idea of waterfowl! It's outrageous! Another blow to creative integrity. From now on, I'll connect the dots my OWN way.
    description: Calvin is angry with his connect-the-dots book.  Calvin complains he didn't want to draw the duck, the book made him.  He feels manipulated.  His talent has been used against his will.  Hobbes laments another blow to creative integrity.  Calvin says from now on, he'll connect the dots his own way.
    characters: [calvin, hobbes]
  "19921125":
    transcript: Miss Wormwood, my Dad says when he was in school, they taught him to do math on a slide rule. He says he hasn't used a slide rule since, because he got a five-buck calculator that can do more functions than he could figure out if his life depended on it. Given the pace of technology, I propose we leave math to the machines and go play outside. My bills always die in the subcommittee.
    description: Calvin asks Miss Wormwood about a slide rule.  He says Dad told him he used one, but then got a five dollar calculator that can do more functions then he could figure out.  Calvin suggests that given the pace of technology, they should leave math to the machines and go play outside.  Later, at his desk, Calvin complains his bills always die in subcommittee.
    characters: [calvin]
  "19921126":
    transcript: How do bank machines work, Dad? Well, let's say you wwant 25 dollars. You punch in the amount... and behind the machine, there's a guy with a printing press who makes the money and sticks it out this slot. Sort of like the huy who lives up in our garage and opens the door? Exactly.
    description: Calvin asks Dad how bank machines work.  Dad says you punch in the amount you want, and there's a guy with a printing press who makes the money and sticks it out the slot.  Calvin asks if it's like the guy who lives in their garage and opens the door.  Dad tells Calvin it's exactly like that.
    characters: [calvin, dad]
  "19921127":
    transcript: Miss Wormwood? Yes, Calvin? You can present the material, but you can't make me care. Rumor has it she's up to two packs a day, unfiltered.
    description: Calvin tells Miss Wormwood she can present the material, but she can't make him care.  Later, on the swing, Calvin happily says rumor has Miss Wormwood up to two packs a day, unfiltered.
    characters: [calvin, wormwood]
  "19921128":
    transcript: I've noticed that comic book superheroes usually fight evil maniacs with grandiose plans to destroy the world. Why don't superheroes go after the more subtle, realistic bad guys? Yeah, the superhero coiuld attend council meetings and write letters to the editor, and stuff. Hmm... I think I see the problem. "Quick! To the bat fax!"
    description: Calvin notices comic superheroes fight maniacs with plans to destroy the world.  He wonders why they don't go after more realistic bad guys.  Hobbes says the superhero could attend council meetings and write letters to the editor.  Calvin sees the problem.
    characters: [calvin, hobbes]
  "19921129":
    transcript: Recess! A School day break for play and exercise. Little does Susie realize how much exercise she is about to get! She turns at the sound of running feet behind her. Have her friends come to join her? No! It's a pack of ferocious deinonychus dinosaurs!! Screaming, Susie hurls herself toward the school doors, but the pack is closing in! With the grim efficiency of wild dogs, the predators have a meal. Across the playground, students huddle in stupefied horror! Which one of them will be next? Thus the weak and stupid are weeded out in a heartless, but essential, natural selection, keeping the human population in check. At least, that's how it ought to be. Thank you for that tastelss and entirely uninformative report on overpopulation. See me after class. You like that, Susie??
    description: Susie is playing and turns at a sound.  It's a pack of deinonychus dinosaurs.  Susie runs toward the school doors, but the pack closes in.  The predators have a meal.  Other students look on in horror, wondering who's next.  The weak and stupid are weeded out in a natural selection.  That's how it ought to be.  Miss Wormwood thanks Calvin for a tasteless and uninformative report on overpopulation.
    characters: [calvin, susie, wormwood]
    source: miraheze
  "19921130":
    transcript: Susie, can I copy your answers? Heck no! Why not? Because you'd get a good grade without doing any work. So? So it's wrong to get rewards you haven't earned. I've never heard of anyone who couldn't live with that.
    description: Calvin asks if he can copy Susie's answers.  She says no.  She tells him he'd get a good grade without doing any work.  Calvin wonders what's wrong with that.  Susie tells him it's wrong to get rewards you haven't earned.  Calvin's never heard of anyone who couldn't live with that.
    characters: [calvin, susie]
  "19921201":
    transcript: For "Show and Tell" today, I don't have anything to show. But I'll TELL you that, when I'm at school, my Mom puts on a patriotic leotard, a cape, and knee-high, high-heeled boots, and she fights crime as a super-heroine. I hope you're duly impressed. Thank you very much. That's the note his teacher sent home with him. Wow, show me that outfit sometime.
    description: Calvin has nothing for "show and tell".  Calvin tells the class that when he's in school, Mom puts on a leotard, cape, and high-heeled boots to fight crime as a super heroine.  Calvin bows and hopes the class in duly impressed.  Mom shows Dad the note the teacher sent home with him.  Dad wants her to show him that outfit sometime.
    characters: [calvin, mom, dad]
  "19921202":
    transcript: Do you hate being a girl? It's gotta be better than the alternative. What's it like? Is it like being a bug? Like a WHAT?! I imagine bugs and girls have a dim perception that nature played a cruel trick on them, but they lack the intelligence to really comprehend the magnitude of it. I must've put my finger on it.
    description: Calvin asks Susie if she hates being a girl.  Susie says it's better than the alternative.  Calvin asks if it's like being a bug.  Calvin thinks bugs and girls have a perception that nature played a trick on them, but they lack the intelligence to comprehend it.  Lying upside down against his locker, Calvin thinks he must have put his finger on it.
    characters: [calvin, susie]
  "19921203":
    transcript: I'm home! I'm free! The rest of the day is all mine! Finally, some time to myself! Liberty, precious liberty! Ha ha ha!
    description: Calvin rushes home from the school bus.  He's got time to himself.   He plans to enjoy his liberty.  He sits and watches television.
    characters: [calvin]
  "19921204":
    transcript: Dad, are you vicariously living through me in the hope that my accomplishments will validate your mediocre life and in some way compensate for all the opportunities you botched? If I were, you can bet I'd be re-evaluating my strategy. Mom, Dad keeps insulting me.
    description: Calvin asks if Dad is living through him in the hope Calvin's accomplishments validate his mediocre life and compensate for all his botched opportunities.  Dad says if he was, he'd re-evaluate his strategy.  Calvin tells Mom that Dad keeps insulting him.
    characters: [calvin, mom, dad]
  "19921205":
    transcript: I like rocks. Here's a nice one. See how smoothit is? It probably took eons to get like that. It's a sedimentary rock, formed by sediment deposits, as opposed to, say, an igneous rock, which is volcanic in origin. You sure know a lot about rocks. You bet. Ballistic missiles from God, I call 'em.
    description: Calvin picks up a rock and shows Hobbes.  He explains it took eons to get smooth like that.  He explains it's a sedimentary rock, as opposed to igneous.  He explains the difference to Hobbes.  Hobbes tells Calvin he knows a lot about rocks.  Calvin calls them ballistic missiles from God.
    characters: [calvin, hobbes]
  "19921206":
    transcript: ""
    description: Calvin wakes in the night and is pulled out his window into a flying saucer.  The aliens replace Calvin with a robot.  The robot steals cookies, breaks a lamp, and throws away schoolbooks, all in front of Mom.  Calvin tries to explain it to Mom, but she takes him to bed.  Calvin looks out his window at the stars.
    characters: [calvin, mom]
    review: "unsettled: the Sunday stamp reads 10-13, 54 days before publication rather than the usual 47-48; release date needs confirming"
  "19921207":
    transcript: Wake up, get up... Shut up, listen up... Throw up... Mix up, goof up... Hurry up... How's your day? Looking up.
    description: Calvin gets out of bed and says he wakes up.  At school, he says he shuts up and listens up.  At lunch, he says he throws up.  At the blackboard, he says he mixes up and goofs up.  Near the end of the day, he wishes it would hurry up.  As he runs into the house, Mom asks how his day was.  He says it's looking up.
    characters: [calvin, mom]
  "19921208":
    transcript: Dear Santa, This year, I don't want any gifts. I just want love and peace for my fellow man. Reverse psychology. Kind of risky, don't you think?
    description: Calvin writes to Santa saying he only wants love and peace for his fellow man.  He doesn't want any gifts.  He tells Hobbes it's reverse psychology.  Hobbes asks if Calvin doesn't think it's risky.  Calvin crumples the note and tosses it.
    characters: [calvin, hobbes]
  "19921209":
    transcript: Dear Santa, Why is your operation in the North Pole? I'm guessing cheap elf labor, lower environmental standards, and tax breaks. Is this really the example you want to set for us impressionable kids? My plan is to put him on the defensive before he considers how good I've been.
    description: Calvin writes to Santa, asking why his operation is at the North Pole.  He wonders if it's cheap elf labor, lower environmental standards, and tax breaks.  He wonders if that's the example Santa wants to set.  Calvin tells Hobbes he's trying to put Santa on the defensive before he considers how good Calvin has been.
    characters: [calvin, hobbes]
  "19921210":
    transcript: Dear Santa, Last year I asked for a long-range thermo-nuclear "Smart" missile and a launcher. Instead, I got socks and a shirt. Obviously, you mixed up my order with someone else's. Let's get with the program, huh? Just because he gives the stuff away free, he thinks he can get away with an incompetent organization.
    description: Calvin writes that he wanted a missile and launcher last year, but he got socks and a shirt.  He says Santa mixed up his order with someone else's.  He asks Santa to get with the program.  Calvin says that just because he gives stuff away free, Santa shouldn't get away with an incompetent organization.
    characters: [calvin]
  "19921211":
    transcript: Look at this great snowball! I'd sure like to paste someone upside the head with it. ... but I figure each snowball I throw means I'll get one less present from Santa. I wish I knew if Santa was bringing me any underwear.
    description: Calvin has a snowball.  He wants to paste someone with it.  He figures each snowball he throws will cost him one present from Santa.  He looks at the snowball and says he wishes he knew if Santa was bringing him any underwear.
    characters: [calvin]
  "19921212":
    transcript: Ski resorts use man-made snow. They have snow-making machines that can cover a whole hillsie. Hint hint. You can rely on the weather like every other kid.
    description: Calvin tells Dad ski resorts use man-made snow.  They have machines that can cover a hillside.  Dad sits there.  Calvin tells him "hint, hint".  Dad says Calvin can rely on the weather like every other kid.
    characters: [calvin, dad]
  "19921213":
    transcript: The fearless spaceman Spiff pilots his craft at speeds never before imagined! He discovers galaxies and planets never before charted! He courageously lands on alien worlds never before explored... ..Bravely confronting space species never before encountered! Yes, our hero, the incredible spaceman Spiff, is a cosmic pioneer. Boldly facing the unknown in a universe of wild adventure! Eww! I've never had this before! I won't eat it!
    description: Spaceman Spiff pilots his craft at high speeds.  Spiff discovers galaxies and planets not charted.  He lands on worlds not explored, confronting species never encountered.  He's a cosmic pioneer,  boldly facing the unknown.  Mom gives Calvin a plate of food.  He cringes, saying he's never had it before and won't eat it.
    characters: [calvin, mom, spiff]
    source: miraheze
  "19921214":
    transcript: Oh look, yet another Christmas TV special! How touching to have the meaning of Christmas brought to us by cola, fast food and beer conglomerates. Who'd have ever guessed product consumption, popular entertainment, and spirituality would mix so harmoniously. It's a beautiful world, all right. Dad doesn't handle the season's stress very gracefully.
    description: Dad sees Calvin watching another Christmas TV special.  Dad says it's touching to have the meaning of Christmas brought by food, cola, and beer conglomerates.  He walks away wondering who would have guessed product consumption, popular entertainment, and spirituality would mix so harmoniously.  Calvin says Dad doesn't handle the stress of the season very gracefully.
    characters: [calvin, dad]
  "19921215":
    transcript: Dad, I'd like to have a little talk. Um, OK... As the wage earner here, it's your responsibiliy to show some consumer confidence and start buying things that will get the economy going and create profits and employment. Here's a list of big-ticket items I'd like for Christmas. I hope I can trust you to do what's right for our country. I've got to stop leaving the Wall Street Journal around.
    description: Calvin would like to have a talk with Dad.  He tells Dad it's his responsibility to show consumer confidence and by things to get the economy going.  Calvin gives Dad a list of big-ticket items he'd like for Christmas.  Calvin hopes he can trust Dad to do what's right for the country.  Dad says he has to stop leaving the Wall Street Journal around.
    characters: [calvin, dad]
  "19921216":
    transcript: RRRRGGHHH. I say, if a novelty Christmas song is funny the first time, it's funny EVERY time.
    description: Mom is angry.  She kicks Calvin outside.  Calvin says that if a novelty Christmas song is funny the first time, it's funny every time.
    characters: [calvin, mom]
  "19921217":
    transcript: I'm having a lot of holiday stress. Why? You don't shop for anyone, you've got two weeks off from school, and your parents do all the cooking, cleaning and decorating! How could you have holiday stress? Deep down, I doubt my greed for presents can overcome my desire to misbehave.
    description: Calvin tells Hobbes he's having a lot of holiday stress.  Hobbes asks why.  He says Calvin doesn't shop for anyone, has two weeks off from school, and his parents do all the cooking and cleaning.  Calvin says he doubts his greed for presents can overcome his desire to misbehave.
    characters: [calvin, hobbes]
  "19921218":
    transcript: OK Hobbes, I've got a plan. Yeah? If I do ten spontaneous acts of good will a day from now until Christmas, Santa will have to be lenient in judging the rest of this last year! I can claim I've turned a new leaf! Ten spontaneous acts of good will a day? That's pretty many. Don't remind me. Well, here's your chance. Susie's coming this way. Maybe I'll start tomorrow and do 20 a day.
    description: Calvin has a plan.  He'll do ten spontaneous acts of good will a day between now and Christmas.  Santa will have to be lenient in judging the rest of this last year.  Hobbes thinks ten is a lot.  He says here comes Calvin's chance.  Susie is coming.  Calvin starts to make a snowball, saying maybe he'll start tomorrow and do twenty a day.
    characters: [calvin, hobbes]
  "19921219":
    transcript: Oh man, Susie's right in range! It's a clear shot! I can't miss! I thought you were going to do ten spontaneous acts of good will a day. It's not even noon. I'll do 'em after lunch. Look, doing ten good acts isn't going to impress Santa if you do BAD things all morning! Suppose I just graze her jaw and knock some fillings loose. That would be in the gray area, don't you think? Don't expect to play with all MY presents when you don't get any.
    description: Hiding behind a snowman, Calvin has a clear shot at Susie.  Hobbes says he thought Calvin was going to do ten acts of good will a day.  Calvin says he'll do them after lunch.  Hobbes tells him doing good deeds isn't going to impress Santa if he does bad things all morning.  Calvin wonders if grazing her jaw would be in a gray area.  Hobbes tells Calvin not to expect to play with his toys when Calvin doesn't get any.
    characters: [calvin, hobbes]
  "19921220":
    transcript: I wish Santa would publish the guidelines he uses for determining a kid's goodness. For example, how much does he weigh motives? Does he consider the kid's natural predisposition? I mean, if some sickeningly wholesome nerd likes being good, it's easy for him to meet the standards! There's no challenge! Heck, anyone can be good if he wants to be! The true test of one's mettle is being good when one has an innate inclination towards evil. I think one good act by me, even if it's just to get presents, should count as five good acts by some sweet-tempered kid motivated by the pureness of his heart, don't you? Of course, in your case, the question is academic. I wanted to put a rock in the snowball, but I didn't. That should be worth a lot!
    description: Calvin wishes Santa would publish his guidelines for goodness.  Calvin says if a nerd likes being good, it's easy for him to meet the standards.  He says the true test of one's mettle is being good when one has an inclination toward evil.  He thinks one good act by him is worth five good acts by a good-natured kid and asks if Hobbes agrees.  He hits Susie with a snowball.  As Calvin and Hobbes run off, Hobbes says in Calvin's case, the question is academic.
    characters: [calvin, hobbes, susie]
    source: miraheze
  "19921221":
    transcript: SMACK YES! I'M SORRY! Not as sorry as you're GOING to be! I think as long as you SUFFER for your sins, they don't count. It's your only hope.
    description: Calvin throws the snowball and hits Susie.  Calvin thinks of Santa and says he's sorry to Susie.  She chases him.  Lying buried in snow, Calvin says if you suffer for your sins, they don't count.  Hobbes thinks that's his only hope.
    characters: [calvin, hobbes, susie]
  "19921222":
    transcript: Here! It's a comic book! It's MY comic book. But you can read it. Just make sure your hands are clean and acid-free, and only touch the mylar bag, and use these sterilized tongs to turn the pages, and try not to exhale too much moisture, OK?! Don't mess it up! THERE! That's one spontaneous act of good will! I hope you're satisfied. Santa! Darn you!! I think spontaneous acts of good will should be less reluctant. RELUCTANT ONES QUALIFY!!
    description: Calvin hands Hobbes a comic book.  He says he can read it.  Calvin tells him to be sure his hands are clean, and that he use sterilized tongs to turn the pages.  Calvin proclaims one act of good will.  Hobbes thinks spontaneous acts of good will should be less reluctant.
    characters: [calvin, hobbes]
  "19921223":
    transcript: Mush hullp smack ullkk... Mom, I'm guessing this is boiled guano on raw maggots, but I'm (orrg) choling it down as best as my cramping stomach allows. This is another spontaneous act of good will, Santa! You'd better come through in SPADES for this!! More maggots? SURE! PILE 'EM ON!
    description: Calvin eats his food, saying he guesses this is boiled guano on raw maggots.  He declares another spontaneous act of good will.  He says Santa better come through in spades for this.  Mom asks if Calvin wants more maggots.  He says to pile them on.
    characters: [calvin, mom]
  "19921224":
    transcript: One more day of being good! This has been the longest week of my entire life. HEY! I'll bet Santa's loading up the sleigh right now! He's got millions of deliveries, right? He couldn't possible still be deciding how good I am! If his decision is made, I don't have to impress him any more! I'm free! The charade is over! I can do what I want! Maybe he's loading your stuff last, just to see what you do. You think? Well, maybe. Geez, he's a tough ol' geezer! Well, what's one more day? ...sigh...
    description: Calvin needs one more day of being good.  He bets Santa's loading up the sleigh for deliveries.  He couldn't be deciding how good Calvin is.  Calvin figures if the decision is made, he doesn't have to impress him anymore.  He's free to do what he wants.  Hobbes asks what happens if he loads Calvin's stuff last to see what he does.  Calvin figures one more day won't hurt.
    characters: [calvin, hobbes]
  "19921225":
    transcript: It's a certificate entitling the bearer to one day pounce-free of tiger attacks! Wow! Thanks, ol' buddy! You always think of the best gifts! I still think this could've waited until sunrise. Shh, take a picture.
    description: On Christmas morning, Calvin sees a certificate for one day pounce-free of tiger attacks.  He tells Hobbes he thinks of the best gifts.  Sitting on the sofa in their robes, looking tired, Dad says this could have waited until sunrise.  Mom tells him to take a picture.
    characters: [calvin, hobbes, mom, dad, stuffedhobbes]
  "19921226":
    transcript: The snow isn't deep enough for sledding. And it's not wet enough to pack, either. Sighhhh. Fortunately, I'm the stoic type. You're an inspiration to us all.
    description: Calvin notices the snow isn't deep enough for sledding, not wet enough to pack.  He sighs.  He says fortunately, he's the stoic type.  Hobbes says he's an inspiration to us all.
    characters: [calvin, hobbes]
  "19921227":
    transcript: Everybody makes the wrong kind of New Year's resolution. All they do is promise to stop bad habits and start good habits. What's wrong with that? It's not enough to change a few little habits! Everybody I know needs a complete personality overhaul! That's why I'll be spending the remaining days of this year telling people what I hate about them and how they should change. Some of us would be happy to reciprocate. Sorry. My New Year's resolution is not to change a bit.
    description: Riding down the hill on the sled, Calvin says everyone makes the wrong kind of New Year's resolution.  He says it's not enough to change a few bad habits.  Everyone he knows needs a personality overhaul.  He'll spend the remaining days of the year telling people what he hates about them and how they should change.  Hobbes says some of us would be happy to reciprocate.  Calvin says his resolution is not to change one bit.
    characters: [calvin, hobbes]
    source: miraheze
  "19921228":
    transcript: You know, it's amazing how many things can be taken apart with just one ordinary screwdriver! Such as? Well, just for starters, there's... that is, hypothetically, I mean... not that I'd know for a fact, of course... just in theory, I imagine that maybe... um, well, gosh, it's hard to say. I've GOT to stop introducing topics of conversation.
    description: Calvin tells Dad it's amazing how many things you can take apart with a screwdriver.  Dad asks what kind of things.  Calvin starts to talk, but says it's hypothetical.  He doesn't know for a fact.  It's hard to say.  He walks off wiping his brow.  He says he's got to stop introducing topics of conversation.
    characters: [calvin, dad]
  "19921229":
    transcript: You know what the problem is with the universe? Um... There's no toll-free customer service hot line for complaints! That's why things don't get fixed! If the universe had any decent management, we'd get a full refund if we weren't completely satisfied! But the place is free! See, that's another thing. They should have a cover charge and keep out the riffraff.
    description: Calvin says the problem with the universe is that there are no toll-free hot line numbers for complaints.  If the universe had decent management, they'd get a full refund if they weren't completely satisfied.  Hobbes says the place is free.  Calvin says they should have a cover charge and keep out the riffraff.
    characters: [calvin, hobbes]
  "19921230":
    transcript: Do you need nails pounded into anything? Name the surface, and I'll fill it full of nails! Um, no... You sure? I've got the tools right here! Lots of nail sizes! I'd be happy to do it! No thanks, not today. OK, well, let me know when you cange your mind. Mm-hmm. Mom wanted a girl. I just know it. Did she want anything sawed?
    description: Calvin asks if Mom has anything she needs nails pounded into.  Calvin says he has the tools and lots of nail sizes.  She tells him no.  He walks off asking her to let him know if she changes her mind.  Calvin tells Hobbes that Mom wanted a girl.  He just knows it.
    characters: [calvin, hobbes, mom]
  "19921231":
    transcript: People always seem so crabby and animals always seem so content. I wonder why that is. It's probably because animals know they're superior and people know they're inferior. I figured it was because animals get 15 hours of sleep every day. Actually, I think animals are just as crabby as people are.
    description: Calvin wonders why people always seem so crabby and animals seem so content.  Hobbes suggests it's because animals know they're superior.  Calvin thought it was because animals got 15 hours of sleep every day.  Hiding up in a tree, Calvin says he thinks animals are just as crabby as people are.
    characters: [calvin, hobbes]
  "19930101":
    transcript: Wow, look at the snow coming down! The roads are a mess! I hope Dad makes it home OK. Face it, Dad. The season's over. Are you kidding? In this stuff, I reach my optimal heart rate in no time!
    description: Calvin looks out the window at the snow outside.  He hopes Dad makes it home alright.  Dad comes home from his bicycle ride.  He's got a coat, scarf, and gloves on.  Calvin tells him the season's over.  Dad says with his outfit, he hits his optimal heart rate in no time.
    characters: [calvin, dad]
  "19930102":
    transcript: I've decided to stop caring about things. If you care, you just get disappointed all the time. If you DON'T care, nothing matters, so you're never upset. From now on, my rallying cry is, "SO WHAT?!" That's a tough cry to rally around. So what?!
    description: Calvin decides to stop caring about things.  He says if you care, you get disappointed.  If you don't care, nothing matters.  He tells Hobbes his rallying cry is "so what".  Hobbes says that's a tough cry to rally around.
    characters: [calvin, hobbes]
  "19930103":
    transcript: It's a new year...A new beginning! New Possibilities! THis snowman represents the spirit of the new year. Looking ahead, he strives forward with confidence and determination! He challenges! He imagines! He invents! He calls forth the best qualities of human drive and ingenuity! very inspiring. Thank you. And over here is the real world? Right. This is why we're always glad when the old year is over.
    description: Calvin shows Hobbes a snowman representing the spirit of the new year.  The snowman has stick arms making it look like the snowman is looking to the distance.  Calvin says it strides forward with confidence, calling forth the best qualities of human drive.  Hobbes says that's very inspiring.  They look over to other snowmen, built so they're laughing and pointing at the other snowman.  Hobbes asks if those snowmen are the real world.  Calvin tells him that's why they're glad when the old year is over.
    characters: [calvin, hobbes]
    source: miraheze
  "19930104":
    transcript: I'm not getting up until it's as warm out there as it is in here.
    description: As snow falls outside, Mom tries to wake Calvin up.  From beneath the covers, he tells Mom he's not getting up until it's as warm outside as it is inside.
    characters: [calvin, hobbes, mom]
  "19930105":
    transcript: I don't want to go to school. I don't want to know anything new. I already know more than I want to! I liked things better when I didn't understand them! The fact is, I'm being educated against my will! My rights are being trampled! Is it a right to remain ignorant? I don't know, but I refuse to find out!
    description: Waiting for the school bus, Calvin tells Hobbes he doesn't want to go to school.  He knows more than he wants to.  Things were better when he didn't understand them.  He's being educated against his will.  He says his rights are being trampled.  Hobbes asks if it's a right to remain ignorant.  Calvin doesn't know, but he refuses to find out.
    characters: [calvin, hobbes]
  "19930106":
    transcript: It would sure be a big surprise if the school bus spontaneously exploded and I didn't have to go to school! Yeah, I'd sure be surprised if THAT happened! Life is full of surprises, but never when you need one.
    description: Waiting for the school bus, Calvin says it would be a surprise if the bus exploded and he didn't have to go to school.  He says he'd really be surprised if that happens.  On the school bus, Calvin says life is full of surprises, but never when you need one.
    characters: [calvin]
  "19930107":
    transcript: I'M HO-OME! Hello?? Thanks for the big welcome! You're letting in cold air.
    description: Calvin opens the door and says he's home.  He ducks.  No Hobbes.  Calvin says hello, but nothing happens.  He lifts the covers on his bed, and Hobbes tells him he's letting in cold air.
    characters: [calvin, hobbes]
  "19930108":
    transcript: Problems often look overwhelming at first. The secret is to break problems into small, manageable chunks. If you deal with THOSE, you're done before you know it. For example, I'm supposed to read this entire history chapter. It looks impossible, so I break the problem down. You focus on reading the first section? I ask myself, "Do I even care?"
    description: Calvin says problems look overwhelming at first.  The secret is to break them into small chunks.  He tells Hobbes he's supposed to read the entire history chapter in his school book.  It looks impossible, so he breaks the problem down.  Hobbes asks if he focuses on reading the first section.  Calvin says he asks himself if he even cares.
    characters: [calvin, hobbes]
  "19930109":
    transcript: Watcha doin'? I'm killing time while I wait for life to shower me with meaning and happiness. I hope you're comfy. You could get me something to eat.
    description: Sitting in the chair, watching TV, Calvin tells Hobbes he's killing time to wait for life to shower him with meaning and happiness.  Hobbes hopes he's comfy.
    characters: [calvin, hobbes]
  "19930110":
    transcript: This is my latest snow sculpture. Where? All of this! But you didn't do anything. Right. Art is dead! There's nothing left to say. Style is exhausted and content is pointless. Art has no purpose. All that's left is commodity marketing. Consequently, I'm signing this landscape and you can own if for a million dollars. Sorry...it does't match my furniture. The problem with being avant-garde is knowing who's putting on who.
    description: Calvin shows Hobbes his latest snow sculpture.  Hobbes doesn't see anything.  Calvin tells Hobbes art is dead.  There's nothing to say, so art has no purpose.  He signs his name in the snow and offers it to Hobbes for a million dollars.  Hobbes says it doesn't match his furniture.  Calvin says the problem with being avant-garde is knowing who's putting on who.
    characters: [calvin, hobbes]
    source: miraheze
  "19930111":
    transcript: This snowman doesn't look very happy. He's not. He knows it's just a matter of time before he melts. The sun, ignores his entreaties. He feels his existence is meaningless. Is it? Nope. He's about to buy a big screen TV.
    description: Hobbes looks at a snowman that has a frown.  Calvin tells Hobbes the snowman knows it's a matter of time before the sun melts it.  The snowman feels his life is meaningless.  Hobbes asks if it is.  Calvin says no, the snowman is going to buy a big screen TV.
    characters: [calvin, hobbes]
  "19930112":
    transcript: Home, sweet home.
    description: Dad walks on the sidewalk heading home.  At the end of sticks put next to the sidewalk are heads of snowmen with X's for eyes.  Dad says it's home, sweet home.
    characters: [dad]
  "19930113":
    transcript: For the townsfolk below, the day began like any other day.
    description: Calvin makes a tiny snowman.  He makes several more, then walks up a hill.  On his toboggan at the top of the hill, Calvin says the townsfolk below began their day like any other day.
    characters: [calvin]
  "19930114":
    transcript: What's wrong with your snowman? It's a snow WOMAN. I don't care. We're not having an anatomically correct snowman in the front yard.
    description: Calvin asks Susie what's wrong with her snowman.  It has breasts.  Susie tells him it's a snow woman.  Later, with Calvin standing next to a snowman with its back to Mom, she tells Calvin they're not having an anatomically correct snowman in the front yard.
    characters: [calvin, mom, susie]
  "19930115":
    transcript: I hate trudging up these hills. I didn't come out here to WORK! I came out here to ride and have FUN! Well, you can't ride the sled if you don't climb the hills. I could if you pulled me up. He's so lazy and selfish.
    description: Hobbes pulls the sled up the hill.  Calvin complains he hates trudging up the hills.  He didn't come out to work, he came out to play.  Hobbes tells him he can't ride the sled if he doesn't climb the hills.  Calvin says he can, if Hobbes pulls him up.  Calvin, standing with the sled rope in hand and no Hobbes around, says Hobbes is lazy and selfish.
    characters: [calvin, hobbes]
  "19930116":
    transcript: Ha ha! I'd sure like to see Mom make me come inside NOW! With this fort and arsenal of 200 snowballs, NOBODY can tell ME what to do! I can stay out here all day! At last, I'm the master of my fate! I'll stay outside as long as I please! Back inside so soon? It's too cold out.
    description: In his snow fort, with several snowballs made, Calvin says he'd like to see Mom make him come inside.  He says with his arsenal, he can stay out all day.  He's the master of his fate and can stay outside as long as he pleases.  Mom sees Calvin warming his hands and asks if he's back inside so soon.  Calvin says it's too cold out.
    characters: [calvin, mom]
  "19930117":
    transcript: We've been out here half an hour and nobody's attacked our fort. We don't have enough enemies, that's our problem. We're just too darn popular. Yeah, everybody likes us because we're so great. It's true. And of course, I'm a genius, so people are naturally drawn to my fiery intellect. Their admiratioin overwhelms their envy! Actually, I believe jungle cats are held in higher esteem. Whereas one can hardly take a kid out in public, tigers add panache and savoir faire to any social occasion. Whaddaya mean kids can't go out in public?!? At least kids don't have fleas! That's only because fleas can't stand the way kids smell!
    description: In the snow fort, Calvin and Hobbes complain nobody's attacked their fort.  They're too popular.  Calvin says he's a genius, so people are drawn to his intellect.  Hobbes believes jungle cats are held in higher esteem.  He says you can't take a kid out in public, but tigers add savoir faire to any social occasion.  Calvin says at least kids don't have fleas.  Hobbes counters that's because fleas can't stand the way kids smell.  They threaten each other, then throw snowballs.  As they lie on the ground, covered with snow, Hobbes suggests they don't need enemies.  Calvin says best friends are all he can take.
    characters: [calvin, hobbes]
    source: miraheze
  "19930118":
    transcript: Eggplant casserole tonight? Why, yes!
    description: Dad gets out of the car to see snowmen.  One is lying face down, one bent over retching.  Another is clutching at its throat.  Inside, Dad asks Mom if they're having eggplant casserole.  Mom says "why, yes".
    characters: [mom, dad]
  "19930119":
    transcript: All that fur must be strictly ornamental.
    description: Calvin sees Hobbes lying in the sunlight coming through the window.  He sees Hobbes lying in front of the fireplace.  He sees Hobbes lying on a heating register.  Later, he sees Hobbes under the covers in bed.  Calvin says all that fur must be strictly ornamental.
    characters: [calvin, hobbes]
  "19930120":
    transcript: NICE TRYYY!
    description: Mom pulls back the shower curtain to find a snowman looking like Calvin in the bathtub.  Mom yells that it's a nice try.  Calvin peeks in from the hall.
    characters: [calvin, mom]
  "19930121":
    transcript: Nothing I do is my fault. My family is dysfunctional, and my parents won't empower me! Consequently, I'm not self-actualized! My behaviour is addictive functioning in a disease process of codependency! I need holistic healing and wellness before I accept any responsibility for my actions! One of us needs to stick his head in a bucket of ice water. I love the culture of victimhood.
    description: Calvin says nothing he does is his fault.  He says his family is dysfunctional, so he's not self-actualized.  He says his behavior is addictive functioning in a disease process of toxic co-dependency.  He need holistic healing before he'll accept responsibility for his actions.  Hobbes says one of them needs to stick his head in a bucket of ice water.  Calvin says he loves the culture of victimhood.
    characters: [calvin, hobbes]
  "19930122":
    transcript: Why is this snowman looking at a snowball? He's contemplating snowman evolution. Obviously, if he evolved from a snowball, it raises tough theological questions for him. Like the morality of throwing someone's precursors at someone? Sure. And what about shoveling one's genetic material off the walk?
    description: Calvin has built a snowman looking at a snowball.  He tells Hobbes he's contemplating snowman evolution.  If he evolved from a snowball, it raises tough theological questions.  Hobbes asks if one of those would be the morality of throwing one's precursors at someone.  Calvin says yes, and adds the question of shoveling one's genetic material off the walk.
    characters: [calvin, hobbes]
  "19930123":
    transcript: It's that moment of dawning comprehension I live for.
    description: Calvin stops when a snowball plops in front of him.  He looks up.  Horrified, he's hit by several snowballs.  Up in the tree, Hobbes says it's that moment of dawning comprehension he lives for.
    characters: [calvin, hobbes]
  "19930124":
    transcript: ""
    description: A hadrosaur grazes in the jungle.  A tyrannosaur comes out attacking it.  Calvin hits Susie with a snowball.  She gets up.  The hadrosaur chases the tyrannosaur.  Calvin closes his front door, marches upstairs, and throws away his book on dinosaurs.
    characters: [calvin, susie]
