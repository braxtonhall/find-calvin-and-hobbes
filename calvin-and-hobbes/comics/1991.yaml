  "19950827":
    transcript: Blogg! Ukh muggablukk Spiff! Spiff?! Blecckh blecckh! We join our hero, the courageous Spaceman Spiff, as he flees the awful bug beings of Zartron-9! Spiff's only chance is a daring strategy of head-to-head combat! Our hero swings around and readies his computer-guided death ray blaster! ..Tum te tum tum.. I wish this booted up faster. C'mon, c'mon. There we go. Let's see, get the "file" icon... double click on "blaster"... Hmm, pull down "settings"... get the dialog box... click on "rays"... select "death"... hit "OK." Hey, what's the matter? Why didn't my screen change?! Hit "F1" for "help." "About blasters"... nope... "Calibrating blasters"... nope... "Charging the fizzler"... no... "Fizzling the charger"... no... "Incineration guidelines"... oh, this is annoying! Oh wait, I didn't enter the number of volts! That's it! Type in "gazillion," hit "OK." What?! "Invalid setting." Darn! Go back to "volts," highlight "gazillion," press "delete." Type in... KRAKK Spiff is hit! He's going down! Hey, why won't this boot up? Has somebody been playing with this thing?! The whole thing went down, Dad. Luckily I jumped clear at the last second.
