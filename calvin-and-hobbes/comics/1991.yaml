  "19920708":
    transcript: Hi Dad, it's me, Calvin. I just called to let you know it's a perfect day outside. Too bad you're trapped in a boring office while I'm running around free with no responsibilities! Have a good summer! Ha ha ha! *click* Childhood is for spoiling adulthood.
