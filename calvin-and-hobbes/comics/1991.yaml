  "19950423":
    transcript: Look at all the stars! The universe just goes out forever and ever! It kind of makes you wonder why man considers himself such a big screaming deal. That's why we stay inside with our appliances.
    description: Calvin and Hobbes look at the sky at night.  Calvin says to look at the stars.  The universe goes on forever and ever.  Hobbes says it makes you wonder why man considers himself such a big deal.  Calvin thinks about it.  They go inside to watch television.  Calvin says that's why they stay inside with their appliances.
    characters: [calvin, hobbes]
    source: s-anand+seligman+miraheze
  "19950424":
    transcript: 'This new issue of Chewing magazine tells how to set up a mandibular fitness regime! Basically, they recommend interval training: chewing one piece of gum with lots of reps, followed by chewing five pieces of gum at once, so you can really work the masseter and buccinator muscles. It''s a gruelling workout, but you build strength AND endurance, so you can come through in a clincher. I''m sure the glory makes it all worthwhile. Plus, you develop that "chewer''s jaw" that drives the girls wild.'
    description: Calvin's new issue of Chewing magazine tells how to set up a fitness regime.  Calvin says they recommend interval training.  He tells Hobbes it's a grueling workout, but you build strength and endurance.  Hobbes rolls his eyes and says all the glory makes it all worthwhile.  Calvin says you also develop "chewer's jaw", which drives the girls wild.
    characters: [calvin, hobbes]
  "19950425":
    transcript: What's with the face? I'm doing stretches. Chewing magazine says you should always warm up before you chew gum. Did you know that neglecting to stretch the temporalis muscles is the leading cause of gum chewing injuries? What about falling down while chewing and walking? With a good helmet, the risk is surprisingly small.
    description: Calvin's mouth is hanging open.  He tells Hobbes he's doing stretches.  As he pulls his cheeks and jaws, he says you should warm up before chewing gum.  Neglecting to stretch is a leading cause of chewing gum injuries.  Hobbes asks about falling down while chewing and walking.  Calvin puts on a helmet saying that with a good helmet, the risk is surprisingly small.
    characters: [calvin, hobbes]
  "19950426":
    transcript: In this issue, Chewing reviews the new gum chewing apparel. This jersey is makde with Swet-Tek (R) fibers that wick away perspiration! The mesh collar keeps your sternomastoids ventilated and the zippered pockets hold spare gum and wrappers! Why is it covered with brand logos? That gives you the psychological edge of pretending you're sponsored. How can you tell if you're reading an advertisement, a product review, or the product itself? I'D sure like to be a walking endorsement.
    description: Calvin's new Chewing magazine reviews gum chewing apparel.  There is a jersey that wicks away perspiration.  There is a mesh collar for ventilation and zippered pockets to hold spare gum.  Hobbes asks why it's covered with logos.  Calvin says that gives a psychological edge of pretending you're sponsored.  Hobbes wonders how you tell if you're reading an advertisement, a product review, or the product itself.
    characters: [calvin, hobbes]
  "19950427":
    transcript: I need to get a heart rate monitor. What for? To make sure I'm chewing at my aerobic threshold! Every day I want to see that I'm chewing more gum faster, harder, and longer! What's the point of attaching a number to everything you do? If your numbers go up, it means you're having more fun. Sciece to the spirit's rescue once again.
    description: Calvin says he needs a heart rate monitor to make sure he's chewing at his aerobic threshold.  He wants to see he's chewing more gum, faster, harder, and longer.  Hobbes asks the point of attaching a number to everything you do.  Calvin says if your numbers go up, you're having more fun.  Hobbes calls it science to the spirit's rescue once again.
    characters: [calvin, hobbes]
  "19950428":
    transcript: WHAT ON EARTH AM I DOING HERE ON THIS BEAUTIFUL DAY?! THIS IS THE ONLY LIFE I'VE GOT!! AAAAAAA. Next time, try a drink of water and a few deep breaths.
    description: Calvin is sitting at his desk.  Suddenly, he asks what he's doing in there on a beautiful day.  He says this is the only life he has.  He runs off.  Miss Wormwood returns him to his desk, saying to try a drink of water and a few deep breaths next time.
    characters: [calvin, wormwood]
  "19950429":
    transcript: Look! A trickle of water running through some dirt! I'd say our afternoon just got booked solid!
    description: Calvin shows Hobbes a trickle of water running through some dirt.  He says their afternoon just got booked solid.
    characters: [calvin, hobbes]
  "19950430":
    transcript: ""
    description: Someone is flying a spacecraft, cruising between large mesas, heading toward the horizon.  A monster appears ahead of the spacecraft.  Miss Wormwood is standing in front of Calvin's desk.  He's startled awake.  He looks at his school book.  He sees a herd of dinosaurs as he comes out of the bushes.
    characters: [calvin, wormwood]
  "19950501":
    transcript: I suppose the secret to happiness is learning to appreciate the moment. I, for example, take great pleasure in being right here, right now, doing what we're doing. Of course, you're supposed to be at school. I couldn't appreciate those moments.
    description: Calvin tells Hobbes the secret to happiness is to learn to appreciate the moment.  As they climb a tree, Calvin tells Hobbes he takes great pleasure being right here, right now.  Hobbes reminds Calvin he's supposed to be at school.  Calvin replies he couldn't appreciate those moments.
    characters: [calvin, hobbes]
  "19950502":
    transcript: Why aren't we hooked up to an on-line service, so we can connect to other computers? It's bad enough we have a telephone. HELLLPPP!!
    description: Calvin asks Dad why they aren't hooked up to an online service so they can connect to other computers.  Dad says it's bad enough they have a telephone.  Calvin goes outside and yells "HELLLPPP!!!"
    characters: [calvin, dad]
  "19950503":
    transcript: I hate when a lot of kids are on the slide. You wait forever to get to the top and then the ride is over so fast. And if you sit for a moment to enjoy the height, everybody yells at you to get going. And sometimes the idiot behind you starts down too soon and he smacks into you at the bottom before you can get away. Yep, the playground is a LOT more fun after the class starts. CALVIN!
    description: Calvin climbs the slide ladder, saying he hates when a lot of kids are on the slide.  You wait forever to get to the top, then the ride is over so fast.  If you sit at the top to enjoy the height, everybody yells for you to get going.  As he slides down, he says sometimes the idiot behind you starts too soon and smacks into you before you can get away.  He runs off, saying the playground is a lot more fun after class starts.  A voice calls for Calvin.
    characters: [calvin]
  "19950504":
    transcript: PHOOMPP. Why are you crying? I'm cutting up an onion. It must be hard to cook if you anthropomorphize your vegetables.
    description: Calvin asks why Mom is crying.  She's cutting up an onion.  He walks away saying it must be hard to cook if you anthropomorphize your vegetables.
    characters: [calvin, mom]
  "19950505":
    transcript: Calvin, would you demonstrate the next problem at the board? Yes Miss Worm-wood. I would be hap-py to do an-y-thing you ask. I have been suc-cess-ful-ly pro-grammed to obey all di-rect-tives. I have no will of my own... my own... my own... my own. Doesn't anybody appreciate theater?!
    description: Miss Wormwood asks Calvin to demonstrate the next problem at the board.  Calvin walks forward like a robot.  He mechanically says he would be happy to do it.  He says he has been programmed to obey all directives.  He has no free will.  As Calvin walks to the principal's office, he asks if anyone appreciates theater.
    characters: [calvin, wormwood]
  "19950506":
    transcript: Can I run the vacuum cleaner? No, not until you're older. I'm old enough! I could do it! Well, maybe just this once, if you do a real good job. That suppressed smile worries me.
    description: Calvin asks Mom if he can run the vacuum cleaner.  He says he's old enough and can do it.  Mom says maybe this once, if he does a real good job.  As he vacuums, Calvin says that suppressed smile worries him.
    characters: [calvin, mom]
  "19950507":
    transcript: Time! Wow, 15 minutes and 20 seconds! Ha! Beat that! Weekends don't count unless you spend them doing something completely pointless. GO!
    description: Calvin runs through a field carrying an orange flag.  He crosses a log over a stream, climbs a hill, and crawls through a brush pile.  He climbs a tree, hangs up the orange flag and grabs a purple one.  He races back over the same course.  Hobbes calls time.  Hobbes is impressed with fifteen minutes and twenty seconds, and Calvin dares him to beat that.  Calvin says weekends don't count unless you spend them doing something completely pointless, and Hobbes takes off running.
    characters: [calvin, hobbes]
    source: s-anand+seligman+miraheze
    requiresBookReview: true
  "19950508":
    transcript: '"Please excuse Calvin from class today. His genius is urgently required on a top secret matter of national security. Sincerely, The President of the United States. P.S. Really." Nice try. Sit down. I gotta learn how to write in cursive.'
    description: Miss Wormwood reads a note from the President of the United States, indicating Calvin should be excused because his genius is required on a matter of national security.  Miss Wormwood looks at Calvin and tells him it was a nice try.  Calvin sits down, grumbling that he needs to learn how to write in cursive.
    characters: [calvin, wormwood]
  "19950509":
    transcript: How come grown-ups don't go out to play? Grown-ups can only justify playing outside by calling it exercise, doing it when they'd rather not, and keeping records to quantify their performance. That sounds like a job. ...except you don't get paid. So play is worse than work? Being a grown-up is tough.
    description: Calvin asks Dad why grownups don't go out to play.  Dad says they justify playing outside by calling it exercise, doing it when they'd rather not, and keeping records to quantify their performance.  Calvin says that sounds like a job.  Dad says it is, except you don't get paid.  Calvin asks if play is worse than work.  Dad says being a grownup is tough.
    characters: [calvin, dad]
  "19950510":
    transcript: A big part of life is boring routine. I need more excitement. So today, I'm going to have a new kind of cereal. This cereal doesn't have any chocolate frosting. It has fiber and raisins. Of course, a bit part of life is horryifying surprise. Routines can be comforting. We tigers prefer to inflict excitement on others.
    description: Calvin tells Hobbes a big part of life is boring routine.  He needs excitement.  He is going to have a new kind of cereal.  Hobbes reads the cereal doesn't have chocolate frosting, but does have fiber and raisins.  Calvin goes back to the pantry saying a big part of life is horrifying surprise.  Routines can be comforting.  He grabs his "Chocolate Frosted Sugar Bombs".  Hobbes says tigers prefer to inflict excitement on others.
    characters: [calvin, hobbes]
  "19950511":
    transcript: 15 people in line and the teller goes on break without a replacement. After I wait ten minutes, they open a new line for all the people behind me who have waited TWO minutes. I'm waiting to pay, and the cashier puts ME on hold instead of the person on the telephone. Have a nice day. Too late.
    description: Mom is shopping.  She's angry that the bank teller went on break without a replacement with fifteen people in line.  She says after she waited ten minutes, a new line was opened for all the people behind her who waited two minutes.  As she tries to buy her groceries, she sees the cashier putting her on hold so that she could talk with someone on the telephone.  After she gets her last bag, the cashier tells Mom to have a nice day.  Mom replies that it's too late.
    characters: [mom]
  "19950512":
    transcript: Have you noticed how nobody dresses up for anything anymore? People look like slobs wherever they go. Everybody's rude, too. People swear all the time, and you can forget about being addressed as "Mr." or "Sir." There's no respect for anyone. How come I gotta change the world?!
    description: At dinner, Mom tells Dad that nobody dresses up for anything anymore.  People look like slobs.  Dad agrees that people are too rude, and that there's no respect for anyone.  Later, Calvin is standing all dressed up, with his hair combed.  He complains why he has to change the world.
    characters: [calvin, mom, dad]
  "19950513":
    transcript: Every Saturday morning is the same. We get up at the crack of dawn, watch cartoons and eat sugary cereal until we fight, and then Mom throws us out of the house. It never changes. That's what I like about Saturdays too! First one downstairs get to pick the cartoons!
    description: Calvin wakes up and tells Hobbes every Saturday morning is the same.  They get up at the crack of dawn, watch cartoons, eat sugary cereal until they fight, then get thrown out of the house by Mom.  As they get out of bed, Hobbes says that's what he likes about Saturdays, too.  Calvin calls out that the first one downstairs gets to pick the cartoons.
    characters: [calvin, hobbes]
  "19950514":
    transcript: You know, Hobbes, some days even my lucky rocketship underpants don't help. Well, you've done all you can do.
    description: Calvin puts on his lucky rocketship underpants, admires himself in the mirror, and marches off, ready to face the school day.  He sits in gum.  He's caught peeking at a classmate's paper.  Moe knocks him into the lockers.  The water fountain sprays his face.  His show and tell goes badly.  No one wants him on their team at recess.  He doesn't know what the lunch is.  He can't get on the swing.  Everyone in class knows the answer except him.  He stares out the window at the sunny day.  He misses the bus home.  Calvin walks home in the rain.  In bed, he looks out the window and says that some days even lucky rocketship underpants don't help.  Hobbes says he's done all he could do.
    characters: [calvin, hobbes, wormwood, moe]
    source: s-anand+seligman+miraheze
  "19950515":
    transcript: PHOOOOFF. Wow! Look at the size of that one! bip. Secretly, I was hoping for a deafening explosion.
    description: Calvin blows a soap bubble.  He watches the large bubble drift along.  It pops.  Calvin says that secretly he was hoping for a deafening explosion.
    characters: [calvin]
    source: s-anand+seligman
    review: "verified: checked against a source outside the corpus by the maintainer"
    requiresBookReview: true
  "19950516":
    transcript: FFOOOOFF. FFOOOOF. BIP.
    description: Calvin blows a soap bubble.  It starts to drift off, then stops.  It blows back at Calvin.  Then, it pops.  Calvin isn't sure what just happened.
    characters: [calvin]
  "19950517":
    transcript: WHACK. AAA!! What are you scared of? The ball's not going to bit you. How do YOU know?
    description: Calvin tosses a baseball into the air so he can hit it.  He swings and hits the ball.  It is stuck on his bat, chewing it.  Calvin hides up in a tree.  Dad asks what he's scared of.  The ball isn't going to bite him.  Calvin asks how he knows.
    characters: [calvin, dad]
    source: s-anand+seligman
    review: "verified: checked against a source outside the corpus by the maintainer"
    requiresBookReview: true
  "19950518":
    transcript: AA! AA! AA! AA! MMF! CHOMP! ARF! What do you mean, you want a glove for the other hand too? Which word don't you understand?
    description: Calvin tosses the ball into the air so he can catch it.  As it comes down, Calvin screams.  The ball bites his glove and chomps on it while Calvin flails.  Later, Dad asks if Calvin means he wants a glove for the other hand too.  Calvin asks which word he doesn't understand.
    characters: [calvin, dad]
  "19950519":
    transcript: AAA! CLOMP! How often have I told Calvin not to leave his stuff in the yard?!
    description: Calvin warily approaches the baseball with a bat.  He taps the ball with the bat.  The ball bites the end of the bat, and Calvin runs off.  Later, Dad sees the ball and bat on the ground.  He asks how often he's told Calvin not to leave his stuff in the yard.
    characters: [calvin, dad]
    source: s-anand+seligman
    review: "verified: checked against a source outside the corpus by the maintainer"
    requiresBookReview: true
  "19950520":
    transcript: Have you been hitting rocks with this bat? No, why? Look at it. It's chewed up. You should take care of your equipment. The ball did this! It's what I've been trying to tell you! These are fang marks! That ball is berserk! It's deranged! It's a menace! Why do I even bother?
    description: Dad holds up Calvin's bat and asks if he's been hitting rocks with it.  Calvin asks why.  Dad says it's all chewed up, and Calvin should take care of his equipment.  Calvin says the ball did it.  He says that's what he's been trying to tell Dad.  They're fang marks, and the ball is berserk, deranged, a menace.  Later, sitting on his bed, Calvin wonders why he even bothers.
    characters: [calvin, dad]
  "19950521":
    transcript: Yawnnn. Let go of me, you malevolent, murderous moron!! It's morning! Now we can do stuff again! C'mon! Whee! It's hard to be mad at someone who misses you while you're asleep.
    description: Calvin gets out of bed.  Hobbes pounces on him.  Calvin tells the malevolent, murderous moron to leave him alone.  Hobbes tosses him into the air and says it's morning.  Now they can do stuff again.  Hobbes runs off.  Calvin chases him saying it's hard to be mad at someone who misses you while you're asleep.
    characters: [calvin, hobbes]
    source: miraheze
  "19950522":
    transcript: Aackkk. Ch... ch... ch... chocolate ch-chips... no. And get up off the floor. urgle.
    description: Calvin crawls on the floor.  He is weak.  He reaches forward.  Mom is in the kitchen.  He weakly calls for chocolate chips.  Mom says no and tells Calvin to get up off the floor.
    characters: [calvin, mom]
  "19950523":
    transcript: I'm a great believer in the value of novelty. I say anything NEW is GOOD by definition! It can shock, insult, or offend me, so long as it doesn't bore me! If you can't give me something new, then repackage the old so it LOOKS new! Novelty is all that matters! I won't pay attention if it's not fresh and different! I see why timeless truth doesn't sell. Give me a good flash in the pan any day.
    description: Calvin is a great believer in the value of novelty.  He says anything new is good by definition.  He tells Hobbes if you can't give him something new, then repackage the old so it looks new.  Novelty is all that matters.  He won't pay attention if it's not fresh and different.  Hobbes sees why timeless truth doesn't sell.  Calvin will take a good flash in the pan any day.
    characters: [calvin, hobbes]
  "19950524":
    transcript: YAWWNN. YAWNNN. YYAWNN. YAWWNN. One of us should have left the room.
    description: Hobbes yawns, then Calvin does.  They both yawn.  They lie down.  Calvin says one of them should have left the room.
    characters: [calvin, hobbes]
  "19950525":
    transcript: When I was a kid, my Mom would take me to the big old department store downtown, and I used to love riding the escalators. The escalators there had wood stairs, and they used to click, clack, and creak. The wood slats on each step were maybe half an inch apart, and I always wondered if ladies got their high heels stuck and got pulled under. Some of those escalators were very narrow - just wide enough for one person. Yep, those old escalators had a lot more personality than these slick metal ones. I'd hate to think that all my current experiences will someday become stories with no point.
    description: Dad tells Calvin that his mom took them to a department store, and that he loved riding the escalators.  Dad explains how they sounded, and that he wondered if ladies got their heels stuck and got pulled under.  He says the old escalators had more personality than slick, metal ones.  Calvin thinks to himself that he hates to think all his current experiences will become stories with no point one day.
    characters: [calvin, dad]
  "19950526":
    transcript: Mmf. Rrgg. One! REWARD, PLEASE!
    description: Calvin struggles to do a pushup.  He finally completes one.  He asks for a reward.
    characters: [calvin]
  "19950527":
    transcript: Giving is better than having. When you GET something, it's new and exciting, when you HAVE something, you take it for granted and it's boring. But everything you GET turns into something you HAVE. That's why you always need to get new things. I feel like I'm in some stockholder's dream. "Waste and want", that's my motto.
    description: Calvin says getting is better than having.  He says when you get something, it's new and exciting.  When you have it, it's boring.  Hobbes says everything you get turns into something you have.  Calvin says that's why you always need to get new things.  Hobbes feels he's in some stockholder's dream.  "Waste and want" is Calvin's motto.
    characters: [calvin, hobbes]
  "19950528":
    transcript: Ugh, I hate going to the subconscious. Me too! Why doesn't anyone ever clean this dump? Here's a movie reel. I suppose it's as good as any. I grabbed these two. Let's get back to central cognition. We can run this reel first. I hope these are better than last night's movies. Hurry up! The lights are dimming! Help me thread the projector! Yikes, this is awful! Where did you guys find this? Oops, the next reel isn't even from the same film. Good! Put it on! This one is even worse! I guess it's some sort of suspense movie. Why can't we ever watch anything good? Maybe you should get the movies next time! AUGHH! Monsters! Monsters! Turn it off! Too scary!! Quick, try another reel! This one makes no sense! What's going on?? Has this been dubbed from some other language? None of these make sense! We're splicing them all out of order. What a waste of time! The lights are coming back on! Show's over! Finally! I thought this would never end. Back to work! Man your stations! Full alert! Whoo, I had so many strange dreams ... I wonder what they mean.
    description: Some movie reels are gathered up in Calvin's subconscious.  As they prepare to play the movies, the men hope they're better than last night's.  The first one is bad.  They replace it with another from a different film.  It's a suspense movie.  They try the third.  It's a monster movie.  None of the movies make sense.  They are out of order.  The lights are coming back on.  They go back to their stations.  Calvin wakes up.  He says he had so many strange dreams and wonders what they mean.
    characters: [calvin]
  "19950529":
    transcript: I heard that Miss Wormwood isn't here today. Really? Can we go home? Of course not. We have a substitute teacher. Can I send in a substitute student?
    description: Susie tells Calvin that Miss Wormwood isn't at school today.  Calvin wonders if they can go home.  Susie tells him they have a substitute teacher.  Calvin asks if he can send a substitute student.
    characters: [calvin, susie]
  "19950530":
    transcript: Who's our substitute teacher? Do you know? Mr. Kneecapper. Oh NO! Really? I heard he killed a kid last year! What?! Yeah, some kid was talking in class, so Mr. Kneecapper took him out in the hall, and there were strange lumps in the cafeteria meatloaf that afternoon! OHH! Wait till she sees what's on today's lunch menu.
    description: Calvin asks who their substitute teacher is.  When Susie tells him, Calvin says he heard that teacher killed a kid last year.  He tells Susie the teacher took a kid out to the hall, then there were strange lumps in the cafeteria meatloaf that afternoon.  Susie is grossed out and leaves.  Calvin says to wait till she sees what's on today's lunch menu.
    characters: [calvin, susie]
  "19950531":
    transcript: "Things I will never like: 1. Drying off with a cold, damp towel. 2. The feeling of seaweed wrapping around my leg. 3. Anything that was popular in the '70s. 4. Licorice, yams, or raisins. 5. That high-pitched screech that babies make. 6. Writhing maggots. It's comforting to know that there are certainties in life."
    description: Calvin writes a list of things he'll never like.  He mentions drying off with a cold, damp towel.  He mentions seaweed wrapping around his leg.  He mentions raisins, the screech babies make, and writhing maggots.  He tells Hobbes it's comforting to know there are some certainties in life.
    characters: [calvin, hobbes]
  "19950601":
    transcript: Life is full of possibilities. For example, right now, instead of waiting for the school bus, I could stick out my thumb, hitch a ride, and spend the rest of my life in the Serengeti, migrating with the wildebeests! The Serengeti is in Africa. You couldn't really hitch a ride there. Life is full of precluded possibilities.
    description: Calvin tells Hobbes life is full of possibilities.  Instead of waiting for the school bus, he could thumb a ride and spend the rest of his life in the Serengeti, migrating with wildebeests.  Hobbes points out that the Sergengeti is in Africa and that he couldn't really hitch a ride there.  Calvin frowns and says life is full of precluded possibilities.
    characters: [calvin, hobbes]
  "19950602":
    transcript: Slurrpp. Sluurrp. AACKKPTH URGK BLUB! I'd bet anything that the principal has a valve in his office that changes the water pressure.
    description: Calvin drinks from a water fountain.  It sprays up into his face.  As he walks away dripping, he says he bets the principal has a valve in his office that changes water pressure.
    characters: [calvin]
  "19950603":
    transcript: Why are you digging a hole? I'm looking for buried treasure! What have you found? A few dirty rocks, a weird root, and some disgusting grubs. On your first try?? There's treasure everywhere!
    description: Hobbes asks why Calvin is digging a hole.  Calvin is looking for buried treasure.  Hobbes asks what he's found.  Some dirty rocks, a weird root, and some disgusting grubs.  Hobbes is overjoyed and asks if it was Calvin's first try.  Calvin says there's treasure everywhere.
    characters: [calvin, hobbes]
  "19950604":
    transcript: The fearless spaceman Spiff, interplanetary explorer extraordinaire, gazes across the forbidding landscape of an uncharted planet.! What dangers lie ahead for our hero? What horrible aliens inhabit this world! What strange adventures await the intrepid spiff? What bizarre occurrence will our hero be the first to witness? The suspense! ...Our hero chucks a few rocks... .Sighhh If you couldn't find any weirdness, maybe we'll just have to make some! Now yer talkin'!
    description: Spaceman Spiff gazes across the landscape.  He wonders what dangers lie ahead.  He wonders what bizarre occurrence he will be the first to witness.  Spiff keeps looking across the expanse.  He throws a few rocks.  Spiff sighs.  Calvin goes back inside.  Hobbes comes with him, saying that if he couldn't find any weirdness, they'll have to make some.
    characters: [calvin, hobbes, spiff]
    source: miraheze
  "19950605":
    transcript: Boy, our family would sure be in trouble if YOU were bringing home the bacon! I AM NOT BACON!
    description: Calvin sees Hobbes lying on the floor.  He says the family would be in trouble if Hobbes were bringing home the bacon.  As he turns around, Hobbes pounces on him.  Hobbes carries him in his mouth and drops him.  Hobbes walks away, and Calvin yells after him that he isn't bacon.
    characters: [calvin, hobbes]
  "19950606":
    transcript: Ouchywawa. I've got a big owwy boo boo on my pinky. That's too bad. When your ailments sound cute, you don't get much sympathy.
    description: Calvin tells Mom that he has a big "owwy boo boo" on his pinky.  Mom says that's too bad.  Calvin walks away saying that when your ailments sound cute, you don't get much sympathy.
    characters: [calvin, mom]
  "19950607":
    transcript: When birds burp, it must taste like bugs. Nobody ever pays me a penny for my thoughts.
    description: Sitting under a tree, Calvin tells Hobbes that when birds burp, it must taste like bugs.  Hobbes leaves.  Calvin says nobody ever pays a penny for his thoughts.
    characters: [calvin, hobbes]
  "19950608":
    transcript: Look at this, Hobbes. I added it up and figured out I spend an average of four days a year taking baths! Four full days - morning, noon, and night - just sitting in the bathtub! What could possibly be a bigger waste of time than that?! How long did it take you to add this all up?
    description: In the bathtub, Calvin says he figures he spends an average of four days a year taking baths.  He asks what could possibly be a bigger waste of time than that.  Hobbes looks at the paper and asks how long it took Calvin to add all that up.
    characters: [calvin, hobbes]
  "19950609":
    transcript: Wow! Look at this bug go! What on earth would make a bug hurry? You're deluding yourself, stupid! Nothing you do is important! You're just a bug! Oh my gosh, look at the time!
    description: Calvin sees a bug walking.  He tells the bug to stop deluding himself.  Nothing he does is important.  He notices what time it is and runs off.
    characters: [calvin]
  "19950610":
    transcript: I'm a man of few words. Maybe if you read more, you'd have a larger vocabulary.
    description: Calvin says he's a man of few words.  Hobbes suggests that if he read more, he'd have a larger vocabulary.  Hobbes runs off with Calvin in hot pursuit.
    characters: [calvin, hobbes]
  "19950611":
    transcript: Bwa ha ha ha ee hee hee hee hee ehh heh heh heh ...A little more..A little more.. AAA! I won't fill this one so full. There! Perfect! Heh heh Darn knot! Ackk blpp! Stop it! Pbtt! It's too slippery! Ackpth! Blp! Now look, it's almost empty! I'll have to fill it again. Stupid baloon. A little more...Ah! Perfect! It slipped off! Doggone it! Hobbes will be here any second and... Yaaaa Oh no! AAAAA! Gee, what's the point?
    description: Calvin is filling up a water balloon.  It bursts, soaking Calvin with water.  He gets another balloon and vows not to fill that one so full.  He has trouble tying off the knot, spilling water all over himself.  He starts to fill the balloon again.  It slips off and soaks him.  Calvin says Hobbes will be there at any second, so he tries to fill the balloon again.  Hobbes runs up, and Calvin covers himself.  Hobbes notices how soaked Calvin already is.  He asks what the point is.  Hobbes walks away.
    characters: [calvin, hobbes]
    source: miraheze
  "19950612":
    transcript: It's hot, it's humid, it's buggy, there's no breeze, and the air is full of pollen. But it's SUMMER!
    description: Calvin complains that it's hot, humid, buggy, with no breeze, and the air is full of pollen.  Then he says "But it's summer!"  Off he and Hobbes go to play.
    characters: [calvin, hobbes]
  "19950613":
    transcript: Hey ant, you're working like a maniac, and what have you got to show for it? What's the colony done for YOU lately? What about YOUR needs? You don't owe anybody anything! Let the others fend for themselves! Move out! Discover yourself! Express your individuality! If they listen, this should solve our ant problem.
    description: Calvin asks an ant why he's working like a maniac.  He asks what the colony has done for the ant lately.  He says the ant doesn't owe anybody anything.  He tells the ant to discover himself and express his individuality.  Calvin says if they listen, it should solve their ant problem.
    characters: [calvin]
  "19950614":
    transcript: Hello? It surrrrre is nice outside! Climb a tree! Goof off! *click* Dad harrasses me with HIS values, so I harass him with mine.
    description: Dad answers the phone at his office.  Calvin says it's nice outside.  He tells Dad to climb a tree and goof off.  He hangs up.  Calvin tells Hobbes that if Dad harasses him with his values, he'll harass Dad with his.
    characters: [calvin, hobbes, dad]
  "19950615":
    transcript: Look! I caught a butterfly! If people could put rainbows in zoos, they'd do it.
    description: Calvin shows Hobbes a butterfly he caught and put in a jar.  Hobbes tells him that if people could put rainbows in zoos, they'd do it.  Calvin looks at the jar, opens it and lets the butterfly out.
    characters: [calvin, hobbes]
  "19950616":
    transcript: AAAAAAA. You're awake? Oh boy! Let's go! N-no c-coffee f-for m-me, th-thanks. Hehh hoo hehh
    description: An eye opens to see Hobbes directly in front.  Calvin is startled awake by Hobbes.  Hobbes says that since he's awake, they can go play.  Still jittery from the experience, Calvin says he doesn't need any coffee.
    characters: [calvin, hobbes]
  "19950617":
    transcript: Why does ice float? Because it's cold. Ice wants to get warm, so it goes on top of liquids in order to be nearer to the sun. Is that true? Look it up and find out. I should just look stuff up in the first place. You can learn a lot, talking to me.
    description: Calvin asks Dad why ice floats.  Dad says ice wants to get warm, so it goes to the top of liquids to be nearer the sun.  Calvin asks if that's true.  Dad tells him to look it up and find out.  Calvin unhappily walks away saying he should just look stuff up in the first place.  Dad says you can learn a lot talking to him.
    characters: [calvin, dad]
  "19950618":
    transcript: Hobbes gave me the story idea. Flip the pages again! This was by book!
    description: A stick person walks along.  He sees something, turns around and runs.  A stick animal comes up behind the stick person, jumps up and tackles the stick person.  The stick animal eats the head of the stick person and walks away.  Calvin tells Dad that Hobbes gave him the story idea.  He tells Dad to flip the pages again.
    characters: [calvin, dad]
    source: miraheze
  "19950619":
    transcript: I cleaned and oiled your bicycle, Calvin. What do you say I take some time and help you learn how to ride it? NOOOOOO!! You're welcome. Mom! Mom! Dad HATES me!
    description: Dad has cleaned and oiled the bicycle.  He asks Calvin if he'd like to learn to ride it.  Calvin runs away in horror, yelling no.  Dad says he's welcome.  Calvin tells Mom that Dad hates him.
    characters: [calvin, dad]
  "19950620":
    transcript: I've got the bike, Calvin. It's not going anywhere. I can feel it's going to throw me! Get ready to yank its wheels off! Just relax. I've got you. How can I relax? I'm uninsured and unarmed! I'm as good as head! Push back on the pedals. That's your brake, OK? Yes, well, that was fun! Thanks for the lesson! Get back here. No, really, I think I've got it! You can sell the bike now.
    description: Dad holds the bike with Calvin on it.  Calvin says the bike is getting ready to throw him off.  Dad tells him to relax.  Calvin says he can't relax.  He's uninsured and unarmed.  Dad tells Calvin how to apply the brakes.  Calvin thanks Dad for the lesson and runs off.  Dad tells him to come back.  Calvin says he has it, and that Dad can sell the bike now.
    characters: [calvin, dad]
  "19950621":
    transcript: The trick to balancing is to have a little forward momentum. AAA! No momentum! No momentum! Just pedal slowly. I'm holding the bike, so you won't fall. You'll let go and the bike will launch me into the ionosphere! Trust me, OK? TRUST you? I hardly KNOW you! I'm your father!? What, for six years?! When I'm 40, we'll see how things are going along!
    description: Dad tells Calvin the trick to balancing on a bike is to have momentum.  Calvin wants no momentum.  Dad says with him holding the bike, Calvin can't fall.  Calvin says he'll let go, and the bike will launch him into the ionosphere.  Dad tells Calvin to trust him.  Calvin replies he hardly knows Dad.  He's only known Dad for six years.  he offers to see how things are going when he's forty.
    characters: [calvin, dad]
  "19950622":
    transcript: Look, Calvin, you've got to relax a little. Your balance will be better if you're loose. I can't help it! Imminent death makes me tense! I admit it! You need a goal. Concentrate on your goal. My goal is to dismantle this bicycle and mail every piece to a different country so it can never be rebuilt! OK, that's not a good goal. WELL I'M NOT CHANGING IT!
    description: Dad tells Calvin to relax in order to improve him balance on the bicycle.  Calvin says imminent death makes him tense.  Dad tells Calvin to concentrate on a goal.  Calvin's goal is to dismantle the bike and mail each piece to a different country so it can't be rebuilt.  Dad says that isn't a good goal.  Calvin says he isn't changing it.
    characters: [calvin, dad]
  "19950623":
    transcript: Think about the places you can go once you learn how to ride! AAAAA. Think about how impressed your friends will be! Think about how much fun you'll have! AAAAAAA. AAAAAAAAAA. Think about inhaling. EEEP ahhh...
    description: Dad tells Calvin to think of the places he can ride when he learns how to ride a bicycle.  He tells Calvin to think how his friends will be impressed.  All this time, Calvin is yelling with his eyes wide open.  Dad tells him to think about inhaling.
    characters: [calvin, dad]
  "19950624":
    transcript: Ooh, it doesn't look like the bike lesson went so good. It didn't. Dad LIKES riding his bike! He doesn't understand what it's like for me! I HATE flipping over the bars, getting chased around the yard, and getting mowed down by a demonic machine! Is that what happened? No, I tripped coming up the stairs.
    description: Calvin is all scratched and bruised.  Hobbes says it looks like the bike lesson didn't go so well.  Calvin complains that Dad like riding his bike, so he doesn't understand what it's like for Calvin.  He says he hates flipping over bars, getting chased around the yard, and getting mowed down by a demonic machine.  Hobbes asks if that's what happened.  Calvin tells him no.  He tripped coming up the stairs.
    characters: [calvin, hobbes]
  "19950625":
    transcript: Ding dong I'm coming. I'm coming. Aaaa! I opened the door and my bike got in!! Hellpp! Run for your lives!! It's an unbalanced bicycle!! Someone get me a spoke wrench! Hehh hoo hehh hoo. Back! Back! Ha! You can't get me now! Aiee! Tire tracks on the rugs! Oil on the couch! Where's that kid?! Someday the neighbors will look out and wonder why there's a grown man wearing kids clothes on our roof.
    description: Calvin answers the doorbell.  The bike comes into the house and chases Calvin.  Over the sofa they go, up the stairs.  Calvin hides temporarily in the bathroom as the bike goes down the hall.  He holds the bike off with a chair as he backs out his bedroom window.  He closes the window and says the bike can't get him now.  Downstairs, someone yells there are tire tracks on the rugs and oil on the couch.  Another voice asks where Calvin is.  Outside on the roof, Calvin says someday neighbors will look out and wonder why there is a grown man wearing kids' clothes on their roof.
    characters: [calvin, mom, dad]
    source: miraheze
  "19950626":
    transcript: Darn ol' rain.
    description: Outside, it is raining.  Inside, Calvin sits in a chair holding a kite.  The kite is being kept aloft by a fan.
    characters: [calvin]
  "19950627":
    transcript: It's not summer if your tongue isn't purple.
    description: Calvin is eating a sucker.  He looks into the mirror.  He says it isn't summer if your tongue isn't purple.
    characters: [calvin]
  "19950628":
    transcript: What does it mean when someone says to "Give it the ol' college try"? It means you join your friends, get some cheap beer, order a pizza, and forget about tomorrow. That's not what it means! Where did YOU go to college? Never mind.
    description: Calvin asks Dad what it means when someone says they'll "give it the ol' college try".  Dad tells him you join your friends, get cheap beer, eat a pizza and forget about tomorrow.  Mom says that isn't what it means.  Dad asks where she went to college.
    characters: [calvin, mom, dad]
  "19950629":
    transcript: CAAAAAAALLLLLLVVINNNNN, THAAAAAT'S EEENOUUGHHH. M-mom s-sure was m-movingg st-strangellly t-toddayy. Maybe she's right about how much sugar you put on that cereal.
    description: Mom is shaking while she tells Calvin that's been enough.  Outside, Calvin is shaking.  He tells Hobbes that Mom was moving strangely today.  Hobbes tells him that she might be right about how much sugar he puts on his cereal.
    characters: [calvin, hobbes, mom]
  "19950630":
    transcript: Frank appraisal of your looks 50c. Any business? Not so far. But I'm giving out lots of free samples.
    description: Calvin sits at a box labeled "Frank Appraisal of Your Looks".  Hobbes asks if he's had any business.  Calvin says no, but that he's giving lots of free samples.
    characters: [calvin, hobbes]
  "19950701":
    transcript: What a lovely day for a hike! It's not so bad THIS way! No, we won't carry you. Stop griping. This is so much work!
    description: Mom and Dad are hiking.  Calvin bounces along behind them on a chair, saying it's not so bad this way.  Dad says they won't carry Calvin.  He trudges along, saying this is so much work.
    characters: [calvin, mom, dad]
  "19950702":
    transcript: Welcome to Stupidopolis...a thriving costal city..stupidly built near an undersea fault line...that just shifted! A curious shadow falls over downtown! Why does he build everything so close to the water? It's stupid. He doesn't seem to mind doing it over and over.
    description: Stupidopolis is a thriving coastal city built near a fault line.  A giant wave crashes into the city.  Calvin is laughing on the beach.  Dad asks Mom why Calvin builds everything so close to the water.  He says it's stupid.  Mom says Calvin doesn't seem to mind doing it over and over.
    characters: [calvin, mom, dad]
    source: miraheze
  "19950703":
    transcript: Look at this! Mom got me a book from the library. That's nice. NICE?!? It's SUMMER! I only get three short months to goof off! I'm not going to waste these precious days reading BOOKS! Summers are for vegetating! That's why the TV shows are reruns and the movies are sequels! No wonder the flies come out. Heck, everyone KNOWS it's not entertainment unless you can sit in the dark and eat.
    description: Mom got Calvin a book from the library.  Calvin complains to Hobbes that it's summer.  With only three months to goof off, he's not wasting precious days reading books.  He says summers are for vegetating.  He says everyone knows it's not entertainment unless you can sit in the dark and eat.
    characters: [calvin, hobbes]
  "19950704":
    transcript: Hey, are you reading that book Mom got from the library? Mm-hmm. Is it good? Do you like it? Is it exciting? Are you having fun? Shh. HOW COULD IT POSSIBLY BE FUN WHEN IT'S SO QUIET?!?
    description: Calvin asks Hobbes if he's reading the library book Mom had gotten for Calvin.  Hobbes is engrossed in reading it.  Calvin asks if it's good, if it's exciting, if he's having fun.  Hobbes quietly sits reading.  Calvin yells at him asking how it could be fun when it's so quiet.
    characters: [calvin, hobbes]
  "19950705":
    transcript: While you're reading that boring book, I'M going to go do something fun. OK. I'LL be having the time of my life, while you'll be sitting here yawning and wishing you were... AIEE!! I'll just kind of read over your shoulder, OK? No. Go do something fun.
    description: Calvin says he's going to do something fun while Hobbes reads his boring book.  Calvin crosses his arms and says he'll be having the time of his life, while Hobbes will wish he was.  Suddenly, Hobbes is startled by something in the book.  Calvin wants to read over Hobbes' shoulder.  Hobbes holds the book closer and tells Calvin to do something fun.
    characters: [calvin, hobbes]
  "19950706":
    transcript: I read this library book you got me. What did you think of it? It really made me see things differently. It's given me a lot to think about. I'm glad you enjoyed it. It's complicating my life. Don't get me any more.
    description: Calvin hands Mom the library book she had gotten.  He says he read it.  Mom asks what Calvin thought of it.  Calvin tells her it made him see things differently.  He has a lot to think about.  Mom says she's glad he enjoyed it.  Calvin tells her it's complicating his life and not to get him any more.
    characters: [calvin, mom]
  "19950707":
    transcript: I'm writing a fund-raising letter. The secret to getting donations is to depict everyone who disagrees with you as the enemy. Then you explain how they're systematically working to destroy everything you hold dear. It's a war of values! Rational discussion is hopeless! Compromise is unthinkable! Our only hope is well-funded antagonism, so we need your money to keep up the fight! How cynically unconstructive. Enmity sells.
    description: Calvin is writing a fund-raising letter.  He tells Hobbes the secret is to depict everyone who disagrees with you as the enemy.  You explain how they're destroying everything you hold dear.  It's a war of values.  Rational discussion is hopeless.  We need your money to keep up the fight.  Hobbes says that's cynically unconstructive.  Calvin informs him that enmity sells.
    characters: [calvin, hobbes]
  "19950708":
    transcript: Happiness 10¢. What do you give people for their ten cents? A water balloon in the kisser! You take their money and then soak them with a water balloon?? Right. Whose happiness are we talking about? Who went to all this trouble?!
    description: Calvin sits at a box marked that happiness is for sale for ten cents.  Hobbes asks what Calvin gives people for their ten cents.  Calvin says he gives a water balloon right in the kisser.  Hobbes clarifies that Calvin takes their money, then hits them with a water balloon.  He asks whose happiness they're talking about.  Calvin asks who went to all the trouble.
    characters: [calvin, hobbes]
  "19950709":
    transcript: I ordered the two tons of tenderloin... Oh yes, drive around to the loading dock and I'll get the forklift. Calvn, lunchtime! Mayonnaise?! I like mustard! Maybe you should fix your own triceratops sandwich.
    description: Mom picks up the two tons of tenderloin from the butcher.  She stands with a chainsaw in her hand, calling Calvin for lunch.  A tyrannosaurus stands behind Mom saying he likes mustard, not mayonnaise.  Mom says maybe he should fix his own triceratops sandwich.
    characters: [calvin, mom]
    source: miraheze
  "19950710":
    transcript: How tall are you?
    description: Sitting on a tree branch, Calvin ties a water balloon to a string.  He drops it so it hangs down.  He thinks, then runs inside the house.  He asks Dad how tall he is.
    characters: [calvin, dad]
  "19950711":
    transcript: OK, the map says to turn left at this tree and walk 30 paces. ...29 ...30. What's here? My map shows a big hole. Wouldn't it be faster to make the MAP to conform to the YARD? Are you in some sort of hurry?
    description: Calvin is dressed like an explorer.  He tells Hobbes the map says to turn left at the tree and walk thirty paces.  They do, and Hobbes asks what's there.  Calvin says the map shows a big hole.  They start digging, and Hobbes asks if it wouldn't be faster to make the map conform to the yard.  Calvin asks if he's in a big hurry.
    characters: [calvin, hobbes]
  "19950712":
    transcript: YOU THINK YOU'RE SO DARN SMART!
    description: Susie gets her raincoat and hat on.  She gets her umbrella, opens it, and walks along.  Behind a tree with several water balloons, Calvin yells to Susie.  He asks her if she thinks she's so darn smart.
    characters: [calvin, susie]
  "19950713":
    transcript: Art isn't about ideas. It's about style. The most crucial career decision is picking a good "ism" so everyone knows how to categorize you without understanding your work. You do goofy drawings on the sidewalk. Right. I'm a suburban post-modernist. Aren't we all. I was going to be a neo-deconstructivist but Mom wouldn't let me.
    description: Calvin tells Hobbes art isn't about ideas, it's about style.  Calvin says the most crucial career decision is to pick a good "ism" so everyone knows how to categorize you without understanding the work.  Hobbes says Calvin does goofy drawings on the sidewalk.  Calvin says he's a suburban post-modernist.  He says he was going to be a neo-deconstructivist, but Mom wouldn't let him.
    characters: [calvin, hobbes]
  "19950714":
    transcript: Times are tough for us suburban post-modernists. How so? Well, people seem to be reluctant to pay for sidewalk drawings that stay where they are and wash away in the rain. And nowadays, nobody wants tax money to support art, and corporates won't underwrite me because I'm not famous enough to advertise their cultural enlightenment. Couldn't you support your art with another job? What, you mean WORK?
    description: Calvin complains that life is tough for suburban post-modernists.  People seem reluctant to pay for drawings that wash away in the rain.  Nobody wants tax money to support art.  Corporations won't underwrite him because he's not famous enough.  Hobbes asks if he could support his art with another job.  Calvin is indignant that Hobbes would suggest work.
    characters: [calvin, hobbes]
  "19950715":
    transcript: People always make the mistake of thinking art is created for them. But really, art is a private language for sophisticates to congratulate themselves on their superiority to the rest of the world. As my artist's statement explains, my work is utterly incomprehensible, and is therefore full of deep significance. You misspelled "Weltanschauung". A good artist's statement says more than his art ever does.
    description: As Calvin draws on the sidewalk, he tells Hobbes people make the mistake of thinking art is created for them.  He says art is a private language for sophisticates to congratulate themselves on their superiority to the rest of the world.  He hands Hobbes an artist's statement.  It explains his work is incomprehensible and therefore full of deep significance.
    characters: [calvin, hobbes]
  "19950716":
    transcript: Look, a snake! A big one! Do you think it's poisonous? Beats me. How can you tell? If it bites you and you die, it's poisonous. Har har. Look how it glides along. It's almost like a liquid. I wonder how they do that. He's flicking his tongue out. I think that's how they smell, but why would they smell with a tongue? Do snakes have eyelids? Do they sleep with their eyes open? Don't snakes eat mice? How could a snake swallow something bigger than it's own head? Heck, we don't know anything about snakes. Maybe your Mom would get us a book. Yeah, let's go see! We'll be experts! We'll learn all there is to know! Hey, wait a minute! It's summer! I'm on vacation! I don't want to learn anything! If nobody makes you do it, it counts as fun. Hmm..you really think so?? Calvin/ Coooooollll.
    description: Calvin and Hobbes see a snake.  Hobbes asks if it's poisonous.  Calvin wonders how you know.  Hobbes suggests that if it bites you and you die, it's poisonous.  They watch it move along, wondering how it glides.  Calvin sees it flicking its tongue and wonders why they smell with their tongue.  Hobbes asks if they have eyelids.  Calvin wonders how it swallows something bigger than its own head.  Hobbes says that Mom might get them a book so they'd know the answers.  As they run to the house, Calvin stops.  It's summer, and he's on vacation.  He doesn't want to learn anything.  Hobbes says if nobody makes him do it, it counts as fun.  With that, Calvin and Hobbes get a book and learn about snakes.
    characters: [calvin, hobbes]
    source: miraheze
  "19950717":
    transcript: Nothing is permanent. Everything changes. That's the one thing we know for sure in this world. But I'm still going to gripe about it.
    description: Rolling down the hill in the wagon, Calvin tells Hobbes that nothing is permanent.  Everything changes.  That's one thing they know for sure in this world.  He continues saying he's still going to gripe about it.
    characters: [calvin, hobbes]
  "19950718":
    transcript: PLOOSH. How can something seem so plausible at the same time so idiotic in retrospect?
    description: Calvin tosses a water balloon into the air and runs to catch it.  PLOOSH!  Calvin's covered with water.  He walks away asking how something seems so plausible at the time and so idiotic in retrospect.
    characters: [calvin]
  "19950719":
    transcript: I refuse to take out the garbage! I have the right to do whatever I want all the time! No you don't. I don't? Well it sure OUGHT to be a right.
    description: Calvin refuses to take out the garbage.  He says he has the right to do whatever he wants, all the time.  Dad says he doesn't.  As Calvin drags the garbage bag outside, he says it sure ought to be a right.
    characters: [calvin, dad]
  "19950720":
    transcript: BU-UURRPPP. THPTHH! PHTBT! THBBPPTT! BU-UURRRPP. What are you doing? I'm hoping there's a mockingbird around.
    description: Calvin belches.  He blows on his hands to make a bodily sound.  He burps again.  Hobbes asks what he's doing.  Calvin cheerfully says he's hoping there's a mockingbird around.
    characters: [calvin, hobbes]
  "19950721":
    transcript: RRIINGG RRINGG. Hello? No, my Dad's not here right now. Will I take a message? I don't know - what's in it for ME? People always assume you're some kind of altruist.
    description: Calvin answers the phone.  He tells the caller that Dad isn't there right now.  When asked if he'd take a message, Calvin asks what's in it for him.  As he walks off, he says people always assume you're some kind of altruist.
    characters: [calvin]
  "19950722":
    transcript: Oh, just so you know... I am the downhill tumble and roll champ, king of the toad finders, captain of the high altutude tree branch vista club, second place finisher in the 'round the yard backward dash, premier burper state division, sodbuster and worm scout first order, and generalissimo of the mud ad mayhem society! Busy day? About usual. Want to hear what Hobbes is?
    description: Calvin tells Dad that he's the downhill tumble and roll champ, king of the toad finders, premier burper, sodbuster and worm scout first order, and generalissimo of the mud and mayhem society.  Dad asks if it was a busy day.  Calvin says it was about usual and asks if Dad wants to know what Hobbes is.
    characters: [calvin, dad]
  "19950723":
    transcript: "... H-hott ... SSSSS. SSSSS. SSSSS. AHHHH. ... Not again ..."
    description: Calvin slowly walks in the heat.  He starts to melt.  Finally, he is a puddle of water.  The puddle evaporates in the heat.  The evaporation creates a cloud that starts raining.  Calvin is revitalized and runs off naked.  Mom finds his clothes on the sidewalk and says "not again".
    characters: [calvin, mom]
  "19950724":
    transcript: People ask why we tolerate a popular culture that celebrates violence and depravity. Because it's entertaining, that's why! If warped values are the price of a vicarious thrill, so be it! Let the business respond to consumer demand! The customer is always right. Shock and titillate me! I've got money!
    description: As Calvin watches television, he tells Hobbes people ask why they tolerate a culture that celebrates violence.  He says it's because it's entertaining.  He goes on to say that if warped values are the price of a vicarious thrill, so be it.  The business should respond to customer demand.  Hobbes says that the customer is always right.  Calvin calls for them to shock and titillate him, he's got money.
    characters: [calvin, hobbes]
  "19950725":
    transcript: Popular culture isn't to blame for selling twisted values. Movies, records, and TV shows reflect the reality of our times. Artists depict hatred and violence because that's what they see. Why don't they see things of beauty and value? Because boring stuff doesn't sell. Such vision and integrity. There's nothing like a good gunfight to uplift the spirit.
    description: Calvin says popular culture isn't responsible for selling twisted values.  He says movies and television reflect the reality of their times.  Artists depict hatred and violence because that's what they see.  Hobbes asks why they don't see things of beauty and value.  Calvin informs him that boring stuff doesn't sell.  Hobbes rolls his eyes and says that shows such vision and integrity.  Calvin says that there's nothing like a good gunfight to uplift the spirit.
    characters: [calvin, hobbes]
  "19950726":
    transcript: Another thing to remember about popular culture is that today's TV-reared audience is hip and sophisticated. This stuff doesn't affect us. We can separate fact from fiction. We understand satire and irony. We're detached and jaded viewers who aren't influenced by what we watch. I think I hear advertisers laughing. Hold on, I need to inflate my basketball shoes.
    description: Calvin informs Hobbes that since today's audience is so hip and sophisticated, they aren't affected by culture.  They can separate fact from fiction.  They're detached and jaded viewers not influenced by what they watch.  Hobbes holds his ear and says he thinks he hears advertisers laughing.  Calvin has to inflate his basketball shoes.
    characters: [calvin, hobbes]
  "19950727":
    transcript: Onward came the meteors!
    description: Calvin builds a city in the sandbox.  He leaves and picks up some large rocks.  He stands on the edge of the sandbox, saying the meteors are coming.
    characters: [calvin]
  "19950728":
    transcript: Bugs get on my nerves! The dizzy way they zip around, the high-pitched noise they make, their pesky size... everything about them is annoying! ... said the hyperactive, whiny, small child.
    description: Calvin tells Hobbes that bugs get on his nerves.  He says the way they zip around, their high-pitched noise, their pesky size, everything about them is annoying.  Hobbes rolls his eyes and says "said the hyperactive, whiny, small child".  Angrily, Calvin chases Hobbes.
    characters: [calvin, hobbes]
  "19950729":
    transcript: I want you to pick up your room today, OK? Do I get paid? No. If I don't get paid, how do I know it's important?! You can trust a monther on that.
    description: Mom tells Calvin she'd like him to pick up his room.  Calvin asks if he'll get paid.  Mom says no.  Calvin asks how he knows it's important if he doesn't get paid.  Mom clarifies that you can trust a mother on that.
    characters: [calvin, mom]
  "19950730":
    transcript: We all want meaningful lives. We look for meaning in everything we do. But suppose there is no meaning! Suppose life is fundamentally absurd! Suppose there's no reason or truth or rightness in anything! What is nothing means anything? What if nothing really matters? I guess there's no harm in a little wishful thinking. Or suppose everything matters. which would be worse??
    description: Going down the hill in the sled, Calvin says they all want to live meaningful lives.  They look for meaning in everything they do.  He asks Hobbes to suppose there is no meaning, that life is fundamentally absurd.  He asks Hobbes to suppose there's no reason, truth, or rightness in anything.  As they sail off the edge of the hill into the air, he asks Hobbes what if nothing really matters.  Hobbes covers his eyes and says there's no harm in a little wishful thinking.  Tumbling through the air, Calvin ponders whether it would be worse if everything mattered.
    characters: [calvin, hobbes]
    source: miraheze
  "19950731":
    transcript: MY water balloon is round and aerodynamic for grim accuracy and certain soaking! YOUR water balloon is long and floppy, impossible to throw the slightest distance! The advantage is clearly mine! Do you surrender?
    description: Calvin shows Hobbes that his water balloon is round and aerodynamic for grim accuracy and certain soaking.  He tells Hobbes that his water balloon is long and floppy, impossible to throw accurately.  He says the advantage is his and asks Hobbes if he surrenders.  Hobbes unties the end of his water balloon and shoots the water at Calvin.
    characters: [calvin, hobbes]
  "19950801":
    transcript: Hey, there's no butter in the butter dish! My toast will get cold while I get another stick from the fridge! HAVEN'T I SUFFERED ENOUGH?? WHERE WILL IT ALL END?!? Mr. and Mrs. Empathy.
    description: Spreading butter on his toast, Calvin notices there is no butter on the dish.  He says his toast will get cold while he gets another stick from the refrigerator.  He complains that he's suffered enough.  He asks where it will all end.  As he walks by, he sees Mom and Dad looking at him.  Calvin calls them Mr. and Mrs. Empathy.
    characters: [calvin, mom, dad]
  "19950802":
    transcript: I'm glad you're getting some exercise. Keep that heart rate up. Dad can take the fun out of ANYthing.
    description: Calvin jumps through the sprinkler.  Dad tells him that he's glad he's getting some exercise.  He tells Calvin to keep his heart rate up.  Calvin says Dad can take the fun out of anything.
    characters: [calvin, dad]
  "19950803":
    transcript: I have a hammer! I can put things together! I can knock things apart! I can alter my environment at will and make an incredible din all the while! Ah, it's great to be male!
    description: Calvin has a hammer.  He can put things together or knock them apart.  He can alter his environment at will and make a din all the while.  He says it's great to be a male.
    characters: [calvin]
  "19950804":
