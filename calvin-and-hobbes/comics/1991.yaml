  "19930912":
    transcript: Today at school, I tried to decide whether to cheat on my test or not. I wondered, is it better to do the right thing and fail... or is it better to do the wrong thing and succeed! On the one hand, underserved success gives no satisfaction... but on the other hand, well-deserved failure gives no satisfaction either. Of course, most everybody cheats some time or other. People always bend the rules if they think they can get away with it. ...then again, that doesn't justify MY cheating. Then I thought, look, cheating on one little test isn't such a big deal. It doesn't hurt anyone. ...but then I wondered if I was just rationalizing my unwillingness to accept the consequence of my not studying. Still, in the real world, people care about success, not principles. ...then again, maybe that's why the world is in such a mess. What a dilemma! So what did you decide? Nothing. I ran out of time and had to turn in a blank paper. Anymore, simply acknowledging the issue is a moral victory. Well, it just seemed wrong to cheat on an ethics test.
    description: Calvin tells Hobbes he tried to decide whether to cheat on his test or not.  He wonders whether it's better to do the right thing and fail or the wrong thing and succeed.  He argues that undeserved success gives no satisfaction, while well-deserved failure gives none either.  Just because most everybody cheats doesn't justify his cheating.  He wondered if he was trying to rationalize his unwillingness to accept the consequences of not studying.  In the real world, people care about success, not principles.  Hobbes asks what he decided.  Calvin says nothing.  He ran out of time and had to turn in a blank paper.  Hobbes says that acknowledging the issue is a moral victory.  Calvin says it seemed wrong to cheat on an ethics test.
    characters: [calvin, hobbes]
    source: s-anand+seligman
    review: "verified: checked against a source outside the corpus by the maintainer"
  "19930913":
    transcript: What a day. I feel like I've been run over by a train. KAPOW! I mean, NOW I feel like that. See? You should always save hyperbole until you really need it.
    description: Calvin opens he door, saying he feels like he's been run over by a train.  Hobbes pounces on him.  As he lies on the ground, he says now he feels like that.  Hobbes brushes himself off and says you should save some hyperbole until you really need it.
