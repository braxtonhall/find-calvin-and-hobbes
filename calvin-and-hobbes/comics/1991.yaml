  "19931020":
    transcript: Everybody seeks happiness! Not ME, though! That's the difference between me and the rest of the world! Happiness isn't good enough for me! I demand euphoria! The problem with you, Hobbes, is you're always at a loss for words. I've found that saves many a friendship.
