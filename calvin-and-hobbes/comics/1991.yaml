  "19950215":
    transcript: Graphic violence in the media. Does it glamorize violence? Sure. Does it desensitize us to violence? Of course. Does it help us tolerate violence? You bet. Does it stunt our empathy for our fellow beings? Heck yes. Does it CAUSE violence? ... well that's hard to prove. The trick is to ask the right question.
