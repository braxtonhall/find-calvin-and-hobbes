    transcript: ""
    description: Calvin has a bat and tosses a baseball into the air.  As it falls, he swings and misses.  He walks off.  He returns with a beachball.
    characters: [calvin]
  "19910421":
    transcript: BLUCK SCHLOOP BLIP BLORK They must've taken out an insurance policy on me. ...sighhh... ...sighhh...
    description: A pile of green dinner plops onto Calvin's plate.  Calvin says his parents must've taken out an insurance policy on him.  He sighs.  He starts to shape it.  He adds some lettuce and some cereal.  He keeps working on it.  He turns it around and makes a face.  The food is shaped into a monster, with cereal teeth and lettuce hair, that seems to bite Calvin.  Dad stares at Calvin.  Calvin sighs and looks at his pile of green dinner on his plate.
    characters: [calvin, dad]
