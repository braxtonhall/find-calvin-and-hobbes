  "19940211":
    transcript: "Test: 1. What important event took place on December 16, 1773? I do not believe in linear time. There is no past and future: all is one, and existence in the temporal sense is illusory. This question, therefore, is meaningless and impossible to answer. When in doubt, deny all terms and definitions."
