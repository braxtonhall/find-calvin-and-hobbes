    requiresBookReview: true
  "19950419":
    transcript: Ah! I got the letter I wrote to myself! What did you write? "Dear Calvin, Hi! I'm writing this on Monday. What day is it now? How are things going? Your pal, Calvin." My past self is corresponding with my future self. Too bad you can't write back.
    description: Out of the mailbox, Calvin gets a letter he wrote to himself.  He reads it to Hobbes.  It asks what day it is, since he's writing it on Monday.  Calvin says his past self is corresponding with his future self.  Hobbes says it's too bad he can't write back.
    characters: [calvin, hobbes]
  "19950420":
    transcript: I got another letter from my past self. What's it say? "Dear future Calvin, I wrote this several days before you will receive it. You've done things I haven't done. You've seen things I haven't seen. You know things I don't know. You lucky dog! Your pal, Calvin." Sniff. I feel so sorry for myself two days ago. Poor him. He wasn't you.
    description: Calvin got another letter from his past self.  The note reads that the future Calvin has done things the past Calvin hadn't yet done.  He calls the future Calvin a lucky dog.  Calvin feels sorry for himself two days ago.
    characters: [calvin, hobbes]
  "19950421":
    transcript: I think I should stay home from school. I've got a sore throat, an ear ache, a stomach ache, I'm seeing spots, and I'm dizzy. I'll call the doctor. Hold on, I think it's all clearing up! Yes. I think I'm better now. It's pretty hard to hit that magic number of appropriately vague, mildly serious, but not quite worrisome symptoms.
    description: In bed, Calvin tells Mom he has a sore throat, ear ache, is seeing spots, and is dizzy.  Mom offers to call the doctor.  Calvin gets out of bed, saying it's all clearing up.  While he gets dressed, he says it's hard to hit the magic number of vague, mildly serious, but not worrisome symptoms.
