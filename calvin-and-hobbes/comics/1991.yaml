  "19950228":
    transcript: What happened in Concord in 1775? Le'ts be honest. You're asking me about Concord? I rely on the bus driver to find my own house from here. Concord could be on Neptune for all I know. And what happened 220 years ago?? I'm a kid. I don't know what's going on NOW. I don't have a shred of context for any of this. It's hopeless, Miss Wormwood, hopeless. We both try to demoralize each other.
