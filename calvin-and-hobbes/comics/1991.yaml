  "19920629":
    transcript: Susie, stay right there! I want to show you something. It's a surprise, so close your eyes. I'll be right back. Don't move. Oh, cover your nose so you don't smell anything, OK? That's real important. And all your clothes are washable, right? Doggone it, nobody's going to be her friend if she won't TRUST anyone.
