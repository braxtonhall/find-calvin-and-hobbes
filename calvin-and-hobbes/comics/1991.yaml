  "19950403":
    transcript: Any monsters under my bed tonight? Maybe, maybe not. You mean, "definitely yes"? We didn't say that. "WE"? I mean, "I". ..uh.. that is, if there were any of me. Shut up, Winslow. Luckily for me, monsters don't think clearly when they're hungry.
    description: Calvin asks if there are any monsters under his bed tonight.  A voice comes out from below the bed, saying maybe, maybe not.  Calvin asks if they mean "definitely yes".  The voice says they didn't say that.  Calvin asks if he just heard "we".  The voice clarifies "I".  It goes on to say "if there were any of me".  Another voice says "shut up, Winslow".  Calvin says luckily for him, monsters don't think clearly when they're hungry.
    characters: [calvin, mom, wormwood]
    review: "settled: our transcript and description corroborate each other at 0.67; seligman's nine words are a different exchange"
  "19950404":
    transcript: We don't value craftsmanship any more! All we value is ruthless efficiency, and I say we deny our own humanity that way! Without an appreciation for grace and beauty, there's no pleasure in having them! Our lives are made drearier, rather than richer! How can a person take pride in his work when skill and care are considered luxuries! We're not machines! We have a human need for craftsmanship! You had two days to write that paper. Two days?! Two days is NOTHING!
    description: Calvin decries they don't value craftsmanship anymore.  He says ruthless efficiency denies their own humanity.  He says there's no pleasure in creating things, if there is no appreciation for grace and beauty.  He asks how a person can take pride in his work when skill and care are considered luxuries.  Miss Wormwood tells Calvin he had two days to write that paper.  He claims that's nothing.
    characters: [calvin, wormwood]
    source: s-anand
    review: "settled: a source dates a different strip here; the original text was restored on the maintainer's check"
  "19950405":
    transcript: It's hard to know what's important in life. We don't notice the small stuff and we're never prepared for the big stuff. What about the stuf in between? That stuff's boring. Let's hope bumbling along without a clue is important. According to the ads, fresh breath and dry armpits are crucial.\
    description: Calvin says it's hard to know what's important in life.  They don't notice the small print, and they're never prepared for the big stuff.  Hobbes asks what about the stuff in between.  Calvin says that's boring.  Hobbes says they should hope bumbling along without a clue is important.  Calvin says that according to the ads, fresh breath and dry armpits are crucial.
    characters: [calvin, hobbes]
    review: "checked against the strip: the image is a copy of 19950408's strip, so the real 4/5 strip is missing from assets and this text is unverified"
  "19950406":
    transcript: Can I get a drink of water? All right, but hurry up. What are YOU doing home?! I prefer OUR water.
    description: Calvin asks his teacher if he can get a drink of water.  She says it's alright, but he should hurry.  Calvin runs down the hallway.  Mom opens the door and asks Calvin why he's home.  Calvin tells her he prefers their water.
    characters: [calvin, mom, wormwood]
  "19950407":
    transcript: This bad grade is lowering my self-esteem! Then you should work harder so you don't get bad grades. Your denial of my victimhood is lowering my self-esteem!
    description: Calvin says the bad grade he got is lowering his self-esteem.  Miss Wormwood says he should work harder so he doesn't get bad grades.  Calvin claims her denial of his victimhood is lowering his self-esteem.
    characters: [calvin, wormwood]
  "19950408":
    transcript: I'm the decisive, take-charge type! I'm a natural leader! See, we'll go THIS way! Have fun. The problem is that nobody wants to go where I want to lead them.
    description: Calvin tells Hobbes he's a decisive, take-charge type.  He says they'll go the way he is pointing.  Hobbes goes the other way and tells him to have fun.  Crawling through brush and mud, Calvin says the problem is that nobody wants to go where he wants to lead them.
    characters: [calvin, hobbes]
  "19950409":
    transcript: Get going or you'll miss the school bus. Uh... greetings. My name is Calvin. POOF. Grittings. Ma name is Kahlfin. Grittings. Ma nam is Kahlfin. Um... yes! Well Calvin, here's your lunchbox. Have a good day at school. Hoffa gud tay. Lunboks. Hi Calvin. Grittings. Ma nam is Kahlfin. Heeryor lunkboks. Hoffa gut tay askool. Calvin's principal says to say hello. Huh boy. It troo! Dat darn Kahlfun stole ma spacechip!
    description: On the way to the school bus, Calvin sees an alien appear in a spaceship.  He introduces himself to the alien.  The alien makes himself look just like Calvin and speaks in phonetic English.  Calvin tells the alien to take his lunchbox and to have a good day at school.  Susie says hello to the alien Calvin.  He repeats what Calvin said about having a good day at school.  Later, Mom opens the door for Dad saying that Calvin's principal said to say hello.  Dad knows that means there was trouble.  Calvin, still speaking in phonetic English, says Calvin stole his spaceship.
    characters: [calvin, mom, dad, susie]
    source: s-anand+seligman+miraheze
  "19950410":
    transcript: What was the significance of the Erie Canal? In the cosmic sense, probably nil. We "big picture" people rarely become historians.
    description: Calvin looks at a test question asking the significance of the Erie Canal.  Calvin replies that "In the cosmic sense, probably nil".  He says "big picture" people like him rarely become historians.
    characters: [calvin]
  "19950411":
    transcript: Remember when I was first born? I couldn't even turn myself over! My eyes wouldn't focus! I couldn't do anything! Think of all the work it took to develop the motor skills necessary to hold a crayon, top place the tip of it on a page, and to move it in predetermined, coordinated motions! This picture is the result of six years' unrelenting toil! A lifetime of effort went into this! I'm still not paying you $500 for it. It will appreciate! It's an investment!
    description: Calvin asks Dad to remember when he was first born.  He couldn't turn himself over.  He asks Dad to think of all the motor skills necessary to hold a crayon and move it in predetermined, coordinated motions.  He shows a picture of a dinosaur and indicates that is the result of six years' unrelenting effort.  Dad says he's not paying $500 for it.  Calvin implores that it will appreciate.  It's an investment.
    characters: [calvin, dad]
  "19950412":
    transcript: Calvin? Calvin! CALVIN! AAUGH! Sorry. My eyes were on screen saver.
    description: Calvin is sitting at his desk with his eyes closed.  Miss Wormwood calls on him.  She calls again.  Still no answer, nor any eyes opened.  She puts her hands on his desk and calls his name again, loudly.  Calvin is startled awake.  He tells Miss Wormwood his eyes were on screen saver.
    characters: [calvin, wormwood]
  "19950413":
    transcript: Right here! Put it here! AAAA! Let's work on your underhand pitches. If you keep running away like that, you won't catch any fouls.
    description: Calvin has a baseball glove and calls for the ball.  A train comes toward Calvin.  Lying on his back with the baseball next to him, Calvin tells Hobbes they'll work on his underhand pitches.  Hobbes says if Calvin keeps running like that, he won't catch any fouls.
    characters: [calvin, hobbes]
  "19950414":
    transcript: Calvin, are you chewing gum in class? Yeth. Do you have enough to share with everybody? Probably. But do you really think they'd want it?? It was HER idea...
    description: Miss Wormwood asks if Calvin is chewing gum.  He mumbles a reply that he is.  She asks if he has enough to share with everybody.  Calvin takes a giant wad of gum out of his mouth.  He says he probably does, but he asks if she really thinks they want it.  In the principal's office, Calvin pleads that it was her idea.
    characters: [calvin, wormwood, spittle]
  "19950415":
    transcript: Ahem. Hi. What's the point of wearing your favorite rocketship underpants if nobody ever asks to see 'em?
    description: Calvin jauntily walks along.  He smiles and poses for Mom.  She walks by.  Grumpily, Calvin continues walking.  He asks the point of wearing your favorite rocketship underpants if nobody ever asks to see them.
    characters: [calvin, mom]
  "19950416":
    transcript: Ah, what a lovely day to go sailing, eh Marsha? Our new boat is just wonderful, Bradley. What do you say we drop anchor and go for a swim, dearest? That sounds delightful, darling! Let's go! Ploosh ploosh. AAA!! AAA!! This lake is boiling hot! We're getting scalded!! Get out of the water! AA! OW! AA! OW! I've got second degree burns all over! What kind of lake IS this?! We need medical attention, Bradley! Pull up the anchor! Bradley, we're going the wrong way! I can't help it, Marsha! The wind is blowing us over here, toward the... the... THE WATERFALL! OH NO! AAAAA! BLUB BLUB! AAAA! GLUB GLUB GLUB! Help, help! The wind is picking up again! Hang on! We're flying right out of the water! Don't look don, Marsh! We're miles high! Uh oh! The wind suddenly stopped!! AAAAaaaaaaaa. We ... we're alive! Somehow we landed in another lake! But where ARE we?? I have a bad feeling about this, Bradley. IT'S A GIGANTIC WHIRLPOOL!! WE'RE GOING DOWN! WAAAAAA!! Here's the problem. That'll be $150. Somebody ELSE is going to pay for this too.
    description: In the bathtub, Calvin is playing with a sailboat.  He pretends the man and woman on the boat stop for a swim.  Suddenly, the lake is boiling hot.  They get out of the water.  The couple pulls up anchor, but the boat heads toward.....the waterfall.  Calvin turns on the faucet and swamps the boat.  The wind picks up, and Calvin gets out of the tub with the sailboat.  The wind suddenly stops, and Calvin drops the boat into the toilet.  One of the couple says they've somehow landed in another lake.  It's a gigantic whirlpool.  Calvin flushes the toilet, and down the boat goes.  Later, a plumber hands Dad the sailboat.  Dad gets charged $150.  While he writes the check, Dad angrily says somebody else is going to pay for this, too.
    characters: [calvin, dad]
    source: s-anand+seligman+miraheze
  "19950417":
    transcript: Let's draw the line at the umbrella.
    description: Calvin is taking a bath.  He has a pail, ball, duck, sailboat, swim mask, and an umbrella.  The shower is running.  Mom looks in and says they should draw the line at the umbrella.
    characters: [calvin, mom]
