  "19920826":
    transcript: Call me Calvin. actually, make that "Calvin, Boy Genius, Hope of Mankind." ... or "Doctor Destiny" for short. (That's "Doctor Destiny, Sir" to you.) My journal is off to a good start.
    description: Calvin starts his journal by calling himself a boy genius, hope of mankind.  He adds he could be called Doctor Destiny, sir.  He says his journal is off to a good start.
