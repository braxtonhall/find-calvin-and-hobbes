  "19920827":
    transcript: I wish my shirt had a logo or a product on it. A good shirt turns the wearer into a walking corporate billboard! It says to the world, "My identity is so wrapped up in what I buy that I paid the COMPANY to advertise its products!" You'd admit that? Oh sure, endorsing products is the American way to express individuality.
