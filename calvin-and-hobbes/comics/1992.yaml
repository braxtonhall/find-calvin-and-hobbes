  "19921102":
    transcript: Here, Calvin, you got a letter in the mail. I did?? Gosh, I never get mail! I wonder who sent this. There's no return address! In its place there's a crude human skull with X's for eyes and its tongue hanging out. Maybe it's the IRS.
