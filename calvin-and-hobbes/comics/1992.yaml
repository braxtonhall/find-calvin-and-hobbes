  "19920818":
    transcript: Goodness, you look tired. The monsters under my bed kept me up all night. But I checked for monsters when I tucked you in... and there weren't any. I know. Then how did they get there after I left? YOU WANT ME TO CRAWL UNDER AND ASK THEM?!
    description: Calvin tells Mom the monsters under his bed kept him up all night.  She says she checked when she tucked him in, and there weren't any.  Calvin knows.  She asks how they got there after she left.  Calvin asks if she wants him to crawl under and ask them.
    characters: [calvin, mom]
  "19920819":
    transcript: Mom wants me to try an experiment tonight. She says the monsters under my bed may need me to THINK about them to exist. Her theory is that if I just don't think about them, they'll go away. ...of course, that idea of being dragged under the bed and devoured by monsters has a way of gripping the mind. And it's not like Mom and Dad go away when I stop thinking about THEM.
    description: In bed, Calvin says Mom wants him to try an experiment.  Mom's theory is that if Calvin doesn't think about them will make them go away.  Hobbes offers that the idea of being dragged under the bed and devoured by monsters has a way of gripping the mind.  Calvin adds that Mom and Dad don't go away when he stops thinking about them.
    characters: [calvin, hobbes]
  "19920820":
    transcript: Attention all monster! I am now going to stop thinking about you! MOMMMM! Admit it, you LIED to us!
    description: Calvin tells the monsters he's going to stop thinking about them.  He looks over to see eyes and long claws looming over the bed.  Calvin turns the light on and yells for Mom.  A voice under the bed tells Calvin to admit it, he lied to them.
