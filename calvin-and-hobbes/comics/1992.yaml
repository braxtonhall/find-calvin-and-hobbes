  "19920901":
    transcript: Hey Dad, know what I figured out? The meaning of words isn't a fixed thing! Any word can mean anything! By giving words new meanings, ordinary English can become an exclusionary code! Two generations can be divided by the same language! To that end, I'll be inventing some new definitions for common words. So we'll be unable to communicate. Don't you think that's totally spam? It's lubricated! Well, I'm phasing. Marvy. Fab. Far our.
