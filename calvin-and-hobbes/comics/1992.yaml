  "19920728":
    transcript: I have a question, Dad. Sure. Which exactly are the halcyon days of my youth? Is Saturday one? I believe they are awarded retroactively when you're grown up. You can't identify them until THEN? Calcyonity is relative. I'll go ask Mom.
