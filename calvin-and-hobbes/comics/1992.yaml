  "19920814":
    transcript: Run for your life! There's a million angry hornets coming! They're insane with rage! They'll sting anyone in their path! Lousy bugs! What are they made about? I've been throwing rocks at their nest all morning. A REAL FRIEND WOULDN'T TAKE THEIR SIDE!!
