  "19921113":
    transcript: So it was YOU the whole time! YOU'RE the one who's been sending me insults in the mail!! I'll get you for this! You and your sneaky codes and pasted letters and skull drawings! ... although, really, the skull drawings were pretty cool. You can tell a good spy by his ominous logo.
