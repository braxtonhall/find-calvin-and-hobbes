  "19920729":
    transcript: It's too hot to sleep with you in the bed. You're blocking the breeze and you take up too much room! Opening the window more isn't going to help! The problem is your big, hot, furry body! Hey! Leggo! I didn't mean it! No! I'm comfortable! Reall! And Mom can't imagine how my pajamas get so gritty.
