  "19921114":
    transcript: "You and I are through! I'll teach you to trick me, you big hairball! You just have no sense of humor! I do too! It's just that was a terrible, nasty, awful thing to do, and I'll never forgiv... huh? Heyyyy, you're right! It IS funny! Ha ha ha! ... OK! We're pals again! SUSIE: you smell! Ha ha!"
