    characters: [calvin, hobbes]
  "19920829":
    transcript: We've got to get cable TV, Dad. No, we don't. But people across the country are watching different TV shows than we are! If we don't all watch the same TV, what will keep our culture homogeneous? We can't rely on monolithic natworks to provide uniform national blandness anymore! There's still McDonald's and Wal-Mart. But they don't come into our HOMES!
    description: Calvin tells Dad they need to get cable TV.  He says people across the country watch different TV shows than they are.  He asks what will keep their culture homogeneous if they don't watch the same TV.  Dad suggests there's still McDonald's and Wal-mart.  Calvin complains they don't come into their homes.
