    characters: [calvin, hobbes]
  "19920723":
    transcript: Whoa, Dad! Don't miss your bus! Leggo!
    description: Calvin peeks around the corner of the house.  He sees something and gets excited.  He turns on the outside water spigot.  The hose has been wrapped around a tree, with the nozzle up in the tree.  Below the spraying water lie Dad's briefcase and papers.  Off panel, Calvin is saying for Dad not to miss his bus and to let him go.
