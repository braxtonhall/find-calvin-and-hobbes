  "19920830":
    transcript: The fearless Spaceman Spiff flies low over an uncharted planet! Suddenly, the alien-indicator light flashes! The bizarrotron shows a 3.7 weirdness level! Our hero hits the decelerator! Watching for the alien, Spiff reflects that weirdness is nature's way of adapting life to its environment. Species are endlessly inventive in their will to survive! Zounds!! There it is! What horrible circumstances of evolution would conspire to make a creature so profoundly ugly? Our hero moves in for further examination of its hideousness! What are you looking at?! Get away from me! According to Spiffs field guide, the creature is a gurl! Spiff makes a note that the bizarrotron has been reading a bit low lately. Weirdo!
    description: Spaceman Spiff flies over an uncharted planet and notices an alien.  Spiff reflects that weirdness is nature's way of adapting life to its environment.  He sees the monster.  He wonders what circumstances of evolution made a creature so ugly.  Calvin is staring at Susie.  She tells him to get away from her.  Spiff's field guide says the creature is a "gurl".
