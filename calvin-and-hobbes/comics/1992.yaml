  "19920821":
    transcript: As soon as we turn the lights off, the monsters will come back out from under the bed. They're not going to go away, so I guess we need to find some way to live with them. It's hard to co-exist with things that want to kill you. Well we've got to do SOMETHING. We are. We're staying awake all night with the lights on. I wonder if we could set fire to the bed without burning the house down.
    description: Calvin tells Hobbes that they monsters will come out when they turn the lights off.  He wants to figures out some way to live with them.  Hobbes says it's hard to coexist with things that want to kill you.  Calvin says they have to do something.  Hobbes says they are.  They're staying awake all night with the lights on.
    characters: [calvin, hobbes]
  "19920822":
    transcript: Whoo! It smells awful in here! Why does your room stink? It's because of the darn monsters under my bed! Calvin, I don't believe for a minute that your nighttime "monsters" are causing this smell. But it's true. See? They don't eat all the garbage we throw down there to keep 'em quiet.
    description: Mom asks Calvin why his room stinks.  He says it's because of the monsters under the bed.  Mom doesn't believe the monsters are causing the smell.  She reaches under the bed and comes out with some cans, bones, and a banana peel.  Calvin says the monsters don't eat all the garbage they throw down there to quiet them.
