  "19920831":
    transcript: Where do the candidates stand on dinosaur research?! That's what I want to know! Which party has the pro-paleontology platform plank? They can't ignore the dinosaur vote! If nobody panders to us, we'll throw the election! We'll stay home! We're disaffected, disenfranchised and discombobulated! We single-issue activities like to have our "hot buttons" pushed.
