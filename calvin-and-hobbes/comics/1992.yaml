  "19921123":
    transcript: Can I learn to parachute out of an airplane? Why don't you just play "chicken" on the railroad tracks? It would be a cheaper way to toy with death, I'm sure. Mom's so practical.
    description: Calvin asks Mom if he can parachute out of a plane.  Mom wonders why he doesn't play "chicken" on the railroad tracks.  It would be a cheaper way to toy with death.  Calvin says Mom's so practical.
    characters: [calvin, mom]
  "19921124":
    transcript: This connect-the-dots book really makes me mad! Look at this. It's a duck. I know! Who wants to draw a duck?! I sure didn't! They MADE me! I've been maninpualted! My natural artistic talent has been used against my will to create some coprorate entity's crude idea of waterfowl! It's outrageous! Another blow to creative integrity. From now on, I'll connect the dots my OWN way.
    description: Calvin is angry with his connect-the-dots book.  Calvin complains he didn't want to draw the duck, the book made him.  He feels manipulated.  His talent has been used against his will.  Hobbes laments another blow to creative integrity.  Calvin says from now on, he'll connect the dots his own way.
    characters: [calvin, hobbes]
  "19921125":
    transcript: Miss Wormwood, my Dad says when he was in school, they taught him to do math on a slide rule. He says he hasn't used a slide rule since, because he got a five-buck calculator that can do more functions than he could figure out if his life depended on it. Given the pace of technology, I propose we leave math to the machines and go play outside. My bills always die in the subcommittee.
    description: Calvin asks Miss Wormwood about a slide rule.  He says Dad told him he used one, but then got a five dollar calculator that can do more functions then he could figure out.  Calvin suggests that given the pace of technology, they should leave math to the machines and go play outside.  Later, at his desk, Calvin complains his bills always die in subcommittee.
    characters: [calvin]
  "19921126":
    transcript: How do bank machines work, Dad? Well, let's say you wwant 25 dollars. You punch in the amount... and behind the machine, there's a guy with a printing press who makes the money and sticks it out this slot. Sort of like the huy who lives up in our garage and opens the door? Exactly.
    description: Calvin asks Dad how bank machines work.  Dad says you punch in the amount you want, and there's a guy with a printing press who makes the money and sticks it out the slot.  Calvin asks if it's like the guy who lives in their garage and opens the door.  Dad tells Calvin it's exactly like that.
    characters: [calvin, dad]
  "19921127":
    transcript: Miss Wormwood? Yes, Calvin? You can present the material, but you can't make me care. Rumor has it she's up to two packs a day, unfiltered.
    description: Calvin tells Miss Wormwood she can present the material, but she can't make him care.  Later, on the swing, Calvin happily says rumor has Miss Wormwood up to two packs a day, unfiltered.
    characters: [calvin, wormwood]
  "19921128":
    transcript: I've noticed that comic book superheroes usually fight evil maniacs with grandiose plans to destroy the world. Why don't superheroes go after the more subtle, realistic bad guys? Yeah, the superhero coiuld attend council meetings and write letters to the editor, and stuff. Hmm... I think I see the problem. "Quick! To the bat fax!"
    description: Calvin notices comic superheroes fight maniacs with plans to destroy the world.  He wonders why they don't go after more realistic bad guys.  Hobbes says the superhero could attend council meetings and write letters to the editor.  Calvin sees the problem.
    characters: [calvin, hobbes]
  "19921129":
    transcript: Recess! A School day break for play and exercise. Little does Susie realize how much exercise she is about to get! She turns at the sound of running feet behind her. Have her friends come to join her? No! It's a pack of ferocious deinonychus dinosaurs!! Screaming, Susie hurls herself toward the school doors, but the pack is closing in! With the grim efficiency of wild dogs, the predators have a meal. Across the playground, students huddle in stupefied horror! Which one of them will be next? Thus the weak and stupid are weeded out in a heartless, but essential, natural selection, keeping the human population in check. At least, that's how it ought to be. Thank you for that tastelss and entirely uninformative report on overpopulation. See me after class. You like that, Susie??
    description: Susie is playing and turns at a sound.  It's a pack of deinonychus dinosaurs.  Susie runs toward the school doors, but the pack closes in.  The predators have a meal.  Other students look on in horror, wondering who's next.  The weak and stupid are weeded out in a natural selection.  That's how it ought to be.  Miss Wormwood thanks Calvin for a tasteless and uninformative report on overpopulation.
    characters: [calvin, susie, wormwood]
    source: miraheze
  "19921130":
    transcript: Susie, can I copy your answers? Heck no! Why not? Because you'd get a good grade without doing any work. So? So it's wrong to get rewards you haven't earned. I've never heard of anyone who couldn't live with that.
    description: Calvin asks if he can copy Susie's answers.  She says no.  She tells him he'd get a good grade without doing any work.  Calvin wonders what's wrong with that.  Susie tells him it's wrong to get rewards you haven't earned.  Calvin's never heard of anyone who couldn't live with that.
    characters: [calvin, susie]
  "19921201":
    transcript: For "Show and Tell" today, I don't have anything to show. But I'll TELL you that, when I'm at school, my Mom puts on a patriotic leotard, a cape, and knee-high, high-heeled boots, and she fights crime as a super-heroine. I hope you're duly impressed. Thank you very much. That's the note his teacher sent home with him. Wow, show me that outfit sometime.
    description: Calvin has nothing for "show and tell".  Calvin tells the class that when he's in school, Mom puts on a leotard, cape, and high-heeled boots to fight crime as a super heroine.  Calvin bows and hopes the class in duly impressed.  Mom shows Dad the note the teacher sent home with him.  Dad wants her to show him that outfit sometime.
    characters: [calvin, mom, dad]
  "19921202":
    transcript: Do you hate being a girl? It's gotta be better than the alternative. What's it like? Is it like being a bug? Like a WHAT?! I imagine bugs and girls have a dim perception that nature played a cruel trick on them, but they lack the intelligence to really comprehend the magnitude of it. I must've put my finger on it.
    description: Calvin asks Susie if she hates being a girl.  Susie says it's better than the alternative.  Calvin asks if it's like being a bug.  Calvin thinks bugs and girls have a perception that nature played a trick on them, but they lack the intelligence to comprehend it.  Lying upside down against his locker, Calvin thinks he must have put his finger on it.
    characters: [calvin, susie]
  "19921203":
    transcript: I'm home! I'm free! The rest of the day is all mine! Finally, some time to myself! Liberty, precious liberty! Ha ha ha!
    description: Calvin rushes home from the school bus.  He's got time to himself.   He plans to enjoy his liberty.  He sits and watches television.
    characters: [calvin]
  "19921204":
    transcript: Dad, are you vicariously living through me in the hope that my accomplishments will validate your mediocre life and in some way compensate for all the opportunities you botched? If I were, you can bet I'd be re-evaluating my strategy. Mom, Dad keeps insulting me.
    description: Calvin asks if Dad is living through him in the hope Calvin's accomplishments validate his mediocre life and compensate for all his botched opportunities.  Dad says if he was, he'd re-evaluate his strategy.  Calvin tells Mom that Dad keeps insulting him.
    characters: [calvin, mom, dad]
  "19921205":
    transcript: I like rocks. Here's a nice one. See how smoothit is? It probably took eons to get like that. It's a sedimentary rock, formed by sediment deposits, as opposed to, say, an igneous rock, which is volcanic in origin. You sure know a lot about rocks. You bet. Ballistic missiles from God, I call 'em.
    description: Calvin picks up a rock and shows Hobbes.  He explains it took eons to get smooth like that.  He explains it's a sedimentary rock, as opposed to igneous.  He explains the difference to Hobbes.  Hobbes tells Calvin he knows a lot about rocks.  Calvin calls them ballistic missiles from God.
    characters: [calvin, hobbes]
  "19921206":
    transcript: ""
    description: Calvin wakes in the night and is pulled out his window into a flying saucer.  The aliens replace Calvin with a robot.  The robot steals cookies, breaks a lamp, and throws away schoolbooks, all in front of Mom.  Calvin tries to explain it to Mom, but she takes him to bed.  Calvin looks out his window at the stars.
