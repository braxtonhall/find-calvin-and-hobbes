  "19920825":
    transcript: I feel I have an obligation to keep a journal of my thoughts. Oh? Being a genius, my ideas are naturally more important and interesting than other people's, so I figure the world would benefit from a record of my mental activities. How philanthropic of you. Well, the world isn't going to get it cheap. So what are you writing today? I couldn't really think of anything, so I'm drawing some Martians attacking Indianapolis.
    description: Calvin feels an obligation to keep a journal.  He says his ideas are more interesting than other people's.  Hobbes says that's very philanthropic of him.  Calvin says the world won't get it cheap.  Hobbes asks what he's writing.  Calvin couldn't think of anything, so he's drawing Martians attacking Indianapolis.
