  "19920806":
    transcript: C'mon, let's go try to find a big poisonous snake! What will we do if we see one? Are you kidding? We'll scare ourselves silly and run around in circles, screaming like a bunch of loons! I look forward to when we're old enough to get our morning jolt from coffee. Ahh, I'll bet that wears off quicker.
