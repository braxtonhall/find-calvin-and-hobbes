  "19920811":
    transcript: Hello, information? Yes, what exactly is the difference between a hotdog, a weiner and a frankfurter? What? Whaddaya MEAN?! OK, FINE! Thanks for NOTHING, you fraud!! And I've heard the "operator" isn't even a surgeon! You can't trust anyone.
