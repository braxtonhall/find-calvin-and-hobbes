  "19920816":
    transcript: Something's wrong! We should've touched down by now! Oh now! We miscalculated! reduce forward momentum! Rotate the uppper appendages! Landing leg is out of alignment! Communication lines are broken! View ports open! Focus! Focus! Aaugh! Red alert! We're going down! Crash positions! Retract left landing leg! Redistrubute all weight! Addremalin is at maximum! Prepare for impact! Circuit overload! Essential functions only! Aaaauuuggghh! Goodness! Are you allright?? Damage assessment is under way!
    description: Little Calvins in helmets run controls.  They miscalculated and need to reduce forward momentum.  The landing leg is out of alignment.  One calls for view ports to open.  They prepare for crash positions.  Adrenalin is at maximum.  They try to redistribute all weight.  They prepare for impact.  Calvin falls down the steps.  Mom asks if he's alright.  Calvin says damage assessment is under way.
