  "19921119":
    transcript: These fall mornings sure are pretty. The brisk air, the smell of leaves... all ruined because I have to get on a bus and go to school. When I was a pre-schooler, I never took advantage of fall mornings. I didn't appreciate them. Another squandered youth. Sighhh... I was so young and foolish. I thought those days would last forever.
    description: Calvin says the fall mornings are pretty.  They're ruined because he has to get on the school bus.  Calvin says he didn't appreciate the fall mornings when he was a preschooler.  Hobbes proclaims another squandered youth.  Calvin says he was so young and foolish.  He thought those days would last forever.
    characters: [calvin, hobbes]
  "19921120":
    transcript: Hello? ... No, my Mom can't come to the phone right now. Sure, I'll be glad to take a message. You write it down, drive it over here, pay me five bucks, and I'll give it to her the next time I see her. He must not have wanted to talk to Mom very bad.
    description: Calvin answers the phone.  He says Mom can't come to the phone.  He says he'll take a message.  Calvin says the caller can write it down, drive it over to him, give him five bucks, and Calvin will pass it to Mom.  As he walks off, Calvin says the person must not have wanted to talk to Mom very badly.
