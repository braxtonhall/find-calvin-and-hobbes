    characters: [calvin, hobbes]
  "19920807":
    transcript: Oh greatest of mass media, thank you for elevating emotion, reducing thought, and stifling imagination. Thank you for the artificiality of quick solutions and for the insidious manipulation of human desires for commercial purposes. This bowl of lukewarm tapioca represents my brain. I offer it in humble sacrifice. Bestow thy flickering light forever.
    description: Calvin talks to the television, thanking it for elevating emotion and stifling imagination.  He thanks it for the artificiality of quick solutions.  He bows down and offers the television a bowl of lukewarm tapioca, which represents his brain.  Later, Mom sees the television on with the tapioca in front of it.  She is puzzled.
    characters: [calvin, mom]
  "19920808":
    transcript: You know what I've discovered? What? A little rudeness and disrespect can elevate a meaningless interaction into a battle of wills and add drama to an otherwise dull day. Oh, that's good to know. If you weren't such a muttonhead, you might have thought of it yourself! See?? You proved my point!
    description: Calvin has discovered a little rudeness and disrespect can elevate a meaningless interaction into a battle of wills.  Hobbes rolls his eyes and says that's good to know.  Calvin says if he wasn't such a muttonhead, he might have thought of it himself.  Calvin, stuck into the ground, says Hobbes just proved his point.
    characters: [calvin, hobbes]
  "19920809":
    transcript: That's my science fiction story. Think ti's too far fetched? Not enough, really.
    description: In poem form, aliens come, drain the ocean, suck up the clouds and air.  People cry for the aliens to stop.  The aliens reply that while they're sorry to learn the people will soon be dead, they prefer their extinction to the loss of the aliens' job.  Calvin shows Hobbes his science fiction story.  He asks if it's too far-fetched.  Hobbes says it's not enough, really.
