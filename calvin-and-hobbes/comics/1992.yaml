  "19921115":
    transcript: Some November this is. The leaves are down but there's no snow. Everything is just sitting aorund waiting for winter, but nothing is happening. C'mon, what's the big hold up?! Let's go, up there! Bring on the snow! No effciency. No Accountability. I tell you, it's a lousy way to run a universe. Whatever happened to the work ethic?
