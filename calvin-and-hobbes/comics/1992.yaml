  "19921110":
    transcript: Look, Hobbes, the skull! It's another letter from the secret insulter! More cut and pasted letters! It says, "You look like a baboon and you smell like one too! Ha ha." The mystery deepens. WHO COULD BE SENDING THESE?! A reckless exaggerator. You don't LOOK like a baboon. OH, YOU'RE A BIG HELP!
    description: Calvin sees the skull on the envelope.  It's from the secret insulter.  This one reads "You look like a baboon and you smell like one, too!  Ha.  Ha".  Calvin yells aloud wondering who could be sending these.  Hobbes looks at Calvin and says a reckless exaggerator.  He says Calvin doesn't look like a baboon.  Calvin yells that Hobbes is a big help.
    characters: [calvin, hobbes]
  "19921111":
    transcript: I can't sleep. Who's been sending me these insults? Where will it stop?! Am I going to get an insult in the mail every day for the rest of my life?? The thing that drives me crazy is that there's no way to trace this lunatic! He's thought of everything! He's a mastermind! Hey, who cut up this magazine?
    description: Calvin can't sleep.  He wonders who's sending the insults and where it will stop.  He's being driven crazy since there's no way to trace the lunatic.  Calvin says this person has thought of everything.  Mom looks at her cut up magazine and wonders who did it.
    characters: [calvin, hobbes, mom]
  "19921112":
    transcript: Did I get another letter today? Yep! When you write to yourself, you get a lot of mail. I don't write these! What are you talking about? Oh c'mon, Calvin. I know you've been putting these out for the mailman every day. Wait a minute! These are coming from OUR house?? Oh, and I want you to ASK before you cut up my magazines, OK? ALL RIGHT, WHERE'S THAT MISERABLE BUNCH OF STRIPEY ORANGE FLEA BAIT?!?
    description: Calvin asks if he got another letter.  Mom says when you write to yourself, you get a lot of mail.  Calvin doesn't know what she's talking about.  Mom says she knows he's been putting out the notes for the mailman every day.  Calvin asks if she means the notes are coming from their house.  Mom tells Calvin to ask before he cuts up her magazines.  Hobbes sits with scissors and magazine in hand.  From the other room, Calvin asks where the miserable bunch of stripey orange flea bait is.
