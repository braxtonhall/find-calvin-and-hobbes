  "19921107":
    transcript: I'm home! I'm home! Did I get a letter today?? Yes, it's on the table. Oh boy, Hobbes, this is it! This is the coded message! Quick, let's decipher it! OK, the first number is 3, so that would be "C". Next is 1. So that's "A". This is fun! Hey! This says, "Calvin is a porridge brain!" It's... it's an INSULT! Some people have secret admirers. YOU have a secret detractor!
