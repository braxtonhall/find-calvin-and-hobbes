  "19921118":
    transcript: Well, your haircut is a big improvement. You LIKE what it says on the back of my head? What WHAT says? Didn't the barber shave "I may have a bad haricut, but you're downright ugly" back there? Good heavens, no! OK, CHARLIE, GIMME BACK THAT TIP!
