  "19920722":
    transcript: Mom doesn't understand comic books. She doesn't realize that comic books deal with serious issues of the day. Today's superheroes face tough moral dilemmas. Comic books aren't escapist fantasy. They're sophisticated social critiques. Is Amazon girl's super power the ability to squeeze that figure into that suit? Nah, they can all do that.
