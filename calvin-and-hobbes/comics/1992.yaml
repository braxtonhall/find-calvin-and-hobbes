strips:
  "19920202":
    transcript: If you ask ME, Hobbes, the whole notion of "instant gratification" is a MYTH! I don't ever get what I want when I want it! I always have to wait! Look how long it's taken me to be six years old! Practically forever! When do I get to drive?! When can I go see gory, violent movies?! Why do I have to wait till I'm older? People say life's a journey, but I'm tired of wasting my precious time in transit! I say, if you want to find out where the road goes, get in the fast lane and hit the gas! Spare me the scenery and let's get where we're going! I'm a busy guy! I've got places to be! SUMP! SPLOOP Gosh, that was over quick.
    description: Riding down the hill on the sled, Calvin tells Hobbes the whole notion of instant gratification is a myth.  He says he never gets what he wants.  He complains how long it's taken to be six years old.  He asks Hobbes when he gets to drive and see violent movies.  He wants to know why he has to wait until he's older.  Calvin says people say life's a journey, but he says he's tired of wasting his precious time in transit.  He says he's a busy guy and has places to be.  They hit a rock and fall into the snow.  Calvin looks at Hobbes and says that was quick.
    characters: [calvin, hobbes]
    source: s-anand+seligman+miraheze
  "19920203":
    transcript: When a kid grows up, he has to BE something. He can't just stay the way he is. But a tiger grows up and stays a tiger. Why is that? No room for improvement. Of all the luck, my parents had to be humans. Don't take it too hard. Humans provide some very important protein.
    description: Calvin tells Hobbes when a kid grows up, he has to be something.  He can't stay the way he is.  He says a tiger grows up and stays a tiger.  He asks Hobbes why.  Hobbes says there's no room for improvement.  As they walk off, Calvin says of all the luck, his parents had to be humans.  Hobbes tells him not to take it too hard.  Humans provide some very important protein.
    characters: [calvin, hobbes]
  "19920204":
    transcript: It's no surprise to ME that nobody's sold a house on this street for six years.
    description: Calvin rolls a big snowball.  He's making a snowman.  The snowman has its mouth open, with stick arms.  Calvin lays inside the mouth of the snowman.  Susie walks by.  She says it's no surprise nobody's sold a house on this street for six years.
    characters: [calvin, susie]
  "19920205":
    transcript: I try to make television-watching a complete forfeiture of experience. Notice how I keep my jaw slack, so my mouth hands open. I try not to swallow either, so I drool, and I keep my eyes half-focused, so I don't use any muscles at all. I take a passive entertainment and extend the passivity to my entire being. I wallow in my lack of participation and response. I'm utterly inert. I'm going to leave before you start attracting flies. I can almost feel my neural transmitters shutting down.
    description: Calvin tells Hobbes he tries to make television watching a complete forfeiture of experience.  He keeps his jaw slack, tries not to swallow so he drools, and keeps his eyes half-focused.  He takes passive entertainment and extends it to his entire being.  He's utterly inert.  Hobbes walks away and says he's going before Calvin starts attracting flies.
    characters: [calvin, hobbes]
  "19920206":
    transcript: ""
    description: Calvin looks at the hillside.  He starts building something in the snow.  Later, Dad walks by and looks at the hillside.  It appears a giant head is peeking over the hill down at him.
    characters: [calvin, dad]
  "19920207":
    transcript: HELP HELP! MY HEAD SOMEHOW GOT TWISTED COMPLETELY AROUND! I'M FACING BACKWARD! LOOK I CAN READ THE TAG ON MY SHIRT! I CAN SEE DOWN MY OWN BACK! ... Oh wait. There's my belly button. I must have my SHIRT on backward. Never mind. I've got my head on straight after all. Oh, I wouldn't go THAT far.
    description: Calvin shouts that his head has gotten twisted around.  He's facing backward.  He looks down at his shirt, whose tag he can read.  He lifts his shirt and sees his belly button.  He realizes he must have his shirt on backward.  He tells Mom, who's reading the newspaper at the table, that he's got his head on straight after all.  Mom says she wouldn't go that far.
    characters: [calvin, mom]
  "19920208":
    transcript: OH SURE! NICE TRY! Darn, darn, darn, darn, darn!
    description: Susie sits in the snow.  She comes upon a rope hanging from a tree.  The rope has a note saying "pull".  Susie looks up into the tree.  She yells to Calvin that it was a nice try.  Calvin, up in the tree with a pail of snowballs attached to the rope, says "darn".
    characters: [calvin, susie]
  "19920209":
    transcript: Eighty million years ago, back in the late Cretaceous, lived the great tyrannosaur, a fearsome and predacious therapod of monstrous size! He weighed six tons or more! He epotomized the concept of the killer carnivore! His jaws had teeth like railroad spikes with fore and aft serrations! This dental hardware was designed for quick eviscerations! With thrashing bites and awful roars the T.Rex would attack! He was, it's clear, a savage mesozoic maniac! Imagin, then, the panic caused, the horror and the mayhem, when this monster came to town and ate some folks this A.M.! It was a sight few will forget! He lunged into the crowd! The multitude became unglued! Their screams were long and loud! People pushed to get away! The elderly and small were trampled underfoot by the advancing human wall! Little Tim was on an errand with his brother howard. They dawdled by the candy shop and both boys were devoured. A camera crew from channel three arrived in town to give a live report. At this they failed, because they didn't live. At last the menace ate his fill. The big tyrannosaur stomped away to parts unknown where he had lived before. Tyrannosaurs, though rarely seen, are certainly still around. And no one knows just where or when the next one will be found. Blow your nose, dear. Achgth! Tck! Nhggrr!
    description: A dinosaur poem.  The great tyrannosaur lived many years ago, and he epitomized the concept of the killer carnivore.  The monster came to town this morning.  He lunged into the crowd, and people ran screaming.  They tried to get away.  People were trampled.  Two boys dawdled by the candy shop and were devoured.  A camera crew arrived to give a live report.  They failed, because they did not live.  The menace ate his fill and stomped away.  Calvin walks behind Mom's chair, growling and snarling while walking like a dinosaur.  The poem ends that no one knows where the next tyrannosaur will be found....except Calvin.
    characters: [calvin, mom]
    source: s-anand+seligman
    review: "verified: checked against a source outside the corpus by the maintainer"
  "19920210":
    transcript: Aren't you supposed to be doing your homework now? I quit doing homework. Homework is bad for my self-esteem. It is Sure! It sends the message that I don't know enough! All that emphasis on right answers makes me feel bad when I get them wrong. So instead of trying to learn, I'm just concentrating on liking myself the way I am. Your self-esteem is enhanced by remaining an ignoramus? Please! Let's call it "informationally impaired".
    description: Hobbes asks if Calvin shouldn't be doing his homework.  Calvin replies he quit doing it.  It's bad for his self-esteem.  Calvin says it sends the message he doesn't know enough.  He feels bad if he doesn't get the right answer.  As he rolls a snowball, Calvin says instead of trying to learn, he's concentrating on liking himself just the way he is.  Hobbes asks if his self-esteem is enhanced by remaining an ignoramus.  Calvin says they should call it "informationally impaired".
    characters: [calvin, hobbes]
  "19920211":
    transcript: See, Hobbes, we shouldn't need accomplishments to feel good about ourselves. Self-esteem shouldn't be conditional. That's why I've stopped doing homework. I don't need to learn things to like myself. I'm fine the way I am. So the secret to good self-esteem is to lower your expectations to the point where they're already met? Right. We should take PRIDE in our mediocrity. Remind me to invest overseas. I think this snowman is good enough, don't you?
    description: As they roll two snowballs, Calvin tells Hobbes they shouldn't need accomplishments to feel good about themselves.  Self-esteem shouldn't be conditional.  Calvin says he stopped doing homework because he's fine just the way he is.  Hobbes asks if the secret to good self-esteem is to lower expectations to the point they're already met.  Calvin says he's right.  They should take pride in their mediocrity.  Calvin looks at the snowman they made with only two snowballs.  He says the snowman is good enough.
    characters: [calvin, hobbes]
  "19920212":
    transcript: Look, Dad made me do my homework. He said when I'm older, I'll discover that there are few pleasures greater than learning. So I said,  FINE, I'll learn when I'm older. What did HE say? He said if I didn't start cracking books NOW, this would be as old as I'd get. Sounds like you learned something already.
    description: Calvin complains Dad made him do his homework.  Calvin tells Hobbes Dad said when Calvin gets older, he'll discover there are few pleasures greater than learning.  Calvin told him he'll learn when he's older.  Dad replied if he didn't study now, this would be as old as he'd get.  Hobbes tells him it sounds like he learned something already.
    characters: [calvin, hobbes]
  "19920213":
    transcript: Mom and Dad drive me crazy. They don't understand ME and I don't understand THEM. It's hopeless! I'm related to people I don't relate to.
    description: Calvin tells Hobbes Mom and Dad drive him crazy.  They don't understand each other.  Calvin says he's related to people he doesn't relate to.
    characters: [calvin, hobbes]
  "19920214":
    transcript: Here we stand, peering down the dizzying depths of doom drop! Do we turn around and retreat to the stupefying security of home and hearth? OR do we brave the descent, risk demise, and experience the flood of somatic sensation that screams we are alive, gloriously alive, however temporarily?? ... Hobbes? I thought the question was rhetorical. The other way, though!
    description: At the top of the hill, toboggan ready to go, Calvin tells Hobbes they're peering down the dizzying depths of Doom Drop.  Do they turn around and retreat to the security of hearth and home, or do they brave the descent, risk demise, and experience the flood of sensation.  Calvin turns around to find Hobbes gone.  Later, at home in front of the fireplace, Hobbes is lying on the floor.  He tells Calvin he thought the question was rhetorical.  Calvin says it was, the other way.
    characters: [calvin, hobbes]
  "19920215":
    transcript: Here's the latest poll on your standing as "Dad". Wonderful. The good news is that you have a high name-recognition factor. All the household six-year-olds polled were able to identify you as "Dad". This recognition, however, is liked to the fact that your policies are universally deplored. There's talk of voting you out of office and making Mom "Dad". I see. And what do YOU know about this? My first act will be to make you do the cooking. Whoa! That changes everything.
    description: Calvin gives Dad the results of his latest poll.  Calvin says Dad has a high name-recognition factor.  Sadly, that recognition is due to the fact Dad's policies are universally deplored.  Calvin says there is talk about voting him out of office and making Mom "Dad".  Dad asks Mom what she knows about this.  Mom says her first act will be to make Dad do the cooking.  Calvin hastily says that changes everything.
    characters: [calvin, mom, dad]
  "19920216":
    transcript: "The whole problem with modern times is that there's no pride in craftsmanship. When most kids make a snowball, the just mush a bunch of snow together. Everyone's a slave to efficiency! No time for aesthetics! No love of things for their own sake! But when I make a snowball, it's a work of art! This snow, for example, is just a little too powdery. It won't sting properly. I prefer a wetter snow: something with some more weight! Something that will really knock the wind out of the opponent! And how much loose rubble and dirt is acceptable before it affects the aerodynamics? Do you get better spin with an ellipsoid or a true sphere? Nobody considers these things any more! It's a lost tradition, I tell you! My snowballs aren't assembly line productions! They take me longer to make, but each one is a unique masterpiece! That's why I sign them. Watch this - HEY SUSIE! POW POW POW POW. It's a crass culture, Hobbes. Shoddy and quick is all anybody knows. Artists always suffer."
    description: Calvin tells Hobbes there's no pride in craftsmanship anymore.  Calvin explains most kids just mush a bunch of snow together to make a snowball.  There's no time for aesthetics.  But when he makes a snowball, it's a work of art.  He looks at the snow and says it's a bit too powdery.  It won't sting properly.  He prefers a wetter snow.  Something that will knock the wind out of the recipient.  How much loose rubble is acceptable before it affects aerodynamics?  Calvin says no one thinks of these things.  It's a lost tradition.  His snowballs are unique masterpieces.  Calvin winds up and yells to Susie.  She whirls around and hits Calvin with four snowballs.  Lying on the snow, Calvin says it's a crass culture.  Hobbes says artists always suffer.
    characters: [calvin, hobbes, susie]
    source: s-anand+seligman+miraheze
  "19920217":
    transcript: Dad's calling you. He wasn't? Huh! Well, Hobbes took your chair. Sorry. I like my chairs pre-warmed. You ow me.
    description: Calvin tells Mom that Dad's calling her.  She leaves her chair.  Mom comes back.  Calvin acts surprised that Dad wasn't calling her.  He had put Hobbes on the chair.  He tells Mom that Hobbes took her chair.  Mom leaves, and Hobbes tells Calvin that he likes his chairs pre-warmed.
    characters: [calvin, hobbes, mom, stuffedhobbes]
  "19920218":
    transcript: He knows I hate this.
    description: Calvin is building snowmen.  As Dad gets home and comes up the walkway, there is a line of snowmen with stick arms saluting him.  Dad says Calvin knows he hates this.
    characters: [calvin, dad]
  "19920219":
    transcript: This is my snow sculpture, "Bourgeois Buffoon". Can you believe Mom rejected my grant application to continue making these? Why do you need a grant? I'm on the cutting edge of art! My work deserves public support! What if the public doesn't like your work? They're not SUPPOSED to like it! This is avante-garde stuff! I'm criticizing the lowbrows who can't appreciate great art like this! But you'll take their money. What do you want me to do, suffer?!
    description: Calvin shows Hobbes his snow sculpture "Bourgeois Buffoon".  He says Mom rejected his grant application to continue making them.  Hobbes asks why Calvin needs a grant.  Calvin says he's on the cutting edge of art.  His work deserves public support.  Hobbes asks what happens if the public doesn't like his work.  Calvin explains they're not supposed to like it .  He's criticizing the lowbrows who can't appreciate his art.  Hobbes clarifies that Calvin will take their money.  Calvin asks if Hobbes expects him to suffer.
    characters: [calvin, hobbes]
  "19920220":
    transcript: This snowman doesn't look especially avant-garde. Actually, it's VERY avant-garde. This is my new art movement, "neo-regionalism". I'm appealing to popular nostalgia for the simple values of rural america 50 years ago. I figure the public will eat this up and I'll make a fortune. So how is this avant-garde? It's secretly ironic.
    description: Hobbes tells Calvin his latest snowman doesn't look avant-garde.  It looks like a regular snowman with a pipe, hat, and shovel in its hand.  Calvin says this is his new art movement, "neo-regionalism".  He's appealing to popular nostalgia for the simple rural values of America 50 years ago.  Calvin figures the public will love it, and he'll make a fortune.  Hobbes asks how that's avant-garde.  Calvin tells him it's secretly ironic.
    characters: [calvin, hobbes]
  "19920221":
    transcript: I've concluded that nothing bad I do is my fault. Oh? Right! Being young and impressionable, I'm the helpless victim of countless bad influences! An unwholesome culture panders to my undeveloped values and pushes me to maleficence. I take no responsibility for my behavior! I'm an innocent pawn! It's society's fault! Then you need to build more character. Go shovel the walk. These discussions never go where they're supposed to.
    description: Calvin tells Dad he concluded nothing bad he does is his fault.  Calvin says he's the helpless victim of countless bad influences.  Culture panders to his undeveloped values and pushes him to maleficence.  He takes no responsibility for his actions.  It's society's fault.  Dad tells him he needs to build more character.  He tells Calvin to shovel the walk.  Outside, Calvin laments these discussions never go where they're supposed to.
    characters: [calvin, dad]
  "19920222":
    transcript: I see you with that snowball! Go ahead and throw it! I'm not scared! You couldn't hit the side of a barn! C'mon, throw it! I dare you! POW!! Seriously, you could never have done that if my taunts hadn't boosted your adrenalin. I can find only one of your socks.
    description: Calvin yells that he can see Hobbes with a snowball.  He taunts Hobbes to throw it.  He says Hobbes couldn't hit the side of a barn.  POW!  Lying on his back in the snow, Calvin tells Hobbes he couldn't have done that if Calvin hadn't boosted his adrenaline by taunting him.
    characters: [calvin, hobbes]
  "19920223":
    transcript: You know, Hobbes, it seems the only time most people go outside is to walk to their cars. We have houses, electricity, plumbing, heat... maybe we're so sheltered and comfortable that we've lost touch with the natural world and forgotten our place in it. Maybe we've lost our awe of nature. That's why I want to ask YOU, as a tiger, a wild animal close to nature, what you think we're put on earth to do. What's our purpose in life? Why are we here? We're here to devour each other alive. Turn on the lights! Turn up the heat!
    description: Calvin says that it seems the only time people go outside is to walk to their cars.  He wonders if they're so sheltered and comfortable that they've lost touch with the natural world.  Calvin asks Hobbes, as a wild animal close to nature, what they're put on earth to do.  What is their purpose in life?  Hobbes says they're here to devour each other alive.  Calvin stands there.  Inside the house, he's turning on the lights and turning up the heat.
    characters: [calvin, hobbes]
    source: s-anand+seligman+miraheze
  "19920224":
    transcript: I read that Teddy Roosevelt once said, "Do what you can with what you have where you are." That's good advice. Of course, I doubt he was in the tub when he said that.
    description: In the bathtub, Calvin tells Hobbes that Teddy Roosevelt once said, "Do what you can with what you have where you are".  Hobbes says that's good advice.  Calvin doubts Teddy was in the tub when he said that.
    characters: [calvin, hobbes]
  "19920225":
    transcript: Shovel the walk! Shovel the walk! That's all I'm good for around here. What about my powerful intellect?! My budding genius is being squandered! I aspire to be more than brute slave labor! These hands! These amazing hands are destined to create unreamt-of wonders, yet here they're worn to the bone in unfulfilling drudgery! What a monstrous injustice! Geez, don't tell me lunch isn't ready!
    description: Calvin complains that all he is good for is to shovel the walk.  He protests about his powerful intellect.  He says his budding genius is being squandered.  He looks at his hands, saying they're destined to created wonders, yet they're worn to the bone in unfulfilling drudgery.  As he walks inside, Mom is vacuuming the floor.  Calvin looks at Mom and complains that she better not tell him lunch isn't ready.
    characters: [calvin, mom]
  "19920226":
    transcript: DING DONG You really need professional help. What makes you think I did it??
    description: Susie is playing in her house, and the doorbell rings.  She answers it, to find a snowman's head on her step.  She goes over to Calvin's house and tells him he needs professional help.  Calvin asks what makes her think he did it.
    characters: [calvin, susie, bun]
  "19920227":
    transcript: What's wrong with Easter Island? I LIKE Easter Island.
    description: Dad looks at the row of giant snowman heads.  Calvin asks what's wrong with Easter Island.  He likes Easter Island.
    characters: [calvin, dad]
  "19920228":
    transcript: Hello, is this the hardware sotre? Yes, I'm wondering if you sell catapults. No?? Well, I'm looking for something that can deliver a 50-pound payload of snow on a small feminine target. Can you suggest something? Hello? I don't understand how some of these places stay in business.
    description: Calvin calls the hardware store, asking if they sell catapults.  He says he's looking for something to deliver a 50-pound payload of snow on a small feminine target.  They hang up on him.  As he walks off, he says he can't understand how some of these places stay in business.
    characters: [calvin]
  "19920229":
    transcript: I don't think you have enough to do.
    description: Dad walks through the snow and sees a few miniature snowmen.  As he walks, he sees more and more.  He comes up to Calvin building a full-size snowman, with upraised stick arms, and an expression of a yell.  Dad tells Calvin he doesn't think Calvin has enough to do.
    characters: [calvin, dad]
  "19920301":
    transcript: Calvin, this is the last time I'm calling you! Get up before you miss the bus! Well, look who's finally up! It's Mr Sunshine! You know, Calvin, from now on, you're going to bed earlier. This dragging out of bed late with a surly attitude every morning is going to stop. You're only kidding yourself, bucko. Bedtime is 7:00. We should've adopted a 25-year-old with his own apartment.
    description: Mom yells for Calvin to wake up before he misses the bus.  Calvin has a frown on his face.  Dad says Mr. Sunshine has finally gotten up.  Calvin forces a big, phony smile.  He gets his cereal, pours it, and starts to eat.  He still has the phony smile.  Dad looks at him and says he's only kidding himself.  Bedtime will be at 7:00.  Calvin frowns and continues to eat his cereal.  Dad thinks they should've adopted a 25-year-old with his own apartment.
    characters: [calvin, mom, dad]
    source: s-anand+seligman+miraheze
  "19920302":
    transcript: I won! I did it! I won! I won! I'm the champion! I'm the best there is! I'm the top of the heap! Ha ha ha! Is this all there is??
    description: Calvin cheers because he's beaten Hobbes at checkers.  He clenches his hands and declares himself the champion, the best there is, the top of the heap.  He stands there, smiling.  Then he asks if this is all there is.
    characters: [calvin, hobbes]
  "19920303":
    transcript: If there are no questions, we'll move on to the next chapter. I have a question. Certainly, Calvin. What is it? What's the point of human existence? I meant any questions about the subject at hand. Oh. Frankly, I'd like to have the issue resolved before I expend any more energy on this.
    description: Miss Wormwood says they'll move to the next chapter if there are no more questions.  Calvin asks what is the point of human existence.  Miss Wormwood explains she meant any questions about the subject at hand.  Calvin looks at his book and says he'd like to have the issue resolved before he expends any more energy on this.
    characters: [calvin, wormwood]
  "19920304":
    transcript: Ewww. Ewwww. SCHLOOP PLITCH BLOP Ewwwwww. PLIP PLOOP PLOP EWWWWWWW! PLUBLIPTHH THWIPP PLUP
    description: Calvin looks at some mud and says "Ewww".  He pokes it with a stick and says "Ewwww".  He lifts a glob with the stick and says it again.  Finally, he stomps through the mud, grinning, and yells "Ewwwwwww!"
    characters: [calvin]
  "19920305":
    transcript: Where ARE those darn boots?
    description: Calvin walks with muddy shoes to the closet.  He goes up the stairs.  He walks to another closet, still trailing muddy steps throughout the house.  He asks where those darn boots are.
    characters: [calvin]
  "19920306":
    transcript: Put on some nice clothes and let's go for a stroll!
    description: Calvin digs at the dirt with a stick.  He fills a pail with water from the spigot.  He pours the water onto the dirt.  He stirs up the mud with the stick.  He goes to Susie's house, and tells her to put some nice clothes on and they'll go for a stroll.
    characters: [calvin, susie]
  "19920307":
    transcript: It couldn't be avoided.
    description: Calvin digs a hole with the shovel.  He fills the hole with water from the hose.  He jumps in.  As he enters the house while covered in mud, he tells Mom it couldn't be avoided.
    characters: [calvin, mom]
  "19920308":
    transcript: What do you know about love, Hobbes? Lots! Yeah? Like what? I'm not telling. WHY NOT? It's a sophisticated thing. SOPHISTICATED?! Whaddaya MEAN sophisticated?? I'M sophisticated! Why won't you talk about it? Nice weather today. RRRRGH!! You know something and you won't tell me what it is! Maybe when you're older. When I'm OLDER?! Why can't you tell me now?! Some things you wouldn't understand. Ha! I bet you don't know ANYthing about love! THAT's why you won't tell me!! If that's what you want to believe, go ahead. TELL ME! NO! TELL ME! NOT! TELL ME! NO! TELL ME! NO! TELL ME! NO! Look, just give me a hint, OK? One hint, c'mon! OK, here! "Snoogy-woogy wips". EWW See? I told you you weren't old enough.
    description: Calvin asks Hobbes what he knows about love.  Hobbes won't tell him. Calvin asks why he won't talk about it.  Hobbes asks about the nice weather.  Calvin is angry Hobbes won't tell him what he knows.  Hobbes says maybe when Calvin is older.  Calvin bets Hobbes doesn't know anything about love.  That's why he won't tell him.  Hobbes walks off suggesting Calvin should believe that if he wants.  They fight, with Calvin demanding to know, and Hobbes refusing to tell.  Calvin asks for a hint.  Hobbes says "snoogy-woogy wips".  Calvin is grossed out.  Hobbes tells Calvin that he warned him he wasn't old enough.
    characters: [calvin, hobbes]
    source: s-anand+seligman+miraheze
  "19920309":
    transcript: rrRumRumm beep beep - rrrrrr rrummm - aughh! - I don't understand why you have to take your clothes off to play cars. It's very weird. Just give 'em here. Ok?
    description: Calvin is playing with his toy truck and cars.  Behind him, Hobbes pounces.  Calvin is knocked out of his clothes.  Mom brings Calvin his clothes, saying she doesn't understand why he has to take off his clothes to play cars.  She says it's weird.  Calvin, standing in his underwear with Hobbes next to him, tells Mom to just give him the clothes.
    characters: [calvin, hobbes]
  "19920310":
    transcript: What time is it? Go look at the clock and see. What's the weather outside like today? Go step outside and see. How fast can our car go? Go... ...nice try. Phooey.
    description: Mom is reading in her chair.  Calvin asks what time it is.  Mom tells him to look at the clock and see.  Calvin asks what the weather is like outside.  Mom tells him to go outside and see.  Calvin asks how fast their car can go.  Mom starts to tell him to go...she stops.  She tells Calvin it was a nice try.  Calvin is dejected his plan didn't work.
    characters: [calvin, mom]
  "19920311":
    transcript: The problem with rock'n'roll is that the generation that created it is now the establishment. Rock pretends it's still rebellious with its video posturing, but who believes it? The stars are 45-year-old zillionaires or they endorse soft drinks! The "revolution" is a capitalist industry! Give me a break! Fortunately I've found some protest music for TODAY's youth! This stuff really offends Mom and Dad! Easy-listening muzak? I play it real quiet, too.
    description: Calvin says the problem with rock-and-roll is that the generation that created it is now the establishment.  He says rock pretends it's still rebellious with its video posturing, but the stars are zillionaires or they endorse soft drinks.  The "revolution" is a capitalist industry.  Calvin says he's found some protest music for today's youth.  He says this stuff really offends Mom and Dad.  Hobbes listens to the easy-listening Muzak.  He covers his ears.  Calvin says he plays it real quiet, too.
    characters: [calvin, hobbes]
  "19920312":
    transcript: I don't want to go to school! I'd rather do ANYTHING than go to school! OK, how about if I go to school and YOU get a job? You'll like working till evening and being responsible for the subsistence of your family, with a whiny kid's griping for reward. It's nice to know there's so much in life to look forward to.
    description: Calvin yells that he doesn't want to go to school.  He'd rather do anything than go to school.  Dad suggests that he'll go to school, and Calvin can get a job.  Dad says Calvin will like working till evening and being responsible for the subsistence of his family, with a whiny kid's griping for reward.  Calvin waits for the school bus complaining it's nice to know there's so much in life to look forward to.
    characters: [calvin, dad]
  "19920313":
    transcript: I don't want to pay any dues in life. I want to be a one-in-a-million, overnight success! I want the world handed to me on a silver platter! Good luck. SURELY YOU CONCEDE I DESERVE IT!
    description: Calvin tells Hobbes he doesn't want to pay any dues in life.  He wants to be an overnight success, with the world handed to him on a silver platter.  Hobbes rolls his eyes, walks off, and says "Good luck".  Calvin yells after him that surely he concedes Calvin deserves it.
    characters: [calvin, hobbes]
  "19920314":
    transcript: "*snap* AUGH! Oops! Instinct kicked in before I knew that was you. YOU KNEW DARN WELL THAT WAS ME!"
    description: Calvin walks along and steps on a twig.  It snaps.  Hobbes pounces on Calvin.  Hobbes gets up saying instinct kicked in before he knew it was Calvin.  Calvin, on the ground beneath Hobbes, yells that Hobbes knew darn well it was him.
    characters: [calvin, hobbes]
  "19920315":
    transcript: When are we going to get there? Can't you drive any faster?? I don't like to go much faster than this. Can I drive, then? I'll bet I could go REAL fast! Hmm... well, OK, sure. I'll pull over. Don't worry about a thing, Dad! Which pedal is the clutch? The left one. Then brake, then gas. Here we go! Hang on! Ooh, this IS faster! Blow the horn! Make everyone get out of our way! Wheeee! We're airborne! We should've done this sooner! We'll get there in no time now! I wonder how fast we're going. Can't say. We broke the speedometer. This is the only way to travel. We're passing that jet! Way to go, Calvin! I LIKE driving! ..SIGHHH.. How much longer NOW? I told you we'll get there when we get there.
    description: In the back seat of the car, Calvin asks if they can't go any faster.  Dad says he doesn't like to go any faster.  Calvin asks if he can drive.  Dad pulls over, then switches seats with Calvin.  Off they go!  They're airborne.  Mom and Dad say they should have done this sooner.  Calvin says they broke the speedometer.  They're passing a jet.  Calvin says he likes driving.  Calvin sighs.  He's in the back seat, asking Dad how much longer it will be.
    characters: [calvin, mom, dad]
    source: s-anand+seligman+miraheze
  "19920316":
    transcript: I wish I was still in bed. I'd hear the wind bowling the rain against the window panes and I'd pull the blankets up, get all toasty and cozy, and fall back asleep. Instead, I'm out here, cold and wet, waiting for the school bus to take me to the gulag. Yeah, I hope the sheets are still warm when I get back in. Rub it in, Hobbes.
    description: Calvin is standing in the rain, waiting for the bus.  He tells Hobbes he wishes he was still in bed.  He'd hear the wind blowing the rain against the windows, he'd pull the blankets up, he'd get cozy, and fall back asleep.  He says instead, he's outside, cold and wet, waiting for the bus to take him to the gulag.  Hobbes says he hopes the sheets are still warm when he gets back in.  Calvin tells him to rub it in.
    characters: [calvin, hobbes]
  "19920317":
    transcript: Hey Dad, look at this commercial. How come you don't drive a cool sports car like that guy? That car costs $40,000. And look at the babe he's with. How come Mom doesn't dress like that? Yeah, why DON'T you dress like that? Because your adolescent fantasies require an adolescent model with implants, ... HONEY. Maybe you guys need to drink more beer.
    description: Calvin asks Dad to look at a commercial on television.  He asks why Dad doesn't drive a cool sports car.  Dad says that car costs $40,000.  Calvin asks why Mom doesn't dress like the babe in the commercial.  Dad asks Mom why she doesn't dress like that.  Mom informs him his adolescent fantasies require an adolescent model with implants.
    characters: [calvin, mom, dad]
  "19920318":
    transcript: Mom, can I have some money to buy a satan-worshiping, suicide-advocating heavy metal album? Calvin, the fact that these abnds haven't killed themselves in ritual self-sacrifice shows that they're just in it for the money like everyone else. It's all for effect. If you want to shock and provoke, be sincere about it. Mainstream commercial nihilism can't be trusted?! 'fraid not, kiddo. Childhood is so disillusioning.
    description: Calvin asks Mom if he can buy a Satan-worshipping, suicide-advocating, heavy metal album.  Mom explains that since the bands haven't killed themselves in ritual self-sacrifice proves they're in it for the money, just like everyone else.  She says if someone wants to shock and provoke, be sincere about it.  Calvin asks if mainstream commercial nihilism can't be trusted.  She says she's afraid not.  Calvin says childhood is so disillusioning.
    characters: [calvin, mom]
  "19920319":
    transcript: People don't realize what a burden it is being a genius like me. It's not easy having a mind that operates on a higher plane than everyone else's! People just refuse to see that I'm the crux of all history, a boy of destiny! I suppose one could recognize a boy of destiny by his planet-and-star underpants. Another trenchant comment by a jealous lesser intellect.
    description: Calvin tells Hobbes people don't realize what a burden it is being a genius like him.  He says it's not easy having a mind that operates on a higher plane than anyone else.  He complains people refuse to see he's the crux of all history, a boy of destiny.  Hobbes says he supposes one could recognize a boy of destiny by his planet-and-star underpants.  Calvin says that's another trenchant comment by a jealous lesser intellect.
    characters: [calvin, hobbes]
  "19920320":
    transcript: Mom, from now on, I don't want to be introduced to people as plain "Calvin". I want to be introduced as "Calvin, boy of destiny". Boy of destiny?? But you have to say it right. Pause a little after "boy", and say "destiny" a bit slower and deeper for emphasis. Sai it, "Boy... of DESSSTINY", like that! I think I'm going to stop introducing you altogether. I wish you had some cymbals to crash after you said it.
    description: Calvin tells Mom he'd like to be introduced not as plain "Calvin", but as "Calvin, boy of destiny".  He explains she has to pause after "boy", and say "destiny" a bit slower and deeper for emphasis.  Mom says she thinks she's going to stop introducing him altogether.  Calvin wishes she had some cymbals to crash after she said it.
    characters: [calvin, mom]
  "19920321":
    transcript: Here's your paper, Susie. Very good. Here is yours, Calvin. By the way, you can stop signing your work "Calvin, boy of destiny", and I think your time would be better spend studying than drawing "official notary seals" at the bottom. Boy of destiny?! That's right. Boy of destiny! Everyone I know thinks your destiny is a private cage in the primate house. YOUR destiny is to have a smile that's all gums.
    description: Miss Wormwood hands back papers.  She tells Calvin he can stop signing his work "Calvin, boy of destiny".  She thinks his time would be better spent studying than drawing "official notary seals" at the bottom.  Susie asks about "boy of destiny".  She says everyone she knows thinks Calvin's destiny is a private cage in the primate house.  Calvin tells her that her destiny is to have a smile that is all gums.
    characters: [calvin, susie, wormwood]
  "19920322":
    transcript: ""
    description: A paw, a back, whiskers.  Hobbes is on the prowl.  He sees Calvin.  Calvin sees him, and starts to run.  Hobbes tracks him down, leaps, and pounces on Calvin.  They fight.  In bed, Hobbes is asleep, gnawing on his pillow, while Calvin stares.  Hobbes wakes and looks at the pillow, all torn to pieces.  Calvin is looking at it in horror.  Hobbes smiles, yawns, and goes back to sleep.  Calvin pulls his covers up tight and looks at Hobbes with wide eyes.
    characters: [calvin, hobbes]
  "19920323":
    transcript: SMASH ping ping ping kritch krunch. He's a tricky devil, but I'll get him sooner or later! Apparantly I rate just below BUGS with her! And she complains you don't help out around the house.
    description: SMASH!  Mom runs into the other room to see Calvin with a baseball bat.  The chair is knocked over, and the lamp is broken.  Calvin says he's a tricky devil, but he'll get him sooner or later.  Mom throws Calvin outside.  Sitting against a tree, Calvin tells Hobbes apparently he rates just below bugs with Mom.  Hobbes says that she complains Calvin doesn't help around the house.
    characters: [calvin, hobbes, mom]
  "19920324":
    transcript: Wimp! Oh... OH YEAH?? What REALLY bugs me is knowing I'll probably come up with a much sharper retort sometime tonight.
    description: Moe shoves Calvin down, calling him a wimp.  Calvin shakes his fist at Moe and says "Oh yeah".  He brushes himself off.  Calvin says what really bugs him is knowing he'll probably come up with a much sharper retort sometime tonight.
    characters: [calvin, moe]
  "19920325":
    transcript: Calvin, can you tell us what Lewis and Clark did? No, but I can recite the secret superhero origin of each member of Captain Napalm's thermo-nuclear league of libery. See me after class, Calvin. I'm not dumb. I just have a command of thoroughly useless information.
    description: Miss Wormwood asks if Calvin can tell her what Lewis and Clark did.  Calvin says no, but he offers to recite the secret superhero origin of each member of Captain Napalm's Thermonuclear League of Liberty.  Miss Wormwood tells him to see her after class.  Calvin dejectedly says he's not dumb.  He just has a command of thoroughly useless information.
    characters: [calvin, wormwood]
  "19920326":
    transcript: Did you even read the history chapter I assigned? I tried to, Miss Wormwood. But the book publisher didn't use the proper print fixative. Needless to say, when I picked up the book, all the letters slid off the pages and fell on the floor in a heap of gibberish. I think my excuses need to be less extemporaenous.
    description: Miss Wormwood asks Calvin if he read the history chapter she assigned.  Calvin says he tried, but the book publisher didn't use the proper print fixative.  When he picked up the book, all the letters slid off the pages and fell on the floor.  As he walks to the principal's office, Calvin says his excuses need to be less extemporaneous.
    characters: [calvin, wormwood]
  "19920327":
    transcript: County library? Reference desk, please? Hello? Yes, I need a word definition. Well, that's the problem. I don't know how to spell it and I'm not allowed to say it. Could you just rattle off all the swear words you know, and I'll stop you when... hello? See if I ever vote for their tax levies.
    description: Calvin calls the county library.  He asks the reference desk for a word definition.  He tells them he doesn't know how to spell it, and he's not allowed to say it.  He suggests if they rattle off all the swear words they know, he'll stop them when he hears it.  They hang up on him.  He says they'll see if he ever votes for their tax levies.
    characters: [calvin]
  "19920328":
    transcript: I don't need a bath! I can stay clean without one! Look, I'll LICK myself clean! That's what Hobbes does! See, I'm getting clean just like him! Nice going.
    description: Calvin runs from Mom, saying he doesn't need a bath.  He says he'll lick himself clean.  He says that's what Hobbes does.  He says he's getting clean like him.  Later, Calvin is wrapped in a towel, having had a bath.  Hobbes looks out from the wash machine, where he, also, has been cleaned.  He tells Calvin, "Nice going".
    characters: [calvin, hobbes, mom]
  "19920329":
    transcript: "... so if we subtract five from... OUIR FEARLESS HERO ESCAPES! We join the valiant Spaceman Spiff as he flees his bloatoid captors! Our hero scrambles into his waiting spacecraft! Spiff pressurizes the magnetronic altitude-o-lators and hits the turbo hyper-thrust drive! Instantly our hero blasts to escape velocity! Half a micromoment later, Spiff is just another speck in the infinite sea of outer space! Alone and free in an endless frontier! Free to roam the heavens in man's noble quest to investigate the weirdness of the universe! Whee, what fun! I'm glad you could come home so early! C'mon ol' buddy! Let's go exploring and find some gross bugs! Hello? ... speaking... HE WHAT?!"
    description: Calvin darts out of the classroom.  Spaceman Spiff flees his Bloatoid captors.  He scrambles into his spacecraft.  He hits the hyper-thrust drive.  He's soon just another speck in the infinite sea of outer space.  He's free to roam the heavens in man's noble quest to investigate the weirdness of the universe.  Outside, Hobbes is happy Calvin could come home so early.  Calvin suggests they go exploring and find some gross bugs.  Inside, Mom answers the phone.  The school tells her what happened.
    characters: [calvin, hobbes, mom, wormwood, spiff]
    source: s-anand+seligman+miraheze
  "19920330":
    transcript: You have a question, Calvin? Yes! What assurance do I have that this education is adequately preparing me for the 21st century? Am I getting the skills I'll need to effectively compete in a tough, global economy? I want a high-paying job when I get out of here! I want opportunity! In that case, young man, I suggest you start working harder. What you get out of school depends on what you put into it. Oh. Then forget it.
    description: Calvin asks Miss Wormwood what assurance he has that this education is preparing him for the 21st century.  He asks if he's getting the skills to effectively compete in a global economy.  He wants a high-paying job when he gets out of school.  Miss Wormwood suggests he start working harder.  She explains you get out of school what you put into it.  Calvin says to forget it then.
    characters: [calvin, wormwood]
  "19920331":
    transcript: Whatcha doing? Dad wants to mow the lawn, so he's making me pick up sticks. He said I might learn something about the satisfaction that comes from a job well done. And did you? I suppose so. I think he's trying to tell me there is none.
    description: Calvin is picking up sticks in the yard.  Dad wants to mow the lawn.  Dad told Calvin he might learn something about the satisfaction that comes from a job well done.  Hobbes asks if he did.  Calvin says he supposes so.  He thinks Dad is trying to tell him there is none.
    characters: [calvin, hobbes]
  "19920401":
    transcript: My tiger is deep in somnolent sleep, dreaming of chases remembered! His keen eyes are glinting! He dreams of a sprinting Sambar who'll soon be dismembered! Hmmmmmmm
    description: Hobbes lies on the ground dozing, while Calvin stands behind him.  Calvin tells a short poem about his tiger being asleep, dreaming of a sprinting sambar who'll soon be dismembered.  Calvin walks away, while Hobbes hums contentedly in his sleep.
    characters: [calvin, hobbes]
  "19920402":
    transcript: This article says that by age six, most children have watched 5,000 hours of TV - a quarter of their waking lives! I haven't watched that much! Think of all the great shows I've missed! I've been deprived of cultural references! I'm ignorant of countless amazing products! Hurry! If I watch TV until bedtime, I can get in a few precious extra hours and catch up a bit! Remedial vegetation. Help me learn this theme song, OK?
    description: Calvin says an article he's reading says by age six, most children have watched 5000 hours of TV.  Calvin says he hasn't watched that much.  He complains about being deprived of cultural references and being ignorant of countless amazing products.  He rushes off saying he can get in a few extra hours of TV watching before bedtime.  As Calvin watches TV, Hobbes says it's remedial vegetation.
    characters: [calvin, hobbes]
  "19920403":
    transcript: I think our newspaper needs a new advice columnist, so I'm applying for the job. See, I've written some sample answers to people who write in. "Stop whining and get a life, bozo." "Don't tell ME your stupid problems. I've got plenty of my own." "Go soak your head, you big baby." "Want some advice? Drop dead." I guess that covers about everything. Can you imagine doing this for MONEY? What a racket!
    description: Calvin applies for a job as a newspaper advice columnist.  He shows Hobbes some sample answers to people who write in.  Hobbes reads "Stop whining and get a life, Bozo".  He reads three others that read much the same way.  Hobbes tells him that covers about everything.  Calvin asks if he can imagine doing that for money.  He calls it a racket.
    characters: [calvin, hobbes]
  "19920404":
    transcript: Who ees thees Kählveen?
    description: Mom sees a broken vase.  She sees bugs on the floor.  She races upstairs to Calvin's bedroom.  She angrily opens the door.  Calvin, with fake nose and glasses asks "who ees thees Kahlveen".
    characters: [calvin, mom]
  "19920405":
    transcript: ""
    description: Mom wakes Calvin up.  He yawns, gets out of bed and gets dressed.  Suddenly, a wind starts blowing his clothes off, rolls him back into bed, and covers him up.  Mom comes in complaining he hasn't gotten up.  Calvin tries to explain.
    characters: [calvin, mom]
  "19920406":
    transcript: Do you believe in the devil? You know, a supreme evil being dedicated to the temptation, corruption, and destruction of man? I'm not sure man needs the help. You just can't talk to animals about these things.
    description: Calvin asks Hobbes if he believes in the devil, a being dedicated to the corruption and destruction of man.  Hobbes tells him he isn't sure man needs the help.  Calvin says you just can't talk to animals about these things.
    characters: [calvin, hobbes]
  "19920407":
    transcript: What's this? Try it. What's in here? Grubs?? Try it. That means I'm going to hate it, right? JUST TRY IT! She's mad because I broke her code.
    description: At the dinner table, Calvin asks what the dinner is.  Mom tells him to try it.  He asks if grubs are in it.  Mom tells him to try it.  Calvin holds his nose and asks if that means he's going to hate it.  Mom yells for him to try it.  Calvin says she's mad because he broke her code.
    characters: [calvin, mom]
  "19920408":
    transcript: If I've learned one thing in life, it's that everyone has his price. Raise the ante high enough, and there's no such thing as scruples! People will do ANYthing if the price is right! What's YOUR price? Two bucks cold cash up front. I don't know which is worse... that everyone has his price, or that the price is always so low. I'd make mine higher, but it's hard to find buyers as it is.
    description: Going down the hill in the wagon, Calvin says he's learned that everyone has his prices.  If you raise the ante enough, there's no such thing as scruples.  People will do anything if the price is right.  Hobbes asks what his price is.  Calvin tells him two bucks cash, up front.  Hobbes doesn't know which is worse, that everyone has a price or that the price is always so low.  Calvin offers that he'd make his price higher, but it's hard finding buyers as it is.
    characters: [calvin, hobbes]
  "19920409":
    transcript: Whatcha doin', Dad? I'm busy trying to fix something. Why bother? On the rare occasions when you know what the problem is, you usually make it worse and hurt yourself in the process! I wish I'd noticed the bandage on his hand before I said that.
    description: Calvin asks Dad what he's doing.  Dad tells him that he's fixing something (his bicycle).  Calvin asks why he bothers.  He says when Dad rarely knows what the problem is, then makes it worse and hurts himself in the process.  Calvin runs as tools are thrown at him.  Calvin says he wishes he'd noticed the bandage on Dad's hand before he said that.
    characters: [calvin, dad]
  "19920410":
    transcript: I'm going on a bike ride. What's so funny? Nothing. Have a good time. Look, I didn't design this outfit! It's PRACTICAL! Hey Dad, how'd you get your head stuck in a bowling ball? Ha! Next time, I'll squirt them both with my water bottle.
    description: Dad says he's going on a bike ride.  He stands with his helmet, fanny pack, and riding shorts.  Mom chuckles, and Dad asks what's so funny.  Dad says he didn't design his outfit, it's practical.  Calvin asks how he got his head stuck in a bowling ball.  Dad rides off saying, next time he's going to squirt them with his water bottle.
    characters: [calvin, mom, dad]
  "19920411":
    transcript: Tigers have no ambition, no drive! They don't accomplish anything! How do you justify yourself?!
    description: Hobbes lies on the floor, while Calvin says tigers have no ambition or drive.  He asks Hobbes how he justifies himself.  Hobbes keeps lying there.  Calvin joins him, and they both lie down.
    characters: [calvin, hobbes]
  "19920412":
    transcript: Susie, would you do me a really big favor? No. Pleeeeease?? It's nothing bad. What is it? Just go up to my house, open the front door, and yell, "I'm home." Why should I? Um... it's a surprise. I mean, no reason. I just dare you. Well forget it. C'mon, there's nothing to it! Look, I'll give you a quarter if you'll do it! OK. Oh man, this is going to be great! Yes! Yes! I'm opening the door... She'll never know what hit her! Hee hee hee! I'M HOME! Thanks for the quarter, sucker. No wait! It didn't happen! Say it again! Doggone it! What's wrong with that furball?? Where's his killer instinct when you really ... WAAA KAPOW! Never never never never NEVER trust a tiger. I can always tell when it's you by the bad smell! Yoo hoo hoo!
    description: Calvin asks Susie to do him a big favor.  He asks her to go to his house, open the front door, and yell that she's home.  Susie asks why.  Calvin says it's just a dare.  Susie doesn't want to.   Calvin gives her a quarter to do it.  Calvin stands at the bottom of the steps as Susie opens the door.  He knows this is going to be great.  Susie yells "I'm home".  Calvin laughs that she won't know what hit her. Susie turns around and thanks Calvin for the quarter.  Calvin angrily heads for the door, wondering where Hobbes' killer instinct is.  KAPOW!  Hobbes grabs Calvin and sails off the steps.  Calvin, lying on the ground, says never trust a tiger.  Hobbes happily runs off saying he can always tell when it's Calvin by the bad smell.
    characters: [calvin, hobbes, susie]
    source: s-anand+seligman+miraheze
  "19920413":
    transcript: I've decided to believe in astrology and horoscopes. Really? You bet. It only makes sense that every facet of our daily lives should depend upon the position of celestial bodies hundreds of millions of miles away. Look here. Today I'll have "many key policies implemented". I get to have my way! Oh those mischievous planets. The newspaper couldn't print it if it weren't true!
    description: Calvin decides he'll believe in astrology and horoscopes.  He says it only makes sense every facet of their daily lives should depend on the position of celestial bodies millions of miles away.  Calvin points to the paper, which has a horoscope which reads "Many key policies implemented".  He says he has to have his way.  Hobbes can't believe those mischievous planets.  Calvin says the newspaper couldn't print it if it wasn't true.
    characters: [calvin, hobbes]
  "19920414":
    transcript: My horoscope says, "Turnabout means circumstances in your favour. Assert views in a confident manner. Lunar cycle high, many of your key policies will be implemented." Isn't that great? Today I'm fated to get my way! The heavens decree it! So what are your "key policies"? First, obviously, is "Don't do homework." C'mon, let's go out and play! Here comes your Mom and it looks like she has a bone to pick with the moon. Ha! Watch me assert my views in a confident manner!
    description: Calvin reads his horoscope.  He says he's fated to get his way.  Hobbes asks what his key policies are.  As they go outside to play, Calvin says the first is "don't do homework".  Later, Hobbes notices Mom coming over.  He says it looks like she has a bone to pick with the moon.  Calvin says he'll assert his views in a confident manner.
    characters: [calvin, hobbes]
  "19920415":
    transcript: Your Mom didn't care much about the lunar sanction of your no-homework policy, did she? Hmph. Well, my horoscope said, "Many key policies will be implement." Not ALL of them. Besides, it says to expect a turnabout in my favor. Mom will relent next time for sure. What are your other key policies then? No baths, stay up late, don't go to school... THESE are the ones that will be implemented. Maybe the astrologer was looking through the wrong end of the telescope. C'mon moon, do your stuff!
    description: Calvin is doing homework.  Hobbes says Mom didn't care about the lunar sanction of his no homework policy.  Calvin says the horoscope said many of his policies would be implemented, not all of them.  It says to expect a turnabout in his favor.  Calvin figures that means Mom will relent next time.  Hobbes asks what Calvin's other key policies are.  No baths, don't go to school, stay up late.  Those are the ones that will be implemented.  Hobbes wonders if the astrologer was looking through the wrong end of the telescope.
    characters: [calvin, hobbes]
  "19920416":
    transcript: I thought I told you to take your bath. Sorry, Mom. You have no say in this. You're in for a big surprise, buster. Circumstances are going to turn in my favor! That's what my horosscope says! All human affairs are determined by stars and planets, and today they say my key policies will be implemented. That means no bath and no bedtime! By golly, it's not good to thwart the intentions of the universe! Fate just isn't what it used to be.
    description: Mom tells Calvin to take a bath, but Calvin says she has no say in the matter.  Mom pushes him along.  He says his horoscope says circumstances will turn in his favor.  He says all human affairs are determined by stars and planets.  They say his key policies will be implemented.  That means no bath and no bedtime.  In the tub, Calvin says it's not good to thwart the intentions of the universe.
    characters: [calvin, hobbes, mom]
  "19920417":
    transcript: I don't understand this! Not a single part of my horoscope came true! My policies weren't implemented and circumstances didn't turn in my favor! Just the opposite, in fact! What went wrong?! I thought this stuff was based on planets and stars! How could those be misread? What kind of science IS this?! I'm sure any scientist would give you a categorical answer. Maybe tomorrow's horoscope will run a correction and apology.
    description: Calvin complains that not a single part of his horoscope came true.  He wonders what went wrong.  How could planets and stars be misread?  What kind of science is this?  Calvin wonders if tomorrow's horoscope will run a correction and apology.
    characters: [calvin, hobbes]
  "19920418":
    transcript: Did today's horoscope print a retraction of yesterday's prediction? No, there's just a new one for today. What's it say? Yours says, "Popularity zooms upward. New encounters pay big dividends." Hmm, that's good. Wait, it goes on. "Emphasize romance. Opposite sex finds you irresistible. Lucky day for love." OH NO! I bet I know what the big dividends are! Woo woo woo!
    description: Calvin asks if the horoscope has a retraction.  Hobbes says no, there is just a new one for today.  He reads it to Calvin.  It mentions popularity rising and big dividends.  Calvin figures that's good.  Hobbes continues.  It mentions emphasizing romance.  The opposite sex finds him irresistible.  Calvin is horrified.  Hobbes suggests that he knows what the big dividends are.
    characters: [calvin, hobbes]
  "19920419":
    transcript: Isn't it strange that evolution would give us a sense of homor? When you think about it, it's weird that we have a physiological response to absurdity. We LAUGH at nonsense. We LIKE it. We think it's funny. Don't you think it's odd that we appreciate absurdity? Why would we develop that way? How does it benefit us? I suppose if we couldn't laugh at things that don't make sense, we couldn't react to a lot of life. I can't tell if that's funny or really scary.
    description: Walking in the woods, Calvin says it's strange evolution would give them a sense of humor.  He thinks it's weird they have a physiological response to absurdity.  He asks Hobbes if it isn't odd they appreciate absurdity.  He asks how a sense of humor benefits them.  Hobbes offers that if they couldn't laugh at things that don't make sense, they couldn't react to a lot of life.  Hobbes walks off.  Calvin says he can't tell if that's funny or really scary.
    characters: [calvin, hobbes]
    source: s-anand+seligman+miraheze
  "19920420":
    transcript: Don't make me go to school! Please don't make me! Help! Leggo! Ow! Stop! You don't understand! My horoscope says I'm irresistible to girls today! I'm too popular! I'm going to get big dividends! Augghhh! What if Susie kisses me?! I don't want romance! I hate Susie! Call me in sick! Help! Dear, I got him! Grab his feet while I pry his fingers loose! PUH-LEEZE!! I wonder what it would cost to rent a place in town.
    description: Mom chases Calvin to go to school.  He complains his horoscope says he's irresistible to girls today.  He keeps running, asking what if Susie kisses him.  Dad watches all this while reading the paper.  Mom catches Calvin and yells for Dad to get his feet while she pries his fingers loose.  Dad wonders what it would cost to rent a place in town.
    characters: [calvin, mom, dad]
  "19920421":
    transcript: Maybe today's horoscope won't come true. I don't WANT a lucky day for love! "Opposite sex finds you irresistible." Hee hee hee! I don't believe in astrology any more! It's all phony! Yeah, that's right! Much smoochies! Mm-mm! Yow wow! Stop it! Yesterday's predictions didn't come true, so I'm sure today's won't either! I'm not worried! When's the wedding?? Should I wear my spats?? In a minute, you'll be wearing a BODY CAST! TRY it, lover boy! We'll see how you kiss girls with a fat lip!
    description: At the bus stop, Calvin says maybe today's horoscope won't come true.  Hobbes teases him about the horoscope saying "opposite sex finds you irresistible".  Calvin says he doesn't believe it astrology anymore.  It's all phony.  Hobbes keeps teasing Calvin.  Calvin says yesterday's prediction didn't come true, so today's won't either.  Hobbes asks when the wedding is.  He asks if he should wear his spats.  Calvin starts fighting with Hobbes, saying Hobbes will be wearing a body cast.  Hobbes says they'll see how Calvin kisses girls with a fat lip.
    characters: [calvin, hobbes]
  "19920422":
    transcript: Take it back! I'm never getting married! Never! Love 'em and leave 'em, eh? You rake! That does it! I'm gonna knock you into next week! Wait! Wait! Susie's coming! What? She is? AUGH! She IS! I've got to discourage romance! You can't! Smoldering passion is your fate! Gosh, Calvin, the dirt covering your features is a big improvement. Oh no, it's true! I'm a love magnet!
    description: They continue fighting, while Calvin says he's never getting married.  Here come Susie.  Calvin says he has to discourage romance.  Hobbes says smoldering passion is his fate.  Susie says the dirt covering Calvin's features is a big improvement.  Calvin whispers that it's true.  He's a love magnet.
    characters: [calvin, hobbes, susie]
  "19920423":
    transcript: Stay away, Susie! I don't want any big dividends, got it? Don't listen to Hobbes! What? The stars and the planets are doing this! I can't help it! My aura is uncontrollable! What? It's the bus! The bus is here! Whee! I'm safe! You can't do anything now! Ha ha! I'm off to school! Hoorayy! What? The way Calvin's brain is wired, you can almost hear the fuses blowing.
    description: Calvin tells Susie to stay away.  He says the stars and planets are doing this.  His aura is uncontrollable.  Susie wonders what he's talking about.  Calvin races to the bus, saying he's safe.  He's happy he's off to school.  Susie walks to the bus, saying the way Calvin's brain is wired, you can almost hear the fuses blowing.
    characters: [calvin, hobbes, susie]
  "19920424":
    transcript: So Susie didn't kiss you today? Nope! In fact, I put a worm in her hair, she knocked me down and kicked me in the shins! That doesn't sound like zooming popularity. Nope! My horoscope was completely wrong again! The planets obviously have no influence on me! What a relief to know my life isn't controlled by outside forces! I'm the master of my own fate! ... to a point, of course. The paper should print MOM's daily predictions. THOSE sure come true.
    description: Hobbes asks Calvin if Susie kissed him.  Calvin says that after he put the worm in her hair, she knocked him down and kicked him.  Calvin says his horoscope was completely wrong again.  The planets have no influence on him.  He says it's a relief to know his life isn't controlled by outside forces.  He's a master of his own fate.  Later, in the bathtub, Hobbes adds that is true, to a point.  Calvin says Mom's predictions should be in the paper.  Those sure come true.
    characters: [calvin, hobbes]
  "19920425":
    transcript: I've been thinking about this astrology stuff. Everyone wants to know what the future holds, but you just have to wait till it happens. So really, the best preparation for the future is to take the present and ... WHOOP! AAUGHH! ... think about what you're doing? No, get yourself a good luck charm. Man, here comes ANOTHER bath!
    description: Calvin says everyone wants to know what the future holds, but you have to wait until it happens. The best preparation is to take the present, and....  Calvin trips over a rock and falls into some mud.  Hobbes finishes the sentence with ...think about what you're doing.  Calvin gets up and tells Hobbes no, ...get yourself a good luck charm.
    characters: [calvin, hobbes]
  "19920426":
    transcript: Oh no! Look at poor Calvin! What's gone wrong? He's a crude black outline barely containing garish color! What a horrible fate! His eyes don't even point the same direction! Each eye sees a different view! His nostrils are on the front of his nose like a pig! His ears are just flaps on his head! And what's this stuff on top? Is that supposed to be HAIR?! AAUGHH! Calvin's hands are balls with sticks in them! He doesn't even have the right number of fingers! Where are his thumbs?? And his feet! They aren't the same size! They face out sideways! How can Calvin stand up? Who knows? Look at his moronic expression! His face reveals no spark of intelligence! Calvin is devoid of reality and substance! How can he be saved?? What can be done?? Here we go! Ha ha. RRRRRGGHH! I hate drawing! What a waste of time! Gee, it was getting pretty goot at the end.
    description: Calvin looks like a childishly drawn person with stick fingers.  What has happened to Calvin?  He is a crude black outline barely containing garish color.  His eyes don't point the same direction.  His nostrils look like a pig's.  His hands are balls with sticks in them.  His feet face out sideways.  How can he stand up?  His face shows no spark of intelligence.  What can be done?  He suddenly has a beard and horns.  Then he's scribbled upon.  Calvin yells that he hates drawing.  He says it's a waste of time.  Hobbes thought it was getting pretty good at the end.
    characters: [calvin, hobbes]
    source: s-anand+seligman+miraheze
  "19920427":
    transcript: Hey Mom, can I get some plastic surgery? All the celebrities do it! Honey, celebrities need the fat sucked out of their brains, not their bottoms. What on earth do you want changed? You're fine the way you are! I want another eye put in my forehead.
    description: Calvin asks if he can get plastic surgery like all the celebrities do.  Mom tells him celebrities need the fat sucked out of their brains, not their bottoms.  She says he's fine the way he is.  Calvin tells her he wants another eye in his forehead.
    characters: [calvin, mom]
  "19920428":
    transcript: I think we need a new policy in this house. And what's that? From now on, whenever you tell me things, I don't want to hear any reasons, explanations, subtlety or context. I just want ten-second sound bites, OK? So much for THAT policy.
    description: Calvin tells Dad they need a new policy in the house.  Whenever Dad tells him things, Calvin doesn't want any explanations.  He only wants ten second sound bites.  Calvin walks off, covering his ears. He says "So much for that policy".
    characters: [calvin, dad]
  "19920429":
    transcript: 'For school, we''re supposed to write a paragraph about what our Dads do. "Dad: the paragraph". Catchy title, huh? "What does my Dad do? Mostly, he gets on my nerves. The end." You may get a point for succinctness. Well, what else is there to say?!'
    description: Calvin is supposed to write a paragraph about what Dads do.  Hobbes reads the paper.  "Mostly he gets on my nerves.  The end".  Hobbes suggests he might get a point for succinctness.  Calvin asks what else there is to say.
    characters: [calvin, hobbes]
  "19920430":
    transcript: Bad news, Dad. The character issue is killing you in the polls. WHAT character issue?! I've got GREAT character! I've got character up to here! That's what we hate. My only flaw is a preternatural intolerence of pesky kids.
    description: Calvin's poll says the character issue is killing Dad.  Dad says he's got great character.  Calvin says that's what he they hate.  Dad says his only flaw is a preternatural intolerance of pesky kids.
    characters: [calvin, dad]
  "19920501":
    transcript: Paul Gauguin asked, "Whence do we come? What are we? Where are we going?" Well, I don't know about anyone else, but I came from my room, I'm a kid with big plans, and I'm going outside! See ya later! Say, who the heck is Paul Gauguin anyway?
    description: Calvin quotes Paul Gauguin to Mom.  He asks "whence do we come?  what are we?  where are we going?"  He walks away saying he came from his room, he's a kid with big plans, and he's going outside.  Mom looks up puzzled.  Calvin asks who Paul Gauguin is anyway.
    characters: [calvin, mom]
  "19920502":
    transcript: Look at THIS, Dad! I've got five dollars in here! I'm rich! I've been saving my change for weeks and weeks, and look how much I've got! Guess what I'm going to do with it! Open a savings account? I'll bet I know why you guys don't get invited to parties. Every time you make a deposit, you can think, "Oh boy, another two minutes at college."
    description: Calvin shows Dad five dollars in his jar.  He says he's rich.  Calvin says he's been saving for weeks.  Dad asks if he's going to open a savings account.  Calvin looks at the money.  He tells Dad he knows why he and Mom don't get invited to parties.  Dad says every time he makes a deposit, he can think "another two minutes at college".
    characters: [calvin, dad]
  "19920503":
    transcript: Uh oh. STOP THIS RIGHT NOW! I had big plans outside today and I don't want to see them ruined. HEY! ARE YOU LISTENING?! Stop raining! I mean it! BOOMM! Oh NO! You want to play rough, do you? FINE! It's man against the elements! Conscious being versus insentient nature! My wits against your force! WE'LL see who triumphs! DO YOUR WORST! C'MON. LET'S SEE WHAT YOU'VE GOT! You can't crush the human spirit! On behalf of all earthly life, I defy you!! Ha ha! This is just a little bath! Big deal! I think I'll take off my clothes and splash around! What do you say to THAT?! OW! OW! WHAT'S WITH THE HAIL?! THAT'S FIGHTING DIRTY! NO FAIR!! Are you trying to KILL me?! OW! What's going with you?! Ow! Ow! I'm going in! Ow! I quit! I quit! I'll bet there's an explanation for this, and I'll bet I don't want to hear it. The universe has an attitude, Mom!
    description: Calvin stands outside yelling at the skies to stop raining.  As the rain intensifies, he says it's man against the elements.  It's his wits against nature's force.  Calvin yells for the sky to do its worst.  He defies nature on behalf of all earthly life.  He takes off his clothes and splashes around.  He laughs.  Then it starts hailing.  He yells that's fighting dirty.  He runs to the house, yelling that he quits.  Mom opens the door for him and says there's an explanation for this, and she doesn't want to hear it.  Calvin says the universe has an attitude.
    characters: [calvin, mom]
    source: s-anand+seligman+miraheze
  "19920504":
    transcript: My gum has lost its flavor. When that happens, I don't spit it out. I just add a new piece. After a few packs, it's like chewing a big, soggy sock! My jaws ache and I can't close my lips, so I wheeze through my open mouth and drool! An orifice is an amusing thing, all right. Ith funny how you neffa thee gwown-upth do thith.
    description: Calvin tells Hobbes his gum has lost its flavor.  He adds another piece instead of spitting the old one out.  After a few packs, it's like chewing a big, soggy sock.  Hobbes is disgusted.  He says an orifice is an amusing thing, all right.
    characters: [calvin, hobbes]
  "19920505":
    transcript: Oh boy, the new issue of "Chewing"! You get a magazine? Wow, this looks great! "Special sugarless gum issue - hcoosing an artificial sweetener that's right for YOU... Tongue exercises for bigger bubbles... Rad fashion kneepads for walking and chewing... PLUS an interview with Bazooka Joe!" See, it's all target marketing! Advertisers don't waste their time on mass audiences any more. They find your special interest and they nail you! As if advertising wasn't intrusive enough before. Ooh, the '92 spearmints are out! I gotta get to a store!
    description: Calvin gets the new issue of Chewing magazine.  He reads the cover to find the different stories.  Tongue exercises, fashion kneepads, and an interview with Bazooka Joe.  Calvin explains to Hobbes it's all target marketing.  They find your special interest and nail you.  Hobbes comments that advertising was intrusive enough before.  Calvin sees the '92 Spearmints are out.  He has to get to a store.
    characters: [calvin, hobbes]
  "19920506":
    transcript: I can't believe there's a magazine for gum chewers. Heck, there must be a DOZEN such magazines. Each appeals to a different faction. "Chewing" is high-gloss, literate and sophisticated. "Gum Action" goes for the gonzo chewers. "Chewers Illustrated" aims at the vintage gum collectors, and so on! Each one encourages you to think you belong to an elite clique, so advertisers can appeal to your ego and get you to cultivate an image that sets you apart from the crowd. It's the divide and conquer trick. I wonder whatever happened to the melting pot. There's no money in it.
    description: Hobbes can't believe there's a magazine for gum chewers.  Calvin explains there are many such magazines.  Each one encourages you to think you belong to an elite clique.  Hobbes wonders whatever happened to the melting pot.  Calvin says there's no money in it.
    characters: [calvin, hobbes]
  "19920507":
    transcript: Here's an interesting article. The top five gum brands are compared in terms of flavor retention, elasticity, bubble capacity and chewing rebound. The computer graph shows the results, compensating for various saliva acidities. If you know your pH, this really helps you choose the proper gum for your chewing style. What kind of nut would CARE about all this?! EVERYONE! This is hard data! It lets you quantify your enjoyment! I thought fun was supposed be FUN. Well I prefer to trust the experts.
    description: Calvin reads an article comparing the top five gum brands.  He shows Hobbes graphs so that you can choose the proper gum for your chewing style.  Hobbes asks what kind of nut would care about this.  Calvin tells him everyone.  You can quantify your enjoyment.  Hobbes thought fun was supposed to be fun.  Calvin prefers to trust the experts.
    characters: [calvin, hobbes]
  "19920508":
    transcript: Here's an ad for a new gum called "Hyperbubble", and it says, "If you're not chewing Hyperbubble, you might as well be chewing cud." Ooh, great copy! Gosh, am I cool enough to chew Hyperbubble? Maybe I'm NOT! Maybe if you chew Hyperbubble, you BECOME cool! Or maybe if you chew it, everyone ASSUMES you're cool, is it doesn't matter if you are or not! What do you think? Should I buy some? If your emotional security depends on satisfying a need you didn't have until you read the ad, go ahead. I think I will! Boy, I'm glad I get this magazine!
    description: Calvin reads an ad for a new gum.  He wonders if he's cool enough to chew it.  He wonders if chewing it would make him cool.  Calvin asks Hobbes if he should buy some.  Hobbes tells him to do it if his emotional security depends on satisfying a need Calvin didn't have before reading the ad.
    characters: [calvin, hobbes]
  "19920509":
    transcript: YAHHH! RRGGHH munch munch munch. You're right. Food DOES taste better this way.
    description: Calvin peeks around a corner to see a box of Chocolate Frosted Sugar Bombs.  He leaps on it and tears it apart, scattering cereal everywhere.  He sits munching the cereal off the floor.  He tells Hobbes that he was right, food does taste better that way.
    characters: [calvin, hobbes]
  "19920510":
    transcript: I never get to do anything REALLY fun. If you're bored, go clean your room.
    description: Calvin feels rumbling.  He looks outside to see brontosauruses walking past his house.  He hops on the head of one and rides off.  Calvin, with his stick horse, tells Mom he never gets to do anything really fun.  Mom tells him that if he's bored, he can clean his room.
    characters: [calvin, mom]
    source: s-anand+seligman+miraheze
  "19920511":
    transcript: As I, the maniacal tyrant, look down upon my mathetic subjects... I reflect on how their puny lives mean nothing to me except as the brute labor necessary to execute my mad designs! My lunatic whims are their laws! Ha ha ha! I thought I told you to gather the trash. Being a parent must be nice.
    description: Calvin has a crown and is standing in a treehouse.  The maniacal tyrant looks at his pathetic subjects.  Their lives mean nothing but labor necessary to execute his mad designs.  Mom comes outside and tells Calvin she told him to gather the trash.  Calvin carries a trash pail, saying being a parent must be nice.
    characters: [calvin, mom]
  "19920512":
    transcript: Outta my way, Twinky. A person can't be a doormat unless he allows himself to be one! I refuse to budge! SHOVE. Ack! Off! Ugh! I've got to stop reading those dumb advice columns.
    description: Moe threatens Calvin.  Calvin refuses to budge, saying a person can't be a doormat unless he allows himself to be one.  Moe pushes Calvin down and steps on him.  Calvin says he has to stop reading those dumb advice columns.
    characters: [calvin, moe]
  "19920513":
    transcript: RINGG, RINNG Hello, we are unable to come to the phone right now... ...so please leave a message at the sound of the click. *CLICK*
    description: Calvin answers the phone by saying they can't come to the phone.  He says to leave a message at the click.  He hangs up the phone.  CLICK!
    characters: [calvin]
  "19920514":
    transcript: Most people just muddle through their lives! They're passive and unmotivated! They lack ambition and drive! Not ME, though! I'm going to have an EPIC life! I'm going to wrestle the issue of the age and change the course of history! How are you going to do that? I'm going to sit here and wait, so opportunity will know where to find me when it's time to change the world. I wish I'd brought a book to read. Naah, it'll be any minute now.
    description: Calvin tells Hobbes most people muddle through their lives.  He says he's going to have an epic life.  He's going to wrestle the issues of the age and change history.  Hobbes asks how he'll do that.  Calvin explains he's going to sit and wait, so opportunity knows where to find him when it's time to change the world.  Lying against the tree, Hobbes wishes he'd brought a book to read.  Calvin says it will be any minute now.
    characters: [calvin, hobbes]
  "19920515":
    transcript: OUT! DARN!
    description: Calvin hits the ball into the air.  He grabs his glove, catches the ball, and calls "OUT!"  Calvin picks up the bat and yells "DARN!"
    characters: [calvin]
  "19920516":
    transcript: Our country was founded a very long time ago, roughly around 200 B.C. 200 B.C.?! "Before Calvin." THAT'S WHAT'S IMPORTANT!
    description: Calvin reads a report in front of the class.  He says the country was founded around 200 B.C.  Miss Wormwood asks what he means.  "Before Calvin" is the reply.  Calvin is sitting in the corner, on a stool, dunce cap on his head.  He says that's what's important.
    characters: [calvin, wormwood]
  "19920517":
    transcript: It's true, Hobbes, ignorance IS bliss! Once you know things, you start seeing problems everywhere... ...and once you see problems, you feel like you ought to try to fix them... ...and fixing problems always seems to require personal change... ...and change means doing things that aren't fun! I say phooey to that! But if you're wilfully stupid, you don't know any better, so you can keep doing whatever you like! The secret to happiness is short-term, stupid self-interest! We're heading for that cliff! I don't want to know about it. WAAAUGGHHH! I'm not sure I can stand so much bliss. Careful! We don't want to learn anything from this.
    description: Going down the hill in the wagon, Calvin says ignorance is bliss.  You start seeing problems everywhere, then you try to fix them.  Fixing problems seems to require personal change, and that means doing things that aren't fun.  Calvin says if you're willfully stupid, you can do whatever you like.  The secret to happiness is short-term, stupid self-interest.  Hobbes yells they're heading for the cliff.  Calvin covers his eyes and doesn't want to know about it.  Off they go!  Lying on the ground, Hobbes doesn't know if he can stand so much bliss.  Calvin says he doesn't want to learn anything from this.
    characters: [calvin, hobbes]
    source: s-anand+seligman+miraheze
  "19920518":
    transcript: When I grow up, I'm not going to read the newspaper and I'm not going to follow complex issues and I'm not going to vote. That way I can complain that the government doesn't represent me. Then, when everything goes down the tubes, I can say the system doesn't work and justify my further lack of participation. An ingeniously self-fulfilling plan. It's a lot more fun to blame things than to fix them.
    description: In the wagon, Calvin says he isn't going to read the newspaper, follow complex issues, or vote.  That way, he can complain the government doesn't represent him.  When everything fails, he can say the system doesn't work and justify a further lack of participating.  Hobbes calls it an ingeniously self-fulfilling plan.  Calvin says it's a lot more fun to blame things than to fix them.
    characters: [calvin, hobbes]
  "19920519":
    transcript: Aw gee, did the darn ol' sun move some MORE?? Oh hush.
    description: Hobbes wakes up, stretches, and walks over to the window.  He lies down again.  Calvin asks if the darn old sun moved some more.  Hobbes tells him to hush.
    characters: [calvin, hobbes]
  "19920520":
    transcript: This is the worst assignment ever! I'm supposed to think up a story, write it, and illustrate it by tomorrow! Do I look like a novelist?! This is impossible! I can't tell stories! What about your explanation of the noodle incident? THAT WASN'T A STORY! THAT WAS THE UNVARNISHED TRUTH! Oh, don't be so modest. You deserved a Pulitzer.
    description: Calvin complains about his assignment to think up a story, write and illustrate it.  He says he's not a novelist.  He can't tell stories.  Hobbes suggests he explains the noodle incident.  Calvin yells that wasn't a story, it was the unvarnished truth.  Hobbes says he's modest.  He says Calvin deserved a Pulitzer.
    characters: [calvin, hobbes]
  "19920521":
    transcript: Do you have an idea for your story yet? No, I'm waiting for inspiration. You can't just turn on creativity like a faucet. You have to be in the right mood. What mood is that? Last-minute panic.
    description: Calvin plays in his sandbox.  Hobbes asks if he has a story idea yet.  Calvin says he's has to be in the right mood.  Hobbes asks what mood that is.  Calvin says "last-minute panic".
    characters: [calvin, hobbes]
  "19920522":
    transcript: If you ask ME, these assignments don't teach you how to write. They teach you how to HATE to write. Deadlines, rules how to do it, grades... how can you be creating when someone's breathing down your neck? I guess you should try not to think about the end result too much and just have fun with the process of creating. Every time I do that, I end up in the school psychologist's office. Well, maybe not THAT much fun.
    description: Calvin complains these assignments don't teach you how to write.  They teach you how to hate to write.  He asks how you can be creative when someone's breathing down your neck.  Hobbes says not to think about the end result and just have fun with the process of creating.  Calvin says when he does that, he ends up in the school psychologist's office.
    characters: [calvin, hobbes]
  "19920523":
    transcript: Say, I'VE got an idea! For your story? No, I thought of a way I won't have to write one! Oh no. Hop in the time machine, Hobbes! We're going a few hours into the future! I'll have finished my story by then, so we'll just pick it up and bring it back to the present! That way I won't have to write it! Something doesn't make sense here, and I think it's me sitting in this box. Relax! We'll be back as soon as we go.
    description: Calvin has an idea.  Hobbes asks if it's for his story.  He says it's a way he won't have to write one.  He pulls out his time machine from the closet.  Calvin says he'll go into the future a few hours.  The story will be done by then, so he'll pick it up and bring it back to the present.  Hobbes says something doesn't make sense, and he thinks it's him sitting in the box.
    characters: [calvin, hobbes]
  "19920524":
    transcript: This meeting of G.R.O.S.S. (Get Rid Of Slimy girlS) will come to order, dictator-for-life Calvin presiding! Hail Calvin and Hobbes! On today's agenda, we'll make a list of what girls are GOOD for. Obviously, this will be a short meeting! Ha! First tiger Hobbes will record the list for posterity! OK, first, girls are good for water balloon targets! Ha ha! Second, they're good for NOTHING! Ha ha ha! Hee hee, slow down! Number three, girls are good for colonizing Pluto! Ah ha ha! What a great list! Number four, they're good for smooching! Hoo hoo! Number five is... WHAT?!? Did you say SMOOCHING?? What kind of treasonous, sissy idea is THAT?! Well, it's true. OOOG! AAACK! I got the dry heaves!! You're demoted from First Tiger to Tiger Bulk Rate! You can't supress the facts! I award myself a medal of valor! How would you know it's a fact?! Have you been a traitor to the cause?! I have my sources! Ow! This unleader-like behaviour will be noted in the club minutes! Have you been smooching the enemy?! Out with it!! YOU have! I saw it, so don't try to deny it! ME?! That's a filthy lie! You'll pay for this vile slander! Oh yeah? Your Mom kissed you right on the cheek last night, remember? ...Oh yeah... I guess Mom IS kind of a girl, sort of... See? According to club rules, you should be excommunicated. OK, Presidential pardons all around! Agreed! We'll add an amendment saying smooching is optional, if it's your Mom. This is such a great club!
    description: The meeting of G.R.O.S.S. comes to order.  They're making a list of what girls are good for.  Calvin starts by saying they're good for water balloon targets.  He adds they're also good for nothing.  Calvin says they're good for colonizing Pluto.  Hobbes says they're good for smooching.  Calvin is shocked.  He demotes Hobbes.  Hobbes declares you can't suppress facts.  Calvin asks how he knows it's a fact.  Calvin starts fighting with Hobbes.  Hobbes says he saw Calvin do it.  Hobbes says he saw Mom kiss Calvin on the cheek.  They stop fighting.  Calvin admits Mom is a girl.  Hobbes points out that according to club rules, he should be excommunicated.  They give presidential pardons all around.  Hobbes makes an amendment saying smooching is optional if it's your Mom.
    characters: [calvin, hobbes]
    source: s-anand+seligman
    review: "verified: checked against a source outside the corpus by the maintainer"
  "19920525":
    transcript: Vortex goggles on? Here we go! We'll jump ahead to my bedtime and pick up my completed homework from my own future! Then we'll return to the present and we can goof off the rest of the evening! Here we are! You must be the 8:30 Calvin. Did you have a good trip? No. Pst! Why do you always go on these things?
    description: Calvin and Hobbes time travel to the future.  They meet the 8:30 Calvin.   The 8:30 Hobbes asks the 6:30 Hobbes why he always goes on these things.
    characters: [calvin, hobbes]
  "19920526":
    transcript: Greetings, 8:30 Calvin and Hobbes! I'm 6:30 Calvin and this is 6:30 Hobbes! Charmed. Well, since we're YOU from the past, I suppose you know why we're here. Did you do the homework? Me?? No. NO?! Why not?? Because two hours ago, I went to the future to get it. Yeah, and here I am! Where is it?! That's what I said two hours ago! I knew this would never work. Right as always, Hobbes.
    description: The 6:30 Calvin asks if the homework is done.  It's not.  The 6:30 Calvin asks why not.  The 8:30 Calvin says that two hours ago, he went to the future to get it.   One Hobbes says he knew this would never work, and the other says he's right as always.
    characters: [calvin, hobbes]
  "19920527":
    transcript: Do you mean to say it's time for bed and you still haven't written our story for school?! I figured the story was already done! How could it be done if YOU didn't write it?! Obviously it had to be done before now, because it's 8:30 and I'm supposed to be in bed! Wait a minute! If the story had been written in YOUR past, that would mean I should've written it! Well, why didn't you?! Because I came to the future to pick it up when it was DONE! If you hadn't screwed up my past, your future wouldn't be like this.
    description: The 6:30 Calvin clarifies that it's time for bed, and the story isn't written.  The 8:30 Calvin thought the story was done.  The early Calvin asks how it could be done if he didn't write it.  The future Calvin says it had to be done before now, because he's supposed to be in bed.  The early Calvin says that means he should have written it.  The future Calvin asks why he didn't.  The early Calvin says he came to the future to pick it up.  The future Calvin says that if the earlier Calvin hadn't screwed up his past, the earlier Calvin's future wouldn't be like this.
    characters: [calvin]
  "19920528":
    transcript: Hold it. Let's figure this out. I'M you at 6:30 and YOU'RE me at 8:30. Neither of us did the homework. Right. That means the homework SHOULD'VE been done between my time and your time. Right. We needed to do it at 7:30. But the 7:30 Calvin clearly didn't do it, or you'd have it by now at 8:30. Yeah! This is HIS fault! That lazy little punk! He'll get us BOTH in trouble! Let's go get him!
    description: The two Calvins discuss things.  They decide the homework should have been done between their two times.  They decide it should have been done at 7:30.  They decide the 7:30 Calvin is a lazy little punk.  They decide to go get him.
    characters: [calvin]
  "19920529":
    transcript: Hobbeses, the 8:30 Calvin and I are going to go back to 7:30 and make THAT Calvin do the homework. We'll wait here. All this time travel makes us queasy. We'll be right back. Off we go! This HAS to be the least efficient way to write a paper. All this modern technology makes people try to do everything at once.
    description: The two Calvins go back to make the 7:30 Calvin do the homework.  The two Hobbes' talk.  One says this has to be the least efficient way to write a paper.  The other says all this modern technology makes people try to do everything at once.
    characters: [calvin, hobbes]
  "19920530":
    transcript: Ah ha! Here we are, right at 7:30! Yikes! My past and my future! Put down that comic book and do our homework! Yeah! Get to work, you loafer! Hey! Why should I do all the work? Either of you could do it too! But I didn't at 6:30 and now it's 7:30. And at 8:30 it will be too late. You're the last chance. Now are you gonna start writing or do we have to pound you? Go ahead and hit me! My FUTURE self will be the one who hurts! HEY!
    description: The two Calvins catch the 7:30 Calvin reading a comic book.  The 7:30 Calvin asks why he should do all the work.  The others could do it, too.  The 6:30 Calvin asks if the 7:30 Calvin will start writing or does he have to pound him.  The 7:30 Calvin tells him to go ahead.  It will be the future Calvin who hurts.  The 8:30 Calvin isn't so sure about this.
    characters: [calvin]
  "19920531":
    transcript: RINNGG! RRINGG RRINGG RRINGG... RING
    description: Calvin is falling asleep at his desk.  A bell rings.  He opens his desk and pulls out a phone.  He answers it, but that's not making the sound.  He tosses it aside and pulls out an alarm clock from the desk.  That's it!  Calvin looks up.  He's really in bed with his alarm ringing.  He sleepily gets out of bed.  Later, he's falling asleep at his desk.
    characters: [calvin]
  "19920601":
    transcript: You know, Hobbes, if the 7:30 Calvin is at all like the 6:30 and 8:30 Calvins, I'll bet he isn't going to write that story. You're right, Hobbes. Why don't WE write a story while we're waiting for them? Yeah! Calvin could use it for his class then. I'll write it down and you can illustrate it! OK, now what should our story be about? Calvin's not here. Let's write about HIM! Hee hee hee! Hoo hoo! Drawing Calvin is easy! You just make a big mouth and add some hair!
    description: The Hobbes' figure none of the Calvins will write the story.  They decide to write it.  They choose to write about Calvin.  One of the Hobbes' says it's easy to draw Calvin.  You just make a big mouth and add some hair.
    characters: [calvin, hobbes]
  "19920602":
    transcript: Look, guys, you can't gang up on ME! Oh yeah? Why not? Because we're all the same Calvin! In one hour, the 6:30 Calvin will be ME, and in another hour, we'll BOTH be the 8:30 Calvin. That means you guys will suffer whatever you do to me. Oh yeah. Oops. Whose dumb idea was this anyway? His? His!
    description: The 7:30 Calvin says the others can't gang up on him because they're all the same Calvin.  The 6:30 Calvin asks whose dumb idea this was.  They all point to each other.
    characters: [calvin]
  "19920603":
    transcript: We're back, but we didn't get the homework. Now it's 8:30 again and we're doomed. Here you go! Hobbes and I wrote a story for you while you were gone! You DID?? Ha ha! We're all done! We can go back to 6:30 now! Thanks, Hobbeses! You guys are life savers! Calvin? It's Mom! Hurry! Hobbes, get in! We'll be you in a couple hours! So long! Aren't you in bed yet? Don't come in! I'm... uh... changing into my PJs!
    description: The Calvins return to 8:30.  The Hobbes' give Calvin the story.  The 6:30 Calvin and Hobbes are going to return.  Mom calls for Calvin.  The 8:30 Calvin tells Mom not to come in.  He's changing into his PJs.
    characters: [calvin, hobbes, mom]
  "19920604":
    transcript: Did you write your story for class tomorrow? Sort of. What do you mean, "sort of"? Well, Hobbes helped and I had to do a lot of time traveling. Is your story written or not? Oh, it's written. I just haven't read it.
    description: Mom asks if Calvin wrote his story.  He says Hobbes helped, and he had to do a lot of time traveling.  Mom asks if the story is written.  Calvin says it is, but he hasn't read it.
    characters: [calvin, hobbes, mom]
  "19920605":
    transcript: All right, Calvin, go ahead. What's YOUR story about? I don't know yet, but I'm sure it's good! My story is entitled, "How Hobbes, the handsome tiger, saved the day... ...no thanks to Calvin, the time-traveling chowderhead." WHAT?! Is there a problem? There WILL be for a certain stripey furball when I get home.
    description: Miss Wormwood asks Calvin to read his story.  Calvin reads that Hobbes, the handsome tiger, saves the day.  He reads that Calvin is a time traveling chowderhead.  Miss Wormwood asks if there's a problem.  Calvin says there will be for a stripey furball when he gets home.
    characters: [calvin, wormwood]
  "19920606":
    transcript: OK, YOU! Me?? This story you wrote is about ME trying to get OUT of writing the STORY! You made my time traveling sound like LUNACY! And the illustration You drew the THREE of me fighting! I was the laughing-stock of the whole class! What grade did it get? Um... A+. She wrote, "Very creative. The 'tiger' narration was a clever touch. I'm glad you're finally applying yourself." ... BUT EVEN SO...!! A+? Maybe I should send this to the New Yorker.
    description: At home, Calvin complains to Hobbes about the story saying Calvin tried to get out of writing the story by time traveling.  Calvin complains the drawing was of three of him fighting.  He says he was a laughingstock.  Hobbes asks what grade he got.  Calvin says it was an "A+".  Miss Wormwood wrote the "tiger" narration was a clever touch and is glad he's finally applying himself.  Hobbes thinks he should send it to the New Yorker.
    characters: [calvin, hobbes]
  "19920607":
    transcript: Calvin, the commercial airline pilot, decides not to fly to St. Louis as scheduled! Calvin doesn't WANT to see St. Louis. Calvin wants to see the GRAND CANYON! Tourists on the rim wave to Calvin's screaming passengers as the jet roars into the gorge! ... UP CLOSE! What a view! It's an experience none will ever forget! Everyone will be glad later that Calvin took this scenic detour! If I was driving, that's where we'd go. Well, you're NOT driving, and Arizona is NOT on the way to the grocery store.
    description: Calvin, the commercial pilot, decides to see the Grand Canyon...up close.  The jet flies into the canyon.  Tourists on the rim wave at Calvin's screaming passengers.  After pulling out, Calvin says everyone will be glad later that Calvin took the scenic detour.  In the car's back seat, Calvin says if he was driving that's where they would go.  Mom says Calvin's not driving, and Arizona is not on the way to the grocery store.
    characters: [calvin, mom]
    source: s-anand+seligman+miraheze
  "19920608":
    transcript: Baseball is an intelligent sport. There's more to it than brute force. It may seem slow, but that's because it's a thinking man's game. There's a lot of strategy to consider. Especially the way WE play! Right! Now, the first person to discover twelfth base gets a ghost point and one free "Get out of jail"...
    description: Calvin says baseball is an intelligent sport.  He says it may seem slow, but that's because it's a thinking man's game.  There's a lot of strategy to consider.  Hobbes says "especially the way we play".  Calvin says the first person to discover 12th base gets a ghost point and one free "get out of jail" pass.
    characters: [calvin, hobbes]
  "19920609":
    transcript: You'll be proud to know I'm going to donate all the snot I sneeze to hospitals for mucus transfusions. Oh stop being disgusting, Calvin! Nobody needs THAT donated! What an idea! Oh. I have a jar for you to wash.
    description: At the dinner table, Calvin tells Mom he's donating all the snot he sneezes to hospitals for mucus transfusions.  Mom says nobody needs that donated.  Calvin keeps eating.  He tells her he has a jar for her to wash.
    characters: [calvin, mom]
  "19920610":
    transcript: Dad, where do babies come from? Is it true a stork leaves them swaddled in a bundle on the front step? In most cases, yes, but YOU were unceremoniously dumped down the chimney by a big, hairy pterodactyl. COOL! Explains a lot, doesn't it?
    description: Calvin asks Dad if babies come from a stork leaving them swaddled on the front step.  Dad says that's true in most cases, but that Calvin was dumped unceremoniously down the chimney by a hairy pterodactyl.  Calvin thinks that's cool.  Dad says that explains a lot.
    characters: [calvin, dad]
  "19920611":
    transcript: All? Eez thees der pooblic lahbrorry? Yah! I em beeg eemportant rezearcher oond I require eenglish voolgar zynonyms for disgustink body vunktions, yah? Allo? Allo? No luck? Those librarians are a sharp bunch.
    description: Calvin calls the library with a disguised voice.  He is looking for vulgar synonyms for body functions.  They hang up on him.  Calvin tells Hobbes librarians are a sharp bunch.
    characters: [calvin, hobbes]
  "19920612":
    transcript: This town just ain't big enough few the both of us! Yep, I reckon we'll have to annex part o' the county! Mom won't let us play with guns. I get to be the zoning board!
    description: Calvin and Hobbes have on cowboy hats.  Calvin says the town isn't big enough for the two of them.  Hobbes says they'll have to annex part of the county.  As they look at a map, Calvin says Mom won't let them play with guns.  Hobbes wants to be the zoning board.
    characters: [calvin, hobbes]
  "19920613":
    transcript: BUH-URRRRRRRRRRP! Good HEAVENS, Calvin! What do you say after that?! Great diaphragm control, huh? She'll be sorry when I'm a famous soloist for the orchestra. Maybe she thinks your pitch is off.
    description: Calvin belches at the dinner table.  Mom asks what he says after that.  Calvin offers "Great diaphragm control".  In bed, Calvin says she'll be sorry when he's a famous soloist for the orchestra.  Hobbes wonders if Mom thinks his pitch is off.
    characters: [calvin, hobbes, mom, dad]
  "19920614":
    transcript: Calvin the bug zips across the room in erratic loops... annoying everyone with his incessant whine and dizzying commotion! Worse still, he gets into the cookies, spreading filth and contamination everywhere! Yes, he's a disgusting menace to sanity and health! What a pest! Ha ha ha! What happened? I got swatted.
    description: Calvin, as a fly, zips around the room.  He annoys everyone with his incessant whine.  He gets into the cookies.  He's a menace to sanity and health.  He laughs.  Later, Calvin walks up to Hobbes while holding his rear.  Hobbes asks what happened.  Calvin says he got swatted.
    characters: [calvin, hobbes, mom, dad]
    source: s-anand+seligman+miraheze
  "19920615":
    transcript: This is the dumbest thing I've ever seen in my life! Yeah, well go soak your head! HEY, THAT'LL BE ONE DOLLAR!
    description: Calvin sits at a box offering great ideas for one dollar.  Susie comes up and says that's the dumbest thing she's seen.  Calvin tells her to go soak her head.  She walks off, and Calvin yells after her that she owes him a dollar.
    characters: [calvin, susie]
  "19920616":
    transcript: How do I know your ideas are great? It says so on my sign. Want one? I don't have a dollar. No problem! You can put 50 cents down and pay 100% interest in dime installments over the next 10 days! People just don't know a reat idea when they hear one.
    description: Hobbes asks Calvin how he knows his ideas are great.  Calvin tells him because it says so on the sign and offers one.  Hobbes doesn't have a dollar.  Calvin offers to take 50 cents down and charge 100% interest in dime installments over the next ten days.  Hobbes leaves.  Calvin complains people don't know a great idea when they hear one.
    characters: [calvin, hobbes]
  "19920617":
    transcript: I'm having an inventory reduction sale! Great ideas are now just a quarter! OK, here. What's your great idea? Buy some more! I'm getting another great idea right now. Me too. See ya.
    description: Calvin offers Mom a great idea for a quarter.  He's having an inventory reduction sale.  Mom gives him a quarter and asks for the great idea.  Calvin tells her to buy some more.  Mom says she's getting a great idea.  Calvin takes off.
    characters: [calvin, mom]
  "19920618":
    transcript: Ahh, another bowl of chocolate frosted sugar bombs! The seocnd bowl is always the best! The pleasure of my FIRST bowl is diminished by the anticipation of future bowls... ...and by the end of my THIRD bowl, I usually feel sick. Maybe you shouldn't use chocolate milk. I tried cola, but the bubbles went up my nose.
    description: Calvin is eating his second bowl of Chocolate Frosted Sugar Bombs.  He says the pleasure of the first bowl is diminished by the anticipation of future bowls, and by the third bowl he feels sick.  Hobbes says maybe he shouldn't use chocolate milk.  Calvin says he tried cola, but the bubbles went up his nose.
    characters: [calvin, hobbes]
  "19920619":
    transcript: You call this NEWS?! THIS isn't informative! This is a sound bite! This is entertainment! This is sensationalism! Fortunately, that's all I have the patience for.
    description: Calvin complains the television isn't informing him.  He says it's a sound bite, entertainment, sensationalism.  He sits down to watch it, saying that's all he has patience for.
    characters: [calvin]
  "19920620":
    transcript: Well, let's check my calendar and see what our schedule is for today. Today says, "Do nothing." So does tomorrow, and every day after... all the way through the end of August. I LIKE this itinerary! Let's get right to it!
    description: Calvin checks his schedule for the day.  He says it says "do nothing" every day through August.  Hobbes likes that itinerary.  They run outside to get right to it.
    characters: [calvin, hobbes]
  "19920621":
    transcript: I've been reading about the beginning of the universe. They call it "The Big Bang." Isn't it weird how scientists can imagine all the matter of the universe exploding out of a dot smaller than the head of a pin, but they can't come up with a more evocative name for it than "The Big Bang"? That's the whole problem with science. You've got a bunch of empiricists trying to describe things of unimaginable wonder. What would you call the creation of the universe? "The HOrrendous Space Kablooie!" Hmmm...that is better. Almost anything would be. We should lobby to change that. And I think "Tyrannosaur" should be changed to "Monstrous Killer Death Lizard."
    description: Calvin wonders how scientists can imagine all the matter of the universe exploding out of a dot smaller than the head of a pin but couldn't name it better than "the big bang".  Hobbes asks what Calvin would call it.  Calvin says "the horrendous space kablooie".  Hobbes thinks that is better.  He suggests they lobby to change it.
    characters: [calvin, hobbes]
    source: miraheze
  "19920622":
    transcript: Mom got me some clay! Want to help me make something? Do we get smocks? I want a smock! This kind of clay isn't that messy. You don't need a smock. I WANT A SMOCK! Ok, ok, you can have a smock! Let's get a marker and write "Don't knock my smock, or I'll clean your clock." I guess it wouldn't show if dad wore his suit coat.
    description: Calvin has some clay.  He asks Hobbes if he wants to help him.  Hobbes wants a smock.  Calvin tells him the clay isn't messy.  Hobbes yells that he wants a smock.  Calvin gets a shirt for Hobbes.  Hobbes wants to write on the smock.  "Don't knock my smock, or I'll clean your clock".  Calvin guesses it wouldn't show if Dad wore his suit coat.
    characters: [calvin, hobbes]
  "19920623":
    transcript: I like my smock. Good. ...OK, I'll divide up the clay. Here's yours. You can tell the quality of the artist by the quality of his smock. Uh huh... you have to work this stuff a bit to get it soft. Actually, I just like to SAY smock. See, just knead it like so, and then it can be modeled. Smock smock smock smock smock smock! WHAT ON EARTH IS WRONG WITH YOU?!
    description: Hobbes likes his smock.  Calvin divides the clay.  Hobbes says you can tell the quality of the artist by the quality of his smock.  Calvin tells Hobbes to knead the clay so it can be modeled.  Hobbes decides he likes to say smock, so he does...over and over.  Calvin wonders what's wrong with Hobbes.
    characters: [calvin, hobbes]
  "19920624":
    transcript: Fine art is dead, Hobbes. Nobody understands it. Nobody likes it. Nobody sees it. It's irrelevant in today's culture. If you want to influence people, POPULAR art is the way to go. Mass market commercial art is the future. Besides, it's the only way to make serious money and that's what's important about being an artist. So what kind of sculpture are you making? Please! It's not a "sculpture". It's "collectible figurines".
    description: Calvin says art is dead.  He says popular art is the way to influence people.  He says that's the only way to make serious money, and that's what's important about being an artist.  Hobbes asks what kind of sculpture he's making.  Calvin corrects Hobbes by saying it's not "sculpture", but rather "collectible figurines".
    characters: [calvin, hobbes]
  "19920625":
    transcript: See, the problem with fine art is that it's supposed to express original truths. But who likes originality and truth?! Nobody! Life's hard enough without it! Only an idiot would PAY for it! But POPULAR art knows the customer is always right! People want more of what they already know they like, so popular art gives it to 'em! And how ARE the movie sequels this summer? Great! Man, there's nothing I hate more than paying five bucks and having to deal with some new plot.
    description: Calvin says fine art expresses original truths.  He says nobody likes truth.  Popular art knows the customer is always right.  People want more of what they know they like.  Hobbes asks how the movie sequels are this summer.  Calvin says there's nothing he hates more than paying money and having to deal with some new plot.
    characters: [calvin, hobbes]
  "19920626":
    transcript: There, I made a tiger. THAT'S no good! Who's going to buy something like that?! It's subtle! It's boring! It's incomprehensible! How will this ever appeal to the lowest common denominator?! It's completely unadaptable to merchendising tie-ins! Who cares? I just wanted to make it. WHAT?! IS THIS SOME SNOBBY, ELITIST, AESTETIC THING?!?
    description: Hobbes makes a tiger.  Calvin says no one will buy it.  He says it's boring.  Hobbes says he just wanted to make it.  Calvin wonders if this is some snobby, elitist, aesthetic thing.
    characters: [calvin, hobbes]
  "19920627":
    transcript: Look at the dopey clay tiger Hobbes made. Gee Calvin, I think this is good. You LIKE it?? Where's the marketabiity? Ask Hobbes if we can put it on the coffee table. But look what I made! A hundred shrunken heads of popular cartoon characters! Eww, you stitched their mouths shut?! Gloat now, 'cause some day I'll be a lot richer than you. I call it "Symphony in Orange, No. 1".
    description: Calvin shows Mom the tiger Hobbes made.  She likes it.  She wants to put it on the coffee table.  Calvin shows her the shrunken heads of popular cartoon characters he made.  Mom is grossed out.  The tiger goes on the coffee table.  Calvin tells Hobbes to gloat now, because some day he'll be richer than Hobbes.
    characters: [calvin, hobbes, mom]
  "19920628":
    transcript: Calvin the ant puts down his grain of sand. He's sick of working all the time! He hates cooperating with all the other ants! Calvin doesn't want to labor for the benefit of the colony! He's an individual. With his own needs and desires! From now on, Calvin the ant calls his own shots! Let some other sap do the queen's bidding! IF you won't help us around the house, why should we work to feed and shelter you?? Calvin the flea sucks the blood of his angry host in parasitic contentment!
    description: Calvin, the ant, is sick of working all the time.  He doesn't want to labor for the colony.  He has his own needs and desires.  He wants some other sap to do the queen's bidding.  Mom walks by with a full laundry basket.  She asks why she and Dad should feed and shelter Calvin if he won't help around the house.  Calvin, the flea, sucks the blood of his angry host in parasitic contentment.
    characters: [calvin, mom]
    source: miraheze
  "19920629":
    transcript: Susie, stay right there! I want to show you something. It's a surprise, so close your eyes. I'll be right back. Don't move. Oh, cover your nose so you don't smell anything, OK? That's real important. And all your clothes are washable, right? Doggone it, nobody's going to be her friend if she won't TRUST anyone.
    description: Calvin asks Susie to stay where she is.  He has a surprise.  He wants her to close her eyes and cover her nose.  He asks if her clothes are washable.  Susie leaves.  Calvin comes back with a mask on, carrying a pail.  He says nobody's going to be her friend if she won't trust anyone.
    characters: [calvin, susie]
  "19920630":
    transcript: If people sat outside and looked at the stars each night, I'll bet they'd live a lot differently. How so? Well, when you look into infinity, you realize that there are more important things to do than what people do all day. We spent OUR day looking under rocks in the creek. I mean OTHER people.
    description: Calvin looks at the night sky and tells Hobbes people would live a lot differently if people looked at the stars.  He says when you look into infinity, you realize there are more important things than what people do all day.  Hobbes says they spent their day looking under rocks in the creek.  Calvin says he means other people.
    characters: [calvin, hobbes]
  "19920701":
    transcript: Mom, I have a question. Sure, Honey. Why would it be worth four dollars a minute to talk on the telephone to goofy ladies who wear their underwear on TV commercials? When were you watching that?! Um... It was on... uh... during my morning cartoons. Somehow, whenever I ask a question, I end up with lots of them to answer.
    description: Calvin asks Mom why it would be worth four dollars a minute to talk to ladies wearing their underwear on commercials.  Mom asks when he was watching that.  Calvin replies during morning cartoons.  Calvin walks off lamenting that whenever he asks a question, he ends up with a lot of them to answer.
    characters: [calvin, mom]
  "19920702":
    transcript: Let's not play this any more, hmm? It's not MY fault you make a very big frog!
    description: Calvin hops over Hobbes.  He lands on his back, then climbs over Hobbes' head.  Hobbes grabs Calvin and says they shouldn't play that anymore.  Calvin says it's not his fault Hobbes makes a very big frog.
    characters: [calvin, hobbes]
  "19920703":
    transcript: What are you doing inside? It's a beautiful day out! Go move around! HEY! It's too hot! It's too bright! It's too humid! It's too buggy! IT'S TOO REAL!
    description: Mom turns off the television and tells Calvin to go outside.  As she tosses him out, Calvin says it's too bright, hot, humid, and buggy.  Outside, he adds that it's too real.
    characters: [calvin, mom]
  "19920704":
    transcript: Heh heh heh! Heh heh heh! I wish I had more enemies. I'm sure you will someday, honey.
    description: Calvin fills a water balloon.  He hides behind a tree, chuckling.  Night falls.  As Mom puts him in bed, Calvin says he wishes he had more enemies.  Mom tells him he will someday.
    characters: [calvin, mom]
  "19920705":
    transcript: Psst! Hey kid! Wake uup! A monster! Heh heh! Splish splash splish splash splish splash. Stop that! I know what you're up to! What's he doing? Calvin He's trying to make me have to go to the bathroom. Drip drip drip! Fwoosh sploosh fwoosh sploosh. As soon as I get out of bed, he'll grab me and suck out my innards with some vile proboscis! Fwishh spilsh fwishh splish! That's terrible! Will they stop at nothing?! His plan is working, too! I'll never make it till morning! Splash splash splash splash splash! I have to go, but I can't get out of bed! What am I going to do?? The plants on this side of the house sure don't do very well.
    description: A monster under Calvin's bed is trying to make him go to the bathroom by making water sounds.  Calvin knows when he gets out of bed, the monster will suck out his innards.  Calvin tells Hobbes the plan is working.  He knows he can't make it till morning.  Calvin says he has to go, but he can't get out of bed.  He asks Hobbes what he's going to do.  The next day, Dad is talking to Mom outside the house.  He mentions to Mom that the plants on that side of the house don't do very well.  Above them is Calvin's bedroom window.
    characters: [calvin, hobbes, mom, dad]
    source: miraheze
  "19920706":
    transcript: Boy, there's nothing worse than an inscrutable omen.
    description: Calvin looks at a cloud.  The cloud turns into him, sticking his tongue out.  The cloud drifts off, and Calvin says there's nothing worse than an inscrutable omen.
    characters: [calvin]
  "19920707":
    transcript: I saw a cloud that looked just like me! Really? There was a head, huge and white, floating in the ethereal blue! Obviously it's a SIGN! Of what? Very peculiar high altitude winds, I guess. Science kind of takes the fun out of the portent business. You know, some sort of cumulonimbal thing.
    description: Calvin tells Hobbes he saw a cloud that looked like him.  Calvin says it was a sign.  Hobbes asks what it was a sign of.  Calvin replies a peculiar high altitude wind.  Hobbes says science takes the fun out of the portent business.
    characters: [calvin, hobbes]
  "19920708":
    transcript: Hi Dad, it's me, Calvin. I just called to let you know it's a perfect day outside. Too bad you're trapped in a boring office while I'm running around free with no responsibilities! Have a good summer! Ha ha ha! *click* Childhood is for spoiling adulthood.
    description: Calvin calls Dad at work to tell him it's a perfect day outside.  Calvin says that while Dad is trapped in a boring office, Calvin's running around with no responsibilities.  He hangs up.  Calvin says childhood is for spoiling adulthood.
    characters: [calvin, dad]
  "19920709":
    transcript: People are so self-centered. The world would be a better place if people would stop thinking about themselves and focus on others for a change. Gee, I wonder who that might apply to. Me! Everyone should focus more on ME!
    description: Calvin tells Hobbes people are self-centered.  Calvin says the world would be a better place if people stopped thinking about themselves and focused on others.  Hobbes rolls his eyes and asks who that might apply to.  Calvin says himself.  Everyone should focus more on him.
    characters: [calvin, hobbes]
  "19920710":
    transcript: Here I am, all set to write my autobiography, and I'm stuck! What's the problem? I can't remember the first half of my life! Maybe your Mom knows what you did. I asked her. She said I did revolting things that are probably unpublishable. Well no wonder you suppressed the memories. Maybe I was in jail!
    description: Calvin is stuck while trying to write his autobiography.  He tells Hobbes he can't remember the first half of his life.  Hobbes suggests Mom might know what Calvin did.  Calvin says he asked her.  She said he did revolting things that were probably unpublishable.  Hobbes understands why Calvin suppressed the memories.  Calvin wonders if he was in jail.
    characters: [calvin, hobbes]
  "19920711":
    transcript: The problem with tigers is they have no setting between "Off" and "High".
    description: Calvin walks past Hobbes, who's lying on the floor.  Calvin continues, then Hobbes leaps on Calvin.  As Hobbes runs off, Calvin says tigers have no setting between "off" and "high".
    characters: [calvin, hobbes]
  "19920712":
    transcript: AAAAAAAAAAAAAAAA Mm.. I don't think so. Oh, c'mon. I'm right here.
    description: Calvin climbs the slide ladder.  He sees himself high above town, then above the clouds.  He sees himself sliding down back toward earth.  Calvin sits on top of the slide at home.  Calvin doesn't think he's going to do it, despite Dad standing there coaxing him.
    characters: [calvin, dad]
    source: miraheze
  "19920713":
    transcript: I let my mind wander a bit and it didn't come back. I figured you'd lost your mind years ago.
    description: Calvin opens his head, and his brain hops out.  Off it goes.  Calvin tells Mom he let his mind wander, and it didn't come back.  Mom says she figured he lost his mind years ago.
    characters: [calvin, mom]
  "19920714":
    transcript: Bugs fly in such crazy loops and zigzags. I wonder why they don't get dizzy and barf. Maybe they do! Eww, gross! Ha ha ha! But then why would they keep flying that way? Maybe bugs LIKE to barf! EWWWW! They WOULD!! Ha ha ha ha! Blaugh! I tell you, Hobbes, it's great to have a friend who appreciates an earnest discussion of ideas.
    description: Calvin tells Hobbes that bugs fly in such crazy loops, he wonders why they don't get dizzy and barf.  Hobbes suggests maybe they do.  Calvin thinks that's gross, but wonders why they'd keep flying that way.  Hobbes suggests maybe they like to barf, and he starts to laugh.  Calvin is grossed out, but he laughs.  As they walk off, Calvin says it's great to have a friend who appreciates an earnest discussion of ideas.
    characters: [calvin, hobbes]
  "19920715":
    transcript: What if we die and it turns out our God is a big CHICKEN?? What then?! Just eat your dinner, OK? ETERNAL CONSEQUENCES, THAT'S WHAT!
