  "19921104":
    transcript: If this is from a girl, we'll have to bury it real deep and disinfect my room. Hurry! Open it! Ugh, what if it's some mushy poem written with a pink pen in loopy letters with the "I"s dotted with hearts?? I think I'd puke. No, it's cut and pasted letters from a magazine! Wow! No handwriting to trace! It says, "Coded message to follow. A-1, B-2, etc. Destroy this letter." Hobbes, we're dealing with a PRO!
    description: Calvin isn't sure he wants to open the letter.  It might be a mushy poem written with a pink pen in loopy letters.  He sees the note is cut and pasted letters from a magazine.  Hobbes reads the letter.  It contains instructions for a code and says a coded message will follow.
    characters: [calvin, hobbes]
  "19921105":
    transcript: Can you believe this?? A skull for a return addres, untraceable cut-out letters, and a code key for a future message. This is real secret agent stuff! Whoever sent this is taking no chances on the message being traced or intercepted! Gosh, the message must be super top secret and important! I wonder what it could be! I wonder when I'll find out. It's a good thing you're the patient type. This is so cool I have to go to the bathroom!
    description: Calvin thinks this is real secret agent stuff.  He figures the message must be super top secret and important.  He wonders what it will be and when he'll find out.  Hobbes says it's a good thing Calvin is the patient type.  Calvin is so excited, he has to use the bathroom.
