    characters: [calvin, mom]
  "19921103":
    transcript: Look, Hobbes, I got a mysterious letter! The return address is a skull with X-ed out eyes! It has a local postmark, though. So I must know the person. Oh boy, intrigue! But who would send me an anonymous, weird letter like this? Maybe a GIRL! GAAAA! Doesn't the post office SCREEN anything? I'll get you some gloves!
    description: Calvin shows Hobbes the letter he received.  He notices it has a local postmark and wonders who would send a weird letter like that.  Hobbes wonders if it's from a girl.  Calvin drops the letter in horror, wondering if the post office doesn't screen anything.
