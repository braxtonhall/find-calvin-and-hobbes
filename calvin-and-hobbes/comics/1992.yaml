  "19921109":
    transcript: Ooh, this burns me up! A coded message saying "Calvin is a porridge brain!" The nerve! The bizarre skull drawing, the cut and pasted letters, the code... all that suspense and mystery for an insult! What kind of depraved maniac would go to so much trouble?! Rrrghhh, I wish I knew who sent this!! Our only clue is that the twisted fiend has too much time on his hands. Another letter for you, Calvin! How nice to get so much mail.
