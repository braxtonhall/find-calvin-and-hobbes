  "19920805":
    transcript: Why do you sleep so much? I like to be rested when things start to happen. What are you talking about?! Nothing ever happens around here! Give me a break! AAAUGHH!
    description: Calvin asks Hobbes why he sleeps so much.  Hobbes tells him he likes to be rested when things start to happen.  Calvin walks away wondering what he's talking about.  Nothing ever happens around there.  Hobbes pounces on an unsuspecting Calvin.
