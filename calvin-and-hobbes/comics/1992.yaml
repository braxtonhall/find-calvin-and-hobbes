  "19920716":
    transcript: One of the joys of being a kid is that experiences are new and therefore more intense. For example, I'm about to stick my nose in a jar of mustard and inhale deeply! Let's see what it's like. WHOOP!! See, whed you are oder, you dake your sinuses fo granded. Some of us prefer to.
