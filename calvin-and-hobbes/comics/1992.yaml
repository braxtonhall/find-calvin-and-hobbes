  "19921101":
    transcript: Wow! Calvin suddenly finds himself on his own sheet of notebook paper! Fortunately, Calvin had been doodling all morning! Here's a tank! Pleased how well it's rendered, Calvin climbs in! The blue ruled guidelines are no match fo the tank's heavy treads! Calvin roars across the page anywhere he wants! There's the school! Calvin fires directly into Miss Wormwood's classroom! Kids dive out the windows! Oh no! Miss Wormwood has come to put a stop to Calvin's fun! He fires again and again, but she's too big and mean! Hand it over Leonardo, and see me after class. The arts are always the first to go in public schools.
    description: Calvin is on his notebook paper.  He's been doodling, so there's a tank for him to enter.  The tank goes wherever Calvin wants.  He shoots the school.  Miss Wormwood tries to stop Calvin.  He shoots again and again, but the shells have no effect.  Miss Wormwood stands over Calvin's desk.  She tells him to hand it over and see her after class.  Calvin hands her his drawings and says the arts are the first to go in public schools.
