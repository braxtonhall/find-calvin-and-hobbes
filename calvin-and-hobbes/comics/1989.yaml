"19890817":
  transcript: There! A gull pitcher of "Calvin's curative elixir"! We'll charge people a buck a glass and get rich! But that's just dirty water from the drainage ditch! There are leaves in it! "Fortified with chlorophyll", we'll say. Nobody's going to pay to drink that! Anyone can see it's filthy! It's sludge! Hmm... maybe you're right. PiTCHER of PLaGUE. Calvin's DeBiLitatiNG DiSEaSE DRiNK! $1.00 Not TO HaVE aNY
  description: Calvin tells Hobbes about "Calvin's Curative Elixir".  He figures he'll charge people a buck a glass and get rich.  Hobbes tells him it's just dirty water from the drainage ditch.  There are leaves in it.  Calvin thinks they'll say "Fortified with Chlorophyll".  Hobbes tells him no one will pay to drink that water.   Anyone can see it's filthy.  He calls it sludge.  Calvin says maybe he's right.  Calvin sits at a stand with the dirty water in a pitcher on the stand.  The sign on the stand reads "Pitcher of Plague.  Calvin's Debilitating Drink!  $1.00 not to have any".
