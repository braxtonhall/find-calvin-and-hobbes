"19890513":
  transcript: This is where our television used to be. But we don't have a TV any more. Now we have a blank wall to watch. So here I am, not being entertained. A pointless existence, huh? I mean, the wall is even plain old WHITE!
  description: Calvin shows Hobbes where their TV used to be.  Calvin says they don't have a TV to watch, only a blank wall.  He complains about not being entertained.  Hobbes asks if it's a pointless existence.  Calvin says that the wall is even plain old white.
  characters: [calvin, hobbes]
"19890514":
  transcript: Dear Mom, How do I love you? Let me count the ways. One... number one... hmm... nummmber one... mm... Hey Mom, wake up! I made you a Mother's Day card! Why, how sweet of you! I did it all by myself. Go ahead and read it! I was going to buy a card with hearts of pink and red, But then I thought I'd rather spend the money on me, instead. It's awfully hard to buy things when one's allowance is so small... Ahem... ... so I guess you're pretty lucky I got you anything at all." "Happy Mother's Day to you. There, I said it. Now I'm done. So how 'bout getting out of bed, and cooking breakfast for your son?" I'm deeply moved. Did you notice the part about my allowance?
  description: Calvin wakes Mom up to give her a Mother's Day card he made.  She sits up and reads it.  It reads he could have bought a card with hearts of pink and red, but he thought he'd spend the money on him, instead.  It's hard to buy things with such a small allowance, so she's lucky he got her anything at all.  Happy Mother's Day, he's said it, now he's done.  So how about getting out of bed and cooking breakfast for her son?  Mom's deeply moved.
  characters: [calvin, mom, dad]
"19890515":
  transcript: Good news, Hobbes! I'm starting a secret club, and you can be in it! Oh, boy! It'll be great! We'll think of secret names for ourselves, secret codes for our secret correspondence, a secret handshake,... We'll have a secret club-house with a secret known to get in, and we'll do big secretive things! Why all the secrecy? People pay more attention to you when they think you're up to something.
  description: Calvin tells Hobbes he's going to start a new club, and he can be in it.  Calvin explains they'll have secret names, secret codes and secret handshake.  They'll have a secret clubhouse with a secret knock.  Hobbes asks why all the secrecy?  Calvin tells him people pay more attention to you when they think you're up to something.
  characters: [calvin, hobbes]
"19890516":
  transcript: OK, the first thing we need is a name for our secret club. Let's call it "The Hobbes Fan Club"! THE HOBBES FAN CLUB?! GIVE ME A BREAK! I'M SURE! This is a top-secret society! The name should be something mysterious! Something vaguely ominous and chilling! Something like "The Sinister Icy Black Hand of Death Club"! I still like my idea better.
  description: Calvin says the first thing they'll need is a name for their secret club.  Hobbes suggests "The Hobbes Fan Club".  Calvin is outraged.  He says the name has to be mysterious.  Something vaguely ominous and chilling.  He suggests "The Sinister Icy Black Hand of Death Club".  Hobbes likes his idea better.
  characters: [calvin, hobbes]
"19890517":
  transcript: I got it! We'll call our club G.R.O.S.S. - Get Rid Of Slimy girlS! That way, Susie Derkins can't join! Is she slimy? ALL girls are slimy. Now the first order of business is to elect officers. I get to be president! I get to be president! Oh, no you don't! This whole club was my idea, so I get to be president. OK, then I get to be king and tyrant. Hey, no! THAT'S what I want to be! You can be President.
  description: Calvin decides the club name should be Get Rid Of Slimy girlS, or G.R.O.S.S.  The first order of business is to elect officers.  Hobbes wants to be president.  Calvin says no, because the whole idea of the club was his.  So he gets to be president.  Hobbes says then he wants to be king and tyrant.  Calvin changes his mind and says that's what he wants to be.  Hobbes can be president.
  characters: [calvin, hobbes]
"19890518":
  transcript: Hi, Calvin! What are you doing, making paper hats? Can I make one, too? Don't be ridiculous. This is the official chapeau of our top-secret club, G.R.O.S.S. - Get Rid Of Slimy girlS! "Slimy girls"?! I know that's redundant, but otherwise it doesn't spell anything. Now go away. GIRLS AREN'T SLIMY! Don't get gunk on me. I took bath last Saturday and I'm all clean.
  description: Calvin and Hobbes are wearing paper hats.  Susie Derkins comes along and asks if she can make one, too.  Calvin tells her these are the official hats of the G.R.O.S.S. club.  Susie asks about the "slimy girls" part.  Calvin says he knows it's redundant, but otherwise it didn't spell anything.  Susie yells that girls aren't slimy.  Calvin tells her not to get gunk on him.  He took a bath last Saturday, and he's all clean.
  characters: [calvin, hobbes, susie, stuffedhobbes]
"19890519":
  transcript: I can't believe you started a secret club just to exclude girls! There's nothing wrong with girls! See, Hobbes? Girls are so emotional. You're the meanest, most rotten little kid I know! Well, fine! Play with your stuffed tiger! See what I care! I don't want to play with a stinker like you anyway!! Wow, what a great club!
  description: Susie can't believe he started a secret club to exclude girls.  She tells Calvin he's the meanest, most rotten little kid she knows.  She tells him to play with his stuffed tiger.  She doesn't want to play with a stinker like him, anyway.  Susie walks away.  Calvin tells Hobbes this is a great club.
  characters: [calvin, hobbes, susie, stuffedhobbes]
"19890520":
  transcript: OK, we've got a sign for our secret club, so now we need to find a secret meeting place. I know! We can set up a card table in the garage! That would be perfect for drawing up maps and stuff! Hmm, there's not much room with the car here. Let's push it into the drive. Shouldn't you ask your Mom to move it instead? Nahh. She won't care if we push it out. C'mon. In the past, you've been a remarkably poor judge of what your Mom cares about.
  description: Calvin and Hobbes finish their club's sign.  Now they need to find a secret meeting place.  Calvin wants to set up a card table in the garage.  He says it would be perfect for drawing maps and stuff.  The car is parked in the garage, which leaves little room.  Calvin decides to push the car out of the garage.  Hobbes asks if he shouldn't ask his Mom first.  Calvin says she won't care if they push it out.  Hobbes reminds him in the past, he's been a remarkably poor judge of what his Mom cares about.
  characters: [calvin, hobbes]
"19890521":
  transcript: BLIPP SPLOPP BLOOP BLIPP Let's face it, we're aesthetes. Here comes Susie. Just ignore her. Hi, Calvin. Can I play with you and your tiger? Hobbes and I are NOT playing. We're doing big important things, and we don't need to mess them up. It doesn't look to ME like you're doing anything important. Well we are, so go away. We've wasted too much time talking to you already. You're just playing in the mud! That's just what it LOOKS like to ignorant girls like you! Get lost! All right, you little creep! I don't need you! I've got better things to do than sit in the mud like a pig! A PIG?! By golly, I'll show YOU! Don't bend over! Your curly pink tail shows! Oink! Oink! Oink! Oink! EAT SOME MUD, SUSIE! Ha ha! You missed! Oink! Oink! Oink! Ahh, spring! THat magical time of the year when a young man's fancy turns to love! Shut up.
  description: Susie asks if she can play with Calvin.  Calvin informs Susie that he and Hobbes aren't playing.  They're doing important things and don't need her to mess them up.  It doesn't look to Susie like they're doing anything important.  Calvin tells her he's spent too much time talking with her and to go away.  She says he's just playing in the mud.  Calvin tells her that's what it looks like to ignorant girls like her.  He tells her to get lost.  Susie says she's got better things to do than sitting in the mud like a pig.  Calvin gets angry!  He says he'll show her as he grabs some mud.  Susie taunts him by saying he shouldn't bend over, his curly pink tail shows.  Calvin throws mud at Susie, but misses.  She taunts him as she runs away.  Calvin steams back to Hobbes.  Hobbes calls spring that magical time of year when a young man's fancy turns to love.  Calvin tells him to shut up.
  characters: [calvin, hobbes, susie, stuffedhobbes]
"19890522":
  transcript: Help me push the car out of the garage. I can't budge it myself. I still think you should ask your Mom to move it. Then she'd probably say no, and we won't have the garage for our clubhouse! But if you DON'T ask her, we'll get in trouble. We won't get in trouble! Every time you say that, we go. Mom wouldn't care about these things if she wouldn't keep finding out about them.
  description: Calvin asks Hobbes to help him push the car out of the garage.  Hobbes still thinks Calvin should ask Mom.  Calvin says she'd probably say no, then they wouldn't have the garage for their clubhouse.  Hobbes replies if they don't ask her, they'll get in trouble.  Calvin says they won't get in trouble.  Hobbes says every time he says that, they do.  Calvin figures Mom wouldn't care about these things if she didn't keep finding out about them.
  characters: [calvin, hobbes]
"19890523":
  transcript: Look, stop being such a baby and help me push the car into the driveway. We'll move it 10 feet. What could possibly go wrong?! Whenever you ask that, my tail gets all bushy. Oh, knock it off. Mom will be glad we did this ourselves and didn't bother her. Well, she DOES hate to be bothered. Right. Now push! Push! Hey, the car's not stopping! STOP! STOP! I think you're Mom's going to be bothered.
  description: Calvin tells Hobbes to quit being such a baby.  They'll move the car ten feet.  What could go wrong?  Hobbes says every time he says that, his tail gets bushy.  Calvin says Mom will be glad they did it themselves and didn't bother her.  They start pushing the car, and it keeps rolling.  Calvin says the car isn't stopping.  He chases after it.  Hobbes says he thinks Mom is going to be bothered.
  characters: [calvin, hobbes]
"19890524":
  transcript: STOP THE CAR! IT'S STILL ROLLING! The driveway must be slanted downhill! It's going faster! WHOA! WHOA! Jump in and pull the emergency brake! I can't catch the door! Oh, no! Oh, no! It's going to go into the road! Don't follow it! LOOK OUT! WILD CAR!!
  description: Calvin and Hobbes are running after the car.  Hobbes says the driveway must be slanted downhill.  The car is going faster.  Hobbes tells Calvin to jump in and pull the emergency brake.  Calvin can't catch the door.  Hobbes grabs Calvin as the car goes into the road.  Calvin yells for people to watch out for the wild car.
  characters: [calvin, hobbes]
"19890525":
  transcript: I haven't seen Calvin for about 15 minutes now. That probably means he's getting in trouble.
  description: Mom is sitting reading the paper.  She says she hasn't seen Calvin for 15 minutes.  She's sitting with her back to the window.  The car rolls past the window.  Then, Calvin and Hobbes run past the window.  Mom says that probably means he's getting into trouble.
  characters: [calvin, hobbes, mom]
"19890526":
  transcript: The car is rolling into the road!! What if someone hits it?!? LOOK OUT! LOOK OUT! THERE'S NO ONE DRIVING!! THERE IT GOES!! I can't watch! GRUNTCH Nobody hit it! It just went into the ravine across the street! Hooray, we're dead.
  description: Calvin and Hobbes stand shocked.  The car rolls out into the road.  They cover their eyes and can't watch.  GRUNTCH!  Hobbes says nobody hit it.  It went into the ravine across the street.  Calvin says "Hooray, we're dead".
  characters: [calvin, hobbes]
"19890527":
  transcript: Oh man, oh man, oh man. Oh man. What do you suppose a car like this costs? I'll bet at LEAST $75. Oh MAN.
  description: Calvin and Hobbes run across the street to see the car.  It's sitting nose up in a ditch with half the car poking up.  Hobbes asks what Calvin thinks a car like that costs.  He bets at least $75.  Calvin can only say "Oh man".
  characters: [calvin, hobbes]
"19890528":
  transcript: Did you watch any television yesterday? No. Gosh, what was yesterday like? I think life should be more like TV. I think all of life's problems should be solved in 30 minutes with simple homilies, don't you? I think weight and oral hygiene ought to be our biggest concerns. I think we should all have powerful, high-paying jobs, and everyone should drive fancy sports cars. All our desires should be instantly gratified. Women should always wear tight clothes, and men should carry powerful handguns. Life overall should be more glamorous, thrill-packed, and filled with applause, don't you think? I think MY life is too featherbrained already. Of course, if life was really like that, what would we watch on TV?
  description: Calvin and Hobbes are racing down the hill in their wagon.  Calvin thinks life should be more like TV.  All of like's problems should be resolved in 30 minutes with simple homilies.  Weight and oral hygiene should be their biggest concerns.  We should all have high-paying jobs and drive fancy sports cars.  Women should always wear tight clothes, and men should always carry handguns.  Life should be more glamorous and thrill-packed.  He says this as they fly out of the wagon, which has gone off the edge of the hill.  Hobbes says his life is too featherbrained already.  Calvin wonders what they would watch on TV if like really was like that.
  characters: [calvin, hobbes]
"19890529":
  transcript: My life is flashing becore my eyes. Yeah, I doubt your parents figured you'd wreck their car before you were 16.
  description: Calvin and Hobbes are standing by the car, which is sticking up from the shallow ravine.  Calvin says his life is flashing before his eyes.  Hobbes doubts Calvin's parents figured he'd wreck their car before he was 16.
  characters: [calvin, hobbes]
"19890530":
  transcript: What are we going to do?? We'll never get the car out of the raving. Should we act surprised, like the car just rolled here by itself? Maybe Mom and Dad would fall for that. Or maybe they won't even notice if we just don't say anything. You think? I can be packed in five minutes. OK, I'll try to get the maps out of the glove compartment.
  description: Calvin wonders what they'll do.  They can't get the car out of the ravine.  Calvin wonders if they should act like the car rolled by itself.  He thinks Mom and Dad might fall for that.  Calvin thinks they may not notice, if they don't say anything.  Hobbes says he can be packed in five minutes.  Calvin says he'll try to get the maps out of the glove compartment.
  characters: [calvin, hobbes]
"19890531":
  transcript: Hi, Mom! Hobbes and I are back! Do I have any clean clothes? I mean, I'm just wondering. I'm going to make myself a few dozen sandwiches! Uh... I'm REALLY hungry! No need to get up, or look, for example, out of the window! Just stay where you are for another 10 minutes! What's the matter with you? AAUGHH! Ha ha ha ha! Nothing! Uh, why do you ask??
  description: Calvin opens the door, says he and Hobbes are home, and asks if he's got any clean clothes.  He's just asking.  He goes into the kitchen.  He says he's going to make a few dozen sandwiches, because he's really hungry.  He yells that there's no need for Mom to get up or look out the window.  Mom comes in and asks what's wrong with him.  He's startled, laughs, and asks why she is asking.
  characters: [calvin, mom]
"19890601":
  transcript: I got a couple of sandwiches made, but I think Mom was getting suspicious. Are you packed? We'd better go! Should I take the yo-yo or the bubbles? ... or both? HOBBES, COME ON! We'll be lucky to get out of here with our LIVES! Mom's bound to look outside any minute now and see the car in the ditch! If we're not in the next county by then, it's curtains! Let's GO! Where's a freight train when you really need one?
  description: Calvin has a couple sandwiches that he's made, but he thinks Mom got suspicious.  He tells Hobbes they'd better go.  Hobbes is trying to decide whether to bring a yo-yo or bubbles.  Calvin hurries him up saying they'll be lucky to get out of there with their lives.  Calvin says Mom is bound to look out the window any minute and see the car.  As they dash out the back door, Calvin asks where's a freight train when you really need one.
  characters: [calvin, hobbes]
"19890602":
  transcript: POOF POOF POOF POOF POOF OK, (POOF)... I think we've got enough of a head start. We can rest a minute. Do you think your Mom has seen the car by now? Probably. She's probably called Dad at work, and he's probably on his way home now!
  description: Calvin and Hobbes run through the field.  They're puffing.  They stop to rest.  Calvin thinks they have enough of a head start and can rest a minute.  Hobbes asks if Calvin thinks Mom has seen the car yet.  Calvin thinks she's probably called Dad at work, and he'll be on his way home.  They start running again.
  characters: [calvin, hobbes]
"19890603":
  transcript: Well, we're surely in some other state by now. Let's stop here. Boy, it never once occurred to me that I'd be spending the rest of my life on the lam. Speaking of lamb, what kind of sandwiches did you bring? How can you think of eating? I'm so worried I feel sick. Really? Can I have your sandwich too? Six years old and a fugitive from justice. I can't believe it.
  description: Calvin stops, as he figures he must be in another state by now.  It had never occurred to him he'd be spending the rest of his life on the lam.  Hobbes asks what kind of sandwiches Calvin brought.  Calvin wonders how Hobbes could be thinking of eating.  Calvin is so worried, he feels sick.  Hobbes asks if he can have Calvin's sandwich, too.  Calvin lies back on the grass and says he's six years old and a fugitive from justice.
  characters: [calvin, hobbes]
"19890604":
  transcript: Ahhhh... Uh-oh. Something is seriously wrong here. The laws of perspective have been repealed! Objects no longer diminish in size with distance! Lines do not converge toward any point on the horizon. All spatial relationships are lost! It's impossible to judge where anything is! Oh, no! CALVIN! Quite running around the house and crashing into things, or I'll sell you to the monkey house! ... and now SHE's lost perspective.
  description: The laws of perspective have been repealed.  Objects no longer diminish in size with distance.  Lines do not converge toward any point on the horizon.  It's impossible to judge where anything is.  Calvin trips over the end table and knocks it and the lamp to the floor.  Mom yells that he should quit running around crashing into things.  If he doesn't, Mom will sell him to the monkey house.  Calvin gets up rubbing his head, saying now she's lost perspective.
  characters: [calvin, mom]
"19890605":
  transcript: What's going on. I wonder. Why are all those cars slowing down as they go by? Gosh, did someone have an accident? It looks like there's a car in the ditch! ... but I don't see anyone by it. And how on earth did they go in straight backward? To do that, the car would've had to come... ...right...out...our...driveway!
  description: Mom is looking out the window and wonders why all the cars are slowing as they go by.  She opens the door and sees a car in the ditch, but no one is there.  Mom wonders how the car went in backward.  She thinks about it and realizes the car would have had to come right out of their driveway.  She starts running over to the car.
  characters: [mom]
"19890606":
  transcript: Well, Mom's sure to have found the car by now and guessed what we did. Now I know what they mean when they say you can't go home again.
  description: Calvin says Mom's sure to have found the car and guessed what they did by now.  As Calvin and Hobbes walk across a downed tree, Calvin says now he knows what they mean when they say you can't go home again.
  characters: [calvin, hobbes]
"19890607":
  transcript: What's that sound? I don't hear anything. There! Something is crashing through the brush! It It sounds big! Maybe it's a bear! There are BEARS out here?? Climb the tree! Climb the tree! If you ask ME, tigers are the only ferocious animals the world really needs. "Boy, 6, killed by bear! Parents saved the trouble."
  description: Hobbes hears something crashing through the brush.  Calvin thinks it's a bear.  They run to a tree and climb up.  Hobbes thinks tigers are the only ferocious animals the world needs.  Calvin imagines the headlines "Boy, 6, killed by bear!  Parents saved the trouble".
  characters: [calvin, hobbes]
"19890608":
  transcript: Do you think we're safe? Should we climb higher? It's hard to say with bears. There it is! The bear's coming out of the brush! Oh no! It looks like it's on its hind legs! Bears stand up only when they're really mad!! Wait, that's not a bear. That's your Mom! AAUGHH! EVEN WORSE! CLIMB HIGHER! CLIMB HIGHER!
  description: Calvin asks if they should climb higher in the tree.  Calvin spots the bear coming out of the brush.  He says it's on its hind legs, and they only do that when they're mad.  Hobbes says that's not a bear, it's Mom.  Calvin panics and says that's worse.  He tells Hobbes to climb higher.
  characters: [calvin, hobbes]
"19890609":
  transcript: THERE you are. Come down so I can talk to you. No. You'll kill us. We're running away. I'm not going to kill you. I just wanted to find out what happened. Are you OK? Was anyone hurt? No one was hurt. We were pushing the car into the drive and it kept rolling. The car didn't hit anything? It just went across the road and into the ditch. That's when we took off. Well, the tow truck pulled it out, and there's no damage, so you can come home now. First let's hear you say you love me.
  description: Mom sees Calvin in the tree and tells him to come down.  Calvin doesn't want to because he thinks she'll kill him.  Mom says she won't, but wants to know what happened.  She asks if anyone was hurt.  Calvin says no one was hurt.  He says they pushed the car into the drive and it kept rolling.  Mom asks if the car hit anything.  Calvin says it just went into the ditch.  That's when they took off.  Mom says the tow truck pulled the car out, and there was no damage.  He can come home now.  Calvin wants to hear her say she loves him first.
  characters: [calvin, hobbes, mom, stuffedhobbes]
"19890610":
  transcript: Boy, Hobbes, isn't it funny how things sometimes work out? Mom and Dad saw right away that what happened to the car was an accident. They were so relieved no one got hurt that all we got was a lecture on safety and asking permission. They didn't even raise their voices. Parents are inscrutable, huh? Send their car over a ditch and you don't even get yelled at. ...but try keeping live worms in your Dad's... Let's not talk about that, OK?!
  description: Lying in bed at night, Calvin tells Hobbes that Mom and Dad saw what happened was an accident.  Since they were relieved no one was hurt, all he got was a lecture on safety and asking permission.  Calvin says parents are inscrutable.  You send their car over a ditch, and you don't even get yelled at.  Hobbes says "but try keeping live worms in your Dad's...".  Calvin stops him and says not to talk about that.
  characters: [calvin, hobbes]
"19890611":
  transcript: AAUGH WHAM GRRRRRR You can take the tiger out of the jungle, but you can't take the jungle out of the tigher! The question IS, how can you get the tiger BACK in the jungle?
  description: Hobbes hears something.  He springs off, running fast.  Calvin is walking along, unsuspectingly.  Hobbes crashes into him.  Hobbes says you can take the tiger out of the jungle, but you can't take the jungle out of the tiger.  Calvin, lying under Hobbes' feet, says the question is how you get the tiger back into the jungle.
  characters: [calvin, hobbes]
"19890612":
  transcript: Here's the latest poll of household 6-year-olds, Dad. An overwhelming majority expressed amazement at how little you've accomplished as Dad so far. The impression is that you're avoiding all the hard decisions that need to be made. In fact, none of those polled could name a single instance of true paternal leadership. How about if I lead you upstairs to your bed? Ha ha. If we can be serious for a moment, I have some innovative ideas about my allowance.
  description: Calvin has the latest poll results.  An overwhelming majority are amazed at how little he's accomplished.  The impression is that he's avoiding all the hard decisions that need to be made.  No one polled could name a single instance of paternal leadership.  Dad asks if he can lead Calvin to bed.  Calvin replies he has some innovative ideas for his allowance.
  characters: [calvin, dad]
"19890613":
  transcript: Look at all these ants. They're all running like mad, working tirelessly all day, never stopping, never resting. And for what? To build a tiny little hill of sand that could be wiped out at any moment! All their work could be for nothing, and yet they keep on building. They never give up! I sure suppose there's a lesson in that. Yeah... ants are morons. Let's see what's on TV.
  description: Calvin is looking at ants on the sidewalk.  He tells Hobbes the ants run like mad, work all day, never stopping or resting.  All that to make a hill of sand that could blow away at any time.  All their work would be for nothing, yet they keep building.  They never give up.  Hobbes suggests there's a lesson in that.  Calvin agrees.  He thinks the ants are morons.  He heads into the house to see what's on TV.
  characters: [calvin, hobbes]
"19890614":
  transcript: Boy, what a grouch.
  description: Mom gets dressed, puts on earrings, applies her lipstick, and heads out the door.  Calvin sprays her with a water hose.  Calvin is walking away, rubbing his rear end.  He says Mom is a grouch.
  characters: [calvin, mom]
"19890615":
  transcript: Hi, Hobbes! Watcha doin'? Nothing. Nothing at all? Nope. I'll help. Please do.
  description: Hobbes is lying against a tree.  Calvin asks what he's doing.  Hobbes replies "nothing".  Calvin asks if he's doing nothing at all.  Hobbes says no.  Calvin says he'll help and lies down next to Hobbes.
  characters: [calvin, hobbes]
"19890616":
  transcript: ALIENS WELCOME COME AS YOU ARE! What will you do when your parents see this? By then I hope to be halfway to the next galaxy.
  description: Calvin has dug a message into his yard.  It asks aliens to come as they are.  They're welcome.  Hobbes asks what Calvin will do when his parents see this.  Calvin hopes to be halfway to the next galaxy by then.
  characters: [calvin, hobbes]
"19890617":
  transcript: Oh, no! Calvin has turned into one of his own childhood drawings! His anatomical references being obscure at best, Calvin finds it difficult to move! Are these lower appendages feet or wheels? His own Mom thinks he's some kind of helicopter! If only Calvin had learned to draw better! No one understands my work. That's what all artists say.
  description: Calvin has turned into one of his childhood drawings.  His anatomical references being obscure, Calvin finds it hard to move.  Are these lower appendages feet or wheels?  His Mom thinks he's some kind of helicopter.  If only he'd learned to draw better.  Calvin holds up a picture he drew and says no one understands his work.  Mom says that's what all artists say.
  characters: [calvin, mom]
"19890618":
  transcript: Do re mi fa so la ti do. A sparrow alights upon a tree branch. But this is no ORDINARY sparrow. This is a SONG sparrow. Swaying gently in the breeze, he prepares to burst forth a rapturious melody! ON TOP OF SPAGHETTI ALL COVERED WITH CHEEEESE, I LOST MY POOR MEEEATBALLL, WHEN...
  description: A sparrow lands on the tree branch.  This is a song sparrow.  He prepares to burst forth in rapturous melody.  On top of spaghetti, all covered with cheese...  Calvin gets tossed out the door of the house.
  characters: [calvin]
"19890619":
  transcript: Where are YOU going? Out. Did you pick up your room like I asked you to? No. So when you say you're going "out", you really mean you're going back to clean your room, right? English must not be her first language.
  description: Mom asks where Calvin is going.  He says "out".  Mom asks if he picked up his room like she asked him to.  He says "no".  Mom asks for clarification.  She says so when Calvin says "out", he really means he's going back upstairs to clean his room.  Calvin stands in his messy room and complains that English must not be her first language.
  characters: [calvin, mom]
"19890620":
  transcript: What are you doing down here again? Didn't I just send you to clean your room?! Twisted fiend! No four walls can hold STUPENDOUS MAN! You've been foiled again, evil Mom-lady! Ha ha ha! Oh yeah? ! Great Zok! She's fixed her mind-scrambling eyeball ray on me! I'm suddenly filled with the desire to go back upstairs and do her nefarious bidding! Glad to hear it.
  description: Mom asks Calvin why he's back downstairs.  She asks if she didn't just send him to clean his room.  Calvin replies "Twisted fiend!  No four walls can hold Stupendous Man!  You've been foiled again, evil Mom-lady".  Mom bends down and gives Calvin a nasty look.  She says "Oh, yeah".  Calvin stumbles up the stairs with eyes spinning.  He says her mind-scrambling eyeball ray has him going back upstairs to do her nefarious bidding.
  characters: [calvin, mom, stupendous]
"19890621":
  transcript: '"Clean up your room! Clean up your room!" That''s all I ever hear! It''s MY room, right?!? If I don''t mind the mess, what business is it of anyone else?! This is tyranny! I HATE cleaning my room! It''s going to take me all DAY to do this! Ooh, this makes me mad! A whole day shot! Wasted! Down the drain! Gone! AARGH! Are you kidding? How could this possibly take all day? Heck, it''ll be another hour before I''m even through griping.'
  description: Calvin is complaining to Hobbes about being told to clean up his room.  He says it's his room.  If he doesn't care, why should anyone else.  He calls it tyranny.  He says it will take all day to clean it.  A whole day wasted, shot, down the drain.  Hobbes asks how this could possibly take all day.  Calvin says it will be another hour before he's through griping.
  characters: [calvin, hobbes]
"19890622":
  transcript: Cleaning my room will go a lot faster if we BOTH work, right? So I'll sit here and do all the tedious, agonizing planning and organizing... ... you know, making the tough calls and the hard decisious. You won't have to do any of that. All YOU do then is pick up what I tell you to, OK? HEY! Did I SAY to pick up me?! No, as a matter of fact, I didn't! Get away from that trash can! I'M the organizer! HEY!
  description: Calvin thinks the room cleaning will go faster if both he and Hobbes work.  Calvin offers to sit and do all the tedious, agonizing planning and organizing.  He'll make all the hard decisions, and Hobbes won't have to.  All Hobbes has to do is pick up what Calvin tells him to.  Hobbes picks up Calvin.  Calvin tells him he didn't say to pick him.  He tells Hobbes to get away from that trash can.
  characters: [calvin, hobbes]
"19890623":
  transcript: I CLEANED UP MY STUPID ROOM! CAN I GO OUTSIDE NOW?! That didn't take very long. Let's se what kind of job you did. I did a GREAT job! See? Can I go now? Your room looks good. Now did you straighten up your closet like I asked you to? AAUGH! Don't open thaa... Back to work, kiddo. YOU made THIS mess! YOU can clean it up!
  description: Calvin yells that he cleaned his room.  He wants to go outside.  Mom says it didn't take very long.  She wants a look to see what kind of job he did.  Calvin says he did a great job.  Mom says the room looks clean.  She then asks if he straightened up the closet like she asked.  Calvin yells for her not to open the door.  Too late.  Mom is buried by all the stuff Calvin threw in there.  Mom tells him to go back to work.  Calvin complains that she made this mess, so she should clean it up.
  characters: [calvin, mom]
"19890624":
  transcript: WHACK Our favorite games are the ones we don't understand! You missed a wicket! No goal! No goal!
  description: Hobbes rolls a croquet ball, Calvin hits it with the mallet.  Calvin runs around the wickets.  Calvin says best games are the ones they don't understand.  Hobbes chases him with the ball in his hand, saying Calvin missed a wicket so he doesn't get a goal.
  characters: [calvin, hobbes]
"19890625":
  transcript: You're out! I think the bases are too darn far apart. Ahh, you're just a big sissy.
  description: Calvin runs around the house, slides down the ditch, runs over the stream, climbs through the fence, runs around the trees, and dives toward a rock.  Hobbes tags him out.  Calvin complains the bases are too far apart.  Hobbes calls him a big sissy.
  characters: [calvin, hobbes]
"19890626":
  transcript: HELP! A BEE! A BEE! Run for your life! Hobbes! Did you see it?? It was the biggest bee in the whole world! It was the size of a Kaiser roll! It must've weighed 70 pounds! It sounded like a helicopter and it's stinger was like a harpoon! I must've been a killer death bee! Man, I'm lucky it didn't get me! Life in the great suburban outback is certainly fraught with peril. If you'd seen it, you'd have been scared too.
  description: Calvin runs up to Hobbes saying there was a bee.  It was the size of a Kaiser roll and must have weighed 70 pounds.  He says it sounded like a helicopter, and it's stinger was like a harpoon.  He says it must have been a killer death bee.  Hobbes offers that life in the great suburban outback is certainly fraught with peril.  Calvin tells Hobbes that if he'd seen it, he would be scared, too.
  characters: [calvin, hobbes]
"19890627":
  transcript: I can't imagine mastering the skills involved here without a clearer understanding of who's going to be impressed.
  description: Calvin has a yo-yo.  It goes down, and it stops.  He shakes it, trying to get it to move.  It doesn't.  Calvin says he can't imaging mastering the skills involved without a clearer understanding of who will be impressed.
  characters: [calvin]
"19890628":
  transcript: I saw the man oin the moon tonight. Mm. I didn't know the moon made faces. That's "phases".
  description: Calvin looks at the moon, which is sticking its tongue out at him.  Then the moon makes a funny face at him.  Calvin tells Dad he saw the man in the moon tonight.  Calvin says he didn't know the moon made faces.  Dad says that's "phases".
  characters: [calvin, dad]
"19890629":
  transcript: The giant pteranodon hops to the edge of the cliff. There he spreads his bat-like wings and takes to the air! Soaring high over the prehistoric valley, the pteranodon is truly a majestic sight! That's it, think majestic! I'm thinking we should've picked a smaller cliff!
  description: The giant pteradon hops to the edge of the cliff.  He spreads his bat-like wings and takes to the air.  Soaring high, the pteradon is a majestic sight.  Hobbes yells to "think majestic".  Calvin, holding onto a collapsing umbrella over the cliff, yells back that they should have picked a smaller cliff.
  characters: [calvin, hobbes]
"19890630":
  transcript: It's too darn hot out here. You could go wading in the creek. This water is too darn cold. You could go sit in the shade then. This shade is too darn dark. You could go sit in your room with the windows shut and the fan and lights on. That's what I was doing when Mom threw me out here. I was kidding.
  description: Calvin complains that it's too hot.  Hobbes says he could go wading in the creek.  Calvin tries that and says the water is too cold.  Hobbes says he could go sit in the shade.  Calvin tries that and complains that the shade is too dark.  Hobbes, frustrated, tells him he could go sit in his room with the windows shut and the fan and lights on.  Calvin grumbles that's what he was doing when Mom threw him outside.
  characters: [calvin, hobbes]
"19890701":
  transcript: Give me some cookies, or I soak you with this water balloon! Why, you little thug! Don't you threaten your mother! And don't even THINK about throwing that in the house! Out! Out! I'll bet I'd have gotten some cookies if I had filled this with PAINT.
  description: Mom is reading on the sofa.  Calvin comes in and tells her to give him some cookies or he'll soak her with a water balloon.  Mom calls him a little thug and warns him not to threaten his mother.  She tells him not to even think about throwing that in the house.  She tosses him outside.  Dejectedly, Calvin says to Hobbes that he bets he would have gotten some cookies if he had filled the balloon with paint.
  characters: [calvin, hobbes, mom]
"19890702":
  transcript: CLICK Uh oh... The sky is a deep orange! Calvin's skin is a pale green! Yellow flowers are now blue! Every color is the opposite of what it should be! Calvin has been transferred to a color film negative! His only hope is to be processed by a 1-hour photo finisher! Dveeloper! I need a developer! Doggone it, Calvin! That's ANOTHER picture ruined! Can't you look pleasant for 1/500th of a second?!
  description: The sky is orange, Calvin's skin is green.  Yellow flowers are now blue.  Every color is the opposite of what it should be.  Calvin has been turned into a color film negative.  His only hope is to be processed by a 1-hour photo finisher.  He grabs his throat and acts like he's choking.  Dad is trying to get a picture of him.  Dad complains that Calvin just ruined another photo.  He asks if Calvin can't look pleasant for 1/500th of a second.
  characters: [calvin, dad]
"19890703":
  transcript: IT'S JULY ALREADY! OH NO! OH NO! What happened to June?! Summer vacation is slipping through our fingers like grains of sand! It's going too fast! We've got to hoard our freedom and have more fun! Time rushes on! Help! Help! I don't think I want to be here at the end of August. AAUGH! It's a half-hour later than it was half an hour ago! Run! Run!
  description: Calvin runs along yelling it's July already.  He wonders what happened to June.  Summer vacation is slipping through his fingers like grains of sand.  He wants to hoard his freedom.  Calvin's eyes bulge with worry that time rushes on.  Hobbes says he doesn't want to be there at the end of August.  Calvin keeps running around yelling it's a half-hour later than it was a half hour ago.  Run!
  characters: [calvin, hobbes]
"19890704":
  transcript: Mom took me to the library today, Dad. That's nice. Did you get out a book? Yep. It's great! I had no idea books could be so much fun. And you'll learn things, too. I'll say! My book says that this one wasp lays its eggs on a spider, so when the egg hatches, the larva ieats the spider, savings the vital organs for the last, so the spider stays alive while it's being devoured! Gross, huh? Isn't there a street corner where he can hang out instead? And color pictures, too! Want to see 'em?
  description: At the dinner table, Calvin tells Dad that Mom took him to the library.  He didn't know it was such fun.  Dad tells him that he'll learn things, too.  Calvin explains that he learned one type wasp lays its egg in a spider so that when the egg hatches, the larva eats the spider, saving the vital organs for last, so the spider stays alive while its being devoured.  Mom and Dad get odd look on their faces.  Dad wonders if there isn't a street corner he could hang out on instead.
  characters: [calvin, mom, dad]
"19890705":
  transcript: I'm destined for greatness. I just know it. "Calvin the Great," they'll call me. And think how lucky YOU'LL be! You'll get to tell everyone how you knew me as a kid! What a privilege! In fact, all the papers and magazines will probably want to interview you to find out what I'm really like. And boy, will you have to cough up to keep me quiet. And what's THAT supposed to mean?!
  description: Calvin tells Hobbes he knows he's destined for greatness.  Calvin the Great, they'll call him.  He tells Hobbes that he'll get to tell everyone he knew Calvin as a kid.  He figures all the papers will want to interview Hobbes to find out what Calvin is really like.  Hobbes says Calvin will really have to cough up to keep him quiet.  Calvin asks what that's supposed to mean.
  characters: [calvin, hobbes]
"19890706":
  transcript: Dad, how does a light bulb work? Magic. Didn't you say that's how the vacuum cleaner works? Right. They're both magic. You just don't KNOW how they work. I'll bet. Fine. Don't believe your own father, who's been around a lot longer than you. Look Mom, magic! That's not magic!
  description: Calvin asks Dad how a light bulb works.  Dad says magic.  Calvin reminds Dad that's how he told Calvin a vacuum cleaner works.  Dad says both are magic.  Calvin is skeptical.  He says he thinks Dad just doesn't know how they work.  Dad tells him not to believe him, who's been around a lot longer than Calvin.  Calvin turns on the light for Mom and tells her it's magic.  She tells Calvin that's not magic.
  characters: [calvin, mom, dad]
"19890707":
