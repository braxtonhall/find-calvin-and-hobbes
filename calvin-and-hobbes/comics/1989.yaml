"19890823":
  transcript: What are you doing? I'm practicing my sneers. There's nothing like a good sneer to dry up conversation. How's mine look? Awful! Thanks. With this sneer, I hope to be an unbearable burden at any social occasion. That will give you a real head start on beeing a teen-ager. I know! It's like getting seven extra years!
  description: Calvin is practicing his sneers.  He shows Hobbes and tells him there's nothing like a good sneer to dry up conversation.  He asks Hobbes how he looks.  Hobbes replies awful.  Calvin thanks him and hopes, with the sneer, to be an unbearable burden at any social occasion.  Hobbes thinks that will give him a head start on being a teenager.  Calvin thinks it's like getting seven extra years.
