"19890824":
  transcript: WHAP! Too late! I made another home run. (pant pant) I'm quitting if we don't stop using this tennis ball.
  description: Calvin hits the ball and leisurely walks the bases.  He walks with his hands in his pocket and strolls along.  He's on home plate before Hobbes can tag him.  He tells Hobbes he's too late.  He's gotten another home run.  Hobbes, panting, says he's going to quit if they don't stop using a tennis ball.
