"19890830":
  transcript: Hi, Mom. Can I look at your wallet for a few minutes? I, uh, want to see something. Hold on. Did you make your bed like I asked you? I'm working on it. As I recall, your bed is in your room. I'm inventing a robot to make the bed, but I need a grant. Can I have $50? What'd she say? Did you get the money? Boy, when we're the cover story of popular mechanics, I'll have some choice words to say about family encouragement.
  description: Calvin asks Mom if he can look at her wallet.  She asks if he cleaned his room.  Calvin says he's inventing a robot to make the bed, but he needs a grant.  He asks for $50.  As Calvin enters the bedroom, Hobbes asks if she gave him the money.  Calvin says that when they're the cover story for Popular Mechanics, he'll have some choice words to say about family encouragement.
