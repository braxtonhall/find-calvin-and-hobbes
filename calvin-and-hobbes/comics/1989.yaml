"19890906":
  transcript: Calvin, would you lead the class in the pledge of allegiance? NO! What did the Supreme Court decide about that? Is this a prayer? Don't you have to read me my rights? I don't have to keep up with this stuff! I'm just a kid! I'm only here because my parents make me go! I don't want to be a test case! I don't even know what court district I'm in! Call on someone else! Calvin? *sighhhh* I can't believe it's not even 8:15 yet.
