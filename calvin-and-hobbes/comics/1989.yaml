"19890903":
  transcript: Calvin? Calvin? Calvin! Hmm... the engine's making funny noises. Spaceman Spiff is going down over Planet Gork! Zounds! The planet is inhabited! An alien metropolis opens up before our hero's eyes! Spiff's stabilizers refuse to respond! Our hero is going to crazh! THIS SPELLS DISASTER! CALVIN! ..uh... D... I... S... A... S... T... E... R. Very good. I'm glad you were paying attention. YES! Once again the incredible Spaceman Spiff beats all odds to save the day! You may sit down, Calvin.
  description: Spaceman Spiff is going down over planet Gork.  The planet is inhabited.  Spiff's stabilizers refuse to respond. Our hero's going to crash.  This spells disaster!  Calvin is startled by the teacher calling his name.  He spells disaster.  The teacher congratulates him for paying attention.  Once again, Spaceman Spiff beats all odds to save the day.  The teacher tells him he can sit down.  He's standing on his chair, fists clenched together.
