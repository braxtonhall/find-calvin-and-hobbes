"19890831":
  transcript: OK, the first thing our robot needs is a head. Should we use a coffee can? No, that's too small. The head has to hold his tape recorder. See, I've made recordings for the robot's voice! Really? Sure! This way, our robot not only communicates, but we can also "program" him to have the proper personality! Personality? Right. Robots should be RESPECTFUL. *click* How may I ease your life, oh grand exalted master?
  description: Calvin decides the first thing the robot needs is a head.  Hobbes suggests a coffee can.  Calvin says the head has to be big enough for a tape recorder.  He's made recordings for the robot's voice.  Calvin says that in addition to communicating, they can program the robot to have the proper personality.  Hobbes wonders what he means.  Calvin says robots should be respectful.  He turns on the tape recorder which says "How may I ease your life, oh grand exalted master".
