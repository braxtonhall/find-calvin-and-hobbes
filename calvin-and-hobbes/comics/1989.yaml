"19890918":
  transcript: Listen, Moe, that's my truck, and I want it back! Yeah? Yeah! It's my favorite truck. You had no right to take it! Yeah? Yeah! So give it back! NOW! I'll fight you for it. I'll bet my autopsy reveals my mouth is too big. C'mon, wimp!
  description: Calvin  walks up to Moe and demands his truck back.  Calvin says it's his favorite truck, and Moe had no right to take it.  Calvin tells him to give it back now.  Moe offers to fight Calvin for it.  Calvin bets his autopsy reveals that his mouth is too big.
