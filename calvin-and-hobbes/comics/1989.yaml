"19890717":
  transcript: "Well, there's no delaying the inevitable. Let's get in the car. Where are we going? The same place we go EVERY summer: camping on some desolate rock at the end of the earth. AGAIN? Yep. This is how Dad likes to unwind. With everyone complaining? Right. He likes to watch us suffer."
  description: In his bedroom, Calvin tells Hobbes there's no delaying the inevitable.  He tells him to get in the car.  Hobbes asks where they're going.  Calvin tells him the same place they go every summer, camping on some desolate rock at the end of the earth.  Calvin says that's how Dad likes to unwind.  Hobbes asks "With everyone complaining".  Calvin says Dad likes to watch them all suffer.
  characters: [calvin, hobbes]
"19890718":
  transcript: Look, Dad. There's a town coming up. See the sign? Why don't we pull off, find a nice motel, and just stay THERE for our vacation? We could swim in the pool and have air conditioning and color cable TV and room service! No one would have to know we didn't camp! I wouldn't tell anyone! We could even go to the store, buy a big fish, take your picture with it, and say you caught it! Can't we, Dad? Can't we turn off here? Yes, let's! Now don't YOU start!
  description: Driving along the road, Calvin tells Dad there is a town coming up.  He suggests they just pull off, find a nice motel, and stay there for their vacation.  They could swim in the pool, have air conditioning, cable TV, and room service.  No one would have to know they didn't camp.  Calvin won't tell.  He suggests they can go to the store, buy a big fish, take his picture with it, and say they caught it.  He asks Dad if they can.  Mom thinks that's a good idea.  Dad looks at her and tells her not to start.
  characters: [calvin, mom, dad]
"19890719":
  transcript: Ta da! We're here! Good ol' itchy island". Home of the nuclear mosquitoes. Bug bites build character. Yeah, and last year you said diarrhea builds character. So think what a fine young man you're growing up to be. ... if all this character doesn't kill me first. That reminds me, open the duffel bag and get out the spam. If the canoe isn't here in the morning, it means Hobbes and I struck out for home.
  description: Dad pulls up the canoe and says they're here.  Calvin says it's good ol' "Itchy Island", home of the nuclear mosquitos.  Dad says bug bites build character.  Calvin reminds him that last year Dad said diarrhea builds character.  Dad wants Calvin to think of what a fine young man he's growing up to be.  Calvin agrees, if building all this character doesn't kill him first.  Dad asks Calvin to open the duffel bag and get out the Spam.  Calvin tells him that if the canoe is gone in the morning, it means Hobbes and he struck out for home.
  characters: [calvin, dad]
"19890720":
  transcript: Boy, it's great to be here! This is the life! I think I'll jump in for a swim. Want to join me? No, thanks. Aw, c'mon. It'll feel great. Right. That lake couldn't have melted before yesterday. Hey, let's go for a swim. Sure, Dad. I'd love to start the week with a little hypothermia. I think what I like best about vacations is the family togetherness.
  description: Dad says it's great to be there.  He thinks he'll jump in for a swim.  He asks Mom to join him.  Mom thinks the lake couldn't have melted before yesterday.  Dad asks Calvin to join him.  Calvin doesn't want to start the week with a little hypothermia.  Dad goes in alone.  Swimming on the lake, he comments on the best thing about vacations being the family togetherness.
  characters: [calvin, mom, dad]
"19890721":
  transcript: Wake up, Calvin. It's 5:30 and you can see the fish jumping. Mmf goway. It's a beautiful morning. The sun's barely up and there's a mist over the water. It's perfectly still. Not a soul anywhere! Don't you want to see this? Leemeelone. I thought you said you wanted to go fishing. You've got to get up early if you want to catch anything. C'mon, the canoe's all ready and I've got your fishing rod. MOM, make Dad go away! Another thing I like about vacations is the sharing of special moments.
  description: Dad is outside Calvin's tent telling him to wake up and watch the fish jumping.  He says it's a beautiful morning.  The sun is barely up, and there is a mist on the water.  There isn't a soul anywhere.  He tells Calvin he thought Calvin wanted to go fishing.  He tells him he has to get up early if he wants to catch anything.  The canoe's ready, and the fishing pole is loaded.  Calvin yells for Mom to make Dad go away.  Fishing alone on the lake, Dad comments that another thing he likes about vacations is the sharing of special moments.
  characters: [calvin, dad]
"19890722":
  transcript: Well, I guess that's enough gishing for now. Mmm, I can't wait to get back and have breakfast! I can almost smell the coffee from here! What a life! Hey, where IS every... THERE'S GOING TO BE A SMALL MOUTH BASS FLOPPING IN SOME SLEEPING BAGS IN A MINUTE OR TWO! You know, I really like it when you go off to work in the mornings. It's 6:30 already! Are you people going to waste the whole day?
  description: Dad decides that's enough fishing for now.  He paddles back to camp.  He can't wait for breakfast.  He can almost smell the coffee from the canoe.  He pulls the canoe up and wonders where everyone is.  He yells that there will be some smallmouth bass flopping around in some sleeping bags in a minute or two.  Mom looks out her tent and says she likes it when Dad goes off to work in the mornings.  Dad says it's 6:30 already.  He asks if they're going to waste the whole day.
  characters: [calvin, mom, dad]
"19890723":
  transcript: Ahh... a day at the late! This will be great! I still don't see why we can't just sit in the car with the air conditioner on. I'M GETTING SAND IN MY SUIT! I DON'T WANT TO SIT ON THE BEACH! THIS WATER'S TOO COLD! I'M FREEZING TO DEATH! OUT HERE THERE'S TOO MUCH SUN! I'LL GET SUNBURNED! THIS LOTION MAKES ME GREAY AND MY SHIRT MAKES ME TOO HOT! I DON'T WANT TO SIT IN THE SHADE! THIS IS BORING! I HATE WALKING! MY LEGS ARE TIRED AND THE SAND IS TOO HOT AND THE WATER IS TOO COLD AND THERE'S NO SHADE HERE AND I'VE STILL GOT SAND IN MY SUIT! What? Are we going already?
  description: Calvin plays on the beach.  He complains that he's getting sand in his suit, and he doesn't want to sit on the beach.  In the water, he complains the water is too cold.  On the beach again, he complains that there's too much sun, and he'll get sunburned.  Dad tries to put tanning lotion on Calvin, but he complains the lotion makes him greasy and the shirt makes him too hot.  Under the umbrella, he complains it's boring in the shade.  Walking along the beach with Dad, he complains that he hates walking.  His legs are tired, the sand is hot, the water's cold, there's no shade, and he still has sand in his suit.  Mom and Dad pick up the beach towels and umbrella.  Calvin asks if they're going already.
  characters: [calvin, mom, dad]
"19890724":
  transcript: I'll bet I'm missing some great TV shows.
  description: Calvin is sitting on a rock with Hobbes looking at the sun set.  There are birds flying, a few clouds in the sky, rock outcroppings and woods all around.  Calvin says he bets he's missing some great TV shows.
  characters: [calvin, hobbes]
"19890725":
  transcript: Watcha doin', Dad? Painting a picture? Yep. You're giving your harmonica skills a real run for the money. Who asked you?
  description: Calvin asks Dad if he's painting a picture.  Dad says yes.  Calvin looks at the picture, then looks at the scene Dad is painting.  Calvin says Dad is giving his harmonica playing skills a real run for the money.
  characters: [calvin, dad]
"19890726":
  transcript: SNIFF SNIFF Z Hey, what are you doing? Are you awake? Sniff sniff smack smack You're dreaming, stupid. Wake up. Mm! Why yes, thank you, some good fresh fish would hit the spot! Ooh, there's a nice big 'one! AAUGH! I don't care WHAT all your clothes smell like! I'm not washing anything now! Go to bed!
  description: Late at night, Hobbes sniffs the air in his and Calvin's tent.  He's asleep.  Calvin tells him he's dreaming and to wake up.  Hobbes licks his lips and says some fresh fish would hit the spot.  He says there's a nice big one.  Calvin is frightened!  He holds the flashlight at Mom's tent while she tells him she doesn't care what his clothes smell like.  She's not washing anything now.
  characters: [calvin, hobbes, mom]
"19890727":
  transcript: Ooh, these bugs are awful! I itch all over! Don't scratch the bites or you'll just make the itching worse. What am I supposed to do then? It's driving me crazy! Think about something else. Something else?! Like what?? Like maybe stepping out of all that poison ivy. I HATE THIS PLACE!
  description: Calvin is scratching.  He says the bugs are awful.  Hobbes tells him not to scratch, or he'll make the bites worse.  Calvin asks Hobbes what he's supposed to do.  The itching is driving him crazy.  Hobbes tells him to think of something else.  Calvin asks what.  Hobbes suggests something like stepping out of all that poison ivy.  Calvin yells that he hates this place.
  characters: [calvin, hobbes]
"19890728":
  transcript: OK, gang, smile! Ack! Don't take a picture of ME! I haven't washed my hair in three days and I'm covered with bug bite! But don't you want something to remember our trip by? I don't want to remember this trip! I've been trying to forget it ever since we got here! When are we leaving this dump? The next time I see one of those smarmy Kodak commercials I'm going to put an ax through the TV.
  description: Dad tries to take a picture of Mom and Calvin eating.  Mom says no, because she hasn't washed her hair for three days, and she's covered with bug bites.  Dad asks if she doesn't want something to remember the trip by.  Calvin doesn't want to remember it.  He says he's been trying to forget it ever since they got there.  He asks when they're leaving this dump.  Dad walks away saying the next time he sees one of those smarmy Kodak commercials, he's going to put an ax through the TV.
  characters: [calvin, mom, dad]
"19890729":
  transcript: This vacation sure went quickly. I can't believe it's time to go home so soon. After being out here, it will sure be a culture shock to go back to civilization, won't it? Man, I can't wait to get in the car and crack up the A/C and some tunes. Shake a leg, huh? Someday I'm going to get my DNA tested and see if he's really my kid. Take my word for it.
  description: As they're packing up to leave, Dad comments on how quickly the vacation went.  He thinks after being out there, it will be a shock to go back to civilization.  Calvin walks by with his sleeping bag and says he can't wait to get into the car, and crank up the A/C and some tunes.  He tells Dad to shake a leg.  Dad suggests that some day he'll get his DNA tested to see if Calvin really is his kid.
  characters: [calvin, mom, dad]
"19890730":
  transcript: Why does the sky turn red as the sun sets? That's all the oxygen in the atmosphere catching fire. Where does the sun go when it sets? The sun sets in the west. In Arizona actually, near flagstaff. Oh. That's why the rocks there are so red. Don't the people get burned up? No, the sun goes out as it sets. That's why it's dark at night. Doesn't the sun crush the whole state when it lands? Ha ha, of course not. Hold a quarter up. See, the sun's just about the same size. I thought I read that the sun was really big. You can't believe everything you read, I'm afraid. So how does the sun rise in the east if it lands in Arizona each night? Well, time for bed. I hope someday I'm as smart as Dad is. Why, what did he tell you now?
  description: Sitting on the step of their home, Calvin asks Dad where the sun goes when it sets.  Dad says Flagstaff, Arizona.  He says that's why the rocks there are so red.  Calvin asks if the sun doesn't crush the state when it lands.  Dad says no.  He holds a quarter in front of the sun and tells Calvin the sun is about the same size.  Calvin mentions he thought the sun was really big.  Dad tells him he can't believe everything he reads.  Calvin asks how the sun can rise in the east if it lands in Arizona each night.  Dad says it's time for Calvin to go to bed.  As Mom tucks Calvin in, he tells her that he hopes someday to be as smart as Dad.  Mom asks what Dad told him now.
  characters: [calvin, hobbes, mom, dad, stuffedhobbes]
"19890731":
  transcript: Off to work, eh, Dad? Yep. It sure is a nice day. The kind of day just made for sitting under a tree and reading a good novel cover to cover, don't you think? Too bad that's a luxury at your age. Well, maybe you can do it when you're 65. I'm sure you'll be that old before you know it. Enjoy your day at work. Dad sure is surly in the mornings.
  description: Dad's going off to work.  Calvin says it's a nice day to sit under a tree and read a good book.  Calvin says it's too bad that's a luxury at Dad's age.  He says maybe Dad can do it when he's 65.  Calvin is sure Dad will be there before he knows it.  He wishes Dad a good day at work.  Calvin walks up to Mom and tells her Dad sure is surly in the mornings.
  characters: [calvin, mom, dad]
"19890801":
  transcript: You know what's weird? I don't remember much of anything until I was three years old. Half of my life is a complete blank! I must've been brainwashed! Good heavens, what kind of sicko would brainwash an infant?! And what did I know that someone wanted me to forget?? Boy, am I mysterious. I seem to recall you spent most of the time burping up.
  description: Calvin tells Hobbes he doesn't remember much before he was three years old.  He says half his life is a blank.  He must have been brainwashed.  He wonders what kind of sicko would brainwash an infant.  What did he know that someone wanted him to forget?  He says he's mysterious.  Hobbes says he seems to recall Calvin spent most of the time burping up.
  characters: [calvin, hobbes]
"19890802":
  transcript: MOM! There's a big horsefly on the back of your head! Don't move! I'll get it! I'll get it! Is it still there? You didn't move, did you? Get away from me!
  description: Calvin tells Mom there is a big horsefly on her head.  He tells her not to move.  He runs off, goes upstairs, and returns with his plastic dart pistol.  He asks if the fly is still there.
  characters: [calvin, mom]
"19890803":
  transcript: Arr! We're bloodthirsty pirates! Avast, ye scurvy dogs! Hoist the jolly roger and ready the plank! Here. What's this? Our booty!
  description: Calvin and Hobbes are in their tree fort.  Calvin says they're bloodthirsty pirates.  Calvin calls avast, ye scurvy dogs.  He tells Hobbes to hoist the Jolly Roger and ready the plank.  Hobbes hands Calvin a small knit sock.  Calvin asks what that is.  Hobbes tells him "our booty" and starts laughing.
  characters: [calvin, hobbes]
"19890804":
  transcript: Hey, Mom, did you know that gravity in outer space works as if space was a soft, flat surface? It's tru. Heavy matter, like planets, sinks into the surface and anything passing by, like light, will "roll" toward the dip in space made by the planet. Light is actually deflected by gravity! Amazing, huh? And speaking of gravity, I dropped a pitcher of lemonade on the kitchen floor when my roller skates slipped. How can kids know so much and still be so dumb?
  description: Calvin asks Mom if she knew gravity in outer space works as if space was a soft, flat surface.  He explains that heavy matter, like planets sink into the surface, and anything passing by, like light, will "roll" toward the dip in space made by the planet.  Light is deflected by gravity.  Then he adds that he dropped a pitcher of lemonade on the kitchen floor when his roller skates slipped.  As Mom mops up the mess, she wonders how kids can know so much, yet be so dumb.
  characters: [calvin, mom]
"19890805":
  transcript: You know. The world should've been designed so everyone didn't have to eat each other to survive. There should just be fewer people and animals to begin with. And the world certainly could've used a more even distribution of its resources, that's for sure. I wonder why nobody consulted you. Incredible, isn't it?
  description: Calvin and Hobbes are riding their wagon down the hill.  Calvin thinks the world should have been designed so everyone didn't have to eat each other to survive.  There would just be fewer people and animals to begin with.  Calvin adds the world could have used a more even distribution of resources.  Hobbes wonders why no one consulted Calvin.
  characters: [calvin, hobbes]
"19890806":
  transcript: ""
  description: Hobbes pitches the baseball to Calvin.  It sails over his head, but Hobbes calls him out.  Calvin protests.  They get in each other's face and kick dirt on each other.  They fight until they're exhausted.  Calvin decides to try something else.  He gets a step ladder, stands on it with his bat, and gets ready for the pitch.
  characters: [calvin, hobbes]
"19890807":
  transcript: I performed a scientific experiment today. You know how maps always show north as up and south as down? I wanted to see if that was true or no. What did you find out? Not much. Your compass didn't survive the trip south from the top of the tree. MY compass?! Let me know when you get a new one. My junior scientist book says not to get discouraged by temporary setbacks.
  description: Calvin tells Dad he performed a scientific experiment today.  He wanted to see if it's true that north is up and south is down, like what maps show.  Dad asks what he found out.  Calvin tells him not much.  Dad's compass didn't survive the trip south from the top of the tree.  Calvin walks away telling Dad to let him know when he's replaced it.  His junior scientist book told him not to be discouraged by temporary setbacks.
  characters: [calvin, dad]
"19890808":
  transcript: I've been thinking. You know how boring Dad is? Maybe it's a big phony act! Maybe after he puts us to bed, Dad dons some weird costume and goes out fighting crime! Maybe this whole "Dad" stuff is his secret identity! Maybe the Mayor calls Dad on a secret hot line whenever the ciy's in trouble! Maybe Dad's a masked superhero! If that's true, he should drive a cooler car. I know. Ours doesn't even have a cassette deck.
  description: Calvin tells Hobbes he thinks Dad being boring might be phony.  He thinks that after Dad puts them to bed, he puts on a costume and fights crime.  Maybe this "Dad" stuff is a secret identity.  Calvin wonders if the mayor calls Dad on a secret phone and that Dad's a superhero.  Hobbes says if that's true, Dad should drive a cooler car.  Calvin agrees, since their car doesn't even have a cassette deck.
  characters: [calvin, hobbes]
"19890809":
  transcript: There's the stegosaurus out front! There's the National History museum. Hooray! I can't wait to see all the dinosaurs! C'mon. Let's hurry! It's certainly been a while since we've been here, hasn't it? At the museum's request, yes. Oh, that's right. Calvin, no biting people this time, remember? RROWRR
  description: The family drives up to the Natural History Museum.  Calvin sees the stegosaurus in front.  Calvin can't wait to see the dinosaurs and rushes from the car.  Mom says it's been a while since they were at the museum.  Dad mentions that was at the museum's request.  That reminds Mom, who tells Calvin not to bite anyone this time.  Calvin is already roaring like a dinosaur.
  characters: [calvin, hobbes, mom, dad, stuffedhobbes]
"19890810":
  transcript: What kind of dinosaur did you say this was? It's a stegosaurus! He looks pretty ferocious. No, he was a plant eater. The tail spikes were for self-defense. Oh. Did tyrannosaurs fight these? Of course not, Mom! Turannosaurs came millions of years later! Look, try not to embarrass me when we go inside, OK? Why are we going here if he already knows everything?
  description: Mom asks Calvin what kind of dinosaur they're in front of.  Calvin tells her it's a stegosaurus.  Mom says it looks ferocious, but Calvin tells her it was a plant eater.  He tells her the tail spikes were for self-defense.  Mom then asks if tyrannosaurs fought them.  Calvin tells her of course not.  Tyrannosaurs came millions of years later.  Calvin walks to the building telling her not to embarrass him when they go inside.  Dad wonders why they're going in if he knows everything already.
  characters: [calvin, hobbes, mom, dad, stuffedhobbes]
"19890811":
  transcript: Look, Hobbes, here's an ancestor of YOURS! A saber-toothed tiger! Ha ha, I'll bet HE was popular! If anyone needed to open a can of juice, they'd just put him over it and hit him on the head! Ha ha! Hee hee, I'll bet they died out because they couldn't understand each other! They pwobabbyy dokked wike diff! Ha ha ha! ... all in all, though, they were undoubtedly the pinnacle of prehistoric evolution.
  description: Calvin shows Hobbes a saber-toothed tiger.  Calvin makes fun of it by saying anyone needing a can of juice opened would just put him over it and hit his head.  Calvin continues by saying they probably died out because they couldn't understand each other.  He makes a face and shows his teeth.  Hobbes grabs Calvin by the shirt and frowns at him.  Calvin quickly points out that all in all, they were the pinnacle of prehistoric evolution.
  characters: [calvin, hobbes]
"19890812":
  transcript: Look, Mom. The museum has a gift shop! Can I buy something? They've got dinosaur models, dinosaur T-shirts, dinosaur posters... I don't think you need any more dinosaur stuff, Calvin. But Mom, it's all EDUCATIONAL! You want me to LEARN, don't you?? Boy, she fell for THAT one. I'll say! I wonder if we could get any Batman junk this way.
  description: Calvin points out the museum gift shop to Mom.  He wants to buy something, a poster, a book, t-shirts, models.  Mom says she doesn't think he needs any more dinosaur stuff.  Calvin says it's all educational.  Doesn't she want him to learn?  Calvin, walks with his dinosaur hat, poster, and book.  Hobbes says she sure fell for that one.  Calvin wonders if he can get any Batman junk that way.
