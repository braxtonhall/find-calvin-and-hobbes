"19890910":
  transcript: MMFF. I've decided to be an intellectual.
  description: Hobbes is running with the football.  Calvin tries to make the tackle.  Calvin doesn't slow Hobbes down. Calvin gets run over and holds Hobbes' tail.  Finally, Calvin falls off.  Calvin waves Hobbes away.  They are playing chess, and Calvin says he's decided to be an intellectual.
  characters: [calvin, hobbes]
"19890911":
  transcript: I want that truck, Twinky. It's mine, Moe. I brought it from home. I said gimme the truck. Moe, you can't just TAKE things from people just because you're bigger! I'm not taking it. You're GIVING it to me because we'll both be so much happier that way. How touching.
  description: Moe wants the truck Calvin is playing with.  Calvin tells Moe he can't just take something because he's bigger than others.  Moe cocks his fist and tells Calvin he's not taking it.  He says Calvin is going to give it to him.  They'll both be much happier that way.  After Moe leaves, Calvin says "How touching".
  characters: [calvin, moe]
"19890912":
  transcript: Moe, give me my truck back. It's not yours. It is NOW. You gave it to me. I didn't have much choice, DID I?! It was either the truck or get punched. So? So I only "gave" it to you because you're bigger and meaner than me! Yeah? ... so? The forensic marvel has reduced my logic to shambles. You're saying you changed your mind about getting punched?
  description: Calvin goes back to get his toy truck.  He tells Moe it's not his.  Moe says that it is because Calvin gave it to him.  Calvin replies that he didn't have much of a choice.  It was either give up the truck or get punched.  He explains he only gave it to Moe because Moe is bigger and meaner than he.  Moe says "So".  Calvin declares that the forensic marvel has reduced his logic to shambles.  Moe cocks his fist and wonders if Calvin is changing his mind about getting punched.
  characters: [calvin, moe]
"19890913":
  transcript: That no-good, rotten Moe! He won't give my truck back to me. The oaf will probably break it, too. Should I steal it back? I know stealing is wrong, but HE stole it from ME, and if I DON'T steal it back, Moe will just keep it, and that's not fair. They say two wrongs don't make a right, but what are you supposed to DO then? Just let the biggest guy make up his own rules all the time? Let might make right? ... that sounds reasonable.
  description: Calvin complains that Moe won't return his truck.  He wonders if he should steal it back, since stealing is wrong.  If he doesn't steal it back, Moe will keep it and that's not fair, either.  Calvin wonders what you're supposed to do if two wrongs don't make a right.  Do you let the biggest guy make his own rules all the time?  Calvin sits down and says that sounds reasonable.
  characters: [calvin]
"19890914":
  transcript: By golly, I AM going to steal my truck back from Moe! It's mine and he has no right to have it! I'll just sneak up behind the swings here, and when Moe's not looking, I'll run up, grab the truck and take off. This playground should have one of those automatic insurance machines like they have in airports.
  description: Calvin decides to steal his truck back.  He sneaks up to the swings and plans to run up, grab the truck, and take off.  He awaits his chance.  He thinks his playground should have one of those automatic insurance machines like they have in airports.
  characters: [calvin]
"19890915":
  transcript: OK, Moe's got his back to me! Now I'll zip over, steal my truck back and run like crazy! He'll never know what hit him! By the time he ses the truck is gone, I'll be a mile away! It's a fail-proof plan! Nothing can go wrong! It's a snap! There's no reason to hesitate. It'll be over in a split second, and I'll sure be glad I have my truck back! I'll just do it and be done! Nothing to it! It's easy! Obviously my body doesn't believe a word my brain is saying.
  description: Moe has his back turned.  Calvin is ready to make his move.  Calvin says by the time Moe realizes the truck is gone, Calvin will be a mile away.  He says nothing can go wrong.  He says there's no reason to hesitate.  He'll sure be glad to have his truck back.  He'll just do it and be done.  It's easy.  He still stands there.  He says obviously, his body doesn't believe a word his brain is saying.
  characters: [calvin]
"19890916":
  transcript: Phooey, who am I kidding? I'd never get away with stealing my truck back from Moe. The ugly galoot is the size of a buick. Hmm... since I can't FIGHT him, maybe I should try TALKING to him. Maybe if I reasoned with him, he'd see MY side. Maybe he'd realize that stealing hurts people, and maybe he'd return my truck WILLINGLY. Maybe if I'm really lucky, I won't go through life with the nickname "omelet face".
  description: Calvin wonders who he's kidding.  He'll never get away with stealing his truck back.  He says Moe is an ugly galoot the size of a Buick.  Since he can't fight Moe, he thinks he could talk to him.  Maybe Moe would see his side if he reasoned with him.  Maybe Moe will realize stealing hurts people, and he'll return the truck willingly.  Calvin says maybe if he's really lucky, he won't have to go through life with the nickname "omelet face".
  characters: [calvin]
"19890917":
  transcript: Dear, sometime, I want you to look at that discolored spot on the rug. It seems to be getting bigger all the time. May I leave the table? Like right now?
  description: Calvin starts to eat his dinner.  He holds the food in his mouth.  He takes a drink.  His cheeks puff out.  His eyes get wide.  He looks back and forth.  He ducks under the table.  He looks relieved, and his mouth is empty.  Mom tells Dad she wants him to look at that discolored spot on the rug.  She says it seems to be getting bigger all the time.  Calvin asks if he can leave the table right now.
