"19890714":
  transcript: I never liked ice cream cones too much until I discovered a new way to eat them. I bite off the bottom of the cone and suck out the ice cream as it gets soft. You wouldn't believe some of the awful noices you can make, and it gets pretty sloppy when the cone gets soggy and both ends start dripping. In MY book, food should be nutrition AND entertainment. That's why we tigers like our food surprised and running.
  description: Calvin tells Hobbes he never liked ice cream cones very much until he discovered a new way to eat them.  He bites off the bottom and sucks out the ice cream as it melts.  He says you wouldn't believe the awful noises you can make, and it gets sloppy when the cone gets soggy and both ends start dripping.  In Calvin's book, food should be nutrition and entertainment.  Hobbes says that's why tigers like their food surprised and running.
  characters: [calvin, hobbes]
"19890715":
  transcript: I'm so smart it's almost scary. I guess I'm a child progeny. Most children are. Huh? Nothing. People think it must be fun to be a super genius. But they don't realize how hard it is to put up with all the idiots in the world. Isn't your pants zipper supposed to be in the front?
  description: Calvin says he's so smart, it's scary.  He says he is a child progeny.  Hobbes rolls his eyes and says most children are.  Calvin wonders what he means, Hobbes says nothing.  Calvin says people think it's fun to be a super genius, but they don't realize how hard it is to put up with all the idiots in the world.  Hobbes asks if Calvin's pants zipper shouldn't be in front.
  characters: [calvin, hobbes]
"19890716":
  transcript: FWOOSH Heh heh heh... You're in trouble NOW, Hobbes! Heh heh heh! While you have just ONE water balloon, I have THREE! I'm a walking arsenal of hydro-weaponry! Ha ha! I can see the fear in your eyes! You realize that I can get you three times wetter than you can get me! Throw your balloon, and your utter sogginess is assured! I, on the other hand, can act with impunity! With three balloons, I fear nothing! Catch! HEY! DON'T! MY ARMS ARE FULL! OH NO! SPLOOSH GISSHH SPLASH FWOOSH We super powers have it tough. Maybe you should stock up on brains instead!
  description: Calvin is carrying three water balloons, Hobbes has one.  Calvin says he's a walking arsenal of hydro-weaponry.  Calvin says he sees the fear in Hobbes' eyes.  Calvin brags that he can make Hobbes three times wetter than Hobbes can make him.  He chides Hobbes to throw his balloon, and his utter sogginess is assured.  Calvin can act with impunity, he fears nothing.  Hobbes flips his water balloon up into the air and tells Calvin to catch.  Calvin tries juggling his balloons and Hobbes'.  SPLASH!  SPLOOSH!  GISSHH!  FWOOSH!  Calvin, soaking wet, says superpowers have it tough.  Hobbes suggests Calvin try stocking up on brains instead.
