"19890711":
  transcript: Calvin, will you gather the trash, please? Gather the TRASH?!? What am I, your personal SLAVE?! Why can't YOU do it? Fine, I will. And YOU can start washing your OWN clothes, and fixing your OWN meals, and picking up your OWN toys, and making your OWN bed, and cleaning up your OWN messes, day after day after DAY! Some women just weren't meant to be mothers.
  description: Mom asks Calvin to gather the trash.  Calvin asks if he's her personal slave.  He asks why she can't do it.  Mom replies that he can start washing his own clothes, fix his own meals, pick up his own toys, make his own bed, and clean his own messes, day after day after day.  Carrying the laundry basket, Calvin says some women just weren't meant to be mothers.
