"19890821":
  transcript: Calvin the hummingbird zips by with a loud whir! Although small, he puts out tremendous energy. To hover, his wings beat hundreds of times each second! What fuels this incredible metabolism? Concentrated sugar water! He drinks half his weight a day! ... preferably loaded with caffeine. Are you drinking more soda pop?!
  description: Calvin the hummingbird, zips by with a whir.  Though small, he puts out tremendous energy.  Concentrated sugar water fuels his incredible metabolism.  He drinks half his weight each day.  Calvin says "Preferably loaded with caffeine" as he gets a soda from the refrigerator.
