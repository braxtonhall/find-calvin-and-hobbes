"19890709":
  transcript: Darlinggg, I'm home! And I brought a surprise! Let's hope it's a divorce! Darling, I stopped at the hospital on the way home from work. Don't call me "Darling,"OK? I brought home our new baby! A BABY?! I don't want a baby! What shall we name him? Our baby is a RABBIT?!? How come we have a rabbit?! He's NOT a rabbit, he's a little boy! We'll call him "Jeffrey," OK? He looks like a rabbit to ME. Well, just PRETEND he's a baby! NO! This is idiotic! I refuse!! Playing "house"makes me sick! I'm leaving! I don't see why you'll play pretend with your dumb ol'tiger but not with Mr Bun!
  description: A woman comes home and tells her husband that she stopped at the hospital on the way home.  She brought home their new baby.  The husband doesn't want a baby.  The woman cuddles the baby, which is actually a rabbit.  The husband wonders why their baby is a rabbit.  The woman says it's not a rabbit, it's a baby boy.  The husband says it looks like a rabbit to him.  The woman wants to pretend it's a baby.  The husband says he won't.  Calvin walks away, saying playing "house" makes him sick.  Susie doesn't understand why he'll pretend with his tiger, but not with Mr. Bun.
