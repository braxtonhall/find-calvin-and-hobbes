"19890101":
  transcript: Well, it's a new year. And I'd say the first 10 hours haven't been up to snuff. Did you make any new year resolutions? You bet! I resolved to quit hiding my feelings so much! From now on, the world's gonna know exactly what I think of it! Yes, you've certainly been a model of self-restraint and understatement up until now. Well no more. And I've also resolved not to put up with sarcastic tigers. If I see any, I'll tell them.
  description: Hobbes asks Calvin if he made any New Year's resolutions.  Calvin promises to quit hiding his feelings so much.  He says from now on the world will know exactly what he thinks of it.  Hobbes rolls his eyes and says Calvin has certainly been the model of self-restraint and understatement until now.  They walk along for a while.  Calvin thinks about it. He adds that he's also resolved not to put up with sarcastic tigers.  Hobbes tells him if he sees any, he'll tell them.
  characters: [calvin, hobbes]
"19890102":
  transcript: Shovel, shovel, shovel! Why can't we get a snow blower?? We must be the only family in the world that still shovels the driveway by hand! I'm freezing! It builds character. Keep at it. Pretty convenient how every time I build character, HE saves a couple of hundred dollars.
  description: Calvin is shoveling snow.  He asks why they can't buy a snow blower.  He says they must be the only family in the world that shovels the driveway by hand.  He complains it's freezing.  Dad opens the door and tells him to keep at it.  It builds character.  Calvin says it's pretty convenient that every time he builds character, Dad saves a couple hundred dollars.
  characters: [calvin, dad]
"19890103":
  transcript: Next time we go down, I get to steer the sled. You?! You steer like an old lady! Yeah, well, I'm sick of going over and through every obstacle on the hill. "Every obstacle"?!? We missed the briar patch, didn't we?! By going down the gully and into the stream, yes. Oh, you make everything sound so terrible. You should be glad we're alive.
  description: Calvin and Hobbes are both covered with snow.  Hobbes says the next time they go down the hill, he gets to steer.  Calvin complains that Hobbes steers like an old lady.  Hobbes replies that he's tired of going over and through every obstacle on the hill.  Calvin retorts that they missed the briar patch.  Hobbes clarifies that they did by going down into the gully and into the stream.  Calvin tells him he makes everything sound so terrible.  He says Hobbes should be glad they're alive.
  characters: [calvin, hobbes]
"19890104":
  transcript: This is the finest snowball ever made! Painstakingly hand-crafted into a perfect sphere from a secret mixture of slush, ice, dirt, debris and fine powder snow. This IS the ultimate winter weapon. Yes, this marvel of crystalline engineering wi... WHAP!! Another casualty of the seduction of art.
  description: Calvin has created the finest snowball ever made.  He's handcrafted a perfect sphere from a secret mixture of slush, ice, dirt, debris and fine powder snow.  He calls it the ultimate winter weapon.  As he continues praising his snowball, he's smacked by a snowball thrown by Hobbes.  Hobbes says Calvin is another casualty of the seduction of art.
  characters: [calvin, hobbes]
"19890105":
  transcript: What do you think is the best way to get what you want? Is it better to hold fast and never back down, or to compromise? I suppose it's best to hold fast when you can, and compromise when you need to. That's a lot more mature than I think I care to be.
  description: Calvin asks Hobbes what he thinks is the best way to get what you want.  He asks if it's better to hold fast and not back down or to compromise.  Hobbes answers it's best to hold fast when you can and compromise when you need to. Calvin says that's a lot more mature than he thinks he cares to be.
  characters: [calvin, hobbes]
"19890106":
  transcript: I think the short attention span of television is great. As far as I'M concerned, if something is so complicated that you can't explain it in 10 seconds, then it's probably not worth knowing anyway. My time is valuable. I can't go thinking about one subject on end. I'm a busy man. ...who's been sitting here for three hours. ... at six thoughts a minute.
  description: Calvin and Hobbes are watching television.  Calvin thinks the short attention span of television is great.  As far as he's concerned, if something is so complicated you can't explain it in ten seconds, it's not worth knowing anyway.  Calvin says his time is valuable.  He can't go thinking about one subject for minutes on end.  He's a busy man.  Hobbes adds that he's been sitting there watching television for three hours.
  characters: [calvin, hobbes]
"19890107":
  transcript: There's something magical about having a fire. The crackles and snaps, the warm flickering light... everything always seems safe and cozy if you're sitting in front of a fire. And if you've got a hot tiger tummy to lie against, ... WELL!
  description: Calvin is warming his hands by the fire.  He says there's something magical about having a fire.  He comments on the crackles and snaps, the warm, flickering light.  He says everything seems safe and cozy if you're sitting in front of a fire. He sits back against Hobbes, who's sleeping on the floor.  He says it's even better when you have a hot tiger tummy to lie against.
  characters: [calvin, hobbes]
"19890108":
  transcript: C'mon, we'd better go outside for a while. How come? Mom's getting that look. This will be the best snow fort ever built! OK, the main fortress will be a wall five feet high, and go from here down over that hill, with turrets every 50 feet. Over here we'll build an inner wall, in case we have to retreat, and a bin to hold our snow ball reserves. Got it. Hmm... the snow doesn't pack too well, does it? It's not wet enough. Gosh, it'll take forever just to build the outer wall... even without the turrets. I'm cold. Me, too. Let's go in. Maybe we can have some hot chocolate by a fire! This is more fun than actually building the fort anyway. Now where should we put the icicle spikes? All along the outer wall, after the moat. Say, I think you got more marshmallows in your hot chocolate than I did.
  description: Calvin and Hobbes run out to build the best snow fort ever.  Calvin plans for five foot high walls, and turrets every fifty feet.  He shows Hobbes where an inner wall will be, along with a bin to store snowball reserves.  The snow isn't wet enough to pack.  Calvin realizes it will take forever to build just the outer walls.  Hobbes is cold.  Calvin is too, so they go inside to have hot chocolate by the fire.  They decide to draw the snow fort.  Calvin wonders where the ice spikes should go.  Hobbes tells him, and also thinks Calvin got more marshmallows in his chocolate than Hobbes did.
  characters: [calvin, hobbes]
"19890109":
  transcript: The bay doors open and out falls Calvin, the C-Bomb! Calvin is bound to unleash the pure destructive force of a million A-Bombs! The world gasps in horror as he streaks towards his target! OH NO YOU DON'T!!
  description: The bay doors open and out falls Calvin, the C-bomb.  Calvin is about to unleash the power of a million A-bombs.  He streaks toward his target.  Mom grabs Calvin by the shirt as he runs by.  He has a bat in his hand.  Mom says "Oh no you don't".
  characters: [calvin, mom]
"19890110":
  transcript: Will you read this tonight? "An Ode To Tigers"? Hobbes wrote it. "The zebra's stripes are lacking hues, So they don't compare to you-know-whose."Orange, black and white is what to wear! It's haute couture for those who dare! It's camouflage, and stylish, too! Yes, tigers look the best, it's true!" This goes on? For pages. Pretty tedious, isn't it?
  description: Calvin asks Dad to read "An Ode to Tigers" at bedtime.  Hobbes wrote it.  Dad reads the zebra's stripes are lacking hues, they don't compare to you-know-who's.  It's camouflage and stylish, too.  Yes, tigers look best.  It's true.  Dad asks if this goes on.  Calvin tells him for pages.  He asks Dad if he thinks it's pretty tedious.
  characters: [calvin, hobbes, dad]
"19890111":
  transcript: I'M HO-OME! KAPOW WUMPH! Great. The snow cushioned the blow to my spine, so I can now die of pneumonia. Aww, has oo got de sniffoos?
  description: Calvin comes home and opens the door.  Hobbes pounces on him and knocks him into the snow.  Calvin says the snow cushioned the blow to his spine, so now he can die of pneumonia.  Hobbes makes fun of Calvin, mocking him with "Has oo got de sniffoos".
  characters: [calvin, hobbes]
"19890112":
  transcript: I like these cold, gray winter days. Days like these let you savor a bad mood.
  description: Calvin and Hobbes are walking along in the snow.  Calvin likes the cold, gray winter days.  He says days like these let you savor a bad mood.
  characters: [calvin, hobbes]
"19890113":
  transcript: You try it and I'll watch. Sissy.
  description: Calvin has built a loop out of snow on the downslope of the hill.  Hobbes is standing nearby as Calvin pulls the sled up the hill.  Hobbes tells Calvin to try it.  He'll watch.  Calvin calls him a sissy.
  characters: [calvin, hobbes]
"19890114":
  transcript: Look, I put a snowball on top of this snowman's head. Now I'll be the next William Tell, and I'll hit the snowball clean off! Ouch. Ahhh! He flinched!
  description: Calvin puts a snowball on the head of a snowman.  He's going to be the next William Tell, and he'll hit the snowball clean off.  He throws a snowball.  Hobbes looks at the snowman and says "ouch".  Calvin complains that he flinched.
  characters: [calvin, hobbes]
"19890115":
  transcript: Put 'er down here. You know, these things should really come with air bags. Ready? Ready. OFF WE GO-O! Ooh! Yikes! Wow! See? I TOLD you. Help me gather up the sled, you sissy.
  description: Calvin and Hobbes are sitting on the toboggan.  Calvin asks if Hobbes is ready.  He says yes, so off they go. Hobbes steps off the back of the toboggan.  He brushes the snow off himself and watches the toboggan go down the hill.  He turns his head at one point, covering his eyes.  He covers his mouth at another.  He looks into the air, following Calvin's journey.  As Calvin comes back up the hill, covered in snow and branches, Hobbes tells him he told him so.  Calvin tells Hobbes to help him gather the sled, and he calls him a sissy.
  characters: [calvin, hobbes]
"19890116":
  transcript: The fearless Spaceman Spiff finds himself on the planet closest to star X-351! An alien approaches... but in the blinding light, our here can hardly make it out! Is it friendly or hostile? What are you still doing in bed still? Get ready for school! Definitely hostile.
  description: Spaceman Spiff finds himself on the planet surface.  An alien approaches.  In the blinding light, Spiff can't tell whether the alien is friendly or hostile.  Mom comes in to yell at Calvin who's still sitting on his bed.  She tells him to get ready for school.  Spiff, being carried off by the alien, says that it's definitely hostile.
  characters: [calvin, mom, spiff]
"19890117":
  transcript: The school bus will be here any minute! Go! Scoot! Spaceman Spiff, captured by vicious zogwards, is about to be transported to the labor camp! Our hero hatches a bold plan! At the last second, Spiff makes his break! Taking advantage of the planet's low gravity, our hero is away like a shot. There's the bus... but why don't I see Calvin?
  description: Calvin is tossed out the door.  Mom tells him the bus will be by any minute.  Get going!  Spaceman Spiff, captured by the Zogwargs, is being transported to the labor camp.  Our hero hatches a plan.  He makes his break.  Using the planet's weaker gravity, our hero is away like a shot.  Mom looks out the window.  She says she sees the bus, but why doesn't she see Calvin?
  characters: [calvin, mom, spiff]
"19890118":
  transcript: Spiff escapes! Did Calvin get on the bus? I didn't see. ... why? Someone just darted behind that tree. See, there he goes again. Isn't that Calvin? The zogwargs have spotted him! Our hero inflates the emergency jet pack he keeps in his pocket, and prepares for takeoff!
  description: Spiff escapes!  Dad asks if Calvin got on the bus.  Mom says she didn't see.  Dad mentions he saw someone darting behind a tree.  They look and see it again.  Dad asks if that's Calvin.  Spiff inflates the emergency jet pack he keeps in his pocket.  The Zogwargs have spotted him.
  characters: [calvin, mom, dad, spiff]
"19890119":
  transcript: Calvin, what are you doing? You're supposed to be on the school bus! Get over here! Our hero blasts off with his emergency jet pack! Another daring escape for the intrepid Spaceman Spiff! Zounds! The Zogwargs are on rocket scooters! Spiff fires his death ray blaster! It's your own grave you're digging, buster!
  description: Mom gets on her coat and tells Calvin to get over there.  Our hero blasts off on his jet pack.  Another daring escape for the intrepid Spaceman Spiff.  The Zogwargs are on rocket scooters.  Spiff fires his death ray blaster.  Calvin is throwing snowballs at Mom as she chases him.  She tells him he's digging his own grave.
  characters: [calvin, mom, spiff]
"19890120":
  transcript: Young man, you are in VERY big trouble! Why didn't you get on the school bus?! Now I'VE got to drive you, and your Dad will be late for work. You've inconvenienced everyone! What have you got to say for yourself?! Give me liberty or give me death, Zogwarg queen! Don't tempt me! And listen, you call me "Mom," ... got it?
  description: Mom drags Calvin back telling him he's in big trouble.  She asks why he didn't get on the bus.  Now she has to take him to school, and Dad will be late to work.  She tells Calvin he's inconvenienced everyone and asks if he has anything to say for himself.  Calvin tells the Zogwarg Queen to give him liberty or give him death.  Mom turns from the steering wheel with teeth clenched.  She tells Calvin not to tempt her.  She also tells him to call her Mom.
  characters: [calvin, mom]
"19890121":
  transcript: Hey, Calvin, how come you're late today? Why didn't you ride the bus? I was going to skip school, but I got caught. Really? How? Mom had the wind for that final sprint. Your Mom had to CHASE you? I couldn't believe it when she cleared the hedge.
  description: Susie asks Calvin why he was late to school.  Calvin tells her he was going to skip, but he got caught.  When Susie asks how he got caught, Calvin tells her Mom had the wind for that final sprint.  Susie asks if his Mom had to chase him. Calvin tells her he couldn't believe it when Mom cleared the hedge.
  characters: [calvin, susie]
"19890122":
  transcript: OK, let's see... if the wind is blowing north-northeast at 6mph, and I throw the snowball due west at 90 mph with a slight top spin ... Ha! Susie didn't even hear me sneak up. Now I'll cream her cranium with a barrage of snowballs! WHZZZ PUFF These darn crozz breezes! She didn't even notice! You're the worst shot in the world, Calvin! If it wasn't for gravity, you probably couldn't even hit the ground! SMACK! I did it! I did it! Just when it counted, I did it! Ha ha ha! Right in the kisser! Ha ha! Bad news, Mom. I promised my soul to the devil this afternoon. Oh? That recently?
  description: Calvin hides behind a tree.  He plans to cream her cranium with a barrage of snowballs.  Susie is busy making a snowman.  Calvin misses with the toss.  He blames the cross breezes.  Then he throws several snowball, which all miss Susie.  She taunts him by saying he's the worst shot in the world.  She says if it wasn't for gravity, he wouldn't hit the ground. SMACK!  Susie gets nailed by a snowball.  She runs after Calvin, who gleefully comments he did it when it really counted. After going home, Calvin tells Mom that he has bad news.  He says he promised his soul to the devil that afternoon.  Mom asks if it was that recently.
  characters: [calvin, mom, susie]
"19890123":
  transcript: Yes, can I have the tool department, please? Thank you. Hello? How much are your power circular saws? I see. And your electric drills? Uh-huh. How big of a bit will that hold? Really? Great. So the assigment is pages two through four? OK, thanks Susie. ...Sorry about that. Do you carry acetylene torches? OK, ring it all up. This will be on Mastercard.
  description: Calvin is on the telephone asking for the tool department.  He asks the price of circular saws, then electric drills.  He asks how big a bit the drill will hold.  Then Mom walks by.  Calvin acts as if he's talking to Susie about a school assignment.  After Mom passes, Calvin apologizes to the tool department and asks about acetylene torches.  He tells them to ring it up.  He has Dad's MasterCard in his hand.
  characters: [calvin, mom]
"19890124":
  transcript: Look at all this homework I'm supposed to do! I don't want to do this garbage! I want to play outside! Childhood is short and maturity is forever.
  description: Calvin complains about all the homework he has to do.  He tells Hobbes he doesn't want to do the homework, and he wants to play outside.  Calvin and Hobbes are sledding down the hill.  Calvin says "childhood is short and maturity is forever".
  characters: [calvin, hobbes]
"19890125":
  transcript: People are rotten. When I grow up, I'm going to live a million miles away from everyone! How will you survive? What will you eat? ... Well, Mom could come by twice a day to cook, I suppose. That would be quite a commute.
  description: Calvin tells Hobbes that people are rotten.  He says when he grows up, he's going to live a million miles from everyone.  Hobbes asks how he'll survive and eat.  Calvin suggests Mom could come by twice a day to cook.  Hobbes says that would be quite a commute.
  characters: [calvin, hobbes]
"19890126":
  transcript: Get a load of THIS dumb assignment. I'm supposed to write about an adventure I had! I haven't had any adventures! My life has been a big bore from the beginning! Have I ever been abducted by pirates? Have I ever faced down a charging rhino? Have I ever been in a shoot-out, or on a bombing raid? No! I never get to have adventures! What about the time you backed the car through the garage door? You call that an adventure? I didn't even get on the the highway.
  description: Calvin comes home complaining about an assignment he got.  He has to write about an adventure he had. Calvin argues that his life has been one big bore from the beginning.  He's never been abducted by pirates, never faced down a charging rhino, been in a shoot-out, or on a bombing run.  Hobbes asks about the time he backed the car through the garage door.  Calvin doesn't think that was an adventure.  He never even got on the highway.
  characters: [calvin, hobbes]
"19890127":
  transcript: When do you think we'll get a thunder and lightning storm? I don't kow. Probably not until spring. I think he's going to melt before we can bring him to life.
  description: Dad is shoveling snow when Calvin asks him when he thinks they'll get a thunder and lightning storm.  Dad says probably not until spring.  Calvin walks back to Hobbes, who's standing next to a snowman prone on the ground.  Calvin says he thinks the snowman will melt before they can bring him to life.
  characters: [calvin, hobbes, dad]
"19890128":
  transcript: Hey, Susie, stand on this "X". Why? No reason. Just do it. I dare you. No. Please? C'mon! Get lost. This may not work out as well as I thought.
  description: Calvin asks Susie to stand on the "X" he made in the snow.  Susie asks why.  Calvin says there's no reason. He dares her.  She refuses, then walks away.  Calvin pleads for her to do it, but Susie tells him to get lost.  Calvin looks at his bunch of snowballs sitting on a plank lying on top a log.  He says this may not work out as well as he thought.
  characters: [calvin, susie]
"19890129":
  transcript: The valiant Spaceman Spiff is led by his captors to a secret dungeon to be debriefed! Little do they realize that our hero doesn't WEAR briefs! Eat your dinner, Calvin. Ugh. Poised precariously over a percolating pit of putrid pasta, Spaceman Spiff is held prisoner! Still won't talk, eh, Earthling? Our hero's mind races furiously! He's had his chance! Let's make him eat! LOOK BEHIND YOU!! Fool! The human scum escaped! Not for long, Zokbar-2! And tomorrow morning he'll have cold manicotti for breakfast!
  description: Mom tells Calvin to eat his dinner.  Spaceman Spiff is held over a pit of putrid pasta.  Our hero's mind races furiously.  The aliens say that he's had his chance.  Let's make him eat.  Calvin looks surprised, points behind Mom and Dad, and tells them to look behind them.  When they look, Calvin runs off.  One alien says the human scum has escaped.  The other says tomorrow morning, he'll have cold manicotti for breakfast.
  characters: [calvin, mom, dad, spiff]
"19890130":
  transcript: Wow, you've made a lot of snowmen today! Yep. They're efficies. Each one represents someone I hate. When the sun comes out, I'll watch their features slowly melt down their dripping bodies until they're nothing but noses and eyes floating in pools of water. I wasn't aware you even knew this many people. The ones I REALLY hate are small, so they'll go faster.
  description: Hobbes looks at all the snowmen Calvin made.  Calvin says they're effigies.  Each one represents someone he hates.  Calvin says when the sun comes out, he'll watch the snowmen melt until they're nothing but noses and eyes floating in pools of water.  Hobbes looks to the distance.  He says he didn't know Calvin knew so many people.
  characters: [calvin, hobbes]
"19890131":
  transcript: 'I''m writing a book about my life. It''s called, "Calvin: The Shocking True Story of the Boy Whose Exploits Panicked a Nation." Interesting title. Thanks. Specifically what exploits are you referring to? That''s the problem. Can you help me think of some I could do?'
  description: 'Calvin tells Hobbes he''s writing a book about his life, titled "Calvin: The Shocking True Story of the Boy Whose Exploits Panicked a Nation".  Hobbes asks what exploits he''s referring to.  Calvin admits that''s the problem.  He asks Hobbes for some he could do.'
  characters: [calvin, hobbes]
"19890201":
  transcript: Hi Susie. Go away, Calvin! Sit somewhere else! I don't want to know what revolting thing you have for lunch today. Relax, Susie. I'm not going to tell you what I have. You'd better not. I mean it. All I'll say is that I sure feel sorry for my tapeworm. MISS WORMWOOD! Hey! Did I SAY what my lunch is?! Did I?!?
  description: Susie doesn't want Calvin to sit next to her at lunch.  She doesn't want to know what revolting thing he has for lunch today.  Calvin tells her to relax, he's not going to tell her what he has.  Calvin looks at his sandwich and says he sure feels sorry for his tapeworm.  Susie yells for Miss Wormwood.
  characters: [calvin, susie]
"19890202":
  transcript: What's this? A crash test dummy. Now I can see if the hill is safe to go down. Off you go! Ooh, I think I'm going to be sick. Well, I wouldn't have steered like THAT! He deserved it!
  description: Calvin puts a snowman on his toboggan.  He tells Hobbes it's a crash test dummy.  He's going to see if the hill is safe to go down.  Calvin pushes the toboggan forward, and down it goes.  They both watch the toboggan.  Hobbes holds his paws over his mouth and says he thinks he's going to be sick.  Calvin proclaims he wouldn't have steered that way.  He says the snowman deserved it.
  characters: [calvin, hobbes]
"19890203":
  transcript: Oh, no! The air pressure in this room is too high! Calvin's organs are in danger of collapsing! He... he's about to implode! We've got to get out of here! There's too much atmosphere! Sit still and behave. We can't eat at fast food places all the time.
  description: Calvin claims the air pressure in the room is too high.  He sucks in his cheeks and stretches his eyes vertically. He says his organs are in danger of collapsing.  He's about to implode.  Mom, Dad, and Calvin are sitting at a restaurant table. Calvin says they have to get out of there.  There's too much atmosphere.  Mom tells him to sit still and behave.  She tells him they can't eat at fast food places all the time.
  characters: [calvin, mom, dad]
"19890204":
  transcript: These television programs sure are rotten. There isn't an ounce of imagination in the whole bunch. What bilge. Who do they think is stupid enough to sit and watch this trash? You. If there was anything BETTER on, I'd watch THAT.
  description: Calvin complains the television shows are rotten.  There's no imagination in the bunch.  He asks Hobbes who they think is stupid enough to sit and watch this trash.  As Hobbes walks off, he says "You".  Calvin replies if there was anything better on, he would watch that.
  characters: [calvin, hobbes]
"19890205":
  transcript: ""
  description: Calvin makes a bunch of tiny snowmen.  He stands in the middle of them.  He gets an evil look on his face. The tyrannosaurus is loose in the city.  People are running in fear.
  characters: [calvin]
"19890206":
  transcript: You're taking a shower NOW? That means we're going out tonight, right? And you haven't told ME to get cleaned up, so that means I'm staying home, right? And if I'm staying home, that means you've gotten me a babysitter, right? And that means you've probably hired ROSALYN again, right?!? Brilliant, Holmes. AAAHHHHHH!
  description: Calvin sees Mom with her hair wrapped in a towel.  He says since she showered now, she and Dad must be going out.  He also notices that he wasn't asked to clean up, so that means he's staying home.  Since he's staying home, that means Mom has gotten a baby sitter.  With a gasp, he realizes that means Mom probably hired Rosalyn!  Mom confirms his fears by saying "Brilliant, Holmes".  Calvin yells in horror.
  characters: [calvin, mom]
"19890207":
  transcript: Quick, Hobbes! We've got to hide! Mom and Dad got ROSALYN for our baby sitter again! And you know what THAT means! It usually means we're in bed by 6:30. Right! No TV, no horsing around, NOTHING! She just walks in and sends us straight to bed! And then she doesn't even kiss us good nigh. Eww, gross. You WANT her to?!?
  description: Calvin runs to his bedroom warning Hobbes that they have to hide since Rosalyn is coming.  Hobbes says they're usually in bed by 6:30.  Calvin adds they get no TV, no horsing around.  She walks in and sends them straight to bed. Hobbes complains she doesn't even give them a good night kiss.  Calvin makes a face and asks if he would really want her to.
  characters: [calvin, hobbes]
"19890208":
  transcript: Where are you going tonight? Why can't Hobbes and I come? Why do we have to have a babysitter? We're going to dinner and a movie just to have some time to ourselves, OK? But we could come! Hobbes promises not to kill anyone! We'd be good! Really! Why won't you let us come? Why don't you want us around? Is the movie dirty? What's the problem?! Gosh, a dinner with real pauses in the conversation! Can you imagine?
  description: Calvin asks Dad where they're going that night.  He wonders why he and Hobbes can't come along.  Dad says they're going to dinner and a movie to get some time by themselves.  Calvin says that he could come.  Hobbes wouldn't kill anyone.  Calvin asks why they can't come, why aren't they wanted around.  He asks if the movie's dirty or something.  Dad tells Mom that they'll have a dinner with real pauses in the conversation.  Can she imagine?
  characters: [calvin, hobbes, mom, dad, stuffedhobbes]
"19890209":
  transcript: "Hi Rosalyn, come on in. Calvin's hiding upstairs from you, so you may have an easy evening. That would be great. I've got to study tonight for a big test tomorrow. Did you hear THAT? Did you hear THAT? Hee hee! Tonight: the revenge of the baby sat!"
  description: Mom lets Rosalyn in.  She tells Rosalyn that Calvin is upstairs hiding from her, so she may have an easy evening.  Rosalyn says that would be good, since she has to study for a big test tomorrow.  Upstairs, Calvin and Hobbes are listening around the corner.  As Hobbes rubs his paws together, and Calvin puts on an evil smile, he declares that tonight is "The Revenge of the Baby Sat".
  characters: [calvin, hobbes, mom, rosalyn]
"19890210":
  transcript: Hi Rosalyn! How are you? What are you going? Homework? Right. I've got to study for an exam tomorrow, so I want it quiet tonight. Got it? Oh, you bet, Roz. Hobbes and I won't make a peep. Can I see what you're studying? Don't touch anyth... I GOT HER NOTES! I GOT HER NOTES! RUN, HOBBES, RUN!! CALVIN!
  description: Rosalyn is studying her papers at the table.  Calvin comes up and asks what she's doing.  She tells him she has to study tonight, so she wants it quiet.  Calvin says he understands and tells her he and Hobbes won't make a peep.  He asks to see what she's studying.  As Rosalyn tells him not to touch anything, Calvin grabs her notes and runs away.
  characters: [calvin, rosalyn]
"19890211":
  transcript: GIVE ME BACK MY NOTES, YOU LITTLE CREEP! Run! Run! What are we going to do? She'll kill us! Into the bathroom! Lock the door! Quick! CALVIN! Open this door, or your parents will never find your remains! Boy, some baby sitter! Here go your notes!
  description: Rosalyn chases Calvin, who has her study notes.  Calvin and Hobbes run into the bathroom.  They lock the door just before Rosalyn gets there.  She tells Calvin through the bathroom door that if he doesn't open the door, his parents will never find his remains.  Calvin holds her papers over the open toilet and tells her "Here go your notes".
  characters: [calvin, hobbes, rosalyn]
"19890212":
  transcript: Hold still. Now boost! Lift! C'mon! Mph! Get your hand out of my eye! OK, forward! On the way back, you're carrying ME. Hey, I got some mail. It's a valentine card. From Susie Derkins! It says, "Please be my valentine." You're Susie's valentine! I'm not her valentine just because I got this in the mail, am I? Does the post-master general know about this? Calvin and Susie sitting in a tree-ee! Kay-Eye-Ess-Ess-Eye-En-Gee! I don't have to KISS her, do I?! Is that what valentines do??! Oh, gross! First comes Lo-ove, Then comes marriage, Then comes a baby in a baby carriage! This can't be happening! I need a lawyer! She can't make me be her valentine! Here she comes! Here comes Susie! Hi, Calvin. Get away from me! I'm not your valentine! Take your card back! Eww! Girls! Yecchh! That card wasn't for YOU, you moron. Didn't you read the back of the envelope? The back? "Calvin, please give this to Hobbes." HOBBES?! Me? Really? Hot dog! Smooch city, here I come!
  description: Calvin gets a valentine in the mailbox.  It's from Susie Derkins.  Calvin reads the card, which says "Be my valentine".  Hobbes starts making fun of Calvin.  He starts singing "Calvin and Susie, sitting in a tree, K-I-S-S-I-N-G".  Calvin says he's not her valentine just because he got that in the mail.  He asks if the Postmaster General knows about this.  Hobbes continues ridiculing Calvin by singing "First comes love, then comes marriage, then comes baby in a baby carriage".  Calvin is horrified to think he has to kiss Susie if they're valentines.  Calvin wants a lawyer.  He says she can't make him her valentine. Hobbes sees Susie coming.  Susie says hi to Calvin, who throws the valentine on the ground.  He tells her to get away from him, and he's not her valentine.  He tells her to take her card back.  Susie tells Calvin the card wasn't for him.  She asks if he read the back of the envelope.  When Calvin looks at it, it reads "Calvin, please give this to Hobbes".  Calvin is shocked!  Hobbes, with a smile on his face, says "Hot Dog!  Smooch City, here I come".
  characters: [calvin, hobbes, susie]
"19890213":
  transcript: Calvin, you've got two seconds to unlock this door and give me back my science notes! You know, Rosalyn, I'd suggest you adopt a more humble attitude. You wouldn't want anything to HAPPEN to these notes, would you? YOU SCUMMY LITTLE TROLL! When your parents get home, I'll... FLUSH AUGH! There's ONE page!
  description: Rosalyn pounds on the bathroom door telling Calvin he has two seconds to unlock the door and return her science notes.  Calvin suggests she adopt a more humble attitude.  He warns her she wouldn't want anything to happen to the notes.  Rosalyn rattles the door knob, calls Calvin a "Scummy little troll".  As she's telling him what she'll do when Calvin's parents get home, she hears the toilet flush.  Calvin tells her "There's one page".  Rosalyn is horrified.
  characters: [calvin, hobbes, rosalyn]
"19890214":
  transcript: You'd better not have really flushed any of my notes! I've got a big test tomorrow! Well then, with that at stake, our demands should seem very reasonable! DEMANDS?! You don't get any demands! Unlock this door! Boy, you'd think a high school senior would catch on quicker. We should write the school board. Torpedo tube ready, Cap'n!
  description: Rosalyn grits her teeth and says Calvin had better not really have flushed her notes.  She has a test tomorrow. Calvin says with that at stake, his demands should seem reasonable.  Rosalyn says he doesn't get any demands.  She wants him to open the door.  As Calvin walks over to the toilet, he says a high school senior should catch on quicker.  He says he should write the school board.  Hobbes readies the "torpedo tube".
  characters: [calvin, hobbes, rosalyn]
"19890215":
  transcript: I sure hope you memorized this page already, because you're never going to see it again! NO! Don't flush it! Tell me what your stupid demands are. That's more like it! OK, first we want to stay up until my parents drive in. Second, we want you to go pick up a pizza and rent us a video player... YOU'RE OUT OF YOUR MIND! Third... are you writing these down?
  description: Calvin tells her he hopes she memorized the page already, because she'll never see it again.  She tells him not to flush it and asks what his demands are.  Calvin tells her he wants to stay up until his parents drive in.  Then, he wants Rosalyn to get a pizza and rent a video player.  She tells him he's out of his mind.  Calvin continues and asks if she's writing these down.
  characters: [calvin, hobbes, rosalyn]
"19890216":
  transcript: I don't hear her out there any more. Rosalyn?? Are you listening? We have more demands! Do you think she went away? Why would she? We've still got her science notes. Doesn't she want them any more? What's she doing? Maybe she's calling the fire department to ax open the door. Really? You think so? Gosh, that'd be GREAT! Real firemen with real axes! I hope they drive their biggest fire truck! I hope your parents are having a restful evening.
  description: Hobbes doesn't hear Rosalyn any more.  Calvin calls out to her.  No answer.  Calvin wonders if she went away.  Hobbes says they still have her notes.  Calvin can't figure out what she's doing.  Hobbes wonders if she's calling the fire department to open the door with an axe.  Calvin thinks that would be great.  He hopes they bring their biggest truck.  Hobbes hopes Mom and Dad are having a restful evening.
  characters: [calvin, hobbes]
"19890217":
  transcript: Rosalyn? Are you out here? Are you calling the fire departme... GOTCHA! OH NO! I didn't really flush your notes! They're all there! Go look! Please don't kill me! Phooey. Well, it's 7:00. We got to stay up half-hour later than usual.
  description: Calvin opens the bathroom door and peeks out.  He calls to Rosalyn, asking if she's calling the fire department. She darts around the corner and grabs Calvin.  As she carries him off, he tells her he didn't really flush her notes.  He says they're all there and asks her not to kill him.  He's put to bed.  Hobbes points out it's 7:00.  They got to stay up a half hour longer than usual.
  characters: [calvin, hobbes, rosalyn]
"19890218":
  transcript: Rosalyn? We're home. Hi Rosalyn. Did you have a quiet evening? Did you get your studying done? ... no, huh? I'm sorry, but tonight is really going to cost you. You're SURE no one else in this town will agree to baby-sit Calvin? Maybe YOU would like to spend a week on the phone!
  description: Mom and Dad return home.  Mom asks if Rosalyn had a quiet evening and got her studying done.  Rosalyn has a worn look to her face.  She says she's sorry, but tonight is going to cost them.  Having paid Rosalyn, and her having left, Dad asks Mom if she's sure that no one in town will baby-sit Calvin.  Mom replies that maybe he'd like to spend a week on the phone.
  characters: [mom, dad, rosalyn]
"19890219":
  transcript: What's this? A Calvin decoy. Pretty good, huh? Now I can find out who my enemies are! I'll hide behind that tree over there and watch to see who throws snowballs at the decoy, thinking it's me! Your enemies must not be very bright. That's why they're out to get me. They can't stand my genius. Hey, Calvin! I see a way your plan might fail. Pipe down, will ya? How can I hide when you're yelling to me from across ... SMACK! See there? My plan to discover my enemies was a complete success. Too bad you took off your coat and hat. You must be soaked.
  description: Calvin builds a snowman he is using as a Calvin decoy.  He dresses the snowman in his hat and coat.  He tells Hobbes he's going to hide behind the tree and watch to see who throws snowballs at the decoy.  He'll find out who his enemies are.  Hobbes looks at the snowman and says Calvin's enemies must not be too bright.  Calvin agrees, saying that's why they're out to get him.  They can't stand his genius.  As Calvin hides behind the tree, Hobbes yells that he sees a way his plan might fail.  Calvin tells him to quiet down.  Hobbes smacks Calvin with a snowball.  Calvin, poking out upside down from the snow, says his plan to discover his enemies was a complete success.  Hobbes says it's too bad he took off his hat and coat, because he must be soaked.
  characters: [calvin, hobbes]
"19890220":
  transcript: Here we are, poised on the precipice of "suicide slope". Below us lie the skeletal remains of hundreds of little sled riders. Searching for that ultimate adrenalin rush, we prepare to hurl ourselves over the bring! What fate awaits us? Ready? No. Life and death hang in the balance! A fraction of a second and one wrong turn are all that separate them! This isn't helping.
  description: On their sled, Calvin says they're at the top of "Suicide Slope".  Below them are the skeletal remains of hundreds of little sled riders.  Searching for that ultimate adrenaline rush, they prepare to go over the brink.  What fate awaits them?  Calvin asks if Hobbes is ready.  Hobbes says no.  Calvin goes on to say life and death hang in the balance.  A fraction of a second and one wrong term is all that separate them.  Hobbes tells him this isn't helping.
  characters: [calvin, hobbes]
"19890221":
  transcript: Dad says the anitipationo of having something is often more fun than actually having it. I think he's crazy. I hate waiting for things. I like to have everything immediately. I can't think of ANYthing I'd rather anticipate than have right away. Can you? Death comes to mind. I don't know why I bother trying to have a little discussion with you when you're always so morbid.
  description: Going down the slope, Calvin says Dad tells him the anticipation of something is often more fun than having it. Calvin thinks he's crazy.  Calvin hates waiting for things.  He likes to have things immediately.  As they fly over a small gorge, Calvin can't think of anything he'd rather anticipate than have.  He asks if Hobbes does.  Hobbes covers his eyes and says death.  As they head into the briar patch, Calvin doesn't know why he bothers discussing things with Hobbes when he's always so morbid.
  characters: [calvin, hobbes]
"19890222":
  transcript: I wish snow was dry, so that you didn't get all cold and wet when you played in it. ...then again, if snow was dry, you couldn't pack it into snowballs. That wouldn't be good. I wish it snowed in summer. Wouldn't that be fun? ... Well no, actually that would make it hard to run when you play baseball. Heck, it's OK just the way it is. We're glad you approve.
  description: Calvin tells Hobbes he wishes snow was dry so you didn't get all cold and wet when you play in it.  Then, he mentions that you couldn't make snowballs, which is bad.  He then wishes it snowed in summer.  But that would make it hard to run when you play baseball.  As he and Hobbes walk away, he decides things are okay as they are.  Hobbes is glad he approves.
  characters: [calvin, hobbes]
"19890223":
  transcript: You can always tell when you get to OUR house.
  description: Mom and Dad are walking down the sidewalk.  They look into a yard and see a snowman with a hat and broom.  A little further on, they see a snowman with a scarf and cap.  They keep walking past a snowman with a small snowman next to it.  They come to their yard and see a snowman with two heads, with both heads having their mouths open. Dad says you can always tell when you get to their house.
  characters: [mom, dad]
"19890224":
  transcript: I think our snow forts are too far apart.
  description: Calvin and Hobbes are each in a snow fort.  There is a bunch of snowballs lying on the snow in front of each fort.  Calvin says he thinks their snow forts are too far apart.
  characters: [calvin, hobbes]
"19890225":
  transcript: Now let's see if Mom jumps out of HER skin.
  description: Calvin bends his knees and jumps into the air.  POP!  His skeleton comes up from his skin.  Calvin, the skeleton, leaves his skin in a pile and walks away.  He says now he'll see if Mom jumps out of her skin.
  characters: [calvin]
"19890226":
  transcript: CLUMP The pteranodon spreads his giant wings, and...
  description: Mom is sewing in her chair as Calvin walks by.  Calvin walks by later with a conical hat and a cape.  Mom keeps sewing.  She hears a CLUMP and walks to the window to see what it was.  She sees a ladder sitting against the wall. She races out of the house, looking up at the roof.  The pteranodon spreads his wings and prepares to soar.
  characters: [calvin, mom]
"19890227":
  transcript: Look at this, Hobbes! I could order an official Chocolate Frosted Sugar Bombs Beanie! See, It has a battery powered propeller on top and a big star on the front! Isn't that neat? You have to send in four box "Proof of Purchase Seals" to get it, it says. Well, don't just stand there, or this will take forever. Ugh. This stuff always makes my heart skip.
  description: Calvin, eating a bowl of cereal, tells Hobbes he could order an official Chocolate Frosted Sugar Bombs beanie.  It has a battery-powered propeller on top and a star on the front.  Hobbes notices you need to send in four "Proof of Purchase Seals" to get it.  Calvin hands him a bowl and tells him to not just sit there or this will take forever.  Hobbes says that cereal always makes his heart skip.
  characters: [calvin, hobbes]
"19890228":
  transcript: Blechh, I feel sick. Oh, c'mon, that's only your second bowl of cereal. This stuff is pure sugar. But it's FORTIFIED with eight essential vitamins, so it's good for you. Give me a break. This is like eating a bowl of milk duds. Look, it says right on the box, "part of a wholesome, nutritious, balanced breakfast." And they show a guy eating five grapefruits, a dozen bran muffins... You know why you shake like that? Vitamin deficiency, I'll bet.
  description: Hobbes feels sick.  Calvin chides him by telling him it's only his second bowl of cereal.  Hobbes complains that it's pure sugar.  Calvin retorts that it's fortified with eight essential vitamins, so it's good for you.  Hobbes responds that it's like eating a bowl of Milk Duds.  Calvin shows him on the box where it says its' a part of a wholesome, nutritious, balanced breakfast.  Hobbes points out the picture shows a guy eating five grapefruits and a dozen bran muffins.  Calvin is shaking from all the sugar.  He tells Hobbes that the reason Hobbes is shaking is due to a vitamin deficiency, he bets.
  characters: [calvin, hobbes]
"19890301":
  transcript: Morning, Dad! How's your breakfast? Fine. Oatmeal, huh? A bowl of pasty, bland, colorless sludge. Yes. Why don't you go describe your OWN food somewhere else? I'll bet you'd rather have a bowl of tasty, up-smacking, crunchy-on-the-outside, chewy-on-the-inside, chocolate forsted sugar bobms! Can I pour you some? No, thanks. I'm trying to reach middle age. What are YOU having, Mom? Boring old toast and tea? YOU want the beanie, YOU eat the cereal, Calvin.
  description: Calvin asks Dad how his breakfast is.  Calvin describes Dad's oatmeal as a bowl of pasty, bland, colorless sludge.  He offers Dad a bowl of "tasty, lip-smacking, crunchy-on-the-outside, chewy-on-the-inside, Chocolate Frosted Sugar Bombs".  Dad says no thanks.  He's trying to reach middle age.  Calvin asks Mom if she's having boring old toast and tea. Mom tells him if he wants the beanie, he eats the cereal.
  characters: [calvin, mom, dad]
"19890302":
  transcript: 1 1/2 boxes to go, and I'll have enough "Proof of purchases seals" to order the propeller beanie they offer. 1 1/3 boxes to go. Man, I'm EARNING this.
  description: Calvin's still eating cereal.  He says he has one and a half more boxes to eat before he has enough "Proof of Purchase Seals" to order the propeller beanie they offer.  He pours himself another bowl.  He looks into the box.  He says he has one and one third more boxes to go.  His cheeks puff out and he sticks his tongue out.  He says "Man, I'm earning this".
  characters: [calvin]
"19890303":
  transcript: Hobbes, I did it! I ate enough boxes of cereal to get all the proof of purchases seals I need! Now I can order my beanie! Oh, boy! I can't wait to get it! I'll be so cool! Not for over a month. It says to allow six weeks for delivery. SIX WEEKS?!? I'll be OLD then! And I'm sure your beanie will be the talk of the rest home.
  description: Calvin excitedly tells Hobbes he ate enough cereal and has enough proofs of purchase to order his beanie. Calvin thinks it will be so cool, he can't wait.  Hobbes tells him it says to allow six weeks for delivery.  Calvin is shocked!  In six weeks, he'll be old.  Hobbes pats his head and says his beanie will be the talk of the rest home.
  characters: [calvin, hobbes]
"19890304":
  transcript: Mom! Mom! Did my beanie come in the mail? Are you kidding? I just mailed your order this morning. I'm never going to make it six weeks,
  description: Sitting in the school bus, Calvin thinks of himself wearing the beanie.  Sitting at his desk in school, Calvin thinks of himself wearing the beanie.  Getting off the school bus at the end of the day, Calvin thinks of himself wearing the beanie.  He asks Mom if his beanie came in the mail.  She tells him she just mailed the order that day.  Calvin shuffles off saying he'll never make it six weeks.
  characters: [calvin, mom]
"19890305":
  transcript: I can never enjoy sundays, because in the back of my mind, I always know I've got to go to school the next day. It's like trying to enjoy your last meal before the execution. A penny for your thoughts. Sorry, MY thoughts are a buck a piece. A DOLLAR?! That's outrageous. Your thoughts aren't worth that! This one is. At a dollar, it's the bargain of a lifetime. I wouldn't pay a nickle for any thought you've ever had in your whole flea-ridden existence! That little remary just made the price ten dollars! TEN?? You can't extort me! Keep your stupid though! If you knew what it was, you'd BEG to pay ten bucks for it. C'mon, just tell me what it is, will you? Nothing doing, pal. OK, OK. I'll give you 25 cents. That's all I have. Let's see it. Here! 25 cent! Now what's this big, expensive thought of yours?! A fool and his money are soon par..."
  description: Calvin tells Hobbes "A penny for your thoughts".  Hobbes says his thoughts are worth a buck apiece.  Calvin says that's outrageous, no thoughts are worth a dollar.  Hobbes says his are.  Calvin wouldn't give a nickel for any thought Hobbes has had in his whole flea-ridden existence.  Hobbes raises the price to ten dollars.  Calvin refuses to be extorted.  He tells Hobbes to keep his thought.  Hobbes tells him he'd beg to pay it if he knew what it was.  Calvin asks Hobbes to tell it. Hobbes refuses.  Calvin gives Hobbes a quarter.  It's all he has.  Hobbes demands to see the quarter.  When he's paid, Calvin asks Hobbes what is his big, expensive thought.  Hobbes replies "A fool and his money are soon parted".  That starts a fight.
  characters: [calvin, hobbes]
"19890306":
  transcript: Gosh, I can't wait to get my beanie! I hop it comes soon. Do you think it will? It's probably been almost six weeks by NOW, don't you think. I ordered the red beanie. But what if it's not in stock? Should I take the blue one, or wait for them to reorder? A blue one would be OK, I guess, but I sure hope they have a red one. I've always wanted a beanie like this, with a propeller. Boy, it'll be so cool when I have it. I can't wait. Wow! A red beanie! ... or a blue one. Do you think it will come tomorrow? Do you? It had sure better. Yeah, that's how I feel, too.
  description: Calvin is chattering away at night in his bed about his beanie.  Calvin hopes it comes soon.  He thinks it's been six weeks.  He goes on to say he ordered the red beanie, but what if it's not in stock.  Should he take the blue one or wait for a reorder?  Hobbes rolls his eyes.  Calvin continues talking about always wanting a beanie.  He says it will be so cool to have it.  A red one...or a blue one.  He asks Hobbes if he thinks it will come tomorrow.  Hobbes is covering his head with a pillow trying to sleep.  He says it sure had better.
  characters: [calvin, hobbes]
"19890307":
  transcript: How was school today? Oh, it was a blast! ... Did my beanie come today?
  description: Sitting at his desk at school, Calvin dreams of flying over the town in his beanie.  He dreams of flying with the jet airliners.  Mom asks him how school was.  Calvin says it was a blast...did his beanie come today?
  characters: [calvin, mom]
"19890308":
  transcript: Please let my beanie come today! I promise I won't ever be bad again! I'll do whatever you want! Please, please, please! I'll never ask another favor if today's the day I get my beanie! Did I get my beanie? Nope. WHAT'S IT TAKE, HUH?
  description: At his desk, hands clenched in prayer, Calvin prays for the beanie to come in the mail that day.  He promises he'll never be bad again.  He promises never to ask for another favor if he gets the beanie today.  He runs in the house and asks Mom if the beanie came.  She says no.  Calvin goes outside, looks into the sky, and yells "What's it take, huh".
  characters: [calvin]
"19890309":
  transcript: I can't believe this. Every day I get all my hopes up, thinking my beanie will come... and then it doesn't. And for each day that goes by, I figure the odds are better that it will come the NEXT day, so my hopes get higher and higher before they fall. It's awful. But I've been disappointed so often now, I'm finally getting numb to it. Maybe the mailman made a second trip today and delivered it in the last five minutes. Wow! I never thought of that! C'mon! He's not numb.
  description: Calvin tells Hobbes he gets his hopes up every day, thinking his beanie will come, then it doesn't.  Every day that goes by, he figures, increases his chances the next day will be the one.  His hopes get higher and higher before they fall.  He says he's been disappointed so often, he thinks he's getting numb to it.  Hobbes says maybe the mailman made a second trip and came by and delivered it in the last five minutes.  Calvin races off saying he never thought of that.  Hobbes replies that he's not numb.
  characters: [calvin, hobbes]
"19890310":
  transcript: The longer you wait for the mail, the less there is in it.
  description: Calvin is sitting on the steps.  He keeps sitting there, and he starts to doze off.  Suddenly, he perks up and runs to the mailbox.  He opens it, and he pulls out a couple envelopes.  He looks disappointed.  He says the longer you wait for the mail, the less there is in it.
  characters: [calvin]
"19890311":
  transcript: I'm home. I didn't get my propeller beanie today, did I? As a matter of fact, you did! IT'S HERE! Ha ha! It took weeks and weeks of waiting, but at long last it's finally here! Now I finally, finally get to put it on. "Some assembly required. Batteries not included.
  description: Calvin walks through the door, looking tired.  He asks if his beanie came in the mail.  He's sure it didn't.  Mom gives him the box and tells him it did come in.  Calvin is ecstatic.  He says it took weeks of waiting, but it's finally here.  He gets to finally put it on.  He tears the package open with a wild look in his eyes.  He pulls out a paper from inside the box.  It reads "Some assembly required.  Batteries not included".
  characters: [calvin, mom]
"19890312":
  transcript: Tigers don't worry about much, do they? Nope. That's one of the perks of being feral. I'm not having enough fun right now. You're not? I'm just having a LITTLE bit of fun. I should be having LOTS of fun. It's Sunday. I've just got a few precious hours of freedom left before I have to go to school tomorrow. Between now and bedtime, I have to squeeze all the fun possible out of every minute! I don't want to waste a second of liberty! Each moment I should be able to say, "I'm having the time of my life right now!" But here I am and I'm NOT having the time of my life! Valuable minutes are disappearing forever, even as we speak! We've got to have MORE fun! C'mon! I didn't realize fun was so much work. Sure! When you're SERIOUS about having fun, it's not much fun at all!
  description: Calvin complains to Hobbes that he's only having a little fun, when he should be having a lot of fun.  Since it's Sunday, he only has a precious few hours of freedom before he has to return to school.  He has to squeeze all the possible fun out of the day.  Valuable minutes are disappearing, as Calvin is not having the time of his life.  He tells Hobbes they have to have more fun.  Off they run.  Hobbes says he didn't realize fun was so much work.  Calvin says when you're serious about having fun, it's not much fun at all.
  characters: [calvin, hobbes]
"19890313":
  transcript: "Can you believe this? I've got to assemble the beanie propeller and motor myself! What do they think I am, an engineer? Look, I've got to insert these wires and this plastic switch! I can't do this! Here, let me try. No! Get away! I'LL do it! You'd probably goof it all up, or... #snap* OH NO! See? Insult a tiger and you get bad luck! Every time!"
  description: Calvin isn't happy that he has to assemble his beanie propeller and motor himself.  Calvin asks if they think he's an engineer.  He has to insert wires into a plastic switch.  He says he can't do this.  Hobbes offers to try.  Calvin says no and grabs the switch away from Hobbes.  He says Hobbes will probably goof it all up.  SNAP!  Something breaks.  Calvin is horrified, but Hobbes says when you insult a tiger it's bad luck every time.
  characters: [calvin, hobbes]
"19890314":
  transcript: MY MOTOR BROKE! THE PIECE SNAPPED! NOW MY BEANIE PROPELLOR WON'T WORK!! AAGHHGHHH! I waited WEEKS for this and now it's BROKEN, and I didn't even get to WEAT it! STUPID ROTTEN PIECES OF LOUSY JUNK!! It's all YOUR fault! RRGHHGHHGH! MY fault?! I was just sitting here. YOU broke it! You WILLED me to break it! You did some subliminal thing! Don't deny it! I know you did! You MUST have! OK, NOW I'm willing you to go jump in the septic tank.
  description: Calvin is horrified!  His motor broke, the piece snapped.  He's worried his beanie propeller won't work.  He rants that he waited for weeks, and now it's broken.  He never got to wear the beanie.  He turns to Hobbes and says it was his fault.  He tries to hit Hobbes, who holds him away by his head.  Hobbes reminds him he was just sitting.  Calvin broke it.  Calvin angrily accuses Hobbes of willing him to break it by using some subliminal thing.  Hobbes concentrates and says he's willing Calvin to go jump in the septic tank.
  characters: [calvin, hobbes]
"19890315":
  transcript: What are you mad at ME for?! Get away from me! I don't even want to talk to you! YOU broke your beanie motor, not ME! I didn't do anything! You distracted me! I did not! I was just SITTING here! You broke it all by yourself! *sniff* *sniffle* ... all right... I know... But considering that my life's in shambles right now, could you at least take the blame?
  description: Hobbes asks Calvin why he's mad at him.  Calvin doesn't even want to talk to Hobbes.  Hobbes points out Calvin broke the beanie, not him.  Calvin insists Hobbes distracted him.  Hobbes points a finger at Calvin and says he was just sitting there, Calvin broke it by himself.  Calvin sniffles his agreement, then adds that considering his life is in shambles right now, couldn't Hobbes at least take the blame.
  characters: [calvin, hobbes]
"19890316":
  transcript: Dad, can you fix my beanie? I broke the propellor motor trying to put the pieces together. Well, let's see. This isn't too bad. You just snapped the battery case. I'll just glue it together and insert the switch for you, OK? There! Good as new! Now just let this sit awhile so the glue can set. You did it! You fixed it! I can't believe it! HEY, MOM! Dad fixed something! He DID?? Your DAD?? ALL RIGHT! THAT'S ENOUGH!
  description: Calvin sadly brings his motor and propeller to Dad, asking if he can fix it.  Dad looks at it and decides Calvin only broke the battery case.  He glues it together and inserts the switch.  He holds it up and declares it good as new.  He says they'll let it sit so the glue dries.  Calvin happily says Dad fixed it.  He can't believe it.  He calls out to Mom that Dad actually fixed something.
  characters: [calvin, mom, dad]
"19890317":
  transcript: Look, Hobbes! Dad fixed my beanie! Well? How's it look? Adjectives fail me. I'm turning it on. Ready? Here goes. I don't seem to be lifting off. This is very peculiar. THAT's the word I was looking for.
  description: Calvin runs out to show Hobbes his completed beanie.  He puts it on and asks Hobbes how it looks.  Hobbes thinks about it and says adjectives fail him.  Calvin turns the beanie on.  The propeller spins.  Calvin says he doesn't seem to be lifting off.  This is very peculiar.  Hobbes points and says that's the word he was looking for.
  characters: [calvin, hobbes]
"19890318":
  transcript: I'm not flying! This beanie doesn't make me fly! What's the point of a propeller beanie if you can't even fly when you wear it? What a rip-off! I ate all that cereal, waited weeks and weeks to get the beanie, assembled it myself, and the dumb thing doesn't even fly! At least it's not a TOTAL loss. It came in this great cardboard box. Oh, boy! NOW we'll have some fun!
  description: Calvin tells Hobbes the beanie isn't making him fly.  He asks what's the point of a propeller beanie if you can't even fly when you wear it.  Hobbes offers that the point isn't "style", certainly.  Calvin kicks the beanie and complains that he ate all that cereal, waited all those weeks, assembled it, and it doesn't fly.  What a rip off!  He says it's not a total loss, though.  It came in a great cardboard box.
  characters: [calvin, hobbes]
"19890319":
  transcript: Sighhhhh WHAP sighhhhhh....
  description: Calvin is sleepy and sighs at his school desk.  Suddenly, the desk grows into a dinosaur.  Calvin hops onto the dinosaur as it runs out of the school.  Miss Wormwood smacks Calvin's desk with a stick, and he wakes up.  Gradually, his eyes close again and he sighs.  This time, he's flying on the back of a pterodactyl.
  characters: [calvin, wormwood]
"19890320":
  transcript: C'mon, Calvin! This is the third time I've called you to get up. I don't want to get up. I don't want to go to school. Well, you HAVE to, whether you want to or not, so let's move. For your information, I don't HAVE to do anything I don't WANT to do. Is that so? She sure can make someone want to do something.
  description: Mom opens Calvin's bedroom door and tells him this is the third time she's called him.  He needs to get up.  Calvin grumbles that he doesn't want to get up or go to school.  Mom says he has to, whether he wants to or not.  Calvin sits up in the bed and tells Mom that for her information, he doesn't have to do anything he doesn't want to do.  Mom asks if that's so.  Calvin, standing outside waiting for the school bus, says Mom sure can make you want to do something.
  characters: [calvin, mom]
"19890321":
  transcript: I don't want to catch the bus. I don't want to go to school. I don't want to be here at all. I'm sick of everyone telling me what to do all the time! I hate my life! I hate everything! I wish I was DEAD! ... well, no, I don't. Not really. I wish everyone ELSE was dead.
  description: Calvin is grousing about not wanting to catch the bus or go to school.  With a frown on his face, he says he's tired of everyone telling him what to do.  He hates his life, he hates everything.  He wishes he was dead.  He thinks about it, then says not really.  He says he wishes everyone else was dead.
  characters: [calvin]
"19890322":
  transcript: Hi Calvin. HMPH. Oh, YOU'RE real pleasant this morning. What's the matter with you? Go step in front of a cement mixer, OK? What a pill you are! What a jerk! Well, who needs YOU?! You can stand there and be grumpy all by yourself! HMPH. Nothing helps a bad mood like spreading it around.
  description: Susie says hi to Calvin.  HMPH, he grumbles.  Susie asks what's the matter.  Calvin tells her to go step in front of a cement mixer.  Susie calls Calvin a jerk.  She tells him he can just stand there and be grumpy all by himself.  Now Susie is frowning.  Calvin gives a nasty smile and thinks nothing helps a bad mood like spreading it around.
  characters: [calvin, susie]
"19890323":
  transcript: What are you so mad about anyway? Couldn't you find all the bugs you needed for your insect collection? Huh? Hey, where IS your insect collection? It's due today. I FORGOT MY INSECT COLLECTION! OH NO!! Quick! Go home and get it! Maybe you can make it back before the school bus comes! Hurry! Run! No, that's not what I meant. Help me find some ants. You forgot it ENTIRELY??
  description: Susie asks Calvin what he's so mad about.  She asks if he didn't find all the bugs he needed for his insect collection.  Susie asks where his collection is, since it's due today.  Calvin, with a start, says he forgot his collection.  Susie tells him to go home and get it.  He might make it back before the bus arrives.  Calvin gets on the ground and says that's not what he meant.  He tells Susie to help him find some ants.  She asks if he forgot it entirely.
  characters: [calvin, susie]
"19890324":
  transcript: Don't just stand there, Susie! Help me catch bugs! Are you crazy?! We were supposed to be working on our insect collections all this month! You can't do the whole thing on the last morning while you wait for the bus! How could you have possibly forgotten it, anyway? It's all the class has been doing! Where have you been?? Don't you pay attention?! Don't you care about getting a good education?! If any bugs fly in your open mouth, can I have them?
  description: Calvin is running around trying to catch bugs.  He tells Susie to help him.  She explains they were supposed to be working on the projects all month.  She tells him he can't do the whole thing on the last morning while waiting for the bus.  She asks how he could possibly have forgotten it.  She tells him it's all the class has been doing.  What has he been doing?  Susie asks if he doesn't care about getting a good education.  Calvin, on hands and knees looking for bugs, asks Susie if he can have any bugs that fly into her open mouth.
  characters: [calvin, susie]
"19890325":
  transcript: Here comes the bus, Calvin. It's hopeless. There's a bug! You're wasting your time! The teacher is going to know you didn't spend any time on this insect collection. Stall the bus driver. We're supposed to have 50 insects. You'll be lucky to have ANY! GOT IT! Can you tell me what kind it is? Scrape it off. Get away from me!
  description: Susie tells him the bus is coming.  Calvin finds a bug.  Susie tells him he's wasting his time.  The teacher will know he didn't spend any time on the collection.  Calvin tells her to stall the bus driver.  Susie reminds him they were supposed to have 50 insects.  He'll be lucky to have any.  Calvin jumps into the air and stomps on a bug.  He holds his shoe up to Susie and asks what kind it is.  He tells her to scrape it off.  Susie runs off, telling him to get away from her.
  characters: [calvin, susie]
"19890326":
  transcript: Get up, Calvin! I'm not going to call you again! I bet. You're going to miss the bus! Now get out of bed! You don't know the answer? Then sit down. Hey, Twinky, want to see if there's an afterlife? No, you can't go play until you finish your homework. Just eat your food. You don't need to play with it. Stop stalling and get into the bathtub. No, you can't stay up a little longer. Go to bed. Have a good night's sleep. Tomorrow's another big! ... sighhhhhhh...
  description: Mom opens the bedroom door and tells him to get out of bed, he's going to miss the bus.  He stands at the blackboard doing a math problem.  Miss Wormwood tells him to sit down if he doesn't know the answer.  Moe holds him up by his shirt, clenches his fist, and asks Calvin if he wants to see if there's an afterlife.  As Calvin tries to go out his bedroom window, he's told he can't go out to play until his homework is done.  Calvin stirs his dinner, and Dad tells him just to eat it and not to play with it.  Mom tells him to quit stalling and to take his bath.  Dad turns off the TV and tells him he can't stay up later and to go to bed.  Mom comes in after Calvin climbs in bed.  She kisses his forehead and tells Calvin to get a good night's sleep.  Tomorrow's another big day.  After the light is turned out, Calvin sighs.
  characters: [calvin, mom, dad, wormwood, moe]
"19890327":
  transcript: Phooey. No bugs in the bus window. I can't believe you're doing this. Hey, ask that kid if he's got any bugs in HIS window. Calvin, there's no way you're going to complete an insect collection on the way to school! Forget it! Sighhh... well, maybe you're right. How much do you want for YOUR collection? I'll give you a quarter... or here, 30 centrs. I SPENT A MONTH ON THIS!
  description: On the bus, Calvin is still looking for bugs.  He checks the bus window.  Susie can't believe he's doing this.  He tells her to ask another kid if he has bugs in his window.  Susie tells him there's no way he'll complete an insect collection on the way to school.  She tells him to forget it.  He agrees.  Then, Calvin asks Susie how much she wants for her collection.  He starts at a quarter, then raises it to thirty cents.  Susie replies that she spent a month on it.
  characters: [calvin, susie]
"19890328":
  transcript: Hey, here's a worm! Worms are bugs, aren't they? Eww gross, Calvin! That's been floating in a puddle for days. Class doesn't start for 10 minutes. If I can catch 5 bugs a minute, I'll get an "A"on my collection. See, I'm off to a good start. Five bugs a minute?! You're out of your mind. Here's another already. That's a little ball of lint! Like I'm sure the teacher's going to look REAL CLOSE at every hairy bug in the 30 kids' collections!
  description: Calvin looks at a puddle.  He sees a worm.  He asks if worms are bugs.  Susie tells him that worm has been floating for days.  Calvin has ten minutes before class starts.  If he catches five bugs a minute, he'll get an "A".  He finds another insect on the ground.  Susie tells him that's a little ball of lint.  Calvin is sure the teacher won't look real close at every hairy bug in 30 kids' collections.
  characters: [calvin, susie]
"19890329":
  transcript: RINNGGGG There's the bell. We've got to go to class. Rats. I didn't get 50 bugs yet. What do you have? One drowned worm, a piece of fuzzy lint that LOOKS like a bug, a live ant, and a smashed fly. Well, if you label them scientifically in the next 30 seconds, maybe you'll get an "F+". We've got to LABEL these TOO?!? I was just going to put them all in an envelope. Actually, I don't think there's any way you'll get an "F+". For all this work, I'd better at least get a "D".
  description: The bell rings.  Calvin doesn't have his insects.  He has a drowned worm, a piece of fuzzy lint that looks like a bug, a live ant, and a smashed fly.  Susie offers that if he scientifically names them in the next 30 seconds, he might get an "F+".  Calvin asks if he has to label them, too.  He was going to put them all in an envelope.  Susie says she doesn't think there's any way he'll get an "F+".  Calvin suggests that for all that work, he should at least get a "D".
  characters: [calvin, susie]
"19890330":
  transcript: How did you mount your insects, Susie? In this box with pins. Hmm... I don't have a box or pins. I guess I'll just stick my bugs on notebook paper. Oops. Tape doesn't work too well. Gross. I hope I can get him back together. Can I borrow your paste? The way you're going, maybe you'd prefer a stapler.
  description: Calvin asks how Susie mounted her bugs.  She tells him with pins, in a box.  Calvin decides to mount his bugs on notebook paper.  Tape doesn't work too well as he tears the worm.  He asks Susie for her paste.  She makes a face and suggests at the rate he's going, maybe he'd prefer a stapler.
  characters: [calvin, susie]
"19890331":
  transcript: Psst... Susie! Help me think up scientific name of my bugs while the teacher's not looking. Shhh! We're not supposed to talk in class. Do it yourself. Having a pleasant conversation, Miss Derkins? Perhaps you'd like to sit up front, so you won't distract Calvin any more? Oh, I TRIED to get her to be quiet, but you know how girls are.
  description: Calvin whispers over to Susie to help him think of scientific names of his bugs while the teacher's not looking.  Susie tells him they're not supposed to talk in class.  She tells him to do it himself.  Miss Wormwood asks if Susie is having a pleasant conversation.  Susie is horrified!  Miss Wormwood asks her to move up front so she doesn't distract Calvin anymore.  Calvin says he tried to get her to be quiet, but you know how girls are.
  characters: [calvin, susie, wormwood]
"19890401":
  transcript: Ooooh, that rotten Calvin! I hate him! I hate him! HE'S the one who didn't do his assignment! HE'S the one who was talking in class! HE'S the one who should be sitting here at the front of the room, not ME! I wasn't doing anything wrong, but I'M the one who got in trouble! I sure hope Calvin feels terrible about this! Hey Susie, How's the view way up there? Ha! Ha! Calvin P.S. Try to steal a chalkboard eraser for me.
  description: Susie is angry at her desk.  She's mad at Calvin.  He didn't do his assignment, he was the one who was talking, he should be sitting up front instead of her.  As she covers her face with her hands, she thinks she wasn't doing anything wrong, but she got in trouble.  She hopes Calvin feels bad about it.  Calvin is writing Susie a note which asks her how the view is up there.  He writes that he wants her to try to steal a chalkboard eraser for him.
  characters: [calvin, susie]
"19890402":
  transcript: Three... two... one... LIGHT SPEED! Blasting across the galaxy in hyper light drive, it's Spaceman Spiff, interplanetary explorer extraordin... Since Calvin seems to be enjoying the lesson, let's have him demonstrate the next problem. ZOONDS! A Zok death sloop appears out of nowhere and fries Spiff's stabilizers! Our hero hurls out of control towar his imminent doom! The situation is desperate! This could be the end! What can our hero do?? His mind racing furiously, Spiff springs into action! He downshifts his spacecraft and ... stalls. RINGG! Oh, darn, out of time. Once again Spaceman Spiff beats all odds to save the day!
  description: Spaceman Spiff blasts across the galaxy.  Miss Wormwood asks Calvin to demonstrate the next problem.  A Zok death sloop appears and fries Spiff's stabilizers.  He hurls out of control toward his doom.  Calvin writes the math problem on the chalkboard.  The situation is desperate.  What can our hero do?  He downshifts his spacecraft and...stalls.  Calvin writes a bunch of numbers and lines on the board.  The class bell rings.  Oh, darn, out of time.  Spaceman Spiff once again beats all odds to save the day.
  characters: [calvin, wormwood, spiff]
"19890403":
  transcript: Psst... here! Hey Susie, Roses are red, A deep crimson hue, When you got in trouble, You sure were too! Ha! Ha! Calvin. Calvin, you dirty, rotten, lousy, stinking, nasty piece of moldy scum!!! Drop dead! I hope you... Writing notes in class now, are we, Susie? Hey, look! She's turning red again! EEP!
  description: Susie is passed a note.  It's from Calvin.  He wrote a poem.  Roses are red, a deep crimson hue, when you got in trouble, you sure were too.  Susie is enraged.  She starts writing a note to Calvin, calling him dirty, rotten, lousy, stinking, and a nasty piece of moldy scum.  As she's writing, Miss Wormwood catches her and asks if she's now writing notes in class.  Once again, Susie is horrified!
  characters: [calvin, susie, wormwood]
"19890404":
  transcript: Oh, no. How can this be happening? I've been sent to see the PRINCIPAL! This is all CALVIN'S fault! He's the one who got me in all this trouble! I'm so scared! What am I going to do?? I think they make the hall to the Principal's office this big on purpose.
  description: Susie is being sent to the principal's office.  She is very worried.  She says it's all Calvin's fault.  He got her in trouble.  She wonders what she'll do.  As she walks down the wide, empty hall toward the office, she says that they make the hall to the principal's office that wide on purpose.
  characters: [susie]
"19890405":
  transcript: Wow, Susie got sent to the Principal's office! She's in trouble NOW, all right! *wheww* I sure was lucky the teacher blamed Susie for everything. What a break! Oh, no! What if Susie rats on me!? Suppose they make her sing! Suppose she squeals! Suppose she fingers me! Oh, I'm so relieved. I was afraid you wouldn't believe me. Oh, yes, we've got quite a file on our friend Calvin.
  description: Calvin, at his desk, thinks that Susie is really in trouble.  He wipes his brow and thinks he got a break when the teacher blamed Susie for everything.  Suddenly, he worries if Susie will rat on him, if they'll make her sing, if she'll squeal, and if she'll finger him.  Susie is talking to the principal.  She tells him she was worried he wouldn't believe her.  The principal brings out a folder bulging with papers.  He says they have quite a file on their friend, Calvin.
  characters: [calvin, susie, spittle]
"19890406":
  transcript: Here comes Susie, back from the Principal's office. Boy, does she look plae. I wonder what happened. She's talking to the teacher now. Psst! Susie, what did they do to you? Did you get expelled? You didn't snitch on ME, did you? You DID snitch! You're a STOOLIE! A canary! You're going up the river, Calvin. Calvin, will you come here, please?
  description: Calvin sees Susie returning from the principal's office.  He thinks she looks pale.  He wonders what happened.  Calvin whispers over to her.  He asks what they did to her.  Did she get expelled?  He asks if she snitched on him, and Susie looks at him with an evil smile.  Calvin says she's a stoolie, a canary.  She tells him he's going up the river.
  characters: [calvin, susie, wormwood]
"19890407":
  transcript: So FIRST I got in trouble for not paying attentioni n class and for turning in a last-minute insect collection, which I got a "D-minus" on. THEN I got in trouble for getting SUSIE in trouble when I wanted her to help me fudge the project. THEN I got in trouble when I told Mom, and THEN I got in trouble AGAIn when SHE told DAD! I've been in hot water ever since I got up! Wow. I'll bet this makes you get your book report finished right on time. My what?
  description: Calvin is telling Hobbes that first, he got in trouble for not paying attention in class.  He turned in his last-minute insect collection, for which he received a "D minus minus".  Then, he got in trouble for getting Susie into trouble.  Then, he got in trouble when he told Mom and then got in trouble again when she told Dad.  He complains he's been in hot water since he got up.  Hobbes tells Calvin that he bets all that makes him get his book report finished right on time.  Calvin replies "My what".
  characters: [calvin, hobbes]
"19890408":
  transcript: One of nature's most peculiar-looking creatures, the giraffe is uniquely suited to its environment. His tremendous height enables him to much on the most succulent morsels most difficult to reach.
  description: The giraffe is uniquely suited to its environment.  His tremendous height allows him to munch the succulent morsels most difficult to reach.  Calvin is on stilts, walking over to the cookie jar on top the cabinet.
  characters: [calvin]
"19890409":
  transcript: Whenever I need to do some serious thinking, I go for a walk in the woods. There are always a million distractions out here. I don't believe in ethics any more. As far as I'm concerned, the ends justify the means. Get what you can while the getting's good - that's what I say! Might makes right! The winners write the history books! It's a dog-eat-dog world, so I'll do whatever I have to, and let others argue about whether it's "right"or not. HEYY! WHY'D YOU DO THAT?!? You were in my way. Now you're not. The ends justify the means. I didn't mean for EVERYONE, you dolt! Just ME! Ahh...
  description: Calvin tells Hobbes he doesn't believe in ethics anymore.  As far as he's concerned, the end justifies the means.  He goes on to say you should get while the getting's good, might makes right, and winners write the history books.  He figures it's a dog-eat-dog world, so he'll do what he has to and let others argue whether it's "right" or not.  Hobbes pushes Calvin into a mud puddle.  Calvin asks why he did that.  Hobbes tells him he was in his way, now he's not.  The end justifies the means.  Calvin tells him he didn't mean for everyone, just him.
  characters: [calvin, hobbes]
"19890410":
  transcript: GOTCHA!! HEY! Just what do you think you're doing back down HERE?! You didn't read me my rights.
  description: Calvin is running through the house.  Mom finally catches him and puts him to bed.  He remembers something.  Mom sees him playing with his toys downstairs.  She asks what he thinks he's doing back down there.  Calvin replies that Mom didn't read him his rights.
  characters: [calvin, mom]
"19890411":
  transcript: Dad! Dad! Outer space aliens just landed in the back yard! Oh, reall. What do they look like? Sort of like big baked potatoes with laser guns. I think we should do what they say. Did they say what they want? Yeah, they want 10 dollars. I'll bet they do. Since you're so busy, you can give the money to me, and I'll take it over to them.
  description: Calvin runs up to Dad, telling him aliens just landed in their back yard.  Dad asks what they look like.  Calvin tells him like baked potatoes with laser guns.  Dad asks if they said what they wanted.  Calvin replies they want ten dollars.  Dad says he bets they do.  Calvin offers that since Dad is so busy, he could give the money to Calvin and he'll take it over to them.
  characters: [calvin, dad]
"19890412":
  transcript: ""
  description: Calvin is walking along with a closed umbrella.  It starts to sprinkle, and Calvin opens the umbrella.  As it's pouring, he sets the umbrella down upside down so he makes a little pool.  He happily sits in the pool.
  characters: [calvin]
"19890413":
  transcript: How come YOU always read me my bedtime stories and not Mom? Because reading the bedtime story is the Dad's job. And it appears to be the ONLY "Dad's job" around here! Left the dishes for Mom again, huh? Tonight's story is called, "Why Prince Charming Stayed Single." Prince WHAT?
  description: Calvin asks Dad why he always reads his bedtime stories and not Mom.  Dad tells him that's the Dad's job.  From the other room, Mom yells that it appears to be the only Dad's job around here.  Calvin asks Dad if he left the dishes for Mom, again.  Dad yells back to the other room that tonight's story is called "Why Prince Charming Stayed Single".
  characters: [calvin, mom, dad]
"19890414":
  transcript: I've been thinking. Suppose I grow up to be one of the world's greatest men of all time. Suppose my name will be an inspiration to humanity for eons to come! What will the history books say? They'll say, "Much of his childhood was spent unwillingly in the bathtub."What an indignity this bath is! Is this situation worthy of one of the greatest men of all time?!? My likely historical significance is a terrible burden. Would you rather they said your childhood was dirty and smelly?
  description: Calvin is in the bathtub talking to Hobbes.  He asks Hobbes to suppose Calvin grows up to become one of the world's greatest men of all time.  Suppose his name will be an inspiration to humanity for eons to come.  He asks what he history books will say, then answers that he spent much of his childhood unwillingly in the bathtub.  Calvin complains that his being in the tub is an indignity.  He asks if this situation is worthy of one of the greatest men of all time.  Calvin laments his likely historical significance is a terrible burden.  Hobbes asks if he'd rather they say his childhood was dirty and smelly.
  characters: [calvin, hobbes]
"19890415":
  transcript: NNNGKGKK HOCCHHHH PTOOEY! Boy, they sure go farther when you make 'em right! Let's make up a NEW contest, OK?
  description: Calvin plugs one nostril and snorts in.  He opens his mouth to dredge up some saliva.  PTOOEY!  He spits it out.  He proudly tells Hobbes that they sure go farther when you make them up right.  Hobbes, making a face and holding his stomach, suggests they make up a new contest.
  characters: [calvin, hobbes]
"19890416":
  transcript: I'M HOME! YAHHHH SLAM! What a chump! KNOCK KNOCK Forget it, you moron! I'm not opening the door! You can just stay out there all night! Oh, I can't WAIT to here THIS one explained.
  description: Calvin runs from the school bus.  He approaches his door, but stops to think.  He sneaks around the house and enters a window.  He tiptoes over to the front door, where he starts to open it.  He yells that he's home.  Hobbes leaps by heading out the front door.  Calvin closes and locks the door behind Hobbes, calling him a chump.  There's a knock on the door.  Calvin yells out that he's not opening the door, and that he can just stay out there all night.  Mom is standing outside the house, at the door, with two grocery bags.  Hobbes is sitting on the step.  Mom says she can't wait to hear this one explained.
  characters: [calvin, hobbes, mom]
"19890417":
  transcript: HIC HIC HIC (hic) I have (hic) have (hic) I (hic) I have the (hic) the (hic) ... the hic (hic) the (hic) What is it? What do you have? A dollar?? A new comic book? What?? The (hic hic) I have (hic) the (hic) the hic (hic) the (hic) ... I love doing this.
  description: Calvin is hiccupping.  He walks over to Hobbes to tell him.  Each time he tries to say he has hiccups, he can't finish the sentence.  Hobbes starts asking him what he has.  He asks if Calvin has a dollar, a comic book, what?  Calvin continues to try to tell Hobbes, but he keeps hiccupping.  Hobbes, with an impish smile, says he loves doing this.
  characters: [calvin, hobbes]
"19890418":
  transcript: Help me (hic) get (hic) rid of (hic) these darn (hic) hic (hic) hiccups! How? (hic) Scare me. OK... Our oceans are filled with garbage, we've created a hole in the ozone that's frying the planet, nuclear waste is piling up without any safe way to get rid of it... (hic) I mean, SURPRISE me (hic). That doesn't?! Boy, you're cynical.
  description: Calvin finally tells Hobbes he has the hiccups.  Calvin tells Hobbes to scare him.  Hobbes tells him the oceans are filled with garbage, there's a hole in the ozone that's frying the planet, and nuclear waste is piling up without any safe way to get rid of it.  Calvin tells Hobbes that he means surprise him.  Hobbes asks if that doesn't.  He says "Boy, you're cynical".
  characters: [calvin, hobbes]
"19890419":
  transcript: Here. Drinking from the far side of the glass is supposed to cure hiccups. The (hic) far side of (hic) the glass? (hic) How do I (hic) do THAT? You have to bend your head way over. Oh (hic) I see. (hic) Thanks. Now I've got the hiccups AND water up my nose. I think most hiccup cures were really invented for the amusement of the patient's friends.
  description: Hobbes gives Calvin a cup of water.  He says drinking from the far side of the glass is supposed to cure hiccups.  Calvin tries to figure out how to do that.  Hobbes says he has to bend his head way over.  Calvin tries it, and water pours over him.  He thanks Hobbes because he now has hiccups and water up his nose.  Hobbes says he thinks most hiccup cures were invented for the amusement of the patient's friends.
  characters: [calvin, hobbes]
"19890420":
  transcript: These (hic) hiccups are driving me (hic) crazy. Eat a spoonful of sugar. That's supposed to help. I'll (hic) try anything. CRUNCH SMACK SMACK Well? Are you cured? (hic) Nope. I'd better (hic) eat some more.
  description: Calvin says the hiccups are killing him.  Hobbes says eating a spoonful of sugar is supposed to help.  Calvin tries it.  Hobbes asks if he's cured.  Calvin says no, he better eat some more.  He digs the spoon back into the sugar.
  characters: [calvin, hobbes]
"19890421":
  transcript: My hiccups are gone! They finally went away all by themselves! What a relief! AAUGHH! Did I scare you? Did I cure your hiccups? hic hic hic hic hic
  description: Calvin stops.  His hiccups went away by themselves.  He's relieved.  Suddenly, Hobbes pounces on Calvin.  He asks Calvin if he scared him and cured his hiccups.  Calvin hiccups several times.
  characters: [calvin, hobbes]
"19890422":
  transcript: Look, Calvin, I brought home some jelly doughnuts. Would you like one? No, jelly doughnuts gross me out. They're like eating giant squishy bugs. You bit into them and all their purple guts spill out the other end. You can eat them. My friends ask me how I stay thin.
  description: Mom asks Calvin if he'd like to have a jelly donut.  Calvin makes a face and says jelly donuts gross him out.  They're like eating giant, squishy bugs.  You bite into them and their purple guts spill out the other end.  He walks off telling Mom she can eat them.  Mom pushes the bag aside and says her friends ask her how she stays thin.
  characters: [calvin, mom]
"19890423":
  transcript: I can't sleep. I think nighttime is dark so you can imagine your fears with less distraction. At nighttime, the world always seem so big and scary, and I always seem so small. I wish I could fall asleep, so it would be morning. Sighhhh... Look at Hobbes. HE'S asleep. Z. Heh heh... he sure looks funny when he sleeps. Tigers close their eyes so tight. I wonder what he's dreaming about. Good ol' Hobbes. What a friend. Z. Things are never quite as scary when you've got a best friend. Z Z Z Z
  description: In bed, Calvin says at night the world seems big and scary.  He wishes he could fall asleep.  He looks over at Hobbes, who's sleeping.  He notices that Hobbes looks funny when he sleeps.  Hobbes closes his eyes so tight.  He wonders what Hobbes is dreaming about.  Calvin touches him and says he's a friend.  Calvin lies back down and says things are never quite as scary when you have a best friend.  He closes his eyes, and he falls asleep next to Hobbes.
  characters: [calvin, hobbes]
"19890424":
  transcript: Come ON. Calvin! We were supposed to have left a half-hour ago. WHERE are we going? For the hundredth time, we're going to a wedding. Now get in the car. Your Dad's waiting. But what if I forgot something? We're only going overnight. You'll get by.
  description: Mom scoots Calvin along.  She says they were supposed to have left a half-hour ago.  Calvin asks where they're going.  Mom tells him for the hundredth time they're going to a wedding.  She tells him to get in the car, Dad's waiting.  As Calvin climbs in, he asks what if he forgot something.  Dad says they'll only be gone overnight.  Hobbes' tail pokes out from the covers on Calvin's bed.
  characters: [calvin, hobbes, mom, dad]
"19890425":
  transcript: Turn around! We forgot Hobbes! Stop the car! We can't turn around, Calvin. We're late already. But DA-AD!! You could've been ready on time and had all your things together, but you put up a fuss about going, made us late, and you forgot your tiger. It's your own fault. You'd turn around if we'd forgotten MOM! That's because she's the only one who knows where the place is. Har har.
  description: Calvin tells Dad to turn the car around.  He forgot Hobbes.  Dad says they can't turn around, they're late already.  Dad tells him he could have been ready on time and had his things ready.  He didn't, he put up a fuss, made them late, and he forgot his tiger.  Dad tells Calvin it's his own fault.  Calvin says Dad would turn around if they'd forgotten Mom.  Dad tells him that's because she's the only person who knows where they're going.
  characters: [calvin, mom, dad]
"19890426":
  transcript: When is this dumb wedding going to be over?! I don't even KNOW these people. This would be a lot more fun if Hobbes was here. I can't believe we left him at home. I hope he's OK. What's he going to eat? We didn't leave any food out, and we'll be gone almost two whole days! Hobbes will be starving! I think I'll let Dad go into the house first.
  description: Dad, Mom, and Calvin are sitting in the church at the wedding.  Calvin is frowning, wondering when the wedding will be over.  He doesn't even know these people.  Calvin thinks it would be a lot more fun if Hobbes was there.  Calvin wonders what Hobbes will eat.  They didn't leave any food out.  Calvin realizes they'll be gone almost two whole days, Hobbes will be starving.  He thinks he'll let Dad go into the house first.
  characters: [calvin, mom, dad]
"19890427":
  transcript: Hey, Mom, how do you make a long-distance call from our motel room? Don't play with the phone, Calvin. Who on earth do you want to call? Hobbes. I want to make sure he's OK. Hobbes isn't going to answer the phone. Don't be silly. You'll see him tomorrow. But he's probably all lonely! I'm sure he's having a good time. I hope he isn't renting some movie that I wanted to see.
  description: In the hotel room, Calvin asks Mom how to make a long-distance call.  He wants to call Hobbes to make sure he's okay.  Mom tells him Hobbes won't answer and not to be silly.  She reminds him he'll see Hobbes tomorrow.  Calvin says Hobbes is probably all lonely.  Mom says she's sure Hobbes is having a good time.  Calvin hopes Hobbes isn't renting some movie Calvin wanted to see.
  characters: [calvin, mom]
"19890428":
  transcript: Mom, I can't sleep. I'm sure you can if you just lie quietly. But Hobbes isn't here. Tigers are very comforting. I always fall right asleep when I listen to Hobbes breathing. Well, you can listen to your Dad snoring. That's Dad? I thought theose were trucks down-shifting on the highway.
  description: Calvin tells Mom he can't sleep.  Mom says he can if he lies quietly.  Calvin says Hobbes isn't there.  He says tigers are comforting.  He always falls asleep when he listens to Hobbes breathing.  Mom says Calvin can listen to Dad snoring.  Calvin says he thought that noise was trucks downshifting on the highway.
  characters: [calvin, mom, dad]
"19890429":
  transcript: Well, we're finally home! HOORAYY! Now I get to see Hobbes! Boy, I didn't think we'd EVER get home. The whole trip was one long complaint about leaving Hobbes behind. Next time we should take the tiger and forget the kid. Gosh, it's drafty in here... The window's smashed! Look at the glass! SOMEBODY BROKE IN!! HOBBES! FIND HOBBES!
  description: The family arrives home, and Calvin runs into the house to see Hobbes.  Mom says she didn't think they'd ever get home.  She says the whole trip was one long compliant about leaving Hobbes at home.  Dad says next time, they should bring the tiger and forget the kid.  Dad notices it's drafty in the house.  Calvin points out the smashed window.  Mom is horrified that somebody broke in.  Calvin runs off to find Hobbes.
  characters: [calvin, mom, dad]
"19890430":
  transcript: True friends are hard to come by. I need more money. I wish people were more like animals. Animals don't try to change you or make you fit in. They just enjoy the pleasure of your company. Animals aren't conditional about friendships. Animals like you just the way you are. They listen to your problems, they comfort you when you're sad, and all they ask in return is a little kindness. WHOOONK! *SOB* It's so... so TRUE! HOOOOT! THBPBTPTH! ... and speaking of "a little kindness", I'd have a tuna fish sandwich any time soon that you happen to make one. Of course, SOME animals get on your nerves once in a while.
  description: Calvin and Hobbes are walking in the woods.  Calvin wishes people were more like animals.  He tells Hobbes animals don't try to change you, they just enjoy the pleasure of your company.  He explains animals aren't conditional about friendships.  Animals like you just the way you are.  They listen to your problems, comfort you when you're sad.  All they ask in return is a little kindness.  Hobbes sobs that it's all true and he blows his nose loudly.  Hobbes tells Calvin that speaking of a little kindness, he'd have a tuna fish sandwich any time soon that he happens to make one.  Calvin says that of course, some animals get on your nerves once in a while.
  characters: [calvin, hobbes]
"19890501":
  transcript: Oh my gosh!! Somebody broke into our house!! I'll call the police! WHERE'S HOBBES? I can't believe this is happening! Look at this room! HOBBES! Oh, I KNEW we shouldn't have left him here! Mom, I can't find Hobbes! Help me find him! What if... what if they... It's OK, Calvin. Calm down. I'm sure Hobbes is here somewhere. I don't think anyone would steal a suffed tiger. C'mon, let's go look. But Hobbes is so TRUSTING... sniff
  description: Dad goes to call the police.  Calvin runs for Hobbes.  Mom can't believe it's happening.  Calvin runs to Mom asking her to help him find Hobbes.  Mom calms him down by saying Hobbes is around there somewhere.  She doesn't think anyone would steal a stuffed tiger.  Calvin sniffs that Hobbes is so trusting.
  characters: [calvin, mom, dad]
"19890502":
  transcript: The police say they'll send someone over. Have you figured out what all is missing? No, we're looking for Hobbes. Calvin's almost hysterical. I feel a little hysterical myself. Ooh... I hope the police get here quick. I'm scared. This is one of those things you always figure will happen to someone else. ... Unfortunately, we're ALL "someone else" to someone else.
  description: Dad says the police are sending someone over.  He asks Mom if she's figured out what's missing.  Mom says she's been looking for Hobbes since Calvin's almost hysterical.  Dad says he feels hysterical himself.  Mom hopes the police arrive soon.  She's scared.  Dad says that this is one of those things you always figure will happen to someone else.  Unfortunately, he says, we're all "someone else" to someone else.
  characters: [mom, dad]
"19890503":
  transcript: Hobbes? Hobbes? Where are you?? I TOLD Mom and Dad we left Hobbes behind... I TRIED to get them to turn around and come back... and NOW look, Hobbes was all alone when our house was broken into! Mom says Hobbes wouldn't have been stolen because he's not valuable. ...(sniff) Well, I think he's valuable.
  description: Calvin looks in the closet for Hobbes.  As he races through the house, he's saying he told Mom and Dad they left Hobbes behind.  He tried to get them to turn around to get him, and now Hobbes was alone when the house was broken into.  Calvin looks under the sofa.  He says Mom told him Hobbes wouldn't have been stolen because he's not valuable.  He sits with tears falling down his face.  He sniffs and says that he thinks Hobbes is valuable.
  characters: [calvin]
"19890504":
  transcript: Hobbes? Are you down there? You've got to be SOMEwhere! HERE HE IS, CALVIN! I FOUND HOBBES! You FOUND him! Is he OK?? He's not hurt, is he? He's fine. He was under the bed covers. Hobbes, I'm so glad to see you!! You're safe and sound! (sniff) And now, I am too! It looks like we're a whole family again. Such as it is, yes.
  description: Calvin calls into the basement for Hobbes.  Mom finds Hobbes in Calvin's bed.  Calvin runs upstairs and asks if Hobbes is alright.  He hugs Hobbes and says he's so glad to see him.  Hobbes is safe and sound, and now Calvin is, too.  Mom says that it looks like they're a whole family again.
  characters: [calvin, hobbes, mom, dad, stuffedhobbes]
"19890505":
  transcript: "... and the television's gone, too. Do you happen to have the serial number? I'll bet the burglars got scared off when they saw there was a tiger in the house! Hobbes was here the whole time! Calvin, not now, OK? I'm busy. Nobody sticks around long when he sees a tiger, that's for sure! Mandibles of death, that's what Hobbes has! Roght. Why don't you go tell your Mom? Maybe Hobbes should look at some mug shots. Can we go to the station and identify suspects? Huh, can we? DEAR! I sure meet some weirdos in this job."
  description: Dad tells the police officer the TV was stolen.  Calvin comes over and tells the officer he bets the burglars ran off when they saw there was a tiger in the house.  Dad tells him he's busy, and not to bother them now.  Calvin continues by saying no one sticks around when he sees a tiger.  He says Hobbes has mandibles of death.  Dad tries to push Calvin to Mom.  Calvin keeps talking about Hobbes looking at mug shots and going to the station to look at suspects.  The officer thinks that he sure meets the weirdos in this job.
  characters: [calvin, hobbes, dad, stuffedhobbes]
"19890506":
  transcript: I've swept up most of the glass from the window. OK, I'll get something to cover up the hole. Do you think it's safe to stay here tonight? Suppose the burglars come back! The police said they'd drive by, and we'll leave lots of lights on. Ugh, its so creepy knowing these goons have been in our house. I don't feel safe at all. I known. And this must REALLY be scary for a little kid like Calvin. Gosh, I can't wait to tell everyone at school how our house got robbed. Be sure to say who scared the burglars away after they took the TV and jewelry.
  description: Mom has swept up the glass from the window, Dad goes to get something to cover the hole.  Mom asks if it's safe to stay there overnight.  What if the burglars come back?  Dad says the police said they'd drive by, and they can leave lots of lights on.  Mom feels creepy knowing burglars were in the house.  She doesn't feel safe.  Dad says it must be really scary for a little kid like Calvin.  In bed, Calvin tells Hobbes he can't wait to tell everyone at school that their house was robbed.  Hobbes tells him to be sure to say who scared the burglars away after they took the TV and jewelry.
