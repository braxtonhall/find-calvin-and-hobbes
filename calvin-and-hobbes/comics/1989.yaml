"19890904":
  transcript: Your Mom sure was cheerful this morning. Hmph. I've never seen her humming and sashaying around the kitchen like that. Hmph. How long have we been waiting for the bus now? About two and a half hours. I think Mom put me out here this early on PURPOSE.
  description: Hobbes says Mom sure was cheerful this morning.  Calvin, frowning, says nothing.  Hobbes says he's never seen her humming and sashaying around the kitchen like that.  Calvin, frowning, says nothing.  Calvin asks how long they've been waiting for the bus.  Hobbes tells him about two and a half hours.  Calvin thinks Mom put him outside early on purpose.
  characters: [calvin, hobbes]
"19890905":
  transcript: Hi, Calvin! Aren't you excited about going to school? Look at all these great school supplies I got! I love having new notebooks and stuff! All I'VE got to say is they're not making ME learn any foreign languages! If English is good enough for ME, then by golly, it's good enough for the REST of the world! Everyone should speak English or just shut up, that's what I say! You should maybe check the chemical content of your breakfast cereal. They can make me go until grade eight, and then, FFFT, I'm outta here!
  description: Susie asks Calvin if he's excited about going to school.  Susie shows the new notebooks and school supplies she has.  Calvin rants that they won't make him learn a foreign language.  He says if English is good enough for him, it's good enough for the rest of the world.  Calvin folds his arms across his chest and says everyone should speak English or just shut up.  Susie suggests he check the chemical content of his breakfast cereal.  Calvin says they can make him go through grade eight, then he's outta here.
