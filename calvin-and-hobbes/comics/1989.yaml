"19890712":
  transcript: Whenever I cook an egg, I like to see how high I can crack above the skillet. Then I aim with just one eye open, so I don't have any depth perception. It's pretty hard that way. See, the secret to having fun in life is to make little challenges for yourself. CRIKK Like the challenge of explaining the stove and the floor to your Mom? Rats. Let's see if there's another carton in the fridge, will ya?
  description: Calvin tells Hobbes that when he cooks eggs, he likes to see how high he can crack it above the skillet.  He aims with one eye, so he has no depth perception.  That makes it harder.  Calvin says the secret to having fun in life is making little challenges for yourself.  Hobbes wonders if he means the challenge of explaining the stove and floor to Mom.  Calvin asks Hobbes to see if there's another carton in the fridge.
