"19890818":
  transcript: I've decided not to go to school this fall. I don't need an education. I don't need to learn things. I don't need to develop skills. It's too much trouble. How are you going to make it in the world if you don't know anything and you don't have any skills?! I'll go on talk shows and hype myself.
  description: Calvin has decided not to go to school in the fall.  He figures he doesn't need an education or learn to develop skills.  He says it's too much trouble.  Hobbes asks how he'll make it in the world without knowledge or skills.  Calvin replies that he'll go on talk shows and hype himself.
