"19890909":
  transcript: Is it? It IS! It's SATURDAY! Oh boy! No school! No homework! Just cartoons and fun the whole day long! HOORAY! Turn on the TV! Get out the cereal! IT'S SAAATURDAY! You're getting up? It's barely light out! I'm going to the office and get some sleep.
