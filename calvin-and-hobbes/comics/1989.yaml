"19890901":
  transcript: Hey, Dad, I'm inventing a robot. Can you get me a patent? You invented a robot? Well, here it is so far. Hobbes and I have been working on it all afternoon. It's not quite perfected yet, but you get the idea. Hmm... what does it do? That's the problem. We haven't figured out how to make it do what we want. Don't get discouraged. Your Mom and I got the same results after working on YOU for six YEARS. Har har. My attorney is a comedian.
  description: Calvin tells Dad he's inventing a robot and asks if Dad can get him a patent.  Calvin shows their robot.  It's Tinkertoys with a coffee can head.  He says he's been working on it all afternoon.  He says it's not perfected yet.  Dad asks what it does.  Calvin admits they haven't figured out a way to make it do what he wants.  Dad says not to be discouraged.  He and Mom got the same results after working on Calvin for six years.
