"19890829":
  transcript: How are we going to invent a robot? We don't know anything about machines. Maybe YOU don't. It's easy. There are just four simple machines to alter force. The lever, the pulley, the inclined plane, and, um, the internal combustion engine. Take my workd for it, I'm an expert at inventions. So where do we start? We ask Mom for a research grant.
  description: "Hobbes wonders how they'll invent a robot if they don't know anything about machines.  Calvin says it's easy.  There are four simple machines to alter force:  the lever, the pulley, the inclined plane, and the internal combustion engine.  He tells Hobbes he's an expert.  Hobbes asks where they should start.  Calvin says by asking Mom for a research grant."
