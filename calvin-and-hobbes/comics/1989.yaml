"19890819":
  transcript: Ughh, there are times when I hate owning a house. All the maintenance! The walls need painting, the roof needs to be fixed, the tree out back needs to be sprayed... It seems like the whole place is falling apart. ... and what isn't falling apart is being actively destroyed!
