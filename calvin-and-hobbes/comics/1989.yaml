"19890507":
  transcript: Mild-mannered Calvin is stuck inside doing math problems on a beautiful Sunday. No one is watching! He dashes into his closet! THIS is a job for .... STUPENDOUS MAN! Defender of freedom! Advocate of liberty! A bright crimson streak blasts up through the atmosphere and then turns back toward Earth! Gaining stupendous momentum, STUPENDOUS MAN strikes the ground at an acute angle with stupendous force! The Earth slowly stops rotating... and begins to turn in the opposite direction! Pushing with all his might, STUPENDOUS MAN turns the planet all the way around backwards! The sun sets in the east and rises in the west! Soon it's 10A.M. the previous day! What are you doing outside? Did you finish your homework already? It's Saturday! I don't need to do it until tomorrow... thanks to STUPENDOUS MAN!
  description: Mild-mannered Calvin is stuck doing homework on a beautiful Sunday.  No one is watching.  He dashes into the closet.  This is a job for Stupendous Man, defender of freedom, advocate of liberty!  A crimson streak blasts through the atmosphere, then heads back toward earth.  Stupendous Man strikes the earth at an acute angle, using stupendous force.  The earth slowly stops rotating and begins turning in the other direction.  Stupendous Man turns the planet all the way around backward.  The sun sets in the east and comes up in the west.  It's soon 10:00 AM the previous day.  Mom asks what Calvin is doing outside.  She asks if he finished his schoolwork.  Calvin marches along in his Stupendous Man costume, saying it's Saturday.  He doesn't need to do it until tomorrow, thanks to Stupendous Man.
  characters: [calvin, mom, stupendous]
"19890508":
  transcript: Is Calvin asleep? Yes, he's snuggled up with Hobbes. Boy, I don't know how I'M ever going to sleep. Me neither. I can't get over what's happened. The idea of some crazy stranger going through our house... BRRRR!! I wish I had a big stuffed animal to feel safe with. I guess you'll have to do. So what do I get to snuggle? How come I'M the grown-up??
  description: Dad asks Mom if Calvin's asleep.  She says he's snuggled up with Hobbes.  Dad doesn't know how he's going to sleep.  Mom agrees.  She can't get over what happened.  The idea of a stranger going through their house makes her shiver.  She wishes she had a big stuffed animal to feel safe with.  She hugs Dad.  He complains that how come he's the grown-up.  What does he get to snuggle?
  characters: [mom, dad]
"19890509":
  transcript: This is going to be a long night. My heart jumps at the slightest sound. It's almost 2, and I'm wide awake. When someone breaks into your home, it shatters your last illusion of security. If you're not safe in your own home, you're not safe anywhere. A man's home is his castle, but it shouldn't have to be a fortress.
  description: Dad is sitting up in bed.  He thinks it's going to be a long night.  His heart jumps at the slightest sound.  It's almost 2:00, and he's wide awake.  When someone breaks into your home, it shatters your last illusion of security.  If you're not safe in your home, you're not safe anywhere.  He lays back down and thinks a man's home is his castle, but it shouldn't have to be a fortress.
  characters: [mom, dad]
"19890510":
  transcript: Are you still awake too? Mm-hmm. I was thinking. It's funny... when I was a kid, I thought grown-ups never worried about anything. I trusted my parents to take care of everything, and it never occurred to me that they might not know how. I figured that once you grew up, you automatically knew what to do in any given scenario. I don't think I'd have been in such a hurry to reach adulthood if I'd known the whole thing was going to be ad-libbed.
  description: Mom asks Dad if he's still awake.  Dad is.  When he was little, he never thought about grown-ups worrying about anything.  He trusted his parents to take care of everything, and it never occurred to him they might not know how.  He thought when you were an adult, you automatically knew what to do in a given scenario.  He says he wouldn't have been in such a hurry to reach adulthood if he knew the whole thing was going to be ad-libbed.
  characters: [mom, dad]
"19890511":
  transcript: Well, at least we weren't in our home when our house was broken into. No one was hurt. We're all together and OK. We lost a few of our nice things, but things don't matter much really. It's hard to believe how often we forget that.
  description: Mom thinks that at least they weren't at home when the house was broken into.  No one was hurt, and they're all together and OK.  They lost a few nice things, but things don't matter much really.  As she cuddles up with Dad, she thinks it's hard to believe how often they forget that.
  characters: [mom, dad]
"19890512":
  transcript: Can I be excused now? You didn't finish your dinner. Well, I didn't like it very much, and there's this TV show I want to watch, so... Our TV was stolen, remember? Gosh, I guess I'll eat my asparagus, do my homework, and go straight to bed, then. And we're so proud of how you handle adversity.
  description: At the dinner table, Calvin asks to be excused.  Mom says he didn't finish his dinner.  Calvin says he didn't like it very much, and there's a TV show he wants to watch.  Mom reminds him the TV was stolen.  Calvin is disappointed.  He says he'll eat his asparagus, do his homework, then go straight to bed.  Mom says they're proud of how he handles adversity.
