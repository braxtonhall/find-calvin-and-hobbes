"19890820":
  transcript: A 30-ton brontosaurus ... is about to face a premature extinction! The allosaurus, fearsome predator of the jurassic, stalks his prey! The herd of brontosaurs is unaware of his presence! Spotting a straggler, the allosaurus lunges! The brontosaurus rears to its full gigantic height! What induces an allosaurus to attack a monster more than twice his own size?! I'm HUNGRY! The hamburgers are cooking, Now get off me!
  description: The allosaurus stalks his prey.  A herd of brontosaurs is unaware of his presence.  The allosaurus lunges at a straggler.  The brontosaurus rises to its full height.  What induces an allosaurus to attack a monster more than twice his own size?  Calvin jumps on Dad's back and yells that he's hungry.  Dad is standing at the grill.  He says he's cooking the hamburgers and tells Calvin to get off him.
