"19890919":
  transcript: I'm not going to fight you, Moe! If you won't give me my truck back, FINE! Go ahead and keep it! You're the one who has to live with yourself! I can't make you do what's right! You can HAVE the stupid truck! OK, thanks! Heh heh. Hey, Kid, if you're not gonna swing, get off and let someone ELSE on, huh?
  description: Calvin won't fight Moe.  He tells Moe that if he won't give the truck back, he can have it.  He tells Moe he'll have to live with himself.  Calvin can't make him do what's right.  Calvin sits on the swing.  Another kid comes up behind Calvin and tells him that if he's not going to swing, get off and let someone else on.
  characters: [calvin, moe]
"19890920":
  transcript: "... so Moe stole my truck, and when I tried to get it back, Moe wanted to fight me for it. I didn't want to fight, so I walked away and Moe kept my truck. I don't understand it, Hobbes. What makes some people so greedy and mean? Why is it that some people don't care what's wrong and right? Why don't people try to be nice to each other? The problem with people is that they're only human. Well, you're lucky you don't have to BE one."
  description: Calvin explains what happened to Hobbes.  He says Moe stole his truck, and when he went to get it back, Moe wanted to fight.  Calvin didn't want to fight, so he walked away.  He asks Hobbes what makes some people so greedy and mean.  He asks why some people don't care what's wrong or what's right.  Hobbes offers that the problem with people is that they're only human.  Calvin says Hobbes is lucky that he doesn't have to be one.
  characters: [calvin, hobbes]
"19890921":
  transcript: You know, sometimes the world seems like a pretty mean place. That's why animals are so soft and huggy. ...yeah..
  description: Sitting under a tree, Calvin says sometimes the world seems like a pretty mean place.  Hobbes tells him that's why animals are so soft and huggy.  Calvin hugs him and says "yeah".
  characters: [calvin, hobbes]
"19890922":
  transcript: MOM! MOMM! What is it? What's the matter? Hobbes had a bad dream. You woke me up at 2 A.M. because your suffed tiger had a bad dream?!? He dreamed he was so hungry, he ate us allup. I must be having a bad dream. Don't you think you should make Hobbes a sandwich, just in case?
  description: Mom wakes up to Calvin yelling for her.  When she checks on him, he tells her that Hobbes had a bad dream.  Mom is angry that Calvin woke her up at 2:00 AM because he thinks his stuffed tiger had a bad dream.  Calvin explains that Hobbes dreamed he was hungry and ate them all up.  Mom walks back to her room, saying she must be having a bad dream.  Calvin asks if she shouldn't make Hobbes a sandwich, just in case.
  characters: [calvin, hobbes, mom, stuffedhobbes]
"19890923":
  transcript: Know what, Dad? At the fresh fish counter in the supermarket, you can buy real squid. They have them in a bucket. They're really gross. Mm, I'll bet. CALVIN, WHAT ARE YOU DOING?
  description: Calvin tells Dad that at the fresh fish counter at the supermarket, you can buy real squid.  He says they're pretty gross.  Dad says he bets.  Calvin walks away.  Dad turns around in his chair and wonders what Calvin is doing.
  characters: [calvin, dad]
"19890924":
  transcript: 'Tigers are great! They''re the toast of the town. Life''s always better when a tiger''s around! Considering I outrank you, I don''t think I should have to do that! This meeting of the top-secret club G.R.O.S.S (Get rid of slimy girls) will come to order. Supreme dictator for life, Calvin, presiding. All salute! Ok, the first order of business. President, no first tiger Hobbes will read the minutes of our last meeting. Thank you. 10:30 am: read minutes of previous meeting, 10:31: debated so called "editorial slant" of minuts. Much nonsense and commotion from dictator for life. Nonsense?! 10:32: President and frist Tiger offers reasonable solution, but Dictator for life takes needless exception. reasonalbe solution?!? You told me to go jump in a lake! 10:33: Blows exchanged. Dictator-for-life receives comeuppance. HA! I beat you fair and square! These minutes are nothing but lies! Call me a liar, will you? By golly, I''ll call you worse than that! Chowderhead! Moron! Ogre! Fleabag! (Pant, pant) Truce? (Gasp, pant) OK, truce. Well, another productive meeting! What a great club!'
  description: A meeting of G.R.O.S.S. comes to order.  Hobbes reads the minutes of their last meeting.  Hobbes mentions much nonsense and commotion from dictator-for-life Calvin.  Hobbes keeps reading that president-and-first-tiger Hobbes offered a reasonable solution, which elicits a response from Calvin that Hobbes had told him to jump in the lake.  Hobbes reads that the dictator received his comeuppance.  Calvin says the minutes are lies.  They fight, calling each other chowderhead, moron, ogre, and fleabag.  They call a truce as they are exhausted.  They climb down declaring another productive meeting.  What a great club!
  characters: [calvin, hobbes]
"19890925":
  transcript: Have you seen my shoes? I thought I had them out right here. Your shoes? I don't know. They WERE right here. Where could they have gone? We're going to be late. Well I can't goe anywhere without my SHOES. Help me look. They're not leaving US behind with a baby sitter tonight!
  description: Mom is looking for her shoes.  Dad's putting his tie on, but he hasn't seen them.  Mom says they were right there.  She's in her dress. Dad says they'll be late.  Mom says she can't go anywhere without her shoes and asks Dad to help her look.  Calvin is hiding the shoes in the closet.  He says they're not leaving he and Hobbes with a baby sitter tonight.
  characters: [calvin, hobbes, mom, dad]
"19890926":
  transcript: DING DONG It's ROSALYN! Answer the door, will you please, Calvin? Hi Roz. My parents have changed their minds about going out, so we won't be needing your services. Goodbye. Hi, Rosalyn. What are you talking about, Calvin? You can't go out if Mom can't find her shoes, right? And what do YOU know about THAT? Uh, nothing! Ha ha! Um, why? Are her shoes missing? I'd like to be paid in advance tonight.
  description: The doorbell rings.  It's Rosalyn!  Calvin goes to the door.  He tells Rosalyn that his parents have changed their minds about going out and won't be needing her services.  Dad comes out and asks Calvin what he's talking about.  Calvin says they can't go out if Mom can't find her shoes.  Dad wonders what Calvin knows about that.  Calvin looks guilty, says he doesn't know anything and asks if Mom's shoes are missing.  Rosalyn asks to be paid in advance.
  characters: [calvin, hobbes, dad, rosalyn]
"19890927":
  transcript: Phooey. Mom and Dad left. Now we're here alone with the baby sitter from the black lagoon. Hee hee! Do you think she remembers how last time we threatened to flush her science notes down the toilet? Ha ha ha! Our finest moment. OK, you, get in bed. WHAT?! It's not even 6:30! She remembers, all right. She can't get away with this. We'll call the rescue squad.
  description: Calvin is upset Mom and Dad left them with the baby sitter.  Hobbes asks if Calvin thinks she remembers how they threatened to flush Rosalyn's notes down the toilet.  Calvin laughs, calling it their finest moment.  Rosalyn opens the door and tells Calvin to get ready for bed.  Calvin protests that it's not even 6:30 yet.  In bed, Hobbes says she remembers.  Calvin says he's going to call the rescue squad.
  characters: [calvin, hobbes, rosalyn, stuffedhobbes]
"19890928":
  transcript: Rosalyn? What are you doing out of bed? I thought I heard something outside. I didn't hear anything. It was kind of a thump. Will you go look, and make sure it's not anything scary? I'll check, but I didn't hear any thump. Yes... yes! Go out the door! Two more steps! Oh please, oh please! Yes, yes, yes! See? There's nothing out here.
  description: Calvin comes down the stairs.  Rosalyn asks why he's out of bed.  Calvin tells her he heard a thump outside.  He wants her to check to make sure it's nothing scary.  Rosalyn didn't hear a thump, but she offers to check.  Calvin waits behind her, thinking her to go another two steps.  Rosalyn looks out the door.
  characters: [calvin, rosalyn]
"19890929":
  transcript: See, Calvin? There's nothing out here. But I KNOW I heard something! Go look, OK? Please? OK, if it will make you feel... HEY! SLAM THIS WAS A TRICK?! WHY YOU SNEAKY LITTLE DROP, I'LL GET YOU!! Hobbes! I locked her out! Now we can watch TV and eat cookies till we're SICK! Oh boy! This is the best we've EVER been baby sat!
  description: Rosalyn shows Calvin there is nothing outside.  Calvin closes the door behind her.  He locks the door.  He and Hobbes can watch TV and eat cookies until they're sick.  Hobbes says this is the best they've ever been baby sat.
  characters: [calvin, hobbes, rosalyn]
"19890930":
  transcript: CALVIN, WILL YOU LET ME BACK IN THE HOUSE THIS INSTANT! Don't worry, Rosalyn! There's only a 50% chance of rain tonight! Ha ha! She's trying to open the downstairs windows. It's OK. I already locked them up. YOU OPEN UP THAT DOOR! Hey Roz! What's in your purse? Mind if we look??
  description: Rosalyn yells in for Calvin to let her inside.  From the top window, Calvin taunts her by saying there's only a 50% chance of rain.  Hobbes notices her trying to open the downstairs windows.  Calvin already has locked them.  Rosalyn looks in the window and tells Calvin to open the door.  Calvin asks what's in Rosalyn's purse and says he's going to look.
  characters: [calvin, hobbes, rosalyn]
"19891001":
  transcript: Giszh! Giszh! Oh, no! It's the middle of recess and there's a tyrannosaurus on the playground. The kids at the top of the slide are the first to go! How ironic that they ahd pushed and fought each other to be there! Pandemonium ensues! Teachers line the kids up to go inside, but that proves to be sad mistake. Walking quietly in single file, the kids are gobbled up like children McNuggets! Soon the playground is empty! It's all his! The tyrannosaur lets out a triumphant roar! Say, where's Calvin? Recess is over. Didn't he see us line up to come in? I see him, Miss Wormwodd! He's out by the swings and he's yelling or something!
  description: It's recess and there's a tyrannosaurus on the playground.  The kids at the top of the slide go first.  They had pushed and fought each other to be there.  Teachers line the kids up to go inside.  That's a sad mistake.  The kids are gobbled up like Children McNuggets.  The playground is empty.  The tyrannosaur lets out a triumphant roar.  Miss Wormwood sees Calvin's empty desk and wonders where he is.  One of the kids in the class sees him by the swings yelling or something.
  characters: [calvin, wormwood]
"19891002":
  transcript: CALVIN, I'M, TELLING YOUR PARENTS ABOUT THIS! NOW LET ME IN! Pipe down, will ya Roz? Hobbes and I can hardly hear the TV! You're not supposed to BE watching television! Hey, if you go rent us a VCR and a mobie, we'll put the TV near a window so you can watch too! LET ME IN! Are you 18? You could get us "Venusian Vampire Vixens"!
  description: Rosalyn yells in that she's going to tell Calvin's parents about this.  Calvin yells down for Rosalyn to pipe down.  He and Hobbes can hardly hear the TV.  Rosalyn says that he isn't supposed to be watching TV.  Calvin offers that if she'll go get a VCR and a movie, they'll put the TV near a window so she can watch.  Rosalyn shakes the door knob.  Calvin asks if she's 18.  He wants her to get "Venusian Vampire Vixens".
  characters: [calvin, rosalyn]
"19891003":
  transcript: CALVIN! Hang on, Roz. The phone is ringing! I hope it's your parents! I hope they ask to talk to me! Boy, you'll be in trouble THEN! It's your boyfriend, Charlie! Should I tell him that you're indisposed? Ha ha! No! LET ME TALK TO HIM! Say chas, don't you think you're settling for too little in the girlfriend department?
  description: The phone rings inside the house.  Rosalyn hopes it's Calvin's parents.  She yells in that she hopes they ask to speak with her.  Calvin says it's her boyfriend, Charlie.  He offers to say she's indisposed.  She wants to talk with Charlie.  Calvin asks Chas if he isn't settling for too little in the girlfriend department.
  characters: [calvin, rosalyn]
"19891004":
  transcript: Isn't it great to get out of the house alone together for a change? It's so nice and quiet. We should do this more often. CALVIN, YOU'VE GOT FIVE SECONDS TO OPEN THE DOOR BEFORE I BREAK A WINDOW! I'm telling you Chuck, your girlfriend is a psycho! I hope you're not making any long-range plans around her.
  description: At the restaurant, Mom and Dad are holding hands with wine glasses on the table.  Mom says it's nice for them to get out of the house alone together for a change.  Dad says it's so nice and quiet, they should do it more often.  At home, Rosalyn yells in that she's going to break a window to get in.  Calvin, on the phone, tells Chuck that his girlfriend is a psycho.  He hopes Charlie isn't making any long-range plans around her.
  characters: [calvin, mom, dad, rosalyn]
"19891005":
  transcript: Wow, this is fun! All the TV shows we're not allowed to watch, and a bag of cookies each! SLAM! Hey, what was that? AAUGH!! ROSALYN! H-how did YOU g-get in?? *gulp* whoops, I think it's past my bedtime.
  description: Calvin and Hobbes are sitting on the floor watching TV.  Calvin says this is fun.  All the TV shows they aren't allowed to watch and a bag of cookies each.  They hear a slam.  Calvin wonders what it is.  It's Rosalyn!  Calvin is horrified and wonders how she got in.  Mom and Dad come up behind Rosalyn.  Calvin gulps and decides it's past his bedtime.
  characters: [calvin, hobbes, mom, dad, rosalyn]
"19891006":
  transcript: It was all a misunderstanding! An innocent mistake! Let me explain! Calvin, listen closely. Locking Rosalyn out of the house wasn't just MEAN, it was DANGEROUS. If you'd hurt yourself or if there was a fire, she wouldn't have been able to help you. You go apologize to Rosalyn right now. I-I'm sorry, Rosalyn. And we're sorry too. I PROMISE you Calvin will behave himself next time. An extra five would help there BE a next time.
  description: Mom drags Calvin while he protests that is was a misunderstanding, an innocent mistake.  Mom explains that locking Rosalyn out of the house wasn't just mean, it was dangerous.  She explains that if he had gotten hurt or there was a fire, Rosalyn wouldn't have been able to help him.  She tells Calvin to go apologize.  Calvin does.  Dad adds that he and Mom are sorry too and assures her Calvin will behave himself next time.  Rosalyn says an extra five would help there be a next time.
  characters: [calvin, mom, dad, rosalyn]
"19891007":
  transcript: Boy, did I get in trouble. Stealing Mom's shoes and making Mom and Dad late... then locking the baby sitter out of the house... whoof. That's a lot to live down for just one evening. I feel pretty bad. And having eaten a whole package of Oreos doesn't help. You said it.
  description: In bed, Calvin tells Hobbes he got in trouble.  Stealing Mom's shoes, making Mom and Dad late, locking Rosalyn out of the house.  Calvin says that's a lot to live down for just one evening.  He feels pretty bad.  Hobbes adds that having eaten a whole package of Oreos doesn't help.
  characters: [calvin, hobbes]
"19891008":
  transcript: That big dumb bully Moe punched me at school yesterday. Really? What did you do? Well, first I skidded across the playground. Then I caromed off a rock and...I wish I had more friends, but people are such jerks. If you can just get most people to ignore you and leave you alone, you're doing good. If you can find even one person you really like, you're lucky. And if that person can also stand you, you're really lucky. What if you find someone you can talk to while you eat apples on a bright fall morning? Well, yeah...I suppose there's no point in getting greedy, is there?
  description: Calvin tells Hobbes he wishes he had more friends, but people are such jerks.  Calvin says if you can get most people to ignore you and leave you alone, you're doing good.  If you can find one person you really like, you're lucky.  He adds that if that person can stand you, you're really lucky.  Hobbes asks what  if you find someone you can talk to while you eat apples on a bright fall morning.  They stop to eat their lunch.  They sit up against a tree and eat their apples.  Calvin supposes there's no point in being greedy.
  characters: [calvin, hobbes]
"19891009":
  transcript: Man, this is boring! How am I ever going to read three whole pages of this by tomorrow? It's impossible! ... Impossible?? Why, NOTHING'S impossible! Not for ... STUPENDOUS MAN! Bum ba ba daa dum bum ba ba daa dum
  description: Calvin is reading his homework.  He says it's boring.  He asks how he's ever going to read three whole pages by tomorrow.  It's impossible.  He hits his book and says nothing's impossible...for Stupendous Man.  He runs out of the room.
  characters: [calvin]
"19891010":
  transcript: YES! It's ... STUPENDOUS MAN! Friend of freedom! Opponent of oppression! Lover of liberty! Great moons of Jupiter! Calvin (STUPENDOUS MAN's 6-year-old alter ego) has three pages of boring homework to read! It's TYRANNY! Although STUPENDOUS MAN could easily read the assignment with stupendous high-speed vision, the masked man of might has a bolder plan! With stupendous powers of reasoning, the caped combatant conclused thatere's no need for homework, if there's no school tomorrow!
  description: It's Stupendous Man, lover of liberty.  He notices Calvin (his 6-yr-old alter ego) has three pages of boring homework to read.  It's tyranny!  Stupendous Man could easily read the assignment with his high-speed vision, he has a bolder plan.  The caped combatant concludes there's no need for homework if there is no school tomorrow.
  characters: [calvin, stupendous]
"19891011":
  transcript: A blinding bolt of blazing crimson careens across the sky! It's STUPENDOUS MAN! Seconds later, the amazing marvel alights upon an observatory telescope at Mount Palomar! With stupendous strength, STUPENDOUS MAN carefully unscrews the giant lens... ... and blasts into space with it!
  description: Stupendous Man flies to the observatory telescope at Mount Palomar.  With his stupendous strength, he carefully unscrews the giant lens and blasts into space with it.
  characters: [calvin, stupendous]
"19891012":
  transcript: STUPENDOUS MAN circles the earth with a 200-inch telescope lens! Aligned perfectly with the sun, the magnifying lens focuses the terrible solar energy... ... and fries a certain elementary school clean off the map! Now mild mannered Calvin has no need to do his homework ever again! Liberty prevails! How's your homework coming along, Calvin?
  description: Stupendous Man circles the earth with a 200 inch telescope lens.  Aligning perfectly to the sun, the magnifying lens focuses the terrible solar energy....and fries a certain elementary school clean off the map.  Stupendous Man flies into the bedroom window saying Calvin has no need of ever doing homework again.  Liberty prevails!
  characters: [calvin, stupendous]
"19891013":
  transcript: Uh oh, it's my arch-nemesis, MOM-LADY! She can't discover my secret identity! Calvin? Are you doing your homework in there? Quickly, STUPENDOUS MAN leaps into the closet to change back into his 6-year-old alter ego, mild-mannered Calvin! Calvin? Are you in here? Unfortunately, STUPENDOUS MAN's cape is caught in mild-mannered Calvin's zipper! Curses! This is going to be a good one, I can tell. Geez, Mom! Can't a guy have a little privacy?!
  description: Mom calls into the bedroom asking if Calvin is doing his homework.  Stupendous Man recognizes his arch-nemesis, Mom-lady.  He doesn't want her to discover his secret identity.  He goes into the closet to change back into his alter ego, Calvin.  Mom enters the bedroom looking for Calvin.  Calvin, in the closet, notices that Stupendous Man's cape has gotten caught in Calvin's zipper.  Mom opens the closet to see Calvin standing in his underwear.  She says she can tell this is going to be a good one.
  characters: [calvin, mom, stupendous]
"19891014":
  transcript: And why, may I ask, are you standing in your underwear in the closet? Oh, no reason. Um.. I was hot. You're SUPPOSED to be doing your homework! I don't need to do it now, thanks to STUPENDOUS MAN! Oh yeah? It was great! He fried the school with a big magnifying lens in space! I'm sure it will be in all the papers tomorrow. Boy, she'll be in trouble when she gives me my costume back. BIG trouble.
  description: Mom asks why he's standing in his closet in his underwear.  Calvin says because it was hot.  Mom reminds him he's supposed to be doing his homework.  Calvin tells her he doesn't have to do it, thanks to Stupendous Man.  He explains how Stupendous Man fried the school with a big magnifying glass in space.  He's sure it will be in all the papers tomorrow.  Calvin, sitting at his desk reading his homework, grumbles that she'll be in trouble when she gives him his costume back.
  characters: [calvin, mom]
"19891015":
  transcript: I'm ho-ome! Hi, Calvin. Whatcha doin'? Oof, get this big lummox off me. Look at you! You didn't even change you of your school clothes! How could I?! I didn't even get in the door! Every day this maniac is so glad to see me that he blasts out like a big orange torpedo! A dog will just wag its tail, but of course a tiger has to pounce on you! Stupid animal! He pounces on you? Oh, and don't think he doesn't enjoy the cunning and treachery of it all! Tigers live for the thrill of a sneak attack! It's their evil nature! He's just sitting there. Oh, sure, big disguise! Like no one can fathom the savage mind of a jungle cat! Ha! He's a killer to the core! I wish my parents would move. My diary is getting weirder every day. Yeah, you know who I'm talking about! Wipe off that grin or I'll do it for you!
  description: Calvin comes home and is pounced on by Hobbes.  They're fighting as Susie asks what he's doing.  She says he didn't even change out of his school clothes.  Calvin explains that this maniac is so glad to see him that he blasts out like a big orange torpedo.  A dog will wag its tail, but a tiger has to pounce on you.  Susie asks if Hobbes pounces on him.  Calvin says Hobbes enjoys the treachery and cunning of it all.  He says it's their evil nature.  Susie points out that Hobbes is just sitting there.  Calvin says it's a big disguise.  No one can fathom the savage mind of a jungle cat.  He's a killer to the core.  Susie walks off wishing her parents would move.  Her diary gets weirder every day.  Calvin looks at Hobbes and cocks his fist.  He says to wipe off that grin or he'll do it for him.
  characters: [calvin, hobbes, susie, stuffedhobbes]
"19891016":
  transcript: Uh oh, Calvin the reptile is in trouble! As an ectotherm, his body relies on the environment to warm or cool its temperature. Now that it's colder outside, Calvin's body temperature falls and he becomes sluggish! He'll go into torpor if he can't find a warm place to lie! Leave the thermostat alone, and put on a sweater if you're cold. I ... I don't have the en.. energy!
  description: Calvin the reptile is in trouble.  As an ectotherm, his body relies on the environment to warm or cool its temperature.  Since it's colder outside, Calvin's body temperature falls and he becomes sluggish.  He'll go into torpor if he can't find a warm place to lie.  Mom tells Calvin to leave the thermostat alone and put a sweater on if he's cold.  Calvin, slumped on a chair, says he doesn't have the energy.
  characters: [calvin, mom]
"19891017":
  transcript: I heard that big cats don't purr. That's true. We're too fierce and ferocious, we don't ever purr. Well, what do you call the noice you make when you get your tummy rubbed? Growling friendly-like.
  description: Hobbes is lying on the floor with Calvin leaning against him.  Calvin heard that big cats don't purr.  Hobbes says that's true.  They're too fierce and ferocious.  Calvin asks what he calls the noise he makes when his tummy gets rubbed.  Hobbes replies it's growling friendly-like.
  characters: [calvin, hobbes]
"19891018":
  transcript: Calvin, your Mom and I looked over your report card, and we think you could be doing better. But I don't like school. Why not? You like to read and you like to learn. I know you do. I mean, you've read every dinosaur book ever written, and you've learned a lot, right? Reading and learning are fun. Yeah... So why don't you like school? We don't read about dinosaurs.
  description: Dad tells Calvin that he and Mom looked over his report card and think he could do better.  Calvin says he doesn't like school.  Dad explains that Calvin likes to read and likes to learn.  He knows Calvin has read every dinosaur book ever written, and he learned a lot.  He says reading and learning are fun.  Dad asks why he doesn't like school.  Calvin tells him they don't read about dinosaurs.
  characters: [calvin, dad]
"19891019":
  transcript: I've got an idea, Dad. Maybe I'd get better grades if you offered me $1 for ever "D", $5 for every "C", $10 for every "B", and $50 for every "A"! I'm not going to BRIBE you, Calvin. You should apply yourself for your own good. Rats. I thought I could make an easy four bucks.
  description: Calvin has an idea for Dad.  He suggests Dad pay him $1 for every "D", $5 for every "C", $10 for every "B", and $50 for every "A".  Dad says he's not going to bribe Calvin.  He should apply himself for his own good.  Calvin says rats, he thought he could make a quick four bucks.
  characters: [calvin, dad]
"19891020":
  transcript: Hello? Valley hardware? Yes, I'm calling to see if you sell blasting caps, detonators, timers and wire. Just the wire? OK, forget it. Do you rent bulldozers or backhoes? No, no, a rototiller won't do at all. I need something more like a wrecking ball. Do you know where I could get anything like that? No? OK, goodbye. Looks like another boring day, Hobbes.
  description: Calvin calls Valley Hardware looking for blasting caps, detonators, timers, and wire.  They only have wire.  He asks if they rent bulldozers or backhoes.  He tells them a rototiller won't do.  He asks about wrecking balls.  They can't help Calvin.  He walks outside and tells Hobbes it looks like another boring day.
  characters: [calvin, hobbes]
"19891021":
  transcript: I can't sleep, Hobbes. I've been thinking. What about? Well, suppose there's no afterlife. That would mean THIS life is all you get. And THAT would mean I'm sitting here in a bed as precious moments of my all-too-short life disappear forever. Honey, wake up. Did you hear the television on?
  description: Calvin can't sleep, he's been thinking.  Hobbes asks about what.  Calvin wonders what happens if there is no afterlife.  That would mean this life is all you get.  That would mean he's sitting in bed as precious moments of his all-too-short life disappear forever.  Mom wakes Dad asking if he hears the television on.
  characters: [calvin, hobbes, mom, dad]
"19891022":
  transcript: Gosh, it's 1:30 and I'm still awake. Someone must've waylaid Mr. Sandman. I just can't get comfortable. Mmf. I'm exhausted, but I can't fall asleep. Maybe if I just lie still and think about how good it feels to be in bed, and how soft the pillow is, and how very, very tired I am...Phooey, this isn't working. All I want is to get some sleep. This is awful. Calvin? Gee Mom, are you awake too? It's time to get up. It can't be! It's the middle of the night and I haven't slept a wink yet! Calvin? C'mon, up and at em. This is going to be a bad day.
  description: Calvin can't get to sleep.  He tries lying still thinking about how good it feels in bed, how soft the pillow is, how tired he is.  That isn't working.  He hears someone calling his name.  Calvin asks if Mom is awake too.  It's time to get up.  Calvin says it can't be.  It's the middle of the night and he hasn't slept a wink yet.  Mom gently shakes Calvin awake.  He had been dreaming.  Calvin blinks his eyes.  As he eats his cereal, he says this is going to be a bad day.
  characters: [calvin, mom]
"19891023":
  transcript: The strangest thing happened to me a few minutes ago. Oh? What? I was minding my own business, when suddenly I was zapped into some sort of space void vortex! There I watched helplessly as an evil duplicate of myself from a parallel univere too my place on earth, and... what have you done NOW? No, no, see, it wasn't ME...
  description: Calvin tells Mom the strangest thing happened to him a few minutes ago.  He was suddenly zapped into some sort of space void vortex.  He watched helplessly as an evil duplicate of himself from a parallel universe took his place and...  Mom asks what he did now.  Calvin quickly says it wasn't him.
  characters: [calvin, mom]
"19891024":
  transcript: Heh heh heh! AHA! I see you! Sneaking up to pounce on me, eh? Phooey. You see why MOST tigers don't chuckle to themselves.
  description: Calvin is reading in the chair.  He hears something say "heh, heh, heh".  He looks behind the chair.  He tells Hobbes he sees him sneaking up to pounce on him.  Hobbes says "phooey".  Calvin tells him he sees why most tigers don't chuckle to themselves.
  characters: [calvin, hobbes]
"19891025":
  transcript: Want to play a great game I invented? OK. It's called "Gross Out". You say the grossest think you can imagine, and then I try to think of something even grosser. Whoever comes up with the grossest thing gets a point, and we play until someone gets 50 points, OK? I think I already know who's going to win. It's weidt, nobody ever played a whole game with me.
  description: Calvin asks Hobbes if he wants to play a game he invented.  It's called "gross out".  Hobbes should say the grossest thing he can think of, then Calvin tries to come up with something grosser.  Whoever has the grossest thing gets a point.  They play until someone gets 50 points.  Hobbes says he thinks he already know who will win.  Calvin says nobody has ever played a whole game with him.
  characters: [calvin, hobbes]
"19891026":
  transcript: Pay attention to me.
  description: Dad is sitting on his chair, reading.  Calvin blows up a paper bag and pops it.  Dad jumps.  Calvin tells him to pay attention to him.
  characters: [calvin, dad]
"19891027":
  transcript: I've got to write a report for school. What's your topic? Bats. Can you imagine anything more stupid? Heck, I don't know anything about bats! How am I supposed to write a report on a subject I know nothing about?! It's impossible. I suppose research is out of the question. Oh, like I'm going to learn about bats and THEN write a report?! Give me a break!
  description: Calvin tells Hobbes he has to write a report for school.  It's on bats.  Calvin can't think of anything more stupid.  He says he doesn't know anything about bats.  How's he supposed to write a report on something he knows nothing about?  Hobbes says he supposes research is out of the question.  Calvin says he's going to learn about bats, then write a report?  Give him a break!
  characters: [calvin, hobbes]
"19891028":
  transcript: Hello, Susie? This is Calvin. You know this report we're supposed to write for school? Yeah, my topic is bats. What's yours? Elephants? Hmm. Well, are you going to the library to look up elephants? You are? Great! While you're there, could you research bats too, and make copies of all the information you find, and maybe underline the important parts for me, and sort of outline it, so I wouldn't have to read it all? How'd it go? I really loathe girls.
  description: Calvin calls Susie.  He asks her what her topic for the report is.  It's elephants.  Calvin asks if she's going to the library to do research on elephants.  Susie is.  Calvin asks while she's there if she wouldn't mind researching bats, too, and make copies of all the information she finds, underline the important parts, and outline it so he doesn't have to read it.  Calvin comes back to his bedroom.  Hobbes asks how it went.  Calvin, with a frown, says he really loathes girls.
  characters: [calvin, hobbes]
"19891029":
  transcript: Wow, honey, you're missing a beautiful sunset out here. I'll count to 10, and then... POW! Dad, how come old photographs are always black and white? Didn't they have color film back then? Sure they did. In fact, those old photographs ARE in color. It's just that the WORLD was black and white then. Really? Yep. The world didn't turn color until sometime in the 1930s, and it was pretty grainy color for a while, too. That's really weird. Well, truth is stranger than fiction. But then why are old PAINTINGS in color?! If the world was black and white, wouldn't artists have painted it that way? Not necessarily. A lot of great artists were insane. But... but how could they have painted in color anyway? Wouldn't their paints have been shades of gray back then? Of course, but they turned colors like everything else did in the '30s. So why didn't old black and white photos turn color too? Because they were color pictures of black and white, remember? The world is a complicated place, Hobbes. Whenever it seems that way, I take a nap in a tree and wait for dinner.
  description: Calvin asks Dad why old photographs are black and white.  He asks if they didn't have color film back then. Dad tells him they did, but the world was black and white then.  He says the world didn't turn color until the 1930's.  Calvin says that's weird.  Dad says truth is stranger than fiction.  Calvin then asks why old paintings are in color.  If the world was black and white, wouldn't artists have painted it that way?  Dad says a lot of great artists were insane.  Calvin asks how they could have painted in color.  Their paints would have been shades of gray.  Dad says the paints turned colors like everything else did in the '30s.  Calvin then asks why old black and white photos didn't turn color.  Dad says because they were color pictures of black and white.  Later, Calvin tells Hobbes the world is a complicated place.  Hobbes says whenever it seems that way, he takes a nap in a tree and waits for dinner.
  characters: [calvin, hobbes, mom, dad]
"19891030":
  transcript: "What am I going to do about this report on bats? You've got to help me, Hobbes! OK, ... um, first let's make a list of what we know. Yeah! That's a good way to start! Great! Number one: what are bats? They're bugs, aren't they? Yeah, put that down. #1 BATS = BUGS Are you sure? They fly, right? They're ugly and hairy, right? C'mon, this is taking all day!"
  description: Calvin asks Hobbes to help him with his bat report.  Hobbes suggests starting with what they know.  Hobbes asks what bats are.  Calvin asks if they're bugs.  He has Hobbes write that down.  Hobbes asks if he's sure they're bugs.  Calvin says they fly, they're ugly and hairy.  He tries hurrying Hobbes, saying this is taking all day.
  characters: [calvin, hobbes]
"19891031":
  transcript: I think we've got enough information now, don't you? All we have is one "fact" you made up. That's plenty. By the time we add an introduction, a few illustrations and a conclusion, it will look like a graduate thesis. Besides, I've got a secret weapon that will GUARANTEE me a good grade! No teacher can resist THIS! What is it? A clear plastic binder! Pretty professional looking, eh? I don't want co-author credit on this, OK?
  description: Calvin thinks they have enough information.  Hobbes tells him they only have the one fact Calvin made up.  Calvin says that's plenty.  By the time they add an introduction, a few illustrations, and a conclusion, it will look like a graduate thesis.  Besides, he has a secret weapon that guarantees a good grade.  No teacher can resist it.  It's a clear plastic binder.  Pretty professional looking, eh?  Hobbes says he doesn't want coauthor credit on the report.
  characters: [calvin, hobbes]
"19891101":
  transcript: 'Hi Susie! Did you write your report? Yeah, I spent all last evening on it. Did you? Well, when you know as much as I do, it doesn''t take as long. Mine took about 15 minutes. 15 minutes? Let''s see. I guess you won''t be setting the grade curve THIS time, Susie! Read it and weep. "Bats: the big bug scourge of the skies." Note the professional clear plastic binder. Bats aren''t BUGS!'
  description: 'Calvin asks Susie if she wrote her report.  She did, it took all the evening.  Calvin says it only took him 15 minutes.  It doesn''t take long when you know as much as he does.  Susie asks to see the report.  Calvin tells her she won''t be setting the grade curve this time.  She reads the title "Bats: The Big Bug Scourge of the Skies".  Calvin points out the professional, clear plastic binder.  Susie yells that bats aren''t bugs.'
  characters: [calvin, susie]
"19891102":
  transcript: All right, class, who would like to give his report first? I WOULD! I WOULD! Why Calvin, what a surprise to see YOU volunteer! You must have done a good job. Go to the front of the class. Oh boy! Now let's all pay attention. Go ahead, Calvin. Thank you. Before I begin, I'd like everyone to notice that my report is in a professional, clear plastic binder. That's very nice. Go ahead. When a report looks this good, you know it'll get an "A". That's a tip, kids. Write it down.
  description: Miss Wormwood asks the class if there are any volunteers to give his report first.  Calvin volunteers.  Miss Wormwood is surprised.  She says Calvin must have done a good job.  She tells Calvin to start.  Calvin begins by pointing out to everyone that his report is in a professional, clear plastic binder.  Calvin continues by saying when a report looks this good, you know it'll get an "A".  He says that's a tip, kids, and he tells them to write that down.
  characters: [calvin, wormwood]
"19891103":
  transcript: My report is on bats. ...ahem... "Dusk! With a creepy tingling sensation, you can hear the fluttering of leathery wings! BATS! With glowing red eyes and glistening fangs, these unspeakable giant bugs drop onto..." BATS AREN'T BUGS!! Look, who's giving the report? YOU chowderheads... or ME?! Calvin, I'd like to see you a moment.
  description: Calvin starts with a dramatic reading of "With a creepy, tingling sensation, you hear the fluttering of leathery wings.  Bats!  These unspeakable giant bugs drop onto...".  The class all replies "Bats aren't bugs".  Calvin asks them who's giving the report.  Those chowderheads or him?  Miss Wormwood would like to see Calvin a moment.
  characters: [calvin, wormwood]
"19891104":
  transcript: Man alive! Can you believe what my teacher wrote on my report? She says I obviously did no research whatsoever on bats, and that my scientific illustration looks like I traced the Batman logo and added fangs! She's pretty perceptive. She didn't even give me credit for my professional clear plastic binder! What did your parents have to say? Nothing. And if you'll give me a hand here, it will stay that way.
  description: Calvin complains to Hobbes about what the teacher wrote on his report.  She says he obviously did no research whatsoever and that his scientific illustration looks like he traced the Batman logo and added fangs.  Hobbes says she's pretty perceptive.  Calvin says she didn't even give him credit for the professional, clear plastic binder.  Hobbes asks what his parents have to say.  Calvin replies nothing.  He says with Hobbes' help, it will stay that way.  He has a shovel in his hand, and he's digging a hole for the report.
  characters: [calvin, hobbes]
"19891105":
  transcript: I've been thinking, Hobbes. On a weekend? Well, it wasn't on purpose... I believe history is a force. Its unalterable tide sweeps all people and institutions along its unrelenting path. Everything and everyone serves history's single purpose. And what is that purpose? Why, to produce ME, of course! I'm the end result of history. YOU? Think of it! Thousands of generations lived and died to produce my exact, specific parents, whose reason for being, obviously, was to produce ME. All history up to this point has been spent preparing the world for my presence. Hmm, 4.5 billion years probably wasn't long enough. Now I'm here, and history is vindicated. So now that history's brought you, what are you going to do? Ooh, you wascawwy wabbit!
  description: Calvin believes history is a force.  Its tide sweeps all people and institutions along its path.  Everything and everyone serve history's single purpose.  Hobbes asks what that purpose is.  Calvin says to produce him, of course.  He's the end result of history.  Calvin says thousands of generations lived and died to produce his exact, specific parents, whose reason for being was to produce him.  Calvin goes on to say all history has been spent preparing the world for his presence.  Hobbes thinks four and a half billion years probably wasn't long enough.  Calvin says he's here, and history is vindicated.  Hobbes asks what he's going to do, now that history's brought him.  They sit at home watching cartoons on the television.
  characters: [calvin, hobbes]
"19891106":
  transcript: Hi Susie. What did you bring for lunch today? A swiss cheese and ketchup sandwich. It's my very favorite, too. So I don't want to hear what gross thing YOU brought. Relax, Susie. I bought cafeteria lunch today. Good. It appears to be cigar butts in a gallstone sauce. That's beany-wienies! Really? Oh gross.
  description: Calvin asks Susie what she brought for lunch.  Susie tells him a Swiss cheese and ketchup sandwich.  She says it's her favorite, so she doesn't want to hear what gross thing he brought.  Calvin says he bought the school lunch today.  He says it appears to be cigar butts in a gallstone sauce.  Susie yells that those are beany-wienies.  Calvin sticks out his tongue and says "Oh gross".
  characters: [calvin, susie]
"19891107":
  transcript: Hello? Hi Dad. It's me, Calvin. You're supposed to be at school! I AM at school. Are you all right? What's the matter? Why are you calling? I told the teacher I had to go to the bathroom. Quick, what's 11+7?
  description: Dad answers the phone, and it's Calvin.  Calvin tells him he's at school.  Dad asks if everything is alright.  He asks why he called.  Calvin says he told the teacher he had to go to the bathroom.  Instead, Calvin went to the pay phone.  He asks Dad what 11 + 7 is.
  characters: [calvin, dad]
"19891108":
  transcript: I was reading about how countless species are being pushed toward extinction by man's destruction of forests. Sometimes I think the surest sign that intelligent life exists elsewhere in the universe is that none of it has tried to contact us.
  description: Calvin and Hobbes are walking in the woods.  Calvin says he was reading how countless species are being pushed toward extinction by man's destruction of forests.  Calvin continues by saying the surest sign that intelligent life exists elsewhere in the universe is that none of it has tried to contact us.
  characters: [calvin, hobbes]
"19891109":
  transcript: What are you DOING?! You're going to be late for school! Hurry up and put your clothes on right. It's sad how some people can't handle a little variety.
  description: Calvin pulls his shirt out, then steps into it.  He comes downstairs standing in his shirt, with his pants and shoes on his head.  Mom tells him he will be late for school.  He makes him put his clothes on right.  Walking away, Calvin laments that it's sad how some people can't handle a little variety.
  characters: [calvin, mom]
"19891110":
  transcript: I wonder why man was put on earth. What's our purpose? Why are we here? Tiger food.
  description: In bed, Calvin wonders why man was put on earth.  He asks what's their purpose.  Why are they here?  Hobbes tells him "tiger food".  Hobbes then smiles at Calvin.  Lying back down in bed, Calvin peeks over at Hobbes.
  characters: [calvin, hobbes]
"19891111":
  transcript: Z Z SNAP A little high-strung, are we? We tigers all it lightning quick reflexes
  description: Hobbes is lying asleep on the floor.  Calvin walks by blowing a gum bubble.  It pops, and Hobbes jumps into the air.  Calvin, lying on the floor all torn up, asks Hobbes if he's a little high-strung.  Hobbes tells him tigers call it lightning quick reflexes.
  characters: [calvin, hobbes]
"19891112":
  transcript: Is sure wish it would snow. What's with the sled? There's no snow. I aim to fix that right now with an appeal to the snow demons. Snow demons? Obviously they're tormenting us with this wimpy weather because they're angry. We must appease them. Oh. I'm going to lie here on my sled and think snow thoughts until the snow demons have mercy and unleash a blizzard. Snow, snow! High and low! Wherever we go! Let it blow! To and fro! Hi-De-Ho! Snow! Snow! Snow! Well, I'll come out in early January and see how you're doing. Tell Mom I'll need my meals out here and I won't be going to school tomorrow.
  description: Calvin is dragging the sled, but there's no snow on the ground.  Hobbes asks what he's doing.  Calvin says he plans an appeal to the snow demons.  He says they're tormenting them with wimpy weather because they're angry.  Calvin is going to lie on his sled and think snow thoughts until the snow demons have mercy and unleash a blizzard.  Calvin says a rhyme about it snowing.  Hobbes looks at the sky.  He walks away and says he'll come out in January to see how he's doing.  Calvin tells him to let Mom know he'll need his meals out there and that he won't be going to school tomorrow.
  characters: [calvin, hobbes]
"19891113":
  transcript: Sighhhh... HEY! WHOA! WHOA! WAHHH BAM CALVIN, QUIT BANGING AROUND!
  description: Calvin is reading his homework.  Suddenly, he flies up into the ceiling.  BAM!  Mom yells in from the other room for him to quit banging around.
  characters: [calvin, mom]
"19891114":
  transcript: Ow! What am I doing on the ceiling? Hmm... nothing else fell up. Just me. This is very strange. Even if I try to jump to the floor, I land back on the ceiling! My personal gravity must have reversed polarity! You'd thing this is the type of thing we'd  learn about in science class, but no, we learn about cirrus clouds.
  description: Calvin is sitting on the ceiling.  Nothing else fell up,  just him.  If he tries to jump to the floor, he lands back on the ceiling.  His personal gravity must have reversed polarity.  As he walks along the ceiling, he says you'd think this would be the type of thing they'd learn about in science class.  But instead, they learn about cirrus clouds.
  characters: [calvin]
"19891115":
  transcript: Having my personal gravity polarity reversed is a nuisance. How am I going to get up to the floor? There's not anything on the ceiling that I could even climb up. How am I supposed to do my homework when I'm trapped on the ceiling? It's impossible.
  description: Calvin can't figure out how to get to the floor with his personal gravity polarity reversed.  There's nothing on the ceiling he can climb to get there.  He wonders how he'll do his homework if he's trapped on the ceiling.  Calvin smiles.
  characters: [calvin]
"19891116":
  transcript: Mom and Dad won't be too happy about THIS. No sir. Dad will have to bolt my bed to the ceiling tonight, and Mom will have to stand on a stepladder to hand me dinner. Then I'll have to hold my plate upside-down above my head and scrape the food off the underside! And if I spill anything, it will fly 10 feet up to the floor and splot! This is going to be the most fun I've ever had!
  description: Calvin knows Mom and Dad won't be happy about things.  Dad will have to bolt his bed to the ceiling, and Mom will have to stand on a step ladder to serve dinner.  He'll have to hold the plate upside down and scrape the food off the underside.  If he spills anything, it will fall ten feet to the floor.  He says this will be the most fun he's ever had.
  characters: [calvin]
"19891117":
  transcript: 'All this wide open ceiling space! I wish I could get my roller skates. Heyh, maybe I can climb up this bookcase and when I get to the bottom shelf, leap to a chair. Then I can pull myself across other pieces of furniture and work my way to the chest. I can hear Mom now: How on earth did you get sneaker prints on the underside of each shelf?!"'
  description: With all the open ceiling space, Calvin wishes he could get his roller skates.  He decides to try climbing down the bookcase and jumping to a chair.  Then he can pull himself across other pieces of furniture to get to his toy chest.  As he walks down the bookcase, he says he can hear Mom wondering how he got sneaker prints on the underside of each shelf.
  characters: [calvin]
"19891118":
  transcript: There! I think I can jump to that chair and hang on to the back. GEERONIMOOO! WHOAAA! WHAM! Great. Just great. Calvin, QUIT BANGING AROUND!
  description: Calvin is ready to jump to the chair.  He leaps.  The chair pushes over and lands on its back.  WHAM!  Mom yells in from the other room for him to quit banging around.
  characters: [calvin, mom]
"19891119":
  transcript: Trip! Poof! Aaaaaaa. Calvin? Are you getting up?
  description: Calvin gets dressed and walks out the door.  He trips on a rock and falls through the sky.  He wakes up.  He gets out of bed, gets dressed, goes out the door, and falls through the sky.  He wakes up.  He hears Mom call to him, asking if he's getting up.
  characters: [calvin]
"19891120":
  transcript: RRG! MMF! Getting any HOMEWORK done, or are you just ruining furniture? Maybe I'm hanging here for dear LIFE! Ever think of THAT?
  description: Calvin tries to pull the chair upright.  Mom comes over and asks if he's getting any homework done, or if he's just ruining furniture.  Calvin replies that maybe he's hanging on the chair for dear life.
  characters: [calvin, mom]
"19891121":
  transcript: I'm TELLING you, my personal gravity reversed its polarity! I fall UP now! I've been trapped on the ceiling! I couldn't do my homework up THERE! My desk is on the FLOOR! You should be glad I wasn't OUTSIDE when it happened, or I'd be sailing through the ionosphere! Right. Now I don't want to hear any more nonsense until you're through with your homework, understand? DON'T LET GO! DON'T LET GO!
  description: As Mom picks Calvin up, he tells her his personal gravity reversed its polarity.  As Mom carries him up the stairs, he tells her he's been stuck on the ceiling.  He couldn't do his homework there.  He tells Mom she should be glad it didn't happen outside or he would be sailing through the ionosphere.  As Mom puts him in his chair, she tells him she doesn't want to hear any more of his nonsense until he's through with his homework.  Calvin tells her not to let him go.
  characters: [calvin, mom]
"19891122":
  transcript: It's... it's a miracle! My personal gravity is back to normal! Glad to hear it. Now do your math. You bet, Mom. Boy, what a relief to be pulled down instead of up! I'll check your progress in a little bit. Uh oh.
  description: Calvin declares a miracle.  His personal gravity is back to normal.  Mom's glad to hear it.  Calvin says it's a relief to be pulled down instead of up.  Mom says she'll check on his progress in a little bit.  Calvin sits grumpily looking at his homework.  He starts to get larger.  He says "uh oh".
  characters: [calvin, mom]
"19891123":
  transcript: This has been a most peculiar afternoon.
  description: Calvin keeps growing.  He tries to get out his bedroom door.  He squeezes out into the hallway.  As he crawls along, he says this has been a most peculiar afternoon.
  characters: [calvin]
"19891124":
  transcript: I've got to get outside before I grow bigger! I suppose I should get my pituitary gland checked.
  description: Calvin has to get outside before he grows bigger.  He barely gets his foot out the door.  Once outside, he walks off saying he should get his pituitary gland checked.
  characters: [calvin]
"19891125":
  transcript: I know! I'll run downtown and find Dad at work! Maybe he can help! Hm... now which building does Dad work in? They all look the same. ... well, maybe Dad can find ME.
  description: Calvin runs toward downtown to find Dad at work.  He figures he can help.  As Calvin walks among the skyscrapers, he can't tell which one Dad works in.  He decides maybe Dad can find him.
  characters: [calvin]
"19891126":
  transcript: Out in the farthest reaches of the galaxy zooms interplanetary explorer, Spaceman Spiff! Ooh, nice scenery! The muck monsters of Mordo are closing in on our hero! A fiery flash of fatality-flare misses by mere micromips! To fly through the rings of planet ZK-5 below! Our hero throttles the thrusters and dives! It works! The muck monsters veer off, afraid to follow the fearless Spiff into the frozen fragments of ice and rock! Swerving left, right, up, and down, the amazing Spaceman Spiff pilots around each hurling missle! What skill! What fortitu.... Oh no! Our hero is going down!! Got 'im! Heh heh! Those darn little guys are hard to hit, aren't they? I hate playing "dodge ball" in gym class.
  description: The muck monsters of Mordo are closing in on Spaceman Spiff.  They fire at them, but just miss.  He tries to fly through the rings of the planet below.  The monsters veer off, afraid to follow Spiff.  Swerving left, right, up, and down, Spiff pilots around each hurling missile.  POW!  Our hero's going down.  Moe has hit Calvin with a ball.  Calvin, lying against a wall, says he hates playing "dodge ball" in gym class.
  characters: [calvin, moe, spiff]
"19891127":
  transcript: ""
  description: The ever-growing Calvin walks off the shore into the ocean.  His head enters the clouds.  He grows up through the clouds.  Calvin looks up toward the heavens.
  characters: [calvin]
"19891128":
  transcript: ""
  description: Calvin continues to grow.  He gets so big he can barely stand on the earth.  He gets bigger and eventually falls off the earth.
  characters: [calvin]
"19891129":
  transcript: ""
  description: Calvin falls into the Milky Way galaxy.  He tumbles around.  He sees a door.
  characters: [calvin]
"19891130":
  transcript: Well? How's you're math coming along? I've almost started!
  description: Calvin opens the door, and he's normal size in his room.  He sits back down at the desk.  Mom comes in and asks how his math is coming along.  Calvin says he's almost started.
  characters: [calvin, mom]
"19891201":
  transcript: Oh brother! Another "discussion" about my study habits and the importance of homework. I've tried explaining that it's hard to study when one's size suddently starts increasing, but does SHE care?! Hah! No, it's just blah blah blah, like it's all MY fault! Mom's never been as big as a galaxy, so she can't understand how anyone ELSE could be! Sheesh. Oops, it looks like she's wrapping up. Better start nodding. Good. I'm glad we had this little talk.
  description: Mom is talking to Calvin, but he's thinking about getting another "discussion" about his study habits and the importance of homework.  Calvin continues thinking about how he tried to tell her it's hard to study when one's size suddenly starts increasing.  Mom is still talking and gesturing, but Calvin continues thinking about how she says it's all his fault.  Mom hasn't been as big as a galaxy, so she doesn't understand how anyone else can be.  Calvin thinks Mom is wrapping up, so he starts nodding.  Mom tells him she's glad they had this little talk.
  characters: [calvin, mom]
"19891202":
  transcript: Doing homework? Yeahhhh.... Boy, you missed the show. I just got a big lecture from Mom just because I got stuck on the ceiling and then grew so big I fell off the planet when I was supposed to be doing my math! Gee, THAT'S not very fair. You said it. Here, how about helping me hurry up with these problems? Sure! Tigers are great at math! Now what do these little horizontal lines mean? That's a minus sign. Let me know when you're done, OK? I'll be reading comic books.
  description: Calvin tells Hobbes he missed the show.  He tells him he got a big lecture because he got stuck on the ceiling and then grew so big he fell off the planet when he should have been doing math.  Hobbes doesn't think that isn't fair.  Calvin asks for help on his homework.  Hobbes says tigers are good at math.  He asks what the little horizontal lines mean.  Calvin tells him it's a minus sign.  He tells Hobbes to let him know when he's done.  Calvin is going to be reading comic books.
  characters: [calvin, hobbes]
"19891203":
  transcript: That's a big envelope. Are you mailing a book? Yes. Well, at this price all I can say is that Santa had better read it darn carefully. Last year I didn't get half of what I wanted. Have you behaved any better this year? It depends how you... hey, just what are you insinuating?! Why, I'll have you know I've been a veritable angel this year, just like always! In that case, we can have a cookout with your stocking contents. Did you put anything on your list for me? What, and pay more postage? This package is breaking my arms already! Go write your own list! Tidings of comfort and joy to you too. Look, it's every man for himself in this world. Now give me a boost, will ya.
  description: Calvin is mailing his Christmas list to Santa.  It's costing $2.40 to send.  Calvin says Santa had better read it carefully.  Last year, he didn't get half of what he wanted.  Hobbes asks Calvin if he behaved better this year.  Calvin says he's been a veritable angel this year, like always.  Hobbes says in that case, they can have a cookout with his stocking contents. Hobbes asks if Calvin put anything on his list for him.  Calvin tells him to make his own list.  Hobbes sticks his tongue out and tells Calvin "tidings of comfort and joy to you too".  Calvin tells him it's every man for himself in this world.  But since Calvin can't reach the mail box flap to open it, he tells Hobbes to give him a boost.
  characters: [calvin, hobbes, dad]
  source: seligman
"19891204":
  transcript: When are we going to get a Christmas tree? Oh, I dunno. Probably a little after New Year's. AFTER NEW YEAR?? Sure. We can just go up the street and pick the best tree from the neighbors' driveways. WHAT?! Sometimes there's still tinsel on the tree too, so you don't even have to decorate it! We'll save time AND money! OK, what did your Dad tell you THIS time?
  description: Calvin asks Dad when they're going to get a Christmas tree.  Dad tells Calvin a little after New Year's.  Calvin is shocked.  Dad explains that they can go up the street and pick the best tree from the neighbors' driveways.  Dad continues by saying there's sometimes some tinsel left on the trees, so you don't even have to decorate it.  You save time and money.  Calvin, horrified, clings to Mom's ankle.  Mom asks what Dad told him this time.
  characters: [calvin, mom, dad]
"19891205":
  transcript: Yes, Calvin? You have a question? Yeah, I was wondering if we could stop the lesson here and adjourn to the playground for the rest of the day. Of course not. Now then, let's all turn to page 24 and... Miss Wormwood? YES? How about just ME, then?
  description: In class, Calvin has a question.  He asks Miss Wormwood if they could stop the lesson and adjourn to the playground for the rest of the day.  Miss Wormwood says of course not.  Calvin then asks if just he can.
  characters: [calvin, wormwood]
"19891206":
  transcript: For "Show and Tell" today, I have something that will astound and amaze you! This little guy can... Have you all had your shots?
  description: For "show and tell", Calvin has something he says will astound and amaze the class.  He looks into the bag, then looks from side-to-side.  He then asks the class if everyone has had their shots.
  characters: [calvin]
"19891207":
  transcript: Are there any monsters under my bed tonight? Of course not. Come under and see for yourself. Yeah, come and see. Heh heh heh. Oh right! You think I'm falling for THAT?! Who am I TALKING to if there aren't monsters down there?! Umm.. Uh.. They're all teeth and digestive tract. No brains at all. Why, we're dust balls! Yeah, LITTLE dust balls!
  description: Calvin asks if there are any monsters under his bed tonight.  A couple voices say of course not, come see for himself.  Calvin says he's not going to fall for that.  He asks who he's talking to if there are no monsters.  After some hesitation, the voices say they're dust balls.  Calvin says they're all teeth and digestive tract, no brains at all.
  characters: [calvin]
"19891208":
  transcript: EWW! What's THIS disgusting stuff?! It's spider pie. You can pick out the legs and give them to your Dad if they're too hairy for you. S-s-spider p-pie? Why, I believe we're going to have a quiet dinner for once. I know I don't feel like opening my mouth. Hey, I LIKE it!
  description: Calvin asks what his disgusting dinner is.  Mom sets the plate down and tells him it's spider pie.  She says he can pick out the big legs and give them to Dad if they're too hairy for Calvin.  Calvin looks at the plate.  Calvin decides he likes it.  Mom says they'll have a quiet dinner for once.  Dad says he sure doesn't feel like opening his mouth.
  characters: [calvin, mom, dad]
"19891209":
  transcript: Want to go play outside? No, it's too much trouble. FIRST I'd have to get up. THEN I'd have to put on a coat. THEN I'd have to find my hat and put IT on. (sigh) Then we'd run around and I'd get tired, and when we came in I'd have to take all that stuff off. No way. So what are you going to do instead? I'm just going to sit here and wait for a good TV show to come on. I'll tell your Mom to turn you toward the light and water you periodically. Instead of making smart remarks, you could get me the remote control.
  description: Hobbes asks Calvin if he wants to play outside.  Calvin goes into great detail why he doesn't.  He'd have to get up, get a coat, put on his hat, they'd run around and get tired.  Then, he'd have to come in and take it all off again.  Hobbes asks what he'll do.  Calvin says he's going to sit in the chair until a good TV show comes on.  Hobbes walks off saying he'll tell Mom and Dad to point him toward the light and water him periodically.  Calvin tells him that instead of making smart remarks, he could get Calvin the remote control.
  characters: [calvin, hobbes]
"19891210":
  transcript: Know what this is? It's a polar bear blinking in a blizzard! Ha ha ha ha! Know what this is? In snowed! Oh my gosh, look at it all! A creeping mountain of ice has crushed half the neighborhood! It's a glacier! Right in my own town! Everything north of here has been wiped off the face of the earth! This is great! Wow! Wooly mammoths! I've never seen those before! It's a new ice age! Hoorayy!! Sled city! One...lousy...half..inch! Look, the sun is coming out!
  description: It has snowed overnight.  Calvin walks out into it.  He says a mountain of ice has crushed half the neighborhood.  It's a glacier in his own town.  Wooly mammoths walk about.  Calvin declares a new Ice Age.  He pulls out his sled.  There has really only been one...lousy...half...inch.  Hobbes tells Calvin the sun is coming out.
  characters: [calvin, hobbes]
"19891211":
  transcript: What are you doing still in bed?! I've called you three times! You're going to miss the bus! That's the idea. I'm staying in bed until Christmas. I want tons of loot this year, and I figure my chances of being good improve greatly if I don't get up. Disobeying your mother and missing the bus isn't good. It's bad. That darn Santa has got me every way I turn.
  description: Mom asks why Calvin is still in bed.  She's called him three times.  Calvin says he's staying in bed until Christmas.  He wants tons of loot this year, and he figures his chances of being good improve greatly if he doesn't get up.  Mom says that disobeying his mother and missing the bus isn't good, it's bad.  As Calvin hops into his clothes, he says that darn Santa has got him every way he turns.
  characters: [calvin, mom]
"19891212":
  transcript: I hate this time of the year. I've got to be good for two more weeks if I want any goodies this Christmas! I'll never make it.I TRY to be good! I DO! My heart is as pure as driven snow! It's just that, well, sometimes events beyond my control conspire against me! I'm usually an innocent bystand... HEY, I SAW you roll your eyes! So you don't believe me, eh?! ME?? By golly, each of your eyes will be rolling toward the other when I'M through with you! Ha! I hope you asked Santa for some crutches!
  description: Calvin tells Hobbes he hates this time of year.  He has two more weeks to be good if he wants Christmas goodies.  He says he tries to be good.  He says his heart is pure as the driven snow.  He says sometimes events beyond his control conspire against him.  Hobbes rolls his eyes, and Calvin catches him.  They start fighting.  Calvin says Hobbes' eyes will be rolling toward each other when he's through with him.  Hobbes counters by saying he hopes Calvin asked Santa for some crutches.
  characters: [calvin, hobbes]
"19891213":
  transcript: Miserable miscreant! Question my integrity, will you? I can't QUESTION it until I've see some EVIDENCE of it! AUGHH! I'VE BEEN FIGHTING! Only in the loosest sense of the word. SANTA, HE MADE ME! I DIDN'T MEAN TO FIGHT! YES HE DID! YES HE DID! HE STARTED IT! I DID NOT! DID TOO! DID NOT! DID TOO! LIAR! LIAR!
  description: Still fighting, Calvin calls Hobbes a miscreant.  He asks if Hobbes questions his integrity.  Hobbes replies he can't question it until he sees some evidence of it.  Calvin stops and realizes he's been fighting.  Calvin yells to Santa that Hobbes made him fight.  Hobbes yells that Calvin meant to fight and that Calvin started it.  They start fighting again, calling each other liars.
  characters: [calvin, hobbes]
"19891214":
  transcript: Look, Hobbes, no one SAW us fighting, right? This can be OUR little SECRET, OK? Santa doesn't have to know about this, right? Maybe he does and maybe he doesn't. OK, OK, I'll even apologize! I'm sorry. How's that? See, it's OK to fight just a little bit if you say you're sorry afterward. You bit and kicked. I SAID I was sorry! What more do you want?! You could let me read all your comic books. OVER MY DEAD BODY! "Dear Santa, know what Calvin did today?"
  description: Calvin stops again and tells Hobbes that since no one saw them fighting, it can be their little secret.  He says Santa doesn't have to know about this.  Hobbes isn't sure if Santa does or not.  Calvin apologizes to Hobbes.  Hobbes replies that Calvin bit and kicked.  Calvin says he apologized and wonders what else Hobbes wants.  Hobbes says Calvin could let him read all his comic books.  Calvin replies "Over my dead body".  Hobbes pretends to write Santa a note about what Calvin did today.
  characters: [calvin, hobbes]
"19891215":
  transcript: Boy, if it wasn't so close to Chrismas, I'd pound you good! Yeah, I'd like to see you try! Oh no you don't! You're not tempting ME! I want every item on my Christmas list, so I'm being GOOD. No matter what the provication! Here comes Susie Derkins. Really? Quick, help me find a pine cone I can throw at... ...NO! I'm being GOOD! Good! Good! Good! You'll never make it till Christmas. Give up now and enjoy yourself.
  description: Calvin tells Hobbes that if it wasn't so close to Christmas, he'd pound him good.  Hobbes wants to see him try.  Calvin won't be tempted.  He wants every item on his Christmas list, so he's being good.  Hobbes mentions Susie Derkins is coming.  Calvin looks for a pine cone to throw at her.  He stops, clenches his teeth, and says he's going to be good.  Hobbes says he'll never make it to Christmas.  He might as well give up now and enjoy himself.
  characters: [calvin, hobbes]
"19891216":
  transcript: Hi Calvin. Are you bringing your stuffed tiger to school today? No, he's just keeping me company while I wait for the bus. Oh. But actually, he's been nothing but trouble today. He's trying to sabotage my Christmas by making me bad instead of good. Fortunately, I asked Santa for such great presents that I can withstand any temptation. I'm being an absolute angel. What did you ask for? A heat seeking guided missile. I figured five minutes with one of THOSE babies will make up for this whole rotten month.
  description: Susie asks Calvin if he's bringing Hobbes to school.  Calvin says Hobbes is just keeping him company while he waits for the bus.  Calvin goes on to say Hobbes has been nothing but trouble today.  He's trying to sabotage Calvin's Christmas by making Calvin be bad.  Calvin tells Susie that he asked Santa for such great presents that he can withstand any temptation.  Susie asks what he asked for.  Calvin tells her a heat-seeking guided missile.  He figures five minutes with one of those babies makes up for the whole rotten month.
  characters: [calvin, hobbes, susie, stuffedhobbes]
"19891217":
  transcript: Calvin, look! You got a letter! A letter? I didn't hear the mail truck. A letter for me? The return address says North Pole. Oh my gosh, it must be from Santa! Santa sent me a letter! Read it! Read it! Dear Calvin, you rotten little kid... Oh no!! Santa called me rotten! I'm doomed! Keep reading. I made a list, but I didn't bother checking it twice, because obviously you're the naughtiest kid in the whole world. I'm writing to give you one last chance. You've got seven days to get on the good boy list. Seven days?! Oh no! What can I do? I'd suggest you start by being kind to animals. Perhaps you know an animal who would like a snack soon. Or maybe you should let an animal read your comic books sometime. Think about it. Sounds like sane advice. Signed, Santa Claws? Wait a minute! I recognize this handwriting! Give you a snack, huh?! How about a knuckle sandwich?! Hmph. Well, it's a snack.
  description: Hobbes brings Calvin a letter from the "North Pole".  Calvin opens the note and reads that he's a rotten little kid, he's obviously the naughtiest kid in the whole world, but he has seven days to get on the "good boy" list.  The note suggests being kind to animals.  Perhaps an animal who would like a snack soon, or one who could read his comic books sometime.  It's signed "Santa Claws".  Calvin recognizes the handwriting.  It is from Hobbes.  Calvin offers Hobbes a knuckle sandwich for a snack.
  characters: [calvin, hobbes]
  source: seligman
"19891218":
  transcript: Want to help me write a book? Sure. What's it about? Well, you know what historical fiction is? This is sort of like that. I'm writing a fictional autobiography. It's the story of my life, but with a lot of parts completely made up. Why would you make up your own life? Because in my book, I have a flame thrower!
  description: Calvin asks Hobbes if he'll help him write a book.  Calvin says this book will be like historical fiction.  He's writing a fictional autobiography.  He tells Hobbes it's the story of his life with a lot of parts completely made up.  Hobbes asks why he'd want to make up his whole life.  Calvin replies that in his book, he has a flame thrower.
  characters: [calvin, hobbes]
"19891219":
  transcript: Still and quiet feline form, in the sun, asleep and warm. His tail is limp, his whiskers drooped, Man, what could make this cat so pooped? Sheeshh...
  description: Calvin comes upon a sleeping Hobbes.  Calvin says a poem.  "Still and quiet feline form, in the sun asleep and warm, his tail is limp, his whiskers drooped, man what could make this cat so pooped".  He walks off.  Hobbes thinks "sheeshh".
  characters: [calvin, hobbes]
"19891220":
  transcript: Hi Mom! I'm making my own newspaper to report the events of our household. That's nice. Now, I'm looking for a page one lead story. Can I interview you? Sure. OK, what are you cutting up there for dinner? Fish. Knife wielding mother hacks ichthyoid! Grim melee is evening ritual! Suburban family decours victim! Out of the kitchen! Out! Out!
  description: Calvin tells Mom he's making a newspaper to report the events of the household.  He's looking for a page one lead story and asks if he can interview her.  He asks what she's cutting up for dinner.  Mom replies fish.  Calvin has the headlines.  Knife wielding mother hacks ichthyoid!  Grim melee is evening ritual!  Suburban family devours victim!  Mom shoo's him out of the kitchen.
  characters: [calvin, mom]
"19891221":
  transcript: Hi Dad. I'm making my own newspaper to report the events of our household. Would you help me out? Sure, what do you need? Well, you can take your pick. Either you can give me 15 bucks to pay my labor and production costs... 15 bucks?! ... Or you can be the subjedt of a comic strip called "Dopey Dad". So in the next panel, Dopey Dad yells, "It's bed time for YOU, young man!" Hee Hee! Look how big I made his mouth!
  description: Calvin tells Dad he's making a newspaper to report the events of the household.  He asks Dad to help him out either by giving him fifteen bucks to pay labor and production costs or to be the subject of a comic strip, "Dopey Dad".  Under his blanket at night, using a flashlight, Calvin and Hobbes are drawing the comic strip.  Calvin has Dopey Dad yelling "It's bed time for you, young man".  Hobbes chuckles about how big he made the mouth.
  characters: [calvin, hobbes, dad]
"19891222":
  transcript: Ooh hahh ooh hahh ooh hahh ooh hahh I wish we'd ged ad aquariub!
  description: Calvin gets out of the bathtub wearing a snorkel and mask.  He's breathing through the snorkel.  He goes out the bathroom door and down the stairs.  He's standing there naked telling Mom he wishes they would get an aquarium.
  characters: [calvin, mom]
"19891223":
  transcript: What story would you like tonight, Calvin? Hamster Huey and the gooey Kablooie! Oh no, not again! That's what you hear EVERY night! Let's read something different! I WANT HAMSTER HUEY! I WANT HAMSTER HUEY! C'mon, we'll read a new story tonight. You'll like it, I promise. No I won't! I'll stay awake until morning if you don't read Hamster Huey! I didn't remember Hamster Huey having quite that starcastic tone of voice. Or doing everthing so FAST.
  description: Dad asks Calvin what story he'd like to hear.  Calvin wants "Hamster Huey and the Gooey Kablooie".  Dad wants to read something different.  Calvin insists.  Dad says he's going to read a different story that Calvin will like.  Calvin says he won't like it.  He threatens to stay awake until morning unless Dad reads Hamster Huey.  Afterward, Hobbes tells Calvin he doesn't remember Hamster Huey having quite that sarcastic tone of voice.  Calvin doesn't remember Hamster Huey doing everything so fast.
  characters: [calvin, hobbes, dad, stuffedhobbes]
"19891224":
  transcript: Christmas Eve On Window panes, the icy frost leaves feathered patterns, crissed & crossed, but in our house, the Christmas tree is decorated festively with tiny dots of colored light that cozy up this winter night. Christmas songs, familiar, slow, play softly on the radio. Pops and hisses from the fire whistle with the bells and choir. My tiger is now fast asleep on his back and dreaming deep. When the fire makes him hot, he turns to warm whatever's not. Propped against him on the rug, I give my friend agentle hug. Tomorrow's what I'm waiting for, but I can wait a little more.
  description: Calvin and Hobbes are lying on the floor, by the Christmas tree and the fireplace.  There is a poem about Christmas Eve.  It reads the tree is decorated festively, Christmas songs play on the radio, his tiger is fast asleep, he turns to warm whatever's not hot.  He gives his friend a gentle hug.  Tomorrow is what he's waiting for, but he can wait a little more.
  characters: [calvin, hobbes]
"19891225":
  transcript: Ha ha! It's Christmas! Hurry up, Mom and Dad! It's almost dawn! Here, I got you a present. You got me a present? Gosh Hobbes, how nice! I picked it out myself! Open it! Why, it's ... It's three cans of ... Uh... Salmon. Um, thanks, Hobbes. Gee, I didn't get YOU a present. I feel terrible. I thought of that. See, you could give me mine back! That would be a GOOD present! Well then, here! Merry Christmas, Hobbes! Why, thank you! It's just what I wanted! Merry Christmas! Calvin, did you know these cans over in the pantry?
  description: Calvin and Hobbes are under the Christmas tree.  Hobbes gives Calvin a present.  He picked it out himself.  It's three cans of salmon.  Calvin thanks Hobbes for the gift.  Calvin feels bad because he didn't get Hobbes anything.  Hobbes suggests Calvin give him back the gift.  Calvin does, and Hobbes thanks him.  They exchange Christmas wishes.
  characters: [calvin, hobbes]
"19891226":
  transcript: Well, here we are, poised at the precipice of "Pallbearer Peak" on a flimsy sled! The mind recoils in horror to imagine the awful descent! Yes, I'ts a thousand food vertical drop onto a boulder field lined with pricker bushes! It's a journey calculated to exceed the human capacity for blinding fear! Read to go? Ready!
  description: Calvin and Hobbes are at the top of "Pallbearer Peak" with their sled.  Calvin talks about the horror of the descent, the thousand foot vertical drop onto a boulder field lined with pricker bushes.  It's a journey calculated to exceed the human capacity for blinding fear.  Calvin asks Hobbes if he's ready to go, and Hobbes says yes.  They get up and walk off with their sled in hand.
  characters: [calvin, hobbes]
"19891227":
  transcript: New hat, Dad? Yep. I like it. Thank you. So do I. AAUGH! You're going to be late for work, Dad!
  description: Calvin is standing in the snow watching Dad walk by.  Calvin asks if Dad is wearing a new hat.  Dad says yes.  Calvin says he likes it, and Dad says he does, also.  Calvin makes a snowball.  Dad's briefcase is lying on the sidewalk next to his new hat which has snow around it.  Off screen, Calvin yells that Dad is going to be late for work.
  characters: [calvin, dad]
"19891228":
  transcript: You don't LIKE my "Snowman House of Horror", do you?!
  description: There are snowmen on the yard.  One is holding his head, one has three eyes and two noses, one was built around a tree so it looks like the tree sticks up from the snowman, one is cut in half by a smaller snowman on a sled.  Mom has her tongue stuck out.  Calvin asks if Mom likes his "Snowman House of Horror".
  characters: [calvin, mom]
"19891229":
  transcript: I SEE YOU, HOBBES! MAN, WHAT A LOUSY SHOT! TIGERS CAN'T THROW WORTH A ... SMACK! I just threw the first one so you'd turn around.
  description: A snowball flies over Calvin's head.  He turns and says he sees Hobbes.  He says Hobbes is a lousy shot.  The next snowball smacks Calvin right in the face.  Hobbes comes over and says he just threw the first one so Calvin would turn around.
  characters: [calvin, hobbes]
"19891230":
  transcript: A new decade is coming up. Yeah, big deal! Hmph. Where are the flying cars? Where are the moon colonies? Where are the personal robots and the zero gravity boots, huh? You call this a new decade? You call this the future?? HA! Where are the rocket packs? Where are the disintegration rays? Where are the floating cities? Frankly, Im not sure people have the brains to manage the technology they've GOT. I mean, look at this! We still have WEATHER?! Give me a break!
  description: Calvin and Hobbes are walking across the snow covered field.  Hobbes says a new decade is coming up.  Calvin says big deal.  Calvin asks where are the flying cars, the moon colonies, the personal robots, and zero gravity boots.  He scoffs that this is the future.  He asks where are the rocket packs, disintegration rays, and floating cities.  Hobbes isn't so sure people have the brains to manage the technology they have.
  characters: [calvin, hobbes]
"19891231":
  transcript: Are your parents going out for New Year's Eve? Are you kidding? My parents idea of a wild night is to mix a scoop of real coffee in with the decaf. Are you making any resolutions for the New Year? Resolutions? Me? Just what are you implying? That I need to change?? Well, Buddy, as far as I'm concerned, I'm perfect the way I am! For your information, I'm staying like this, and everyone else can just get used to it! If people don't like me the way I am, well, tough beans! It's a free country! I don't need anyone's permission to be the way I want! This is how I am - take it or leave it! By golly, life's too darn short to waste time trying to please every meddlesome moron who's got an idea how I ought to be! I don't need advice! Everyone can just stay out of my face! I...Hobbes? Hmph! He should resolve to be more attentive when someone is speaking.
  description: Hobbes asks if Calvin is making any New Year resolutions.  Calvin asks what he's implying.  He thinks he's perfect the way he is.  He rants on about staying like this, and everyone can get used to it.  It's a free country.  He doesn't need anyone's permission to be the way he wants.  He says life is too short to waste time trying to please every meddlesome moron who's got an idea how he should be.  Everyone can stay out of his face.  He turns around to see Hobbes has left. Calvin grumbles that Hobbes should resolve to be more attentive when someone is speaking.
  characters: [calvin, hobbes]
