"19890816":
  transcript: How's it coming? Slow. This dirt is real hard. Well, that's a pretty good start. But I've been digging all morning! This is going to take forever! Maybe you'll have to settle for a smaller swimming pool. Yeah. This would kill you if you went off the high dive. It's too bad. Mom would've really been surprised to have an olympic pool where her garden used to be. Maybe she'll be surprised anyway.
  description: Calvin is digging a hole.  Hobbes asks how it's going.  Calvin tells him the dirt is pretty hard.  Hobbes thinks he's made a good start.  Calvin says he's been digging all morning.  It's going to take forever.  Hobbes suggests Calvin will have to settle for a smaller swimming pool.  Calvin agrees, saying you'd be killed diving off the high dive into that pool.  He laments the fact saying Mom would have been surprised to have an Olympic pool where her garden used to be.  Hobbes tells him that maybe she'll be surprised anyway.
