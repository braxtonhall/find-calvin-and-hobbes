  "19930829":
    transcript: I read another article whining about how much violence is on television. So I've seen a few thousand homicides in my day! What's the big deal?! It's my RIGHT to watch violence on TV! It's people like me who make these programs profitable! I say the consumer is always right, and if the advertisers want me to watch TV, the shows had better pander to my tastes! ... and frankly, I like to watch shoot outs, car wrecks, fist fights, and grisly muders! I like to be ENTERTAINED! Don't you worry that all this violence is desensitizing? Nahh. I'd like to shoot the idiots who think this stuff affects me.
    description: Calvin read an article about how much violence is on television.  As he watches TV, Calvin says he's seen a few thousand homicides.  He says it's his right to watch violence on TV.  It's people like him who make those programs profitable.  He says the customer is always right, and the shows have to pander to his tastes.  He likes shootouts, car wrecks, and grisly murders.  He likes to be entertained.  Hobbes asks if he doesn't think all that violence is desensitizing.  Calvin says no.  He'd like to shoot the idiots who think this stuff affects him.
