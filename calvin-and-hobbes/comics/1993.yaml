  "19930923":
    transcript: Wait! Don't hit me! There's something on your back! I'm sure. I'm serious! It's a note! Your Mom must've pinned it on your shirt. What's it say? It says, "Somebody run this boy over with a truck." If I'm going to get clobbered, I like to deserve it.
