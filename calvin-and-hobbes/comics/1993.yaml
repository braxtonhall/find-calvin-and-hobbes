  "19930919":
    transcript: Look, a dead bird! It must've hit the window. Isn't it beautiful? It's so delicate. Sighhh... once it's too late, you appreciate what a miracle life is. You realize that nature is ruthless and our existence is very fragile, temporary and precious. But to go on with your daily affairs, you can't really think about that. ...which is probably why everyone takes the world for granted and why we act so thoughtlessly. It's very confusing. I suppose it will all make sense when we grow up. No doubt.
    description: Calvin sees a dead bird.  Calvin says once it's too late, you appreciate what a miracle life is.  You realize life is fragile, and nature is ruthless.  Calvin says you go on with your daily affairs, not thinking about it.  He thinks that's why everyone takes the world for granted and act so thoughtlessly.  He supposes it will all make sense when they grow up.  They sit under a tree and watch birds flying.
