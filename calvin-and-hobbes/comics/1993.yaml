  "19931011":
    transcript: Nowadays, ads don't just sell a product. They sell an attitude! Look at this one! Here's a cool guy saying nobody tells him what to do. He does whatever he wants and he buys this product as a reflection of that independence. So basically, this maverick is urging everyone to express his individuality through conformity in brand-name selection? Well, it sounded more defiant the way HE said it. Mm.
