  "19930930":
    transcript: If heaven is good, and if I like to be bad, how am I supposed to be happy there? How will you get to heaven if you like to be bad? Let's say I didn't DO what I WANTED to do. Suppose I led a blameless life! Suppose I denied my true dark nature! I'm not sure I have that much imagination. Maybe heaven is a place where you're ALLOWED to be bad!
    description: Calvin asks Hobbes how he's supposed to be happy in Heaven, if he likes to be bad.  Hobbes asks how he'll get to Heaven if he's bad.  Calvin asks Hobbes to suppose he led a blameless life.  He says to suppose he denied his dark nature.  Hobbes isn't sure he has that much imagination.  Calvin wonders if Heaven is a place where you're allowed to be bad.
