    source: s-anand+seligman+miraheze
  "19930405":
    transcript: The TV listings say this movie has "adult situations". What are adult situations? Probably things like going to work, paying bills and taxes, taking responsibilities... Wow! They don't kid around when they say "For mature audiences." I've never understood how those movies make any money.
    description: Looking at TV listings, Calvin asks Hobbes what "adult situations" are.  Hobbes thinks they're probably going to work, paying bills, and taking responsibilities.  Calvin says they don't kid around when they say "for mature audiences".  Hobbes never understood how those movies ever made money.
    characters: [calvin, hobbes]
  "19930406":
    transcript: BANG WHANG CLANG ZANG PANG BLANG. WILL YOU STOP THAT AWFUL RACKET?! YOU'RE DRIVING ME CRAZY! ... and a check mark for Tuesday!
    description: Calvin bangs on a pot with a spoon.  He keeps doing it.  Mom yells for him to stop that racket.  He's driving her crazy.  Calvin puts another check mark on his calendar for the day.
    characters: [calvin, mom]
  "19930407":
    transcript: Miss Wormwood? Yes, Calvin? My generation doesn't absorb information this way. Could you reduce everything to factoids? Turn to page 21, class. At least televisions understand us.
    description: Calvin asks Miss Wormwood that since his generation doesn't absorb information this way, could she reduce everything to factoids.  Miss Wormwood goes on.  Calvin says at least their televisions understand them.
    characters: [calvin, wormwood]
  "19930408":
    transcript: I hate it when it's this windy. You know what I hate? I hate when I'm talking and someone turns the conversation to himself! It's so rude! Why do they think I'm talking?! It's so they can hear about ME! Who cares what THEY have to say! If I start a conversation, it should stay on the subject of ME! I also hate it when people look at me all bug-eyed. That must happen a lot.
    description: Walking in the wind, Hobbes says he hates it when it's so windy.  Calvin says he hates when he's talking and someone turns the conversation to himself.  It's so rude.  He's talking about himself, so who cares what they have to say.  Hobbes looks at him.  Calvin also hates it when people look at him bug-eyed.
    characters: [calvin, hobbes]
  "19930409":
    transcript: How many boards would the Mongols hoard, if the Mongol hordes got bored?
    description: Calvin tries to write a poem.  How many boards would the Mongols hoard, if the Mongol hordes got bored?  He looks at the paper, then crumples it.
    characters: [calvin]
  "19930410":
    transcript: No sense putting it off. It's time for spring cleaning. Good for you. What about the HOUSE? What ABOUT the house?
    description: Dad says he's not putting off spring cleaning.  Later, Mom sees him cleaning his bicycle.  She asks what about the house.  Dad doesn't know what she's talking about.
    characters: [mom, dad]
  "19930411":
    transcript: At 35,000 feet, the engines of Flight 430 explode for no reason! With plumes of dense smoke trailing from the wings, the giant aircraft plummets out of control! Meanwhile, a 50 car freight train hits a penny on the rail at 80 miles an hour and jumps the tracks, dragging half a million tons of metal into the air behind it! In a freak coincidence, both the jet and the train are converging on ONE SPOT.... where tectonic plates in the earth's crus have just begun to shift! That spot is the house of farmer Brown, who, at this moment, is unaware of a gas leak as he attempts to light his stove! As he strikes the match, he casually glances out the kitchen window. His eye twitches involuntarily. Can't we play something else?
    description: An airliner's engines explode.  The aircraft plummets out of control.  A train jumps the tracks.  Both the jet and train are converging on one spot where the tectonic plates in the earth's crust are shifting.  At that spot is Farmer Brown, unaware of a gas leak as he lights his stove.  As he strikes the match, he glances out the window.  Calvin has a toy train and plane heading for a log cabin Hobbes is holding.  Hobbes asks if they can play something else.
    characters: [calvin, hobbes]
    source: s-anand+seligman+miraheze
  "19930412":
    transcript: It's a funny world, Hobbes. True. But it's not a hilarious world. ...unless you like sick humor. The world is probably funnier to people who don't live here.
    description: Going down the hill in the wagon, Calvin says it's a funny world.  They fly into the air.  Calvin says it's not a hilarious world.  Hobbes says "unless you like sick humor".  Lying smashed up on the ground, Calvin says the world is funnier to people who don't live here.
    characters: [calvin, hobbes]
  "19930413":
    transcript: Oh good, a true or false test! At last, some clarity! Every sentence is either pure, sweet truth or a vile, contemptible lie! One or the other! Nothing in between!
    description: Calvin gets a true or false test.  He's glad there is clarity.  Each sentence is either the truth or a lie.  He looks at the questions.  He tosses a coin.
    characters: [calvin]
  "19930414":
    transcript: I'm at peace with the world. I'm completely serene. Why is that? I've discovered my purpose in life. I know why I was put here and why everything exists. Oh really? Yes, I am here so everybody can do what I want. It's nice to have that cleared up. Once everyone accepts it, they'll be serene too.
    description: Calvin tells Hobbes he's at peace with the world and is serene.  He has discovered his purpose in life.  He's here so everybody can do what Calvin wants.  Calvin says once everyone accepts it, they'll be serene too.
    characters: [calvin, hobbes]
  "19930415":
    transcript: Ahh, spring! I say let's move on to summer.
    description: Calvin is happy it's spring.  Suddenly, the wind blows, and it starts to rain.  Calvin runs inside the house.  He grabs his comic book and says they should move on to summer.
    characters: [calvin]
  "19930416":
    transcript: I thrive on change. YOU?! You threw a fit this morning because your Mom put less jelly on your toast than yesterday! I thrive on making OTHER people change.
    description: In the wagon, Calvin says he thrives on change.  Hobbes says Calvin had a fit that morning because Mom put less jelly on his toast than yesterday.  Calvin clarifies he thrives on making other people change.
    characters: [calvin, hobbes]
  "19930417":
    transcript: Eww, mud. Look at this gooshy, dirty, slimy, thick wet muck. Blecchh. Talk about a kid magnet.
    description: Calvin sees a mud puddle and says "Eww".  He pokes it with a stick, saying it's dirty and slimy.  He walks off.  He turns around saying it's a kid magnet.
    characters: [calvin]
  "19930418":
    transcript: It all boils down to luck, Hobbes. Some people are born lucky and some people are born UNlucky. Either way, there's nothing you can do about it. You can't fight luck. We're headed for that cliff! YIKES! Bad luck! 'Bye. See what I mean?! You go along, minding your own business, and suddenly your luck runs out. If you're-OW-unlucky, what can you do? OW! You're condemned to suffer! OW! Ooh, right in the pricker bushes. ...just like yesterday. Maybe my luck will change tomorrow.
    description: Going down the hill in the wagon, Calvin says some people are born lucky and some unlucky.  He says you can't fight luck.  Hobbes points out they're heading for the cliff.  Calvin says that's bad luck.  Hobbes jumps out.  Calvin says you go along, minding your own business, and your luck runs out.  As he bounces over the cliff, he says if you're unlucky, you're condemned to suffer.  From the top of the cliff, Hobbes says he landed in the pricker bushes, just like yesterday.  Calvin says maybe his luck will change tomorrow.
    characters: [calvin, hobbes]
    source: s-anand+seligman+miraheze
  "19930419":
    transcript: Susie, I think it's only fair to tell you that there is absolutely no way I would even CONSIDER asking you to the senior prom. That's eleven YEARS from now! I figure that might give you enough time to find somebody who will. If I'd known her longer, I could've given her more notice.
    description: Calvin tells Susie there is no way he'd consider asking her to the senior prom.  Susie says that's eleven years away.  Calvin figures that will give her enough time to find somebody who will.  Lying upside down against his locker, Calvin says if he'd known her longer, he'd have given her more notice.
    characters: [calvin, susie]
  "19930420":
    transcript: Z. I think tigers are actually classified as liquids. Har har.
    description: Calvin sees Hobbes sprawled sleeping on the chair.  He tells Hobbes that tigers are actually classified as liquids.
    characters: [calvin, hobbes]
  "19930421":
    transcript: '"F"?! It seems to me that if I''m not learning this material, you must not be a very good teacher! Wogga muk gubba pum wup! Boo! Gop! What??'
    description: Calvin gets a grade of "F".  He complains that if he's not learning the material, Miss Wormwood must not be a very good teacher.  She says something, but Calvin imagines Spaceman Spiff facing a horrible alien.  After she's finished, Calvin asks what she just said.
    # TODO review: does wormwood count? She's never drawn; she only "speaks" through the alien in the Spiff panel
    characters: [calvin, wormwood, spiff]
  "19930422":
    transcript: Is this milk spoiled? Smell it and see. I'M not going to smell it! YOU smell it! Oh, for goodness' sake. Here... it's fine. I don't take chances with a product that prints the date you might expire.
    description: Calvin asks if the milk is spoiled.  Mom tells him to smell it to find out.  He won't.  Mom checks it, and she says it's fine.  Calvin says he doesn't take chances on products that print the date you might expire.
    characters: [calvin, mom]
  "19930423":
    transcript: Curiosity is the essence of the scientific mind. For example, you know how milk comes out your nose if you laugh while drinking? Well, I'm going to see what happens when I inhale milk INTO my nose and laugh! Idiocy is the essence of the male mind. I'm guessing it will shoot out my ears. Don't you want to see??
    description: Calvin tells Susie that curiosity is the essence of the scientific mind.  He asks Susie if she knows how milk comes out your nose when you laugh while drinking.  He puts straws into his nostrils and says he's going to see what happens when he inhales milk into his nose, then laughs.  Susie says idiocy is the essence of the male mind.
    characters: [calvin, susie]
  "19930424":
    transcript: I think I'll count all the rocks I can find. 400 trillion and three, 400 trillion and four, 400 trillion and five...Wow, I bored myself awake.
    description: Calvin starts to count all the rocks he can find.  He gets to 400 trillion and five, then wakes up.  He says he bored himself awake.
    characters: [calvin]
  "19930425":
    transcript: Hi Mom! Ha ha! I'm up! I'm up! HEY! Get back in bed! I mean it, Calvin! It's too late for this nonsense! Wheeee! I'm gonna watch TV! Ha ha ha! Calvin, stop this! You go straight to bed! NO! You're in big trouble, young man! You'll never catch me! GOTCHA! WAAUGH! I don't WANNA go to bed! I wanna stay UP! Put me down! Let go! I'm not tired! AAAAAA! Mom has to EARN a night's respite from me.
    description: Calvin gets out of bed and runs past Mom saying he's up.  She chases Calvin, telling him to go to bed.  He climbs under the chair and around an end table.  Mom grabs him and takes him to bed.  Calvin yells that he's not tired and wants to stay up.  Mom collapses, exhausted, on the chair downstairs.  Calvin, in bed, says Mom has to earn a night's respite from him.
    characters: [calvin, mom]
    source: s-anand+seligman+miraheze
  "19930426":
    transcript: Want to help me make a poster? Sure. What's it for? It's a school contest. We're supposed to do traffic safety posters. The winner gets five bucks! Wow! Think of it! We'll be rich! And then there's the fame and glory! I tell you, this could be our ticket out of this two-bit dump! Sounds good. What's our winning poster going to say? That's where YOU come in.
    description: Calvin asks Hobbes to help with a safety poster he's doing for school.  The winner gets five dollars.  Calvin says they'll be rich.  This could be the ticket to fame and glory.  Hobbes asks what the poster will say.  Calvin informs Hobbes that's where he comes in.
    characters: [calvin, hobbes]
  "19930427":
    transcript: Our traffic safety poster needs a catchy slogan that promotes awareness and caution. Any ideas? How about, "Don't look into car headlights and freeze, because you'll either get run over or shot!" I'll check the statistics, but I don't think that happens to many people. There's more to this world than just people, you know.
    description: Calvin says the safety poster has to promote awareness.  Hobbes suggests not looking at headlights and freezing, because you'll get run over or shot.  Calvin says he'll check the statistics, but he doesn't think that happens to many people.  Hobbes informs him there is more in the world than just people.
    characters: [calvin, hobbes]
  "19930428":
    transcript: Hey Dad, I'm doing a traffic safety poster. Do you have any ideas for a slogan? Sure! "Cyclists have a right to the road too, you noisy, polluting, inconsiderate maniacs! I hope gas goes up to eight bucks a gallon!" Thanks, Dad. I'll go ask Mom. Why? That's a GREAT slogan!
    description: Calvin asks Dad for a poster suggestion.  Dad, putting his cycling helmet on for a ride, suggests cyclists have a right to the road, you polluting maniacs.  Calvin says he'll go ask Mom.
    characters: [calvin, dad]
  "19930429":
    transcript: Mom suggested the slogan, "Before you cross, look each way... and you'll get home safe each day." That's kind of catchy. Yeah, but I like MY idea better. "Be careful, or be roadkill!" I suppose that lends itself more to your particular brand of illustration. I hope I have enough cadmium red.
    description: Calvin tells Hobbes that Mom suggested looking both ways before crossing.  Hobbes likes it, but Calvin likes his idea better.  Be careful, or be roadkill.  Hobbes supposes that lends itself to Calvin's brand of illustration.  Calvin looks at his crayons and hopes he has enough cadmium red.
    characters: [calvin, hobbes]
  "19930430":
    transcript: With my great slogan and your great artwork, this traffic safety poster is a shoe-in for first prize! A solid foundation of anatomical study is essential for the artist. What should we spend the prize money on? Of course, technical skill alone isn't enough. A picture needs depth of feeling. I think I'll blog it all on jaw breakers and comic books. I'll draw some stars to show pain and human suffering. When you've got talent like ours, the world is your oyster.
    description: As Hobbes draws the poster, Calvin figures they'll win first prize.  Hobbes says a solid foundation of anatomical study is essential for the artist.  Calvin wonders what to spend the prize money on.  Hobbes says a picture also needs depth of feeling.  Calvin thinks he'll spend it all on jaw breakers and comic books.  Hobbes will draw stars to show pain and human suffering.  Calvin says with talent like theirs, the world is their oyster.
    characters: [calvin, hobbes]
  "19930501":
    transcript: There! Finished! Hey, that's terrific! When we win first prize, I'll give you 25% of the winnings. WHAT?! I did all the drawing! YOU should get 25% But it was MY great idea! We'll split 60-40. 50-50. Oh, all right, BE selfish! A good compromise leaves everybody mad.
    description: Hobbes is finished drawing the safety poster.  Calvin says he'll give Hobbes 25% of the winnings.  Hobbes says since he did all the drawing, Calvin should get 25%.  Calvin said it was his idea.  Hobbes offers a 50/50 split.  Calvin calls him selfish.  As he walks off, Calvin says a good compromise leaves everybody mad.
    characters: [calvin, hobbes]
  "19930502":
    transcript: ...BLECCHH... ! EEP! YIKES! HELLP!! WAAUGH! UGHH URGLE GACKKH ORG PLUTCH SPLUTCH BLUTCH URRRPP THPPTHH. Uggh, how revolting. At least it worked. Let's dance! Darling! YOU'RE TRYING TO KILL ME WITH THIS STUFF AREN'T YOU?! JUST ADMIT IT!! If you don't like it, don't eat it. But I'm not fixing you something different.
    description: Calvin's meal attacks him and swallows him.  It chews Calvin up, then spits out a skull and bone.  Mom says it was revolting, but Dad says it worked.  They dance.  Calvin looks at a plate of food and claims they're trying to kill him with that stuff.  Mom says he doesn't have to eat it, but she's not making anything else.
    characters: [calvin, mom, dad]
    source: s-anand+seligman+miraheze
  "19930503":
    transcript: Hi Calvin. I see you wasted your time drawing a safety poster for the school contest. I didn't waste my time! Sure you did. The winning entry is right here. The prize is as good as mine. "Be careful or be roadkill!" That's really disgusting. Thank you. What IS that all over the drawing? Chunky spaghetti sauce!
    description: Calvin tells Susie that he's going to win the safety poster contest.  He shows Susie the poster.  She thinks it's disgusting.  She asks what is on his poster.  He tells her it's chunky spaghetti sauce.
    characters: [calvin, susie]
  "19930504":
    transcript: Who would like to show his or her traffic poster first? I WOULD! I WOULD! All right, Calvin. Step up front. Thank you! My poster says, "Be careful, or be roadkill!" Drawn in patent-pending "3-D gore-o-rama", this picture will actually attract flies, because the drawing is splattered with spaghetti sauce! I can see you're all just sick about your chances of winning.
    description: Miss Wormwood asks who would like to show his poster first.  Calvin volunteers.  Calvin announces it's drawn in "3-D Gore-o-rama".  He says the poster will actually draw flies because of the spaghetti sauce.  Calvin can see the class is just sick about their chances of winning.
    characters: [calvin, wormwood]
  "19930505":
    transcript: Well Hobbes, all we have to do now is wait for the judges to award our poster first prize, and we'll be rolling in moolah and prestige. You know, we really ought to enter more contests. I never realized how much fun it is to win! But we haven't won YET. But we WILL, and then everyone will know how great we are. Don't they already? Oh, you know how people are. They only recognize greatness when some authority confirms it.
    description: Calvin tells Hobbes they just have to wait for the judges to award them first prize.  Calvin thinks they should enter more contests.  He didn't realize how much fun it would be to win.  Hobbes reminds him they haven't won yet.  Calvin says they will, then people will know how great they are.  He says people only recognize greatness when an authority confirms it.
    characters: [calvin, hobbes]
  "19930506":
    transcript: Look Calvin, my poster WON! HUH?!
    description: Calvin imagines various news articles on his winning the poster contest.  Susie walks up to Calvin and shows that her poster won.  Calvin is shocked.
    characters: [calvin, hobbes, susie]
  "19930507":
    transcript: Our poster didn't win? I still can't believe it. What a miscarriage of justice! This contest was a joke! Obviously the judges were biased against us from the start! Well, the important thing is that we tried our best. The IMPORTANT thing is that we LOST! Oops, I always forget the purpose of competition is to divide people into winners and losers. What's the point of trying if you can't be a winner?
    description: Calvin can't believe he didn't win.  He claims the judges were biased.  Hobbes tells him the important thing was they tried their best.  Calvin retorts the most important thing was that they lost.  Hobbes says he forgets the purpose of competition is to divide people into winners and losers.
    characters: [calvin, hobbes]
  "19930508":
    transcript: Dad, my poster didn't win the contest! I think the judges were on the take and the whole thing was rigged! I want you to call the school board, have them declare a fraud, and make them take the prize away from Susie and give it to ME! Calvin, losing is a part of life. You should learn to be a good sport about it and keep things in perspective. After all, winning isn't everything. Is that really what they believe on the planet you're from? You've been watching athletic shoe ads again, haven't you?
    description: Calvin complains to Dad that the poster contest was rigged.  Calvin wants Dad to call the school board and make Susie give the prize to him.  Dad explains losing is a part of life.  He tells Calvin to be a good sport and keep things in perspective.  He says winning isn't everything.  Calvin asks if that's really what they believe on the planet he's from.
    characters: [calvin, dad]
  "19930509":
    transcript: Wow! A dime! BONK! MMF OOF. He would just love me to believe that somersault was intentional and innocent.
    description: Hobbes pounces on Calvin.  Right before impact, Calvin stoops down to pick up a dime.  Hobbes tumbles over him, stops, scratches himself, stretches, then walks off.  Calvin says Hobbes would love for him to believe that somersault was intentional and innocent.
    characters: [calvin, hobbes]
    source: s-anand+seligman+miraheze
  "19930510":
    transcript: I know more about the private lives of celebrities than I do about any governmental policy that will actually affect me. I'm interested in things that are none of my business, and I'm bored by things that are important to know. The media aim to please. Maybe the economy should be discussed in cheap motel rooms.
    description: Riding down the hill in the sled, Calvin tells Hobbes he knows more about celebrity lives than any governmental policy that will affect him.  He says he's interested in things that aren't his business, and he's bored with things that are important to know.  Hobbes tells him the media aim to please.
    characters: [calvin, hobbes]
  "19930511":
    transcript: A million things that bug me. 1. Dried-out catsup on the bottle rim. 2. Toast crumbs in the butter. 3. Mushy bananas. 4. Worms on the sidewalk. 5. Skin on pudding. 6. Making a hand gesture for quotation marks. 7. Raisins. How about "excessively negative people"? Yeah, that's a good one. ...HEY!
    description: Calvin is making a list of a million things that bother him.  Mushy bananas, skin on pudding, raisins, etc.  Hobbes offers "excessively negative people".  Calvin likes that.  Then he realizes what Hobbes meant.
    characters: [calvin, hobbes]
  "19930512":
    transcript: Want to see me juggle? I can keep a dozen eggs in the air at once! HUHH! ACKPTH! Notice I didn't say I could do it for very long. This rug must need a thicker pad.
    description: Calvin asks Hobbes if he wants to see him juggle.  He can keep a dozen eggs in the air at once.  He tosses them into the air.  They all fall down on him and the carpet.  Calvin says he didn't say he could do it very long.  Hobbes thinks the carpet needs a thicker pad.
    characters: [calvin, hobbes]
  "19930513":
    transcript: This tiger is sprawled so still and so flat, a question arises when glancing thereat. Is he asleep? To be perfectly frank, he looks more as if he was creamed by a tank! AAAUGH
    description: Hobbes lies on the floor.  Calvin says a poem about the tiger sprawled still and flat.  He asks if he's asleep, and to be frank, he says Hobbes looks like he was creamed by a tank.  Calvin walks off.  Hobbes pounces.
    characters: [calvin, hobbes]
  "19930514":
    transcript: Do you believe in evolution? No. You don't think humans evolved from monkeys? I sure don't see any difference. Woo hoo hoo!
    description: Calvin asks if Hobbes believes in evolution.  Hobbes says no.  Calvin asks if he doesn't think humans evolved from monkeys.  Hobbes says he doesn't see any difference.  He runs off laughing while Calvin chases him.
    characters: [calvin, hobbes]
  "19930515":
    transcript: There's nothing good on TV. Then turn it off. Turn it OFF?? You mean I should just sit here staring at a blank screen all day?! Oh.
    description: Calvin complains there isn't anything good on television.  Dad tells him to turn it off.  Calvin asks if he should sit and stare at a blank screen all day.  Dad kicks Calvin out of the house.
    characters: [calvin, dad]
  "19930516":
    transcript: That certainly was a grim spectacle. I LIKE breakfast on the run. But Mom, it's their NATURE! Why can't you eat at the table like a civilized human being?!
    description: Calvin puts some jelly on a slice of toast, then throws the toast.  Hobbes leaps past Calvin to messily eat the toast on the floor.  Hobbes says he likes breakfast on the run.  Mom angrily drags Calvin, carrying a mop and bucket, to the mess.  Calvin pleas that it's their nature.  Mom wonders why he can't eat at the table like a civilized human being.
    characters: [calvin, hobbes, mom]
    source: s-anand+seligman+miraheze
  "19930517":
    transcript: Let's find some slugs and worms. Why do we want to find slugs and worms? Because they're gross. That's why one AVOIDS slugs and worms. If we avoid them, we can't dare each other to eat one. Toodle-oo. What's the matter with you?! You don't like FUN?!
    description: Calvin wants to dig for slugs and worms because they're gross.  Hobbes thinks that's why they avoid them.  Calvin explains that if they avoid them, they can't dare each other to eat one.  Hobbes turns and runs away.  Calvin asks if he doesn't like to have fun.
    characters: [calvin, hobbes]
  "19930518":
    transcript: Hey Susie! Do you dare me to eat this worm?? Just one? Um... well, yeah. Don't you think that's disgusting? See him wriggle? Eating five at once would be disgusting. I don't know about just one. You want me to eat FIVE?! Geeeez! Who'd have thought disgust would be so inflationary?!
    description: Calvin asks Susie if she dares him to eat a worm.  Susie thinks eating five would be disgusting, but she doesn't know about just one.  Calvin is shocked she wants him to eat five.  He goes to dig more worms.  He wonders who'd have thought disgust would be so inflationary.
    characters: [calvin, susie]
  "19930519":
    transcript: OK, Susie, I got five worms. But it will cost you 50 cents to see me eat them. 50 cents?! I'd only pay 50 cents if you ate 50 worms. That's a penny a worm. Right. I'll give you a nickel to eat those five. Five cents?! What if I have to go to the hospital because of this? Oh, all right. I'll throw in another nickel if you go to the hospital. ...not so fast! First, prove you even HAVE two nickels!
    description: Calvin has five worms and tells Susie she'll have to pay 50 cents to see him eat them.  Susie says she'll pay a penny a worm.  Calvin asks what happens if he goes to the hospital because of eating the worms.  Susie offers another nickel if he goes to the hospital.  Calvin wants to see the two nickels first.
    characters: [calvin, susie]
  "19930520":
    transcript: OK, give me the nickel and I'll eat the worms. No, you eat the worms and THEN I'll give you the nickel. How about two cents up front and the rest upon completing the job? Sorry! You don't get paid until you do the work. Man, you'd think the guy eating the worms would be calling the shots! Usually, if you're calling any shots, you're not eating worms.
    description: Calvin asks for the nickel to eat the worms.  Susie says she'll pay after he eats the worms.  He asks for two cents up front.  Susie won't pay until he does the work.  Calvin thinks the guy eating the worms would call the shots.  Susie offers that if you're calling any shots, you're not eating worms.
    characters: [calvin, susie]
  "19930521":
    transcript: Ready? Five worms down the hatch! Here goes! Closer... closer... wriggling, squirming, dirty, slimy worms! Closer... closer! Boy, they're really close now! How revolting! Closer... closer! Um... feel free to run away screaming any time. Not with my nickel at stake.
    description: Calvin starts to eat the worms.  He pauses, explaining how slimy and dirty the worms are.  He peeks at Susie while saying how much closer he's getting to eating the worms.  He tells Susie she can run away screaming at any time.  Susie won't with her nickel on the line.
    characters: [calvin, susie]
  "19930522":
    transcript: Calvin, WHAT are you doing? I'm eating worms for a nickel! No you're not! Time for you to come home! And Susie, it's mean to take advantage of kids with no common sense. AW MOM, YOU SPOIL EVERYTHING! What a relief! Thanks Mom. Great timing. If I haven't seen you for two minutes, I figure there's trouble.
    description: Mom asks Calvin what he's doing.  Calvin tells her he's eating worms for a nickel.  Mom says he isn't, and she takes him home.  Mom tells Susie it's mean to take advantage of kids with no common sense.  Calvin is relieved.  He thanks Mom.  Mom says if she hasn't seen him in two minutes, there's trouble.
    characters: [calvin, mom, susie]
  "19930523":
    transcript: Oh man, there goes the game! What a dumb sport. I hate baseball. What's the use of trying? I haven't started around the ba-ases yet! Huh? La de da da! I'm walkinnnngg! Oh, look at the pretty flower! I think I'll stop and smell it! Uh oh! My shoes untied! Better have a seat and tie it! Now I'm hopping backwards! Look at me! I'm crawling! I'm a tiny little inchworm, moving an inch at a time! Inchy-squinchy! Inchy-squinchy! AAAIEEE Whoop! Too late! Home run! Stitches for Hobbes, bandages for you... how on earth do you DO this to yourself? Don't feel sorry for HIM! He -ow- DESERVED it!
    description: Hobbes hits Calvin's pitch.  Calvin retrieves the ball to find out Hobbes hasn't started to run the bases yet.  Calvin grabs the ball and comes running.  Hobbes stops to "tie his shoe".  He hops backwards, then crawls like a worm.  Calvin is getting closer, running at top speed.  Right before Calvin can tag Hobbes out, Hobbes touches home.  Later, Mom is putting a bandage on Calvin.  She asks what happened that he needs bandages and Hobbes needs stitching.  Calvin says Hobbes deserved it.
    characters: [calvin, hobbes, mom, stuffedhobbes]
    source: s-anand+seligman+miraheze
  "19930524":
    transcript: Little joys of life. 1. Reading a new comic book. 2. Petting a happy dog. 3. Getting a letter in the mail. 4. Eating the marshmallows in hot chocolate. 5. Smiling when a big kid calls you a nasty name... and then punching his teeth straight down his ugly neck. You really pull the ol' heartstrings. Some of these I haven't personally experienced, sad to say.
    description: Calvin writes the little joys of life.   Petting a dog, reading a comic book, smiling when a kid calls you a nasty name and you punch his teeth down his neck.  Hobbes reads Calvin's list and says he pulls the ol' heartstrings.
    characters: [calvin, hobbes]
  "19930525":
    transcript: Look, Hobbes. This world is kind of like TV. A casual observer might even confuse the two. But if you notice, here the colors are less intense and the people are uglier. Also, I see that several minutes can go by without a single car chase, explosion, murder or pat personal exchange. Why settle for less, hmm? Shh. This is my favorite deodorant commercial.
    description: Calvin says the world is like TV.  He says the colors outside are less intense and the people are uglier.  He can go minutes without a car chase, murder, or explosion.  Hobbes asks why he would settle for less as Calvin watches his favorite deodorant commercial.
    characters: [calvin, hobbes]
  "19930526":
    transcript: You're a bat-faced, bug-eyed, booger-nosed, baloney-brained beetle-butt! This volunteer social work just isn't for me.
    description: Calvin sits behind a box reading "Candid Opinions".  Susie walks by, and Calvin calls her a bug-eyed, baloney-brained, beetle-butt.  Lying on his smashed box, Calvin suggests volunteer social work isn't for him.
    characters: [calvin, susie]
  "19930527":
    transcript: Today for show and tell, I've brought in some flash cards I made. Each card has a letter followed by several dashes. When I show you the card, you yell the vulgar, obscene or blasphemous word they stand for! ...Ready? She's such a hypocrite about building vocabulary.
    description: Calvin has some flash cards he made for show and tell.  Each card has a letter with some dashes.  The class is supposed to yell the vulgar word they stand for.  At his desk, Calvin grouses about Miss Wormwood being such a hypocrite about building vocabulary.
    characters: [calvin]
  "19930528":
    transcript: I believe personal greed justifies everything. Also, private lives are legitimate public entertainment. And the lowest common denominator is always right! Do I have career options or what? I think I need to start hanging around with other animals.
    description: Calvin believes greed justifies everything.  He says private lives are legitimate public entertainment, and the lowest common denominator is always right.  He asks Hobbes if he has career options, or what.  Hobbes thinks he needs to start hanging around with other animals.
    characters: [calvin, hobbes]
  "19930529":
    transcript: Ooh! Ahh! Eee! POP. It could've happened! Only corn does that. Add some cold water and get back in the tub.
    description: Getting in the bathtub, Calvin heats up and pops.  Downstairs wrapped in a towel, he tells Mom it could have happened.  Mom tells him that only corn does that.  She suggests he add cold water and get back in the tub.
    characters: [calvin, mom]
  "19930530":
    transcript: ""
    description: An alien spaceship flies to Earth and beams an alien down onto Calvin's lawn.  The alien talks to Calvin, but he doesn't understand.  The alien zaps the ground beside Calvin.  Calvin runs into his house and hides in the corner, but the alien follows him and talks again.  Calvin thinks, then turns on the television for him.  The alien is happy, and Calvin is relieved.  The alien beams back to his spaceship.  Dad lunges in and turns off the television as Calvin cringes.
    characters: [calvin, dad]
  "19930531":
    transcript: I'm not going to school any more. Oh? Nope! I've decided to be a "hunter-gatherer" when I grow up! I'll be living naked in a tropical forest, subsisting on berries, grubs, and the occasional frog, and spend my free time grooming for lice! All the experts say it's bad parenting to squelch a kid's ambitions.
    description: Calvin tells Mom he isn't going to school anymore.  He's going to be a "hunter-gatherer" when he grows up.  He'll live in a forest, eating berries and grubs.  Standing for the school bus, Calvin tells Hobbes the experts say it's bad parenting to squelch a kid's ambitions.
    characters: [calvin, hobbes, mom]
  "19930601":
    transcript: Miss Wormwood, I have a question about this math lesson. Yes? Give that, sooner or later, we're all just going to die, what's the point of learning about integers? Turn to page 83, class. Nobody likes us "big picture" people.
    description: Calvin asks Miss Wormwood what the point of learning integers is if they're all just going to die.  Miss Wormwood ignores him.  He grouses that nobody likes "big picture" people.
    characters: [calvin, wormwood]
  "19930602":
    transcript: The problem with people is they don't look at the big picture. Eventually, we're going to die, our species will go extinct, the sun will explode, and the universe will collapse. Existence is not only temporary, it's pointless! We're all doomed, and worse, nothing matters! I see why people don't like to look at the big picture. Well, it puts a bad day in perspective.
    description: Calvin tells Hobbes people don't look at the big picture.  He says everyone will die, the sun will explode, and they're all doomed.  He says existence is temporary and nothing matters.  Hobbes sees why people don't like to look at the big picture.  Calvin says it puts a bad day in perspective.
    characters: [calvin, hobbes]
  "19930603":
    transcript: Miss Wormwood, could we arrange our seats in a circle and have a little discussion? Specifically, I'd like to debate whether cannibalism ought to be grounds for leniency in murders, since it's less wasteful. For some reason, they'd rather teach us stuff that any fool can look up in a book.
    description: Calvin asks Miss Wormwood if they can arrange their seats in a circle and have a discussion of whether cannibalism ought to be grounds for leniency in murders, since it's less wasteful.  Sitting with a dunce cap in the corner, Calvin says they'd rather teach stuff any fool can look up in a book.
    characters: [calvin]
  "19930604":
    transcript: I flunked a test today. But I don't mind. No? It's a question of priorities, Hobbes. A man's got to make room for what he cares about. These days are precious, and I'd rather spend them goofing around than studying. I never really thought of ignorance as a quality of life issue. Apparently, neither has Dad.
    description: Going down the hill on the sled, Calvin tells Hobbes he failed a test but doesn't mind.  Calvin says a man has to make room for what he cares about.  The days are precious, so he'd rather spend them goofing around than studying.  Hobbes never thought of ignorance as a quality of life issue.  Calvin tells him neither has Dad.
    characters: [calvin, hobbes]
  "19930605":
    transcript: You know why birds don't write their memoirs? Because birds don't lead epic lives, that's why! Who'd want to read what a bird does? Nobody, that's who! This is changing the subject, but have you ever noticed how somebody can say something totally loony and not be aware of it? What are you supposed to do, just let it slide?? Sometimes if you wait, he'll top himself. I say just punch 'im then and there!
    description: Calvin asks Hobbes why birds don't write their memoirs.  Calvin says nobody would want to read what a bird does.  Calvin then asks Hobbes if he's noticed how some people can say something loony and not be aware of it.  He asks if you're supposed to do.  Hobbes offers that if you wait, he'll top himself.
    characters: [calvin, hobbes]
  "19930606":
    transcript: 'Whatcha doin''? Getting rich! Really? Yep. I''m writing a self-help book! There''s a huge market for this stuff. First, you convince people there''s something wrong with them. That''s easy because advertising has already conditioned people to feel more insecure about their weight, looks, social status, sex appeal, and so on. Next, you convince them that the problem is not their fault and that they''re victims of larger forces. That''s easy, because it''s what people believe anyway. Nobody wants to be responsible for his own situation. Finally, you convince them that with your expert advice and encouragement, they can conquer their problem and be happy! Ingenious. What problem will YOU help people solve? Their addiction to self-help books! My book is called "Shut Up And Stop Whining: How To Do Something With Your Life Besides Think About Yourself." You probably should wait for the advance before you buy anything. The trouble is... if my program works, I won''t be able to write a sequel.'
    description: 'Calvin is writing a self-help book.  He tells Hobbes you convince people there''s something wrong with them, and that the problem isn''t their fault.  Lastly, you convince them that with your guidance, they can conquer their problem and be happy.  Hobbes asks what problem he''s going to help people solve.  Calvin says their addiction to self-help books.  His book is called "Shut Up and Stop Whining:  How to Do Something With Your Life Besides Think About Yourself".  Hobbes thinks he should wait for the advance before buying anything.  Calvin says if his program works, he can''t write a sequel.'
    characters: [calvin, hobbes]
    source: s-anand+seligman
    review: "verified: checked against a source outside the corpus by the maintainer"
  "19930607":
    transcript: THIS IS A BIG, FAT WASTE OF MY TIME! HELLPP!! IT'S THE THOUGHT POLICE!
    description: In class, Calvin shouts that this is a big waste of his time.  Later, he yells it's the thought police as hands try to grab him back into the classroom.
    characters: [calvin, wormwood]
  "19930608":
    transcript: Want to hear a joke? Sure! OK, this guy goes into a bar. No, wait, he doesn't do that yet. Or maybe it's a grocery store. OK, it doesn't matter. Let's say it's a bar. He's somewhere in the vicinity of a bar, right? So anyway, there's this dog and he says something odd, I don't remember, but this other guy says, um, well, I forget, but it was funny. I'll try to imagine it. Yeah, you'll really laugh.
    description: Calvin tells Hobbes a joke, or tries to.  He starts it with a guy going into a bar.  Calvin stops, then says it's a grocery store.  Then, he decides it doesn't matter.  Calvin says it's in the vicinity of a bar.  He continues by saying there's a dog who says something odd, but Calvin doesn't remember what it was.  Then the guy says something Calvin can't remember.  He tells Hobbes it was funny.  Hobbes offers to try to imagine it.
    characters: [calvin, hobbes]
  "19930609":
    transcript: Hello? Hello. Is your mother home? What business is it of YOURS, jerk?! SLAM! Some people sure are nosy. I left three messages today, and nobody returned my call. How rude.
    description: Calvin answers the phone.  When the caller asks if Mom is home, Calvin slams the phone down after asking what business is it of theirs.  He walks off saying people are sure nosy.  Mom says she left three messages, and nobody has returned her calls.  Calvin says people are rude.
    characters: [calvin, mom]
  "19930610":
    transcript: I think we should get an answering machine. Ugh, I don't. If you have a machine, you feel obligated to return a bunch of calls you'd rather not have received in the first place. WITHOUT a machine, you can just let the phone ring, and eventually the caller gives up and you don't have to talk to him. That wasn't quite my point. That's the problem at work. The secretaries won't ignore the phone, so I'm always talking to people.
    description: Mom tells Dad she wants to get an answering machine.  Dad doesn't.  He'd feel obligated to return calls he didn't want in the first place.  Without a machine, you let the phone ring and the caller gives up.  Mom says that wasn't her point.  Dad says that's the problem at work.  The secretaries won't ignore the phone, so he's always talking to people.
    characters: [mom, dad]
  "19930611":
    transcript: The more you think about things, the weirder they seem. Take this milk. Why do we drink COW milk?? Who was the guy who first looked at a cow and said, "I think I'll drink whatever comes out of these things when I squeeze 'em!"? Isn't that weird? I think conversation should be kept to a minimum until afternoon.
    description: With breakfast cereal in hand, Calvin tells Hobbes the more you think of things, the weirder they seem.  He asks who the first person was who looked at a cow and said he'd drink whatever comes out of these things when he squeezes them.  He asks Hobbes if that isn't weird.  Hobbes thinks conversation should be kept to a minimum until afternoon.
    characters: [calvin, hobbes]
  "19930612":
    transcript: I've been disempowered. My centering, self-actualizing anima has been impacted by toxic, co-dependent dysfunctionality! You've been temporarily inconvenienced. Take out the trash. ARE YOU SAYING THERE'S A DIFFERENCE?!
    description: Calvin yells that he's been disempowered.  His self-actualizing anima has been impacted by toxic dysfunctionality.  Mom says he's been temporarily inconvenienced to take out the trash.  Calvin asks if she's saying there's a difference.
    characters: [calvin, mom]
  "19930613":
    transcript: HELP HELP ACK OFF MMF! UMF GAKK RRRGGH Grrrr YIPE! WAAAA! SCREEECH NNNG AAAAAAAAAAAA. Thanks for the helmet, Dad. Do they sell long-range offensive weapons? Looks like you've been building some character!
    description: Calvin puts on his cycling helmet.  Calvin's bike sneaks around a tree and attacks him.  He runs, but the bike catches up and runs him over.  It chases him up a tree, then drags him along behind it.  Calvin walks into the house, covered in scratches.  He thanks Dad for the helmet.  He asks if they sell offensive weapons.
    characters: [calvin, dad]
    source: s-anand+seligman+miraheze
  "19930614":
    transcript: ""
    description: Calvin tries to fly a kite.  It won't go up.  He tosses it aside.  He gets a helium balloon and flies that instead.
    characters: [calvin]
  "19930615":
    transcript: Dad, what causes wind? Trees sneezing. Really?? No, but the truth is more complicated. The trees are really sneezing today.
    description: Calvin asks Dad what causes wind.  Dad tells him it's trees sneezing.  Calvin asks if that's true.  Dad says no, but the truth is more complicated.  Later, outside in the wind, Calvin tells Hobbes the trees are really sneezing today.
    characters: [calvin, hobbes, dad]
  "19930616":
    transcript: What do you think that cloud looks like? A bunch of suspended water and ice particles,... why? Everybody hates a literalist.
    description: Looking at the sky, Susie asks Calvin what that cloud looks like.  Calvin replies a bunch of suspended water and ice particles.  Susie walks away.  Calvin says everybody hates a literalist.
    characters: [calvin, susie]
  "19930617":
    transcript: Mom, can I have the car keys? No. Can you believe the encyclopedia doesn't have an entry for "hotwire"?
    description: Calvin asks Mom for the car keys.  She says no.  Calvin runs off, then returns.  He tells Mom there isn't an entry in the encyclopedia for "hotwire".
    characters: [calvin, mom]
  "19930618":
    transcript: When I spit, I get pretty good saliva cohesion, but I'm still not getting much distance or accuracy. I think the problem lies in the mix of phlegm. If you don't get that critical mucus mass, you just... ...Hobbes? Nobody likes to hear about a hobby.
    description: Calvin tells Hobbes that when he spits, he gets good saliva cohesion, but not much distance.  Calvin pushes his nose, saying he thinks the problem is in the mix of phlegm.  He says if you don't get that critical mucus mass, it doesn't work.  He looks around to find Hobbes gone.  Calvin complains nobody likes to hear about a hobby.
    characters: [calvin, hobbes]
  "19930619":
    transcript: You know what I like to do when someone's talking to me? I stare at the person's chin. I'll nod and respond to whatever he's saying. But I keep looking at his chin and changing my expression. I look quizzical at first, then vaguely repulsed, and later, quietly amused. Then I'll suddenly arch my eyebrows and blink a lot, and then I look skeptical and disbelieving. You get bonus points every time the person loses his train of thought. I'll bet your natural charm has made you a good sprinter.
    description: Calvin tells Hobbes when someone's talking to him, he looks at the person's chin.  He nods to whatever is being said, but he keeps looking at the person's chin.  He looks quizzical at first, then repulsed.  He arches his eyebrows, then looks skeptical and disbelieving.  Calvin says you get bonus points when the person loses his train of thought.  Hobbes thinks Calvin's natural charm has made him into a good sprinter.
    characters: [calvin, hobbes]
  "19930620":
    transcript: I love summer! Three whole months with no responsibilities! There's nothing we have to do! They say idle hands are the devil's workshop. I resent that! We work darn hard at this.
    description: Calvin tells Hobbes he loves summer.  He has three months of nothing to do.  As they climb a tree, Hobbes tells Calvin people say idle hands are the devil's workshop.  Calvin resents that.  Calvin says they work darn hard at this.  In the tree, they have a bunch of water balloons.  Below the tree is an "X" marked on the grass.  There are signs nearby directing someone to stand there for a big surprise.
    characters: [calvin, hobbes]
    source: s-anand+seligman+miraheze
  "19930621":
    transcript: What if there's no afterlife? Suppose this is all we get? Oh, what the heck. I'll take it anyway. Yeah, but if I'm not going to be eternally rewarded for good behavior, I'd sure like to know NOW.
    description: Lying under a tree, Calvin asks Hobbes about what happens if there's no afterlife.  What if this is all they get?  Hobbes looks around and says he'll take it anyway.  Calvin says if he's not going to be eternally rewarded for his behavior, he'd like to know now.
    characters: [calvin, hobbes]
  "19930622":
    transcript: Phup phupp phup PHBBTTB. Hey, that was a GOOD one! Thank you. It's funny how you never see Mom and Dad practice these. Phup phup. They're probably good at it already.
    description: Calvin and Hobbes put their hands under their armpits and make noises.  Calvin congratulates Hobbes on one of his that was extra loud.  Calvin says it's funny he never sees Mom and Dad practicing those.  Hobbes figures it's because they're good at it already.
    characters: [calvin, hobbes]
  "19930623":
    transcript: I watched an old movie with Mom last night. It didn't have any violence, explosive action, or swearing. There was nothing shocking about it at all. Did you like it? It's hard to say. Not having my emotions manipulated is such a weird experience.
    description: Calvin tells Hobbes he watched an old movie with Mom last night.  There was nothing shocking about the movie at all.  Hobbes asks if he liked the movie.  Calvin can't say.  Not having his emotions manipulated is a weird experience.
    characters: [calvin, hobbes]
  "19930624":
    transcript: Thursday, Day 4. Light winds, good humidity. Progress slow, getting discouraged. I'm only burping - not truly BELCHING. Mellow roundness remains elusive. Harmonics coming along with developing amplitude. Hang in there! They say you should keep a log when you take up a sport.
    description: Calvin makes a diary entry.  He says he's only burping, not belching.  The harmonics are coming with developing amplitude.  He tells Hobbes that they say you should keep a log when you take up a sport.
    characters: [calvin, hobbes]
  "19930625":
    transcript: The literary world is abuzz about Mabel Syrup's sequel to "Hamster Huey and the Gooey Kablooie." We have to buy it! It's called "Commander Coriander Salamander and 'er Singlehander Bellylander"! Achitects should be forced to live in the buildings they design, and children's book authors should be forced to read their stories aloud every single night of their rotten lives.
    description: Calvin tells Dad the literary world is abuzz with Mabel Syrup's sequel of "Hamster Huey and the Gooey Kablooie".  Calvin says they have to buy it.  It's called "Commander Coriander Salamander and 'er Singlehander Bellylander".  Dad says architects should live in the buildings they design, and children's book authors should be forced to read their stories every single night of their rotten lives.
    characters: [calvin, dad]
  "19930626":
    transcript: Hobbes is laughing in his sleep. Hee hee he. Psst! What's so funny? Zzz... shh, I'm going to pounce on Calvin... zz... hee hee... RUN FOR YOUR LIFE, CALVIN!
    description: Calvin sees Hobbes laughing in his sleep.  He whispers to Hobbes asking what's so funny.  Hobbes mumbles back that he's going to pounce on Calvin.  Calvin yells in Hobbes' ear for Calvin to run for his life.  It shocks Hobbes awake, and Hobbes chases Calvin.
    characters: [calvin, hobbes]
  "19930627":
    transcript: The fearless Spaceman Spiff descends toward the mysterious planet below! Our hero's bizarrotron indicates the presence of aliens! Spiff sets out to investigate! Crouching behind a boulder, our hero hears alien voices... talking about HIM! BLORG GABLORD SPIFF! HA HA! Spiff bursts into the open, death ray blaster blansting! "I'll give you something to talk about!" he yells! Excuse me a moment. Back in the darkness of outer space, Spiff reflects on his one miscalculation. Our hero resolves to revisit the planet, THIS time with more ammo! No sleep tonight, I see.
    description: Spaceman Spiff hops out of his craft.  There is indication of aliens.  He crouches behind a boulder listening to aliens talk about him.  He bursts into the open, shooting his death ray blaster.  He yells he'll give the aliens something to talk about.  Calvin has shot rubber-tipped darts at Mom, Dad, and their guests.  Mom chases Calvin.  Later in bed, Calvin says Spiff reflects on his miscalculation.  He'll revisit the planet, this time with more ammo.
    characters: [calvin, hobbes, mom, dad, spiff]
    source: s-anand+seligman+miraheze
  "19930628":
    transcript: Mom and Dad say I should make my life an example of the principles I believe in. But every time I do, they tell me to stop it. I'm not sure that total self-indulgence is really a principle.
    description: Calvin says Mom and Dad tell him to make his life an example of the principles he believes in.  Every time he does, they tell him to stop it.  Hobbes says he isn't sure total self-indulgence is a principle.
    characters: [calvin, hobbes]
  "19930629":
    transcript: Like delicate lace, so the threads intertwine, Oh, gossamer web of wond'rous design! Such beauty and grace wild nature produces... Ughh, look at the spider suck out that bug's juices!
    description: Calvin sees a spider web.  He says a poem, praising the web's beauty.  He ends the poem by commenting on the spider sucking out the bug's juices.
    characters: [calvin]
  "19930630":
    transcript: I read that scientists are trying to make computers that THINK. Isn't that weird?? If computers can think, what will people be better at than machines? Irrational behavior. Maybe they'll invent a psychotic computer.
    description: Calvin says scientists are making computers that think.  He asks Hobbes what will people be better at than machines.  Hobbes offers irrational behavior.  Calvin figures they'll invent a psychotic computer.
    characters: [calvin, hobbes]
  "19930701":
    transcript: I need a push! Somebody come and give me a push! RRRGGHHH. Where the heck is the manual override?!
    description: Calvin sits on a swing.  He yells out for someone to push him.  No one comes.  He tries rocking the swing himself to no avail.  He gets off the swing and looks for the manual override.
    characters: [calvin]
  "19930702":
    transcript: If you stick your tongue out for a long time, it dries up! Try it! Why would anyone want his tongue to dry up?! Because then it feels really weird when you touch it. I'll take your word for it. Some people just aren't open to revelatory experiences.
    description: Calvin says if you stick your tongue out long enough, it dries up.  Hobbes wonders why anyone would want his tongue dried up.  Calvin says it feels weird when you touch it.  Hobbes says he'll take Calvin's word and walks off.  Calvin says some people aren't open to revelatory experiences.
    characters: [calvin, hobbes]
  "19930703":
    transcript: ZZIZZZZ WHIPP FLIP ZZZZ ZZZZ FWAP! ZIPPPP ZZZZZ. The only skills I have the patience to learn are those that have no application in real life.
    description: Calvin has a yo-yo.  He whips it around and around, ending up perfectly in his hand.  Calvin says the only skills he has the patience to learn are things with no real application in life.
    characters: [calvin]
  "19930704":
    transcript: Calvin, I spent over an hour fixing this! At least TRY it! I saw what went in it! I'm not touching it!
    description: Mom pulls an octopus out of the refrigerator.  He plungers the creature into a pot, pours gasoline, a shrunken head, paint, and weed killer onto it, then mixes it.  At dinner, Calvin pushes his plate away.  Mom says she spent over an hour fixing it.  Calvin says he saw what went into it, and he's not touching it.
    characters: [calvin, mom, dad]
    source: s-anand+seligman+miraheze
  "19930705":
    transcript: Can you make a living playing silly games? Actually, you can be among the most overpaid people on the planet. ...sighhh...
    description: Calvin tosses a baseball into the air, but misses his swing of the bat.  He asks Dad if you can make a living playing silly games.  Dad tells him you can be among the most overpaid people on the planet.  Calvin sighs as he tries to hit the ball again.
    characters: [calvin, dad]
  "19930706":
    transcript: I am the world's most powerful computer. Ask me a question. Why does the world's most powerful computer wear little red sneakers?
    description: Calvin puts a box, which has drawings on it to look like a computer, over himself.  He tells Hobbes he's the world's most powerful computer, and offers to answer any question.  Hobbes wonders why the computer wears little red sneakers.  Calvin chases Hobbes.
    characters: [calvin, hobbes]
  "19930707":
    transcript: I am the world's most powerful computer. Ask me a question. Did Calvin clean his room as I asked him to, or did he spend the whole morning playing with a cardboard box? Um... system error... delete question and try again. What happened? Mom booted me up here.
    description: Calvin puts the box over himself, then tells Mom to ask him a question.  Mom asks if Calvin cleaned his room or spend the day playing with a cardboard box.  Calvin says there was a system error.  He says to delete the question and try again.  Upstairs, Hobbes asks what happened.  Calvin says Mom booted him up there.
    characters: [calvin, hobbes, mom]
  "19930708":
    transcript: From now on, I'm not doing anything I don't want to do! The world OWES me happiniess, fulfillment and success. Well, lucky you! Yeah, I'm just here to cash in.
    description: Going down the hill in their wagon, Calvin says he won't do anything he doesn't want to.  He says the world owes him happiness and fulfillment.  Calvin says he's just here to cash in.
    characters: [calvin, hobbes]
  "19930709":
    transcript: What assurance do I have that parenting isn't screwing me up?
    description: Mom and Dad are sitting on the sofa.  Calvin asks what assurance he has that their parenting isn't screwing him up.
    characters: [calvin, mom, dad]
  "19930710":
    transcript: Where are YOU going? Out. Did you pick up your room? I tried. But I couldn't lift it! GET IT?? AH HA HA HA HA HA! For some reason, the sound of children's laughter doesn't make Mom sentimental.
    description: Mom asks where Calvin is going, and he tells her outside.  Mom asks if he picked up his room.  Calvin says he tried, but he couldn't lift it.  He laughs.  Upstairs, Calvin tells Hobbes the sound of children's laughter doesn't make Mom sentimental.
    characters: [calvin, hobbes, mom]
  "19930711":
    transcript: Thank you. Thank YOU. Yep. There's nothing like a big bed for dancing. I hope your parents don't mind bad springs.
    description: There are several pictures of Calvin and Hobbes floating in the air, dancing.  Hopping down from a bed, he says there's nothing like a big bed for dancing.  Hobbes hopes Mom and Dad don't mind bad springs.
    characters: [calvin, hobbes]
    source: s-anand+seligman+miraheze
  "19930712":
