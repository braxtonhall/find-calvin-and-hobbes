  "19930801":
    transcript: CALLLVINN! Mom's calling, start the stopwatch. Shouldn't you answer her? CALLVINNN! Not yet. She doesn't see us, so she can't prove we heard her. The trick is to listen to her tone of voice and answer just before she gets mad enough to come looking for us. CALVIN!! OK, that was it. Now we play innocent. ARE YOU CALLING ME?? Come inside. It's time for bed. It's getting dark. Ha! She made a tactical blunder! Darkness is relative! IT'S NOT DARK! YES IT IS. COME INSIDE. I CAN STILL SEE MY HANDS! IT'S NOT REAL DARK! IT'S DARK ENOUGH. LET'S GO. Rats, she cut off the debate before we could really define the terms. Now we have to bargin. CAN I STAY OUT ANOTHER TEN MINUTES? THAT'S ALL I WANT! NO, COME IN NOW. FIVE MINUTES THEN! JUST FIVE MINUTES, OK? NOW, CALVIN! Darn, she's catching on! She guessed that MY five minutes is HER half-hour. We'll go for the fake agreement. OK, I'M COMING! Now we can stay out a little longer before she realizes I lied. How's the time? We've dragged this out 53 seconds so far. Good, let's go for the record! Oops, I lost my shoe! Every minute outside and awake is a GOOD minute.
