  "19930324":
    transcript: Miss Wormwood, I protest this "C" grade! That's saying I only did an "average" job! I got 75% of the answers correct, and in today's society, doing something 75% right is outstanding! If government and industry were 75% competent, we'd be ecstatic! I won't stand for this artificial standard of performance! I demand an "A" for this kind of work! I think it's really gross how she drings Maalox straight from the bottle.
    description: Calvin protests his "C" grade to Miss Wormwood.  He says he got 75% of the answers correct, and in today's society that's doing outstanding.  He says if industry was 75% competent, they'd be ecstatic.  He demands an "A".  Calvin thinks it's really gross that she drinks Maalox straight from the bottle.
