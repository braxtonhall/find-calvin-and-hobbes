  "19930911":
    transcript: Dad, what's it like being a grown-up? Well, it's not too different from being a kid... ...except you're more attached to your toys.
    description: Calvin asks Dad what it's like being a grown-up.  Dad tells him it's not too different from being a kid, except you're more attached to your toys.  Dad sits down to clean his bicycle.
