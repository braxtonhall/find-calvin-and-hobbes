  "19930404":
    transcript: 15 bucks a glass?! That's right! Want some? How do you justify charging 15 dollars? Supply and demand. Where's the demand?! I don't see any demand! There's LOTs of demand! Yeah? Sure! As the sole stockholder in this enterprise, I DEMAND monstrous profit on my investment! And as President and CEO of the company, I DEMAND an exorbitant annual salary. And as my own employee, I DEMAND a high hourly wage and all sorts of company benefits! And THEN there's overhead and actual production costs! But it looks like you just threw a lemon in some sludge water! Well, I have to cut expenses SOMEwhere if I want to stay competitive. What if I got sick from that? "Caveat Emptor" is the motto we stand behind! I'd have to charge more to follow health and environment regulations. You're out of your mind. I'm going home to drink something else. Sure! Put me out of a job! It's you anti-business types who ruin the economy! I need to be subsidized.
    description: Calvin has a lemonade stand, charging $15 a glass.  Susie asks how he justifies that.  Calvin says supply and demand.  Susie doesn't see any demand.  Calvin explains that as stockholder in the enterprise, he demands monstrous profit.  As CEO of the company, he demands an exorbitant salary.  As an employee, he demands a high wage and lots of benefits.  Susie complains it looks like he threw a lemon in some sludge water.  Calvin had to cut expenses somewhere to stay competitive.  Susie asks what happens if she got sick from it.  Calvin says he stands behind the motto "caveat emptor".  Susie walks away.  Calvin complains anti-business types like her who ruin the economy.  Later, Calvin tells Mom he needs to be subsidized.
