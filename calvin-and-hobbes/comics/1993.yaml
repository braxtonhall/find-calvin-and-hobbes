  "19930322":
    transcript: Look at these TV commercials. Each one is a jumble of lightning quick, unrelated images and film techniques. It duplicates the effect of rapidly flipping through channels. It's a barrage of non-linear free association. I guess they're admitting that a 15-second commercial exceeds the American attention span by a good 14 seconds. Huh? Are you still talking about that?
