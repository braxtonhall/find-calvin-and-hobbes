  "19930302":
    transcript: Let's see if Calvin got whatever was in his locker. With stupendous muscles of magnitude, Stupendous Man breaks free!! What on earth?! S.. for Stupendous! T... for Tiger, ferocity of! U.. for Underwear, red! P.. for Power, incredible! E... for Excellent physique! N... for ...um... something... hm, well, I'll come back to that... D... for Determination! U... for... wait, how do you spell this? Is it "I"?? It's not enough that we have to be disciplinarians. Now we need to be psychologists. Your nefarious scheme will never succeed!
