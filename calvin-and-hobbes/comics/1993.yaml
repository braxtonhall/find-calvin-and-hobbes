  "19930313":
    transcript: When you're a kid, you don't have much variety of experience. You live with your parents and that's all you know. You grow up thinking whatever they do is "normal". Ahh, what a day! Up at 6:00, a 10-mile run in the sleet, and NOW a big bowl of plain oatmeal! How I love the crazy hedonism of weekends! Well, maybe "normal" is too strong a word. I think we'd know normal if we saw it.
