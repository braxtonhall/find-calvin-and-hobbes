  "19930921":
    transcript: The more you know, the harder it is to take decisive action. Once you become informed, you start seeing complexities and shades of gray. You realize that nothing is as clear and simple as it first appears. Ultimately, knowledge is paralyzing. Being a man of action, I can't afford to take that risk. You're ignorant. But at least you act on it.
    description: Calvin says the more you know, the harder it is to take decisive action.  When you are informed, you see complexities and shades of gray.  You realize nothing is as clear as it first appears.  Ultimately, knowledge is paralyzing.  Calvin tosses his book.  He says as a man of action, he can't afford to take that risk.  Hobbes says Calvin is ignorant, but at least he acts on it.
    characters: [calvin, hobbes]
  "19930922":
    transcript: Have you been reading about the "electronic superhighway"? Pretty soon, computers, telephones and TVs will all be hooked together to bring instantaneous, interactive communication right into our homes! But Dad says he liked it better when you had to communicate by mail, and you knew you wouldn't hear back from anybody for at least a week. Of course, your Dad thinks transportation should've stopped with the bicycle. I'm a 21st century kid trapped in a 19th century family.
    description: Calvin asks Hobbes if he's been reading about the "electronic superhighway".  Calvin says they'll all soon be hooked together to bring instant communication to their homes.  He says Dad liked it better when you communicated by mail, and you knew you wouldn't hear back for a week.  Hobbes says Dad thinks transportation should've stopped with the bicycle.  Calvin says he's a 21st-century kid trapped in a 19th-century family.
