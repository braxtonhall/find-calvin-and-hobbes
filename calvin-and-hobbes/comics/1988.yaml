  "19880612":
    transcript: Do you see any snapping turtles, eels or leeches in there? Nope. So far, our expedition is a failure. How's the water? Absolutely frigid. My feet are completely numb. If I go in just a half inch every ten minutes, I can stand it. Getting your swimsuit wet is the worst part, though. As soon as it touches the water, it soaks up and clings to you and gets you wet before you're ready. Why don't you just jump in and get it over with? Are you kidding? The shock would kill me! It's better to go in a wee bit at a time. No, it's better to do it all at once. It's worse to drag it out. You must've been dropped when you were little. I'll show you! Look out! NO! NO! NO! SPLOOSH! Brr-r-r-r! Maybe you were right. WE'LL NEVER NOW NOW, WILL WE?!?
