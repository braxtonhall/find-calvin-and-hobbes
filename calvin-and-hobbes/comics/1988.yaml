strips:
  "19880101":
    transcript: Whap! I'm glad to see you're inside. It's handy not to have to boots and a coat to take off.
    description: Calvin is smacked on the back of his head with a snowball.  He falls into the snow.  He looks around for who the attacker was, but sees no one.  He goes into the house.  Hobbes is lying on the sofa, reading a comic book.  Calvin walks by, snowball on head, and says he's glad Hobbes is inside.  Hobbes sheepishly looks up and thinks it's handy to not have boots and a coat to take off.
    characters: [calvin, hobbes]
  "19880102":
    transcript: My snow fort makes me invulnerable! From behind it's thick wall, I can launch a brutal snowball barrage and remain safe from retaliation! Whap! You're supposed to attack from that side of the fort, dummy!!
    description: Calvin yells out that his snow fort makes him invulnerable.  He boasts how he can launch a barrage and remain safe from retaliation.  Suddenly, a snowball smacks into the back of his head.  Hobbes is making another snowball as Calvin complains that he was supposed to attack from the other side of the fort.
    characters: [calvin, hobbes]
  "19880103":
    transcript: Did you make any resolutions for the new year? Heck no. I'm just fine the way I am! Why should I change? In fact, I think it's high time the world started changing to suit me! I don't see why I should do all the changing around here! If the new year requires resolutions, I say it's up to everyone else, not me! I don't need to improve! Everyone else does! How about you did you make any resolutions? Well, I had resolved to be less offended by human nature, but I think I blew it already.
    description: Hobbes asks Calvin if he made any resolutions for the new year.  Calvin replies no.  Calvin thinks he's fine as he is.  In fact, he wants the world should change to suit him.  He goes on to say he doesn't need to make changes, everyone else does.  When he asks Hobbes if he made any resolutions, Hobbes replies that he was going to be less offended by human nature, but he thinks he's blown it already.
    characters: [calvin, hobbes]
  "19880104":
    transcript: I hate waiting for the school bus on days like these. Blustery cold days should be spent propped up in bed with a mug of hot chocolate and a pile of comic books. That's what I'd like to be doing right now. As soon as I graduate, I'm going to spend every winter that way. I wish you bus would come my hot chocolate will get cold.
    description: Calvin and Hobbes are huddled in the wind.  Calvin says he hates waiting for the school bus on days like this. Calvin believes blustery days should be spent with a mug of hot chocolate and a pile of comic books.  That's what he'd like to be doing right now.  Calvin says that as soon as he graduates, he'll spend every winter that way.  Hobbes hopes the bus will come soon.  His hot chocolate will get cold.
    characters: [calvin, hobbes]
  "19880105":
    transcript: Help me figure out this homework problem, Hobbes. What's 3 + 8. Ok, assign the answer a value of x. x always means multiply, so take the numerator (that's latin for number eighter) and put that on the other side of the equation. That leaves you with three on this side, so what times three equals eight? The answer of course, is six. Gosh, I must have done all the others wrong. These problems seem awfully advanced for first grade if you ask me.
    description: Calvin asks Hobbes for help on a math problem.  Hobbes assigns the answer "x", which means multiply.  So Hobbes then takes the numerator and puts it on the other side of the equation.  Hobbes comes up with the answer.  3 + 8 = 6. Calvin thinks he must have done all the other problems wrong.
    characters: [calvin, hobbes]
  "19880106":
    transcript: Here's another math problem I can't figure out. What's 9 + 4? Ooh, that's a tricky one. You have to use calculus and imaginary numbers for this. Imaginary numbers?! You know, eleventeen, thirty-twelve, and all those ... it's a little confusing at first. How did you learn all this? You've never gone to school! Instinct, tigers are born with it.
    description: Calvin asks for help on another problem.  Hobbes thinks 9 + 4 is tricky and requires calculus and imaginary numbers to solve.  Eleventeen and thirty-twelve are a couple examples Hobbes gives.  Calvin wonders how he knows this since he never went to school.  Hobbes claims that it's instinct.  Tigers are born with it.
    characters: [calvin, hobbes]
  "19880107":
    transcript: It's freezing in this house! Somebody crank up the thermostat! Why doesn't someone make a fire?! If we can't afford to heat this place, maybe dad should get a better job! Why can't we move to Florida?! Calvin, pipe down and put on a sweater if you're cold. And go to all that trouble?!
    description: Calvin yells that it's freezing in the house, and that someone should turn up the thermostat.  He keeps ranting that Dad should get a better job if they can't afford to heat the house.  Maybe they should move to Florida.  Someone tells him to pipe down.  He should put on a sweater if he's cold.  Calvin complains that he shouldn't have to go to all that trouble.
    characters: [calvin]
  "19880108":
    transcript: I read that the average household watches 7.5 hours of TV every day. Mom says she doesn't watch TV at all while I'm at school. So if we get home at 3:00, I should be able to watch it straight 'till 10:30, right? Wrong. Do you want us to be sub-average?!
    description: Calvin mentions to Dad that the average family watches 7 1/2 hours of TV a day.  He mentions that Mom said she doesn't watch TV while he's at school.  So, Calvin figures if he gets home at 3:00, he can watch TV straight through until 10:30.  Dad says "wrong".  Calvin asks if Dad wants them to be sub-average.
    characters: [calvin, dad]
  "19880109":
    transcript: Mom, the washer is done. Ok. Aren't you going to put the wash in the dryer? In a minute. You mean you are just going to let it sit in the washing machine?!? Calvin, can't you see I'm busy right now?? She says she's busy. I hope the next time she takes a bath there aren't any towels.
    description: Calvin tells Mom the wash machine is done.  He asks if she is going to put the wash in the dryer.  She says she will. Calvin continues to ask if she's going to let it sit in the wash machine.  Mom yells that she's busy right now.  Calvin goes over to Hobbes, who is in the wash machine.  Calvin tells him that Mom is busy.  Hobbes hopes the next time she takes a bath, there aren't any towels.
    characters: [calvin, hobbes, mom]
  "19880110":
    transcript: Two parts slush, one part solid ice, one part hard-packed snow a dash of assorted debris. Sculpt into a sphere, and serve at high velocity without warning. Oh, boy, here comes Susie! Hey, Susie! Whap! Ha ha! I gotcha, you dumb girl!! Aughh! My eyeball! Where's my eyeball! What are you talking about? I hit you in the back. It knocked my eyeball out! Find it and pack it in snow so they can save it. Ooh. Ooh. Gosh, did you really lose your eyeball? I didn't know they came out! Wow. I'm really sorry. I didn't mean to knock it out. Can I see the socket? Boy, where do you suppose it rolled. Somewhere over there, poop head!! Boot! What are you doing? My eyeball fell out. Help me look for it.
    description: Calvin hides behind a tree and throws a snowball at Susie.  It hits her in the back of the head.  Calvin gloats over having hit her.  Susie complains that it knocked her eyeball out.  She tells Calvin to find it, so they can pack it in snow and save it.  Calvin apologizes.  He didn't know eyeballs could come out.  He wants to see her eye socket.  He's looking in the snow and asks if she knows where it rolled.  Susie kicks Calvin into the snow.  She had been faking all along.  Hobbes comes by to see Calvin face down in the snow.  He asks Calvin what he's doing.  Calvin tells him his eyeball fell out and wants Hobbes to help him look for it.
    characters: [calvin, hobbes, susie]
  "19880111":
    transcript: Who's coming to visit? Your Uncle Max. I thought I told you. Uncle Max?? I don't remember any Uncle Max. Are you sure he's related? Maybe he's a con man trying to swindle us! Of course he's related. He's your dad's brother. He just hasn't been here for a few years. Why not? Was he in jail? No! good heavens, Calvin. Now, now ... with Max, that's not a bad guess.
    description: Calvin asks Mom who's coming to visit.  Mom tells him Uncle Max.  Calvin doesn't remember him and wonders if he's a con man trying to swindle them.  Mom says he's Dad's brother and hasn't been to visit for a few years.  Calvin wonders if he was in jail.  Mom tells him no, but Dad says that with Max, that's not a bad guess.
    characters: [calvin, mom, dad]
  "19880112":
    transcript: We're getting near the airport, Calvin. See the jets? How come you're so quiet back there? Aren't you excited to see Uncle Max? Yeah. I just hope nobody thinks I'm giving up my room while he's here.
    description: The family is going to the airport to pick up Uncle Max.  Dad asks whether Calvin sees the jets.  There's no answer.  Dad asks why Calvin is being so quiet.  Isn't he excited to see Uncle Max.  Calvin says he is, but after sitting for a second adds that he hopes nobody thinks he's giving up his room while Uncle Max is visiting.
    characters: [calvin, mom, dad]
  "19880113":
    transcript: It's great to see you, Max! It seems like ages since you've been here. I'll say. I didn't think it had been so long, until I saw Calvin. This guy has really grown. So kid, what do you say? I say you'd better watch your step, 'cause I've got a live, man-eating tiger at home, and if I so much as wink, he'll rip your lungs out. cute kid, bro.
    description: The family picks Max up at the airport.  Max comments that he didn't think it had been so long, but seeing Calvin showed him.  Calvin has grown so much.  Max asks Calvin "what do you say".  Calvin replies that he has a live man-eating tiger at home and will rip Max's lungs out if Calvin so much as winks.
    characters: [calvin, mom, dad, max]
  "19880114":
    transcript: And this is my room, Uncle Max. I don't know where you're sleeping, but it sure isn't here. Gotcha, nice room. This is Hobbes. I wouldn't get too close if I was you. Don't worry he looks like a fierce one. Yep. Mandibles of death, that's what he's got. And a killer's yee. You can tell. I think I'll go downstairs. Ol' Uncle Max seems pretty sharp. Hard to believe he's related to dad. A killer's eye, he said. Wow! I wonder which one!
    description: Calvin shows Uncle Max his room.  Calvin mentions he doesn't know where Max is sleeping, but it isn't here. Max understands.  Calvin shows Hobbes to Max and warns him not to get too close.  Max agrees and says he can tell Hobbes is a fierce one.  Calvin tells him Hobbes has mandibles of death.  Max adds that Hobbes has a killer's eye, you can tell.   He goes downstairs.  Calvin thinks Uncle Max is pretty sharp.  He finds it hard to believe Max is related to Dad.
    characters: [calvin, hobbes, max, stuffedhobbes]
  "19880115":
    transcript: Hey! Hey, kid, what are you doing?! I'm going through your luggage. What's it look like I'm doing? Did mommy and daddy raise you themselves, or did they just untie you for my visit? Didn't you bring me a present? I can't find one anywhere.
    description: Max comes into his room to see Calvin doing something.  Max asks what he's doing.  Calvin looks at all the stuff from the luggage lying on the floor.  He tells Max he's looking through his luggage.  He asks what it looks like he's doing. Max wants to know if Mom and Dad raised him themselves or if they untied Calvin for the visit.  Calvin asks if Max brought him a present, since he can't find one anywhere.
    characters: [calvin, max]
  "19880116":
    transcript: Is this my place? Can't I sit over there? I want to sit next to Uncle Max. Can I? Please? Please? Ok, go ahead. Move your chair over. You should be flattered, Max. Calvin asked to sit by you tonight. Hey, that's sweet.
    description: Calvin asks if he can sit by Max at the dinner table.  Mom agrees.  She tells Max he should be flattered that Calvin asked to sit by him.  Max says that's sweet.  When Max sits down, a noise comes out.  Calvin apparently put a whoopee cushion on Max's chair.  Calvin laughs hysterically while Mom covers her face with her hands.
    characters: [calvin, mom, dad, max]
  "19880117":
    transcript: I've got to go in. Another five minutes out here, and I'll be frozen solid. Ooh, I hope that was no one I knew. You looked pretty cold coming up the hill, so I fixed you some hot chocolate and crackers with peanut butter. Go wrap up in a blanket and take these in front of the fire. Here's Hobbes and a comic book. Getting toasty? Uh huh. Thanks. She even put marshmallows in the chocolate. Nobody knows how to pamper like a mom. So are you going to eat all those peanut butter crackers yourself, or what?
    description: Calvin comes in from the snow.  Mom fixed him some hot chocolate and crackers with peanut butter.  She tells him to wrap up with a blanket and to take the food in front of the fireplace.  She brings Hobbes and some comic books. After Mom leaves, Calvin notices she even put marshmallows in the hot chocolate.  He says "nobody knows how to pamper like a Mom".  Hobbes wants to know if Calvin is going to eat all those peanut butter crackers himself, or what.
    characters: [calvin, hobbes, mom, stuffedhobbes]
  "19880118":
    transcript: Do you have any kids Uncle Max? Me? Nope, I'm not even married. Oh. What difference does that make? Kid watches a lot of TV does he?
    description: Calvin asks if Uncle Max has any kids.  Max tells him no, he isn't even married.  Calvin asks what difference that makes.  Max suggests Calvin watches a lot of TV.
    characters: [calvin, mom, dad, max]
  "19880119":
    transcript: Boy, Calvin takes that stuffed tiger everywhere he goes. Yeah, they're inseparable. Do you worry about that? I mean, shouldn't he be playing with real friends? Oh, I think he will when he's ready. Didn't you ever have an imaginary friend? Sometimes I think all my friends have been imaginary.
    description: Max is talking to Mom as they do the dishes.  Max notices that Calvin takes Hobbes everywhere.  Mom agrees that they're inseparable.  Max asks if she worries that Calvin isn't playing with real friends.  Mom says she figures he will when he's ready.  She asks if Max ever had an imaginary friend.  Max laments that sometimes he thinks all his friends have been imaginary.
    characters: [mom, max]
  "19880120":
    transcript: Uncle max, look! I'll show you a magic disappearing trick! Ok, first I'll need an ordinary twenty dollar bill. How about if I lend you a nickel instead? No, it works much better with a twenty, or a fifty, if you have one. I take it you think your ol' Uncle Max is a low-watt bulb. Why, did Dad tell you how this works?
    description: Calvin offers to show Max a magic disappearing trick.  Calvin explains that he'll need a twenty-dollar bill.  Max offers a nickel instead.  Calvin says it works better with a twenty or a fifty, if he has one.  Max crouches down by Calvin and tells him he must think ol' Uncle Max is a low-watt bulb.  Calvin asks if Dad told him how this works.
    characters: [calvin, max]
  "19880121":
    transcript: When are you going back home, Uncle Max? Tomorrow. Is that soon enough? Gee, I wish you could stay forever. What a nice thing to say! You're all right, Calvin. Mom's a lot more patient with me in front of guests.
    description: Calvin asks Uncle Max when he's going home.  Max tells him tomorrow.  Calvin says he wishes Max could stay forever.  Max says that's a nice thing to say and says Calvin is alright.  Calvin says Mom is a lot more patient with him in front of guests.
    characters: [calvin, max]
  "19880122":
    transcript: Well, so long, Max. It was great to see you again. You too. Have a safe trip home. Come visit me sometime ok, fella? Heck, I'll come right now! So long, Mom! Bye, Dad! Calvin, get back here! I never get to do anything fun. Missed your chance dear. We could've bought him a ticket. Well.
    description: Everyone is saying goodbye to Max at the airport.  Max tells Calvin to come visit him sometime.  Calvin decides he'll go right then.  Mom grabs Calvin.  Dad tells her she missed her chance.  They could have bought Calvin a ticket.
    characters: [calvin, mom, dad, max]
  "19880123":
    transcript: Are you just going to stay inside all day? You should go play outside and get some fresh air!
    description: Calvin and Hobbes are sitting on the floor playing checkers.  Dad asks if he's just going to sit inside all day. Dad tells Calvin he should go outside to play and to get some fresh air.  Calvin and Hobbes get bundled up, go outside, and sit on the ground playing checkers.
    characters: [calvin, hobbes, dad, stuffedhobbes]
  "19880124":
    transcript: Seven, eight, nine, net! That's my square! Ha ha! you owe me money! Uh eleven! Just a minute! What are you doing? You can't just take money from the bank! You've got hotels on every piece of property you own. I can't afford to pay you, so I'm sticking up the bank, it's a robbery! You can't do that! I'm the banker, right? Am I going my life over a few thousands dollars? The rules don't say you can rob the bank. That's cheating. Do the rules say you can't rob the bank? Huh? Do they? Just roll the dice and accept this is a tragic turn of events, ok? Ok, if that's how we're playing, then I'm robbing you! Ha! I'll steal your deeds to Park Place and Boardwalk! Yeah? Well, I'm taking all the houses and hotels, and putting them on Baltic. Where you just landed! You owe me $250,000! That's what you think you, you. Isn't it cute how Calvin plays both sides of Monopoly with his stuffed tiger? I dunno, I overheard him using words he didn't learn in this household.
    description: Hobbes is playing Monopoly with Calvin.  Hobbes tells Calvin he can't just take money from the bank.  Calvin explains that Hobbes has hotels on all his properties, so Calvin can't afford to pay him.  Calvin is robbing a bank.  Hobbes tells him he can't do that.  Calvin replies he's the banker, and he's not going to risk his life for a couple thousand dollars.  Hobbes shows the rules don't say you can rob the bank.  Calvin retorts the rules don't show that you can't.  He tells Hobbes to just roll the dice and accept this tragic turn of events.  Hobbes says if that's how Calvin's going to play, Hobbes will rob Calvin.  Calvin steals the deeds to Boardwalk and Park Place.  Hobbes angrily takes all the houses and hotels and puts them on Baltic Avenue, where Calvin landed.  Calvin owes Hobbes $250,000.  In the other room, Mom comments how cute it is that Calvin plays both sides of the Monopoly board.  Dad isn't so sure.  He's heard Calvin using words he didn't learn in their household.
    characters: [calvin, hobbes, mom, dad]
  "19880125":
    transcript: Aaghh, I can't believe we were assigned to do a report together. All I can say is you'd better do a great job! I don't want to flunk just because I was assigned a doofus for a partner. A doofus?? Who takes her sandwiches apart and eats each ingredient separately? What's wrong with that? It certifies you as a grade a nimrod. It does not!
    description: Calvin can't believe he has to do an assignment with Susie.  Susie warns him about doing a great job.  She doesn't want to flunk because she got a doofus for a partner.  Calvin reminds her that she picks her sandwiches apart and eats the ingredients separately.  Susie wants to know what's wrong with that.  Calvin says that makes her a grade "A" nimrod.  Susie yells that it does not.
    characters: [calvin, susie]
  "19880126":
    transcript: Ok, look. We've got to do this dumb project together, so we might as well get it over with. What are we supposed to be doing? Weren't you even paying attention. What would you do if I wasn't here to ask? You'd flunk and be sent back to kindergarten, that's what! Says you! I heard that sometimes kids don't pay attention because the class goes at too slow a pace for them. Some of us are too smart for the class. Oh, right. You're too smart. Believe it, lady. You know how Einstein got bad grades as a kid? Well, mine are even worse!
    description: Calvin suggests that since they have to work together, they might as well get it done.  He asks what they're supposed to be doing.  Susie yells at him for not paying attention.  She tells him that if she wasn't there to ask, he'd flunk and be sent back to kindergarten.  Calvin replies that some kids do poorly because the class is too slow, that the kid is too smart for the class.  Susie rolls her eyes and says "Oh, right.  You're too smart".  Calvin goes on to point out that Einstein got bad grades in school, and Calvin's are even worse than his.
    characters: [calvin, susie]
  "19880127":
    transcript: So what are we supposed to be doing? We're supposed to be researching the planet Mercury. So what have we found out? nothing! I'm not going to do this whole thing myself! You'd probably goof it all up if you did. Let's get started. Yes! Let's! I'll be the management, and you can be the labor. First, get some books. Does anyone want to trade partners?
    description: Calvin and Susie are in the library.  Susie tells him they're supposed to be researching the planet Mercury. Calvin wants to know what they've found out.  Susie replies "nothing".  She has no intention of doing all the work.  Calvin figures she'd probably goof it all up if she did everything.  Calvin wants to be management, with Susie being labor.  He tells her to get some books.  Susie shouts out to see if anyone wants to trade partners.
    characters: [calvin, susie]
  "19880128":
    transcript: What are you doing?! You're doodling! You're sitting here drawing martians when we're supposed to be researching! You haven't done anything yet! Don't you care?? What's the matter with you?! It's no use! We're going to flunk! I'll have to go to a second-rate college because my idiot partner spent the study period drawing martians! Why me? Why me? Why me? Here, this will cheer you up. The martian moves when you flip the pages! Watch, you can see him eat an astronaut!
    description: Susie catches Calvin drawing pictures of Martians instead of doing their paper.  Susie can't believe that Calvin doesn't care.  He's done nothing on the paper.  Susie laments that she'll flunk and have to attend a second-rate college because her idiot partner was drawing Martians.  Susie cries out "Why me".  Calvin tries to make her feel better by showing her that the Martian moves when you flip the pages.
    characters: [calvin, susie]
  "19880129":
    transcript: Look, bird brain, you wasted the entire week in the library. We have to give our report on Monday. You'd better bust your butt over the weekend, or I'm telling the teacher you didn't do any work. Got it? ... well, what do you say?! Am I getting through to you?! This is important! Gronk! Gribble gok! Gak gork! Goonk!! Our hero regards the strange alien. ... it seems to be trying to communicate.
    description: Susie warns Calvin their paper is due on Monday.  He's goofed around all week.  Susie tells him she'll let the teacher know she did all the work if he doesn't do his part over the weekend.  Susie asks if she's getting through to him. Spaceman Spiff says the alien seems to be trying to communicate.
    characters: [calvin, susie, spiff]
  "19880130":
    transcript: Calvin, telephone! Why aren't you at the library?!?
    description: Calvin is out sledding.  He's called to the telephone.  He runs in, takes off his boots, and picks up the phone. Susie yells at him "Why aren't you at the library".
    characters: [calvin, susie]
  "19880131":
    transcript: Planet Bog - pools of toxic chemicals buble under a choking atmosphere of poisonous gases. ... but aside from that it's not much like Earth. We find Spaceman Spiff struggling across the terrain of distant planet! Suddenly the ground begins to shake! A cloud of dust appears on the horizon! It's a Zorg!! Our hero runs for cover, but the Zorg is instantly upon him! Spiff fires his blaster, but the weapon is useless agains the monster! The fearless space explorer is taken to the Zorg's cave, where he discovers a vat of boiling water! Oh no! our hero is about to be cooked alive! Spiff's mind races furiously. Well? Get in. Don't you want to lean way, way over, and test how hot the water is?
    description: Spaceman Spiff walks along the planet's terrain.  The ground begins to shake.  It's a Zorg.  Spiff runs for cover, but the Zorg is upon him.  The blaster has no effect.  Spiff is taken to the Zorg's cave, where there is a vat of boiling water.  He's about to be cooked alive.  Mom tells Calvin to get into the bathtub.  Calvin asks if she doesn't want to lean way, way over and test how hot the water is.
    characters: [calvin, mom, spiff]
  "19880201":
    transcript: We have to give our report on planet Mercury today. Did you do your half? Of course I did. And I'll bet my half makes your half look pathetic. It had better be good ... or else! The planet Mercruy. An exhaustively researched report by Calvin.
    description: Susie reminds Calvin they do their report today.  She asks if he did his half.  Calvin indignantly replies that he did.  He's sure his half will make Susie's half look pathetic.  She warns him "It had better be good...or else".  Calvin sits down and starts to write his report.  He titles it "The Planet Mercury - an exhaustively researched report by Calvin".
    characters: [calvin, susie]
  "19880202":
    transcript: "... and so, the planet Mercury is a hot and barren world, the closest to our sun. And to tell us about the mythology of mercury, here's my partner Calvin. Thank you, thank you! Hey, what a crowd! You look great this morning ... really, I mean that! Go on, give yourselves a hand! You know, a funny thing happened on the way to the library yesterday ... This isn't my fault, Miss Wormwood!"
    description: Susie finishes her part of the report and tells the class Calvin will talk about the mythology of Mercury.  Calvin thanks the crowd, says they look good, tells them to give themselves a hand.  He then tells the class a funny thing happened to him on the way to the library.  Susie yells to Miss Wormwood that this isn't her fault.
    characters: [calvin, susie]
  "19880203":
    transcript: The planet Mercury was named after a roman god with winged feet. Mercury was the god of flowers and bouquets, which is why today he is a registered trademark of FTD florists. Why they named a planet after this guy. I can't imagine. ... um back to you, Susie.
    description: Calvin tells the class the planet Mercury was named after a Roman god with winged feet.  He says Mercury was the god of flowers and bouquets.  That's why he's the registered trademark of FTD florists.  Calvin offers that he has no idea why they named a planet after the guy.  Calvin quickly adds "Back to you, Susie" as he sees her coming toward him with fist cocked.
    characters: [calvin, susie]
  "19880204":
    transcript: Boy, you should've seen the sparks fly when I gave my half of the report. I've never seen Susie so mad. She accused me of not doing my research and claimed I made up the whole thing. Did you? Heck, no. I just took a few creative liberties. And they called your mom over a few creative liberties? Geez, you think Susie was mad.
    description: Calvin tells Hobbes sparks flew when he did his presentation.  Calvin has never seen Susie that mad.  He tells Hobbes she accused him of not doing research and making up the whole thing.  Hobbes asks if that's what he did.  Calvin says he only took a few creative liberties.  Hobbes wonders why Mom was called for a few creative liberties.
    characters: [calvin, hobbes]
  "19880205":
    transcript: Don't you hate it when your boogers freeze?
    description: Calvin goes outside into the cold.  He gets a funny look on his face.  He grabs his nose.  He asks "Don't you hate it when your boogers freeze".
    characters: [calvin]
  "19880206":
    transcript: Here we are, overlooking suicide gulch, about to hurl ourselves down at breakneck speed in a sled that hardly steers! Risking life and limb! Looking at death straight in the eye! Why? You ask! Why do we do it?? Because we get paid, I hope. Because it's there!
    description: Calvin and Hobbes are on their toboggan, overlooking Suicide Gulch, ready to hurl themselves at breakneck speed on a sled that hardly steers.  They're looking death in the eye.  Calvin asks why they do it.  Hobbes offers "because we get paid, I hope".  Calvin says "because it's there".
    characters: [calvin, hobbes]
  "19880207":
    transcript: I'm going outside! I'll be out back if anyone wants me! I'll probably be gone a couple hours! I'm leaving now! I'm going! So long! Se you later! Bye! Stomp stomp stomp. Hey Susie, look! I found dinosaur tracks! Pretty scary, huh? I'll be you didn't know there were dinosaurs in this neighborhood! Especially not dinosaurs with size 5, treaded toes.
    description: Calvin jumps into the snow, stomping out patterns.  When he's finished, he tells Susie he found dinosaur tracks. Calvin says it's pretty scary with dinosaurs in the neighborhood.  Susie walks off saying the dinosaur tracks are made with size five, treaded toes.  Calvin imagines being the dinosaur throwing a snowball at Susie.
    characters: [calvin, susie]
  "19880208":
    transcript: Look, Hobbes, the latest perfection in technology. A water pistol? Heck, no! this is the new improved version of the transmogrifier. Now you can transmogrify things just by pointing at them! Say you don't like the color of your bedspread. Well, you just zap it, and presto, it's an iguana! One can certainly imagine the myriad of uses for a hand-held iguana maker. It doesn't have to be an iguna. It can be anything. Suppose mom's getting on our nerves, for instance.
    description: Calvin shows Hobbes the latest perfection in technology.  Hobbes looks at it and asks "A water pistol".  Calvin tells him it's the new, improved version of the transmogrifier.  Now you just point at whatever you want to transmogrify. Calvin gives an example of not liking the color of your bedspread and presto, it's an iguana.  Hobbes can imagine the myriad of uses of a hand-held iguana maker.
    characters: [calvin, hobbes]
  "19880209":
    transcript: How does the transmogrifier gun know what to transmogrify something into? Telepathy. The gun automatically reads the brain waves you emit, and turns the object into whatever you want. That's amazing. Well, it took me all morning to invent. So say I'm thinking about a big slab of grilled tuna now. Watch where you're pointing that! Watch where you're pointing that!
    description: Hobbes asks how the gun knows what to transmogrify things into.  Calvin replies "telepathy".  The gun reads brain waves and turns the object into whatever you want.  Calvin says it took him all morning to invent.  Hobbes points the gun at Calvin.  He says he's thinking about a big slab or grilled tuna.  Calvin yells for him to watch where he's pointing the gun.
    characters: [calvin, hobbes]
  "19880210":
    transcript: Ok, let's test this transmogrifier gun. I want to be a pterodactyl, so you think of one and point the transmogrifier at me. This will be great. I'll terrorize the neighborhood awhile and then you can transmogrify me back to a boy when the national guard comes. What's a pterodactyl? Some kind of bug? No, no! it's a big flying dinosaur! Don't shoot me if you don't know what it is!!
    description: Calvin wants to test the transmogrifier gun.  He wants Hobbes to think of a pterodactyl.  Calvin says he'll terrorize the neighborhood for awhile.  Then, Hobbes can change him back into a boy when the National Guard comes. Hobbes doesn't know what a pterodactyl is.  Hobbes asks if it's a bug.  Calvin tells him it's a big flying dinosaur, but tells him not to shoot if he doesn't know what it is.
    characters: [calvin, hobbes]
  "19880211":
    transcript: A chicken?? You transmogrified me into a chicken! You were supposed to turn me into a pterodactyl, you nincompoop! All you had to do was think of a pterodactyl! Why did you think of a chicken? It's almost lunchtime. Oh, I see well I'm glad you weren't hungry for a hotdog!
    description: Hobbes changes Calvin into a chicken.  Calvin yells at Hobbes.  He was supposed to change him into a pterodactyl.  Calvin, the chicken, asks why he thought of a chicken instead of a pterodactyl.  Hobbes says it was because it was almost lunchtime.  Calvin continues to badger Hobbes by saying that he's glad Hobbes wasn't hungry for a hot dog.
    characters: [calvin, hobbes]
  "19880212":
    transcript: Here's the transmogrifier gun. Now try again, and do it right. I want to be pterodactyl. Ok, here you go. Well, now that's more like it. Say when did you turn yourself into a 200-foot-tall colossus? I didn't why?
    description: Calvin, the chicken, gives the gun back to Hobbes and tells him to try again.  He says he wants to be a pterodactyl.  ZAP!  Calvin proudly looks at himself.  He says that's more like it.  We see Calvin as a minuscule pterodactyl next to Hobbes.  Calvin asks when Hobbes turned himself into a 200-foot-tall colossus.  Hobbes says he didn't, why?
    characters: [calvin, hobbes]
  "19880213":
    transcript: You transmogrified me into a tiny pterodactyl?? Big dinosaurs give me the willies. You numbskull! How am I goinig to terrorize the neighborhood like this?? My, aren't you the cranky one today? By golly, I'll show you! Ha ha! serves you right! You, my friend just made a big mistake.
    description: Now Calvin complains that he's a tiny pterodactyl.  Hobbes says big dinosaurs give him the willies.  Calvin asks how he's going to terrorize the neighborhood like that.  Hobbes accuses him of being cranky today.  Calvin grabs the gun and says he'll show Hobbes.  ZAP!  Hobbes, the duck, says Calvin just made a big mistake.
    characters: [calvin, hobbes]
  "19880214":
    transcript: There! Now we're both transmogrified. We're even! Even?? We would be even only if turning a tiger into a duck was an improvement. This wasn't at all what I had in mind when I asked you to transmogrify me into a pterodactyl. Pterodactyls are big! So you turned me into a duck. Is that it? Fair's fair. Ok, I'll take the transmogrifier and fix you up right. Zap! Why you gimmie that gun! Thbbt! Zap! An insult! This is worse than before!! Zap! Zap! Zap! Great, just great. Which one of us is Calvin and which is Hobbes, huh? Well I hope Calvin is you, because his mom's going to have a fit when she sees this.
    description: They bicker with each other.  Hobbes grabs the transmogrifier gun and says he'll fix Calvin up right.  ZAP!  He turns Calvin into a big pig.  Outraged, Calvin turns Hobbes into a monkey.  Insulted, Hobbes zaps Calvin into a flower. Hobbes gets zapped into being an alligator.  ZAP!  Calvin is now an aardvark.  Much later, they rest.  Calvin is an owl, and Hobbes is a purple monster.  The owl can't remember who is who.  The purple monster tells him he hopes Calvin is the owl, because his Mom is going to have a fit when she sees this.
    characters: [calvin, hobbes]
  "19880215":
    transcript: Look, I'll transmogrify you back to a tiger if you transmogrify me back to a kid, ok? Ok. Zap! Ahh, that's much better. Now do me. Click ... click ... click. What's wrong?? I'm not transmogrifying! Boy, I'm glad we did me first.
    description: They agree to change each other back to their original selves.  Calvin, the owl, zaps the purple monster back into Hobbes.  Hobbes points the gun at Calvin and....click...click...click.  Calvin says he's not changing.  Hobbes is glad they did him first.
    characters: [calvin, hobbes]
  "19880216":
    transcript: What's wrong with the transmogrifier? Why won't it work?? You invented it. You tell me. Don't tell me I'm stuck as an owl for the rest of my life! I think owls mostly eat mice. I suppose we could catch some in the yard. This is awful! What am I going to do?! Uggh, I could never eat a mouse raw. Their little feet are probably real cold going down. Will you forget the stupid mice and help me think? I wonder if pet stores will sell you a mouse if  you know you're going to eat it?
    description: Calvin wonders why it won't work.  Hobbes says that since Calvin invented it, he should tell Hobbes.  Calvin worries about being stuck as an owl.  Hobbes figures they can catch mice in the back yard for Calvin to eat.  Calvin wonders what he'll do.  Hobbes goes on to say he couldn't eat a mouse raw.  He thinks their little feet are real cold going down.  Calvin yells for Hobbes to forget about the mice and help him think.  Hobbes scratches his head and wonders if a pet store will sell you a mouse if they know you're going to eat it.
    characters: [calvin, hobbes]
  "19880217":
    transcript: Hi, mom, I'm an owl. You don't look like a very happy owl. Nope. I'm not. Maybe some lunch would help. I doubt it. I don't like mice. This is soup. Is it mouse soup? I don't like mice. I heard you. It's tomato.
    description: Calvin trudges into the house and tells Mom that he's an owl.  Mom says he doesn't look like a very happy owl.  Mom suggests maybe some lunch would help.  Calvin doubts it, he doesn't like mice.  Mom gives him some soup.  He asks if it's mouse soup.  He doesn't like mice.  Mom tells him she heard him, and that the soup is tomato.
    characters: [calvin, mom]
  "19880218":
    transcript: What am I going to do Hobbes? I can't be an own forever! How am I going to transmogrify back into a kid when the transmogrifier is broken? Maybe you should just learn to accept this predicament. It's not so bad being an owl instead of a kid. Actually it's probably better. Better?? How? Well I never quite knew how to say this before, but little boys don't smell so good.
    description: Calvin is complaining that he can't be an owl forever.  He asks Hobbes how he'll change back with the transmogrifier gun broken.  Hobbes suggests he should just accept the predicament.  He says it's probably better Calvin is an owl instead of a kid.  Calvin shouts and wonders how it could be better.  Hobbes tells him he didn't know how to bring it up before, but little boys don't smell so good.
    characters: [calvin, hobbes]
  "19880219":
    transcript: I've got to go to school tomorrow morning! What will the kids say if I'm an owl?! Oh, no. I'm doomed! I'm doomed! Since when do owls go to school? Zip-a-dee-doo-dah. My oh my, what a wonderful day!
    description: Calvin is worried about going to school as an owl.  He covers his head with his wings and says he's doomed. Hobbes asks since when do owls go to school.  Calvin thinks and breaks out into a chorus of "Zip-a-dee-doo-dah, zip-a-dee-ay, my oh my, what a wonderful day".
    characters: [calvin, hobbes]
  "19880220":
    transcript: Time to get up, Calvin. You don't want to miss the school bus. I'm not going to school, Mom. I'm an owl. No, you're not. Now get up and get dressed. I'm not an owl? I'm not! I'm me again! The transmogrification must only be temporary! It wore off overnight! I'm a kid! I can ... go to school. Yawwwnnn ... keep the shade down when you go, ok?
    description: Mom tells Calvin to get up from bed.  He's going to be late for school.  Calvin says he's not going to school, since he's an owl.  Mom disagrees and tells Calvin to get dressed.  Calvin sees he's not an owl.  He says the transmogrification must be temporary.  He's back to being a kid.  Hooray!  Except that means, he can go to school.  Hobbes tells him to keep the shade down when he goes.
    characters: [calvin, hobbes, mom]
  "19880221":
    transcript: ""
    description: Calvin is getting dressed to go outside.  He puts his scarf on, his jacket, hat and boots.  Out the door he goes. He stops, comes back in.  He takes off his hat, scarf, jacket and boots.  Into the bathroom he goes.
    characters: [calvin]
  "19880222":
    transcript: Ding dong. I'll get it. Hobbes quick, close the curtains and help me prop furniture against the door! It's Rosalyn!
    description: The doorbell rings, and Calvin comes down the stairs to get it.  He peeks out the window, then turns in horror. He calls for Hobbes to help him close the curtains and prop furniture against the door....it's Rosalyn.
    characters: [calvin, hobbes]
  "19880223":
    transcript: Dad! Dad! Where do you keep your guns? Get out the magnum! I don't have any guns. What's the problem? Rosalyn's here and she won't go away! Why on earth don't you have any guns? Your mom and I are going out. Rosalyn is here to baby-sit. Don't you remember? I told you that this morning? You just don't pay attention. That's why you never know what's going on. How about a wooden stake and a mallet? Do we have that?!
    description: Calvin asks Dad where he keeps his guns.  Dad doesn't have any and wonders what the problem is.  Calvin tells him Rosalyn is there and won't leave.  Dad tells Calvin that he and Mom are going out.  Mom reminds Calvin she told him that morning.  Calvin asks if they have a wooden stake and a mallet.
    characters: [calvin, mom, dad]
  "19880224":
    transcript: Can you believe it, Hobbes? Mom and Dad asked Rosalyn to baby-sit us? There's just one thing to do. We'll mail ourselves to Australia. Climb in. just put us out by the mailbox, Mom. Stop being silly, Calvin. Where's Rosalyn? I thought you said she was here. As far as I know she's still on the front porch why? You didn't let her in?! ding dong.
    description: Calvin grabs a box.  He and Hobbes crawl in and address the box to Australia.  They tell Mom to put them outside by the mailbox.  Mom tells him not to be so silly.  Mom asks where Rosalyn is, since Calvin was saying she was there. Calvin tells Mom that as far as he knows, she's still on the front porch.  Mom yells at Calvin for not even letting her in, as the doorbell rings several times.
    characters: [calvin, hobbes, mom, stuffedhobbes]
  "19880225":
    transcript: Come in, Rosalyn! I'm sorry! We didn't realize Calvin hadn't let you in. That's ok. It wasn't too cold and wet out. We're late, help yourself to anything in the fridge. We'll see you at ten. The door was jammed. Really. I couldn't get it open. Bed.
    description: Mom opens the door and apologizes to Rosalyn.  Rosalyn says it wasn't too wet and cold outside.  Mom and Dad are running late, so they tell Rosalyn to help herself to anything in the fridge.  Dripping wet, Rosalyn looks down at Calvin. Calvin says the door was jammed, and he couldn't get it open.  Rosalyn tells him to go to bed.
    characters: [calvin, mom, dad, rosalyn]
  "19880226":
    transcript: Hey, don't fix that for dinner! Didn't Mom tell you Hobbes and I are on a strict Big Mac diet? It's doctor's orders! Oh, I'd better call your doctor then! Oh, no she called my bluff! The doctor's gonna be furious! Boy, are we going to get ti! We? I'm dialing! Hello, doctor? I'm calling about Calvin's dietary needs. ... at the tone, the time will be 6:27 and 10 seconds. Beep. Bad news, Calvin. Your doctor says you should have a spoonful of castor oil and lie down all evening. He did? Really? No, he didn't. did he? What's castor oil?
    description: Calvin tells Rosalyn that he's on a strict Big Mac diet, doctor's orders.  Rosalyn says she better call the doctor. Calvin is worried that Rosalyn will call the doctor and find he's lying.  Rosalyn pretends to call the doctor's office and asks about Calvin's dietary needs.  Rosalyn tells Calvin the doctor says he should have a spoonful of castor oil and lie down all evening.  Calvin is glad the doctor wasn't angry, but he doesn't know what castor oil is.
    characters: [calvin, hobbes, rosalyn]
  "19880227":
    transcript: Mom doesn't set the table this way. Mom does it a lot better. This food smells funny. This isn't the way Mom fixes it. I like the way Mom does it better. I'm not your mom, all right?!? No kidding! My mom loves me more than life itself, and she lets me do anything I want. Not like you, you nasty ol' barracuda. I can't believe I postponed a date for this.
    description: Calvin complains about the way Rosalyn set the table for dinner.  The food smells funny, and it isn't fixed the way Mom does it.  He likes the way Mom does it better.  Rosalyn yells to Calvin that she's not his Mom.  Calvin says Mom loves him more than life itself.  She lets him do whatever he wants.  Calvin calls Rosalyn a nasty ol' barracuda.  Rosalyn can't believe she postponed a date for this.
    characters: [calvin, rosalyn]
  "19880228":
    transcript: My dad is a big ... hey! I think we'd better get that kid to a psychologist.
    description: Calvin is busily making snowmen in the yard.  Calvin finishes them and leaves.  Mom and Dad go out to the car, only to find three snowmen looking at the broken body of a fourth.  Calvin built them in front on the car, to make it look like the car hit the snowman.
    characters: [calvin, mom, dad]
  "19880229":
    transcript: I'll get it. I think it's for me. Hello? Hi Charlie, thanks for calling. Yeah, this little freaks driving me up the wall ... what? No. Charlie, this is Calvin on the other phone! Listen to me! Your girlfriend's a sadistic kid-hater! Don't ever marry her! She'd be a terrible mother! She, uh oh. Gotta go! After Charlie dumps you, he'll thank me!
    description: The phone rings, and Rosalyn answers it.  It's her boyfriend, Charlie.  She starts telling him Calvin is driving her up the wall.  Calvin gets on the upstairs extension and tells Charlie that Rosalyn is a sadistic kid-hater.  He warns Charlie not to marry her, she'd be a terrible mother.  Calvin, after being sent to bed, yells that after Charlie dumps her, he'll thank Calvin.
    characters: [calvin, rosalyn]
  "19880301":
    transcript: "Rosalyn sent us to bed and it's not even our bedtime yet! We've got to escape. Here's the plan: you start moaning, and when Rosalyn comes in. I'll throw this blanket over her. We'll tie her up and make our getaway, got it? Got it. Mrowryowowwrrr. Rosalyn, come quick! There's something wrong with Hobbes! Right, Calvin. What should I do, call a vet? No, just come up here and close your eyes."
    description: Calvin wants to escape.  He's been sent to bed before Calvin's normal bedtime.  Calvin hatches a plan to have Hobbes moan.  When Rosalyn comes in, he'll throw a blanket over her.  They'll tie her up and make their escape.  Hobbes starts howling.  Calvin yells down to Rosalyn that something is wrong with Hobbes.  She asks if she should call the vet.  Calvin says no, but she should come upstairs and close her eyes.
    characters: [calvin, hobbes, rosalyn]
  "19880302":
    transcript: We're home! Hi, Rosalyn. How was Calvin tonight? Oh, that bad, eh? And a five dollar advance on the next time. Here you are. Good night, thanks again. She's got a real racket going, doesn't she? What do you want to do, stay home ever night until Calvin's eighteen?
    description: Mom and Dad return home.  Mom asks how Calvin was that evening.  Rosalyn is standing with arms crossed and a scowl on her face.  Mom pays Rosalyn and thanks her.  She gives a five dollar advance on the next time.  Dad comments that Rosalyn has a nice racket going.  Mom asks if he'd rather stay home every night until Calvin's eighteen.
    characters: [mom, dad, rosalyn]
  "19880303":
    transcript: Hey, Calvin, guess what we're doing in gym today. We're wrestling! Next period you'll be so covered with mat burns you'll need skin grafts! Ha ha ha! See ya then, twinky. Sighhhh. Physical education is what you learn from having your face in someone's armpit right before lunch.
    description: Moe tells Calvin they're wrestling in gym class.  Moe tells him he'll be so covered in mat burns that he'll need skin grafts.  Calvin sighs and walks away.  He says physical education is what you learn from having your face in someone's armpit right before lunch.
    characters: [calvin, moe]
  "19880304":
    transcript: Kapwinggg! It's Calvin, the human light particle! In the blink of an eye, he's 165,000 miles away! Nothing in the universe is faster than Calvin! I hope!
    description: It's Calvin, the human light particle.  Nothing in the universe is faster than Calvin, he hopes.  Mom chases Calvin, with an angry look on her face.
    characters: [calvin, mom]
  "19880305":
    transcript: Much as I love my Chocolate Frosted Crunchy Sugar Bombs. The best part is after the cereal is gone. That's when you eat all the leftover milk that's all sludgy from the extra sugar you added. Sometimes I eat two or three bows of this. I can hear your heart racing from here. They make this cereal with marshmallow bits, too, but Mom won't buy it for me.
    description: Calvin is eating his "Chocolate Frosted Crunchy Sugar Bombs".  He tells Hobbes that as much as he likes the cereal, he enjoys the sludgy milk from adding sugar more.  He says he sometimes eats two or three bowls of it.  Hobbes tells Calvin he can hear his heart racing from where he stands.  Calvin adds that they make that cereal with marshmallow bits, but Mom won't buy it.
    characters: [calvin, hobbes]
  "19880306":
    transcript: It's freezing upstairs! Can I take some logs up to my room? Hey, you're on my side of the bed. These sheets are freezing! Yeah, well aaughh! Your feet are like ice! Get away from me! But my side's all cold! Well, don't get me cold! Move over. Sure, you've got a fur coat! I'm just wearing pajamas. Quit pulling the blankets, willya? I hardly have any, you hot! Gimmie those! You're letting in cold air! Quit it! Quit it! Serves you right, Mr. Mosty-Toasty! See what it's like being cold! Yaaaah!! Eat feathers, fuzz ball! Move over. You're getting my side all hot. Open the window, I'm roasting.
    description: Calvin can't get to sleep because the sheets are cold.  Calvin bumps into Hobbes, who yells that his feet are like ice.  Calvin says his side of the bed is cold, but Hobbes doesn't want his side cold, too.  Calvin complains that Hobbes has a fur coat.  They fight over the blankets.  Hobbes complains that Calvin is letting cold air in.  Calvin thinks that serves him right. They fight with each other.  Finally, they both lie on top the sheets panting.  Hobbes tells Calvin he's getting his side hot and to move over.  Calvin tells Hobbes to open the window since he's roasting.
    characters: [calvin, hobbes, mom]
  "19880307":
    transcript: Hey, Calvin! Guess what time it is! Why? What time is it? It's a very special time! Oh boy, oh boy! What time is it? Do you really want to know? Yes, yes! Tell me! Tell me! Quick! Please! Yes! It's your bath time! Oh boy! You know how old people always write to Dear Abby, complaining that their kids never write, call or visit? Those letters really crack me up.
    description: Dad tells Calvin to guess what time it is.  He says it's a very special time.  Calvin gets enthused and wants to know what time it is.  Dad tells him it's his bath time.  Sitting in the tub, Calvin tells Hobbes that letters to Dear Abby where kids never write or visit their old parents really crack him up.
    characters: [calvin, hobbes, dad]
  "19880308":
    transcript: I hate being a kid. Somebody's always telling you what to do or what not to do. Do this! Stop that! Day after day. You're lucky you're a tiger. Well, we try to stay humble, but lord knows it's hard. I wonder if I can grow fangs when my baby teeth fall out.
    description: Calvin is in the bathtub talking to Hobbes.  He says he hates being a kid.  Calvin explains that someone is always telling him what to do or what not to do.  He tells Hobbes he's lucky he's a tiger.  Hobbes says they try to be humble, but it's hard.  Calvin wonders if he can grow fangs when his baby teeth fall out.
    characters: [calvin, hobbes]
  "19880309":
    transcript: I wish I was a tiger. A common lament. I've got an idea! You can teach me to be a tiger! I've got some red sleepers I can wear! Hang on! See? We can make a tail by stuffing a knee sock and pinning it on my rear! Then you can draw stripes on my face! Hmm ... what about fur and whiskers? I haven't shaved for six years. I seem to be cursed with a thin beard.
    description: Calvin gets out of the tub complaining that he's not a tiger.  Hobbes tells him that's a common lament.  Calvin wants Hobbes to teach him to be a tiger.  He has some red sleepers he can wear.  Calvin will put a stuffed knee sock on for a tail.  Hobbes asks about fur and whiskers.  Calvin mentions that he hasn't shaved in six years, so he seems cursed with a thin beard.
    characters: [calvin, hobbes]
  "19880310":
    transcript: Gee, I'm getting more like a tiger every minute. Hold still while I draw stripes. How do I look? It's some improvement. Rowrr rrghgh rawrr. I dunno, you're still lacking something tigger-ish. Panache. That's it. Wiat, I've got some plastic vampire fangs I can put in!
    description: Hobbes draws stripes on Calvin.  Hobbes says he's looking better.  Calvin practices a roar.  Hobbes thinks Calvin is missing something tiger-ish, panache.  Calvin runs off to get some plastic vampire fangs.
    characters: [calvin, hobbes]
  "19880311":
    transcript: That's great, Hobbes! I'm a tiger! Well, being a tiger is more than just stripes, you realize. Kind of a zen thing, huh? You have to think like a tiger. Yowwow, I'm hungry! What's for dinner? How's that? Har har. Do you want me to teach you anything or not?
    description: Calvin looks into a mirror and declares himself a tiger.  Hobbes reminds him being a tiger is more than having stripes.  Hobbes tells him he has to think like a tiger.  Calvin hollers that he's hungry and asks what's for dinner.  Hobbes doesn't think that was funny and asks Calvin if he wants Hobbes to teach him anything or not.
    characters: [calvin, hobbes]
  "19880312":
    transcript: Ok, we're tigers. We're out in the wilderness. Teach me how to survive. Let's say we're hiding up in a tree. Our keen tiger eyes and noses detect some prey nearby. What do we do? I suppose it would depend on what kind of prey it was. I don't care pick something. Well, if it's a box of rigatoni noodles, first you would go put on some water ...
    description: As they walk in the woods, Calvin tells Hobbes to teach him to survive.  Calvin gives him a scenario.  They're in a tree, and they detect prey.  What would they do?  Hobbes says it depends on what the prey was.  Calvin tells him to pick something.  Hobbes says that if it was a box of rigatoni noodles, you'd go put on some water.
    characters: [calvin, hobbes]
  "19880313":
    transcript: The late Cretaceous period ... when dinosaurs ruled the Earth! And Calvin ruled the dinosaurs! The terrible Tyrannosaurus sinks it teeth into a triceratops! Triumphant again, the undisputed king of dinosaurs let's out a mighty roar! With savage ferocity, the monster begins it's feast! Limb-severing, bone-crushing, and tendon-snapping, he ... Calvin! That's disgusting! For heaven's sake, slow down and chew quietly! The terrible Tyrannosaurus resumes eating, mortified that someone might see him.
    description: The tyrannosaurus sinks his teeth into the triceratops.  The king of dinosaurs lets out a mighty roar.  The monster begins its feast.  It severs limbs and snaps tendons.  Mom and Dad tell Calvin to chew slower and quieter.  The terrible tyrannosaurus continues eating, mortified that someone might see him.
    characters: [calvin, mom, dad]
  "19880314":
    transcript: Hobbes, you're supposed to be teaching me how to be a tiger. We've been sitting in this dumb tree all morning and you haven't taught me how to hunt or anything! It's instinct. You can't teach that. Well, if you won't help, I'll just go look up tiger in the encyclopedia. As long as we're going in, let's fix some soup and sandwiches, ok? You know what you are? A disgrace, that's what.
    description: Sitting on a tree branch, Calvin tells Hobbes he's supposed to be teaching him how to be a tiger.  They've been sitting in the tree all day, and Hobbes hasn't shown Calvin how to hunt or anything.  Hobbes says it's instinct, which you can't teach.  Calvin suggests looking up "tiger" in the encyclopedia.  Hobbes hops down and says that since they're going inside, they should fix some soup and sandwiches.  Calvin calls Hobbes a disgrace.
    characters: [calvin, hobbes]
  "19880315":
    transcript: This book says tigers are solitary and secretive creatures. True, very true. Secretive? Oh, sure! You wouldn't believe some of the secrets I know. Really? Like what? I can't tell you, they're secrets. You can tell me! I won't blab! Honest! Tell me! Please? Big secrets! Secret secrets! Boy, if you only knew! Mm-mm!
    description: The encyclopedia says tigers are solitary and secretive creatures.  Hobbes tells him he wouldn't believe some of the secrets he knows.  Calvin asks what they are.  Hobbes won't tell, since they're secrets.  Calvin promises not to blab and begs Hobbes to tell him.  Hobbes hints they are big secrets, secret secrets, if only Calvin knew.
    characters: [calvin, hobbes]
  "19880316":
    transcript: I don't believe you even have a secret. That's right, I don't. yes you do! Tell me it! Pleeeze? No! why not? Why can't you tell me? It's about you. Aaahhh! What is it? Tell me! Tell me! I've said too much already.
    description: Calvin doesn't even believe Hobbes has a secret, and Hobbes agrees that he doesn't.  Calvin says that Hobbes really does and again begs Hobbes to tell him.  Calvin asks why Hobbes won't tell him, and Hobbes says the secret is about him.  That just makes things worse as Calvin grabs Hobbes' leg and wails for him to tell the secret.  Hobbes says he's said too much already.
    characters: [calvin, hobbes]
  "19880317":
    transcript: If you won't tell me your secret, I won't be your friend anymore. I'll give you a hint, how's that? Ok! Shoot. The flea market. The flea market? What kind of lousy hint is that? Do you know how your parents got you? I was ... why? What are you saying? No more hints.
