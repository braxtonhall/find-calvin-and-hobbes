  "19880423":
    transcript: I hate this model. Nothing fit right, the instructures were incomprehensible, the decals ripped, the paint slopped, and the glue got everywhere. What a disaster. Six bucks completely down the drain. I can't think of an afternoon I've enjoyed less. What a waste. What a dumb hobby. Of course, with this for practice, I'll bet we could do great on ANOTHER model! Let's get one of those clipper ships with all the riggings.
