  "19880321":
    transcript: My side of the woods is abound in natural scenic splendor. Your side wallows in decay and filth. My territory is infinitely superior to yours. Your side is smaller. Hey!
    description: Calvin brags that his side of the woods abounds with natural scenic splendor.  He says Hobbes' side wallows in decay and filth.  Again, he proclaims his side superior to Hobbes'.  Hobbes rolls the big rock over once and tells Calvin that his side is now smaller.  Calvin protests.
