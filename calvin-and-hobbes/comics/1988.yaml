  "19880613":
    transcript: Hey look! Mom and Dad are throwing duffel bags in the car. They're going on vacation! At last! Finally we get the house to ourselves! We can stay up late and watch TV! We can eat cookies for dinner! We ... What are you doing up here still? C'mon, let's go. Me? Go? Where? On vacation! What have we been planning all month? With you and Mom?? What kind of vacation is THAT?!
