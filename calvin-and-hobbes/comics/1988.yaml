  "19880506":
    transcript: Wow! I can't believe we found a dinosaur skull on our very first archealogical dig. It's completely intact, too! What a discovery! Maybe the rest of the skeleton is nearby! Yeah! If we can find the whole thing, we'll be world famous! With the grant money we'll get, we can buy a Porsche! How will THIS look on the cover of National Geographic?
