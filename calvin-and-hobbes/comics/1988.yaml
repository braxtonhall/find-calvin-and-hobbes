  "19880530":
    transcript: Don't move! There's a bee on your back! There is? Showw it away! Quick! And have it come after ME? No, thanks. Well, what am I supposed to do? Stand like this all day? I guess you don't have much choice. Do you? Great. Just great. I could be here forever! Say, that gives me an idea. Don't you go reading my comic books! Stay out of my room!
