  "19880518":
    transcript: How much money do you have, hobbes? Maybe we can buy Dad a new pair of binoculars before he gets home. I've got thrity ... no, thirty-five cents. Great. I've got four dollars. Let's call the store. Hello? I'd like to know how much a good pair of binoculars costs. ONE TO SIX HUNDRED DOLLARS?! DO YOU HAVE ANY IDEA WHAT MY DAD'S GOING TO DO TO ME?!? He won't stop at killing you, that's for sure. Uh UH.
