  "19880404":
    transcript: Ahh! Lunch, my favorite meal! And today's lunch is extra special! Ever since the weather got warm I've been swatting flies and saving them in a jar. Finally I got enough bugs to mash them into a gooey paste with a spoon. I'll call it bug butter. Care for a taste? Tell me, Calvin. Do you have any friends at all?
    description: Calvin and Susie are at the cafeteria table.  Calvin tells her his lunch is extra special.  He explains he's been swatting flies and putting them in a jar.  He got enough to mash them into a gooey paste with a spoon.  He calls it "bug butter" and offers Susie a taste.  Susie looks at Calvin and asks if he has any friends at all.
    characters: [calvin, susie]
  "19880405":
    transcript: Ok, you've all read the chapter, so who can tell me what's important about the battle of Lexington? Anyone? Calvin, how about you? Hard to say, ma'am. I think my cerebellum just fused.
    description: Miss Wormwood asks the class what the importance of the Battle of Lexington is.  Calvin is sitting at his desk when Miss Wormwood asks for anyone to answer.  She calls on Calvin, who is shocked and horrified.  His hair stands on end, and his eyes bulge.  He replies that it's hard to say.  He thinks his cerebellum just fused.
