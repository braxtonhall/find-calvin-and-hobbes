  "19880327":
    transcript: A red spaceship? On the monitor, your vileness. It's that infernal Spaceman Spiff! Open fire! Spaceman Spiff is hit! He aims for planet Mok, hoping to find a reputable body shop. We join our hero after a crash landing on the hostile planet Mok. Ominous figures appear in the horizon. The daring Spaceman Spiff lays waste with his death ray zorcher, but he is hopelessly outnumbered! Surrounded, our hero is taken prisoner, and carried to a subterranean dungeon! Still, won't talk, eh, Spiff? We'll see about that! You'll never get anything from me, space squid! You had your chance, earthling! Take him to the interrogation room and wash his hair! Aaugh! You got soap in my eyes on purpose! Sinister fiend! If you'd stop thrashing around, maybe it wouldn't happen!
    description: Spaceman Spiff crash lands on the planet Mok.  Ominous figures appear on the horizon.  He fires his death ray zorcher, but he's outnumbered.  He's taken prisoner and taken to a dungeon.  Spiff won't talk to the creatures.  One of them orders Spiff taken to the interrogation room and to have his hair washed.  Mom is trying to bathe Calvin.  He tells the sinister fiend she got soap in his eyes on purpose.  Mom replies it might not happen if he'd stop thrashing around.
