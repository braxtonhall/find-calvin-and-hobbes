    transcript: Calvin wakes up staring into the eyes of a big frog. Seeing Calvin awake, the frog scrambles down and forces open Calvin's mouth! Calvin tries to fight, but the slippery amphibian instantly slides in and is swallowed! How disgusting! I don't feel good. You sound awful. You've got a frog in your throat.
