  "19880401":
    transcript: Why do you suppose we're here? Because we walked here. No, no. I mean here on Earth. Because Earth can support life. No, I mean why are we anywhere? Why do we exist? Because we were born. Forget it. I will, thank you.
    description: Sitting under a tree, Calvin asks Hobbes why they're here.  Hobbes replies that they walked there.  Calvin is referring to why they are on earth.  Hobbes tells him because earth can support life.  Calvin tries to clarify.  He wonders why they even exist.  Hobbes says because they were born.  Calvin gives up and tells Hobbes to forget it.
    characters: [calvin, hobbes]
  "19880402":
    transcript: Saturday is the best day of the week. No demands at all! Perfect freedom! The whole day stretches before us with unlimited opportunity! And what better way to appreciate that opportunity than by squandering it watching cartoons all day!
    description: Calvin says Saturday is the best day of the week.  There are no demands, he says.  He and Hobbes go to the sofa.  The day stretches before him with unlimited opportunity.  What better way to appreciate that opportunity than squandering it by watching cartoons all day.
    characters: [calvin, hobbes]
  "19880403":
    transcript: Will you get me a glass of water? You just had one. I want one to keep by the bed, so I can douse this guy if he starts snoring. Good night, Calvin. Hee hee hee. Oh, great he's dreaming again. Sniff. Where do you think you are, you imbecile? Out in the jungle? Mm ... heh heh. If he starts running he's gonna get a pillow in the kisser. Sniff. Hey! Where are you going? Somnambulists give me the creeps. Why are we going to the kitchen? Calvin! What are you doing? Have you been sleepwalking? I was completely awake! It's this dope who's sleepwalking! I just followed him. I put him back to bed, he couldn't give any reason for being up. Do you suppose it means anything? Look, he got out all the tuna!
    description: Hobbes is giggling in his sleep.  Calvin wakes up and notices Hobbes is dreaming.  Hobbes sniffs, and Calvin wonders if Hobbes thinks he's in the jungle.  Calvin is prepared to smack Hobbes with a pillow.  Hobbes crawls out of bed and heads downstairs.  Calvin follows him and wonders why they're going to the kitchen.  Dad turns on the light and asks if Calvin was sleepwalking. Calvin says he was wide awake, but Hobbes is the dope who's sleepwalking.  Dad explains to Mom that he put Calvin back to bed, and he had no reason for being up.  Mom notices that he had gotten out all the tuna in the house.
