  "19880731":
    transcript: Wow! How did you ever get so muddy? Well, I was just standing there, minding my own business, when all of a sudden, a horde of dirty cannibals comes ... forget it. Boy, what a delightful afternoon. Sometimes I feel like I work all the time to afford this place, and I never get to sit back with a good book and enjoy it. Well, at least I have the weekends to ... CALVIN! YOU GOT MUD ALL OVER THE HOUSE! LOOK AT YOU! AIEE - THE COUCH! WHAT'D YOU DO?! DID YOU WALK ACROSS THE COUCH?! I DIDN'T DO IT! SOMEONE ELSE MUST HAVE! I JUST SAW A MUDDY GUY GO RUNNING FROM ... OUT! OUT OF THE HOUSE NOW! OK, OK! I'M GOING!  YOU DON'T NEED TO PUSH! I CAN TELL WHEN I'M NOT WANTED! HEY! LEGGO! OW! ALL RIGHT, GOODBYE! Hey, Dad, catch the water balloon! Great reflexes, Dad. By the way, don't go in the house like that. Mom's in one of her moods again. I'll bet I could get a lot of work done at office on weekends.
