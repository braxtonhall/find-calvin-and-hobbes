  "19880322":
    transcript: I'm hungry. Well, you can't catch anything in my territory. That's what the book says. What do tigers eat in the wild anyway? They catch big gross caterpillars like that one. Ewww. It's got little spikes all over him. Tigers really eat these? By the truckload. They're great. Let me see the book. Who are you going to believe, some silly writer or a real tiger?
    description: Calvin says that he's hungry, but Hobbes says he can't catch anything in his territory.  Calvin wonders what tigers eat in the wild.  Hobbes tells him big caterpillars.  Calvin asks whether tigers really eat them, and Hobbes tells him they eat them by the truckload.  Calvin asks to see the book, but Hobbes asks if he's going to believe a silly writer or a real tiger.
    characters: [calvin, hobbes]
  "19880323":
    transcript: So far, I haven't had much fun as a tiger. I thought we'd be romping around the woods like we always do, but it turns out tigers don't share their territories with other tigers! So here we are, sitting on opposite sides of a big rock. What a blast. Being a tiger just isn't all it's cracked up to be. That's not the half of it. It says here we're an endangered species!
    description: Calvin hasn't had much fun being a tiger.  He thought they'd romp through the woods like they always do, but the book says tigers don't share their territories with other tigers.  So they sit, on opposite sides of a big rock.  Calvin says being a tiger isn't all its cracked up to be.  Hobbes says Calvin doesn't know the half of it.  He tells Calvin that tigers are an endangered species.
    characters: [calvin, hobbes]
  "19880324":
    transcript: We're endangered? It says tigers nearly faced extinction and their future remains in doubt. That's awful. I'll say. No offense, but I think I'll go back to being a kid again. This explains why I don't meet many babes.
    description: Hobbes reads that tigers nearly faced extinction, and their future remains in doubt.  Calvin says that's awful, and Hobbes agrees.  They both think for a bit.  Calvin says he thinks he'll go back to being a kid again.  Hobbes says this explains why he doesn't meet many babes.
