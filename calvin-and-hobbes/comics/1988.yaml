  "19880421":
    transcript: Nuts! This wheel strut snapped. Why do they make 'em so darn small? I guess that was an optional piece. My wheel won't fit in the wheel well. Here, let me try. Sometimes you just have to ... SNAP Darn it! This plane is in for some rough landings.
