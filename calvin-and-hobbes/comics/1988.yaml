  "19880407":
    transcript: Why does the sun set? It's because hot air rises. The sun's hot in the middle of the day, so it rises high in the sky. In the evening then, it cools down and sets. Why does it go from east to west? Solar wind. Dear!
    description: Calvin asks Dad why the sun sets.  Dad explains that hot air rises, so the sun rises in the middle of the day.  In the evening, it cools down and sets.  Calvin asks why it goes from east to west.  Dad replies "solar wind".  Mom yells at Dad.
    characters: [calvin, mom, dad]
  "19880408":
    transcript: I'm thinking of a number between one and seven hundred billion. Try to guess it. Eleven? Nope. guess again. Six million and four. Nope. Guess again. What's the matter, don't you like games??
    description: Calvin asks Hobbes to guess the number he's thinking of.  It's between one and seven hundred billion.  Hobbes guesses eleven.  Calvin tells him to guess again.  This time he tries six million and four.  Wrong again.  When Calvin tells him to guess again, Hobbes leaves.  Calvin yells after him, "Don't you like games".
    characters: [calvin, hobbes]
  "19880409":
    transcript: Do you believe our destinies are determined by the stars? Nah. Oh, I do. Really? How come? Life's a lot more fun when you're not responsible for your actions.
    description: Calvin asks Hobbes if he believes destinies are determined by the stars.  Hobbes doesn't, but Calvin does. When asked why, Calvin replies that life is more fun when you're not responsible for your actions.
    characters: [calvin, hobbes]
  "19880410":
    transcript: Despite that amazing display of cunning, reflex and physical prowess, your tail still has a death grip on your butt. Could you stop the room, please? I'd like to get off.
    description: Hobbes is sleeping.  As he awakens, he notices his tail twitching.  He gets ready to pounce on it.  He leaps. Around and around Hobbes goes trying to catch his tail.  Exhausted, Hobbes lies on his back.  Calvin tells him that despite his display of cunning, reflex and physical prowess, his tail still has a death grip on his butt.  Head spinning, Hobbes asks Calvin to stop the room, he'd like to get off.
    characters: [calvin, hobbes]
  "19880411":
    transcript: Your polls, dad. You dropped another five points. It seems that although your recognition factor is high, the scandals of your administration continue to haunt you. Scandals? What scandals? Bedtimegate and homeworkgate come readily to mind. Instances of true leadership. History will vindicate me. I wonder what my new dad will look like.
    description: Calvin tells Dad his poll results are down again.  Calvin explains that though his recognition factor is high, scandals continue to haunt him.  Dad wonders what scandals Calvin is talking about.  Bedtimegate and Homeworkgate are mentioned.  Dad isn't worried.  He calls them instances of true leadership.  History will vindicate him.  Calvin isn't so sure and wonders what his new Dad will look like.
    characters: [calvin, dad]
  "19880412":
    transcript: You'll be glad to know I've analyzed your poor showing in the polls. I'll  bet. See, your record in office is miserable and the character issue is killing you. Your basic approval rating among six-year-olds hardly registers. If anyone ever needed a slick ad campaign, it's you. Let me guess what you have in mind. The new Dad, I call it.
    description: Calvin has analyzed Dad's poor poll showing.  Calvin says Dad's record in office is terrible, and the character issue is killing him.  Dad's approval rating among six-year-olds barely registers.  Calvin says Dad needs a slick ad campaign. Calvin calls it "The New Dad".
