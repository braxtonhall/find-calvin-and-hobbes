  "19880318":
    transcript: I don't believe your dumb ol' secret about my parents getting me at a flea market. It's true. It is not, and if all your secrets are lies, you can just keep them to yourself. You just don't want to hear how little you went for. Oh, hush up. This book also says tigers won't share their territory with other tigers. I can see how other tigers would get on one's nerves. A nickel. That's how much you cost.
