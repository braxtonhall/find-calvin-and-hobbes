  "19880414":
    transcript: If you want to stay Dad, you've got to polish your image. My image. Right, see, now everyone think your insensitive to the legitimate needs of minors. A few magnanimous gestures while in office now might be in order. If your mind's gone blank, I have some suggestions. Oh, the suspense. For example, you might repeal mandatory school attendance. That alone could rocket you to victory.
    description: Calvin tells Dad he has to polish his image.  Calvin suggests a few magnanimous gestures might be in order.  He has some suggestions.  Dad can't wait to hear them.  Calvin poses repeal of mandatory school attendance.  He says that alone could rocket Dad to victory.
