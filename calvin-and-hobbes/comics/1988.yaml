  "19880430":
    transcript: How can you stand these cartoons? They're just half-hour commercials for toys. And when they're not boring, they're preachy. And these characters don't even MOVE. They just stand around blinking! What kind of cartoon is THAT? Meet my Dad, the Gene Siskel of Saturday morning TV.
