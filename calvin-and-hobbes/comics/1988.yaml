  "19880529":
    transcript: Filth! Contamination! Pestilence! Ha ha ha! Of all living creatures, few are more repulsive than Calvin the bug! He exists only to suck blood and transmit parasitic disease! Searching for someone to infect, Calvin flies low over the picnic table! His sensitive antennae pick up the scent of human flesh! Touching down, Calvin inserts his needlelike proboscis into a vein! Protozoans in his salive quickly induce plague! Will you stop that awful slurping?! You're making me sick!
