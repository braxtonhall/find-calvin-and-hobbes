  "19880413":
    transcript: I think the image we need to create for you is repentant, but learning. You know, show some humility, and present yourself as a regular guy trying to learn the ropes of a difficult job. Difficult doesn't begin to describe it. I worked up some slogans. See what you think. Dad-gradually he catches on. Vote Dad! This time, he'll do better. To forgive is divine - vote Dad in '88. I get the idea, Calvin.
    description: Calvin wants to create a "repentant, but learning" image.  Calvin tells him to present himself as a regular guy learning the ropes of a difficult job.  Dad thinks difficult doesn't begin to describe it.  Calvin offers some slogans.  "Dad - Gradually, he catches on" and "Vote Dad! This time he'll do better" are offered.  Dad gets the idea.
