  "19880509":
    transcript: Gosh, look at all the dinosaur bones we discovered. Let's glue them together so we can see how they fit. Then you can draw a reconstruction of the actual dinosaur. After that, we'll write up our findings, and get them published in a scientific journal. Then we'll win the Nobel prize, get righ, and go on talk shows. What about babes? When do we get those?
