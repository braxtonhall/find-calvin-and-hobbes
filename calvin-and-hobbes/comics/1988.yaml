  "19880504":
    transcript: Archeologists dig slowly and carefully, using small, delicate tools. Each rock has to be painstakingly brushed and scraped so nothing is broken or missed. DIG DIG SCRAPE SCRAPE BRUSH BRUSH Archeologists have the most mind-numbing job on the planet. I don't think your Dad will want to shave with this tomorrow.
