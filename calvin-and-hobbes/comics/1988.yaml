    transcript: Everything floats randomly in the romm! There's no gravity! Calvin pushes off the ceiling at a sharp angle, aiming for the hallway! He glides with unchecked momentum, turning himself to be able to push off the next stationary surface. C'mon, you! Outside! You're really bouncing off the walls today. Aw, Mom!
    description: Calvin floats around the room.  There is no gravity.  Calvin pushes off the ceiling and aims for the hallway.  He glides with unchecked momentum.  He turns himself so he can push off the next stationary surface.  Mom scoots Calvin outside.  She says he's really bouncing off the walls today.
    characters: [calvin, mom]
  "19880823":
    transcript: Extra pants... Three shirts, two seaters, two sweatshirts... Another pair of pants... Still trying to learn to ride that bicycle, eh? I don't need any comments from you.
    description: Calvin puts on extra pants, three shirts, two sweaters, two sweatshirts, and another pair of pants.  He waddles toward the door.  Hobbes asks if he's still trying to learn to ride his bicycle.  Calvin says he doesn't need any comments from Hobbes.
    characters: [calvin, hobbes]
  "19880824":
    transcript: A shadow falls over the large city skyscrapers! It's a gigantic ant! With one footstep, it pulverizes the entire downtown! Millions die instantly! The ant brushes the city off the map! People flood the streets in panic, only to be smashed in the horrible wreckage! Well... maybe I won't...
    description: A shadow falls over the city's skyscrapers.  It's a gigantic ant.  One step pulverizes downtown.  Millions die instantly.  The ant brushes the city off the map.  People flood to the streets in panic, only to be smashed in the wreckage. Calvin has his foot above an ant hill, ready to smash it.  He decides maybe he won't.
    characters: [calvin]
  "19880825":
    transcript: What are you doing, Susie? Drawing on the sidewalk. Wow! Can I too? Sure. Here's some chalk. Gosh, I've never been a vandal before! This isn't vandalism. It washes right off!
    description: Calvin asks Susie what she's doing.  She's drawing on the sidewalk.  Calvin asks if he can join in.  Susie hands him some chalk.  Calvin starts drawing.  He says he's never been a vandal before.  Susie tells him this isn't vandalism.  The chalk washes right off.  Calvin flips the chalk down and walks off.
    characters: [calvin, susie]
  "19880826":
    transcript: OK, I feel one coming. Are you ready? Ready. ACHOOO POOF Did you get it? Yep! See, here it comes. Boy, that's a good one! Why can't my school portraits ever look like this?
    description: Calvin feels one coming.  He tells Hobbes to get ready.  As he sneezes, Hobbes shoots the picture.  Calvin asks if he got it.  Hobbes shows him the picture.  Calvin has his mouth open, sneezing.  Calvin wonders why his school pictures can't look like that.
    characters: [calvin, hobbes]
  "19880827":
    transcript: Don't come in here! Why not? I'm roasting. You'll get hair in the water. Go do something else. HEY! Stop that! HEY! HEY! You think you've won, huh? Well, I'm not even going to TELL you what I did. ACKPTH!
    description: Calvin is in the toy pool.  He tells Hobbes not to get in.  Hobbes is roasting.  Calvin tells him he'll get hair in the water.  Hobbes deliberately rubs some hair into the pool.  Calvin yells for him to stop that.  Calvin gets out of the pool. Hobbes climbs in.  With an evil look on his face, Calvin asks Hobbes if he thinks he won.  He says he's not even going to tell Hobbes what he did in the pool.  Hobbes gets a horrified look.
    characters: [calvin, hobbes]
  "19880828":
    transcript: Well, summer is almost over, it sure went quick, didn't it? Yep. There's never enough time to do all the nothing you want.
    description: Calvin and Hobbes are riding the wagon down the hill.  Hobbes says summer is almost over, and it went by quickly.  Calvin says there is never enough time to do all the nothing you want.
    characters: [calvin, hobbes]
  "19880829":
    transcript: TRIP BAP WHACK BAP
    description: Calvin trips over a rock and falls face first to the ground.  He gets up angrily, and he kicks the rock.  He starts to walk off.  The rock hits something and bounces back, hitting Calvin in the head, knocking him face first to the ground.
    characters: [calvin]
  "19880830":
    transcript: I'm hungry. Too bad. Breakfast isn't until tomorrow. My tummy's growling. Hush. Most people don't sleep well next to a hungry tiger. Sometimes I sure wish I had a dog. More tuna and less mayonnaise.
    description: Calvin and Hobbes are in bed.  Hobbes is hungry.  Calvin tells him breakfast isn't until tomorrow.  Hobbes' stomach is growling.  Calvin tells him to be quiet.  Hobbes reminds him most people don't sleep well next to a hungry tiger. Calvin's eyes open.  In the kitchen, he's making Hobbes a sandwich.  He says sometimes he wishes he had a dog.  Hobbes tells him more tuna and less mayonnaise.
    characters: [calvin, hobbes]
  "19880831":
    transcript: Oh, no! There's a tyrannosaurus in the grocery store! The dinosaur heads for the meat department and devours the butcher! Shoppers everywhere flee for their lives! It's mayhem, destruction and carnage, in the aisles! Oh, no! Calvin, can't I take you ANYWHERE?! Now the tyrannosaurus wants cookies!
    description: There's a tyrannosaurus in the grocery store.  It heads for the meat department and devours the butcher. Shoppers flee for their lives.  It's mayhem, destruction, and carnage in the aisles.  Mom sees Calvin has knocked cans off the grocery shelves.  She asks if she can't take him anywhere.  Calvin, arms out and teeth bared, now wants cookies.
    characters: [calvin, mom]
  "19880901":
    transcript: Planet Calvin moves across the solar system. Nobody notices until his orbit takes him directly between the sun and earth. Calvin causes a total solar eclipse! Earch is shrouded in darknes. How long will Calvin stay there? Could you move, please? You're in my light. HA HA HAAA!
    description: Planet Calvin moves across the solar system. Nobody notices him until his orbit takes him between the sun and the earth.  He causes a solar eclipse.  The earth is in darkness.  How long will Calvin stay there?  Mom is trying to read a book, and Calvin is standing on the back of the sofa blocking light from the lamp.
    characters: [calvin, mom]
  "19880902":
    transcript: Election day is coming up. Have you decided on a running mate? Sure. You can't be elected Dad without a MOM, right? Are you going to keep the Mom I've had, or get a NEW running mate? Gee... Bedtime, Calvin. Of course I'll stick with your Mom. Aww.
    description: Calvin reminds Dad Election Day is coming and asks if he's chosen a running mate.  Dad asks what he means. Calvin informs him you can't be elected Dad without a Mom.  Calvin asks if he's going to keep the Mom Calvin's had or get a new running mate.  Dad smiles and thinks.  Mom comes up and makes a fist.  Dad says of course he'll stick with Calvin's Mom.
    characters: [calvin, mom, dad]
  "19880903":
    transcript: I think rituals are important. MY favorite ritual is eating three bowls of "chocolate frosted sugar bombs" and watching TV cartoons all Saturday morning. After a few hourse, I'm so overstimulated I can't sit still or even think straight. Sort of a transcendental experience, huh? Yeah. I achieve a lower consciousness.
    description: Calvin tells Hobbes that rituals are important.  He says his favorite ritual is eating three bowls of "Chocolate Frosted Sugar Bombs" and watching TV cartoons all Saturday morning.  He says after a few hours, he's so overstimulated he can't sit still or think straight.  Hobbes says it's like a transcendental experience.  Calvin says he achieves a lower consciousness.
    characters: [calvin, hobbes]
  "19880904":
    transcript: Can I have a different plate, Mom? Why? Somebody puked on mine. Just eat your dinner and keep quiet, OK, Calvin? EWWWW MMF! HOOPA ARGH! FLIP FLOP BLAHHHHHHH TWITCH TWITCH Oh, knock it off, Calvin, it's hamburger casserole. There's not a thing in there you don't like. This is HAMBURGER? Chew Chew Hmm... This bit wasn't so bad, for some reason. I was able to choke it down, anyway. My stomach is still cramping up, but the pains aren't as sharp any more. The secret is to suppress the gag reflex. After I swallow it, I can stand it. Good I'm glad this is such a hit.
    description: Calvin gives his dinner a funny look.  He plugs his nose and takes a bite.  He turns green, purple, blue, orange and yellow as he flops around on the ground, acting as if he's choking.  Mom sits him back in his chair and tells him it's hamburger casserole.  She tells him there isn't anything in it he doesn't like.  He takes another bite.  He says that bite wasn't so bad.  He was able to choke it down.  He says his stomach pains aren't as bad.  He says the secret is suppressing the gag reflex.  Once he swallows it, he can stand it.  Mom sits at the table saying she's glad the meal is such a hit.
    characters: [calvin, mom]
  "19880905":
    transcript: All right, all right! I'm GOING! Hey! Leggo! I can walk myself! I just have to... OK! Look, I'm going! I'm going! Sure, you think school's great NOW. But in a couple of hourse you'll MISS me! You'll see!
    description: From inside the house, we hear "All right, I'm going".  Then, "I can walk myself. OK, I'm going".  Calvin is tossed out the door.  Calvin yells back to the house that you think school's great now, but in a couple of hours you'll miss him.
    characters: [calvin, mom]
  "19880906":
    transcript: There goes Calvin off to school. He sure put up a fuss. Well, he'll have fun once he gets there. See, he's even running now. He's all excited about... HEY! CALVIN. THE BUS STOP IS THAT WAY! COME BACK HERE!
    description: Mom looks out the window.  She's in her robe, holding a cup of coffee.  She is thinking that Calvin put up a fuss.  She thinks he'll have fun as soon as he gets there.  She sees Calvin running and thinks he's getting excited.  Then she realizes, and she opens the door and yells.  Calvin is running away from the bus stop.  She yells for him to get back there.
    characters: [mom]
  "19880907":
    transcript: I can't believe I'm here waiting to go to school. What happened to summer? Gosh, I couldn't WAIT for today! Soon we'll be making new friends, learning all sorts of important things, and... What's the matter with YOU?? Your bangs do a good job of covering up the lobotomy stitches.
    description: Calvin is waiting for the bus with Susie.  He wonders what happened to summer.  He can't believe it's time for school again.  Susie says she couldn't wait for this day.  They'll meet new friends, learn all sorts of important things.  Calvin looks at her.  When she asks what he's looking at, he tells her that her bangs do a good job of covering up the lobotomy stitches.
    characters: [calvin, susie]
  "19880908":
    transcript: I pledge allegiance... to Queen Fragg... and her mighty state of hysteria... It's going to be a long year.
    description: Calvin has his hand over his heart reciting the Pledge of Allegiance.  He pledges allegiance to "Queen Fragg...and her mighty state of Hysteria".  Miss Wormwood drags him down the hall to the principal's office.  Calvin says it's going to be a long year.
    characters: [calvin, wormwood]
  "19880909":
    transcript: Hey, Calvin, you're on my swing. Get lost. I'm not scared of you, Moe. Oh no? Nope. You're so dumb you probably never thought about how a sparrow's smaller size and maneuverability is an advantage in fighting off big crows. Yeah? Those TV nature programs will be the death of me yet.
    description: Calvin is sitting on a swing when Moe comes up to him.  Moe tells Calvin to get off his swing.  Calvin replies he's not afraid of Moe.  He explains to Moe that he's so dumb that he's never thought about how a sparrow's smaller size and greater maneuverability is an advantage in fighting off big crows.  Moe punches Calvin off the swing.  Calvin, crumpled on the ground, says those TV nature programs will be the death of him yet.
    characters: [calvin, moe]
  "19880910":
    transcript: Yes, Calvin? May I be excused, please? Again? I have to go. Bad. All right. Thank you. What are YOU doing home?! I had to go.
    description: Calvin asks Miss Wormwood if he could be excused.  He says he has to go, bad.  Miss Wormwood lets him go.  Mom opens the door and asks Calvin what he's doing home.  Calvin tells her he had to go.
    characters: [calvin, mom, wormwood]
  "19880911":
    transcript: School's out! Free at last! And just six precious hours before bed to forget everything I learned today. I hate coming home from school. I never know if Hobbes is waiting to pounce on me. Maybe I can stand off to the side here, and push the door open with a stick. I'm home! What do you do, wait until you see the whites of my eyes?!? Boy, you should've seen them! They were as big as dinner plates! Hoo hoo hoo!
    description: Calvin stops at his front door worried about Hobbes pouncing on him.  He pushes the door open with a stick. He says he's home.  Nothing happens.  He peeks in, and Hobbes crashes into him.  Calvin asks if he waits until he sees the whites of his eyes.  Hobbes, laughing, says he should have seen them.  They were as big as dinner plates.
    characters: [calvin, hobbes]
  "19880912":
    transcript: Have you been reading the papers? Grown-ups really have the world fouled up. Acid rain, toxic wastes, holes in the ozone, sewage in the oceans, and on and on! The only bright side to all this is that eventually there may not be a piece of the planet worth fighting over.
    description: Calvin asks Hobbes if he's read the papers lately.  He says grown-ups really have fouled the world up.  Acid rain, toxic waste, holes in the ozone, sewage in the ocean, on and on.  They walk a little further, and Calvin says the only bright side is that eventually there may not be a piece of the planet worth fighting for.
    characters: [calvin, hobbes]
  "19880913":
    transcript: You're packing? Yep. Get your toothbrush, Hobbes, we're outta here. It's an outrage how grown-ups have polluted the earth! I refuse to inherit a spoiled plant! I'm LEAVING! Really? Where to?? You know, sometimes you're a real load to have around. I was just ASKING!
    description: Calvin packs his suitcase.  He says it's outrageous how grown-ups have polluted the earth.  He refuses to inherit a spoiled planet.  He's leaving. Hobbes asks him "Where to".  Calvin stops, puzzled.  He tells Hobbes sometimes he's a real load to have around.
    characters: [calvin, hobbes]
  "19880914":
    transcript: How about Mars? We could go there to avoid Earth's pollution. Yeah! If we go NOW, we can claim it and keep everyone else off it. OK, it's settled. Mars it is. You finish packing. I'll go get the wagon. We're going in the wagon? Of course! What did YOU want to do? Flap your arms? I guess I hadn't thought about that part. Obviously.
    description: Hobbes suggests they could go to Mars to avoid Earth's pollution.  Calvin figures if they go now, they can claim it and keep everyone else off it.  Calvin goes off to get their wagon.  Hobbes asks if they're going in the wagon.  Calvin says of course, unless he wanted to flap his arms.  Hobbes scratches his head and says he hadn't thought about that part. Calvin walks off saying "Obviously".
    characters: [calvin, hobbes]
  "19880915":
    transcript: So long, Mom. Hobbes and I are going to Mars to live. Earth is too polluted. Have a good time. Say goodbye to Dad for us. If I can find an interplanetary post offce, I'll write to you once in a while and ... Calvin, don't stand there with the door open. You're letting in the bugs. Either stay in or go outside. She didn't seem to choked up about us going, did she? We should've left a long time ago.
    description: Calvin says goodbye to Mom.  He's going to live on Mars, since Earth is too polluted.  She tells him goodbye. Calvin stands by the open back door and tells her to say goodbye to Dad.  If he can find an interplanetary post office, he'll write once in a while.  Mom tells him he's letting in bugs.  Either stay in or go outside.  Hobbes tells Calvin she didn't see too choked up about them going.  Calvin adds they should have left a long time ago.
    characters: [calvin, hobbes, mom, stuffedhobbes]
  "19880916":
    transcript: BLAST OFF! Do you really think we'll get enough lift to break Earth's gravity? Of course! You think I didn't plan this out?! I thought of everything. Did you think of what you'll eat on our trip? Packing was YOUR job! Didn't you pack us any FOOD?? I packed food for ME...
    description: Calvin and Hobbes are going down the hill in their wagon.  Hobbes asks if they'll get enough lift to break the earth's gravity.  Calvin tells him yes, he's thought of everything.  Hobbes asks what they'll eat on this trip.  As the wagon flies off the ramp they built, Calvin tells Hobbes it was his job to pack food.  Hobbes says he packed food for him.
    characters: [calvin, hobbes]
  "19880917":
    transcript: We did it! We cleared Earth's orbit! Mars, here we come! Are you sure this is the way? What? You didn't bring the map?!
    description: Calvin and Hobbes are in the wagon in space.  Calvin says they cleared Earth's orbit.  Calvin yells "Mars, here we come".  Hobbes asks if he's sure this is the way.  Calvin asks if he didn't bring the map.
    characters: [calvin, hobbes]
  "19880918":
    transcript: Call it. Tails. OK, best two out of three. OOOMPH Let's change this to TOUCH football, OK?
    description: Calvin kicks the football to Hobbes.  Calvin goes for the tackle.  He hits Hobbes, but nothing happens.  Calvin tries picking up Hobbes' foot, but nothing happens.  Calvin pulls Hobbes' tail, but nothing happens.  He tries climbing on Hobbes to reach the football, but Hobbes simply holds it at arm's length.  Calvin suggests they change to touch football.
    characters: [calvin, hobbes]
  "19880919":
    transcript: Space travel makes you realize just how small we really are. When you see Earth as a tiny blue speck in the infinite reaches of space, you have to wonder about the mysteries of creation. Surely we're all part of some great design, no more or less important than anything else in the Universe. Surely everything fits together and has a purpose, a reason for being. Doesn't it make you wonder? I wonder what happens if you throw up in zero gravity. Maybe you should wonder what it's like to walk home.
    description: Calvin says space travel makes you realize how small we are.  The earth is a tiny blue speck in the infinite reaches of space.  Calvin wonders about the mysteries of creation.  He thinks they're part of some great design, no more or less important than any other thing in the universe.  Everything fits together and has a reason for being.  He asks Hobbes if it makes him wonder.  Hobbes wonders what happens when you throw up in zero gravity.  Calvin tells him maybe he should wonder what it's like to walk home.
    characters: [calvin, hobbes]
  "19880920":
    transcript: Hang on! We're coming in through Mars' atmosphere. BONK BONK We've landed! We're the first ones to ever set foot on another planet! What a historic moment! I still can't believe you forgot the camera. I remembered it. YOU just didn't want to turn around.
    description: They are coming in through Mars' atmosphere.  The wagon comes to a landing on the surface.  Calvin says they're the first ones to land on another planet.  What a historic moment!  Calvin tells Hobbes he still can't believe Hobbes forgot the camera.  Hobbes crosses his arms and says he did remember the camera.  Calvin just didn't want to turn around.
    characters: [calvin, hobbes]
  "19880921":
    transcript: See any signs of Martian life? Not yet... Hey, look! It's the old "Viking" spacecraft that landed here in the '70s. Gosh, I wonder if it's still working. BLAHHHH HOOP HOOP BOOLA BOOLA ACKACKACK That ought to blow some circuits at NASA! Hee Hee Hee! I've always wanted to do something like that.
    description: Calvin and Hobbes are walking on Mars looking for signs of life.  Calvin notices the old "Viking" spacecraft that landed in the 70's.  Hobbes wonders if it's still working.  They walk up to the craft, make funny faces at it, and make odd noises.  As they walk away laughing, Calvin says that ought to blow some circuits at NASA.
    characters: [calvin, hobbes]
  "19880922":
    transcript: Well, this is our new home. I guess we should unpack and set up camp. Comic books... comic books... tuna... some candy bars... more tuna... toothbrushes... a can opener... looks like we're all set. What's this? A night light. I thought it might be scary sleeping on a new planet. Boy, you thought of everything. Now we have to find an outlet.
    description: Calvin decides to unpack and set up camp.  They have comic books, candy bars, tuna, a can opener, and toothbrushes.  They're all set.  Hobbes brought along a night light.  He thought it might be scary sleeping on a new planet.  He goes off looking for an outlet.
    characters: [calvin, hobbes]
  "19880923":
    transcript: Yep, Mars may be a little dull, but it's better than earth. CRUNCH CRUCH We've got a whole planet to ourselves. Brand new and unspoiled. No people. No pollution. Nothing but rugget, natural beauty as far as the eye can see. That's not your candy bar wrapper over there, is it? It was just there a minute! I wasn't going to leave it.
    description: As they're eating a candy bar, Calvin comments that Mars is dull, but it's better than Earth.  They have the whole planet to themselves.  No people, no pollution.  Nothing but natural beauty as far as the eye can see.  Hobbes asks if that's Calvin's candy wrapper on the ground.  Calvin hastily says it was only there a minute, and he wasn't going to leave it.
    characters: [calvin, hobbes]
  "19880924":
    transcript: I don't know about you, but I LIKE it here on Mars. I do too. It's very peaceful. Not only that, but we don't have MOM here to boss us around! No early bedtime, no baths, no disgusting dinners, no... Did that rock just move?? MOMMMMM!!
    description: Calvin and Hobbes both like it on Mars.  It's very peaceful.  Calvin also adds that Mom isn't there to boss them around.  No early bedtime, no baths, no disgusting dinners.  Hobbes looks quickly at the ground.  He asks Calvin if that rock just moved.  They hold onto each other and yell for Mom.
    characters: [calvin, hobbes]
  "19880925":
    transcript: You know what would make this house a lot better? No, what? You should take out the stairs and put me in an elevator. Good. I'll file that with your idea for a moving sidewalk. Oh no! WHOAAA OWW ... WWCH! WHOAAA OWW ... WWCH! WHOAAA OWW ... WWCH! Did you fall down the stairs AGAIN?! That's me. (Oof), the human slinky.
    description: Calvin stands on the top stair of the case.  He bends forward and hits his head on the next step.  Then, he tumbles over and hits his feet on the next step.  Again and again it happens.  Mom runs over to the bottom of the staircase and asks if he fell down the stairs again.  Calvin, stuck head first between the floor and the bottom step, says that's him, the human slinky.
    characters: [calvin, mom, dad]
  "19880926":
    transcript: Oh my gosh, that rock moved! There's something under it! It must be a Martian! Oh no! Oh no! It's probably some creepy, tentacled, bug-eyed monster! You're right! There's a tentacle now! It's coming out! What will we do?! AAUGHHHHH
    description: Calvin and Hobbes look at a rock.  It's moving.  Hobbes says there's something under it.  Calvin says it must be a Martian.  He says it's probably some creepy, tentacled, bug-eyed monster.  They see a tentacle come from under the rock.  Calvin says it's coming out.  He wonders what they'll do.  When they see the Martian, and the Martian sees them, everyone jumps into the air and shrieks.
    characters: [calvin, hobbes]
  "19880927":
    transcript: Is the Martian still out there? I'll take a peek. I don't see him. He must have hidden. Hidden?? Do you think he's scared of us? Why not? WE'RE scared of HIM. Yeah, but WE'RE just ordinary earthlings, not weirdos from another planet, like HE is.
    description: Calvin and Hobbes are hiding behind a rock.  Calvin wonders if the Martian is still out there.  Hobbes takes a look.  He doesn't see him, so he tells Calvin he must be hiding.  Calvin whispers to Hobbes asking if he thinks the Martian is scared of them.  Hobbes tells him why not, they're afraid of him.  Calvin says they're just ordinary Earthlings, not weirdos from another planet like he is.
    characters: [calvin, hobbes]
  "19880928":
    transcript: Why do you think the Martian hid from us? Maybe Martians don't like Earthlings. Don't like us?! What's not to like?? There's nothing wrong with humans! Hey, you Martian! Come on out! We're not bad! We just came here because our people polluted our own planet so much that ... uh... what I mean, is... um... So what are you saying? That our reputation has preceded us? Would you welcome in a dog that wasn't house-trained?
    description: Calvin asks why the Martian hid from them.  Hobbes supposes Martians may not like Earthlings.  Calvin wonders what there is not to like.  Calvin yells to the Martian to come out, they're not bad.  They just came to Mars because people polluted their own planet.  He stops.  Then, Calvin asks Hobbes if their reputation preceded them.  Hobbes asks if Calvin would welcome in a dog that wasn't house-trained.
    characters: [calvin, hobbes]
  "19880929":
    transcript: I guess we should go home to Earth. Yeah, we may not be welcome here. We ought to fix up our own planet before we go messing around with other people's planets. After all, there's only one Earth, and it's got to last us a while. We also should go home because we're clean out of tuna. I hope Mom and Dad didn't rent out my room.
    description: Hobbes thinks they should go home to earth.  Calvin agrees, thinking they may not be welcome there.  He thinks they should fix up their own planet before messing around with other people's planets.  As they start down a hill, Calvin says there's only one earth, and it has to last them a while.  Hobbes adds they should also go home because they're out of tuna.  Calvin hopes Mom and Dad haven't rented out his room.
    characters: [calvin, hobbes]
  "19880930":
    transcript: There's Earth. We're almost home. Look, you can see the continents. Hmm... if I remember my atlas, we live in a big, purple country. And our house is by the giant letter "E" in the word "States".
    description: As they ride in the wagon through space, they approach earth.  Calvin says you can see the continents.  He says if he remembers his atlas, they live in a big, purple country.  Hobbes adds their house is by the giant "E" in the word "States".
    characters: [calvin, hobbes]
  "19881001":
    transcript: Hi, Dad! Guess what Hobbes and I did! We went to Mars! Well, well. Yep. We were going to live there because Earth is so polluted, but we discovered that Mars is inhabited, so we came back home. You didn't like the Martians? No, they didn't like US. I think they were afraid we'd junk up Mars the way we've junked up Earth. What's my good briefcase doing out, and why does it smell like tuna fish?! And can you believe it, Dad? We go clear to Mars, and dumb ol' Hobbes forgets the camera!
    description: Dad comes home from work, and Calvin tells him he and Hobbes went to Mars.  Calvin explains they went there because Earth is polluted, but they came home when they found Mars inhabited.  Dad asks if he didn't like the Martians. Calvin tells him the Martians didn't like them.  He thinks the Martians were worried they'd junk up their planet like they had junked up Earth.  Dad asks why his good briefcase is out and why does it smell like tuna.  Calvin says they go all the way to Mars, and Hobbes forgets the camera.
    characters: [calvin, hobbes, dad]
  "19881002":
    transcript: Uh-oh. Something is very wrong here. Calvin has mysteriously shrunk to a quarter of an inch tall! How can he make his plight known to his parents when he is smaller than a penny? Calvin gets an idea! He grabs the leg of a passing housefly and flies to his Dad's camera! Once there, he climbs up and sets the self-timer. Jumping on the shutter, Calvin has 15 short seconds to get in front of the lens. With luck, Calvin's Dad will have the film developed soon, and discover what has happened. What happened?! Look at all these terrible pictures! I don't remember taking these. Who's that little speck in the distance all the time? You haven't been fooling with my camera, have you? ME? Heck, no. Maybe you should get the camera fixed.
    description: Calvin has shrunk to a quarter of an inch tall.  How will he tell his parents when he's smaller than a penny?  He grabs the leg of a passing housefly and flies to Dad's camera.  He climbs up and sets the self-timer.  He jumps up in front of the lens.  Calvin hopes Dad gets the film developed soon to discover what has happened.  Dad's looking at what are terrible pictures.  He doesn't remember taking them.  He wonders who the little speck in the distance is.  He asks if Calvin has been fooling around with the camera.  Calvin says heck no.  He suggests Dad get the camera fixed.
    characters: [calvin, dad]
  "19881003":
    transcript: For show and tell, I have brought a space alien I captured in my back yard. Yes, for the last two days I've been keeping it in this special zarnium-coated bag, and feeding it pure ammonia! And now, the moment you've all been waiting for! AARGH How'd it work? My teacher says Mom and Dad both have to sign my report cards this year.
    description: Calvin brings in the space alien he caught in his back yard to show and tell.  He tells the class that for two days, he's kept it in a special zarnium-coated bag, feeding it pure ammonia.  He opens the bag, and he has a hand puppet on. He makes a growling sound.  Later, Hobbes asks how it went.  Calvin tells him the teacher said both Mom and Dad have to sign his report cards this year.
    characters: [calvin, hobbes]
  "19881004":
    transcript: SCOOTCH SCOOTCH GREETINGS. I AM X-387 ROBOT PROBE SENT FROM JUPITER. Mm hmm. MY SENSORS INDICATE TRACE AMOUNTS OF CHOCOLATE IN THE PANTRY. PLEASE LOAD SOME IN MY SCOOP FOR ANALYSIS. No, you'll spoil your appetite. MY MISSION MUST NOT FAIL. PREPARE FOR ANNIHILATION, PITIFUL EARTH FEMALE. Go back to Jupiter, X-3 whatever.
    description: Calvin scootches across the floor inside a box turned upside down.  He moves over to Mom, sitting with a cup of coffee.  In a robotic voice, he says he's a robot probe sent from Jupiter.  He says his sensors detect trace amounts of chocolate in the pantry.  He requests some to be loaded into his scoop for analysis.  Mom refuses, saying it will ruin his appetite.  Calvin says his mission must not fail.  He tells the pitiful earth female to prepare for annihilation.  He holds a rubber dart gun out.  Mom tells him to go back to Jupiter.
    characters: [calvin, mom]
  "19881005":
    transcript: You know, when you think about it, our lives are pretty nice. A lot of kids don't have as good of a home life as we do. We really can't complain. ... which isn't to say we should go home yet. When do you think they'll see the car windshield?
    description: Calvin tells Hobbes their lives are pretty nice.  He says a lot of kids don't have as good a home life as they do. They really can't complain.  They keep walking over rocks and fallen trees.  Calvin adds that isn't to say they should go home yet.  Hobbes asks when he thinks they'll see the car windshield.
    characters: [calvin, hobbes]
  "19881006":
    transcript: Hi Susie! Guess what I brought for lunch. No! Go sit by someone else, OK? You always say your lunch is something revolting, and I don't want to hear it! Gee whiz, what's wrong with you? My lunch is peanut butter. What's so disgusting about that?! Hmph. I'm glad that one day out of the year you can be civil. It's my DESSERT that's gross! Look, a thermos full of phlegm!
    description: Calvin asks Susie to guess what he brought for lunch.  Susie wants no part of it.  She tells him to sit somewhere else.  He always says lunch is something revolting.  Calvin is indignant.  He asks what's so disgusting about peanut butter.  He shows her the sandwich.  Susie says she's glad that one day out of the year, he can be civil.  Calvin tells her it's his dessert that's disgusting, a thermos full of phlegm.
    characters: [calvin, susie]
  "19881007":
    transcript: Calvin, will you run and get my purse, please? I need the calculator. Sure. Here you are. Thanks. Ahem. I'M NOT GOING TO TIP YOU!! Huh! See if I ever fetch anything again.
    description: Mom asks Calvin to get her purse.  She needs her calculator.  Calvin goes to get the purse.  He hands it to her, and Mom thanks him.  He stands there and clears his throat with his hand out.  Mom says she isn't going to tip him.  Calvin walks off saying he won't fetch anything again.
    characters: [calvin, mom]
  "19881008":
    transcript: Election day is coming up, Dad. People want to know where you stand on the issues. Such as? Later bedtimes, expanded TV privileges, shorter school weeks, and less discipline. I'm against them all. How's your IRA? Pretty well funded? Go to bed.
    description: Calvin tells Dad Election Day is coming.  People want to know where he stands on the issues.  Dad asks which issues.  Calvin informs him later bedtimes, expanded TV privileges, shorter school weeks, and less discipline.  Dad says he's against them all.  Calvin asks if Dad's IRA is well-funded.
    characters: [calvin, dad]
  "19881009":
    transcript: My parents are the two stupidest people on earth. Just my luck, they'd get married and have me. I hate everybody. I don't see home anyone could ever fall in love. People are jerks. Sometimes they are, but look at the colors on the trees today. Yeah? So what? I think it's more fun to see something like this WITH someone than just by yourself. I GUESSSS so... but I'd still rather see this with a tiger than a person. Well, THAT goes without saying.
    description: In the woods, Calvin tells Hobbes he hates everybody.  He can't see how anyone could fall in love, because people are jerks.  Hobbes says that sometimes they are, but look at the colors of the trees today.  Calvin looks around and says so what.  Hobbes thinks it's more fun to see something like this with someone than by yourself.  They look at each other. They walk off across a fallen tree.  Calvin says he guesses, but he'd rather see this with a tiger than a person.
    characters: [calvin, hobbes]
  "19881010":
    transcript: MOMMMM What's the matter, Calvin? I don't feel good. What hurts? My stomach. I want Mom. ME? What's wrong with YOU, for crying out loud?!? You can ask him. Now let me get back under the covers.
    description: In bed at night, Calvin calls for Mom.  Dad comes in and asks what's wrong.  Calvin doesn't feel good.  He says his stomach hurts, and he wants Mom.  Dad crawls back in bed, to find Mom curled up with the covers.  She asks why her.  What's wrong with him, for crying out loud?   Dad tells Mom she can ask Calvin.  Then he tells her to let him back under the covers.
    characters: [calvin, mom, dad]
  "19881011":
    transcript: Sheesh, it's two in the morning. Why do kids always have to feel sick at two in the morning? Calvin probably just ate too much dessert. If he's going to get me up at this hour, he'd better REALLY be sick. BARRRFF I DIDN'T MEAN IT! Honey, pipe down. I'm trying to sleep.
    description: Mom groggily looks at the clock.  She wonders why kids always feel sick at two in the morning.  She sits on the edge of the bed, trying to wake up.  She says Calvin probably just ate too much dessert.  She says if he's going to get her up at that hour, he'd better really be sick.  Mom opens her eyes wide when she hears Calvin barf in his room.  She puts her arms out and shouts that she didn't mean it.  Dad rolls over and tells her to pipe down, he's trying to sleep.
    characters: [calvin, mom, dad]
  "19881012":
    transcript: It's been 20 minutes since you've been sick, so let's take your temparature. Ig gomfa fome ubhiggin. What'd you say, honey? IG GOMFA FOME UBHIGGIN. AACK! WHY DIDN'T YOU SAY SO? Give me the thermometer! Run! Run!
    description: Mom tells Calvin it's been twenty minutes since he was sick, so she takes his temperature.  While Mom is waiting, she yawns.  With thermometer in mouth, Calvin says "Ig gomfa fome ubhiggin".  Mom glances at her watch and asks what he said.  Calvin repeats it.  She turns around and asks why he didn't say so.  She asks for the thermometer and says "Run".
    characters: [calvin, mom]
  "19881013":
    transcript: I think the worst of this is over, so just try to get some sleep. I'm going back to bed, but give me a call, if you feel sick again, OK? Now get some rest. Mm hmm. Poor little kid. YECHHH! There is nothing worse than a sick roommate! Face THAT way!
    description: Mom tucks Calvin back to bed and says she thinks the worst is over.  She tells him to try to get some sleep. She says she's going back to bed, but that he should call if he feels sick again.  Calvin weakly agrees.  Mom closes the door and says "Poor little kid".  Hobbes disgustedly pushes Calvin over and says there's nothing worse than a sick roommate.  He tells Calvin to face the other way.
    characters: [calvin, hobbes, mom]
  "19881014":
    transcript: It's scary being sick... especially at night. What if something is REALLY wrong with me, and I have to go to the hospital?? What if they stick me full of tubes and hoses? What if they have to operate? What if the operation fails? What if this is my... my... last night... ALIVE?? Then I can look forward to having the bed to myself tomorrow. Few things are less comforting than a tiger who's up too late.
    description: Calvin says it's scary being sick at night.  He wonders what if something is really wrong with him, and they have to take him to the hospital.  He gets more worried about having tubes and hoses stuck in him, having an operation, and it being the last night of his life.  Hobbes, being kept awake by all this, says he could then look forward to having the bed to himself tomorrow.  Calvin says there are few things less comforting than a tiger who's up too late.
    characters: [calvin, hobbes]
  "19881015":
    transcript: Feel any better this morning, Calvin? No. I guess I'd better make you an appointment with the doctor. OK. It's Saturday, by the way. You won't miss school. I know.
    description: The next morning, Mom asks Calvin if he feels better.  With eyes nearly closed, he says no.  She tells him she better make an appointment with the doctor.  He says OK.  Mom reminds him it's Saturday, so he won't miss school.  He wearily says he knows.  Now Mom knows it's for real.  She runs to the telephone.
    characters: [calvin, mom]
  "19881016":
    transcript: The valiant Spaceman Spiff, energetic inter-galactic explorer, comes in over the mountains of a strange planet! Our hero desperately hopes to find a rest area with working facilities. Spaceman Spiff lands on the distant planet Zokk. Climbing down from his spacevraft, our hero prepares to explore te surface! Unexpectedy, Spiff's first step sends him careening through the sky! Spiff quickly realizes that Planet Zokk has only a fraction of Earth's gravity. With practice, our hero soon finds he can bound effortlessly across the landscape. Stop bouncing on the bed and go to sleep.
    description: Spaceman Spiff lands on the planet Zokk.  He prepares to explore the surface.  Spiff's first step sends him careening through the sky.  Spiff realizes Zokk has only a fraction of earth's gravity.  With practice, our hero finds he can bound effortlessly across the landscape.  Dad opens the bedroom door and yells to Calvin to quit bouncing on the bed and go to sleep.
    characters: [calvin, dad, spiff]
  "19881017":
    transcript: Well, it looks like Calvin just caught the bug going around. Nothing serious. Keep an eye on him, and let me know if he isn't feeling better soon. OK. Thank you. So long, Calvin. You were a good patient this time. Mm. Nothing like a little virus to take the edge off a kid. I'd still rather let his teacher deal with him.
    description: Calvin slowly puts his shirt back on.  The doctor tells Mom that Calvin just caught the bug that's going around. He tells her to keep an eye on Calvin and let him know if Calvin isn't feeling better soon.  Calvin sleepily walks away.  The doctor tells him he was a good patient today.  He then tells Mom there's nothing like a little virus to take the edge off a kid. Mom says she'd still rather let his teacher deal with him.
    characters: [calvin, mom, doctor]
  "19881018":
    transcript: I get to stay home from school today. I get to lie in bed, drink tea, and read comic books all day. I wish I could do this every day. ... like some people I know. Your Mom doesn't bring ME tea in bed.
    description: Calvin is lying in bed.  He says he gets to stay home from school.  He gets to lie in bed, drink tea, and read comic books all day.  He says he wishes he could do that every day...like some people he knows.  He looks over at Hobbes, who's also in bed with comics.
    characters: [calvin, hobbes]
  "19881019":
    transcript: I want some more toast. ROOM SERVICE!! Ha! THAT sure got you up here quick! Tomorrow you're going to school.
    description: Calvin wants some more toast. He yells "Room Service".  He tells Mom that got her up there real fast.  Mom tells him tomorrow, he'll go to school.
    characters: [calvin, mom]
  "19881020":
    transcript: I think people worry too much about little things. All they do is make themselves unhappy that way. Why get an ulcer over things that don't really matter? Like the book report you're supposed to be writing now on the book you haven't read? Exactly. Case in point.
    description: Calvin thinks people worry too much about little things.  He says all they do is make themselves unhappy that way.  He asks Hobbes why get an ulcer over things that don't matter.  Hobbes asks if he means things like the book report he's supposed to be writing now on the book he hasn't read.  Calvin tells him "Exactly.  Case in point".
    characters: [calvin, hobbes]
  "19881021":
    transcript: Why in the world am I waiting in the pouring rain for the school bus to take me somewhere I don't even want to go? I go to school, but I never learn what I want to know.
    description: Calvin is standing at the bus stop in his rain coat.  It's pouring rain.  He asks why he's standing in the rain, waiting for a bus to take him to a place he doesn't want to go.  The rain keeps falling.  Calvin says he goes to school, but he never learns what he wants to know.
    characters: [calvin]
  "19881022":
    transcript: I hate school. Each day I count the hours until school's over. Then I count the days until the weekend. Then I count the weeks until the month is over, and then the months until summer. I always have to postpone what I WANT to do for what I HAVE to do! Welcome to the world. Would you sign this parental excuse to get me out of the next 11 1/2 years of school?
    description: Calvin tells Dad he hates school.  He goes on to say he counts the hours until school's over, he counts the days until the weekend, he counts the weeks until the month is over, then counts the months until summer.  He always has to postpone what he wants to do for what he has to do.  Dad rolls his eyes and welcomes Calvin to the world.  Calvin then asks if Dad will sign a parental excuse to get him out of the next 11 1/2 years of school.
    characters: [calvin, dad]
  "19881023":
    transcript: I feel a big sneeze welling up. ... which is always a sure sign that I'm not carrying a handkerchief. Ah... Ah... Ah... CHOOOOO!! Mom, I sneezed and blew my head off! Pull your shirt down, Calvin. You're not fooling anyone. Mom would be a lot more fun if she was a little more gullible.
    description: Calvin sneezes, and his head blows off.  He walks, headless, into the other room.  He tells Mom he sneezed and blew his head off.  Mom pulls his shirt down and tells him he's not fooling anyone.  Calvin says Mom would be a lot more fun if she was a little more gullible.
    characters: [calvin, mom]
  "19881024":
    transcript: Dumb balloon. Poof poof poof poof poof
    description: Calvin is having trouble blowing up a balloon.  He puffs into the balloon a few times.  Suddenly, the air comes back from the balloon into Calvin's head.  It puffs up several sizes too large.  Calvin gives up and tosses the balloon over his shoulder.
    characters: [calvin]
  "19881025":
    transcript: Hey, Susie, did you have any trouble with our math homework last night? No, why? I thought a couple of these were tricky. Can I check my answers with yours? OK. Thanks. What did you get for questions one? Seven. Seven? Good, that's what I got. What did you get for question two? DROP DEAD, CALVIN.
    description: Calvin asks Susie if she had any trouble with the math homework last night.  Susie says she didn't.  He thought a couple answers were tricky.  He asks if he can check his answers with her.  Susie agrees.  Calvin asks what she got for question one.  Susie tells him.  He says that's what he got as he writes down the answer.  He asks what Susie got for question two.  Susie tells him to drop dead.
    characters: [calvin, susie]
  "19881026":
    transcript: Ever sit and watch ants? Look at this one. He's carrying a crumb that's bigger than he is, and he's RUNNING. And if you put an obstacle in front of him, he'll scramble like crazy until he gets across it. He doesn't let anything stop him. I just can't identify with that kind of work ethic.
    description: Calvin asks Hobbes if he has ever sat and watched ants.  Calvin points out one ant and says it's carrying a crumb that's bigger than he is, and he's running.  He tells Hobbes if you put an obstacle in front of him, he'll scramble like crazy until he gets across it.  He says the ant doesn't let anything stop him.  Calvin tells Hobbes he just can't identify with that kind of work ethic.
    characters: [calvin, hobbes]
  "19881027":
    transcript: Just think, Earth was a cloud of dust 4.5 billion years ago... 3 billion years ago, the first bacteria appeared. Then came sea life, dinosaurs, birds, mammals, and finally a million years ago, man. Now in 1988, there's me. ... the acme of evolution. Oh, PLEASE.
    description: Calvin tells Hobbes the earth was a cloud of dust 4.5 billion years ago.  He says 3 billion years ago, bacteria appeared.  Then came sea life, dinosaurs, mammals, and a million years ago, man.  Then he says that in 1988, there's Calvin. He calls it "The Acme of Evolution".
    characters: [calvin, hobbes]
  "19881028":
    transcript: It's not quite the same, is it? And it probably won't snow for another month at least.
    description: Calvin and Hobbes rake up a pile of leaves.  They run off, and come back with a carrot and a hat.  They put them on the leaf pile, trying to make it look like a snow man.  Hobbes says it's not quite the same.  Calvin says it probably won't snow for at least another month.
    characters: [calvin, hobbes]
  "19881029":
    transcript: Z Z GRRR Z GROWLL RRR! Psst! Hey! Wake up! You're dreaming! Grrrr... And Mom wonders why I never look rested in the morning.
    description: Calvin and Hobbes are sleeping.  Hobbes suddenly starts growling and roaring in his sleep.  Calvin tries to wake Hobbes up, to no avail.  He has a worried look on his face.  He decides to sleep on the floor.  As he lies there, he says Mom wonders why he never looks rested in the morning.
    characters: [calvin, hobbes]
  "19881030":
    transcript: So THERE you are! Get out right now! Into the tub! Let's go!! She'd never have found me if I hadn't sneezed. I'll give you a quarter to take my bath for me. Let's see the quarter first. Here. Just splash around while I make sounds as if it's me in the tub
    description: Calvin gives Hobbes a quarter to take a bath for him.  Hobbes sits in the tub, while Calvin talks about washing his arms, dropping the soap, and washing his face.  Hobbes offers to take his Wednesday bath for him, too.  Calvin hands Hobbes a towel.  Hobbes figures a few weeks of this, and he'll be rich.  Hobbes dries himself with the blow dryer.  They lie in bed when Mom comes to give Calvin a good night kiss.  Calvin whispers for Hobbes to keep a straight face.  BLEECH! Calvin is filthy.  Calvin hands her the wet towel and asks if she didn't hear him take his bath.  Back into the tub he goes.  He wants his quarter back, but Hobbes says it's as good as spent.
    characters: [calvin, hobbes, mom]
  "19881031":
    transcript: Look! A buckeye! Isn't it pretty? Look how perfect it is. I'm going to keep this one. What will you do with it? Try to dent Susie's skull from 50 feet.
    description: Calvin finds a buckeye on the ground.  He tells Hobbes how pretty and perfect it is.  He says he's going to keep it.  Hobbes asks what he'll do with it.  Calvin tells him he'll try to dent Susie's skull from 50 feet.
    characters: [calvin, hobbes]
  "19881101":
    transcript: What are you doing? Dad told me to go outside, so I'm digging a hole to China. If Dad's going to be such a grouch, I figure I'll just go live on the other side of the planet. You can come too, if you want. There's another shovel in the garage. You don't think your DAD will get mad about us digging up the driveway? Oh, you know Dad. He'll get mad no matter WHERE we dig.
    description: Hobbes asks what Calvin is doing.  Calvin is digging a hole to China.  Calvin says if Dad is going to be a grouch, he'll just go live on the other side of the planet.  Calvin tells Hobbes he can come along, too.  There's another shovel in the garage.  Hobbes wonders if Dad will get mad with them digging up the driveway.  Calvin says Dad will get mad no matter where they dig.
    characters: [calvin, hobbes]
  "19881102":
    transcript: Look what Mom made me! A super hero outfit. Don't I look cool? Now I can fight crime without anyone knowing my true identity! Yep, I'm all set now! ... So! Seen any crimes? Why do you care that nobody knows your identity?
    description: Calvin shows off the super hero outfit Mom made for him.  It has a mask and cape.  He says he can fight crime without anyone knowing his true identity.  He asks Hobbes if he's seen any crimes.  Hobbes wants to know why he cares that nobody knows his identity.
    characters: [calvin, hobbes, stupendous]
  "19881103":
    transcript: Calvin, take off your outfit before you sit at the table, OK? Calvin? Who's Calvin? I'm Stupendous Man! Stop being silly. And do as I asked you. But Mom, I NEED to wear this for dinner! No you don't. Let's go. But Stupendous Man has a stomach of steel!
    description: Mom tells Calvin to take off his outfit at the dinner table.  Calvin says he's Stupendous Man.  Mom tells him to stop being silly and do what she asked.  Calvin says he needs to wear his costume for dinner.  Mom says he won't.  Calvin says Stupendous Man has a stomach of steel.
    characters: [calvin, mom, stupendous]
  "19881104":
    transcript: Mom said I can't go outside until I finish my homework. If you'll help me, I'll be faster. What's five plus seven? I don't know. I don't either. Then write, "I don't know." Hey, that's a true answer, isn't it! I can write that for ALL of these! We're done! We'd better have a look at our prodigy's homework.
    description: Calvin is doing his homework.  He tells Hobbes Mom won't let him go outside until he finishes.  He suggests Hobbes help him so he can get done faster.  He asks Hobbes what five plus seven is.  Hobbes doesn't know, nor does Calvin. Hobbes suggests he write "I don't know" as the answer.  Calvin agrees that's a true answer.  He can write that for all the questions.  He's done.  Out the door he and Hobbes go.  Inside the house, we hear someone saying they're going to have a look at their prodigy's homework.
    characters: [calvin, hobbes]
  "19881105":
    transcript: Want to go play outside? No. I'm watching TV. You hate this show. Let's go out. Nah. Why not? Dad said he was sick of arguing with me, and for all he cared, I could watch TV until my brains oozed out of my ears. So you're going to? It was a hard-won privilege.
    description: Hobbes asks if Calvin wants to play outside.  Calvin doesn't, he's watching TV.  Hobbes reminds him he hates that show.  Calvin explains that Dad was sick of arguing with him and told him he didn't care if he watch TV until his brains oozed out his ears.  Hobbes asks if he's going to.  Calvin tells him it was a hard-won privilege.
    characters: [calvin, hobbes]
  "19881106":
    transcript: Flaps ... check. Fuel ... check. Landing gear ... check. Goggles... check. Calvin pilots his F-15 at more than 1,500 miles per hour. Loaded with tons of every conceivable missile weapon, the jet shrieks low over the ground. Up and over the next rise, his target comes into view. Calvin FIRES! FWISSHHH! Missile after missile streaks ahead and detonates with grim accuracy! PFOOM! Mission accomplished! A smoldering crater is all that remains of Calvin's elementary school! ... sigh...
    description: Calvin pilots his F-15.  Loaded with tons of every conceivable missile, the jet shrieks over the ground.  The target comes into view, and Calvin fires.  Missile after missile streaks ahead and detonates with grim accuracy.  Mission accomplished!  Calvin's school is reduced to a smoldering crater.  Calvin gets off the school bus, heads toward the school, and sighs.
    characters: [calvin]
  "19881107":
    transcript: Well Dad, we're right down to the wire, and the polls say you won't be Dad here much longer. It seems you're just not likeable enough. Those polled continue to find you a cold fish. If you want some advice, I suggest you do something extraordinarily likeable in the next two minutes. Go to bed. No, no! It's WAY too late to learn how to tell jokes.
    description: Calvin informs Dad that the polls indicate he won't be Dad much longer.  He says Dad just isn't likeable enough.  Those polled continue to find Dad a cold fish.  Calvin suggests Dad do something extraordinarily likeable in the next two minutes.  Dad tells Calvin to go to bed.  Calvin slaps his forehead and says it's too late for Dad to learn to tell jokes.
    characters: [calvin, dad]
  "19881108":
    transcript: Ten... Fifteen... Six... Twenty-two... HIKE! YAAAA AUGH! Another five yeard loss! We've got to get some other players.
    description: Calvin and Hobbes are playing football.  Calvin calls the signals.  Hobbes snaps the ball.  Hobbes immediately turns around, jumps up, and tackles Calvin.  Hobbes says there is another five yard loss.  Calvin says they've got to get some other players.
    characters: [calvin, hobbes]
  "19881109":
    transcript: Boy, you're lucky YOU don't have to go to school like I do. You don't know what it's like to get up on these cold, dark mornings and have to go someplace you hate. Yes I do. Oh yeah? How could you? You tell me every morning. Oh, am I keeping you awake?! I'm SORRY!
    description: Calvin gets out of bed, telling Hobbes he's lucky he doesn't have to go to school.  He tells Hobbes he doesn't know what it's like to get up on cold, dark mornings and have to go someplace you hate.  Hobbes says he does know, and Calvin asks how.  Hobbes curls up with the covers and says that Calvin tells him every morning.  Calvin yells that he's sorry if he's keeping Hobbes awake.
    characters: [calvin, hobbes]
  "19881110":
    transcript: Hey! This (mmf) isn't (ooch) how you play the game! You still haven't tackled me!
    description: Calvin is trying to catch Hobbes, who has the football.  Hobbes keeps running, with Calvin in close pursuit. Hobbes goes into the house and crawls under the chair.  Calvin, caught under the chair, complains this isn't how the game is played.  Hobbes tells him he still hasn't tackled him.
    characters: [calvin, hobbes]
  "19881111":
    transcript: Off the swing, Twinky. Forget it, Moe. I just got on. You have to wait your turn like everyone else. I said, "Off". I keep forgetting that rules are only for little nice people.
    description: Moe tells Calvin to get off the swing.  Calvin tells him to forget it, he just got on.  Calvin says Moe will have to wait his turn like everyone else.  Moe pulls him off and cocks his fist.  Calvin, lying in a cloud of dust, says he keeps forgetting rules are only for little nice people.
    characters: [calvin, moe]
  "19881112":
    transcript: HIKE! Whoops! Heh heh... I'm losing the game, but winning an ambulatory adulthood.
    description: Calvin is ready to snap himself the football.  Hobbes is crouched on the other side of the ball ready to pounce. Calvin snaps the ball and Hobbes prepares to jump.  Calvin flips the football to the ground for a fumble, where Hobbes pounces upon it and runs for a score.  Calvin says he's losing the game, but he's winning an ambulatory adulthood.
    characters: [calvin, hobbes]
  "19881113":
    transcript: RINGGG What a day. KAPOW You think that's funny? Come back here and fight, you weasel! What happened to YOU?? Don't ask. I'm going upstairs to change. NOT AGAAINN! Where's Calvin? I sent him to his room. I caught him making prank calls to pet stores, asking if they'd buy his tiger.
    description: Calvin gets off the bus after a rough day.  He opens the door, and Hobbes crashes into him.  Calvin angrily tells Hobbes that if he thought that was funny, he should come back and fight.  He trudges up the stairs.  Mom notices he looks dirtied and asks what happened.  He tells her not to ask.  He heads to his room to change.  When he opens his room door, Hobbes crashes into him again.  Later, Dad asks where Calvin is.  Mom tells him she sent him to his room for making prank calls to pet stores.  He was asking them if they'd buy his tiger.
    characters: [calvin, hobbes, mom, dad, stuffedhobbes]
  "19881114":
    transcript: Hey, Susie, can I borrow your black crayon? OK, but don't break it. And don't peel the paper off, and color with all sides of it so it stays pointy. Geez, why don't you take out an insurance policy on it? Just don't ruin my crayon. What are you drawing anyway? Black bears attacking a black forest campground at midnight. Give me my crayon back.
    description: Calvin asks if he can borrow Susie's black crayon.  She hands it to him, but tells him not to break it, don't peel the paper off, and to color with both sides so it stays pointy.  Calvin asks why she just doesn't take out an insurance policy on it.  She tells him not to ruin the crayon.  She asks what he's drawing.  Calvin tells her black bears attacking a black forest campground at midnight.  Susie demands her crayon back.
    characters: [calvin, susie]
  "19881115":
    transcript: Hey! What's this stuff in my soup?! Yecchh! Is this rice?!? It had better NOT be! Rice? Let me see. Look! These little white things! See, there's rice in my soup! I hate rice! I didn't put any rice in. These are maggots. EWWWW!! Another lovely meal at home with my family... I wish my job required more travel. Well, he's EATING it now, right? Gosh, wait 'til I tell everyone at school what WE had for dinner!
    description: Calvin looks at his soup and starts to complain about it having rice in it.  Mom asks to see.  Calvin shows her, and he tells her he hates rice.  She tells him she didn't put rice in.  Those are maggots.  Dad frowns, puts his hand to the side of his face, and says this is another lovely meal at home with his family.  He wishes his job required more travel.  Mom tells him that Calvin's eating the soup now.  Calvin can't wait to tell everyone at school what they had for dinner.
    characters: [calvin, mom, dad]
  "19881116":
    transcript: Uh oh. HOOP EEP! I've got the hiccups something terrible, Mom. Drink some water.
    description: Calvin stops and says "Uh oh".  HOOP!  His head stretches vertically.  EEP!  His head stretches horizontally. He tells Mom he has the hiccups something terrible.
    characters: [calvin, mom]
  "19881117":
    transcript: BANG! I gotcha! ARGG! GAACKK UGHH! Here. What's this? It's your death rattle!
    description: Calvin and Hobbes are dressed in cowboy hats.  Hobbes shoots Calvin with his finger.  Calvin grabs his chest and falls backward.  Hobbes hands him something.  Calvin asks what it is as he shakes it.  Hobbes tells him it's his death rattle.
    characters: [calvin, hobbes]
  "19881118":
    transcript: It must be awful to be a girl. I'm sure it's frustrating knowing that men are bigger, stronger and better at abstract thought than women. Really, if you're a girl, what would make you go on living? The thought of a jerk like you begging one of us for a date when you're 17. Ha! Not ME! Gross!
    description: Calvin tells Susie it must be awful to be a girl.  He goes on to say it must be frustrating to know men are bigger, stronger, and better at abstract thought than women.  Calvin asks if you were a girl, what would make you go on living.  Susie replies the thought of jerks like him begging one of them for a date when they're 17.
    characters: [calvin, susie]
  "19881119":
    transcript: The tyrannosaurus stalks the cretaceous shores. The 5-ton carnovorous lizard can run faster than a charging rhino! What could be more horrifying? STOP THAT CLOMPING AROUND!! ... besides the blood-curdling roar of its Mom...
    description: The tyrannosaurus stalks the ground.  The five-ton carnivorous lizard can run faster than a rhino.  What could be more horrifying?  The dinosaur hears "Stop that clomping around".  Calvin, hunched over with teeth bared, says "besides the blood-curdling roar of its Mom".
    characters: [calvin, mom]
  "19881120":
    transcript: I've never liked crayons very much. They just don't have any flavor at all. For an art project, I'm supposed to draw my pet, but since I don't have one, I'll draw you. OK! Look ferocious. How's this? That's great. Hold still, now. Hmm... mm... ARRGH! This isn't coming out good at all! I can't draw tigers! I hate this class! Here, let me try. The good things about drawing a tiger is that it automatically makes your picture fine art. Hey, that's pretty good. Put some human heads around him, as if he just ate a village. How's that? Boy, this is great! I'll have the best picture in the whole class! I can't wait to show everyone! Wow! Thanks, Hobbes! But I'm NOT lying! My TIGER drew it! Do you think I could draw something that good MYSELF?? Yes...
    description: Calvin has an art project.  He supposed to draw his pet.  Since he doesn't have one, he's going to draw Hobbes.  He has Hobbes look ferocious.  Calvin has trouble drawing the picture.  He gets angry and crumples the paper.  He says he hates his class.  Hobbes asks to try.  Hobbes says drawing tigers automatically makes your picture fine art.  Calvin likes the picture Hobbes is drawing.  He adds a couple heads next to the tiger to look as if he ate a village.  Calvin thinks that's great and that he'll have the best picture in the class.  Calvin is explaining to the principal that Hobbes drew the picture, not him.  He asks if the principal thinks he could draw anything that good himself.
    characters: [calvin, hobbes, spittle]
  "19881121":
    transcript: When I grow up, I want to be an inventor. First I will invent a time machine. Then I'll come back yesterday and take myself to tomorrow and skip this dumb assignment.
    description: Calvin is writing an assignment.  He writes that he wants to be an inventor.  He writes that he'll build a time machine, and go to yesterday.  Then, he'll take himself to tomorrow and skip this dumb assignment.
    characters: [calvin]
  "19881122":
    transcript: MOMMM, I'M HOME FROM SCHOOL! OPEN THE DOOR FOR ME, OK? What's the matter? It wasn't locked. Sometimes Hobbes is waiting to pounce on me as soon as I open the door. Oh for heaven's sake! From now on, don't call me to come to the door unless it's locked. Ha! I sure out-smarted Hobbes THIS time! THBBPTT! Sissy.
    description: Calvin comes home from school.  He stands outside the house, yelling for Mom to open the door for him. Mom does, but mentions the door wasn't locked.  He tells her sometimes Hobbes is ready to pounce on him when he returns home.  Mom tells him not to call her to come open the door unless it's locked.  Calvin says he sure outsmarted Hobbes this time.  When he enters his bedroom, he sticks his tongue out at Hobbes.  Hobbes calls Calvin a sissy.
    characters: [calvin, hobbes, mom]
  "19881123":
    transcript: Boy, I'm in a bad mood today! Everyone had better steer clear of me! I hate EVERYBODY! As far as I'm concerned, everyone on the planet can just drop dead. People are scum. WELL-L-L? DOESN'T ANYONE WANT TO CHEER ME UP?!?
    description: Calvin walks along with a frown on his face.  He says he's in a bad mood today.  Everyone should steer clear of him.  He goes on to say he hates everybody.  He says everyone can drop dead, for all he cares.  People are scum.  He crosses his arms and keeps the scowl on his face.  Then he asks if someone doesn't want to cheer him up.
    characters: [calvin]
  "19881124":
    transcript: Get out of my way! I'm in a bad mood. I'll bet a pet dog would've gotten out of my way.
    description: Calvin walks up to Hobbes, who's lying on the ground.  Calvin says he's in a bad mood.  He tells Hobbes to get out of his way.  Hobbes sits up and holds his paw out.  Calvin is puzzled.  He's startled as Hobbes pops his claws out. Calvin turns around to walk away.  He grumbles that a pet dog would have gotten out of his way.
    characters: [calvin, hobbes]
  "19881125":
    transcript: Watch out, Mom. I'm in a bad mood. Be in a bad mood somewhere else, OK? I'm busy. Hmph! I'll bet my biological mother would've bought me a comic book and made me feel better instead of shunning me like YOU. Kid, anyone BUT your biological mother would've left you to the wolves long ago. Yeah, right. Really, how much did you pay for me?
    alternate: Watch out, Mom. I'm in a bad mood. Be in a bad mood somewhere else, OK? I'm busy. Hmph! A good mother would've bought me a comic book and made me feel better instead of shunning me like YOU. Kid, anyone BUT a good mother would've left you to the wolves long ago. Yeah, right. Let's see your training certificate.
    description: Calvin warns Mom he's in a bad mood.  Mom, working in the kitchen, tells Calvin to be in a bad mood elsewhere.  She's busy.  Calvin looks back over his shoulder and says his biological mother would have bought him a comic book and made him feel better instead of shunning him like she did.  Mom crouches down to tell Calvin anyone but your biological mother would have left him to the wolves long ago.  Calvin doesn't believe her and asks how much she paid for him.
    characters: [calvin, mom]
  "19881126":
    transcript: Waht's your tail for? My tail? Yeah, why do tigers need tails? Gee, I'm not really sure. I guess just because they look good. So it's sort of a necktie for your butt? Let's not be vulgar. You're just jealous.
    description: Calvin asks Hobbes what his tail is for.  Hobbes isn't really sure.  He guesses it's because they look so good. Calvin asks if it's sort of a necktie for his butt.  Hobbes accuses Calvin of being jealous.
    characters: [calvin, hobbes]
  "19881127":
    transcript: If I was in charge, we'd never see grass between October and May. On 'THREE,' ready? One... two... three! SNOW! I SAID SNOW! C'MON! SNOW! SNOW! OK, then, don't snow! See what I care! I LIKE this weather! Let's have it forever! PLEEAASE snow! Please?? Just a foot! Ok, eight inches! That's all! C'mon! Six inches, even! How about just six?? I'M WAAIITING... RRRRGGHHH DO YOU WANT ME TO BECOME AN ATHEIST?
    description: Calvin looks to the heavens and yells for snow.  He keeps yelling for it to snow.  Then he says he doesn't care. He likes this weather and hopes it stays like that forever.  He gets to his knees to beg for snow.  He clutches his hands together in prayer.  He just wants a foot, then eight inches, then he'd settle for six.  He yells that he's waiting.  He runs around in circles. Finally, he stops.  He looks again to the heavens and asks "Do you want me to become an atheist".
    characters: [calvin]
  "19881128":
    transcript: WHO MADE THIS MESS OUT HERE?! It wasn't ME, Mom, it was... uh... it was... it was a horrible little venusian who materialized in the kitchen! He took out some diabolical high-frequency device, pointed it at various objects, and... mothers are the necessity of invention.
    description: Mom yells asking who made the mess.  Calvin says it wasn't him, it was a horrible little Venusian who materialized in the kitchen.  He continues explaining this creature had a diabolical high-frequency device and pointed it at various objects.  Calvin sits on his bed saying "Mothers are the necessity of invention".
    characters: [calvin, mom]
  "19881129":
    transcript: I'M HO-OME! KAPOW What did you do, step on a land mine? When's Dad ever going to build that tiger pit I keep asking him about?
    description: Calvin comes home from school.  KAPOW!  Hobbes pounces on Calvin.  Calvin walks in all disheveled. Mom asks if he stepped on a land mine.  Calvin asks when Dad is going to build the tiger pit he keeps asking him about.
    characters: [calvin, hobbes, mom]
  "19881130":
    transcript: Calvin, where are you? Get out here! Come on, Calvin, I'm getting tired of this. I MEAN it, Calvin! Come out and take your bath! NOW! Sooner or later she's going to have to question whether this is really worth the trouble.
    description: Mom is looking for Calvin.  She comes up the stairs asking where he is.  She looks in a closet and says she's getting tired of this.  She says she means it and wants him to come out for his bath.  Calvin is outside his bedroom window sitting on the roof.  He says sooner or later, Mom's going to have to question whether this is worth all the trouble.
    characters: [calvin, mom]
  "19881201":
    transcript: I wish it would snow eight feet in the next five minutes so they'd have to close school. C'mon, snow! Snow snow snow snow snow snow snow snow! So close... and yet so far.
    description: Calvin is standing waiting for the bus.  He looks up and says he wishes it would snow eight feet in the next five minutes so they'd have to close school.  He grits his teeth and clenches his fists, wishing for snow.  Something's coming down. Unfortunately for Calvin, it's rain.  Calvin is now standing in the rain waiting for the bus.  He says it was so close, yet so far.
    characters: [calvin]
  "19881202":
    transcript: You think God lets you plea bargain? I'd worry more about your Mom.
    description: Calvin and Hobbes are standing in the middle of a totally demolished living room.  Calvin is holding a bat, Hobbes a ball.  Calvin asks Hobbes if he thinks God lets you plea bargain.  Hobbes says he'd worry more about Mom.
    characters: [calvin, hobbes]
  "19881203":
    transcript: Hello? Hi, Dad! It's me, Calvin. Will you tell me a story? Calvin, I'm at work! I don't have time to tell you a story now. I'm very busy! Get off the phone. I'm expecting important calls. OK, Dad. I'll just stay here quietly growing up at an unbelievable rate, never spending much special time with my own Dad who's always working. Right, right. This is the story of the hydraulic pump (Fig. 1), the wheel shaft flange (Fig. 2), and the evil patent infringement. I want a GOOD story.
    description: Calvin calls Dad at work to ask him to tell a story.  Dad tells Calvin he's busy and doesn't have time to read a story.  He says he's expecting several calls and to get off the phone.  Calvin tells him he'll stay there growing at an unbelievable rate, never spending much special time with his Dad, who's always working.  Dad starts reading a story about a hydraulic pump, the wheel shaft flange, and the evil patent infringement.  Calvin says he wants a good story.
    characters: [calvin, dad]
  "19881204":
    transcript: Who is this mysterious masked man?? KAPWINGG! And why has he never been photographed together with handsome, 6-year-old millionaire playboy Calvin? A solitary caped figure runs across the moonlit building top! A crimson bolt blasts across the night sky, striking fear into the hearts of all evildoers! Yes, it's STUPENDOUS MAN, champion of liberty, defender of free will! Some diabolical fiend threatens to establish a totalitarian system of rule! Only STUPENDOUS MAN can save the day! Aha! Just as I suspected! My evil archnemesis, MOM-LADY! Didn't I tell you to go to bed?!? Oh, no! Stupendous Man's stupendous powers are no match against his adversary! Stupendous Man is vanquished! This would have been plenty humiliating WITHOUT the goodnight kiss. And take off that silly hood before you smother over in your sleep.
    description: It's Stupendous Man, champion of liberty, defender of free will.  Some fiend plans to establish a totalitarian system of rule.  It's as he expected.  It's his arch-enemy, Mom lady.  Calvin has his hood and cape on, and Mom says she told him to go to bed.  As Mom carries him up the stairs to bed, Calvin says Stupendous Man's powers are no match against his adversary.  Stupendous Man is vanquished.  After being placed in bed, Calvin wipes his cheek.  He says this would have been plenty humiliating without the goodnight kiss.  Mom tells him to take off the silly hood before he smothers in his sleep.
    characters: [calvin, mom, stupendous]
  "19881205":
    transcript: Spiff's spacecraft is immobilized! The navigatron has shorted out! A zillion miles from any planet, our hero must climb out and fix it himself in zero gravity! Upside down, Spiff clings tightly to his spaceship! One slip will send him hurling into the horrors of the infinite beyond! GO... TO... SCHOOL! NO!
    description: Spaceman Spiff's spacecraft is immobilized.  Our hero must climb out and fix it in zero gravity.  Upside down, Spiff clings to the spaceship.  One slip will send him hurling into the horrors of the infinite beyond.  Calvin is hanging upside down, holding onto both sides of the doorway while Mom tries to push him out the door to go to school.
    characters: [calvin, mom, spiff]
  "19881206":
    transcript: I don't understand how Santa runs his operation. How can he afford to give toys away? How does he pay for the raw materials he uses to make the toys? How does he pay his elves? There's no income to cover his costs. How does he do it? Deficit spending, I guess. Sure, but sooner or later it's going to catch up to him, and then where will I be?!
    description: Calvin can't figure out how Santa runs his operation.  He asks how Santa can give toys away.  He asks Hobbes how Santa buys raw materials for the toys and how he pays the elves.  There's no income to cover the costs.  How does he do it?  Hobbes suggests deficit spending.  Calvin agrees, but wonders where he'll be when it all catches up to Santa.
    characters: [calvin, hobbes]
  "19881207":
    transcript: Dear Santa, Hi, it's me, Calvin. This year I've been extra good, so PBTBT!! MMF MMF EEP! Perhaps you need a drink of water. I think I do.
    description: Calvin is writing to Santa.  He writes that this year he's been extra good. Hobbes, looking over Calvin's shoulder, starts laughing and holds his paws over his mouth.  He turns away, continuing to fight the laughter.  Calvin looks at him with squinted eyes and a frown.  He suggests perhaps Hobbes needs a drink of water.  Laughing, Hobbes agrees and leaves.
    characters: [calvin, hobbes]
  "19881208":
    transcript: Want to read my letter to Santa? All THAT?! I hope I didn't forget to ask for something I want. This is alphabetized. Yeah, and I cross-indexed the accessory items he'll need to get. I try to help him out. This says "Volume One". "Atom Bomb" through "Grenade Launcher". You're going to be one sad little kid on Christmas morning.
    description: Calvin brings a bunch of paper to Mom and asks if she wants to read his letter to Santa.  He hopes he didn't forget to ask for something he wants.  Mom notices the list is alphabetized.  Calvin says he cross-indexed the accessory items Santa will need to get.  Mom says the papers say "Volume One".  Calvin tells her it's "atom bomb" through "grenade launcher". Mom says he's going to be one sad little kid on Christmas morning.
    characters: [calvin, mom]
  "19881209":
    transcript: It snowed last night! Turn on the radio! Maybe they closed school! Maybe the school buses all froze up! Maybe the principal can't get out of his driveway! Get dressed, Calvin. It only snowed an inch. Getting an inch of snow is like winning 10 cents in the lottery.
    description: Calvin looks out the window and sees it snowed.  He asks Mom to turn on the radio to see if they closed school.  He hopes the buses froze up and the principal can't get out of his driveway.  Mom tells him to get dressed.  It only snowed an inch.  As Calvin walks to the bus, he says getting an inch of snow is like winning ten cents in the lottery.
    characters: [calvin, hobbes, mom]
  "19881210":
    transcript: A lone knight charges up the hill towards the giant cave at the top. Immediately the monstrous dragon lunges out and spews a raging fireball! The knight is fried to a crunchy crips... his armor fused into a solid piece! The dragon cricles overhead, daring other fools to come after him! Did you brush your teeth? Come here and see!
    description: A lone knight charges up the hill toward the giant cave at the top.  The monstrous dragon lunges out and spews a fireball.  The knight is fried to a crisp.  The dragon circles overhead, daring other fools to come after him.  Calvin is in bed with a nasty grin.  Mom asks if he brushed his teeth.  Calvin tells he to come and see.
    characters: [calvin]
  "19881211":
    transcript: Here we are at the top of "Dismemberment Gorge". Ready to go down? How about if I steer this time? Get on, you big sissy. I've been good all day so far. Christmas is getting near, huh? You got it. I've been wondering, though. Is it truly being good if the only reason I behave well is so I can get more loot at Christmas? I mean, really, all I'm doing is saying I can be bribed. Is that good enough, or do I have to be good in my heart and spirit? In other words, do I really have to BE good or do I have to ACT good? I suppose in YOUR case, Santa will have to take what he can get. OK... so exactly how good do you think I have to act? REALLY good, or just PRETTY good?
    description: Calvin and Hobbes are sledding down the hill.  Calvin says he's been good all day so far.  Hobbes asks if Christmas is getting near.  Calvin wonders if it's truly being good if the only reason he behaves is to get more loot at Christmas. All he's doing is saying he can be bribed.  He wonders if that's good enough, or does he need to be good in heart and spirit. As they crash into a tree and go flying, Calvin asks if he really has to be good or does he just have to act good.  Hobbes, covered in snow, says in Calvin's case, Santa will have to take what he can get.
    characters: [calvin, hobbes]
  "19881212":
    transcript: I'm gonna pound you in gym class, shrimp. Get your kicks now, you glandular freak, because once you grow up you can't go beating people up for no reason. Yeah, I guess you're right. That really wasn't what I meant at all.
    description: Moe tells Calvin he's going to pound him in gym class.  As Moe walks away, Calvin tells him to get his kicks now.  He calls him a glandular freak.  He says once Moe grows up, he won't be able to beat people up for no reason.  Moe comes back, rolling up his sleeve, saying Calvin is right.  Calvin, stuffed halfway through his locker door, says that wasn't what he meant at all.
    characters: [calvin, moe]
  "19881213":
    transcript: What grade did you get? I got an "A". Really? Boy, I'd hate to be you. I got a "C". Why on earth would you rather get a "C" than an "A"?! I find my life is a lot easier the lower I keep everyone's expectations.
    description: Calvin asks Susie what grade she got.  She happily replies an "A".  Calvin says he'd hate to be her.  He got a "C".  Susie asks why on earth would he rather get a "C" than an "A".  Calvin tells her he finds his life is a lot easier the lower he keeps everyone's expectations.
    characters: [calvin, susie]
  "19881214":
    transcript: Why do I have to wear these dorky clothes and get my hair combed?! Your Dad's going to take your picture. Hold still. I don't WANT to get my picture taken! It will just a few minutes. We're going to put the pictur eof you in our Christmas cards so everyone can see what you look like now. What a dumb idea. Why are we doing that? So we won't have relatives dropping by to visit. DEAR...
    description: Calvin is getting dressed.  He asks if he has to wear the dorky clothes and get his hair combed.  Mom tells him that Dad is going to take his picture.  They're going to put a picture of Calvin in their Christmas cards so everyone can see what he looks like now.  Calvin replies that's a dumb idea.  He wonders why they're doing that.  Dad says it's so they won't have relatives dropping by to visit.
    characters: [calvin, mom, dad]
  "19881215":
    transcript: Ready? OK, give me a nice smile. That's good. One... two... three! CLICK My hair's getting messed up, Dad!
    description: Dad aims the camera.  He asks Calvin for a nice smile.  Dad starts the count.  Calvin is sitting nicely with a pleasant smile on his face.  When the count reaches three, Calvin makes a weird face.  CLICK!   Dad chases Calvin.  Calvin tells Dad that his hair is getting messed up.
    characters: [calvin, dad]
  "19881216":
    transcript: I don't have much film left, so stop making faces when I take the picture, or your name's mud. You could've been done 20 minutes ago if you'd just cooperated. Now give me a smile and hold it for two seconds. CLICK CALVIN! THAT WAS A SMILE! I SMILED!
    description: Calvin is sitting on the stool again.  Dad tells him he doesn't have much film left.  He tells him to quit making faces.  He says he would have been done 20 minutes ago if Calvin had cooperated.  He tells Calvin to give him a smile and hold it.  Calvin partly closes his eyes and opens his mouth strangely.  CLICK!  Dad yells.  Calvin claims that was a smile.
    characters: [calvin, dad]
  "19881217":
    transcript: We can't send these in our Christmas cards. People will think it's sacrilegeous. Well, these DO look like Calvin... except for the combed hair.
    description: There are photos Mom and Dad are looking at.  One looks like Calvin had sucked a lemon, one has him shaking his face back and forth, one has him leaned back so you see up his nose, one has his looking backward.  Dad says they can't send those in the Christmas cards, people would think it's sacrilegious.  Mom says the pictures do look like Calvin, except for the combed hair.
    characters: [calvin, mom, dad]
  "19881218":
    transcript: Ahh... the perfect slushball! Hard enough to sting, yet sloppy enough to dribble down the collar and soak the undergarments. Here comes Susie. Now's my chance to hit her with the slushball! I see you! You'd better not throw that! Santa Claus is watching you right now! ZINGG FWISSHHH! WHAP! Oh yes! YES! It was worth it! What a shot! I'm not sorry! Oh, it was beautiful! I'd do it again in a minute! Ha ha! Santa's gonna skip this block for years.
    description: Calvin has a slushball.  He sees Susie coming and says this is his chance.  Susie sees him cocking his arm.  She tells him he'd better not throw the slushball.  Santa Claus is watching him right now.  Calvin stops, and he thinks.  Finally, he lets loose the slushball.  WHAP!  Calvin rejoices.  He says it was worth it.  He's not sorry.  It was beautiful, and he'd do it again in a minute.  He laughs.  Suddenly, he sees Susie coming after him.  He runs.  Calvin, now buried in snow, says Santa's going to skip this block for years.
    characters: [calvin, susie]
  "19881219":
    transcript: Do you think monsters are under the bed tonight? I don't know. How can you tell without looking? One way is to tell a story about a little kid getting mauled and eaten alive. How does THAT tell you of you have monsters? Sometimes they laugh.
    description: Calvin asks Hobbes if he thinks there are any monsters under the bed tonight.  Hobbes doesn't know.  He wonders how you can tell without looking.  Calvin says one way is to tell a story about a little kid getting mauled and eaten alive.  Hobbes asks how that tells you if you have monsters.  Calvin replies that sometimes they laugh.
    characters: [calvin, hobbes]
  "19881220":
    transcript: I'm freezing! Why do we keep this house so darn cold?! Crank up the thermostat and build a fire, will ya? I have a better idea. C'mere. OK, step outside. Why? What's outside? In a few minutes, you can come in, and then the house will seem nice and warm. I'm telling the newspapers about you, Dad!
    description: Calvin is cold.  He asks why they keep the house so cold.  He tells Dad to crank up the thermostat and start a fire.  Dad has a better idea.  He has Calvin follow him.  He opens the door and asks Calvin to step outside.  Dad closes the door.  He tells Calvin in a few minutes he can come back inside, and the house will seem nice and warm.  Calvin yells back that he's telling the newspapers about him.
    characters: [calvin, dad]
  "19881221":
    transcript: Read me "Hamster Huey and the Gooey Kablooie." Oh, I don't want to read that again. Let's read something different tonight. No I want to hear "Hamster Huey and the Gooey Kablooie." C'mon Calvin, I've read this a thousand times. Read it again. Please? PLEASE? All right, all right. You'll do the squeky voices, the gooshy sound effects, and the happy hamster hop, won't you? Look, can't we read something else?
    description: Calvin asks Dad to read "Hamster Huey and the Gooey Kablooie".  Dad doesn't want to read that again.  He asks to read something different tonight.  Calvin wants "Hamster Huey".  Dad says he's read it a thousand times.  Calvin puts his hands together and begs Dad to please read it.  Dad agrees.  Calvin asks for him to do the squeaky voices, the gooshy sound effects, and the happy hamster hop, also.  Dad asks if he can't read something else.
    characters: [calvin, dad]
  "19881222":
    transcript: MOMM! MOM! What is it? What's the matter? Do people grow from spores? SPORES?!? You wake me up at 2 am to ask if people grow from spores? Are you out of your mind?? Why are you even awake?! Go to sleep!! She didn't answer. She must not know. I'm telling you, it's true.
    description: Mom wakes up to hear Calvin calling loudly for her.  She goes to his room and asks what's the matter.  Calvin asks if people grow from spores.  Mom yells that it's 2 AM and he is asking her if people grow from spores.  She asks if he's out of his mind.  She wonders why he's even awake.  She tells him to go to sleep.  After she leaves, Calvin tells Hobbes she didn't answer, so she must not know.  Hobbes says it's true.
    characters: [calvin, hobbes, mom]
  "19881223":
    transcript: I say it's a fallacy that kids need 12 years of school! Three months is plenty! Look at me. I'm smart! I don't need 11 1/2 more years of school! It's a complete waste of my time! How on earth did you get all the way to the bust stop with both feet through one pant leg? I fell down a lot. ...Why? What's your point? Nothing. I was just curious.
    description: Calvin says it's a fallacy that kids need 12 years of school.  He says three months are plenty.  He offers himself as an exhibit.  He's smart.  He doesn't need 11 1/2 more years of school.  It's a waste of time.  Hobbes asks him how he got all the way to the bus stop with both his feet through one pant leg.  Calvin says he fell down a lot.  He asks Hobbes what his point is.  Hobbes rolls his eyes and says he was just curious.
    characters: [calvin, hobbes]
  "19881224":
    transcript: How's my peanut butter sandwich coming? You're using chunky peanut butter, right? I won't eat smooth! Make it an open face sandwich too! Don't put any jelly on it or anything! And use some normal bread! I don't like those weird grain breads! Did you cut it diagonally? I like triangles better than rectangles, so be sure to cut it right! Your majesty's sandwich. HEY, this is a closed-face, horizontally cut, smooth peanut butter sandwich on weird bread with jelly! Weren't you LISTENING?!
    description: Calvin asks Mom how his peanut butter sandwich is coming.  He reminds her to use chunky, because he won't eat smooth.  He wants it open face.  He tells her not to put jelly on it and use normal bread.  He doesn't like those weird grain breads.  He asks her if she cut it diagonally.  He likes triangles more than rectangles, so he tells her to cut it right.  Mom sets the sandwich down and says "Your majesty's sandwich".  Calvin looks at the sandwich.  He complains he got a closed-face, horizontally cut, smooth peanut butter sandwich on weird bread with jelly.  He asks if Mom wasn't listening.
    characters: [calvin, mom]
  "19881225":
    transcript: I'm leaving out a sandwich for Santa. That's nice. What do you think he'd like with that? Some milk? I think "Santa"would rather have a cold beer. DEAR! Psst! Wake up! It's Christmas! Are you sure? It's still dark out. It's four in the morning! Let's see if santa left our loot yet! Oh boy! We'll let Mom and Dad sleep another hour, but we can at least count all our packages. I get to plug in the tree lights! Ha ha! Look at all this booty! Let's see which ones are for me! Here's one for you. Strange that Santa would go to the trouble to wrap a box of coal. Har har. Here's one for Mom. Here's one for me...This one is for Dad... Hey, were are YOUR presents? Santa goofed up! Good thing tigers are naturally gifted to begin with. MOMM! DAAD! SANTA DIDN'T BRING HOBBES ANYTHING! Uh oh. think quick, Dear. It had better be a lot later than it feels like. Well, here's a present from ME anyway. Hope it fits. The best presents don't come in boxes. I'll treasure this one forever.
    description: Calvin wakes Hobbes up and tells him it's Christmas.  Hobbes asks if he's sure, since it's still dark outside. Calvin says it's four in the morning.  He hops out of bed.  He asks Hobbes to see if Santa left their loot yet.  He says he'll let Mom and Dad sleep another hour, but they can at least count their packages.  Calvin sees all the presents.  Hobbes hands him one and says it's strange Santa would go to the bother to wrap a box of coal.  Calvin starts dividing up the presents by who's getting them.  He thinks Santa goofed up.  Hobbes hasn't gotten any gifts.  Calvin yells to Mom and Dad that Santa didn't get Hobbes anything.  Calvin hugs Hobbes and tells him it's a present from him.  He hopes it fits.  Hobbes tells him the best presents don't come in boxes.  He'll treasure it forever.
    characters: [calvin, hobbes, mom, dad]
  "19881226":
    transcript: There's nothing prettier than new fallen snow on a clear freezing moonlit night. ...through a window, that is.
    description: Calvin and Hobbes look out the window to the evening.  The moon is shining in the sky, snow is on the ground.  Calvin says there's nothing prettier than new fallen snow on a clear, freezing, moonlit night.  Then he adds, "through a window, that is".
    characters: [calvin, hobbes]
  "19881227":
    transcript: I can't take bath in this! The water's BOILING! I'll scald myself! What are you trying to do, cook me alive?? Well, forget it! I'm not getting in! By the time you quit fussing, complaining, yelling and screaming and actually take off your clothes and get it, the water will be perfect. Boy, does she know me.
    description: Calvin points to the full bathtub and says he can't take a bath in that.  The water's boiling, and he'll scald himself.  He asks Mom if she's trying to cook him alive.  Mom opens the bathroom door and says by the time he quits fussing, complaining, yelling and screaming, takes off his clothes and gets in, the water will be fine.  Calvin does and says his Mom really knows him.
    characters: [calvin, mom]
  "19881228":
    transcript: Every day I have to get up and go to school. Nothing ever changes. It's just school, school, school. But not today. Today, I go for the gusto. I think you should ask your Mom if it's OK.
    description: Calvin is getting dressed.  He complains every day he has to get up and go to school.  He says nothing ever changes.  It's just school, school, school.  But today, he goes for the gusto.  He dresses in a space helmet and cape.  Hobbes suggests Calvin should ask Mom if it's okay.
    characters: [calvin, hobbes]
  "19881229":
    transcript: Boy, did I get into trouble at school today. Wow. What happened? I don't even want to talk about it. Did it have anything to do with all those sirens about noon? I SAID I didn't want to talk about it.
    description: Calvin tells Hobbes that he really got in trouble in school today.  Hobbes asks what he did, but Calvin doesn't want to talk about it.  They walk on a bit more.  Hobbes asks if it has anything to do with all those sirens about noon.  Calvin tells him he said he didn't want to talk about it.
    characters: [calvin, hobbes]
  "19881230":
    transcript: Did you bring something for show and tell? You bet! I brought these charred rocks and ashes from my backyard. See? Dramatic proof that UFOs landed not a hundred feet from my house. Their retro rockets burned solid rock into this fragile grey dust cube! This is an old charcoal briquette. Even as we speak, aliens are undoubtedly infiltrating the highest levels of our government.
    description: Susie asks if Calvin brought something for show and tell.  Calvin says yes.  He brought some charred rocks and ashes from his back yard.  He says it's dramatic proof UFO's landed near his house.  Their retro rockets burned solid rock into a fragile gray dust cube.  Susie looks at it.  She says it's an old charcoal briquette.  Calvin says as they speak, aliens are infiltrating the highest levels of our government.
    characters: [calvin, susie]
  "19881231":
    transcript: Disgusting denizen of the deep, the giant octopus glides across the ocean floor. At the sigh of an enemy, he releases a cloud of ink and makes his getaway! MISS WORMWOOD!
    description: The giant octopus glides across the ocean floor.  At the sight of an enemy, he releases a cloud of ink and makes his getaway.  Susie is covered with ink, raising her hand and calling for Miss Wormwood.
    characters: [calvin, susie]
