  "19880606":
    transcript: You know what we need, Hobbes? We need an attitude. An attitude? Yeah. You can't be cool if you don't have an attitude. Really? Sure. They're all the rage. Now what kind of attitude could WE have? We could be courteously deferential. Oh, good. That's REAL cool.
