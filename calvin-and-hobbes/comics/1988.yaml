  "19880319":
    transcript: This book says tigers are territorial and won't share their ground with other tigers. I guess we'd better divide up the woods then. This will be my territory, and that will be yours. This rock will separate our two sides. As another tiger, you are hereby banished from this side of the rock. Ha ha ha! Look what I'm doing! You cut that out!
