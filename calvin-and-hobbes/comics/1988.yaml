  "19880508":
    transcript: The call goes out! We're on the move! Up through the winding maze! Faster! Faster! Calvin scrambles up the grainy tunnel! Out he pops into the blinding sun! Calvin the and rushes down the hill to the brick walk! Other ants rush around him in their mad hurry! Calvin tries to keep up! At least he reaches the monstrous dead caterpiller! Without pausing, he hoists it up! The queen demands his tireless toil! Calvin is back off to the ant-hill as fast as he can go! Work, work, work! That's what I'm good for around here! I hardly think picking up your room once in a while qualifies you as a slave.
