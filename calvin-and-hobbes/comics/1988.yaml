  "19880320":
    transcript: Uh oh, I'll bet Hobbes is waiting to spring on me as soon as I open the front door! I know I'll sneak around back and surprise him! Heh heh! There he is all ready to pounce! What a sucker! I'm home! I've got to start listening to those quiet, nagging doubts.
