  "19880516":
    transcript: HOBBES! You've got to help me! I'm in big trouble! What's the matter? You know how Dad said I could use his binoculars as longs as I was extra careful with them? Well, I just broke them by accident! Now I need some advice. Should I run away, or commit hara-kiri? Over the binoculars? Yeah. Maybe both.
