  "19880416":
    transcript: Eight, nine, ten! Here I come, ready or not! All right, give 'em back!
    description: Calvin and Hobbes are playing hide-and-seek.  Hobbes counts to ten, while Calvin hides behind a barrel. After some time, Calvin realizes.  He goes back into the house to catch Hobbes sitting on the floor reading comic books.
    characters: [calvin, hobbes]
  "19880417":
    transcript: I call this 'lookout' hill. Yes, you can certainly see far from up here. I call it 'lookout' hill because that's what you yell whenever we go down it. You know, sometimes it seems things go by too quickly. We're so busy watching out for what's just ahead of us that we don't take the time to enjoy where we are. Days go by and we hardly notice them. Life becomes a blur. Often it takes some calamity to make us live in the present. Then suddenly we wake up and see all the mistakes we've made. But it's too late to change anything. It's like ... it's like ... It's like what? It's like SOMEthing ... I just can't think of it.
    description: Calvin and Hobbes are riding their wagon down the hill.  Calvin says sometimes things go by too quickly as they roll down the hill.  They're so busy watching where they're going to enjoy where they are as they watch the path of the wagon.  They don't notice days going by.  It's all a blur as they gain speed down the hill.  It often takes a calamity to make them live in the present as they sail off the hill.  Then Calvin says they see their mistakes, but it's too late to change anything as the wagon falls off below them.  Calvin says "it's like..." as they fall from the sky.  Hobbes asks what it's like.  Calvin says "it's like something, but he can't think of it".
    characters: [calvin, hobbes]
  "19880418":
    transcript: Here I am, waiting for the bus. Eleven more years of school to go. Then college, then maybe graduate school, and then I work until I die. What kind of world is this?! You only get five years to be a kid?? What about exploring and discovering and playing? Those things are important too! Well, you still have afternoons and weekends. That's when I watch TV.
    description: Calvin is waiting for the school bus.  He says he has eleven more years to go, then college, then maybe graduate school.  He'll then work until he dies.  He complains that he only gets five years to be a kid.  When he bemoans not being able to explore, discover, and play, Hobbes points out that he still has afternoons and weekends.  Calvin tells him that's when he watches TV.
    characters: [calvin, hobbes]
  "19880419":
    transcript: Look, Hobbes, I got a model airplane. Want to help me build it? Sure. Wow, a Phantom jet. Look at all the little pieces. Here, you put those pieces together, and I'll do these. Then we'll stick yours on mine, OK? Shouldn't we read the instructions? Do I LOOK like a sissy?
