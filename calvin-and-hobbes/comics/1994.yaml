  transcript: Here's the latest poll on your performance as Dad. Your approval rating is pretty low, I'm afraid. That's because there's not necessarily any connection between what's good and what's popular. I do what's right, not what gets approval. You'll never kep the job with THAT attitude. If someone else offers to do it, let me know.
