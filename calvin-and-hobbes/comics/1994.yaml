"19940319":
  transcript: I couldn't believe it! The bell rang just as the teacher was about to collect the homework I didn't do! That's twice you've been saved at the last minute. But I've learned my lesson THIS time. From now on, it's work before pleasure! No exceptions! And it will be a PLEASURE to have that homework done! C'mon, let's work on a snowman. No exceptions.
