"19940114":
  transcript: Some people complain all the time! They complain about the least little thing! If something bugs them, they never let go of it! They just go on and on, long after anyone else is interested! It's just complain, complain, complain! People who gripe all the time really drive me nuts! You'd think they'd change the subject after a while, but they never do! They just keep griping until you start to wonder, "What's wrong with this idiout?" But they go on complaining and repeating what they've already said! Maybe they're not very self-aware. Boy, that's ANOTHER thing that gets on my nerves!
