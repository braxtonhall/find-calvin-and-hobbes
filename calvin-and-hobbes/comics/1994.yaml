"19940302":
  transcript: I saw a sing on a restaurant door that said, "No shirt, no shoes, no service." But it didn't say anything about PANTS! If I went in wearing shoes and a shirt, but no pants, they'd have to serve me! They'd probably serve you with a court summons. C'mon, let's see if Mom will take us out for dinner!
