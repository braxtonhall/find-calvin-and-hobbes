  transcript: My homework exploded! Somebody pull the fire alarm! Help!! It's out of control! It's spreading! Aughh! Put it out!! Young man, I'm tired of these constant disruptions! It's not my fault! It was an accident! Maybe THIS will teach you a lesson! Ha ha ha! No! No! Ackk! Help! Get the PTA! Miss Wormwood's an alien!
