"19940312":
  transcript: Wow, listen to the wind howl. It's really snowing! Pretty creepy. Things are ALWAYS creepy at 2:00am. Hey, I'll bet tomorrow's a snow day! I'll bet they close the schools! Let's call the superintendent and see! If tomorrow's a snow day, we can go right back to bed! ...or maybe we will anyway. Who IS this?!? You have two seconds to improve my mood.
