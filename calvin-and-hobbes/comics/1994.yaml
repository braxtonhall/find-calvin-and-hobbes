"19940123":
  transcript: How unoriginal! How hehune! Stupid kid. If you don't have anything to say, just keep quiet! Well, this is certainly shocking! Face it, kid, provoking a reaction isn't the same thing as saying something significant! Look, pal, there's no point expressing ideas if you can't make them understood! You're just babbling to yourself! And aren't we all bored with the irony byy now?You just THINK you're above it all, kid! I tell you Hobbes, it's tough being the sole guardian of high culture. Talent like ours carries such enormous responsibility.
