"19940228":
  transcript: Should I stay inside or go out? It's awfully cold out, but I suppose I could bundle up. It looks windy though. But still, I'd like to go sledding. Then again, maybe I'd rather stay in. On the other hand... GO OUT AND CLOSE THE DOOR! The more indecisive I am, the faster things get decided.
