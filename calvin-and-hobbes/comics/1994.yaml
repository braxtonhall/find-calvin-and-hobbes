"19940121":
  transcript: I couldn't stand being a girl. I can't stand you either way. When guys grow up, they get to play with cards, sports equipment, cameras, stereos, electric tools... you name it. But girls don't get any toys when they grow up. Women just buy clothes and shoes. How boring. How sad. I guess girls actually mature as they get older. I can't wait until I'm old enough to "putter around".
