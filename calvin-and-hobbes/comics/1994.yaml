"19940313":
  transcript: Look at this! Some idiot dumped trash out here! People seem to forget that others of us have to live on this planet too. You know, I don't understand why humans evolved as such thoughtless, shortsighted creatures. Well, it can't stay that way forever. You think we'll get smarter. That's one of the two possibilities. Maybe we'll stop polluting before it's too late. We're all holding our breath.
