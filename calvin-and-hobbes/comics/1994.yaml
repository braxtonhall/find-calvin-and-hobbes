"19940317":
  transcript: What a busy day! I'm pooped! Mom says the roads are pretty clear, so school will probably open again tomorrow. NOW I wish I'd done my math homework instead of playing outside all day. ...or I wish I'd done it before dinner... or after dinner... or instead of watching TV... or before bed. But now it's too late. A day can really slip by when you're deliberately avoiding what you're supposed to do.
