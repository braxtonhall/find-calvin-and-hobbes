"19940320":
  transcript: Any good mail today? Mm... not really. Here's a "You're not covering the cost of all these mailings" charity request. You've got a "You're not attractive enough" women's magazine with an article on swimsuits that minimize all your body flaws. Here are some "You're not stylish or ostentatious enough" catalogs... and coincidentally, an invitation to go deeper in debt from a credit card company. And here's our news magazine to identify the trend of the week we're missing... and I got a hobby magazine featuring new equipment I ought to have. Yikes. ...Why do I get the feeling that society is trying to make us discontented with everything we do and insecure about who we are? I suppose if people thought about real issues and needs instead of manufactured desires, the economy would collaps and we'd have total anarchy. So pitching this junk would make me some kind of terrorist, huh? Yep. It's our patriotic duty to buy distractions from a simple life. Hey Mom, I saw a bunch of products on TV that I didn't know existed, but I desperately need!
  description: Mom asks Dad if there was any good mail.  Dad says there's a charity request and a women's magazine with an article on swimsuits that minimize all body flaws.  There are catalogs and an invitation to go deeper in debt from a credit card company.  He sees a new magazine identifying trends they're missing and a hobby magazine showing equipment he must have.  He asks why he gets the feeling society is trying to make them discontented with everything they do and insecure about who they are.  Mom supposes if people thought about real issues instead of manufactured desires, the economy would collapse.  Dad asks if throwing the mail out would make him some kind of terrorist.  Mom says it's their patriotic duty to buy distractions from a simple life.  Calvin comes in saying he saw products on TV he didn't know existed, but he desperately needs.
