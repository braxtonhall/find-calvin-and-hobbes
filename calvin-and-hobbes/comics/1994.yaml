"19940202":
  transcript: Look, Mom, I made you some subtitles. Hmm? When you're talking to me, you choose the appropriate card to translate what you're saying, and prop it against your feet for me to read. For example, if you say "Go to bed NOW," you can use this card, which says, "You've got ten minutes until I blow my stack." See? Then I'll know what you mean. I don't need translation! I've even got subtitles for parentisms like "You're going to poke somebody's eye out with that."
