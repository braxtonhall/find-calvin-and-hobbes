"19940314":
  transcript: Time to get up, Calvin. Is it a snow day? Did they close the schools? I've got the radio on, so we'll hear. Get ready anyway, though. Oh man, I hope I hope I hope. If school's closed, I'll have the whole day to do the math homework I forgot yesterday. If school's open, I'm in big trouble. Suddenly I feel extremely religious. Another deathbed conversion.
