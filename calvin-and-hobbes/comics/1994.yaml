"19940213":
  transcript: You got something in the mail. It looks like a Valentine card. Huh? Open it up! It IS a valentine! Who would send me a valentine? Read it! Read it! "Roses are rd, violets are blue, tu-lips are what we'll be kissing, woo woo! Love, Susie." AAAUGGHH! Ho HO! Muchas smooches for el conKISStador! This can't be happening! It's all a nightmare! Some horrible hallucination! Susie loves Calvin! Calvin loves Susie! I've got to pull myself together! What can I DO? My natural studliness has overwhelmed Susie's fragile grip on reality! Big, sloppy smackers! Smmmrppp! Hey, there's Susie now! She's coming this way! Oh NO! Quick! A slushball! I need a slushball! Hi Cal... OOMP!! THAT'S what I think of your mushy Valentine card! POW! I didn't send you a Valentine card, you smelly, snot-nosed troll! Why on earth would I send a valentine to YOU?? You didn't? But... but... I'm telling! ... then who...?? Matchmaker, matchmaker, make me a match... YOU!! You write that card! You tricked me!! Wheeeeee! Love makes the world go round! You're gonna see STARS go round, I promise!
