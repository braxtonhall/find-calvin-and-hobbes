  transcript: Hobbes, wake up! I forgot to do my math homework! It's two in the morning. But Miss Wormwood's going to collect it tomorrow! If I don't have it, she'll kill me! I had a nightmare about it! C'mon, we'll have to do the assignment now, while there's still time! This feels like a nightmare too. Do you think if we woke up Mom, she'd let us have coffee?
