"19940301":
  transcript: "I like following the news!  News organizations know I won't sit still for any serious discussion of complex and boring issues. They give me what I want: antics, emotional confrontation, sound bites, scandal, sob stories and popularity polls all packaged as a soap opera and horse race! It's very entertaining. Then commentators wonder why the public is cynical about politics. You can tell this is an in-depth story, because it's got an article next to the chart."
  description: "Calvin tells Hobbes he likes following the news.  He says they give him what he wants:  antics, sound bites, scandal and popularity polls packaged as a soap opera.  He says it's entertaining.  Hobbes says commentators wonder why the public is cynical about politics.  Calvin says you can tell this is an in-depth story because it's got an article next to the chart."
