"19940315":
  transcript: Ha ha! They just announced the schools are closed! It's a snow day! WHEEEEEEE! Yes! Yes! Yes! Yes! Talk about luck! Now you can do your homework and you won't get in trouble! Right, but there's over two feet of snow that requires our immediate and undivided attention. First things first. Math will still be there when the snow melts.
