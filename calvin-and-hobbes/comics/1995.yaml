"19950121":
  transcript: Snow sharks? That guy's a goner.
  description: Calvin builds a snowman, looking like he's swimming.   Behind the snowman, he builds small curved mounds.  Hobbes asks if they're snow sharks.  Calvin says the guy is a goner.
