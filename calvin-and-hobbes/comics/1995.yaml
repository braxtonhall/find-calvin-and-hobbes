"19950207":
  transcript: Mom says the tooth fairy might give me 50 cents for this tooth. Wow! So I got an idea.  poured plaster over this tooth to make a mold, and now I'm casting duplicate teeth. I'll put one under the pillow every night, and by the end of the year, I'll have over 150 dollars! Do you think the tooth fairy will believe your mouth had 300 teeth in it? If she'd rather have an old tooth than 50 cents, how bright can she be?
  description: Calvin tells Hobbes that Mom told him the tooth fairy might give him fifty cents for his baby tooth.  Calvin got an idea to pour plaster over the tooth to make a mold.  Now he's casting duplicate teeth.  He'll put one under the pillow every night.  By the end of the year, he'll have over $150.  Hobbes asks if he thinks the tooth fairy will think he had 300 teeth in his mouth.  Calvin asks how bright she can be if she'd rather have an old tooth than fifty cents.
