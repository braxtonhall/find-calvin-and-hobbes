"19950809":
  transcript: We rely on sight to confirm the existence of things. We don't believe in things we can't see. So how do we know that no-see-ums exist? Verification is ruled out by definition! It's an ontological quandary. Hold still a moment. Ooh, I itch! Glad I could help.
