"19950208":
  transcript: Look at this hilarious cartoon I drew! See, this snowman is in a snow car and he says, "Darn it, the engine froze up!" Ha ha ha ha! Get it?? But if the car is made of snow, the engine would MELT if it wasn't frozen. Either way, it wouldn't run.
  description: Calvin shows Hobbes a cartoon he drew.  Calvin explains that it shows a snowman in a car saying "Darn it, the engine froze up".  Calvin laughs.  Hobbes says if the car is made of snow, the engine would melt if it wasn't frozen.  Either way, it wouldn't run.  Calvin crumples up the paper and frowns.
