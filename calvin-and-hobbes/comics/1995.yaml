"19950419":
  transcript: Ah! I got the letter I wrote to myself! What did you write? "Dear Calvin, Hi! I'm writing this on Monday. What day is it now? How are things going? Your pal, Calvin." My past self is corresponding with my future self. Too bad you can't write back.
  description: Out of the mailbox, Calvin gets a letter he wrote to himself.  He reads it to Hobbes.  It asks what day it is, since he's writing it on Monday.  Calvin says his past self is corresponding with his future self.  Hobbes says it's too bad he can't write back.
