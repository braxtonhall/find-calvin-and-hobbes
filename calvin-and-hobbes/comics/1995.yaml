"19950808":
  transcript: Almost everywhere you go, you can hear people, radios and all kinds of engines. When you're actually confronted with the stillness of nature, it's kind of startling. Why, you can even hear yourself think. This is making me nervous. Let's go in.
  description: Calvin says that everywhere you go, you hear people, radios, and engines.  When you're confronted with the stillness of nature, it's kind of startling.  Hobbes says you can even hear yourself think.  Calvin says this is making him nervous and wants to go in.
