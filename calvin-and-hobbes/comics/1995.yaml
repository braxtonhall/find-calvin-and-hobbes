"19950714":
  transcript: Times are tough for us suburban post-modernists. How so? Well, people seem to be reluctant to pay for sidewalk drawings that stay where they are and wash away in the rain. And nowadays, nobody wants tax money to support art, and corporates won't underwrite me because I'm not famous enough to advertise their cultural enlightenment. Couldn't you support your art with another job? What, you mean WORK?
