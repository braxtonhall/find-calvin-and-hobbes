"19950122":
  transcript: Sighhh... I wish I could go to the moon. I wish you could too. Dear...
  description: Calvin, the astronaut, hops out of the space lander.  He hops in the lunar rover and drives around the surface of the moon.  From space, you can read "Calvin is great" in tire tracks on the surface of the moon.  Calvin looks at the moon with binoculars.  He tells Dad he wishes he could go to the moon.  Dad says he wishes Calvin could, too.  Mom, offscreen, chides him.
  characters: [calvin, mom, dad]
