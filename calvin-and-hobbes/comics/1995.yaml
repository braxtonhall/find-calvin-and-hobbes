"19950730":
  transcript: We all want meaningful lives. We look for meaning in everything we do. But suppose there is no meaning! Suppose life is fundamentally absurd! Suppose there's no reason or truth or rightness in anything! What is nothing means anything? What if nothing really matters? I guess there's no harm in a little wishful thinking. Or suppose everything matters. which would be worse??
