  transcript: Oh boy! It's bedtime! SPROINGG WOOOOOO WULP! FWAPP SHOONK SHOOOSHHH SPLOOSH WAA!! SHOOP FLIP THWUPP OOF! ... Ahhh ... Bedtime. Let's go. Aww, I hate getting ready for bed.
