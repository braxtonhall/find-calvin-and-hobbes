"19950101":
  transcript: The end of the mesozoic era... a herd of chasmosaurs is unusually jittery! They now know they have more to fear than tyrannosaurs! Now they face an even GREATER danger... TYRANNOSAURS in F-14s! This is SO cool! This is SO stupid!
  description: A herd of chasmosaurs is jittery.  They face an even greater danger.  Tyrannosaurs in F-14s.  Playing with his toys, Calvin thinks this is so cool.  Hobbes thinks it's so stupid.
