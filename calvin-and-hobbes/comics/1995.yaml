"19950209":
  transcript: As I have created you, so I can destroy you! Therefore, in recognition of my supreme power, you must worship me! Yes, bow before the mighty Calvin and tremble, for I am the eternal, all knowing... PAFF
  description: Calvin makes a snowman bowing down to him.  Calvin tells him that as he created the snowman, he can destroy it.  He says in recognition of his power, the snowman must worship him.  He tells the snowman to bow before mighty Calvin.  He is the eternal, all knowing....  Susie smacks him from behind with a snowball.
  characters: [calvin, susie]
"19950210":
  transcript: PIFF. I didn't do it! I never threw that! You can't prove I threw it! Besides, I MISSED, didn't I? The defendant petitions the court for a new trial on the grounds that his lawyer is incompetent.
  description: Susie is just missed by a snowball.  Calvin says he didn't do it.  She can't prove he did it.  Then he says that besides, he missed.  Lying in the snow, Calvin says the defendant petitions the court for a new trial on the grounds his lawyer is incompetent.
  characters: [calvin, susie]
"19950211":
  transcript: Hello? Is your mother there? Who's calling?? Is this about ME?! 'cause if it is, I didn't DO it! You got NOTHING on me, understand?! You can't prove ANYthing! I tell you I'm innocent! Just give up! You'll never get me! Oh, here Mom, it's for you. Hi, can I call you back? Go ahead and talk. I cleared it. It's cool.
  description: Calvin answers the phone.  Someone asks if his Mom is home.  Calvin asks who's calling.  He says if this call is about him, he didn't do it.  They have nothing on him.  They can't prove anything.  He says they'll never get him.  He hands the phone to Mom.  She asks if she can call the person back.  Calvin is standing near her saying it's okay to talk.  He cleared it.  It's cool.
  characters: [calvin, mom]
"19950212":
  transcript: PIFF PIFF PIFF PIFF PIFF PIFF PIFF PIFF PIFF Heh heh heh POW! SMACK!
  description: Calvin makes a snowball and runs off.  He hides behind a tree, waiting.  He keeps waiting, and waiting.  Finally, he throws the snowball at the tree and walks off.  SMACK!  Susie hits him with a snowball and laughs at him.  That night, Calvin screams angrily at the sky.
  characters: [calvin, susie]
"19950213":
  transcript: Mmm... somebody's having a fire. I love the smell of a fire on a cold winter day. Isn't it strange how smells are so evocative, but we can't describe them. Oh, I dunno. That fire has a snorky, brambish smell. I should have known animals would have words for smells. It's a little brunky, but low humidity affects that.
  description: Standing outside with Hobbes, Calvin detects the aroma of someone having a fire.  He loves the smell of a fire on a winter day.  He says it's strange how smells are so evocative, but they can't describe them.  Hobbes says the fire has a snorky, brambish smell.  Calvin should have known animals would have words for smells.  Hobbes says it's a little brunky, but the low humidity affects that.
  characters: [calvin, hobbes]
"19950214":
  transcript: You're telling me that animals have their own words for specific smells? Well sure. OK, what's the word for how wet leaves smell? "Snippid." What's the word for how I smell? "Terrible." Woo hoo hoo hoo hoo.
  description: Calvin asks Hobbes if animals have their own words for specific smells.  Hobbes says sure.  Calvin asks what the word is for how wet leaves smell.  Hobbes replies "snippid".  Calvin asks what the word is for how he smells.  Hobbes says "terrible".  Hobbes laughs and runs off.
  characters: [calvin, hobbes]
"19950215":
  transcript: Graphic violence in the media. Does it glamorize violence? Sure. Does it desensitize us to violence? Of course. Does it help us tolerate violence? You bet. Does it stunt our empathy for our fellow beings? Heck yes. Does it CAUSE violence? ... well that's hard to prove. The trick is to ask the right question.
