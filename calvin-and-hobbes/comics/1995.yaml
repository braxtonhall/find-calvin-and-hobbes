"19950713":
  transcript: Art isn't about ideas. It's about style. The most crucial career decision is picking a good "ism" so everyone knows how to categorize you without understanding your work. You do goofy drawings on the sidewalk. Right. I'm a suburban post-modernist. Aren't we all. I was going to be a neo-deconstructivist but Mom wouldn't let me.
