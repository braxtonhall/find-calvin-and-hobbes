"19950424":
  transcript: 'This new issue of Chewing magazine tells how to set up a mandibular fitness regime! Basically, they recommend interval training: chewing one piece of gum with lots of reps, followed by chewing five pieces of gum at once, so you can really work the masseter and buccinator muscles. It''s a gruelling workout, but you build strength AND endurance, so you can come through in a clincher. I''m sure the glory makes it all worthwhile. Plus, you develop that "chewer''s jaw" that drives the girls wild.'
  description: Calvin's new issue of Chewing magazine tells how to set up a fitness regime.  Calvin says they recommend interval training.  He tells Hobbes it's a grueling workout, but you build strength and endurance.  Hobbes rolls his eyes and says all the glory makes it all worthwhile.  Calvin says you also develop "chewer's jaw", which drives the girls wild.
  characters: [calvin, hobbes]
"19950425":
  transcript: What's with the face? I'm doing stretches. Chewing magazine says you should always warm up before you chew gum. Did you know that neglecting to stretch the temporalis muscles is the leading cause of gum chewing injuries? What about falling down while chewing and walking? With a good helmet, the risk is surprisingly small.
  description: Calvin's mouth is hanging open.  He tells Hobbes he's doing stretches.  As he pulls his cheeks and jaws, he says you should warm up before chewing gum.  Neglecting to stretch is a leading cause of chewing gum injuries.  Hobbes asks about falling down while chewing and walking.  Calvin puts on a helmet saying that with a good helmet, the risk is surprisingly small.
  characters: [calvin, hobbes]
"19950426":
  transcript: In this issue, Chewing reviews the new gum chewing apparel. This jersey is makde with Swet-Tek (R) fibers that wick away perspiration! The mesh collar keeps your sternomastoids ventilated and the zippered pockets hold spare gum and wrappers! Why is it covered with brand logos? That gives you the psychological edge of pretending you're sponsored. How can you tell if you're reading an advertisement, a product review, or the product itself? I'D sure like to be a walking endorsement.
  description: Calvin's new Chewing magazine reviews gum chewing apparel.  There is a jersey that wicks away perspiration.  There is a mesh collar for ventilation and zippered pockets to hold spare gum.  Hobbes asks why it's covered with logos.  Calvin says that gives a psychological edge of pretending you're sponsored.  Hobbes wonders how you tell if you're reading an advertisement, a product review, or the product itself.
  characters: [calvin, hobbes]
"19950427":
  transcript: I need to get a heart rate monitor. What for? To make sure I'm chewing at my aerobic threshold! Every day I want to see that I'm chewing more gum faster, harder, and longer! What's the point of attaching a number to everything you do? If your numbers go up, it means you're having more fun. Sciece to the spirit's rescue once again.
  description: Calvin says he needs a heart rate monitor to make sure he's chewing at his aerobic threshold.  He wants to see he's chewing more gum, faster, harder, and longer.  Hobbes asks the point of attaching a number to everything you do.  Calvin says if your numbers go up, you're having more fun.  Hobbes calls it science to the spirit's rescue once again.
