"19950522":
  transcript: Aackkk. Ch... ch... ch... chocolate ch-chips... no. And get up off the floor. urgle.
  description: Calvin crawls on the floor.  He is weak.  He reaches forward.  Mom is in the kitchen.  He weakly calls for chocolate chips.  Mom says no and tells Calvin to get up off the floor.
  characters: [calvin, mom]
"19950523":
  transcript: I'm a great believer in the value of novelty. I say anything NEW is GOOD by definition! It can shock, insult, or offend me, so long as it doesn't bore me! If you can't give me something new, then repackage the old so it LOOKS new! Novelty is all that matters! I won't pay attention if it's not fresh and different! I see why timeless truth doesn't sell. Give me a good flash in the pan any day.
  description: Calvin is a great believer in the value of novelty.  He says anything new is good by definition.  He tells Hobbes if you can't give him something new, then repackage the old so it looks new.  Novelty is all that matters.  He won't pay attention if it's not fresh and different.  Hobbes sees why timeless truth doesn't sell.  Calvin will take a good flash in the pan any day.
  characters: [calvin, hobbes]
"19950524":
  transcript: YAWWNN. YAWNNN. YYAWNN. YAWWNN. One of us should have left the room.
  description: Hobbes yawns, then Calvin does.  They both yawn.  They lie down.  Calvin says one of them should have left the room.
  characters: [calvin, hobbes]
"19950525":
  transcript: When I was a kid, my Mom would take me to the big old department store downtown, and I used to love riding the escalators. The escalators there had wood stairs, and they used to click, clack, and creak. The wood slats on each step were maybe half an inch apart, and I always wondered if ladies got their high heels stuck and got pulled under. Some of those escalators were very narrow - just wide enough for one person. Yep, those old escalators had a lot more personality than these slick metal ones. I'd hate to think that all my current experiences will someday become stories with no point.
  description: Dad tells Calvin that his mom took them to a department store, and that he loved riding the escalators.  Dad explains how they sounded, and that he wondered if ladies got their heels stuck and got pulled under.  He says the old escalators had more personality than slick, metal ones.  Calvin thinks to himself that he hates to think all his current experiences will become stories with no point one day.
  characters: [calvin, dad]
"19950526":
  transcript: Mmf. Rrgg. One! REWARD, PLEASE!
  description: Calvin struggles to do a pushup.  He finally completes one.  He asks for a reward.
  characters: [calvin]
"19950527":
  transcript: Giving is better than having. When you GET something, it's new and exciting, when you HAVE something, you take it for granted and it's boring. But everything you GET turns into something you HAVE. That's why you always need to get new things. I feel like I'm in some stockholder's dream. "Waste and want", that's my motto.
  description: Calvin says getting is better than having.  He says when you get something, it's new and exciting.  When you have it, it's boring.  Hobbes says everything you get turns into something you have.  Calvin says that's why you always need to get new things.  Hobbes feels he's in some stockholder's dream.  "Waste and want" is Calvin's motto.
  characters: [calvin, hobbes]
"19950528":
  transcript: Ugh, I hate going to the subconscious. Me too! Why doesn't anyone ever clean this dump? Here's a movie reel. I suppose it's as good as any. I grabbed these two. Let's get back to central cognition. We can run this reel first. I hope these are better than last night's movies. Hurry up! The lights are dimming! Help me thread the projector! Yikes, this is awful! Where did you guys find this? Oops, the next reel isn't even from the same film. Good! Put it on! This one is even worse! I guess it's some sort of suspense movie. Why can't we ever watch anything good? Maybe you should get the movies next time! AUGHH! Monsters! Monsters! Turn it off! Too scary!! Quick, try another reel! This one makes no sense! What's going on?? Has this been dubbed from some other language? None of these make sense! We're splicing them all out of order. What a waste of time! The lights are coming back on! Show's over! Finally! I thought this would never end. Back to work! Man your stations! Full alert! Whoo, I had so many strange dreams ... I wonder what they mean.
  description: Some movie reels are gathered up in Calvin's subconscious.  As they prepare to play the movies, the men hope they're better than last night's.  The first one is bad.  They replace it with another from a different film.  It's a suspense movie.  They try the third.  It's a monster movie.  None of the movies make sense.  They are out of order.  The lights are coming back on.  They go back to their stations.  Calvin wakes up.  He says he had so many strange dreams and wonders what they mean.
  characters: [calvin]
"19950529":
  transcript: I heard that Miss Wormwood isn't here today. Really? Can we go home? Of course not. We have a substitute teacher. Can I send in a substitute student?
  description: Susie tells Calvin that Miss Wormwood isn't at school today.  Calvin wonders if they can go home.  Susie tells him they have a substitute teacher.  Calvin asks if he can send a substitute student.
  characters: [calvin, susie]
"19950530":
  transcript: Who's our substitute teacher? Do you know? Mr. Kneecapper. Oh NO! Really? I heard he killed a kid last year! What?! Yeah, some kid was talking in class, so Mr. Kneecapper took him out in the hall, and there were strange lumps in the cafeteria meatloaf that afternoon! OHH! Wait till she sees what's on today's lunch menu.
  description: Calvin asks who their substitute teacher is.  When Susie tells him, Calvin says he heard that teacher killed a kid last year.  He tells Susie the teacher took a kid out to the hall, then there were strange lumps in the cafeteria meatloaf that afternoon.  Susie is grossed out and leaves.  Calvin says to wait till she sees what's on today's lunch menu.
  characters: [calvin, susie]
"19950531":
  transcript: "Things I will never like: 1. Drying off with a cold, damp towel. 2. The feeling of seaweed wrapping around my leg. 3. Anything that was popular in the '70s. 4. Licorice, yams, or raisins. 5. That high-pitched screech that babies make. 6. Writhing maggots. It's comforting to know that there are certainties in life."
  description: Calvin writes a list of things he'll never like.  He mentions drying off with a cold, damp towel.  He mentions seaweed wrapping around his leg.  He mentions raisins, the screech babies make, and writhing maggots.  He tells Hobbes it's comforting to know there are some certainties in life.
  characters: [calvin, hobbes]
"19950601":
  transcript: Life is full of possibilities. For example, right now, instead of waiting for the school bus, I could stick out my thumb, hitch a ride, and spend the rest of my life in the Serengeti, migrating with the wildebeests! The Serengeti is in Africa. You couldn't really hitch a ride there. Life is full of precluded possibilities.
  description: Calvin tells Hobbes life is full of possibilities.  Instead of waiting for the school bus, he could thumb a ride and spend the rest of his life in the Serengeti, migrating with wildebeests.  Hobbes points out that the Sergengeti is in Africa and that he couldn't really hitch a ride there.  Calvin frowns and says life is full of precluded possibilities.
  characters: [calvin, hobbes]
"19950602":
  transcript: Slurrpp. Sluurrp. AACKKPTH URGK BLUB! I'd bet anything that the principal has a valve in his office that changes the water pressure.
  description: Calvin drinks from a water fountain.  It sprays up into his face.  As he walks away dripping, he says he bets the principal has a valve in his office that changes water pressure.
  characters: [calvin]
"19950603":
  transcript: Why are you digging a hole? I'm looking for buried treasure! What have you found? A few dirty rocks, a weird root, and some disgusting grubs. On your first try?? There's treasure everywhere!
  description: Hobbes asks why Calvin is digging a hole.  Calvin is looking for buried treasure.  Hobbes asks what he's found.  Some dirty rocks, a weird root, and some disgusting grubs.  Hobbes is overjoyed and asks if it was Calvin's first try.  Calvin says there's treasure everywhere.
  characters: [calvin, hobbes]
"19950604":
  transcript: The fearless spaceman Spiff, interplanetary explorer extraordinaire, gazes across the forbidding landscape of an uncharted planet.! What dangers lie ahead for our hero? What horrible aliens inhabit this world! What strange adventures await the intrepid spiff? What bizarre occurrence will our hero be the first to witness? The suspense! ...Our hero chucks a few rocks... .Sighhh If you couldn't find any weirdness, maybe we'll just have to make some! Now yer talkin'!
  description: Spaceman Spiff gazes across the landscape.  He wonders what dangers lie ahead.  He wonders what bizarre occurrence he will be the first to witness.  Spiff keeps looking across the expanse.  He throws a few rocks.  Spiff sighs.  Calvin goes back inside.  Hobbes comes with him, saying that if he couldn't find any weirdness, they'll have to make some.
  characters: [calvin, hobbes, spiff]
  source: miraheze
"19950605":
  transcript: Boy, our family would sure be in trouble if YOU were bringing home the bacon! I AM NOT BACON!
  description: Calvin sees Hobbes lying on the floor.  He says the family would be in trouble if Hobbes were bringing home the bacon.  As he turns around, Hobbes pounces on him.  Hobbes carries him in his mouth and drops him.  Hobbes walks away, and Calvin yells after him that he isn't bacon.
  characters: [calvin, hobbes]
"19950606":
  transcript: Ouchywawa. I've got a big owwy boo boo on my pinky. That's too bad. When your ailments sound cute, you don't get much sympathy.
  description: Calvin tells Mom that he has a big "owwy boo boo" on his pinky.  Mom says that's too bad.  Calvin walks away saying that when your ailments sound cute, you don't get much sympathy.
  characters: [calvin, mom]
"19950607":
  transcript: When birds burp, it must taste like bugs. Nobody ever pays me a penny for my thoughts.
  description: Sitting under a tree, Calvin tells Hobbes that when birds burp, it must taste like bugs.  Hobbes leaves.  Calvin says nobody ever pays a penny for his thoughts.
  characters: [calvin, hobbes]
"19950608":
  transcript: Look at this, Hobbes. I added it up and figured out I spend an average of four days a year taking baths! Four full days - morning, noon, and night - just sitting in the bathtub! What could possibly be a bigger waste of time than that?! How long did it take you to add this all up?
  description: In the bathtub, Calvin says he figures he spends an average of four days a year taking baths.  He asks what could possibly be a bigger waste of time than that.  Hobbes looks at the paper and asks how long it took Calvin to add all that up.
  characters: [calvin, hobbes]
"19950609":
  transcript: Wow! Look at this bug go! What on earth would make a bug hurry? You're deluding yourself, stupid! Nothing you do is important! You're just a bug! Oh my gosh, look at the time!
  description: Calvin sees a bug walking.  He tells the bug to stop deluding himself.  Nothing he does is important.  He notices what time it is and runs off.
  characters: [calvin]
"19950610":
  transcript: I'm a man of few words. Maybe if you read more, you'd have a larger vocabulary.
  description: Calvin says he's a man of few words.  Hobbes suggests that if he read more, he'd have a larger vocabulary.  Hobbes runs off with Calvin in hot pursuit.
  characters: [calvin, hobbes]
"19950611":
  transcript: Bwa ha ha ha ee hee hee hee hee ehh heh heh heh ...A little more..A little more.. AAA! I won't fill this one so full. There! Perfect! Heh heh Darn knot! Ackk blpp! Stop it! Pbtt! It's too slippery! Ackpth! Blp! Now look, it's almost empty! I'll have to fill it again. Stupid baloon. A little more...Ah! Perfect! It slipped off! Doggone it! Hobbes will be here any second and... Yaaaa Oh no! AAAAA! Gee, what's the point?
  description: Calvin is filling up a water balloon.  It bursts, soaking Calvin with water.  He gets another balloon and vows not to fill that one so full.  He has trouble tying off the knot, spilling water all over himself.  He starts to fill the balloon again.  It slips off and soaks him.  Calvin says Hobbes will be there at any second, so he tries to fill the balloon again.  Hobbes runs up, and Calvin covers himself.  Hobbes notices how soaked Calvin already is.  He asks what the point is.  Hobbes walks away.
  characters: [calvin, hobbes]
  source: miraheze
"19950612":
  transcript: It's hot, it's humid, it's buggy, there's no breeze, and the air is full of pollen. But it's SUMMER!
  description: Calvin complains that it's hot, humid, buggy, with no breeze, and the air is full of pollen.  Then he says "But it's summer!"  Off he and Hobbes go to play.
  characters: [calvin, hobbes]
"19950613":
  transcript: Hey ant, you're working like a maniac, and what have you got to show for it? What's the colony done for YOU lately? What about YOUR needs? You don't owe anybody anything! Let the others fend for themselves! Move out! Discover yourself! Express your individuality! If they listen, this should solve our ant problem.
  description: Calvin asks an ant why he's working like a maniac.  He asks what the colony has done for the ant lately.  He says the ant doesn't owe anybody anything.  He tells the ant to discover himself and express his individuality.  Calvin says if they listen, it should solve their ant problem.
  characters: [calvin]
"19950614":
  transcript: Hello? It surrrrre is nice outside! Climb a tree! Goof off! *click* Dad harrasses me with HIS values, so I harass him with mine.
  description: Dad answers the phone at his office.  Calvin says it's nice outside.  He tells Dad to climb a tree and goof off.  He hangs up.  Calvin tells Hobbes that if Dad harasses him with his values, he'll harass Dad with his.
  characters: [calvin, hobbes, dad]
"19950615":
  transcript: Look! I caught a butterfly! If people could put rainbows in zoos, they'd do it.
  description: Calvin shows Hobbes a butterfly he caught and put in a jar.  Hobbes tells him that if people could put rainbows in zoos, they'd do it.  Calvin looks at the jar, opens it and lets the butterfly out.
  characters: [calvin, hobbes]
"19950616":
  transcript: AAAAAAA. You're awake? Oh boy! Let's go! N-no c-coffee f-for m-me, th-thanks. Hehh hoo hehh
  description: An eye opens to see Hobbes directly in front.  Calvin is startled awake by Hobbes.  Hobbes says that since he's awake, they can go play.  Still jittery from the experience, Calvin says he doesn't need any coffee.
  characters: [calvin, hobbes]
"19950617":
  transcript: Why does ice float? Because it's cold. Ice wants to get warm, so it goes on top of liquids in order to be nearer to the sun. Is that true? Look it up and find out. I should just look stuff up in the first place. You can learn a lot, talking to me.
  description: Calvin asks Dad why ice floats.  Dad says ice wants to get warm, so it goes to the top of liquids to be nearer the sun.  Calvin asks if that's true.  Dad tells him to look it up and find out.  Calvin unhappily walks away saying he should just look stuff up in the first place.  Dad says you can learn a lot talking to him.
  characters: [calvin, dad]
"19950618":
  transcript: Hobbes gave me the story idea. Flip the pages again! This was by book!
  description: A stick person walks along.  He sees something, turns around and runs.  A stick animal comes up behind the stick person, jumps up and tackles the stick person.  The stick animal eats the head of the stick person and walks away.  Calvin tells Dad that Hobbes gave him the story idea.  He tells Dad to flip the pages again.
  characters: [calvin, dad]
  source: miraheze
"19950619":
  transcript: I cleaned and oiled your bicycle, Calvin. What do you say I take some time and help you learn how to ride it? NOOOOOO!! You're welcome. Mom! Mom! Dad HATES me!
  description: Dad has cleaned and oiled the bicycle.  He asks Calvin if he'd like to learn to ride it.  Calvin runs away in horror, yelling no.  Dad says he's welcome.  Calvin tells Mom that Dad hates him.
  characters: [calvin, dad]
"19950620":
  transcript: I've got the bike, Calvin. It's not going anywhere. I can feel it's going to throw me! Get ready to yank its wheels off! Just relax. I've got you. How can I relax? I'm uninsured and unarmed! I'm as good as head! Push back on the pedals. That's your brake, OK? Yes, well, that was fun! Thanks for the lesson! Get back here. No, really, I think I've got it! You can sell the bike now.
  description: Dad holds the bike with Calvin on it.  Calvin says the bike is getting ready to throw him off.  Dad tells him to relax.  Calvin says he can't relax.  He's uninsured and unarmed.  Dad tells Calvin how to apply the brakes.  Calvin thanks Dad for the lesson and runs off.  Dad tells him to come back.  Calvin says he has it, and that Dad can sell the bike now.
  characters: [calvin, dad]
"19950621":
  transcript: The trick to balancing is to have a little forward momentum. AAA! No momentum! No momentum! Just pedal slowly. I'm holding the bike, so you won't fall. You'll let go and the bike will launch me into the ionosphere! Trust me, OK? TRUST you? I hardly KNOW you! I'm your father!? What, for six years?! When I'm 40, we'll see how things are going along!
  description: Dad tells Calvin the trick to balancing on a bike is to have momentum.  Calvin wants no momentum.  Dad says with him holding the bike, Calvin can't fall.  Calvin says he'll let go, and the bike will launch him into the ionosphere.  Dad tells Calvin to trust him.  Calvin replies he hardly knows Dad.  He's only known Dad for six years.  he offers to see how things are going when he's forty.
  characters: [calvin, dad]
"19950622":
  transcript: Look, Calvin, you've got to relax a little. Your balance will be better if you're loose. I can't help it! Imminent death makes me tense! I admit it! You need a goal. Concentrate on your goal. My goal is to dismantle this bicycle and mail every piece to a different country so it can never be rebuilt! OK, that's not a good goal. WELL I'M NOT CHANGING IT!
  description: Dad tells Calvin to relax in order to improve him balance on the bicycle.  Calvin says imminent death makes him tense.  Dad tells Calvin to concentrate on a goal.  Calvin's goal is to dismantle the bike and mail each piece to a different country so it can't be rebuilt.  Dad says that isn't a good goal.  Calvin says he isn't changing it.
  characters: [calvin, dad]
"19950623":
  transcript: Think about the places you can go once you learn how to ride! AAAAA. Think about how impressed your friends will be! Think about how much fun you'll have! AAAAAAA. AAAAAAAAAA. Think about inhaling. EEEP ahhh...
  description: Dad tells Calvin to think of the places he can ride when he learns how to ride a bicycle.  He tells Calvin to think how his friends will be impressed.  All this time, Calvin is yelling with his eyes wide open.  Dad tells him to think about inhaling.
  characters: [calvin, dad]
"19950624":
  transcript: Ooh, it doesn't look like the bike lesson went so good. It didn't. Dad LIKES riding his bike! He doesn't understand what it's like for me! I HATE flipping over the bars, getting chased around the yard, and getting mowed down by a demonic machine! Is that what happened? No, I tripped coming up the stairs.
  description: Calvin is all scratched and bruised.  Hobbes says it looks like the bike lesson didn't go so well.  Calvin complains that Dad like riding his bike, so he doesn't understand what it's like for Calvin.  He says he hates flipping over bars, getting chased around the yard, and getting mowed down by a demonic machine.  Hobbes asks if that's what happened.  Calvin tells him no.  He tripped coming up the stairs.
  characters: [calvin, hobbes]
"19950625":
  transcript: Ding dong I'm coming. I'm coming. Aaaa! I opened the door and my bike got in!! Hellpp! Run for your lives!! It's an unbalanced bicycle!! Someone get me a spoke wrench! Hehh hoo hehh hoo. Back! Back! Ha! You can't get me now! Aiee! Tire tracks on the rugs! Oil on the couch! Where's that kid?! Someday the neighbors will look out and wonder why there's a grown man wearing kids clothes on our roof.
  description: Calvin answers the doorbell.  The bike comes into the house and chases Calvin.  Over the sofa they go, up the stairs.  Calvin hides temporarily in the bathroom as the bike goes down the hall.  He holds the bike off with a chair as he backs out his bedroom window.  He closes the window and says the bike can't get him now.  Downstairs, someone yells there are tire tracks on the rugs and oil on the couch.  Another voice asks where Calvin is.  Outside on the roof, Calvin says someday neighbors will look out and wonder why there is a grown man wearing kids' clothes on their roof.
  characters: [calvin, mom, dad]
  source: miraheze
"19950626":
  transcript: Darn ol' rain.
  description: Outside, it is raining.  Inside, Calvin sits in a chair holding a kite.  The kite is being kept aloft by a fan.
  characters: [calvin]
"19950627":
  transcript: It's not summer if your tongue isn't purple.
  description: Calvin is eating a sucker.  He looks into the mirror.  He says it isn't summer if your tongue isn't purple.
  characters: [calvin]
"19950628":
  transcript: What does it mean when someone says to "Give it the ol' college try"? It means you join your friends, get some cheap beer, order a pizza, and forget about tomorrow. That's not what it means! Where did YOU go to college? Never mind.
  description: Calvin asks Dad what it means when someone says they'll "give it the ol' college try".  Dad tells him you join your friends, get cheap beer, eat a pizza and forget about tomorrow.  Mom says that isn't what it means.  Dad asks where she went to college.
  characters: [calvin, mom, dad]
"19950629":
  transcript: CAAAAAAALLLLLLVVINNNNN, THAAAAAT'S EEENOUUGHHH. M-mom s-sure was m-movingg st-strangellly t-toddayy. Maybe she's right about how much sugar you put on that cereal.
  description: Mom is shaking while she tells Calvin that's been enough.  Outside, Calvin is shaking.  He tells Hobbes that Mom was moving strangely today.  Hobbes tells him that she might be right about how much sugar he puts on his cereal.
  characters: [calvin, hobbes, mom]
"19950630":
  transcript: Frank appraisal of your looks 50c. Any business? Not so far. But I'm giving out lots of free samples.
  description: Calvin sits at a box labeled "Frank Appraisal of Your Looks".  Hobbes asks if he's had any business.  Calvin says no, but that he's giving lots of free samples.
  characters: [calvin, hobbes]
"19950701":
  transcript: What a lovely day for a hike! It's not so bad THIS way! No, we won't carry you. Stop griping. This is so much work!
  description: Mom and Dad are hiking.  Calvin bounces along behind them on a chair, saying it's not so bad this way.  Dad says they won't carry Calvin.  He trudges along, saying this is so much work.
  characters: [calvin, mom, dad]
"19950702":
  transcript: Welcome to Stupidopolis...a thriving costal city..stupidly built near an undersea fault line...that just shifted! A curious shadow falls over downtown! Why does he build everything so close to the water? It's stupid. He doesn't seem to mind doing it over and over.
  description: Stupidopolis is a thriving coastal city built near a fault line.  A giant wave crashes into the city.  Calvin is laughing on the beach.  Dad asks Mom why Calvin builds everything so close to the water.  He says it's stupid.  Mom says Calvin doesn't seem to mind doing it over and over.
  characters: [calvin, mom, dad]
  source: miraheze
"19950703":
  transcript: Look at this! Mom got me a book from the library. That's nice. NICE?!? It's SUMMER! I only get three short months to goof off! I'm not going to waste these precious days reading BOOKS! Summers are for vegetating! That's why the TV shows are reruns and the movies are sequels! No wonder the flies come out. Heck, everyone KNOWS it's not entertainment unless you can sit in the dark and eat.
  description: Mom got Calvin a book from the library.  Calvin complains to Hobbes that it's summer.  With only three months to goof off, he's not wasting precious days reading books.  He says summers are for vegetating.  He says everyone knows it's not entertainment unless you can sit in the dark and eat.
  characters: [calvin, hobbes]
"19950704":
  transcript: Hey, are you reading that book Mom got from the library? Mm-hmm. Is it good? Do you like it? Is it exciting? Are you having fun? Shh. HOW COULD IT POSSIBLY BE FUN WHEN IT'S SO QUIET?!?
  description: Calvin asks Hobbes if he's reading the library book Mom had gotten for Calvin.  Hobbes is engrossed in reading it.  Calvin asks if it's good, if it's exciting, if he's having fun.  Hobbes quietly sits reading.  Calvin yells at him asking how it could be fun when it's so quiet.
  characters: [calvin, hobbes]
"19950705":
  transcript: While you're reading that boring book, I'M going to go do something fun. OK. I'LL be having the time of my life, while you'll be sitting here yawning and wishing you were... AIEE!! I'll just kind of read over your shoulder, OK? No. Go do something fun.
  description: Calvin says he's going to do something fun while Hobbes reads his boring book.  Calvin crosses his arms and says he'll be having the time of his life, while Hobbes will wish he was.  Suddenly, Hobbes is startled by something in the book.  Calvin wants to read over Hobbes' shoulder.  Hobbes holds the book closer and tells Calvin to do something fun.
  characters: [calvin, hobbes]
"19950706":
  transcript: I read this library book you got me. What did you think of it? It really made me see things differently. It's given me a lot to think about. I'm glad you enjoyed it. It's complicating my life. Don't get me any more.
  description: Calvin hands Mom the library book she had gotten.  He says he read it.  Mom asks what Calvin thought of it.  Calvin tells her it made him see things differently.  He has a lot to think about.  Mom says she's glad he enjoyed it.  Calvin tells her it's complicating his life and not to get him any more.
