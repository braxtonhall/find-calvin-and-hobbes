  transcript: I hate all this wind! Boy, this is unpleasant! Stupid, miserable wind! What a lousy weather! What an awful day! Well if you can't change it, what's the point of griping about it? I'm not going to let a little wind be more annoying than me.
  description: Calvin is complaining about the wind to Hobbes.  Hobbes asks what the point is in griping about it if you can't change it.  Calvin replies he isn't going to let a little wind be more annoying than him.
