"19950107":
  transcript: Why does man create? Is it man's purpose on Earth to express himself, to bring form to thought, and to discover meaning in experience? Or is it just something to do when he's bored?
  description: Standing next to a snowman, Calvin asks why man creates.  He asks if it's to express himself, to bring form to thought and discover meaning in experience.  He ponders.  Then Calvin asks if it's just something to do when he's bored.
  characters: [calvin]
"19950108":
  transcript: I'm bored. Let's go in. But we've only been out here a few minutes. This is taking too long. What's the hurry? We've got all day! Yeah, but it's kind of cold, and the sun's too bright, and my gloves are getting wet. And when you think about it, building a snowman is a lot of work. I didn't come here to do something hard. Besides, what if the snowman doesn't come out very good? We'd be failures! Who wants to be a failure?! Or even if it's good, what's the point? It's just going to melt in a few weeks anyway! It's all futile! So instead of wasting my time, I'm going to go inside, pull down the shades and watch TV. That way, in complete physical comfort, I can vicariously experience the activity of actors pretending to do things! Are you sure it's not too much trouble to turn on the TV? That's why we have a remote control. Virtual reality is already here. I can't believe the only way to get inside is by WALKING.
  description: Calvin is bored making a snowman.  Hobbes says they've only been outside a few minutes.  Calvin says it's taking too long.  Hobbes says they have all day.  Calvin says the sun's too bright and his gloves are getting wet.  He says making a snowman is hard work.  He asks Hobbes what happens if the snowman isn't very good.  They'd be failures.  He says even if it's good, it will melt in a few weeks.  Instead of wasting his time, he's going inside to watch TV.  He'll be in complete physical comfort while experiencing the activity of actors pretending to do things.  Hobbes asks if it's too much trouble to turn on the TV.  Calvin replies that's why they have a remote control.  Hobbes says virtual reality is already here.  Calvin can't believe the only way to get inside is to walk.
  characters: [calvin, hobbes]
  source: s-anand+seligman+miraheze
