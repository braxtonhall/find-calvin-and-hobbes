"19950223":
  transcript: Look at how people are portrayed in comic strips. The women are indecisive whiners, nagging shrews and bimbos. And the men are no better. They're befuddled morons, heavy drinkers, gluttons, and lazy goof-offs! Everyone is incompetent, unappreciated, and unsuccessful! What kind of insiduous social programming IS this?! No wonder the world's such a mess! I demand politically correct, morally uplifting models in the funnies! Yes, we all know how funny good role models are. And look, all the kids are obnoxious brats!
