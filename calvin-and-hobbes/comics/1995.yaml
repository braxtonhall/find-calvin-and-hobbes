"19950924":
  transcript: The center snaps the ball to the quarterback! No he doesn't! He doesn't? No! Secretly, he's the quarterback for the other team! He keeps the ball! A traitor! Calvin breaks for the goal! Wheeee! He's at the 30... the 20... the 10! Nobody can catch him! Nobody wants to! You're running toward your own goal! Huh?! When I learned you were a spy, I switched goals. This is your goal, and mine's hidden! Hidden?! You'll never find it in a million years! I don't need to find it! As a traitor to your team, crossing my goal counts as crossing your goal! Ah, you might think so... In fact, I know so! But the place I hid my goal is right on top of your goal, so the points will go to me! But the fact is, I'm really a double agent! I'm on your team after all, which means you'll lose points if I cross your goal! Ha ha! But I'm a traitor too, so I'm really on your team! I want you to cross my goal! The points will go to your team, which is really my team! That would be true... if I were a football player! You mean..? I'm actually a badminton player disguised as a double-agent football player! And I'm secretly a volleyball-croquet-polo player! Sooner or later, all our games turn into Calvinball. No cheating!
