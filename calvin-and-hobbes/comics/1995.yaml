  source: s-anand+seligman+miraheze
"19950116":
  transcript: Some days you get up and you already know that things aren't going to go well. They're the type of days when you should just give in, put your pajamas back on, make some hot chocolate, and read comic books in bed with the covers up until the world looks more encouraging. Of course, they never let you do that. Is today one of those days? IT SURE IS!!
  description: Waiting for the bus, Calvin tells Hobbes you get up some days and know some things aren't going to go well.  Calvin says those are the days you should put your pajamas back on, make hot chocolate, and read comic books in bed until the world looks more encouraging.  Grumpily, Calvin says they never let you do that.  Hobbes asks if today is one of those days.  Calvin yells that it sure is.
  characters: [calvin, hobbes]
"19950117":
  transcript: On gray days, when it's snowing or raining, I think you should be able to call up a judge and take an oath that you'll just read a good book all day, and he'd allow you to stay home. So you'd only go to school on sunny days? Well no, on sunny days he judge would let you play outside. He's quite a guy. He'd make you go to school if it was hot, hazy, and humid with a lot of bugs.
  description: Still waiting for the bus, Calvin says on gray days, you should be able to call a judge and take an oath that you'll read a good book, and he'd allow you to stay home.  Hobbes asks if he'd only go to school on sunny days.  Calvin says on those days, the judge would let you play outside.  Hobbes comments that the judge is quite a guy.  Calvin says he'd make you go to school if it was hot, hazy, and humid with a lot of bugs.
  characters: [calvin, hobbes]
"19950118":
  transcript: Pssst! What's 7+6? Three hundred billion gazillion. Oh, thanks for the big help! That's a three, followed by 85 zeroes. Ah! I knew that.
  description: Calvin asks Susie what 7 + 6 is.  Susie tells him three hundred billion gazillion.  Sarcastically, Calvin thanks her for the big help.  Susie tells him that is a three, followed by 85 zeroes.  Calvin writes it down, saying he knew that.
  characters: [calvin, susie]
"19950119":
  transcript: I'm thinking of starting my own talk radio show. I'll spout simplistic opinions for hours on end, ridicule anyone who disagrees with me, and generally foster divisiveness, cynicism, and a lower level of public dialog! It would seem you were born for the job. Imagine getting PAID to act like a six-year-old!
  description: Calvin says he's thinking of starting his own talk radio show.  He'd spout simplistic opinions for hours, ridicule anyone who disagrees, and foster divisiveness, cynicism, and a lower level of public dialog.  Hobbes says it seems Calvin was born for the job.  Calvin asks Hobbes to imagine being paid to act like a six-year-old.
  characters: [calvin, hobbes]
"19950120":
  transcript: Heh heh heh heh heh heh heh heh heh Oh boy Oh boy Oh boy HA HA HA HA HA HA. Obviously I've tapped into some primeval well of the human psyche.
  description: Calvin makes a snowball and starts chuckling.  He continues to laugh as he finishes the snowball.  He stops.  He looks at the snowball and says that obviously he's tapped into some primeval well of the human psyche.
