"19950520":
  transcript: Have you been hitting rocks with this bat? No, why? Look at it. It's chewed up. You should take care of your equipment. The ball did this! It's what I've been trying to tell you! These are fang marks! That ball is berserk! It's deranged! It's a menace! Why do I even bother?
  description: Dad holds up Calvin's bat and asks if he's been hitting rocks with it.  Calvin asks why.  Dad says it's all chewed up, and Calvin should take care of his equipment.  Calvin says the ball did it.  He says that's what he's been trying to tell Dad.  They're fang marks, and the ball is berserk, deranged, a menace.  Later, sitting on his bed, Calvin wonders why he even bothers.
