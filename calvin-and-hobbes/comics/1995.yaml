"19950127":
  transcript: Outta my way, Twinky. ...and suddenly, the Earth opened up! Wailing helplessly, Moe tumbled head over heels down the smoking chasm until he splashed into the molten magma at the planet's core, where he slowly melted before igniting in a spitting fireball of grease!
  description: Moe pushes Calvin to the ground.  After Moe leaves, Calvin says the earth opened up.  Wailing helplessly, Moe tumbled down the smoking chasm until splashing into the planet's molten magma core, slowly melting before igniting in a spitting fireball of grease.  Dejectedly, Calvin walks off.
