"19950811":
  transcript: Some people are pragmatists, taking things as they come and making the best of the choices available. Some people are idealists, standing for principle and refusing to compromise. And some people just act on any whim that enters their heads. I wonder which YOU are. I pragmatically turn my whims into principles!
