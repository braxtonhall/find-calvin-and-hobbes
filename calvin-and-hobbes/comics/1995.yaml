"19950204":
  transcript: Dad says there's nothing cozier than a fire, but I dunno...
  description: Dad is trying to light the fireplace.  He gets angrier as he puts paper to help start the fire.  Suddenly, there is a cloud around Dad, who is furious.  Calvin runs off carrying a fire extinguisher.  He indicates Dad says there is nothing cozier than a fire, but he doesn't know.
