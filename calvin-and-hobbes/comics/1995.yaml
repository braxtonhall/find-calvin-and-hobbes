"19950508":
  transcript: '"Please excuse Calvin from class today. His genius is urgently required on a top secret matter of national security. Sincerely, The President of the United States. P.S. Really." Nice try. Sit down. I gotta learn how to write in cursive.'
  description: Miss Wormwood reads a note from the President of the United States, indicating Calvin should be excused because his genius is required on a matter of national security.  Miss Wormwood looks at Calvin and tells him it was a nice try.  Calvin sits down, grumbling that he needs to learn how to write in cursive.
