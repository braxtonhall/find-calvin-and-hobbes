"19950817":
  transcript: It used to be that if a client wanted something done in a week, it was considered a rush job, and he'd be lucky to get it. Now, with modems, faxes and car phones, everybody wants everything instantly! Improved technology just increases expectations. These machines don't make life easier - they make life more harrassed. Six minutes to microwave this?? Who's got that kind of time?! If we wanted more leisure, we'd invent machines that do things LESS efficiently.
