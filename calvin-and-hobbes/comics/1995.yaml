"19950726":
  transcript: Another thing to remember about popular culture is that today's TV-reared audience is hip and sophisticated. This stuff doesn't affect us. We can separate fact from fiction. We understand satire and irony. We're detached and jaded viewers who aren't influenced by what we watch. I think I hear advertisers laughing. Hold on, I need to inflate my basketball shoes.
