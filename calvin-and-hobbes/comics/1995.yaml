"19950114":
  transcript: When I grow up, I'm going to be a scientist. I'll dedicate my career to the proposition that man can reshape the Universe according to his own whims. I'll probably go into genetic engineering and create new life forms. You want to play God? Not exactly. God never bothered to patent his stuff.
  description: Sledding down the hill, Calvin tells Hobbes he will grow up to be a scientist.  He will dedicate his career to the proposition that man can reshape the universe.  He says he'll probably go into genetic engineering and create new life forms.  As they crash into a tree and fly through the air, Hobbes asks Calvin if he wants to play God.  Calvin replies "not exactly".  He says God never bothered to patent his stuff.
  characters: [calvin, hobbes]
"19950115":
  transcript: Brrrr! I'm freezing! You need a nice fur coat like mine. I'm all toasty. I'll just put my feed on your back, OK? Ooh, you ARE warm! GAAA! Quit thrashing around! You're letting in cold air! Well keep your icy feet on your own side of the bed then! They WERE! Your big behind was on MY side! THAT's your side! THIS is the demilitarized zone and THIS is MY side! All THAT?! No way, you hog! In fact, the whole bed is my side! Animals should sleep on the floor! Oh, THAT does it! You and your hairless pink monkey suit can freeze solid! I'm leaving! HEY! Don't take the blanket! COME BACK HERE! I'LL GET YOU! GIMME THAT! ...now where'd he go?? AAAAAA GAAAA! SOMEBODY'S FEET ARE LIKE ICE!! Calvin had another nightmare. If it's two crowded, you guys are welcome to sleep downstairs.
  description: Calvin is freezing in bed.  Hobbes tells him he should have a fur coat like his.  Calvin puts his feet on Hobbes to warm up.  Hobbes jumps.  Calvin tells him to quit letting cold air in.  Hobbes tells Calvin to keep his cold feet on his side of the bed.  Calvin protests that Hobbes' behind was on his side.  Hobbes indicates the demilitarized zone between their sides.  Calvin claims the whole bed and says animals should sleep on the floor.  Hobbes takes the blanket and leaves.  The sounds of their fighting is heard by Mom.  Calvin is looking for Hobbes when a ghostly apparition rises before him.  Calvin yells in terror.  Hobbes has the bed to himself.  Dad is awakened by icy cold feet.  Calvin is in bed with him and Mom.  Mom tells Dad that Calvin had a nightmare.  Calvin says that if it's too crowded, they are welcome to sleep downstairs.
