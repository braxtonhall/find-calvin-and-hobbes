"19950106":
  transcript: Oh yeah? Define, "well-adjusted".
  description: A big snow chicken has an axe it has stuck into a stump.  Next to the stump, a snowman lies with its head on the ground to one side.  Mom is standing next to Calvin.  Calvin asks Mom to define "well-adjusted".
