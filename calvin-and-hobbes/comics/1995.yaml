"19950805":
  transcript: When a person pauses in mid-sentence to choose a word, that's the best time to jump in and change the subject! It's like an interception in football! You grab the other guy's idea and run the opposite way with it! The more sentences you complete, the higher your score! The idea is to block the other guy's thoughts and express your own! That's how you win! Conversations aren't contests! OK, a point for you, but I'm still ahead.
