"19950512":
  transcript: Have you noticed how nobody dresses up for anything anymore? People look like slobs wherever they go. Everybody's rude, too. People swear all the time, and you can forget about being addressed as "Mr." or "Sir." There's no respect for anyone. How come I gotta change the world?!
  description: At dinner, Mom tells Dad that nobody dresses up for anything anymore.  People look like slobs.  Dad agrees that people are too rude, and that there's no respect for anyone.  Later, Calvin is standing all dressed up, with his hair combed.  He complains why he has to change the world.
  characters: [calvin, mom, dad]
"19950513":
  transcript: Every Saturday morning is the same. We get up at the crack of dawn, watch cartoons and eat sugary cereal until we fight, and then Mom throws us out of the house. It never changes. That's what I like about Saturdays too! First one downstairs get to pick the cartoons!
  description: Calvin wakes up and tells Hobbes every Saturday morning is the same.  They get up at the crack of dawn, watch cartoons, eat sugary cereal until they fight, then get thrown out of the house by Mom.  As they get out of bed, Hobbes says that's what he likes about Saturdays, too.  Calvin calls out that the first one downstairs gets to pick the cartoons.
  characters: [calvin, hobbes]
"19950514":
