  transcript: Ol' Hobbes is getting a little dirty, don't you think? In fact, you both could use a bath. C'mon Calvin. Oh Boy! You're taking your back upstairs, Calvin. Lucky rat. Yeah? Try the "Cold Rinse" cycle.
