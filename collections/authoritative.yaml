alterations:
  19880313: Possibly miscolored dinosaur Sunday strip — off-putting greyish-green hue
    in some book editions. Not Watterson's intention.
  19880828: Vertical/redrawn format. Two versions exist. Horizontal format used in
    newspapers and Complete. Vertical redrawn version used in Book 4, Authoritative,
    and Lazy Sunday Book. Sunday Pages 1985-1995 has original horizontal. Complete
    version confirmed via personal scan of the 2005 hardcover.
