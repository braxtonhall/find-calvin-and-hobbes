# The site's configuration: what this archive is called, how it looks, and where it links out to.
#
# Any value can read the build's environment — the process's, else `.env` — as `$NAME` or
# `${NAME}`, with `${NAME:-fallback}` for a value to use when it is unset or empty. `$$` is a
# literal `$`. A setting that comes out empty is left unset.
#
# The deployment settings below read the environment by default, so a fork that only moves the site
# somewhere else can do it from `.env` (copy `.env.sample`), or the repository's Actions variables
# of the same names, without touching this file.

name: Find Calvin and Hobbes

# What the archive is of, as the link previews write it: "Calvin and Hobbes for July 7, 1986."
series: Calvin and Hobbes

# The link preview's description for a page with none of its own, like the home page. Without one,
# such a page has no description.
description: Search the complete Calvin and Hobbes archive. Browse every comic strip from 1985 to 1995.

# The icon in the browser's tab. Without one, the browser shows its own.
favicon: https://static.wikitide.net/calvinandhobbeswiki/f/f3/CalvinAndHobbes.png

landing:
  # The banner over the home page's search box, and the link preview's image for a page with none of
  # its own. Without one, the home page shows the name instead, and such a page previews no image.
  image: https://upload.wikimedia.org/wikipedia/commons/9/96/Calvin_and_Hobbes_title.png
  # What the banner says, for a reader who can't see it. The name, if left out.
  alt: Calvin and Hobbes
  # Its size in pixels, so the page holds the right space for it while it loads. Both or neither.
  width: 722
  height: 103

# The site's colours, by what each is for. Each is quoted: unquoted, a `#` starts a comment.
#
# The grid colours each day by what happened on it, and a search fades each day by how well it
# matched. A day it did not match at all takes its colour at 40% over the background, and the four
# shades of a weaker match are drawn between the two.
theme:
  background: "#fbf6f0"
  text: "#333333"
  # Secondary text: dates, counts, captions.
  textMuted: "#888888"
  # The site's own colour: a day with a new strip, and the links, buttons and outlines. Darkened
  # by a fifth where it is text.
  main: "#f6b213"
  # A bookmarked day.
  bookmark: "#fe7900"
  # A day with no new strip — a rerun, or none at all — and the lines and panels around the page.
  neutral: "#e0e0e0"
  # The ring around the day that is open, and the outline of a book's links out.
  selected: "#e6052f"
  # The glow around a day while its search result is pointed at, and that result's row.
  hover: "#ffd700"
  hoverRow: "#fff8e1"
  # The words a search found in a strip's text, and the ones it found only approximately.
  match: "#fff176"
  matchApproximate: "#fff8c4"

search:
  # What the search box types into itself, one character at a time, when the reader presses the
  # button with nothing in it: a shuffled walk through these, so none repeats until all have had a
  # turn. With none, the button does nothing on an empty box.
  #
  # Mix things to search for with the filter language: watching `@is:sunday snowman` type itself
  # out is how a reader who has never typed an `@` learns there is one. Quote a suggestion that
  # starts with `@`, which YAML keeps for itself.
  #
  # Each must find at least one strip, which the tests check. A bound just past the end of the run,
  # like `@after:1995`, is a valid filter that can never match. One whose filter the site has
  # turned off, like `@is:rerun` without reruns, is left out.
  #
  # A suggestion can be about today, filled in when it is typed:
  #
  #   {{today.month}}, {{today.day}}   today, as `oct` and `5`
  #   {{featured.month}}, {{featured.day}}, {{featured.year}}
  #                                    today in the strip's run: its full years end to end, so
  #                                    2026 is 1986, and 2036 is 1986 again. A day with no strip —
  #                                    neither a new one nor, where the site has reruns, a rerun —
  #                                    moves to the next year that has one.
  suggestions:
    - revenge of the baby-sat
    - snow goons
    - weirdos from another planet
    - "@year:1995 there's treasure everywhere"
    - homicidal psycho jungle cat!
    - transmogrifier
    - spaceman spiff
    - stupendous man
    - susie
    - miss wormwood
    - duplicator
    - time machine
    - yukon
    - water balloon
    - calvinball
    - waiting for the school bus
    - 'rosalyn @or "baby sitter"'
    - "@month:december @day:24 @is:sunday"
    - november 18 1985
    - "@is:sunday snowman"
    - "@is:sunday @year:1985"
    - "@in:sundaypages"
    - "@in:lazysunday"
    - "@in:tenthanniversary"
    - "@is:rerun"
    - "{{featured.month}} {{featured.day}} {{featured.year}}"
    - "@month:{{today.month}} @day:{{today.day}}"

# Where and how the site is deployed.

# Optional, from SITE_URL. The full https URL this site is served from.
#
# When set, the build emits og:url and canonical tags on every page, a robots.txt sitemap pointer,
# sitemap.xml, and a CNAME file for a GitHub Pages custom domain. When unset, all of those are
# omitted and the site deploys to the default *.github.io URL.
#
# A path mounts the site below the origin's root, as a GitHub project page is:
# https://user.github.io/repo. Every link, fetch and image is then written from there, and no
# CNAME is emitted, since a custom domain would serve the site from the root.
url: ${SITE_URL}

# From PAGE_LAYOUT. Where each page's file is written, which is up to the host.
#
#   html       (default) `credits.html`, served for `/credits` by a host with clean URLs:
#              GitHub Pages, Neocities, Netlify, Cloudflare. No redirect on a cold load.
#   directory  `credits/index.html`, which any static host serves for `/credits/`. For a host
#              without clean URLs; most redirect `/credits` to `/credits/` and the app tidies
#              the address back up.
pageLayout: ${PAGE_LAYOUT:-html}

# The link on each page to the corrections form.
#
# Each page's link is a template, by the kind of page it is on. A kind left out, or empty, carries
# no link. Every template has the same fields: {{page.url}}, the whole address of the page;
# {{page.origin}}, the site it is on; and {{site.commit}}, the build the page was made by.
#
#   home     the home page
#   search   the search results
#   strip    a strip's page
#   rerun    the page of a day that reran an earlier strip
#   book     a book's page
#   books    the Books tab of Collections
#   arc      an arc's page
#   arcs     the Arcs tab of Collections
#   library  the bookmarks
#   credits  the credits
#
# The form is the same one for every deployment of this archive, so a correction sent from a fork
# arrives with the rest rather than nowhere. It tells them apart by the page's address and the
# commit. Each template checks the form's boxes for what that kind of page is about; a rerun day's
# is about the strip and the rerun both, since either could be what is wrong.
corrections:
  # From CORRECTIONS. On unless set to false, which leaves the link out of every page rather than
  # hiding it, so a build that wants no part of the form carries no trace of it.
  enabled: ${CORRECTIONS:-true}
  pages:
    strip: https://docs.google.com/forms/d/e/1FAIpQLSdlFXnwd3p8fJjuZg91WKNVGMwoTYHvrg-mZJj4VFpcF3nq8w/viewform?usp=pp_url&entry.762468410=Comic&entry.1138251038={{page.url}}&entry.2127852102={{page.origin}}&entry.46703544={{site.commit}}
    rerun: https://docs.google.com/forms/d/e/1FAIpQLSdlFXnwd3p8fJjuZg91WKNVGMwoTYHvrg-mZJj4VFpcF3nq8w/viewform?usp=pp_url&entry.762468410=Comic&entry.762468410=Rerun&entry.1138251038={{page.url}}&entry.2127852102={{page.origin}}&entry.46703544={{site.commit}}
    book: https://docs.google.com/forms/d/e/1FAIpQLSdlFXnwd3p8fJjuZg91WKNVGMwoTYHvrg-mZJj4VFpcF3nq8w/viewform?usp=pp_url&entry.762468410=Book&entry.1138251038={{page.url}}&entry.2127852102={{page.origin}}&entry.46703544={{site.commit}}
    books: https://docs.google.com/forms/d/e/1FAIpQLSdlFXnwd3p8fJjuZg91WKNVGMwoTYHvrg-mZJj4VFpcF3nq8w/viewform?usp=pp_url&entry.762468410=Book&entry.1138251038={{page.url}}&entry.2127852102={{page.origin}}&entry.46703544={{site.commit}}
    arc: https://docs.google.com/forms/d/e/1FAIpQLSdlFXnwd3p8fJjuZg91WKNVGMwoTYHvrg-mZJj4VFpcF3nq8w/viewform?usp=pp_url&entry.762468410=Arc&entry.1138251038={{page.url}}&entry.2127852102={{page.origin}}&entry.46703544={{site.commit}}
    arcs: https://docs.google.com/forms/d/e/1FAIpQLSdlFXnwd3p8fJjuZg91WKNVGMwoTYHvrg-mZJj4VFpcF3nq8w/viewform?usp=pp_url&entry.762468410=Arc&entry.1138251038={{page.url}}&entry.2127852102={{page.origin}}&entry.46703544={{site.commit}}
    credits: https://docs.google.com/forms/d/e/1FAIpQLSdlFXnwd3p8fJjuZg91WKNVGMwoTYHvrg-mZJj4VFpcF3nq8w/viewform?usp=pp_url&entry.1138251038={{page.url}}&entry.2127852102={{page.origin}}&entry.46703544={{site.commit}}

# The archive itself. Each part can be written here in place, but is usually `!Import ./file.yaml`,
# which reads that file in place of the value, relative to this one; a Markdown file is read as its
# text. A file named that isn't there stops the build. Every part must be given, and the optional
# ones can be set to false instead, which leaves out what they are for and reads nothing.
#
#   comics      the strips: their transcripts, descriptions, and specials
#   tuning      how the search scores a match, fitted to the strips, with notes on each value
#   credits     the credits page, in Markdown
#
# Optional:
#
#   arcs        story arcs: the Arcs tab of Collections and each arc's page, a strip's place in its
#               arc, a book's list of the arcs it prints, and @is:standalone
#   reruns      days the paper ran an earlier strip again: each such day's page and cell in the grid,
#               a strip's list of the days it reran, and @is:reused and @is:rerun
#   compounds   the compound words the search keeps whole or splits beyond what it finds itself
#   characters  each character's name by id, for @featuring: and the Featuring line under a strip
comics: !Import ./comics.yaml
tuning: !Import ./tuning.yaml
credits: !Import ./credits.md
arcs: !Import ./arcs.yaml
reruns: !Import ./reruns.yaml
compounds: !Import ./compounds.yaml
characters: false

# Whether the Sundays ran in colour and the dailies in black and white, a format of their own. When
# true, the search has `@is:sunday` and `@is:daily` and the filter bar a Format field to pick one,
# and each book's `colour` says whether it printed its Sundays in colour, which its page and a
# strip's list of books show. Off unless set to true, which leaves out all of these.
colourSundays: true

# A strip's shape, as its width over its height, which a strip's page holds the space for while its
# image loads. A daily's is required. A Sunday's is the daily's, if left out. A strip with an
# `aspect-ratio` of its own in comics.yaml, like a special, keeps that.
aspectRatio:
  daily: 3.098
  sunday: 1.427

# How the grid down the side of every page is drawn: how much each box stands for, and how much of
# the run it shows at once, under `grid`. Without one, as here, every day of the run is a box, all
# on one page, and there are no buttons under it.
#
# periods  named stretches of the run, each with the year (or date) it starts on. Each ends
#          the day before the next begins; the first takes in everything before it, and the last
#          everything after, so a short last year can be folded into the stretch before it by
#          leaving it out. In order. Named all with whole numbers, like 1990, or none, like 1990s:
#          the two together cannot be kept in order. Optional: only a level of periods, or one
#          paged by them, needs any, and without them every level shows the whole run on one page.
# levels   the grid's levels of detail, most detailed first, from:
#
#            day     a box a day, seven to a row, Monday to Sunday. Always the first level.
#            week    a box a week
#            month   a box a month
#            year    a box a year
#            period  a box a period
#
#          Each gives its `columns`, but for the days, which are always seven; the grid is always a
#          week of days wide, so fewer columns make bigger boxes. Each column is counted from a
#          fixed point, so six months to a row start every other row in January, and ten years to
#          a row start each row on a decade. A level with `page: period` shows one period at a time,
#          with arrows under the grid to the one before and after; without, it shows the whole run.
# zoom     the level the grid opens at, by its unit. The days, if left out.
#
# Clicking a box that stands for many days zooms in on them. Such a box shows the strongest of its
# days: lit if any of them matched, and grey only if all of them are. Bookmarks show on days alone.

# The links under a strip on its page. A link left out, or empty, is not drawn.
#
# Each is a template, filled in from the strip it is under:
#
#   daily    the day's own strip: {{strip.date}} (1986-07-07), {{strip.year}}, {{strip.month}},
#            {{strip.day}}, the last two with leading zeros
#   rerun    a day that reran an earlier strip: the same four fields for each of {{strip.original}},
#            the day it first ran, and {{strip.rerun}}, this one — {{strip.original.year}} and so on
#   special  a strip that never ran in the paper: {{strip.id}}, and the date fields of the day it is
#            filed under
details:
  daily:
    readUrl: https://www.gocomics.com/calvinandhobbes/{{strip.year}}/{{strip.month}}/{{strip.day}}
    licenseUrl: https://licensing.andrewsmcmeel.com/features/ch?date={{strip.date}}
  rerun:
    readUrl: https://www.gocomics.com/calvinandhobbes/{{strip.rerun.year}}/{{strip.rerun.month}}/{{strip.rerun.day}}
    licenseUrl: https://licensing.andrewsmcmeel.com/features/ch?date={{strip.original.date}}
  special: {}
